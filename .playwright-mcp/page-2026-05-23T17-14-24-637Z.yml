                    - generic [ref=e855]:
                      - heading "3【事業の内容】" [level=3] [ref=e856]
                      - paragraph [ref=e857]: 当社は、鶏卵の生産・販売(鶏卵事業)を主たる業務としております。
                      - paragraph [ref=e858]: 当社の最大の特徴は、多くは生産から流通会社(取引先)への販売まで、自社内で一貫して行っている点であり、流通会社と直接取引することによって消費者サイドのニーズを素早く生産に反映させることができます。
                      - paragraph [ref=e859]: また、サルモネラ菌による食中毒、鳥インフルエンザ等近年食の安全を脅かす様々な問題が発生する中、当社は、北海道内(以下道内)においては初生雛(孵化したばかりの鶏の雛)から自社にて育成、野生動物の侵入を防ぐウインドレスの鶏舎構造、サルモネラワクチンの接種、植物性飼料の使用、FSSC22000の認証を取得したGP工場(GP工場:Grading & Packing 選別・包装の略)など、食の安全を作り出す様々な取組みを常に実行し安全対策を進めてまいりました。
                      - paragraph [ref=e860]: 鶏卵販売は、多くのスーパーで取扱われるとともに、ホテル、レストラン、パン・ケーキなどの業務用にも幅広く利用されております。また、2024年2月時点での北海道の採卵鶏飼養羽数約452万羽(農林水産省の畜産統計)に対して、道内における当社の飼養羽数は2024年3月末時点で約230万羽となっており、高いシェアを占めております。
                      - paragraph [ref=e861]: 当社の事業内容の詳細は次のとおりであります。
                      - paragraph [ref=e862]: なお、当社は鶏卵事業のみの単一セグメントであるため、セグメント別の記載を省略しております。
                      - paragraph [ref=e863]
                      - paragraph [ref=e864]: 鶏卵事業
                      - paragraph [ref=e865]: 鶏卵事業については、生産業務を行う生産部、製造業務を行う製造部、販売業務を行う営業部の部門毎に事業の内容を説明いたします。
                      - paragraph [ref=e866]: 1 生産業務(生産部)
                      - paragraph [ref=e867]: 道内においては、独自の強健な清浄雛を育てるために雛専用の育成農場を早くから北海道安平町早来に設置、雛を鶏舎単位で入れ替えるオールイン・オールアウトという方法で飼育しております。道内における雛は、他社から購入した大雛(120日令前後の鶏)ではない自社育成の雛です。サルモネラ食中毒に備え、全ての雛にサルモネラワクチンを接種しております。育成農場で育成した強健な雛は札幌、登別、北見、十勝、千歳の道内自社成鶏5農場に送られ産卵をはじめます。道内の鶏舎は、窓のないウインドレス鶏舎で鳥獣の侵入を防ぎサルモネラ等の危険を効果的に防備しております。また、ウインドレス鶏舎は舎内換気、温度管理、給餌、採卵、鶏糞処理を全自動で管理し、快適な飼養環境を維持することによって、1年中安定した環境の中で安全で清浄な卵を産むとともにコストダウンにも大きく寄与しております。
                      - paragraph [ref=e868]: 道内の成鶏5農場では同一の飼料、HACCP(注)手法も取り入れた同一の飼養管理がなされており、どの農場も同一品質の鶏卵を生産しております。
                      - paragraph [ref=e869]: なお、技術部では専任の獣医、スタッフが衛生飼料、栄養学、獣医学等の観点から様々な研究を行っており、飼料は安全性を考慮して動物性蛋白質を一切含まないオリジナル植物性飼料が主流になっております。
                      - paragraph [ref=e870]: 道外においては岩手県に盛岡、はまなすの2農場、宮城県に吉目木農場の現在3農場を保有しております。道内とは異なり、雛は大雛を外部から購入しております。尚、2020年より吉目木農場にて平飼い卵の生産を、また2022年からは同農場でエビアリー卵(多段式平飼い卵)の生産を開始しましたが、ここで使用している雛は外部購入ではなく、当社育成農場で育成したものです。
                      - paragraph [ref=e871]: (注) HACCP --- Hazard Analysis Critical Control Point
                      - paragraph [ref=e872]: 食品の製造・加工工程のあらゆる段階で発生する恐れのある微生物汚染等の危害をあらかじめ分析(Hazard Analysis)し、その結果に基づいて、製造工程のどの段階でどのような対策を講じればより安全な製品を得ることができるかという重要管理点(Critical Control Point)を定め、これを連続的に監視することにより製品の安全を確保する衛生管理の手法です。
                      - paragraph [ref=e873]
                      - paragraph [ref=e874]: 2 製造業務(製造部)
                      - paragraph [ref=e875]: 道内の成鶏5農場で生産された卵はすべてFSSC22000(注)の認証を取得した5GP工場で製品化されます。道内の5GP工場は2000年~2011年にかけて、統一された設計思想に基づき、従来のGP工場を廃止し新築された工場で、同一品質の製品を製造できることが大きな特徴となっております。
                      - paragraph [ref=e876]: GP工場は多くの農場鶏舎とバーコンベアで連結されており、その日に生産されたほぼ全ての卵をその日の内に製品化しております。GP工場は、HACCPに準拠した手法を取り入れた最新鋭の工場で品質検査も全自動で行われております。2005年6月よりトレーサビリティ(卵の生産農場、製造工場の追跡が可能)の手法も導入し、卵殻に直接賞味期限とトレーサビリティ番号(ユビキタスコード)を印字し、一旦製造したパックの日付改ざんは不可能です。
                      - paragraph [ref=e877]: 2016年12月には輪厚液卵工場を新設し、翌年1月より液卵・温泉卵の製造を本格稼働しております。将来の加工品分野拡大へのファーストステップを踏み出しております。
                      - paragraph [ref=e878]: 東北においては現在3GP工場(岩手2GP、宮城1GP)が稼働しており当社の盛岡支店、仙台支店に鶏卵製品を供給する役割を担っております。これらの3GP工場の内、はまなすGP(岩手)は2017年4月に、多賀城GP(宮城)は2020年6月にFSSC22000の認証を取得しております。
                      - paragraph [ref=e879]
                      - paragraph [ref=e880]: (注) FSSC22000 --- Food Safety System Certification(食品安全認証財団)
                      - paragraph [ref=e881]: FSSC22000は、食品安全の基本である前提条件プログラム(PRP)をより具体的にするため、食品安全マネジメントシステムISO22000のPRPに関する要求事項を産業分野ごとに規定しており、フードディフェンス(Food defense=食品防御)が含まれた国際規格です。
                      - paragraph [ref=e882]
                      - paragraph [ref=e883]: 3 販売業務(営業部)
                      - paragraph [ref=e884]: 道内5つのGP工場で製造された鶏卵製品は問屋を通さず取引先に直接販売(道内直売率96%)をしており、道内取引先にGP工場から均一な品質の安全な卵を迅速にお届けしております。
                      - paragraph [ref=e885]: 当社の鶏卵の特徴は「PG卵モーニング」、「サラダ気分」、「雛の巣」などの自社ブランドのほか、安心安全の当社の品質が評価され各取引先別にプライベートブランドもOEM提供しており、消費者が求める価値(栄養素等)を付与し高価格設定が可能な特殊卵の販売比率が高いという点があげられます。
                      - paragraph [ref=e886]: また、従来東北地区での販売は問屋売りが主流でしたが、現在は当社盛岡支店・仙台支店におきまして直接地場取引先への販売を拡大しており、直接販売の比率を高めております。
                      - paragraph [ref=e887]: さらに2022年秋からはアニマルウェルフェアへの取り組みの一環として宮城県吉目木農場にてエビアリー鶏舎(多段式平飼い)で生産を開始した平飼い卵を関東、東海、東北、北海道エリアにて販売開始しております。
                      - paragraph [ref=e888]: また、2021年3月より香港市場向けに当社道産卵の輸出を開始いたしました。今後輸出数量の拡大を通じ、当社ブランドの香港市場での定着を図って参ります。
                      - paragraph [ref=e889]
