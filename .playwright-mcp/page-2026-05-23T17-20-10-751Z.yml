                      - paragraph [ref=e1095]: 当社の企業集団は、当社、子会社(ヤマウラ企画開発(株))、その他の関係会社((株)信州エンタープライズ)で構成されており、建設事業、エンジニアリング事業・開発事業等を主な内容とした事業活動を展開しております。
                      - paragraph [ref=e1096]: 当社グループの事業内容及び位置付けは次のとおりであり、「連結財務諸表注記」に掲げるセグメント情報の区分と同一であります。
