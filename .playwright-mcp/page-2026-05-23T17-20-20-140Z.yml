                      - paragraph [ref=e1147]
                      - paragraph [ref=e1148]
                      - heading "1.防食技術及びその応用技術の説明" [level=4] [ref=e1149]
                      - heading "(1) 電気防食" [level=5] [ref=e1150]
                      - heading "1 腐食現象の概要" [level=6] [ref=e1151]
                      - paragraph [ref=e1152]: 金属の表面は一見均一に見えますが、局部においてはその化学組成、組織、酸化皮膜、付着物等が異なっております。また、環境側でも含まれている各種のイオン濃度、溶存ガス濃度、温度等が異なります。これらの不均一性によって、局部的に電位の高低(陽極部と陰極部)を生じ、電池が形成されます。その結果、金属の中を電流は電位の高い方(陰極部)から低い方(陽極部)へ流れ、環境側では電位の低い方から高い方へ電流(腐食電流)が流れます。そして電位の低い部分で腐食(錆の発生)が起こります。
                      - paragraph [ref=e1153]
                      - paragraph [ref=e1155]: （画像は省略されました）
                      - paragraph [ref=e1156]: 腐食の概念図
                      - paragraph [ref=e1157]
                      - heading "2 電気防食の概要" [level=6] [ref=e1158]
                      - paragraph [ref=e1159]: 電気防食は、腐食を生じている金属表面に環境側から防食電流を流し、腐食電流を消滅させる技術であります。
                      - paragraph [ref=e1160]: 電気防食法には、防食電流を流す方式の違いにより流電陽極方式と外部電源方式があります。
                      - paragraph [ref=e1161]: 流電陽極方式は、異なる金属間の電位差による電池作用を利用して防食電流を流す方式であります。鋼材を防食する場合は、その相手としてより電位の低い金属であるアルミニウム合金(ALAP)、マグネシウム合金(MAGNAP)あるいは亜鉛合金(ZAP)を取り付けます。これらの金属は鋼材に取り付けられると陽極となり、鋼材に防食電流を流し、腐食を抑制します。
                      - paragraph [ref=e1162]
                      - paragraph [ref=e1164]: （画像は省略されました）
                      - paragraph [ref=e1165]: 流電陽極方式の概念図 港湾施設(鋼管杭)に取付けられた
                      - paragraph [ref=e1166]: アルミニウム合金陽極
                      - paragraph [ref=e1167]
                      - paragraph [ref=e1168]: 外部電源方式は、直流電源装置と難溶性の電極を使用し、防食対象物と電極の間に直流電圧をかけて防食電流を流す方式であります。電極としては磁性酸化鉄、白金めっきチタン、金属酸化物被覆電極(MMO)等が使用されます。また、直流電源装置としては、一般にシリコン整流器が使用されますが、太陽光や風力等の自然エネルギーを利用することもできます。
                      - paragraph [ref=e1169]
                      - paragraph [ref=e1170]
                      - paragraph [ref=e1172]: （画像は省略されました）
                      - paragraph [ref=e1173]: 外部電源方式の概念図 埋設管に対する外部電源方式の概念図
                      - paragraph [ref=e1174]
                      - heading "3 電気防食システム" [level=6] [ref=e1175]
                      - paragraph [ref=e1176]: 電気防食は、調査⇒設計⇒施工⇒維持管理⇒更新のサイクルで行われます。
                      - paragraph [ref=e1177]: それぞれの概要は次のとおりであります。
                      - paragraph [ref=e1178]: (調査)
                      - paragraph [ref=e1179]: 構造物が建造、埋設される環境は、海水、淡水、土壌、コンクリート中と多岐にわたっており、それぞれの環境も地域、海域等により腐食や防食条件に及ぼす影響度が異なります。このため、構造物の腐食原因の調査、また、それぞれの環境に適合した電気防食設計を行うための環境調査を行っております。
                      - paragraph [ref=e1180]: (設計)
                      - paragraph [ref=e1181]: 前記の調査結果を踏まえて、防食装置の仕様、数量、設置位置等を含め、より合理的で経済的な防食設計を行っております。
                      - paragraph [ref=e1182]: (施工)
                      - paragraph [ref=e1183]: 調査、設計によって作成された仕様書に基づき施工計画書を作成し、これをもとに施工しております。
                      - paragraph [ref=e1184]: 当社の主力工事である港湾施設(岸壁、桟橋等)の電気防食工事の場合、その大部分がアルミニウム合金陽極(ALAP)の取付工事であり、鋼矢板や鋼管杭の所定の位置に陽極を水中溶接にて取り付けております。
                      - paragraph [ref=e1185]: 完成後は、防食対象物の電位を測定して防食状態を確認します。
                      - paragraph [ref=e1187]: （画像は省略されました）
                      - paragraph [ref=e1188]: 港湾施設のアルミニウム合金陽極取付け概要図
                      - paragraph [ref=e1189]
                      - paragraph [ref=e1190]: (維持管理)
                      - paragraph [ref=e1191]: 電気防食装置の耐用年数は、10年から30年の場合が大半ですが、港湾施設に取り付けられるアルミニウム合金陽極は、50年、100年という長期耐用の製品もあります。
                      - paragraph [ref=e1192]: 港湾施設の電気防食でアルミニウム合金陽極を取り付けた場合、防食状態が維持されているかを確認するため、防食対象物の電位を測定しております。また、耐用期限の2~3年前から陽極の実際の消耗状態を調査することも行われます。
                      - paragraph [ref=e1193]: ガス、石油、水道等の埋設管は、周辺の土壌環境の変化、他の埋設管の電気防食装置あるいは電車の軌道からの洩れ電流の影響等により電気防食施工当初と条件が異なる場合があり、当初の電気防食装置では防食状態が維持できない状態になることもあるので、定期的に電気防食装置の維持管理を行う必要があります。
                      - paragraph [ref=e1194]: 維持管理の方法には、電話回線を利用した遠隔監視制御装置を電気防食装置に取り付け、電位測定や直流電源装置の制御を行う方法もあります。
                      - paragraph [ref=e1195]: (更新)
                      - paragraph [ref=e1196]: 電気防食装置の所定の耐用年数が経過し、継続して防食対象施設の腐食防止を図る場合には、維持管理の結果をもとに、電気防食装置の取替えや更新工事を行っております。
                      - paragraph [ref=e1197]
                      - heading "(2) 被覆防食" [level=5] [ref=e1198]
                      - paragraph [ref=e1199]: 被覆防食は、防食対象物を腐食環境から遮断する防食方法であります。岸壁、桟橋、護岸、橋脚等の鋼材の飛沫帯及び干満帯部分を防食テープ等の防食材及びFRPやチタン、ステンレス等の保護カバーで覆って防食します。
                      - paragraph [ref=e1200]: 当社では近年の環境問題の高まりを考慮して、無溶出性の特殊樹脂を防食層とした被覆防食工法を開発しております。
                      - paragraph [ref=e1202]: （画像は省略されました）
                      - paragraph [ref=e1203]: 防食テープによる被覆防食工法 特殊樹脂による被覆防食工法
                      - paragraph [ref=e1204]
                      - heading "(3) 塗装防食" [level=5] [ref=e1205]
                      - paragraph [ref=e1206]: 塗装防食も防食対象物を腐食環境から遮断する防食方法であります。石油タンクの外板、岸壁・桟橋、橋梁等に使用されている鋼材の腐食を特殊な塗料によって防食します。
                      - paragraph [ref=e1207]
                      - heading "(4) 電解鉄イオン供給" [level=5] [ref=e1208]
                      - paragraph [ref=e1209]: 海水を冷却水として使用する復水器や熱交換器において、冷却水中に電解した鉄イオンを供給し、銅合金製の管板や冷却管内面に鉄皮膜を形成させて防食します。
                      - paragraph [ref=e1210]: 移動式槽型鉄イオン供給装置は、トラックの荷台上に鉄電極を組み込んだ電解槽と直流電源装置を設置し、必要に応じて鉄イオンの供給を行うことが可能な装置であります。
                      - paragraph [ref=e1211]
                      - heading "(5) 防汚(海生生物付着防止技術)" [level=5] [ref=e1212]
                      - paragraph [ref=e1213]: 臨海地帯に建設されている発電所の取水路、スクリーン、熱交換器内面においては、海水との接水面でフジツボやイガイ等の海生生物が付着し、装置の機能障害が生じる場合があります。
                      - paragraph [ref=e1214]: 当社の防汚技術は、電気化学理論を利用した方法であり、対象物の表面に触媒と一体化したチタンシートを貼り付け、表面から微弱な電流を流すことにより海生生物の付着を防止させるものであります。
                      - paragraph [ref=e1215]
                      - heading "2.新技術『鉄筋コンクリート構造物の電気防食』" [level=4] [ref=e1216]
                      - paragraph [ref=e1217]: コンクリート中の鉄筋は、通常はコンクリートの強いアルカリ性により表面に不動態皮膜という保護膜を作りサビることはありません。しかし、飛来塩分や凍結防止剤などが構造物に降りかかり、コンクリート中の塩化物イオンが一定量以上になると不動態皮膜が破壊され、鉄筋は腐食が進行しサビを形成します。このサビがコンクリートを押し広げ、ひび割れや剥離などを生じさせます。
                      - paragraph [ref=e1218]: コンクリート中鉄筋の腐食についても電気防食で防止することができます。今までに多くの構造物で実施されてきたリボンメッシュ方式は、リボン状のチタン製帯状陽極を溝切りしたコンクリートの中に埋め込み、直流電源装置を使用して鉄筋に防食電流を供給します。
                      - paragraph [ref=e1219]: 当社とオリエンタル白石(株)殿と共同で開発した「TCユニット」方式は、白金系酸化物被覆したチタン製ラス材陽極をイオン伝導性に優れる充填材に包み込み、保護カバーに納めた陽極ユニットをコンクリート表面に線状に配置し、直流電源装置を使用して鉄筋に防食電流を供給する外部電源法による電気防食工法であります。特徴は陽極をユニット化したため、施工が容易で躯体コンクリートを傷めずに陽極ユニットの設置が可能となります。
                      - paragraph [ref=e1220]
                      - paragraph [ref=e1222]: （画像は省略されました）
                      - paragraph [ref=e1223]
                      - paragraph [ref=e1224]: TCユニット方式によるコンクリート構造物の電気防食
