                      - heading "3 【事業の内容】" [level=3] [ref=e1064]
                      - paragraph [ref=e1065]: 当事業年度末における当社グループは、当社及びその他の関係会社(三井金属鉱業株式会社)1社の2社より構成されております。
                      - paragraph [ref=e1066]: 当社は、1951年の創業以来、防食のリーディングカンパニーとして歩み続けてまいりました。当社のパーパスは「ひたむきに防食技術を追求し、社会基盤の価値をまもり続けることにより、安全安心な日常を次代につなげます」であり、「いまある“価値”を次代へ!」をスローガンに、インフラ施設の長寿命化を図るための防食技術を提供することにより、持続可能な社会の実現に貢献することを使命としております。そのために、各種環境に曝されている構造物の腐食・劣化調査と解析・評価を行い、その結果に基づいた腐食対策の提案、防食設計、対策工事そして維持管理という総合的な防食システムの提供(以下「工事」)を主たる業務としております。また、防食関連材料や装置の製造・販売(以下「製品等販売」)も行っております。
                      - paragraph [ref=e1067]: 当社は建設業法に則り、特定建設業許可のもとに、事業を行っております。
                      - paragraph [ref=e1068]: 事業の活動組織は、事業本部のもと国内に製造調達統括部、支店、営業所を配置し、地域顧客に密着した様々な商品・サービスを提供できる体制としております。営業本部は将来に向けたマーケティングと新規事業の育成を担い、技術本部が新技術・新商品の開発や、それらの現場への適用促進を行っております。
                      - paragraph [ref=e1069]: 事業区分としましては、対象施設別に港湾事業、地中事業、陸上事業、その他に区分しており、当該事業区分は、セグメント情報における区分と同一であります。
                      - paragraph [ref=e1070]: それぞれの事業区分において、電気防食、被覆防食、塗装防食の技術の中から環境及び対象施設に適した工法を選定し、工事及び製品等販売を行っております。また、電気防食技術を応用して冷却管の内面を防食する電解鉄イオン供給、海生生物の付着を防止する防汚の工事及び製品等販売も行っております。
