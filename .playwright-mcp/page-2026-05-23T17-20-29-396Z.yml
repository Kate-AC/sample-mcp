                      - paragraph [ref=e858]
                      - heading "〔設備工事業〕" [level=4] [ref=e859]
                      - heading "・当社は電気工事、電気通信工事、管工事、水道施設工事、消防施設工事、土木工事を請負施工している。なお、配電設備等の電力供給設備に係わる電気工事は、当社の親会社である北陸電力(株)を中心とする北陸電力グループから請負施工している。" [level=5] [ref=e860]
