                      - paragraph [ref=e1008]
                      - heading "3 【事業の内容】" [level=3] [ref=e1009]
                      - paragraph [ref=e1010]: 当社グループは、情報サービスを主たる事業とし、情報システムに係るコンサルティングから、業務システムの開発と保守及びITインフラの構築と運用管理に至る一貫したサービスを提供しています。
                      - paragraph [ref=e1011]: 当社グループの事業内容を、セグメント別に表すと次のとおりです。
                      - paragraph [ref=e1012]
                      - heading "(1) システム開発" [level=4] [ref=e1013]
                      - paragraph [ref=e1014]: 半導体、エレクトロニクス、金融、情報通信、エンタテインメント、公共・社会、移動・物流、ヘルスケア・メディカルの業種の顧客に対して、ERP、SCM、CRM、MES(Manufacturing Execution System:製造実行システム)、PLM(ProductLifecycle Management:製品ライフサイクル管理)、ビッグデータ分析等のソリューション及び業務システムのコンサルティングから要件定義、設計、開発、保守に至る一連のシステム開発サービスを提供しています。
                      - paragraph [ref=e1015]
                      - heading "(2) インフラサービス" [level=4] [ref=e1016]
                      - paragraph [ref=e1017]: クラウド、ネットワーク、クライアント(PC、スマホ、IoT機器)、セキュリティに関するITインフラソリューションから設計、構築、保守、運用に至る一連のインフラサービスを提供しています。
                      - paragraph [ref=e1018]
                      - heading "(3) その他" [level=4] [ref=e1019]
                      - paragraph [ref=e1020]: 商品販売業務などを行っています。
                      - paragraph [ref=e1021]
                      - paragraph [ref=e1022]: (注) 「その他」としたセグメントに関しては、「セグメント情報等の開示に関する会計基準」(企業会計基準第17号 平成22年6月30日)及び「セグメント情報等の開示に関する会計基準の適用指針」(企業会計基準適用指針第20号 平成20年3月21日)適用の報告セグメントには含まれない事業セグメントとなっています。
