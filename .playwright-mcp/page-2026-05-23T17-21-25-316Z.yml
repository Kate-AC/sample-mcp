                    - generic [ref=e847]:
                      - heading "3【事業の内容】" [level=3] [ref=e848]
                      - paragraph [ref=e849]: 当社グループ(当社及び子会社3社(2025年3月31日現在)により構成)においては、ITを用いて顧客のビジネスモデルの変革を促し、経営環境の急速な変化への対応を支援するシステムソリューション・サービスを事業としております。
                      - paragraph [ref=e850]: 当社グループはシステムソリューション・サービスの単一事業であるため、事業領域を品目別に区分記載しております。顧客の情報化サイクルに応じて「システムインテグレーション・サービス」「システムアウトソーシング・サービス」「プロフェッショナル・サービス」の3つの品目別に区分しております。
                      - paragraph [ref=e851]: 〔システムソリューション・サービス〕
                      - paragraph [ref=e852]
                      - paragraph [ref=e853]: （画像は省略されました）
                      - paragraph
                      - paragraph [ref=e854]
                      - paragraph [ref=e855]: 加えて、当社事業の特徴をより的確に示すため、3つのビジネスモデルについてご説明いたします。
                      - paragraph [ref=e856]
                      - paragraph [ref=e857]:
                        - text: ・デジタルビジネス
                        - text: デジタル技術を活用した当社発の企画型ビジネスです。当社のノウハウを結集したコンサルティングサービス、 自社プロダクト、当社発のソリューション、IP(知的財産)化などのアプローチによって新たな事業創出を目指し ます。そしてDXを通じて、お客様のビジネス変革を支援いたします。
                      - paragraph [ref=e858]
                      - paragraph [ref=e859]:
                        - text: ・SIビジネス
                        - text: システムの企画から、設計、開発、導入までを行うサービスです。マルチクラウド・マイクロサービス案件を軸 としたシステムの提供と新しい運用モデルへの変革をテーマにレガシー環境のクラウド環境への移行(Lift)と新 たな方法論の確率(Shift)による、Lift&Shiftモデルを確立してまいります。
                      - paragraph [ref=e860]
                      - paragraph [ref=e861]:
                        - text: ・エンハンスビジネス
                        - text: お客様のビジネス環境の変化や新たな技術の進化に合わせて、システムの性能や品質を向上させ、システムの価 値を高めるサービスで、当社がもっとも強みとしてきたビジネスモデルです。これまでも進めてきた高生産性、高 収益性の実現に向けた取り組みを一層加速してまいります。
