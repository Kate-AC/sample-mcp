                    - generic [ref=e1096]:
                      - paragraph [ref=e1097]
                      - heading "3 【事業の内容】" [level=3] [ref=e1098]
                      - paragraph [ref=e1099]: 当社グループは、当社(株式会社アクシーズ)、連結子会社7社及び関連会社1社により構成されており、一般消費者に、日常の生活に必要な鶏肉を提供することを主たる業務としております。
                      - paragraph [ref=e1100]: この円滑な遂行のため、当社グループでは、安全性が高く、消費者のニーズに適合した鶏肉を安定的、継続的に供給する観点に立ち、飼料製造から種鶏飼育、雛生産、ブロイラー飼育、鶏肉加工、鶏肉加工食品製造及び外食まで、グループ内での一貫した事業運営体制により、鶏肉製造販売、加工食品製造販売、外食の各事業を行うインテグレーションを構築しております。
                      - paragraph [ref=e1101]
                      - paragraph [ref=e1103]: （画像は省略されました）
                      - paragraph [ref=e1104]
                      - paragraph [ref=e1105]: 各事業の内容については、次のとおりであります。
                      - paragraph [ref=e1106]: なお、当該事業の区分は、「第5 経理の状況 1.連結財務諸表等 (1) 連結財務諸表 注記事項」に掲げるセグメントの区分と同一であります。
                      - paragraph [ref=e1107]
                      - heading "(1) 食品" [level=4] [ref=e1108]
                      - paragraph [ref=e1109]: 1 当セグメントにおきましては、当社グループの食品に対する安全、安心にこだわった健康な鶏を飼育するという基本的な考え方から、直営の肥育施設で飼育されたブロイラーによる鶏肉を製造販売しております。
                      - paragraph [ref=e1110]: 当該事業は、当社グループの全事業のベースとなるものであり、今後も積極的に拡大を図る事業と位置付けております。なお、当該セグメントにおける特徴は次のとおりであります。
                      - paragraph [ref=e1111]
                      - heading "a.無投薬飼育の実現" [level=6] [ref=e1112]
                      - paragraph [ref=e1113]: 当社グループが独自に開発した鶏舎環境制御技術による鶏舎内環境の自動管理及び当社グループ内において製造している安全性の高い飼料の使用等により、無投薬飼育を実現しております。
                      - paragraph [ref=e1114]
                      - heading "b.直営肥育施設による飼育" [level=6] [ref=e1115]
                      - paragraph [ref=e1116]: 当社グループは、安全性の観点から直営肥育施設での鶏の飼育を基本としており、委託肥育施設から直営肥育施設への転換を実施しております。現在、全ての肥育施設が直営肥育施設となっております。
                      - paragraph [ref=e1117]
                      - paragraph [ref=e1118]
                      - heading "c.加工食品" [level=6] [ref=e1119]
                      - paragraph [ref=e1120]: 当社グループで製造された鶏肉を原料として、唐揚、レバー煮込み、チキンナゲット等の鶏肉加工食品を製造販売しております。加工食品の品質はその原料の鮮度等に大きく左右されることから、当社グループの加工食品は、当社グループで製造した新鮮な鶏肉をその日のうちに加工し製造販売しております。新鮮でおいしい加工食品を消費者の皆様にお届けしております。
                      - paragraph [ref=e1121]: 当該事業は、鶏肉製造販売とのシナジー効果が発揮できる事業であることから、今後も積極的に拡大を図る事業と位置付けております。
                      - paragraph [ref=e1122]
                      - heading "d.その他" [level=6] [ref=e1123]
                      - paragraph [ref=e1124]: 鹿児島に産出する「ゼオライト原石」を原料としたゼオライト製品、「シラス土壌」を原料としたシラスバルーンの製造販売を行っております。
                      - paragraph [ref=e1125]
                      - heading "e.リサイクルの実施" [level=6] [ref=e1126]
                      - paragraph [ref=e1127]: 当社グループは、鶏肉加工過程で発生する骨、羽根、血液等の不可食部位につきましては、当社グループのレンダリングプラントで加工し、飼料原料及び肥料原料として再利用しており、環境問題に配慮しております。また、鶏の飼育段階に産出される鶏の排泄物を持分法適用関連会社の有限会社南九州バイオマスへエネルギー原料として供給し、発生した電気や蒸気は当社の食品工場等で利用され、余剰電力は電力会社に売電されております。また、燃焼後の灰はリンとカリウムが豊富な肥料原料として利用され土壌に還ることから、循環型社会を構築することができ、環境保全の一翼を担っています。
                      - paragraph [ref=e1128]
                      - paragraph [ref=e1129]: (当社及び主な関係会社)当社、株式会社アクシーズケミカル及び錦江湾飼料株式会社
                      - paragraph [ref=e1130]
                      - heading "(2) 外食" [level=4] [ref=e1131]
                      - paragraph [ref=e1132]: 当セグメントにおきましては、日本ケンタッキー・フライド・チキン株式会社のフランチャイズ店舗(ケンタッキーフライドチキン)を経営しております。
                      - paragraph [ref=e1133]
                      - paragraph [ref=e1134]: (関係会社)株式会社アクシーズフーズ
                      - paragraph [ref=e1135]
                      - heading "(3) エネルギー" [level=4] [ref=e1136]
                      - paragraph [ref=e1137]: 当セグメントにおきましては、再生可能エネルギーの供給を行っております。
