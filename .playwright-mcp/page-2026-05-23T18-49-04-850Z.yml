                  - generic [ref=e864]:
                    - generic [ref=e865] [cursor=pointer]: 続きを読む
                    - generic [ref=e866]:
                      - heading "3【事業の内容】" [level=3] [ref=e867]
                      - paragraph [ref=e868]: 当社グループは、当社、連結子会社1社、持分法適用関連会社1社及びその他の関係会社1社で構成されており、造園緑化工事の設計・施工・メンテナンスを主たる業務としております。
                      - paragraph [ref=e869]: 当社グループでは、「街や暮らしに潤いを与える緑空間の創造」をコンセプトに掲げ、1927年の当社創業以来、蓄積したノウハウや造園技法の伝承に努めるとともに、人と自然とが共生でき、エコや地球環境や時代の変化に対応できるような技術開発に取り組み、事業を展開しております。
                      - paragraph [ref=e870]: 当社グループの事業は、造園緑化事業の単一セグメントでありますが、対象とする物件により「ガーデンエクステリア」と「ランドスケープ」に区分しております。
                      - paragraph [ref=e871]: (1)ガーデンエクステリア
                      - paragraph [ref=e872]: 「ガーデンエクステリア」は、ガーデン(庭)とエクステリア(外構)を組み合わせたものであります。当社グループでは、住宅の周辺環境を総称してエクステリアと位置付け、庭園(ガーデン)のテイストをより多く盛り込んだ「ガーデン+エクステリア」の設計・施工を通じて、顧客の家庭での暮らしが緑に溢れ、より豊かなものになるよう設計・施工に努めております。既製品を組み合わせた定型的なエクステリアではなく、樹木や天然石を多用し、個々の緑豊かなガーデンエクステリアが集まり、美しい街並みを形成することをコンセプトに設計や施工を行っております。
                      - paragraph [ref=e873]: なお、対象となる物件は、付加価値の高い戸建住宅・集合住宅の景観構築、住宅メーカーとの協働による新規の住宅分譲地での設計・施工、一般顧客向けの「パインズ」でのショールーム展開等によるものであります。
                      - paragraph [ref=e874]: 1 戸建住宅・集合住宅の景観構築
                      - paragraph [ref=e875]: 当社グループが手掛ける戸建住宅や集合住宅(アパート等)の外構造園は、主に住宅メーカーが受注した新築案件の門・塀・庭園など、建物周辺の景観構築に関して設計・施工を行っております。同業他社にとって難易度が高い富裕層向けの高級案件の依頼も多く、素材には樹木や天然石などを多く取り入れ、付加価値の高い外構造園を提供しております。
                      - paragraph [ref=e876]: 2 住宅分譲地での設計・施工
                      - paragraph [ref=e877]: 住宅メーカーや不動産デベロッパー等とともに、大型分譲地の計画段階から携わっております。住宅の敷地や道路の配置、そして全体に繋がりのある緑地や公園等を総合的に計画することで、全体が統一された美しい分譲地となります。また、個々の住宅のガーデンエクステリアは、当社グループが指定業者として全棟を任されることが多く、顧客ごとの要望を満たしながら、分譲地全体の樹木や石材等素材の連続性を保つことが可能となります。なお、10から20区画の小規模分譲地については、当社が分譲用の土地を取得し、住宅メーカーと協働して同様の計画、販売及び施工を行うこともあります。
                      - paragraph [ref=e878]: 3 「パインズ」でのショールーム展開
                      - paragraph [ref=e879]: 「パインズ」は、一般顧客向けのガーデンエクステリアショールームとして、東海地方に2店舗を展開しております。主にホームページや地域タウン誌をはじめ、既存顧客や住宅メーカーの紹介により集客しております。当社グループでは、全てオーダーメイドにて提案し、顧客の思いの実現に繋げております。また、顧客が完成後のイメージを視覚的に認識できる様、素材やデザインの提示は主にデジタルコンテンツによって行っております。施工では当社グループの監督・指揮の下、自社及び専属の協力会社にて行っております。定期的な現場への巡回や協力会社を交えた勉強会を実施し、品質と安全の向上に努めております。
                      - paragraph [ref=e880]: その他の受注活動として、引渡し後の顧客への定期訪問や、樹木の剪定等のアフターメンテナンスを通じ、リガーデン(ガーデンエクステリアのリフォーム)の受注に繋げております。
                      - paragraph [ref=e881]
                      - paragraph [ref=e882]: (2)ランドスケープ
                      - paragraph [ref=e883]: 不特定多数の人が訪れるパブリックスペース(景観を構成する諸要素のことや、景観そのものを意味します。)に、樹木の緑あふれる憩いの空間を創り出しております。当社グループは、造園技法を用いた、主に緑化によるランドスケープの構築を行っており、樹木や石材を使った伝統的な造園工事から、建物の屋上や壁面を緑で覆う屋上・壁面緑化工事、生き物との共生を目的としたビオトープ(※)工事、大手ショッピングモールが取り組んでいる森づくりによる環境再生に配慮した工事など多岐に亘っております。
                      - paragraph [ref=e884]: なお、対象となる物件は、公共工事、民間工事、また、工事施工後の緑地メンテナンスや公共公園の指定管理事業によるものであります。
                      - paragraph [ref=e885]: 1 公共工事
                      - paragraph [ref=e886]: 官公庁(国土交通省、地方自治体等)が発注する物件であり、庁舎等の施設、都市公園、街路、公立学校等の施工・整備に係る造園緑化工事を行っております。受注の形態としては、官公庁が発注する工事における競争入札によるものと、大手建設会社や地元建設会社が受注した工事の造園緑化工事部分を協力会社として請け負うものがあります。いずれも、官公庁が定めた仕様に従い施工を行いますが、施工技術、品質、安全管理、提案力などが受注に際してのポイントとなります。
                      - paragraph [ref=e887]: 2 民間工事
                      - paragraph [ref=e888]: 民間企業が発注する物件であり、商業施設、工場、リゾートホテル、ゴルフ場、飲食店、ショッピングモール、温浴施設、住宅マンション、私立学校、病院、老人介護施設等の施工・整備に係る造園緑化工事を行っております。受注の形態としては、民間企業より直接受注するものと、大手建設会社や地元建設会社が受注した工事の造園緑化工事を協力会社として請け負うものがあります。公共工事と同様、施工技術、品質、安全管理、提案力などが受注に際してのポイントとなります。
                      - paragraph [ref=e889]: 3 緑地メンテナンス
                      - paragraph [ref=e890]: 官公庁からの委託を受け、公園や公共施設等の緑地のメンテナンスを行っております。主な内容としては、樹木の剪定、施肥、病害虫駆除、草花の植え替えなどがあります。また、歴史的価値のある樹木の保存や、病気に侵された樹木の治療なども行っております。
                      - paragraph [ref=e891]: 4 公共公園の指定管理事業
                      - paragraph [ref=e892]: 官公庁からの委託を受け、指定管理者として市営公園全体の運営・管理を行っております。現在、岐阜市内6か所の公園の指定管理者となっており、来園者の誘導、イベントの企画・運営、売店の営業、遊具等のメンテナンス、サッカー場やテニスコート等運動場の整備、そして緑地のメンテナンスなど、市民の憩いの場所となるような公園運営に努めております。
                      - paragraph [ref=e893]: (※)ビオトープ
                      - paragraph [ref=e894]: 生命(バイオbio)と場所(トポスtopos)の合成語で生物の生息空間のこと。
