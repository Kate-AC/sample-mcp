                      - heading "3 【事業の内容】" [level=3] [ref=e823]
                      - paragraph [ref=e824]: 当社は、建築構造物の解体工事及びそれに付随する各種工事の施工管理を行っております。長年にわたる建築構造物の解体工事を通じて得られた経験と、その間に蓄積したノウハウやアイデアを基に、現況調査、工法の提案、設計、施工計画、外注・資機材手配、施工管理、安全管理、原価管理、資金管理、行政対応、近隣対応等の業務全般を提供しております。また、建物構造物解体工事に関連する土木工事、山留工事、基礎解体工事、杭抜き工事等の施工管理も行っております。その他、工事に伴い発生する、アスベスト、PCB((注)1)、ダイオキシン等の有害汚染物質の除去、地下水の浄化、土壌改良等に関しましても、豊富な経験を有しており、関連法令・法規を遵守した、コスト・工期・安全性に優れた、様々な解体工事をワンストップで提案・提供しております。当社は工事の施工管理、安全管理、近隣対応等を行い、協力会社を指導、監督して解体工事等の施工を行っております。
                      - paragraph [ref=e825]: なお、当社の事業セグメントは、「解体事業」の単一セグメントであります。
                      - paragraph [ref=e826]
                      - paragraph [ref=e827]: (注)1.PCB(Poly Chlorinated Biphenyl):ポリ塩化ビフェニルの略称で、旧式の電気機器に絶縁油等として使用された毒性の高い化学物質
                      - paragraph [ref=e828]
                      - paragraph [ref=e829]: なお、当社の主要な事業系統図は次のとおりであります。
