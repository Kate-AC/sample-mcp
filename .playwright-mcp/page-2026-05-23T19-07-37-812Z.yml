                      - paragraph [ref=e845]: (1)アウトソーシング事業
                      - paragraph [ref=e846]: 当社は、大手メーカーを中心とした顧客企業に対して、その開発パートナーとして技術、設計、開発部門等での機械設計、電子設計、ソフト開発の技術サービスを提供するアウトソーシング事業を展開しております。当社の提供するサービスは、従業員である技術者が担っており、顧客企業内で行われる設計・開発業務への派遣、または顧客から設計・開発等の業務を請負うことにより技術力を提供しております。
