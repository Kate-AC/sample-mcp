                      - heading "3 【事業の内容】" [level=3] [ref=e1035]
                      - paragraph [ref=e1036]: 当社グループは2025年8月31日現在、当社及び連結子会社の株式会社ブレインズ・カンパニー、株式会社旭エージェンシー、プラップコンサルティング株式会社、株式会社トランスコネクト、プラップノード株式会社、株式会社プレシジョンマーケティング、北京普楽普公共関係顧問有限公司、北京博瑞九如公共関係顧問有限公司、PRAP ASIA PTE.LTD.、PRAP POINTS Singapore PTE. LTD.、POINTS CREATIVE COMPANY LIMITED、 株 式 会 社 ポ イ ン ツ ジ ャ パ ン、WILDADVERTISING & MARKETING PTE.LTD.の計13社で構成されております。
                      - paragraph [ref=e1037]
                      - paragraph [ref=e1038]: 当社グループの事業セグメントは、これまでコミュニケーションサービス事業とデジタルソリューション事業の2区分としていたセグメントを当連結会計年度より海外事業を加えた3区分に変更しました。
                      - paragraph [ref=e1039]
                      - paragraph [ref=e1040]: 当社が創業以来サービス提供しているPRコンサルティングを軸に、デジタルサービスを含め、グループ各社が有する様々なコミュニケーションサービスを、包括的な視点から有機的に結びつけ、クライアントのコミュニケーション活動に関わる課題を解決しております。当社グループでは、クライアントの社会的価値を高めるPR発想のコミュニケーションサービス事業を展開しております。
                      - paragraph [ref=e1041]: PRとは、Public Relationsの略で、企業や団体が社会との良好な関係を構築するための活動を意味します。社会や生活者が抱える課題に、クライアントの事業やサービスがどのように貢献できるのかを語り、これからの世の中や日々の生活に欠かせない存在として共感を得るコミュニケーション活動です。
                      - paragraph [ref=e1042]: メディア(新聞・雑誌・テレビ・ラジオ・WEB媒体)等との関係性を構築するメディアリレーション活動や、それらの媒体を通じて情報をステークホルダーへ伝えるパブリシティ活動といった伝統的なPR活動に加え、デジタルを活用した新たなサービスを拡充しております。
                      - paragraph [ref=e1043]: デジタルソリューション事業では、デジタル広告やソーシャルメディアの運用から、動画・バナー・WEBサイト制作などのクリエイティブ業務まで、デジタルプロモーションに関するサービスをグループ内で提供可能です。海外事業では、多言語対応可能な外国籍スタッフを含む専門チームが中華圏・東南アジアを中心にインバウンド・アウトバウンドマーケティングを支援し、現地の文化・言語・メディア事情に基づいた効果的な施策を展開します。
                      - paragraph [ref=e1044]: 当社グループでは、PR発想で開発したストーリーを、グループ各社が有する専門性を活かし、様々なサービス・手法を組み合わせて、総合的なコミュニケーション・コンサルティングを提供しております。
