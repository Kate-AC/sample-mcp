                      - heading "3【事業の内容】" [level=3] [ref=e1019]
                      - paragraph [ref=e1020]: 当社グループは、当社(純粋持株会社)及び子会社15社により構成されており、主として人材派遣を中心とした人材サービス関連事業を展開しております。
                      - paragraph [ref=e1021]
                      - paragraph [ref=e1022]: 1 人材サービス事業(人材派遣・人材紹介等)
                      - paragraph [ref=e1023]: 人材派遣とは、当社グループが雇用する社員を顧客に派遣し、顧客の業務を支援するサービスであります。当社グループより顧客に派遣される社員は、顧客の指揮命令に従って業務を行います。本事業は、「労働者派遣事業の適正な運営の確保及び派遣労働者の保護等に関する法律」(以下、「労働者派遣法」といいます。)の適用を受けます。
                      - paragraph [ref=e1024]: 人材派遣には、「登録型派遣」と「常用雇用型派遣(正社員型派遣)」があります。「登録型派遣」は、当社グループに登録している求職者を有期雇用した上で派遣し、「常用雇用型派遣(正社員型派遣)」は、当社グループが正社員として雇用している社員を派遣します。
                      - paragraph [ref=e1025]: また、人材紹介とは、当社グループに登録する求職者を顧客に紹介することで、顧客の採用活動を支援するサービスであります。本事業は、「職業安定法」の適用を受けます。
                      - paragraph [ref=e1026]: 当社グループの人材サービス事業は、大きく以下3つの分野を扱っております。
                      - paragraph [ref=e1027]: (理学系研究職)
                      - paragraph [ref=e1028]: バイオ系(遺伝子、微生物、酵素、免疫、細胞、薬理、動物実験等)および化学系(有機合成、材料・素材、
                      - paragraph [ref=e1029]: 分析・解析等)の分野における専門的な能力、経験を有する人材を派遣および紹介しております。主な顧客は、製薬・食品・化学等の製造業における研究開発部門・品質管理部門および、公的機関・大学の研究室であります。
                      - paragraph [ref=e1030]: (工学系技術職)
                      - paragraph [ref=e1031]: 金型設計、部品設計、2次元・3次元CAD、流体力学、熱力学、発電、ソフトウエア設計・開発、土木・建築等の分野における専門的な能力、経験を有する人材を派遣および紹介しております。主な顧客は、電気・電子・精密機械等の製造業における機械設計部門、電気・電子機器設計部門、ソフトウエア開発部門、検査部門であります。
                      - paragraph [ref=e1032]: (一般事務職)
                      - paragraph [ref=e1033]: 事務用機器操作、通訳、秘書、ファイリング、経理、取引文書作成、受付、OAインストラクター、テレマーケティング等の経験を有する人材を、様々な業種の企業へ派遣および紹介しております。
                      - paragraph [ref=e1034]
                      - paragraph [ref=e1035]: 2 CRO事業
                      - paragraph [ref=e1036]: 主に医薬品メーカー、医療機器メーカーを対象とし、医薬品・医薬部外品・化粧品・医療機器等の開発業務の代行・支援を行っております。国内では安全性情報管理の分野を中心に事業を行っており、海外では開発業務全般を扱っております。
                      - paragraph [ref=e1037]
