                      - heading "3【事業の内容】" [level=3] [ref=e1095]
                      - paragraph [ref=e1096]: 当社グループは、当社、連結子会社5社及び関連会社1社により構成されており、翻訳サービスを主たる業務としております。
                      - paragraph [ref=e1097]: 当社グループの事業内容及び当社と子会社及び関連会社の当該事業に係る位置付けは次のとおりであります。
                      - paragraph [ref=e1098]: また、次に掲げる事業は「第5 経理の状況 1 連結財務諸表等 (1)連結財務諸表 注記事項」に掲げるセグメントの区分と同一であります。
                      - paragraph [ref=e1099]: なお、従来報告セグメントとして開示しておりました「コンベンション事業」は、量的な重要性が低下したため、報告セグメントから除外し、「その他」として記載する方法に変更しております。
                      - paragraph [ref=e1100]
                      - paragraph [ref=e1101]: 1.翻訳事業
                      - paragraph [ref=e1102]: 当社、株式会社メディア総合研究所、株式会社パナシア及び株式会社福山産業翻訳センターがサービスを提供しております。なお、分野ごとの事業内容は以下のとおりであります。
                      - paragraph [ref=e1103]: (1) 特許分野
                      - paragraph [ref=e1104]: 主に、特許事務所及び各種メーカーの知的財産関連部署を顧客とした電気、電子、機械、自動車、半導体、情報通信、化学、医薬、バイオ分野における外国出願並びに日本出願等に伴う特許出願明細書、優先権証明、中間処理、特許公報等の翻訳。
                      - paragraph [ref=e1105]: (2) 医薬分野
                      - paragraph [ref=e1106]: 主に、製薬会社を顧客とした新薬等医薬品開発段階での試験実施計画書、試験報告書、医薬品の市販後の副作用症例報告、学術論文及び医薬品・医療機器類の導入や導出に伴う厚生労働省、FDA(注1)等への申請関連資料等の翻訳、医療機器メーカーを顧客としたマニュアルの翻訳、化学品や農薬関連文書の翻訳と翻訳済原稿のチェック及びDTP(注2)編集による版下作成、印刷業務。臨床試験関連文書(CSR、CTD等)の作成業務。
                      - paragraph [ref=e1107]: (3) 工業・ローカライゼーション分野
                      - paragraph [ref=e1108]: 主に、自動車、電気機器、機械、半導体、情報通信関連の輸出・輸入メーカーを顧客とした技術仕様書、規格書、取扱説明書、品質管理関連資料の翻訳、ソフトウェア製品やメディアコンテンツ類のローカライズ(注3)と翻訳済原稿のチェック及びDTP編集による版下作成、印刷業務。機械翻訳や翻訳支援ツールをはじめとする各種ツールの販売・導入・運用支援業務。
                      - paragraph [ref=e1109]: (4) 金融・法務分野
                      - paragraph [ref=e1110]: 主に、銀行・証券会社・保険会社等金融機関を顧客とした市場分析レポート、企業業績・財務分析関連資料、運用報告関連資料、マーケティング関連資料、各種報告書等の翻訳、各種メーカー等を顧客とした株主総会招集通知やアニュアルレポート、有価証券報告書等のディスクロージャー関連資料や法律関連文書、人事労務に関する各種規程類の翻訳と翻訳済原稿のチェック及びDTP編集による版下作成、印刷業務。
                      - paragraph [ref=e1111]: 2.派遣事業
                      - paragraph [ref=e1112]: 株式会社アイ・エス・エスがサービスを提供しております。
                      - paragraph [ref=e1113]: 主な事業内容として、顧客企業内において機密保持上、社外に持ち出せない文書類等の翻訳業務を行う翻訳者派遣や顧客企業内で通訳業務に従事する通訳者派遣を行っております。
                      - paragraph [ref=e1114]: 3.通訳事業
                      - paragraph [ref=e1115]: 株式会社アイ・エス・エスがサービスを提供しております。
                      - paragraph [ref=e1116]: 主な事業内容として、企業内で行われる会議や中小規模の国際会議における通訳業務を行っております。
                      - paragraph [ref=e1117]: 4.その他
                      - paragraph [ref=e1118]: 当社、株式会社アイ・エス・エス及び株式会社FIPASがサービスを提供しております。
                      - paragraph [ref=e1119]: 主な事業内容として、イベントの企画・運営を行うコンベンションや通訳者・翻訳者を養成する語学教育、外国出願用の特許明細書の作成から出願手続きの支援業務、各種データ(音声・画像・対話・コーパス)の収集・分析・活用支援業務を行っております。
                      - paragraph [ref=e1120]: (注)1.『アメリカ食品医薬品局』の略、日本での厚生労働省に該当。
                      - paragraph [ref=e1121]: 2.『デスクトップパブリッシング』の略、編集作業を全てパソコンで行い、プリンターで印刷することも、ネットワークに電送することもできる出版様式。
                      - paragraph [ref=e1122]: 3.『現地化』の意味、ある国を対象に作られた製品や商品を特定地域の文化や商習慣、法令や環境に合わせて翻訳すること。
                      - paragraph [ref=e1123]
                      - paragraph [ref=e1124]: "[事業系統図]"
                      - paragraph [ref=e1125]
                      - paragraph [ref=e1126]
                      - paragraph [ref=e1127]: （画像は省略されました）
                      - paragraph
                      - paragraph [ref=e1128]: 1案件依頼:顧客より案件を受注する
                      - paragraph [ref=e1129]: 2翻訳・通訳依頼:登録翻訳者・通訳者等の選定後、翻訳・通訳依頼
                      - paragraph [ref=e1130]: 3翻訳文受領:登録翻訳者等より翻訳原稿受領(通訳の場合は請負契約に基づき顧客企業にて役務提供)
                      - paragraph [ref=e1131]: 4精査後納品:翻訳内容の品質管理を行い、顧客又は子会社へ納品(通訳の場合は請負契約に基づき顧客企業にて役務提供)
                      - paragraph [ref=e1132]: 5派遣依頼:登録翻訳者・通訳者等の選定後、派遣依頼
                      - paragraph [ref=e1133]: 6労働者派遣契約:登録翻訳者・通訳者等を顧客企業へ派遣
                      - paragraph [ref=e1134]: 7外国特許明細書作成依頼:登録者の選定後、外国特許明細書作成依頼
                      - paragraph [ref=e1135]: 8外国特許明細書受領:登録者より外国特許明細書受領
                      - paragraph [ref=e1136]: 9外国出願支援:外国特許明細書作成等の外国出願支援を行う
                      - paragraph [ref=e1137]: 10教育講座提供:サービス希望者へ教育講座を提供
                      - paragraph [ref=e1138]: 11ライティング依頼:登録者の選定後、ライティング業務依頼
                      - paragraph [ref=e1139]: 12ライティング文書受領:登録者よりライティング文書受領
                      - paragraph [ref=e1140]: 13多言語コールセンターサービスの契約:顧客企業へ多言語コールセンターサービスを提供
                      - paragraph [ref=e1141]: 注)無印 連結子会社であります。また、当社と子会社及び子会社間での相互取引があります。
                      - paragraph [ref=e1142]: ※1 持分法適用関連会社であります。
