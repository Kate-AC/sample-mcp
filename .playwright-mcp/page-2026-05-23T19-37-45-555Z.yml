                    - generic [ref=e953]:
                      - paragraph [ref=e954]
                      - heading "3 【事業の内容】" [level=3] [ref=e955]
                      - paragraph [ref=e956]: 当社グループは、当社及び連結子会社2社で構成され、婦人衣料及び服飾雑貨のSPA(注)企業として、衣料品及び服飾品の企画、販売並びに製造を行っております。
                      - paragraph [ref=e957]: 以下に示す区分は、セグメントと同一の区分であります。
                      - paragraph [ref=e958]: なお、当連結会計年度より、報告セグメントの区分を変更しております。詳細は、「第5 経理の状況 1 連結財務諸表等 (1)連結財務諸表 注記事項(セグメント情報等)」をご参照ください。
                      - paragraph [ref=e959]
                      - paragraph [ref=e960]
                      - paragraph [ref=e961]: (日本)
                      - paragraph [ref=e962]: 当社(株式会社ハニーズホールディングス)は、幅広い年齢層のお客様へ向けた婦人服及び服飾品の企画、並びに連結子会社である株式会社ハニーズへの販売を行っております。株式会社ハニーズは、国内一般消費者に対し、婦人服等の販売を行っております。同社の国内店舗は、インショップ型を主とした婦人服専門店であり、全国47都道府県にわたって各地の郊外型大型ショッピングセンターや駅ビル等に出店しております。当連結会計年度末の直営店舗数は872店舗であります。
                      - paragraph [ref=e963]: 当社グループの販売する商品の大半は自社企画商品であり、それらは主にミャンマー自社工場のほか、海外生産委託工場で生産しております。
                      - paragraph [ref=e964]
                      - paragraph [ref=e965]: (ミャンマー)
                      - paragraph [ref=e966]: 連結子会社であるHoneys Garment Industry Limitedは、ミャンマーにおいて婦人衣料等の製造業を営んでおります。
                      - paragraph [ref=e967]
                      - paragraph [ref=e968]: (注) SPAとは、Speciality store retailer of Private label Apparel の略であります。
                      - paragraph [ref=e969]
                      - paragraph [ref=e970]: 以上を事業系統図で示すと、次のとおりであります。
