                      - heading "3 【事業の内容】" [level=3] [ref=e850]
                      - paragraph [ref=e851]: 当社グループ(当社及び子会社)は、販売会社である日本プリメックス株式会社を中核として、オリジナルプリンタの開発、設計、製造を担当する日本プリンタエンジニアリング株式会社、グループの資産管理を主業務とする石川台商事株式会社の3社で構成しております。当社グループの報告セグメントは「ミニプリンタの開発・製造・販売事業」のみとなっております。
                      - paragraph [ref=e852]: (ミニプリンタの開発・製造・販売事業)
                      - paragraph [ref=e853]: 当社グループの事業の内容は、産業用小型プリンタの開発・製造・販売会社として、国内の有力メーカーであるシチズン・システムズ株式会社、セイコーエプソン株式会社、セイコーインスツル株式会社、スター精密株式会社、
                      - paragraph [ref=e854]: ブラザー工業株式会社及び日本プリンタエンジニアリング株式会社の小型プリンタ及び周辺機器の販売が主要業務となっております。
                      - paragraph [ref=e855]: 加えて、米国ゼブラ社製のバーコード・ラベル・カードプリンタの販売及び日本プリンタエンジニアリング株式会社開発のオリジナル製品の国内販売及び海外市場向け輸出を行っております。
                      - paragraph [ref=e856]: 日本プリンタエンジニアリング株式会社においては、ユーザーより受注のOEM製品の製造、製品改造、オリジナル製品の開発製造を行っております。
                      - paragraph [ref=e857]: また、当社グループの販売体制は、東京本社を中心に、横浜、名古屋、京都、大阪、福岡に営業所を設置するとともに海外営業部を東京本社に設け、2025年3月31日現在34名の営業員を配置しユーザーに対し営業活動を行っております。
                      - paragraph [ref=e858]: 事業の系統図は、次のとおりです。
                      - paragraph [ref=e859]
