          - generic [ref=e1178]:
            - generic [ref=e1179]: 会社の詳細
            - generic [ref=e1180]:
              - tablist [ref=e1181]:
                - listitem [ref=e1182]:
                  - tab "事業内容" [ref=e1183] [cursor=pointer]
