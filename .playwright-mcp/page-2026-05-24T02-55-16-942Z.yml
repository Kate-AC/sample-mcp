                      - paragraph [ref=e1018]
                      - heading "3 【事業の内容】" [level=3] [ref=e1019]
                      - paragraph [ref=e1020]: 当社グループは、当社(株式会社ユニリタ)と以下、完全子会社である、株式会社ビーエスピーソリューションズ、備実必(上海)軟件科技有限公司(BSP上海)、株式会社ヒューアップテクノロジー、株式会社データ総研、株式会社ユニ・トランド、株式会社ユニリタプラス、株式会社無限、瀋陽無限軟件開発有限公司、株式会社ユニリタエスアールの10社及び持分法適用の関連会社であるNEVELL株式会社1社で構成されています。(2025年3月31日現在)
                      - paragraph [ref=e1021]: 当社グループの事業内容及び当社と関係会社の当該事業に係る位置付けは次のとおりであります。
                      - paragraph [ref=e1022]: 以下に示す区分は、セグメントと同一の区分であります。
                      - paragraph [ref=e1023]: なお、当連結会計年度より、報告セグメントの区分方法の一部を変更しております。詳細は、「第5 経理の状況 1連結財務諸表等(1)連結財務諸表 注記事項(セグメント情報等)セグメント情報 3.報告セグメントの変更等に関する事項」をご参照ください。
                      - paragraph [ref=e1024]
                      - paragraph [ref=e1025]: 当社グループでは、40年余に亘って培ってきたデータマネジメント、サービスマネジメントに関する知見やノウハウを以下の各事業セグメント共通のコアコンピタンス(強み)として、様々な規模の企業および公共機関向けに各種ITサービスを提供しています。
                      - heading "(1) プロダクトサービス事業" [level=4] [ref=e1026]
                      - paragraph [ref=e1027]: 金融機関や生損保、大手製造業を中心としたメインフレーム(大型汎用機)コンピュータを利用するような比較的システム規模の大きな企業向けに、システム運用の自動化や帳票管理、システムのBCP管理等を実現する各種ソフトウェアおよび関連サービスを提供しています。
                      - paragraph [ref=e1028]: 近年ではメインフレームからのマイグレーション(システム移行)やモダナイゼーション(システムの近代化)を支援するサービスや、製品だけでなく周辺業務も含めた包括的なサービスの提供等の実施により、LTV(顧客生涯価値)の増大に努めています。
                      - paragraph [ref=e1029]: 本事業においては、主に当社が製品・サービス開発及び顧客への提供を行っており、株式会社ユニリタプラスでは西日本地区で、備実必(上海)軟件科技有限公司(BSP上海)では中国での製品販売と保守サービスを行っています。
                      - paragraph [ref=e1030]
                      - heading "(2) クラウドサービス事業" [level=4] [ref=e1031]
                      - paragraph [ref=e1032]: システム規模の大きな企業だけでなく幅広い企業や事業体向けに、主にクラウドサービスの形態で各種ソフトウェアや関連サービスを提供しております。
                      - paragraph [ref=e1033]: IT課題の解決を図るサービス群が主力となりますが、特定の業態に特化した業務アプリケーションや、地方自治体等の公共機関や交通事業者向けに社会課題解決を図るサービス等も提供しています。
                      - paragraph [ref=e1034]: 本事業においては、主に当社、株式会社ヒューアップテクノロジー、株式会社無限および株式会社ユニ・トランドにて製品開発及び販売、保守サービスを行っております。
                      - paragraph [ref=e1035]
                      - heading "(3) プロフェッショナルサービス事業" [level=4] [ref=e1036]
                      - paragraph [ref=e1037]: システム規模の大きな企業を中心とした企業向けに、データマネジメント、サービスマネジメントに関する知見やノウハウをベースとしたコンサルティング、システムインテグレーション、アウトソーシングといった役務型サービスを主に提供しております。
                      - paragraph [ref=e1038]: 本事業で保有する多様な技術者とコンサルティング、システム開発および運用ノウハウにより、プロダクトサービスやクラウドサービスの利用顧客に対し、包括的な提案やワンストップ型サービスの提供が可能となります。
                      - paragraph [ref=e1039]: 本事業においては、主に株式会社ビーエスピーソリューションズ、株式会社データ総研、株式会社無限および株式会社ユニリタエスアールにてサービス提供を行っております。
                      - paragraph [ref=e1040]
                      - paragraph [ref=e1041]: 以上に述べた当社グループの事業内容、および関係会社の当該事業に係る位置付けは次のとおりであります。
                      - paragraph [ref=e1042]: <事業系統図>
                      - paragraph [ref=e1043]
                      - paragraph [ref=e1045]: （画像は省略されました）
                      - paragraph [ref=e1046]: (注1) 2015年4月1日に株式会社ビーエスピーと株式会社ビーコン インフォメーション テクノロジーは合併し、株式会社ユニリタとなりました。
                      - paragraph [ref=e1047]: (注2) 株式会社ユニ・トランドは2016年5月11日に設立されました。
                      - paragraph [ref=e1048]: (注3) 株式会社ユニリタプラスは2017年4月3日に設立されました。
                      - paragraph [ref=e1049]: (注4) 株式会社無限は2018年2月15日に子会社となりました。
                      - paragraph [ref=e1050]: (注5) 株式会社アスペックスは、2018年11月5日に子会社化した株式会社ビジネスアプリケーションを2022年4月1日付にて吸収合併し、社名を株式会社ヒューアップテクノロジーとしました。
                      - paragraph [ref=e1051]: (注6) 株式会社ビーティスは2024年7月1日に吸収合併されました。
                      - paragraph [ref=e1052]: なお、関係会社各社の事業内容は、「4 関係会社の状況」に記載のとおりであります。
