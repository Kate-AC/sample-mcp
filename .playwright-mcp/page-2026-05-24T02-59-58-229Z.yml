                      - heading "3【事業の内容】" [level=3] [ref=e835]
                      - paragraph [ref=e836]: 当社はISP(インターネット・サービス・プロバイダ)事業として、個人または法人向けにインターネット接続サービス及びインターネット関連サービスを提供しております。セグメント情報はISP事業の単一で報告をしております。
                      - paragraph [ref=e837]
                      - paragraph [ref=e838]: (1)インターネット接続サービス
                      - paragraph [ref=e839]: インターネット接続サービスとは当社顧客に対しインターネット接続環境を提供するサービスです。
                      - paragraph [ref=e840]: インターネット接続環境提供の概念図は次のとおりであります。
                      - paragraph [ref=e841]
                      - paragraph [ref=e842]: "[インターネット接続環境提供の概念図]"
                      - paragraph [ref=e843]
                      - paragraph [ref=e844]
                      - paragraph [ref=e845]: （画像は省略されました）
                      - paragraph
                      - paragraph [ref=e846]
                      - paragraph [ref=e847]
                      - paragraph [ref=e848]: 当社は、顧客にインターネット接続環境を提供するためインターネットを構成する一員として全世界のサイトやネットワークと相互接続ができる通信環境を構築しております。インターネット接続環境の提供にあたっては、全国に分散する中継点(POI)との間に1バックボーン回線を構築しております。当社はこのバックボーン回線を自社の技術で運用することにより「回線の安定性」「回線速度」などにおいて高い品質を維持しながら通信費を適切な範囲で維持することに努めております。
                      - paragraph [ref=e849]: 顧客と最寄りの中継点を結ぶ2アクセス回線は、複数の提携電気通信事業者と契約しております。現在はアクセス回線としてFTTHやモバイル回線を利用する顧客が増加しております。
                      - paragraph [ref=e850]: 顧客が利用するインターネット接続サービスに必要な3ルータ等の通信機器を提供しております。
                      - paragraph [ref=e851]: 当社は、インターネット接続サービスの提供に必要であるネットワーク設備やサーバー設備を複数のデータセンターに設置しISP事業を運営しております。また、顧客の様々な問い合わせに対応するコールセンター業務、課金業務、24時間365日でインターネット接続サービスを監視するネットワークオペレーション業務等を実施しております。
