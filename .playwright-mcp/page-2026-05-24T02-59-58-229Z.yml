                      - paragraph [ref=e1181]
                      - paragraph [ref=e1182]: (注)1.インターネット接続契約数は各年度末日現在において有効なFTTH(光接続)・ADSL・モバイル接続の契約数となります。
                      - paragraph [ref=e1183]: 2.各年度の退会率は、当該年度の「FTTH(光接続)・ADSL・モバイル接続の退会数÷FTTH(光接続)・ADSL・モバイル接続の契約数」の月平均となります。
                      - paragraph [ref=e1184]
                      - paragraph [ref=e1185]
                      - paragraph [ref=e1186]: (用語集)
                      - paragraph [ref=e1187]: ・ISP(インターネット・サービス・プロバイダ):インターネット接続事業者
                      - paragraph [ref=e1188]: ・相互接続:通信事業者がお互いの通信回線を接続し、相互に通信できるようにすること
                      - paragraph [ref=e1189]: ・バックボーン回線:インターネットなどの大規模な通信ネットワークにおける、事業者間や拠点間、国家間などを結ぶ高速・大容量のネットワーク回線のこと
                      - paragraph [ref=e1190]: ・アクセス回線:インターネットなどの通信ネットワークにおける、利用者の建物から通信事業者の最寄りの基地局を結ぶ回線
                      - paragraph [ref=e1191]: ・POI(Point Of Interface):電気通信事業者同士の回線が接続する箇所(相互接続点)。提携電気通信事業者の局舎などに設置される場合が多く、当社とのサービス分界点となる
                      - paragraph [ref=e1192]: ・LMS(ラーニング・マネジメント・システム):学習教材の配信、受講状況、成績などの学修データを統合して管理するシステム
                      - paragraph [ref=e1193]: ・クラウド型:インターネット経由でサービスを提供する形態。利用者はサーバーなどの設備や保守の必要がなく、インターネット環境さえあればどこでも利用できる
