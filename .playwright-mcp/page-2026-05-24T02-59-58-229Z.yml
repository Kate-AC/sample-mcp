                      - paragraph [ref=e1091]: (2)インターネット関連サービス
                      - paragraph [ref=e1092]: インターネット関連サービスとは当社顧客にインターネット接続サービスに加えて提供するサービスです。
                      - paragraph [ref=e1093]: インターネット接続サービスを基盤としたホームページサービス、独自ドメインサービス、メールサービス、セキュリティサービスなど接続付加価値サービスを提供しております。
                      - paragraph [ref=e1094]: 「manaba」は、当社が開発、販売、サポートを行っているクラウド型教育支援サービスです。LMS(ラーニング・マネジメント・システム)としての役割に加え、教務システムや認証システム等の既存学内システムや外部教材とも連携し、教育支援のソリューションを広範囲に提供しております。
