                      - heading "3【事業の内容】" [level=3] [ref=e1018]
                      - paragraph [ref=e1019]: 当社の企業集団(当社及び当社の関係会社)は当社(株式会社岡山製紙)と王子ホールディングス株式会社(その他の関係会社)から構成されており、当社は中芯原紙・紙管原紙を主体とした板紙と美粧段ボールの製造、販売を主たる事業としております。
                      - paragraph [ref=e1020]: 当社の事業内容は、次のとおりであります。
                      - paragraph [ref=e1021]: 板紙事業...............この事業は、段ボール製造用原紙の一品種である中芯原紙及び紙、布、セロファン、テープ、糸などの巻しんに使用される紙管原紙の製造販売を行っております。
                      - paragraph [ref=e1022]: 美粧段ボール事業...この事業は、青果物、食品、家電製品等の包装箱や贈答箱の製造販売を行っております。
                      - paragraph [ref=e1023]: 当社と関係会社の当該事業に係る位置付けは次のとおりであります。
                      - paragraph [ref=e1024]: その他の関係会社の王子ホールディングス株式会社の100%子会社である森紙販売株式会社、佐賀板紙株式会社及び王子コンテナ-株式会社とは、当社製品の販売取引を行っております。
                      - paragraph [ref=e1025]: また、当社の取締役監査等委員岡﨑達也氏が代表取締役社長の岡山ガス株式会社とは、産業用ガスの購入取引を行っております。
                      - paragraph [ref=e1026]: "[事業系統図]"
                      - paragraph [ref=e1027]: 以上述べた事項を事業系統図によって示すと次のとおりであります。
                      - paragraph [ref=e1028]: なお、森紙販売株式会社、佐賀板紙株式会社及び王子コンテナ-株式会社は連結子会社、持分法適用関連会社以外の関連当事者であります。
