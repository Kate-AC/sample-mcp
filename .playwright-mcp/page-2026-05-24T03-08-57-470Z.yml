                      - paragraph [ref=e1038]
                      - paragraph [ref=e1039]: 4 売上債権の回収について
                      - paragraph [ref=e1040]: 当社は複数のリース会社と提携することで、歯科医院が円滑にリース契約を締結できる体制としております。リース契約の活用により、顧客は初期導入費用の負担を軽減でき、当社は売上債権回収に係る業務負担を軽減しております。
                      - paragraph [ref=e1041]
                      - paragraph [ref=e1042]: 5 開発業務について
                      - paragraph [ref=e1043]: 当社は、社内による独自開発を基本方針としております。これは、吸い上げられた顧客ニーズを迅速に開発業務へとつなげるためであります。また、外注委託の活用を限定的とすることで、製販一体の強みをより生かすことができるとの考えによります。さらに、株式会社日立製作所との特約店契約に基づく連携により、日立グループが有する新しいIT技術のノウハウを開発業務に活用できる体制を構築しております。
