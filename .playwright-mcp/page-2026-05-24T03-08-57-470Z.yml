                      - paragraph [ref=e988]: 2 収益形態及びソフトウェア三無主義について
                      - paragraph [ref=e989]: 当社の収益は、独自に開発しパッケージ化した歯科電子カルテ統合システムの販売によるシステム売上高が大部分を占めております。他には、診療報酬改定などの制度上の変更に伴うプログラム改定売上高、オンライン資格確認などのプログラム改定売上高、その他として機器の修理による売上高等で構成されております。
                      - paragraph [ref=e990]: なお、当社は顧客である歯科医院の安心感・満足感を高めるため、創業以来、「ソフトウェア三無主義」を提唱し、定期的な保守料等は受け取っておりません。「ソフトウェア三無主義」とはシステムサポート、ソフトウェア保守、バージョンアップこれら3つを全て無償で行うサービスです。例えば、当社システムの使用や操作方法について不明な点が出てきた場合に、専任の営業サポート社員から説明やトレーニングを受けることができます。そのため、顧客である歯科医院は、当社商品の購入後、毎月定額の保守料等の費用負担なく安心してサポートサービスを受けることができます。
                      - paragraph [ref=e991]
                      - paragraph [ref=e992]
                      - paragraph [ref=e993]: 3 営業サポート体制について
                      - paragraph [ref=e994]: 当社は、西日本を中心とした全国24拠点に約75名の営業サポート社員を配置し、地域密着型の営業サポート体制を構築しております。その担当エリアにおいて当社社員は、新規顧客への営業活動と、既存顧客に対する保守サービス等のサポート活動を行っております。
                      - paragraph [ref=e995]: 新規顧客への営業活動としては、顧客となる歯科医院に直接訪問し、医院運営に適ったシステムとアプリケーションを提案する営業を行っております。既存顧客に対するサポート活動としては、顧客ごとに専任の営業サポート社員を配置し、地域密着のサポート体制をとっております。具体的には、定期的な顧客訪問、診療報酬改定時の情報提供(例えば、説明用冊子の作成など)、改定内容に係る説明会の開催や訪問時の個別説明、顧客の歯科医院内での業務フローに合わせた細かなシステム設定、機器障害発生時での訪問対応等があります。このようなサポートを専任体制により提供することで、顧客との信頼関係が醸成されると考えております。
                      - paragraph [ref=e996]: またこのように、地域に密着して営業活動とサポート活動を行う専任の営業サポート担当社員が、顧客を直接訪問し保守サービス等の「顔の見える」営業サポートを実践することで顧客の要望を把握し、当社システムの一層の進化・向上につなげることで、顧客満足度の向上に取り組んできた結果、既存顧客が定期的に行う基幹システムの入替時において一定の買替更新比率を確保しております。
                      - paragraph [ref=e997]: さらに、このような営業とサポートの両面を支えるため、2010年から営業サポート社員全員にクラウド型営業支援ツールを導入し、顧客情報の可視化を行うことで、営業部門全体の生産性を高めるよう努めてまいりました。下記に当社の営業拠点の状況を記載いたします。
