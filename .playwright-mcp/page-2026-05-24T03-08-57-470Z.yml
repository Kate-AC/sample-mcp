                      - paragraph [ref=e794]
                      - heading "3 【事業の内容】" [level=3] [ref=e795]
                      - paragraph [ref=e796]: 当社は、歯科医院向け電子カルテシステムに特化した研究開発、コンサルティング、サポートを行う製販一体のオンリーワン企業です。
                      - paragraph [ref=e797]: 1978年、『売上なくして経営なし 利益なくして事業なし 人生もロマン 経営もロマン 無限の可能性に挑戦』を経営理念、また「サポートなくして販売なし」「お客様の笑顔、お客様の満足が私たちの喜び」「顔が見え、心が触れ合う」を事業理念に掲げ歯科医療に夢と未来を提供したいとの強い思いから創業しました。
                      - paragraph [ref=e798]: そして、2020年12月25日東京証券取引所JASDAQ(スタンダード)へ上場いたしました。
                      - paragraph [ref=e799]: 主力商品である「AI・音声電子カルテ統合システム」は、厚生労働省のガイドライン(「電子カルテ三原則」真正性・見読性・保存性)に対応、「生体認証指静脈」を採用することで真正性を確保、世界のセキュアDB「HiRDB」を採用することで監査証跡機能による情報漏洩、データ改竄を排除したカルテ機能とiPadを用いたインフォームドコンセント機能、レセプト機能、これらを統合・一元管理を可能としたシステムです。
                      - paragraph [ref=e800]: さらに、「歯周病検査なくして糖尿病治療なし」をモットーに医院経営を「治療から予防へ」導くと共に社会問題である「衛生士不足・医療費抑制・健康寿命延伸」の課題解決へ、2025年4月7日「AI・音声電子カルテ統合システム AI-Voice Revo.11」を誕生させました。
                      - paragraph [ref=e801]: また6月11日 今後ますます高度化、複雑化していく医療DXや医院承継問題、衛生士不足といった課題解決へ向けたコンサルティング業務等により、当社および当該子会社とのシナジー効果を生み出し、更なる収益基盤の拡大と企業価値向上を目的とした子会社「Hiクラージュ株式会社」を設立致しました。更に6月18日「AI・音声電子カルテ統合システム AI-Voice Revo.11」「AI・音声 歯周病検査」「AI・音声 サブカルテ」これら3つのAI・音声シリーズを総称して「AI・音声 Hiクラテス※」と銘を打ち、激変する歯科業界のリーディングカンパニーとして大きな旋風を巻き起こして参りました。
                      - paragraph [ref=e802]: そして2026年1月1日、Hiクラテス株式会社へ商号と商品名を統一することで、ブランド力と企業価値をさらに高めていくと共に、これまで培ってきたすべてを一新、ここから30年50年100年と社会に貢献し続ける会社へ成長して参ります。
                      - paragraph [ref=e803]: なお、当社の事業は「歯科医院向けシステム事業」の単一セグメントであります。
                      - paragraph [ref=e804]: ※当社の英語表記社名の一部である「Hi」と古代ギリシャ医学の父、医聖であると言われているHippocrates(ヒポクラテス)の名前を組み
                      - paragraph [ref=e805]: 合わせました。
                      - paragraph [ref=e806]
                      - paragraph [ref=e807]: (ビジネスモデル)
                      - paragraph [ref=e808]: 当社は、仕入先メーカーから機器等を仕入れ、当社が開発したシステムを搭載することで商品とし、これを歯科医院に納品・販売しております。
                      - paragraph [ref=e809]: 販売先である歯科医院は、原則としてリース契約を活用して支払いを行います。歯科医院はリース会社とリース契約を締結し毎月のリース料を支払い、当社はリース会社より販売代金を受領しております。例外的にリース契約を活用しない場合、当社は歯科医院から直接、販売代金を受領します。
                      - paragraph [ref=e810]:
                        - text: 商品のハードウェアに係る修理・保守については、顧客による実費負担となっております。ただし、顧客である歯科医院は、顧客が独自に結成している任意の互助会組織HMG
                        - superscript [ref=e812]: (注)1
                        - text: に加入することで、ハードウェアの修理・保守に係る費用負担を受けることができます。2025年9月30日現在、HMGへの加入は顧客2,974件中、2,916件となっております。
                      - paragraph [ref=e813]: 1.HMG(ハイデンタルハードメンテナンス互助会のことで略称をHMGと呼びます。)とは当社の顧客が独自に結成している任意の
                      - paragraph [ref=e814]: 互助会組織です。主な目的は、当社商品に係るハードウェアの修理・保守等に係る費用の負担や会員同士の情報交流です。当社の顧客は月当たり1,500円からの会費(なお、システム規模により変動)を納入することで、入会できます。
                      - paragraph [ref=e815]
                      - paragraph [ref=e816]: 当社及び顧客等との関連を系統図で示すと以下のとおりとなります。
                      - paragraph [ref=e817]: (事業系統図)
                      - paragraph [ref=e819]: （画像は省略されました）
                      - paragraph [ref=e820]
                      - paragraph [ref=e821]: (*1)上図の[リース活用時]は、顧客が当社商品の購入に当たり、リース会社とリース契約を締結した場合の資金の流れです。
                      - paragraph [ref=e822]: (*2)上図の[現金取引時]は、顧客が当社商品の購入に当たり、販売代金を直接、顧客から当社に支払う場合の資金の流れです。
                      - paragraph [ref=e823]
                      - paragraph [ref=e824]: (事業の特徴)
                      - paragraph [ref=e825]: 当社事業及び当社が手掛ける商品・サービスには、以下の特徴があります。
                      - paragraph [ref=e826]: 1 商品・サービスについて
                      - paragraph [ref=e827]: わが国では現在、「全国医療プラットフォームの創設」、「電子カルテ情報の標準化」、「診療報酬改定DX」等、医療DXへの取り組みが進められており、その中核となる医療情報システムの重要度は益々大きな役割を担うものと考えます。一方、顧客である歯科医院の抱える問題として、慢性的な歯科衛生士不足、保険治療主体から予防歯科へのシフト、来たる国民皆歯科健診への患者受け入れ体制強化等、医療DXによる業務効率化を迫られています。
                      - paragraph [ref=e828]: そこで当社は、情報漏洩とデータ改ざんを排除し、電子カルテ三原則を確保した医療情報セキュリティの構築、電子カルテとオンライン診療を含む予約・問診・受付自動精算機・歯周病検査・画像・治療説明等が一元管理されたシステム、先生が診療しながら、手袋を外さず、音声でカルテ作成・検査結果が記録でき、治療説明の会話記録とテキスト化による自費での診療トラブルを防止できるシステム、この3要素を備えた商品展開を行っております。
                      - paragraph [ref=e829]: また、当社では下記の123のAI・音声シリーズを展開しております。
                      - paragraph [ref=e830]: 1 AI・音声シリーズ 「AI・音声電子カルテ統合システム Revo.11」
                      - paragraph [ref=e831]: 先生が診療しながら、手袋を外さず、音声でカルテ作成・検査結果が記録でき、治療説明の会話録音とテキスト化による自費での診療トラブルを防止できます。
                      - paragraph [ref=e832]: 2 AI・音声シリーズ「AI・音声歯周病精密検査」
                      - paragraph [ref=e833]: 歯周病治療・予防に係る検査と記録を歯科医師・衛生士1人で完結するだけでなく、短縮された時間を利用してお客様とのコミュニケーションやカウンセリングの時間に充てることで、患者様の満足度や歯周病予防への意識を高め、定期メンテナンス促進へ繋げることができます。
                      - paragraph [ref=e834]: 3 AI・音声シリーズ「AI・音声サブカルテ」
                      - paragraph [ref=e835]: サブカルテのデジタル化により、歯科医院で共有する患者様のあらゆる情報を院内だけでなく訪問診療先でも
                      - paragraph [ref=e836]: AI・音声による入力と情報共有が可能となります。
                      - paragraph [ref=e837]: そして、2026年1月1日、社名を「Hiクラテス」に商号変更、「AI音声電子カルテ統合システム」「AI音声歯周病精密検査」「AI音声サブカルテ」これら3つのAI・音声シリーズの総称である「Hiクラテス」と商号を統一することで、ブランド力と企業価値をさらに高め、歯科業界のリーディングカンパニーとしてさらなる成長を目指します。
                      - paragraph [ref=e838]: 当社の電子カルテ機能については、「医療情報システムの安全管理に関するガイドライン 第6版(令和5年5月)」(厚生労働省)で示されている「電子保存の3基準」に適合するため、株式会社日立製作所のデータベース「HiRDB」に指静脈生体認証システムを組み合わせることで、データベースに対するあらゆる操作及び操作者の記録や、不正な書換・消去などの防止を可能とし、患者及び顧客である歯科医院が安心して利用できるシステムを提供しており、併せて歯科医院の様々な業務に関するオプション製品を揃えております。オンライン診療を含む予約・問診・受付自動精算機・歯周病検査・画像・治療説明等、これらの製品が一元管理されていることで、業務の効率をあげるシステムを販売しています。
