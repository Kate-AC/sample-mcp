                      - heading "3 【事業の内容】" [level=3] [ref=e842]
                      - paragraph [ref=e843]: 当社グループ(当社及び当社の関係会社)は、当社(竹本容器株式会社)及び連結子会社7社(株式会社共栄プラスコ、上海竹本容器包装有限公司、竹本容器(昆山)有限公司、TAKEMOTO PACKAGING INC.、Takemoto Netherlands B.V.、TAKEMOTO PACKAGING (THAILAND) CO., LTD.、TAKEMOTO YOHKI INDIA PRIVATE LIMITED)により構成されており、包装容器等の製造販売を行う容器事業を営んでおります。
                      - paragraph [ref=e844]: なお、当社グループは、容器事業の単一セグメントであるため、セグメント別の記載を省略しております。
