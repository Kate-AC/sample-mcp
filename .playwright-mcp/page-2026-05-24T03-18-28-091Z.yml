                            - row "ラミネーティング技術 (Laminating) プラスチックフィルム、紙、合成樹脂等を積層する技術であります。 当社のラミネーティング技術は、加熱溶融させた合成樹脂を基材に直接塗布・接着する押出ラミネートと、複数の基材を接着剤で貼るドライラミネートを主な技法としております。異種の材料を積層することによって、各々の材料の長所を生かし、短所を補うことにより、防湿性・剥離性・耐久性等の様々な機能を付与することが可能となります。" [ref=e1214]:
