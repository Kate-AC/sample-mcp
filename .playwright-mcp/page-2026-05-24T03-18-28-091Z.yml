                      - paragraph [ref=e1034]: 当社グループは、お客様のミッション達成に貢献する高機能フィルムメーカーです。コア技術であるSheeting(製膜)、Laminating(積層)、Coating(塗布)に、Ultra Precision(高精度な先端技術やお客様対応)を加えることで、顧客ニーズに合わせた先端機能フィルムとソリューションを提供しています。
                      - paragraph [ref=e1035]: 当社グループは当社及び連結子会社4社で構成され、光拡散フィルム、高機能光学フィルムの開発、製造、販売を行う光学製品事業、包装資材、工程紙・建材、クリーンエネルギー資材、農業資材等の開発、製造、販売を行う機能製品事業の2つの事業に関する製品の開発・製造・販売を行っております。なお、「地球の絆創膏事業」については、前第4四半期連結会計期間において研究開発フェーズに引き戻したことにより、第1四半期連結会計期間よりセグメントとしては廃止しております。その結果、第1四半期連結会計期間より、当社のセグメントは「光学製品事業」及び「機能製品事業」の2つのセグメントで構成されております。なお、当第3四半期連結会計期間において、「地球の絆創膏事業」からの撤退を決定いたしております。
