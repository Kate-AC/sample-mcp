                                - paragraph [ref=e1179]: 光学製品事業
                        - paragraph [ref=e1180]
                      - paragraph [ref=e1181]
                      - paragraph [ref=e1182]: (1) 光学製品事業
                      - paragraph [ref=e1183]: 光学製品事業は、当社のCoating技術、Sheeting技術を活用し、ノートPC、タブレット、車載ディスプレイ、ゴーグル型VR端末、スマートフォン等の液晶ディスプレイに利用される光拡散フィルム、複合拡散板、偏光制御フィルム等の光学シート部材の開発・製造・販売を行っております。
                      - paragraph [ref=e1184]: 主要製品となる光拡散フィルム「オパルス®」は、液晶ディスプレイの光源であるバックライトユニット構成部材の1つであり、光のムラをなくし、光を均一に拡散させる機能を有するプラスチックフィルムであります。また、少ない光源で全体を明るくするため省電力の役割も担っています。
                      - paragraph [ref=e1185]: また、従来型の“エッジライト型液晶ディスプレイ”に比べて画質が飛躍的に向上し、タブレット、ノートパソコン向け中型液晶ディスプレイ及び車載ディスプレイとして採用拡大が見込まれる“直下型ミニLED液晶ディスプレイ”に最適な複合拡散板「オパスキ」を販売しております。
                      - paragraph [ref=e1186]: それ以外にも、当社グループのSheeting技術を活用して、様々な特性を有する樹脂を複合的に組み合わせた高機能光学フィルムを製造しております。ニーズに応じた機能(高硬度、耐擦傷性、光学性能、耐熱性、防汚性、反射防止等)を付加する事が可能です。
                      - paragraph [ref=e1187]: 光拡散フィルムと比べて、より高精度化、高機能化が要求される各種センサー用途、次世代自動車の車載ディスプレイ等の分野での活用が期待されております。
                      - paragraph [ref=e1188]
                      - paragraph [ref=e1189]: (2) 機能製品事業
                      - paragraph [ref=e1190]: 機能製品事業は、当社創業時より長年培ってきた事業であり、安定的に収益を生み出す当社グループの根幹の1つを担う事業として続けて参りましたが、コモディティ化が進行して当社の技術的な優位性が差別化につなげられず価格競争に陥ってしまうものもあったことから、最終用途の市場成長性や収益性の見通しなどに基づいて一部の製品群において戦略的な絞り込みを行い、より高い成長や収益が期待できる分野への経営資源の集中に取り組んでおります。
                      - paragraph [ref=e1191]: 当事業では、紙、フィルム等にコーティングやラミネーティング加工をする他、自社でシート成形したフィルムを貼り合せる等により、特定の機能(防錆性・防湿性・耐熱性・耐久性・耐候性・剝離性等)を付加したクリーンエネルギー資材・医療衛生、工程紙、建材、防錆資材、農業資材等の製造・販売を行っております。
                      - paragraph [ref=e1192]: クリーンエネルギー資材・医療衛生は、燃料電池車やハイブリッド車、EVなどに搭載される次世代電池用特殊フィルムや、住宅用・産業用発電システム等の太陽電池モジュールに使用される太陽電池用バックシート、並びに透析用機材等の医療・衛生分野で用いられる医療製品用工程フィルム等であります。
                      - paragraph [ref=e1193]: 工程紙は、合成皮革や発泡ウレタン等の製品を製造する過程において、製品の支持体になると同時に、表面に形状(凹凸模様等の型押し)を与える機能を持った産業資材であり、自動車のシート、コート・スーツ・ジャケット等の衣料品、靴・手袋等の合成レザー製品など、その用途(最終商品)は多岐にわたります。
                      - paragraph [ref=e1194]: 建材は、室内の壁材、ドア材、クッションフロア(床材)等、主に内装用建築資材の構成部材となる製品、またはその製造工程で必要となる機能を付与する製品であります。
                      - paragraph [ref=e1195]: 防錆資材は、自動車用外装鋼板コイル、亜鉛メッキ鋼板、アルミ合金等の金属製品を湿気から保護し、さらに錆の発生を防ぐ機能を持った防錆包装紙等、製造工程や輸送において必要不可欠な包装材料であります。
                      - paragraph [ref=e1196]: 農業資材は、農業用ハウスの日照を確保できる雨樋シートや、害虫や汚染水等の侵入を防ぐ止水シート等であります。
                      - paragraph [ref=e1197]: また、冒頭に説明したように、製品ポートフォリオの入替により事業全体の成長性や収益性を高めるべく、医療・衛生分野を中心に、高性能な特殊フィルム製品の市場・製品開発にも注力しております。
                      - paragraph [ref=e1198]
                      - paragraph [ref=e1199]
                      - paragraph [ref=e1200]: これらの技術の概要と各技術の特徴は以下のとおりであります。
                      - generic [ref=e1201]:
                        - table [ref=e1202]:
                          - rowgroup [ref=e1206]:
                            - row "シーティング技術 (Sheeting) 樹脂からプラスチックシートを作るシート成形技術であります。 当社の押出シート成形技術は、原料の合成樹脂を、エクストルーダー(押出機)で加熱溶融しながら押し出し、シート成形する技術であり、これにより様々な特性を有する樹脂を複合的に組み合わせて多機能シートを成形することが可能であります。また、当社にてシート成形した独自の基材にラミネーティング技術やコーティング技術を組み合わせ、さらなる高精度・多機能化が可能となります。" [ref=e1207]:
