                    - generic [ref=e764]:
                      - paragraph [ref=e765]
                      - heading "3 【事業の内容】" [level=3] [ref=e766]
                      - paragraph [ref=e767]:
                        - text: 当社グループは、当社、連結子会社である株式会社GiRAFFE&Co.及び株式会社ドアーズにより構成されており、不動産テック・ウェルネステック・クロステックのライフスタイル3領域にて、より良い暮らしを目指している一人ひとりの行動を支援するための「行動支援サービス事業」を展開しております。
                        - text: 当社グループの事業セグメントは、行動支援サービス事業のみの単一セグメントであるため、以下に当社の事業ドメイン3領域の主要なサービス内容を記載いたします。
                      - paragraph [ref=e768]
                      - heading "1.事業ドメインについて" [level=4] [ref=e769]
                      - paragraph [ref=e770]
                      - paragraph [ref=e772]: （画像は省略されました）
                      - paragraph [ref=e773]
                      - paragraph [ref=e774]: (1)不動産テック領域
                      - paragraph [ref=e775]: 1ニフティ不動産
                      - paragraph [ref=e776]: 大手不動産ポータルの物件情報約1,400万件をまとめて一括検索できる、賃貸・購入領域での不動産物件情報検索プラットフォームサービスです。国内最大級の膨大な情報量とUI/UX(注1)にこだわった使い勝手の良いアプリを中心とするサービス提供が強みとなっております。
                      - paragraph [ref=e777]: 2外壁塗装の窓口
                      - paragraph [ref=e778]: 子会社の株式会社ドアーズが手掛けており、ユーザーと外壁塗装業者を結ぶ日本最大級の外壁塗装プラットフォームとなります。
                      - paragraph [ref=e779]
                      - paragraph [ref=e780]: (2)ウェルネステック領域
                      - paragraph [ref=e781]: ニフティ温泉
                      - paragraph [ref=e782]: 全国約2万2,000件の日帰り温浴施設や温泉、スパの情報やお得な電子チケット、クーポン、口コミ等を掲載する、日本最大級の温浴施設総合情報検索プラットフォームサービスです。温浴施設をマーケティングの場として活用し、健康や美容に興味のあるユーザー向けに広告プランを提案する「体験型広告サービス」も提供しております。
                      - paragraph [ref=e783]
                      - paragraph [ref=e784]: (3)クロステック領域
                      - paragraph [ref=e785]: 1DFO
                      - paragraph [ref=e786]: インターネット広告出稿時に、商品データを最適な広告配信フォーマットへ自動変換する広告入稿支援ツール「DFO」(Data Feed Optimization)をSaaS(注2)型ビジネスとして提供しております。2025年3月末現在、「DFO」は50以上の提携広告媒体に対応しております。
                      - paragraph [ref=e787]
                      - paragraph [ref=e788]: 2SEOコンサルティング
                      - paragraph [ref=e789]: 子会社の株式会社GiRAFFE&Co.が手掛けており、テクニカルSEO支援をはじめとするWEBマーケティングの課題に対応するコンサルティングサービスを展開しております。
                      - paragraph [ref=e790]
                      - heading "2.当社の強みについて" [level=4] [ref=e791]
                      - paragraph [ref=e792]: (1)「ユーザー基盤」及び「掲載情報数・クライアント基盤」
                      - paragraph [ref=e793]: ユーザー基盤については、クライアントとの強固な信頼関係による豊富な情報掲載により、ライフスタイルにおける意思決定と親和性の高いユーザーが集まりやすい構造となっております。この結果、当社サービスの年間延べユーザー数は約1億人に達しております。また、掲載情報・クライアント基盤については、ニフティ不動産やニフティ温泉といったプラットフォームサービスにおいて、20年来の事業展開に亘り検討意欲の高いユーザーを送客し続けることで得た信頼に基づき、国内最大級の掲載情報数・クライアント数を誇っております。このユーザー基盤と掲載情報・クライアント基盤との相乗効果が、当社の強みとなります。
                      - paragraph [ref=e794]
                      - paragraph [ref=e795]: (2)「データ基盤」「テクノロジー基盤」「マーケティング基盤」
                      - paragraph [ref=e796]: クライアントとの強固な信頼関係に基づく国内最大級を誇る掲載データに加え、ライフスタイルにおける意思決定と親和性の高いユーザー属性データの保有といったデータ基盤を有しております。テクノロジー基盤につきましては、重複物件の名寄せ処理の実現や独自検索システムによるデータ高速処理、データを活用したUX向上に向けたレコメンド技術、これらを可能とする自社開発組織が強みとなります。
                      - paragraph [ref=e797]: また、マーケティング基盤につきましては、WEB広告に関するノウハウやテクニカルSEO等、デジタルマーケティングに関する対応力に加え、オーガニック集客力の強さにより、成約確度の高いユーザーの獲得・送客が可能となっております。
                      - paragraph [ref=e798]: (3)「カスタマーエンゲージメント基盤」
                      - paragraph [ref=e799]: ニフティ不動産等のプラットフォームサービスで培ってきたユーザー基盤、クライアント基盤に加え、2024年にドアーズ社がグループインしたことで、新たにコールセンター機能が加わりました。これにより、ユーザーとテクノロジー×リアルの両接点でのコミュニケーションが可能になることで、カスタマーエンゲージメントがより活性化されます。この結果、会員基盤の構築・活用が行いやすくなり、新たなデータの獲得が可能となる正の循環が生まれることとなります。
                      - paragraph [ref=e800]
                      - paragraph [ref=e801]: (注)1.UI/UXとは、UIはUser Interfaceの略で、アプリケーションソフトウエアをユーザーが操作する方法のこと。UXはUser Experienceの略で、サービス等の利用を通じてユーザーが得る体験のこと。
                      - paragraph [ref=e802]: 2.SaaSとは、Software as a Serviceの略で、提供者側のサーバーで稼働するソフトウエアをインターネット等を経由して、ユーザーが必要な機能のみを選択して利用できるサービスのこと。
