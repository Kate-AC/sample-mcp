                      - heading "3 【事業の内容】" [level=3] [ref=e1122]
                      - paragraph [ref=e1123]: 当社グループ(株式会社ジャストプランニング及び当社の関係会社)は、株式会社ジャストプランニング(当社)及び連結子会社2社で構成されています。事業内容並びに当社グループの当該事業に係る位置付けは、次のとおりであります。
                      - paragraph [ref=e1124]
                      - paragraph [ref=e1125]: ASP事業
                      - paragraph [ref=e1126]: 当社は、外食企業向けに、インターネットの通信インフラを利用したアプリケーションソフトウエアの提供と、企業の情報システム関連部門が行っているシステムメンテナンス業務及び運用サポート業務等のアウトソーシング業務とを組み合わせた「ASP事業」を行っております。2020年8月に事業譲受したテイクアウト業態向けのスマートフォンアプリケーション「ASP事業(iToGo)」を加え、多様化するマーケットに対して営業力、システム競争力の強化を図っております。
                      - paragraph [ref=e1127]
                      - paragraph [ref=e1128]: システムソリューション事業
                      - paragraph [ref=e1129]: 当社は、外食産業向け本部管理システム・店舗システム・分析システム等のアプリケーションソフトウエアの企画、開発、販売及びPOSシステム、オーダーエントリーシステム等のソリューションの提供及び業務コンサルティングを行っております。
                      - paragraph [ref=e1130]
                      - paragraph [ref=e1131]: 物流ソリューション事業
                      - paragraph [ref=e1132]: 連結子会社の株式会社サクセスウェイは、外食チェーン企業等に対する物流ソリューションやマーチャンダイズソリューション、本部業務代行等のソリューションサービス事業を行っております。
                      - paragraph [ref=e1133]
                      - paragraph [ref=e1134]: 太陽光発電事業
                      - paragraph [ref=e1135]: 連結子会社の株式会社JPパワーは、自社で保有する太陽光発電設備をもとに、太陽光発電による電力会社への売電を行っております。
                      - paragraph [ref=e1136]
                      - paragraph [ref=e1137]: その他事業
                      - paragraph [ref=e1138]: 連結子会社の株式会社JPパワーは、直営の外食店舗を従業員等により運営し、店舗運営ノウハウの社員研修、情報システムの開発、新システムのテストマーケティング等に活用しております。
                      - paragraph [ref=e1139]
                      - paragraph [ref=e1140]: 上記の事項について、事業系統図を示すと次のとおりであります。
