                      - paragraph [ref=e1070]
                      - heading "3 【事業の内容】" [level=3] [ref=e1071]
                      - heading "(1) 事業の内容" [level=4] [ref=e1072]
                      - paragraph [ref=e1073]: 当社グループ(当社及び当社の関係会社)は、当社、連結子会社(石原化美(上海)商貿有限公司、キザイ株式会社)の計3社で構成されており、電子関連分野、自動車用品分野、工業薬品分野の3つの分野で、金属表面処理剤及び機器等、電子材料、自動車用化学製品等、工業薬品の4つの事業を行っております。
                      - paragraph [ref=e1074]
                      - paragraph [ref=e1075]: 当社及び当社の関係会社の事業における当社及び関係会社の位置付け及びセグメントとの関連は、次のとおりであります。なお、以下に示す区分は、セグメントと同一の区分であります。
                      - paragraph [ref=e1076]
                      - heading "(電子関連分野)" [level=4] [ref=e1077]
                      - heading "1 金属表面処理剤及び機器等:" [level=4] [ref=e1078]
                      - paragraph [ref=e1079]: 1 錫系および銅めっき液・・・パソコン、携帯電話、AV機器などは、半導体、コネクター等の電子部品とプリント配線板を内蔵しています。錫系めっき液は、電子部品とプリント配線板を導通が可能な状態で接合する目的で使用し、銅めっき液は、半導体やプリント配線板の微細な回路形成や導通確保を目的として使用します。当社は、この錫系および銅めっき液の開発、製造、販売、アフターサービスを行っております。また、多種多様な材質や形状を有する電子部品やプリント配線板へのめっき条件の設定や、めっき皮膜の評価や改善などの技術的支援、めっき液ラインの管理などユーザーと深くかかわって開発・改良を進めております。
                      - paragraph [ref=e1080]: 2 化成処理液自動管理装置等・・・プリント基板加工時の無電解めっき液やフラットパネル製造時の現像液などの化成処理液を自動的に分析し、不足している薬品を自動的に補給管理する化成処理装置の開発、製造、販売、アフターサービスを行うとともに、これらの機器に使用する試薬の開発、製造、販売も行っております。
                      - heading [level=4]
                      - heading "(主な関係会社)当社、石原化美(上海)商貿有限公司及びキザイ株式会社" [level=6] [ref=e1081]
                      - paragraph [ref=e1082]
                      - paragraph [ref=e1083]: "2 電子材料:"
                      - paragraph [ref=e1084]: マシナブルセラミックス、エンジニアリングプラスチック及び炭素繊維強化プラスチック(以下CFRPという)・・・半導体製造装置及び検査装置の部品等に使用される耐熱性、電気絶縁性の高いマシナブルセラミックス及びエンジニアリングプラスチックを材料として調達し、ユーザーの仕様に合わせて機械加工し、販売しております。
                      - paragraph [ref=e1085]: また、CFRPをウェハーや液晶パネルの搬送装置の部品として販売しております。
                      - paragraph [ref=e1086]
                      - heading "(主な関係会社)当社" [level=6] [ref=e1087]
                      - paragraph [ref=e1088]
                      - heading "(自動車用品分野)" [level=4] [ref=e1089]
                      - paragraph [ref=e1090]: "自動車用化学製品等:"
                      - paragraph [ref=e1091]: 1 自動車用化学製品・・・カーディーラー、自動車整備工場、板金塗装工場、ガソリンスタンド等で使用されるエアコン洗浄剤、ブレーキパーツクリーナーや潤滑剤等整備ケミカル、塗装補修用コンパウンド、艶出し剤、コーティング剤、補修ケミカル、洗車機用洗車剤等自動車アフターマーケット向け業務用ケミカル製品の開発、製造、販売を行っております。
                      - paragraph [ref=e1092]: 2 溶接用スパッター付着防止剤・・・建設機械やビル建設の鉄骨等の電気溶接時にはスパッター(鉄の溶けた粒子)が飛散し、溶接部周辺に溶着すると、上塗り塗装のはがれ、錆の発生原因になり、美観も損ねるなど不具合が生じます。当社は、このスパッターの付着を防止するスパッター付着防止剤の開発、製造、販売、アフターサービスを行っております。
                      - paragraph [ref=e1093]
                      - heading "(主な関係会社)当社及び石原化美(上海)商貿有限公司" [level=6] [ref=e1094]
                      - paragraph [ref=e1095]
                      - heading "(工業薬品分野)" [level=4] [ref=e1096]
                      - heading "工業薬品:" [level=4] [ref=e1097]
                      - paragraph [ref=e1098]: 鉄鋼、化学関連の大手ユーザーの生産工程で使用される特殊性の高い商品や官公庁向け薬剤の仕入販売を行っております。主な商品は、自動車用鋼板等の表面処理剤、触媒、活性炭、水処理剤等であり、その多くは仕入先から販売先に直接発送されます。
