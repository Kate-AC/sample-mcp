                      - heading "3 【事業の内容】" [level=3] [ref=e1094]
                      - paragraph [ref=e1095]: 当社グループは、当社及び連結子会社16社で構成されております。当社は、宮城県公安委員会より認定を受けて(番号:第5号)交通誘導警備を主力とした警備業を主な事業としております。
                      - paragraph [ref=e1096]: 当社及び連結子会社の当該事業に係る位置付け及びセグメントとの関連は次のとおりであります。なお、セグメントと同一の区分であります。
                      - paragraph [ref=e1097]: (1) 警備事業
                      - paragraph [ref=e1098]: 1 交通誘導警備
                      - paragraph [ref=e1099]: 建築現場、工事現場等における工事車両、一般車両及び歩行者の安全な誘導と出入りの管理、各種ショッピングセンター等での駐車場の出入口、歩行者の安全管理等の交通誘導を行うもので、交通事故の発生を防止いたします。当社グループの主力業務であり、交通誘導警備の主なものには交通誘導警備、雑踏(イベント)警備があります。特に大規模な雑踏(イベント)警備は、当社グループの特徴を活かせる分野と位置付けております。
                      - paragraph [ref=e1100]: また、連結子会社の株式会社三洋警備保障、株式会社トスネット北陸、株式会社トスネット北東北、株式会社トスネット南東北、株式会社トスネット上信越、アサヒガード株式会社、株式会社トスネット琉球、北日本警備株式会社、株式会社トップロード及びNEXT株式会社の10社は交通誘導警備を主たる事業としております。
                      - paragraph [ref=e1101]: 2 施設警備
                      - paragraph [ref=e1102]: オフィスビルや工場等の建物内への人の出入管理、防犯防災管理、駐車場の管理を行うものです。施設警備の主なものには常駐警備、巡回警備、巡回留守番警備、保安警備があり、施設警備については、今後、積極的に増大を図るべき分野と位置付けております。
                      - paragraph [ref=e1103]: また、連結子会社の株式会社日本保安は、店内保安、万引き防止業務を行っており、株式会社トスネット首都圏及び株式会社アイワ警備保障の2社は施設警備を主たる事業としております。
                      - paragraph [ref=e1104]: 3 列車見張り警備
                      - paragraph [ref=e1105]: JRや私鉄の営業路線、接近する作業現場での列車の進行、通過を監視して作業員の安全を確保いたします。当社グループが注力している分野であります。
                      - paragraph [ref=e1106]: また、連結子会社の株式会社大盛警備保障は列車見張り警備に特化しております。
                      - paragraph [ref=e1107]: (2) ビルメンテナンス事業
                      - paragraph [ref=e1108]: ビルメンテナンス事業は、連結子会社の株式会社ビルキャストによるビルメンテナンス、清掃業務及び労働者派遣業務を行っております。
                      - paragraph [ref=e1109]: (3) メーリングサービス事業
                      - paragraph [ref=e1110]: メーリングサービス事業は、メール便発送取次業務、販促品・サンプル等の封入・梱包及び発送取次業務等を行っておりましたが、当事業を行っていた株式会社メーリングジャパンの全株式を2025年7月1日付で譲渡したため、同日より連結の範囲から除外しております。これに伴い、2025年7月1日よりメーリングサービス事業を報告セグメントから除外しております。
                      - paragraph [ref=e1111]: (4) 電源供給事業
                      - paragraph [ref=e1112]: 電源供給事業は、連結子会社のI・C・Cインターナショナル株式会社による各種イベント及びコンサート関連の仮設電源の提供、テレビ局関係の中継のバックアップ等、各種電源需要への電源提供業務を行っております。
                      - paragraph [ref=e1113]
