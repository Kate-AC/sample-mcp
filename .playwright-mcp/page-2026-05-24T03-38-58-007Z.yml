                      - paragraph [ref=e1021]
                      - heading "3 【事業の内容】" [level=3] [ref=e1022]
                      - paragraph [ref=e1023]: 当社グループ(当社及び当社の関係会社)は、当社、その他の関係会社2社、連結子会社1社で構成されております。
                      - paragraph [ref=e1024]: 当社及び連結子会社(以下、「当企業集団」という。)は、組織上の事業部門「金融関連部門」、「公共関連部門」及び「産業関連部門」の3つを報告セグメントとしております。「金融関連部門」は金融機関向け、「公共関連部門」は地方公共団体向け、「産業関連部門」は一般事業法人向けのお客さまを対象としており、お客さまのさまざまな情報化ニーズに対して、その企画段階からシステム構築、システム機器販売、システム運用管理まで、総合的な情報サービスを提供しております。
                      - paragraph [ref=e1025]: また、当企業集団は、その他の関係会社である株式会社三井住友フィナンシャルグループ及び同社のグループ会社(以下、「SMBCグループ」という。)において、総合情報サービス会社と位置付けられ、SMBCグループとは、営業取引以外にも資金取引などがあり、緊密な関係にあります。
                      - paragraph [ref=e1026]
                      - paragraph [ref=e1027]: 当企業集団は、次の品目に関係する事業を行っております。
                      - paragraph [ref=e1028]
                      - paragraph [ref=e1029]: (注) 当企業集団は、情報サービスの総合的な提供を事業内容としており、各セグメントとも同一の事業内容でありますので、事業の内容として品目別に区分して開示しております。
                      - paragraph [ref=e1030]
                      - heading "(1) 情報サービス" [level=5] [ref=e1031]
                      - heading "1 システム構築" [level=6] [ref=e1032]
                      - paragraph [ref=e1033]: 当企業集団の主力品目であり、さまざまな業種(金融、公共、製造・流通・サービスなど)のお客さまに対し、アプリケーション・ソフトウェアの受託開発、パッケージソフトの開発・販売などを行っております。
                      - paragraph [ref=e1034]: なお、主要取引先は、SMBCグループ、富士通グループ、金融機関、地方公共団体及び一般事業法人であります。
                      - paragraph [ref=e1035]
                      - heading "2 システム運用管理" [level=6] [ref=e1036]
                      - paragraph [ref=e1037]: クラウドサービスやBPOサービス(*1)、ハウジングサービス(*2)などのデータセンターサービスに加え、データ入力、印刷などを含めたアウトソーシング事業を行っております。
                      - paragraph [ref=e1038]: なお、主要取引先は、SMBCグループ、金融機関、地方公共団体及び一般事業法人であります。
                      - paragraph [ref=e1039]
                      - heading "3 その他の情報サービス" [level=6] [ref=e1040]
                      - paragraph [ref=e1041]: システム基盤やネットワーク環境など、デジタル基盤に関する設計・構築などを行っております。また、上記1、2及び下記(2)の取引先などに対し、コンピューター保守業務などを行っております。
                      - paragraph [ref=e1042]
                      - heading "(2) システム機器販売" [level=5] [ref=e1043]
                      - paragraph [ref=e1044]: 各種コンピューター機器の選定・販売や関連する周辺機器・備品等の販売を行っております。
                      - paragraph [ref=e1045]: 主要仕入先は、富士通Japan株式会社であり、主要販売先は、SMBCグループ、金融機関、地方公共団体及び一般事業法人であります。
                      - paragraph [ref=e1046]
                      - paragraph [ref=e1047]
                      - paragraph [ref=e1048]
                      - paragraph [ref=e1049]
                      - paragraph [ref=e1050]
                      - paragraph [ref=e1051]
                      - paragraph [ref=e1052]
                      - paragraph [ref=e1053]
                      - paragraph [ref=e1054]
                      - paragraph [ref=e1055]
                      - paragraph [ref=e1056]
                      - paragraph [ref=e1057]: "*1 「BPOサービス」とは、Business Process Outsourcingサービスの略で、単なる情報システムのアウトソーシングではなく、お客さまの業務についてその企画・運営から人材の確保まで、一貫して請け負うサービスのことであります。"
                      - paragraph [ref=e1058]: "*2 「ハウジングサービス」とは、ユーザーの通信機器や情報発信用のコンピューター(サーバー)を、回線設備の整った事業者の施設に設置するサービスのことであります。"
                      - paragraph [ref=e1059]
                      - paragraph [ref=e1060]
                      - paragraph [ref=e1061]: 事業の系統図は次のとおりであります。
                      - paragraph [ref=e1063]: （画像は省略されました）
                      - paragraph [ref=e1064]
                      - paragraph [ref=e1065]: (注) 1 (株)三井住友フィナンシャルグループ及び(株)三井住友銀行は、当社のその他の関係会社であります。
                      - paragraph [ref=e1066]: 2 (株)三井住友銀行及び(株)日本総合研究所は、(株)三井住友フィナンシャルグループの連結子会社であります。
                      - paragraph [ref=e1067]: 3 三井住友ファイナンス&リース(株)及び富士通Japan(株)は、当社の法人主要株主であります。
                      - paragraph [ref=e1068]: 4 (株)KCSソリューションズは、当社の連結子会社であります。
                      - paragraph [ref=e1069]: 5 (株)三井住友フィナンシャルグループ、(株)三井住友銀行及び(株)日本総合研究所とは、主に金融関連部門が取引を行っております。
                      - paragraph [ref=e1070]: 6 三井住友ファイナンス&リース(株)とのリース取引については、金融関連部門、公共関連部門、産業関連部門が取引を行っております。
                      - paragraph [ref=e1071]: 7 富士通Japan(株)とは、金融関連部門、公共関連部門、産業関連部門が取引を行っております。
                      - paragraph [ref=e1072]
