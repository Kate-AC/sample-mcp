                      - heading "3【事業の内容】" [level=3] [ref=e833]
                      - paragraph [ref=e834]: 当社グループは化粧品の製造販売と健康食品等の製造販売を主な事業としています。
                      - paragraph [ref=e835]: 当社グループの研究開発、商品開発は当社の研究開発部署が行っております。
                      - paragraph [ref=e836]: 当社グループの生産体制は、化粧品については、主にハーバー株式会社で製造しているほか、ハーバーコスメティクス株式会社及び外部委託会社で製造しております。また、健康食品等についても、ハーバー株式会社で製造するほか、当社グループが指定した仕様で外部業者に製造を委託しております。
                      - paragraph [ref=e837]: 販売体制については、当社は通信販売のほかに、小売・卸売業者向卸売販売や百貨店向販売、直営店舗での販売等を行っております。主力の通信販売の受注は主に北海道札幌市と広島県福山市のコールセンターで行っています。商品の発送は主に千葉県香取郡多古町と広島県福山市の物流センターにおいてハーバーコスメティクス株式会社が行っています。
