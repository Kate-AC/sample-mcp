                      - paragraph [ref=e835]
                      - heading "3 【事業の内容】" [level=3] [ref=e836]
                      - paragraph [ref=e837]: 当社グループは、当社及び子会社5社で構成されており、食品業界を中心に「液体包装の分野において、たゆまぬ研究と実践で培ったノウハウを、『安全、安心、便利』そして『持続可能な社会の実現』のために提供し続けます」を企業の使命として包装フィルムの開発・製造・販売を行っております。
                      - paragraph [ref=e838]: また、液体調味料向けの包装システムとして、内容物・用途に合わせた高機能フィルムと液体粘体の調味料を充填するための液体充填機「DANGAN」を併販し、食品メーカー等の工場で発生する包装のリスクに対するトータルソリューションを提供しております。
                      - heading "(1) 包装フィルムについて" [level=4] [ref=e839]
                      - heading "1 液体充填用フィルム事業" [level=5] [ref=e840]
                      - paragraph [ref=e841]: 主に即席麺の液体スープ、ドレッシングやタレ類、わさび、醤油等を包装するラミネートフィルムの製造販売を行っております。食品工場や流通の過程で発生する液漏れ防止やロスの低減、保存性や易開封性等、お客様のニーズに合わせた高機能なフィルムを提供しております。
                      - heading "2 ラミネート汎用品事業" [level=5] [ref=e842]
                      - paragraph [ref=e843]: 粉末・乾燥物用、トイレタリー・コスメティック関連製品用等のラミネートフィルムの製造販売を行っております。
                      - heading "(2) 包装機械について" [level=4] [ref=e844]
                      - paragraph [ref=e845]: 包装機械事業
                      - paragraph [ref=e846]: 液体充填用フィルムに内容物を充填するための液体充填機「DANGAN」を開発・製造し、液体充填用フィルムとともに食品メーカー等へ販売を行っております。充填速度の高速化と再現性を重視した液体充填機はDANGANシリーズのハイエンドモデル「DANGAN G3」をはじめ、高精度・高生産性を継承しつつ価格を抑えたスタンダードモデル「DANGAN AIII」、必要な基本機能に特化しコストを抑えたエントリーモデル「DANGAN M」をお客様のニーズに合わせ提供しております。
                      - paragraph [ref=e847]: 加えて、当社充填機械のIoT化として、稼働状況の遠隔把握、生産状態の可視化・分析、充填手法やメンテナンス手法の動画閲覧、機械保守管理等の機能を搭載した「H.U.G.Home」により、お客様の液体充填に関わる業務を改善・効率化するとともにDX推進をサポートするクラウドサービスを提供しております。
                      - paragraph [ref=e848]: また、メンテナンス体制の充実やフィールドエンジニアによるアドバイザリーサービスの提供、人材教育支援の一環として合宿研修の開催等オペレーションサポートにも注力しております。
                      - paragraph [ref=e849]
                      - paragraph [ref=e850]: 当社グループの事業内容及び子会社の当該事業に係る位置づけは、次のとおりであります。
