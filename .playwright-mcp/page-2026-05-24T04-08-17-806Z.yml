                    - generic [ref=e1043]:
                      - paragraph [ref=e1044]
                      - heading "3【事業の内容】" [level=3] [ref=e1045]
                      - paragraph [ref=e1046]: 当社グループは、当社(第一カッター興業株式会社)、連結子会社4社(株式会社ウォールカッティング工業、株式会社新伸興業、株式会社アシレ、株式会社ユニペック)、持分法適用関連会社2社(ダイヤモンド機工株式会社、株式会社ムーバブルトレードネットワークス)で構成されております。
                      - paragraph [ref=e1047]: 当社グループでは、切断・穿孔工事事業及びビルメンテナンス事業を展開しており、事業における当社及び関係会社の位置付け及びセグメントとの関連は、次のとおりであります。
                      - paragraph [ref=e1048]: なお、前連結会計年度において、当社の連結子会社であった株式会社ムーバブルトレードネットワークスの一部株式を譲渡したため、同社を連結の範囲から除外し、持分法適用会社としております。これに伴い、当連結会計年度よりリユース・リサイクル事業を報告セグメントから除外しております。
                      - paragraph [ref=e1049]: (1)切断・穿孔工事事業
                      - paragraph [ref=e1050]: 切断・穿孔工事とは、道路等の各種舗装、及びコンクリート構造物の解体、撤去等に必要な切断工事、穿孔工事のことであります。
                      - paragraph [ref=e1051]: 当社グループの切断・穿孔工事事業は、工業用ダイヤモンドを使用したダイヤモンド工法及び、水圧を利用したウォータージェット工法を中心に事業を展開しております。
                      - paragraph [ref=e1052]: 当社グループにおいては、当社、株式会社ウォールカッティング工業、株式会社新伸興業、株式会社アシレ、株式会社ユニペック及びダイヤモンド機工株式会社が切断・穿孔工事事業を行っております。当社は主に東日本全域に、株式会社ウォールカッティング工業は主に東海地方に、株式会社新伸興業は沖縄県に、株式会社アシレは主に関東地方に、株式会社ユニペックは主に近畿地方に、ダイヤモンド機工株式会社は九州地方に営業基盤を有しております。
                      - paragraph [ref=e1053]: 当社グループの切断・穿孔工事事業の事業形態は、主として専門工事業者としての下請契約であり、主要な得意先は総合建設業者、道路建設業者及び設備業者等の民間企業であります。これらの企業は公共事業関連工事を中心に事業展開しており、当社グループの施工する工事も大半が公共事業関連工事であります。一方、公共事業関連工事以外の工事としては、化学工場・石油プラント・発電所等のメンテナンスや洗浄等が挙げられます。
                      - paragraph [ref=e1054]: また、これらを工事の種類別に分類すると、土木工事、建築関連工事、都市土木工事、道路・空港工事、生産設備メンテナンスに分類されます。
                      - paragraph [ref=e1055]: 各工事の分類別の内容については、以下のとおりであります。
                      - paragraph [ref=e1056]: 1土木工事
                      - paragraph [ref=e1057]: 土木工事では、橋梁工事、港湾工事、ダム関連工事といった、大型構造物の補修・撤去工事を行っております。
                      - paragraph [ref=e1058]: 具体的には、橋梁工事においては高架橋切断・撤去、コンクリート片剥離防止対策、橋脚劣化コンクリート除去や表面処理等、港湾工事においては護岸・桟橋の改築に伴う切断・撤去、ダム関連工事においては砂防ダムスリット化、魚道開口構築といった作業を行っております。また、水中など特殊な環境下での切断・穿孔作業の場合にも、専属のオペレーターによる施工をしております。
                      - paragraph [ref=e1059]: 2建築関連工事
                      - paragraph [ref=e1060]: 建築関連工事では、建物解体工事、免震工事、耐震工事、改修工事、新築工事といった、解体・リニューアル工事に伴う各種作業を行っております。
                      - paragraph [ref=e1061]: 具体的には、建物解体工事においてはブロック解体・撤去、建物基礎の静的破壊、免震工事においては免震装置取付の杭切断、耐震工事においては耐震用スリットの構築、改修工事においては各種切断、鉄筋はつり出し、エレベーター改造に伴う機械撤去、外壁洗浄、塗装剥離、床表面処理等、新築工事においては誘発目地、タイル貼り下地処理といった作業を行っております。また、周辺施設への環境負荷軽減にマッチした施工方法で、従来工法では困難な施工でも対応しております。
                      - paragraph [ref=e1062]: 3都市土木工事
                      - paragraph [ref=e1063]: 都市土木工事では、鉄道工事、廃棄物処理施設工事、上下水道施設工事といった、都市基盤施設における土木関連工事を行っております。
                      - paragraph [ref=e1064]: 具体的には、鉄道工事においては階段切断撤去、擁壁ブロック解体・撤去、廃棄物処理施設工事においては煙突内洗浄やダイオキシン類洗浄、上下水道施設工事においてはピット内部劣化コンクリート除去、エポキシ系樹脂塗膜除去といった作業を行っております。また、環境関連工事においては計画立案から施工までトータルで対応しております。
                      - paragraph [ref=e1065]: 4道路・空港工事
                      - paragraph [ref=e1066]: 道路・空港工事では、道路の補修等に伴う各種切断や表面処理、劣化コンクリート除去、空港での滑走路グルービングや灯火設置のためのコアドリリング等作業を行っております。グルービングマシンやコア特装車といった特定条件での切断・穿孔作業が可能な点が当社の特徴になります。
                      - paragraph [ref=e1067]: 5生産設備メンテナンス
                      - paragraph [ref=e1068]: 生産設備メンテナンスでは、工場メンテナンスに伴う各種設備洗浄、改造工事に伴う無火気切断、床の塗り替え、下地処理等を行っております。当社では産業洗浄技能士を常駐させることで、作業の品質と安全を確保しております。
                      - paragraph [ref=e1069]: (2)ビルメンテナンス事業
                      - paragraph [ref=e1070]: ビルメンテナンス事業は、集合住宅やオフィスビル等において、給排水設備の保守点検・貯水槽清掃・雑排水管清掃業務を行うものであり、当社グループにおいては、当社がビルメンテナンス事業を行っております。
                      - paragraph [ref=e1071]: 具体的には、排水管清掃、貯水槽清掃、給水設備点検、床清掃、ファイバースコープ調査、機械式ピット清掃などを通じて、得意先・お客様のビルの円滑な運営に貢献することを目指しております。
                      - paragraph [ref=e1072]
                      - paragraph [ref=e1073]: 事業の系統図は、次のとおりであります。
