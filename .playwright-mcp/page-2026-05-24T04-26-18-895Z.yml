                      - paragraph [ref=e970]
                      - heading "3 【事業の内容】" [level=3] [ref=e971]
                      - paragraph [ref=e972]: 当社グループは、情報サービスを主たる事業とし、情報システムに係るコンサルティングから、業務システムの開発と保守及びITインフラの構築と運用管理に至る一貫したサービスを提供しています。
                      - paragraph [ref=e973]: 当社グループの事業内容を、セグメント別に表すと次のとおりです。
                      - paragraph [ref=e974]
                      - heading "(1) システム開発" [level=4] [ref=e975]
                      - paragraph [ref=e976]: 半導体、エレクトロニクス、金融、情報通信、エンタテインメント、公共・社会、移動・物流、ヘルスケア・メディカルの業種の顧客に対して、ERP、SCM、CRM、MES(Manufacturing Execution System:製造実行システム)、PLM(ProductLifecycle Management:製品ライフサイクル管理)、ビッグデータ分析等のソリューション及び業務システムのコンサルティングから要件定義、設計、開発、保守に至る一連のシステム開発サービスを提供しています。
                      - paragraph [ref=e977]
                      - heading "(2) インフラサービス" [level=4] [ref=e978]
                      - paragraph [ref=e979]: クラウド、ネットワーク、クライアント(PC、スマホ、IoT機器)、セキュリティに関するITインフラソリューションから設計、構築、保守、運用に至る一連のインフラサービスを提供しています。
                      - paragraph [ref=e980]
                      - heading "(3) その他" [level=4] [ref=e981]
                      - paragraph [ref=e982]: 商品販売業務などを行っています。
                      - paragraph [ref=e983]
                      - paragraph [ref=e984]: (注) 「その他」としたセグメントに関しては、「セグメント情報等の開示に関する会計基準」(企業会計基準第17号 平成22年6月30日)及び「セグメント情報等の開示に関する会計基準の適用指針」(企業会計基準適用指針第20号 平成20年3月21日)適用の報告セグメントには含まれない事業セグメントとなっています。
