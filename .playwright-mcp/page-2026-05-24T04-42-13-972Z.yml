                    - generic [ref=e834]:
                      - heading "3【事業の内容】" [level=3] [ref=e835]
                      - paragraph [ref=e836]: 当社グループ(当社及び当社の関係会社)は、「ファイナンステクノロジー(*1)、及びインフォメーションテクノロジー(*2)を融合した『ITプラットフォーム』を提供する」ことを目指す自動車関連事業者向けのクラウド型BPOサービス企業です。
                      - paragraph [ref=e837]: "*1 オートリース事業者等を中心にファイナンス事業者全般を対象にしています。"
                      - paragraph [ref=e838]: "*2 自動車ファイナンス事業者及び自動車販売事業者に必要なシステムの開発並びに提供を行っております。"
                      - paragraph [ref=e839]
                      - paragraph [ref=e840]: 当社グループのビジネスにおいて提供するサービスメニューは、中古車の相場を中心とした情報をフィードバックして構築する、中古車両の価値の評価・算定システムを自動車関連事業者に対して提供する事業を行っております。
                      - paragraph [ref=e841]: 具体的な提供商品としては、
                      - paragraph [ref=e842]: 1 「RV Doctor」
                      - paragraph [ref=e843]: 過去の中古車販売実績で統計学的分析を行い、自動車資産の現在価値算定(時価算定)・将来価値算定(予想売却価格算定)を可能にした当社グループ独自開発の自動車資産評価システム
                      - paragraph [ref=e844]: 2 「PV Doctor」
                      - paragraph [ref=e845]: 将来価値算出のノウハウを活かし、恣意性無く現在の標準的な車両価値(現在価値)を算出するシステム
                      - paragraph [ref=e846]: 3 「車種カタログデータベース」
                      - paragraph [ref=e847]: メーカー/ディーラーオプションの価格、税金等の情報を含む、文字ベースの車のカタログを階層的なデータベースにした車種カタログデータベース
                      - paragraph [ref=e848]: 4 「シスろけっと」
                      - paragraph [ref=e849]: オートリース会社をはじめとしたオートファイナンス事業者に有用な機能をパッケージ化したASPサービス
                      - paragraph [ref=e850]: 5 「CA Doctor」
                      - paragraph [ref=e851]: 当社ソリューションを融合して開発した、新車販売会社向け販売支援システム
                      - paragraph [ref=e852]: 6 CAV Monitor
                      - paragraph [ref=e853]: CAV(=Car Asset Value) の一括算出を提供 過去に設定した残価と現在の車両価値を照らし合わすことで、リスクの見える化を実現
                      - paragraph [ref=e854]: 7 「インターネット/イントラネット用残価付ファイナンス見積提案システム」
                      - paragraph [ref=e855]: 「RV Doctor」「車種カタログデータベース」をベースにして、車両の将来価値(残価)を見込んだファイナンス見積作成をネットワーク上で提供するシステム等があります。
                      - paragraph [ref=e856]
                      - paragraph [ref=e857]: 当社グループは2025年3月31日現在、当社のほか連結子会社3社及び持分法適用関連会社1社により構成されております。連結子会社及び持分法適用関連会社の位置付けは以下のとおりです。
                      - paragraph [ref=e858]: 連結子会社であるInspiration株式会社は、自動車販売店向けソリューション事業を行っております。ジェイ・コア株式会社は、休眠会社となっており、現在、事業活動は行っておりません。ValuAble Co., Ltd.は韓国に設立した合弁会社(出資比率80.0%)で韓国における自動車コンテンツ開発事業及び自動車関連事業者向けシステムサービス事業の展開を図っています。また、持分法適用関連会社である株式会社エヴリス(出資比率24.5%)は国内における自動車リース・レンタル取扱店の加盟募集や加盟店へのコンサルティング等を行っております。
