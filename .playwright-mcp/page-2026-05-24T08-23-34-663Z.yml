              - generic [ref=e1111]:
                - tabpanel [ref=e1112]:
                  - generic [ref=e1113]:
                    - generic [ref=e1114] [cursor=pointer]: 続きを読む
                    - generic [ref=e1115]:
                      - paragraph [ref=e1116]
                      - heading "3 【事業の内容】" [level=3] [ref=e1117]
                      - paragraph [ref=e1118]: 当社グループ(当社及び当社の関係会社)は、当社、連結子会社(旭テック(株)、ラサ・リアルエステート(株))、関連会社(大平洋機工(株))の計4社で構成されており、資源・金属素材関連事業、産機・建機関連事業、環境設備関連事業、化成品関連事業、プラント・設備工事関連事業及び不動産賃貸関連事業の6事業を柱に事業を展開しております。
                      - paragraph [ref=e1119]: 当社グループの事業における当社及び当社の関係会社の位置付け及びセグメントとの関連は、次のとおりであります。なお、以下に示す区分は、セグメントと同一の区分であります。
                      - paragraph [ref=e1120]
                      - paragraph [ref=e1121]: 〔資源・金属素材関連〕
                      - paragraph [ref=e1122]: ジルコンサンドを中心とする鉱産物、その他物資等の輸出入及び販売を行っております。ジルコンサンドは世界有数のミネラルサンド(注)の生産会社であるアイルカ社(オーストラリア)と日本における総販売代理店契約を締結しており、商品を安定的に確保し販売しております。ジルコンサンドの用途は耐火材、鋳造用部材、セラミックス製品原料、研磨材原料、電子材料等広い用途に供給されているほか、ジルコニウム化合物として自動車用部材やファインセラミックス等にも用途が広がっております。
                      - paragraph [ref=e1123]: 近年は、チタン関連素材、アルミナ等の輸入拡大を図っており、主に溶接材料、耐火物原料、セラミックス向け原料として、国内各社へ販売しております。
                      - paragraph [ref=e1124]: (注) ミネラルサンドとは砂状の鉱産物のことです。
                      - paragraph [ref=e1125]
                      - paragraph [ref=e1126]: 〔産機・建機関連〕
                      - paragraph [ref=e1127]: 産機関連では、顧客のニーズに合わせて、水からスラリー液(注)、腐食性液、高濃度・高粘性液まで広範囲の流体に対応できる流送機器等の販売・メンテナンス等を行っております。国内外の多くの機械メーカーと総販売代理店契約を締結しており、顧客のニーズを踏まえてメーカーと連携し新商品の開発や製品の改善等に取り組んでおります。
                      - paragraph [ref=e1128]: なお、大平洋金属株式会社の旧習志野機械工場である大平洋機工株式会社には当社も出資しており、同社と総販売代理店契約を締結し同社製品の販売等を行っております。
                      - paragraph [ref=e1129]: 当社グループは顧客の立場に立ち、メンテナンスが容易で長期間の使用が可能なものを取扱い商品の中心としております。特に、主力のワーマンポンプ(大平洋機工株式会社製)は必要部品の交換により長期に使用できるだけでなく、ポンプの分解・組立が容易で、工場に持ち込まずにその場で簡単にメンテナンスを行うことができる点に加え、取扱溶液の性状に適応した様々な材質を選定して組立てられる特長を有しております。1959年オーストラリア・ワーマン社(現ウィアーミネラルズオーストラリア社)より日本導入以来60年以上にわたり、耐食・耐磨耗ポンプのトップクラスのシェアを維持し、時代の変遷はあっても製鉄、精錬等の素材産業から半導体、パネル等のIT関連企業まで幅広く使用されております。
                      - paragraph [ref=e1130]: 建機関連では各種小型建設機械、耐震管敷設用機器の販売、シールド掘進機及び関連機器等の販売・レンタル・メンテナンス等を行っております。
                      - paragraph [ref=e1131]: (注) スラリー液とは固形物を含む液体のことです。
                      - paragraph [ref=e1132]
                      - paragraph [ref=e1133]: 〔環境設備関連〕
                      - paragraph [ref=e1134]: ドイツより優れた性能を持つ高圧ポンプ群(プツマイスター社製ピストンポンプ、フェルバ社製ダイアフラムポンプ、ウラカ社製プランジャーポンプ)を輸入し、バイオガス発電・下水汚泥・産業廃棄物処理・高濃度スラリー送り・表面処理の用途に国内で販売を行っておりますが、これらの高性能高圧ポンプを利用した新技術を提案し、環境分野での新しい販路拡大を図っております。
                      - paragraph [ref=e1135]: また、当社が独自技術を保有する水砕スラグ製造設備「ラサ・システム」の販売及び既存システムの改修・改造にも積極的に取組んでおります。
                      - paragraph [ref=e1136]: 同システムは製鉄所の高炉(溶鉱炉)から銑鉄生産時に副産物として発生する溶融スラグを高圧水で粒状化(水砕化)する設備で、スラグ中に含まれる硫化水素の大気中への飛散を減少させるとともに、セメント原料として資源の再利用に貢献しております。国内の製鉄所のみならず海外にもプラントを多数納入している実績があります。
                      - paragraph [ref=e1137]
                      - paragraph [ref=e1138]
                      - paragraph [ref=e1139]: 〔化成品関連〕
                      - paragraph [ref=e1140]: 合成樹脂・化成品関連の事業であり、自動車関連をはじめ、建材、電気、電子分野などの幅広い業界に多種多様な合成樹脂・化学製品を販売しております。
                      - paragraph [ref=e1141]
                      - paragraph [ref=e1142]: 〔プラント・設備工事関連〕
                      - paragraph [ref=e1143]: 石油精製、石油化学、ガス関連、クリーンルーム関連、各種工場関連、都市部大型空調設備関連等の多種多様な分野のプラント及び関連工事に係る設計、施工及びメンテナンス工事を主たる事業としております。また、プラント及び関連工事の中でも配管工事及び動機械仕上工事(注)を得意としており、自社工場での加工率を高め、現場作業を削減し、高品質で低コストの工事を提供しております。
                      - paragraph [ref=e1144]: 2017年3月に稼動した新工場は、取引先の認知度も上がり、水分を嫌う配管工事や特殊材質の配管工事、大径管のプレファブなど工事規模を最大限に活かした受注をしており、同業他社との差別化を図っております。
                      - paragraph [ref=e1145]: (注) 動機械仕上工事とは、ポンプやコンプレッサー等の組立やメンテナンスのことです。
                      - paragraph [ref=e1146]
                      - paragraph [ref=e1147]: 〔不動産賃貸関連〕
                      - paragraph [ref=e1148]: 当社グループで保有する不動産を有効活用し、賃貸収益を確保しております。保有している物件は、付加価値の高い都市部で好条件のものが中心であり、堅実かつ優良なテナントへ賃貸しております。
