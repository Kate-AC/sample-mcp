                  - generic [ref=e451]:
                    - generic [ref=e452] [cursor=pointer]: 続きを読む
                    - generic [ref=e453]:
                      - paragraph [ref=e454]
                      - heading "3 【事業の内容】" [level=3] [ref=e455]
                      - paragraph [ref=e456]: 当社グループは、当社と連結子会社(株式会社アペックス・その他3社)の5社で構成されており、通信販売および、通信販売会社・小売店等への卸売を行うウェルネス事業、自社不動産を利用した不動産賃貸や出荷受託等を行うロジスティクス事業を展開しております。当社グループの各事業間において、一部、取扱商品や販売チャネルの共有をしております。
                      - paragraph [ref=e457]: なお、次の2つの事業区分は「第5 経理の状況 1 連結財務諸表等 (1) 連結財務諸表 注記事項」に掲げるセグメントの区分と同一であります。
                      - paragraph [ref=e458]
                      - paragraph [ref=e459]: セグメント区分につきましては、グループ経営の効率化を図るため、セグメントの範囲について経営管理区分の見直しを行い、従来、「卸売事業」及び「小売事業」に区分されていた事業を「ウェルネス事業」に統合、従来の「プロパティ事業」の呼称を「ロジスティクス事業」に変更し、報告セグメントを3つから2つに変更いたしました。前連結会計年度のセグメント情報は、変更後の報告セグメントの区分及び呼称に基づいて作成したものを開示しております。
                      - paragraph [ref=e460]
                      - paragraph [ref=e461]: 「ウェルネス事業」
                      - paragraph [ref=e462]: (当社)
                      - paragraph [ref=e463]: 当社は、株式保有により連結子会社を統括するとともに、主に自社企画した健康茶、健康食品、化粧品をカタログ、インターネット等を通じ、個人消費者に通信販売を行う事業を営んでおります。「いつまでも健康・いつまでもキレイ」をコンセプトに、健康及び美容関連商品を中心とした商品を開発しており、特に、製造業で培った製造加工のノウハウを活かし、原料調達や製造工程を含めた商品企画により独自性が高い商品の企画力を強みとしております。
                      - paragraph [ref=e464]
                      - paragraph [ref=e465]: (株式会社アペックス)
                      - paragraph [ref=e466]: 株式会社アペックスは、ヘルスケア商品、生活雑貨、寝具、化粧品等を国内外のメーカーから仕入れ、主にテレビショッピングやカタログ販売などを展開する通信販売会社への卸売事業を営んでおります。「New Value Creation」をコンセプトに、ワンランク上の商品構成を特徴とするほか、テレビショッピングを展開する通信販売会社に対しては、商品開発から販売方法までのプロデュースを実施し、カタログ通信販売会社等には、客層や掲載時期にあわせた商品の提案を行うといった企画力が強みとなっております。
                      - paragraph [ref=e467]
                      - paragraph [ref=e468]: 「ロジスティクス事業」
                      - paragraph [ref=e469]: (当社)
                      - paragraph [ref=e470]: 当社は、当社が所有する不動産を活用した不動産賃貸や、出荷業務の請負等を展開しております。
                      - paragraph [ref=e471]
                      - paragraph [ref=e472]: "[事業系統図]"
