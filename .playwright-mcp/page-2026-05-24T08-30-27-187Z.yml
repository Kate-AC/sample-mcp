                      - paragraph [ref=e979]
                      - heading "3 【事業の内容】" [level=3] [ref=e980]
                      - paragraph [ref=e981]: 当社グループは、当社と子会社15社で構成されており、創業以来の主力事業である「寝具・リビング用品事業」のほか、「不動産賃貸事業」を行っております。当社は子会社を管理・統括する持株会社であります。当社グループ事業におけるセグメント区分並びに主要子会社の事業内容は次のとおりであります。
                      - paragraph [ref=e982]
                      - paragraph [ref=e984]: （画像は省略されました）
                      - paragraph [ref=e985]
                      - paragraph [ref=e986]: (注)当社は特定上場会社等に該当し、インサイダー取引規制の重要事実の軽微基準のうち、上場会社の規模との対比で定められる数値基準については連結ベースの計数に基づいて判断することとなります。
                      - paragraph [ref=e987]
                      - paragraph [ref=e988]: (1) 寝具・リビング用品事業
                      - paragraph [ref=e989]: 当社グループは、企業理念に基づき、寝具・リビング用品の製品企画・原材料調達・製造・品質管理・物流・販売・関連サービスを一貫して行っております。
                      - paragraph [ref=e990]: 寝具・リビング用品は、ダイレクトセールス用、卸売用、レンタル用、ホテル・旅館向け用にと、販売形態ごとに製造しております。主力製品のうち、羽毛ふとんについては、ふとんの側(がわ)生地加工を主にラオス工場にて行い、羽毛投入は国内工場で行っております。敷きふとんについては、主にラオス工場で製造しております。ムートン製品については主に海外外注先より調達しております。なお、これらの主力製品の最終工程、製品検査等を国内工場にて行うなど、原材料の調達・加工から製品の仕上げまで当社グループが一貫してマネジメントし、クオリティの高い眠りを追求しております。今後も国内工場と海外工場を棲み分けながら、高品質かつ効率的な生産体制を構築してまいります。
                      - paragraph [ref=e991]: 製品企画においては、製品企画部門が営業等の関連部署と情報交換を行うほか、お客様に直接、使用感やご意見を伺うことによって、製品の開発及び改良に反映させていくことが可能となっております。また、寝具以外の住宅関連用品等については関連メーカー各社と提携し、ダイレクトセールスの特性を活かした潜在需要商品の拡充に努めております。
                      - paragraph [ref=e992]: 関連サービスにおいては、ふとんの洗浄・シミ抜き等を行うクリーニング並びにお客様が長年使用された羽毛ふとんの側生地を張り替え羽毛ふとんを再生させるリフレッシュを提供しております。また、お客様のご要望に応じてクリーニング後の保管サービスも行っております。さらに、不要ふとんについては、素材ごとに分別した後、固形燃料(注)や再生原材料へと転化させるリサイクルを行っております。最終処分まで行うことで環境への負荷を低減するほか、使用後のふとんの状態を検証することで製品開発にもつなげております。
                      - paragraph [ref=e993]: ダイレクトセールス以外においては、個人のみならず法人や公的機関など、多様なお客様のニーズにお応えすべく総合メーカーとしての体制を構築しております。お取引先様に合わせたオリジナル商品の受注生産をはじめ、寝具のOEM生産や羽毛原料販売、レンタルやクリーニング等の関連サービスも提供しており、量販店や通販会社への卸売、全国各地のホテル・旅館、各種宿泊施設においてのご利用など幅広くお取引をいただいております。
                      - paragraph [ref=e994]: (注)温室栽培でハイブリッドボイラー(重油と固形燃料を併用したボイラー)の燃料として使用し、そこで収穫したメロンをお客様等への粗品として提供しているほか、自社グループ工場にて重油ボイラーと併用して固形燃料ボイラーを稼働させ、効率的に熱源供給を行っております。
                      - paragraph [ref=e995]
                      - paragraph [ref=e996]: (2) 不動産賃貸事業
                      - paragraph [ref=e997]: 当社グループが所有する不動産を賃貸する事業であります。主な賃貸不動産としては、丸八新横浜ビル(神奈川県横浜市)、丸八青山ビル(東京都港区)、パークウェスト(東京都新宿区)、調布建て貸し用ホテル(東京都調布市)、町田建て貸し用ホテル(東京都町田市)があります。
                      - paragraph [ref=e998]
