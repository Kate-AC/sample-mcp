                      - paragraph [ref=e1012]
                      - heading "3 【事業の内容】" [level=3] [ref=e1013]
                      - paragraph [ref=e1014]: 当社グループは、当社及び連結子会社3社で構成されており、主に「CRIWARE®(シーアールアイウェア)」及び「OPTPiX(オプトピクス)」というブランドでソフトウェア製品の許諾販売を行っております。また、許諾販売に関連する受託開発や音響制作等も行っております。
                      - paragraph [ref=e1015]: 各セグメントの事業内容と主要な関係会社は以下のとおりであります。
                      - paragraph [ref=e1016]
                      - paragraph [ref=e1017]: (ゲーム事業)
                      - paragraph [ref=e1018]: 主にゲーム業界向けに、ゲーム開発をスムーズかつ効率的に行うための音声・映像関連ミドルウェア(※)の提供や、画像最適化ソリューションの提供、音響制作等を行っております。
                      - paragraph [ref=e1019]: 取り扱う主な会社:当社、株式会社ツーファイブ、上海希艾維信息科技有限公司
                      - paragraph [ref=e1020]
                      - paragraph [ref=e1021]: (エンタープライズ事業)
                      - paragraph [ref=e1022]: ゲーム事業で培った音声・映像関連の技術を活かし、主にゲーム業界以外の業界向けに、音声・映像関連ミドルウェアやソリューションの提供、関連する受託開発等を行っております。特に、モビリティ分野や、カラオケ機器、家電・IoT機器などの組込み分野、Web動画や静止画等に係る技術を取り扱うクラウドソリューション分野に注力しております。
                      - paragraph [ref=e1023]: 取り扱う主な会社:当社
                      - paragraph [ref=e1024]
                      - paragraph [ref=e1025]: ※ ミドルウェアとは、ハードウェアやOSと、アプリケーションソフトウェアとの中間(ミドル)に位置するソフトウェアをいいます。ミドルウェアは、ハードウェアやOSの特性を押さえながら違いを吸収し、その上で実行されるアプリケーションソフトウェアの動作や開発をスムーズにし、クオリティの向上、開発工数の削減、開発期間の短縮、開発難易度の低減などの効果を生みます。また、アプリケーションを多くのプラットフォームに展開し易くし、顧客のビジネス拡大にも貢献します。
                      - paragraph [ref=e1026]
                      - paragraph [ref=e1027]: 事業の系統図は、次のとおりであります。
