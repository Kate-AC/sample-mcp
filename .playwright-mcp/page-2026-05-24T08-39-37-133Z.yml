                        - rowgroup [ref=e1083]:
                          - row "Object Browser 事業 データベース開発支援ツール SI Object Browser SI Object Browser ER 「SI Object Browser」は、主にIT業界のユーザーを対象にしたデータベース開発支援ツールです。Oracle、SQL Serverなど主要なデータベースに対応しており、GUI操作でテーブルの閲覧、SQLの編集・実行やオブジェクトの生成を簡単に行うことができます。 「SI Object Browser ER」は、主にIT業界のユーザーを対象にしたデータベース設計ツールです。GUI操作でER図を作成し、データベース連携によるテーブルの作成、ER図の逆生成などデータベース設計に必要な機能を提供します。Object Browser シリーズを利用することでデータベース開発の生産性が飛躍的に向上します。" [ref=e1084]:
                            - cell "Object Browser 事業" [ref=e1085]:
                              - paragraph [ref=e1086]: Object Browser
                              - paragraph [ref=e1087]: 事業
                            - cell "データベース開発支援ツール SI Object Browser SI Object Browser ER" [ref=e1088]:
                              - paragraph [ref=e1089]: データベース開発支援ツール
                              - paragraph [ref=e1090]: SI Object Browser
                              - paragraph [ref=e1091]: SI Object Browser ER
                            - cell "「SI Object Browser」は、主にIT業界のユーザーを対象にしたデータベース開発支援ツールです。Oracle、SQL Serverなど主要なデータベースに対応しており、GUI操作でテーブルの閲覧、SQLの編集・実行やオブジェクトの生成を簡単に行うことができます。 「SI Object Browser ER」は、主にIT業界のユーザーを対象にしたデータベース設計ツールです。GUI操作でER図を作成し、データベース連携によるテーブルの作成、ER図の逆生成などデータベース設計に必要な機能を提供します。Object Browser シリーズを利用することでデータベース開発の生産性が飛躍的に向上します。" [ref=e1092]:
                              - paragraph [ref=e1093]: 「SI Object Browser」は、主にIT業界のユーザーを対象にしたデータベース開発支援ツールです。Oracle、SQL Serverなど主要なデータベースに対応しており、GUI操作でテーブルの閲覧、SQLの編集・実行やオブジェクトの生成を簡単に行うことができます。
                              - paragraph [ref=e1094]: 「SI Object Browser ER」は、主にIT業界のユーザーを対象にしたデータベース設計ツールです。GUI操作でER図を作成し、データベース連携によるテーブルの作成、ER図の逆生成などデータベース設計に必要な機能を提供します。Object Browser シリーズを利用することでデータベース開発の生産性が飛躍的に向上します。
                          - row "プロジェクト管理ツール OBPM Neo 「OBPM Neo」は、主にIT業界のユーザーを対象にしたプロジェクト管理ツールです。PMBOKに準拠した統合管理機能で、プロジェクト毎の品質(Q)、コスト(C)、進捗(D)を管理することができます。また、全てのプロジェクトの状況を俯瞰的に把握する機能によりプロジェクトの異常値を早期に発見し改善することができます。 「OBPM Neo」は現場から経営層まで、プロジェクトに関わる全てのメンバーの生産性を高めることができます。" [ref=e1095]:
                            - cell "プロジェクト管理ツール OBPM Neo" [ref=e1096]:
                              - paragraph [ref=e1097]: プロジェクト管理ツール
                              - paragraph [ref=e1098]: OBPM Neo
                            - cell "「OBPM Neo」は、主にIT業界のユーザーを対象にしたプロジェクト管理ツールです。PMBOKに準拠した統合管理機能で、プロジェクト毎の品質(Q)、コスト(C)、進捗(D)を管理することができます。また、全てのプロジェクトの状況を俯瞰的に把握する機能によりプロジェクトの異常値を早期に発見し改善することができます。 「OBPM Neo」は現場から経営層まで、プロジェクトに関わる全てのメンバーの生産性を高めることができます。" [ref=e1099]:
                              - paragraph [ref=e1100]: 「OBPM Neo」は、主にIT業界のユーザーを対象にしたプロジェクト管理ツールです。PMBOKに準拠した統合管理機能で、プロジェクト毎の品質(Q)、コスト(C)、進捗(D)を管理することができます。また、全てのプロジェクトの状況を俯瞰的に把握する機能によりプロジェクトの異常値を早期に発見し改善することができます。
                              - paragraph [ref=e1101]: 「OBPM Neo」は現場から経営層まで、プロジェクトに関わる全てのメンバーの生産性を高めることができます。
                          - row "ERP事業 統合型Web-ERP GRANDIT 「GRANDIT」は、コンソーシアム方式により開発した国内初の「完全Web-ERP」製品です。全操作がブラウザのみで利用可能となっています。ワークフロー、BI(ビジネスインテリジェンス)、EC等の拡張機能を標準搭載、内部統制対応や多通貨機能、マルチカンパニー、柔軟な組織変更への対応など、企業活動に必要な機能を豊富に盛り込んだERPパッケージです。 当社は、製造業向け生産管理アドオンモジュールや建設・ソフトウエア業向け工事管理アドオンモジュールなど、独自モジュールを開発し、コンソーシアムメンバーの中核として導入企業を拡大しています。" [ref=e1102]:
                            - cell "ERP事業" [ref=e1103]:
                              - paragraph [ref=e1104]: ERP事業
                            - cell "統合型Web-ERP GRANDIT" [ref=e1105]:
                              - paragraph [ref=e1106]: 統合型Web-ERP
                              - paragraph [ref=e1107]: GRANDIT
                            - cell "「GRANDIT」は、コンソーシアム方式により開発した国内初の「完全Web-ERP」製品です。全操作がブラウザのみで利用可能となっています。ワークフロー、BI(ビジネスインテリジェンス)、EC等の拡張機能を標準搭載、内部統制対応や多通貨機能、マルチカンパニー、柔軟な組織変更への対応など、企業活動に必要な機能を豊富に盛り込んだERPパッケージです。 当社は、製造業向け生産管理アドオンモジュールや建設・ソフトウエア業向け工事管理アドオンモジュールなど、独自モジュールを開発し、コンソーシアムメンバーの中核として導入企業を拡大しています。" [ref=e1108]:
                              - paragraph [ref=e1109]: 「GRANDIT」は、コンソーシアム方式により開発した国内初の「完全Web-ERP」製品です。全操作がブラウザのみで利用可能となっています。ワークフロー、BI(ビジネスインテリジェンス)、EC等の拡張機能を標準搭載、内部統制対応や多通貨機能、マルチカンパニー、柔軟な組織変更への対応など、企業活動に必要な機能を豊富に盛り込んだERPパッケージです。
                              - paragraph [ref=e1110]: 当社は、製造業向け生産管理アドオンモジュールや建設・ソフトウエア業向け工事管理アドオンモジュールなど、独自モジュールを開発し、コンソーシアムメンバーの中核として導入企業を拡大しています。
                          - row "ERP事業 クラウドERPソリューション SAP S/4HANA® Cloud Public Edition 「SAP S/4HANA® Cloud Public Edition」は、SAPジャパン株式会社が提供している、業界別ベストプラクティスに沿って構築されたクラウド型ERPです。 ベストプラクティスに合わせて導入する「Fit to Standard」の手法を採ることで不要な開発をなくし、短期間で業務効率化を実現できるだけでなく、組み込みの人工知能(AI)、機械学習(ML)、アナリティクスに関するイノベーションが継続的に提供されるため、少ないITリソースで事業の継続的な成長をサポートできます。" [ref=e1111]:
                            - cell "ERP事業" [ref=e1112]:
                              - paragraph [ref=e1113]: ERP事業
                            - cell "クラウドERPソリューション SAP S/4HANA® Cloud Public Edition" [ref=e1114]:
                              - paragraph [ref=e1115]: クラウドERPソリューション
                              - paragraph [ref=e1116]:
                                - text: SAP S/4HANA
                                - superscript [ref=e1117]: ®
                                - text: Cloud Public Edition
                            - cell "「SAP S/4HANA® Cloud Public Edition」は、SAPジャパン株式会社が提供している、業界別ベストプラクティスに沿って構築されたクラウド型ERPです。 ベストプラクティスに合わせて導入する「Fit to Standard」の手法を採ることで不要な開発をなくし、短期間で業務効率化を実現できるだけでなく、組み込みの人工知能(AI)、機械学習(ML)、アナリティクスに関するイノベーションが継続的に提供されるため、少ないITリソースで事業の継続的な成長をサポートできます。" [ref=e1118]:
                              - paragraph [ref=e1119]:
                                - text: 「SAP S/4HANA
                                - superscript [ref=e1120]: ®
                                - text: Cloud Public Edition」は、SAPジャパン株式会社が提供している、業界別ベストプラクティスに沿って構築されたクラウド型ERPです。
                              - paragraph [ref=e1121]: ベストプラクティスに合わせて導入する「Fit to Standard」の手法を採ることで不要な開発をなくし、短期間で業務効率化を実現できるだけでなく、組み込みの人工知能(AI)、機械学習(ML)、アナリティクスに関するイノベーションが継続的に提供されるため、少ないITリソースで事業の継続的な成長をサポートできます。
                          - row "生産スケジューラー Asprova 「Asprova」は、アスプローバ株式会社が提供している、国内シェアトップの生産スケジューラーです。設備や人員の負荷を加味しながら、機械や作業員それぞれの稼働スケジュールを秒単位の高精度で素早く作成することで生産計画を最適化することが可能となります。 当社は、2016年から「GRANDIT」と連携させたソリューションとして提供してきました。さらに、統合化BOMやMES、AI外観検査などのソリューションと組み合わせて、工場のスマート化を支援しております。" [ref=e1122]:
                            - cell "生産スケジューラー Asprova" [ref=e1123]:
