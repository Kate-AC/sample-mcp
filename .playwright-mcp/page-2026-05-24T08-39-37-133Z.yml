                          - row "生産管理システム mcframe 「mcframe」は、ビジネスエンジニアリング株式会社が日本の製造業の業務ノウハウを結集して開発した、日本発の基幹ソリューションパッケージです。サプライチェーン管理(SCM:生産管理・販売管理)と原価管理(PCM)のモジュールで構成され、企業の規模に合わせて最適な導入が可能です。" [ref=e1129]:
                            - cell "生産管理システム mcframe" [ref=e1130]:
