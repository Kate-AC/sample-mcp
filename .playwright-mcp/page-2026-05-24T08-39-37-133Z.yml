                      - heading "3【事業の内容】" [level=3] [ref=e1059]
                      - paragraph [ref=e1060]: 当社グループ(当社及び当社の関係会社)は、当社及び連結子会社1社で構成されており、「Object Browser事業」「ERP事業」「AI事業」の3つの事業を行っております。
                      - paragraph [ref=e1061]
                      - paragraph [ref=e1062]: また、当社グループはそれぞれの事業において、自社ソフトウエアの開発・販売に加え、他社製品の販売も行い、お客さまの業務や課題に合わせた最適な製品を提供しております。
                      - paragraph [ref=e1063]: 「Object Browser事業」は、データベース開発支援ツール「SI Object Browser」シリーズ及びプロジェクト管理パッケージ「OBPM Neo」といった、利益率の高い自社製品を取り扱っています。
                      - paragraph [ref=e1064]:
                        - text: 「ERP事業」は、売上拡大の牽引事業として、ERPパッケージの「GRANDIT」及び「SAP S/4HANA
                        - superscript [ref=e1065]: ®
                        - text: Cloud Public Edition」、それに製造業向けに生産スケジューラー「Asprova」及び生産管理システム「mcframe」を取り扱い、お客様のニーズに合わせてカスタマイズを行っています。新規事業の「AI事業」では、AI異常検知システム「AISIA Anomaly Detection」を取り扱っています。
                      - paragraph [ref=e1066]: このように、当社グループは高収益事業、売上牽引事業及び新規事業の事業特性をバランスさせ、市場環境の変化に対応しております。
                      - paragraph [ref=e1067]
                      - paragraph [ref=e1068]: 当社グループの事業内容における事業区分と取扱製品は、以下のとおりです。なお、事業区分と「第5 経理の状況 1 連結財務諸表等 (1)連結財務諸表 注記事項(セグメント情報等)」に掲げる報告セグメント区分は同一です。また、当連結会計年度より報告セグメントの区分を変更しております。詳細は「第5 経理の状況 1 連結財務諸表等 (1)連結財務諸表 注記事項(セグメント情報等)」に記載のとおりです。
                      - table [ref=e1070]:
                        - rowgroup [ref=e1075]:
                          - row "事業区分 主要な取扱製品 製 品 内 容" [ref=e1076]:
                            - cell "事業区分" [ref=e1077]:
                              - paragraph [ref=e1078]: 事業区分
                            - cell "主要な取扱製品" [ref=e1079]:
