                              - paragraph [ref=e1132]: mcframe
                            - cell "「mcframe」は、ビジネスエンジニアリング株式会社が日本の製造業の業務ノウハウを結集して開発した、日本発の基幹ソリューションパッケージです。サプライチェーン管理(SCM:生産管理・販売管理)と原価管理(PCM)のモジュールで構成され、企業の規模に合わせて最適な導入が可能です。" [ref=e1133]:
                              - paragraph [ref=e1134]: 「mcframe」は、ビジネスエンジニアリング株式会社が日本の製造業の業務ノウハウを結集して開発した、日本発の基幹ソリューションパッケージです。サプライチェーン管理(SCM:生産管理・販売管理)と原価管理(PCM)のモジュールで構成され、企業の規模に合わせて最適な導入が可能です。
                          - row "AI事業 AI異常検知システム AISIA Anomaly Detection 「AISIA Anomaly Detection(アイシアAD)」は、ディープラーニングを使った異常検知システムで、工場内での人間による目視検査を、AIにより自動検知するシステムです。" [ref=e1135]:
                            - cell "AI事業" [ref=e1136]:
                              - paragraph [ref=e1137]: AI事業
                            - cell "AI異常検知システム AISIA Anomaly Detection" [ref=e1138]:
                              - paragraph [ref=e1139]: AI異常検知システム
                              - paragraph [ref=e1140]: AISIA Anomaly Detection
                            - cell "「AISIA Anomaly Detection(アイシアAD)」は、ディープラーニングを使った異常検知システムで、工場内での人間による目視検査を、AIにより自動検知するシステムです。" [ref=e1141]:
                              - paragraph [ref=e1142]: 「AISIA Anomaly Detection(アイシアAD)」は、ディープラーニングを使った異常検知システムで、工場内での人間による目視検査を、AIにより自動検知するシステムです。
                      - paragraph [ref=e1143]
                      - paragraph [ref=e1144]: 当社グループの主な取扱製品とサービス領域は以下のとおりです。
                      - paragraph [ref=e1145]: (1)パッケージソフトウエアの企画・開発
                      - paragraph [ref=e1146]: 当社グループは、独創的なパッケージソフトウエアを社内で企画・開発し、これを顧客に販売しています。これには時間も費用もかかりますが、自社製品であり仕入が不要であるため高い利益率を確保することができます。また、当社グループでは、顧客への直接販売と販売代理店を経由した間接販売とを併用しています。
                      - paragraph [ref=e1147]
                      - paragraph [ref=e1148]: (2)パッケージソフトウエアの導入コンサルティング
                      - paragraph [ref=e1149]: 当社グループの取扱製品は、企業の基幹業務にかかわるものが多いため、顧客が日常業務の中で製品をいかに使いこなして生産性・効率性を高められるかが重要になります。そのため、既存業務の課題や業務フロー、運用ルールなど、長年のノウハウに基づくコンサルティングを行っています。
                      - paragraph [ref=e1150]
                      - paragraph [ref=e1151]: (3)パッケージソフトウエアのカスタマイズ開発
                      - paragraph [ref=e1152]: 当社グループは、顧客の要望に合わせてパッケージソフトウエアをカスタマイズ開発により変更することも行っております。純粋なオーダーメイド開発に比べると、パッケージに関連するノウハウを幅広く再利用でき、提案から設計、開発、導入に至るまで、コストを抑えることが可能です。
                      - paragraph [ref=e1153]: 当社グループが取り扱っているパッケージソフトウエア製品は、いずれもカスタマイズがなくても利用可能ですが、基幹業務にかかわるソフトウエアでは、顧客の業務に合わせたカスタマイズが発生するケースが大部分です。そのため、カスタマイズエンジニアを確保・組織化し、カスタマイズニーズに応える体制を構築しています。さらに、こうした体制がパッケージソフトウエア本体の営業力強化にもつながり、シナジー効果を生んでいます。
                      - paragraph [ref=e1154]
                      - paragraph [ref=e1155]: (4)パッケージソフトウエアの保守運用
                      - paragraph [ref=e1156]: カスタマイズ開発を行い顧客にシステムを導入した後は、顧客とソフトウエア保守契約を締結し、継続的な技術サポートを行っています。これにより、顧客との信頼関係を深め、新たな受注へとつなげております。
