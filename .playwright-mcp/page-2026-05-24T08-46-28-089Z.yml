                      - paragraph [ref=e385]: (1)事業の概要
                      - paragraph [ref=e386]: 当社グループは、当社と勤次郎ベトナム有限会社(連結子会社)の2社で構成されており、「想像から創造へ」のもと「CSR&イノベーション」を企業理念として、コアコンピタンス(競争優位の源泉)を強化しております。徹底して他社との差別化を図り、Human Resource Management事業(以下、「HRM事業」という。)においてステークホルダーの期待を重視し、顧客企業の人的資本投資による労働生産性向上をサポートすること、さらに国民のヘルスアップを目指し、社会の持続的発展に貢献することを経営方針としております。
                      - paragraph [ref=e387]: 当社グループの事業セグメントは、「HRM事業」「不動産賃貸事業」により構成されております。
                      - paragraph [ref=e388]: HRM事業は、多業種の事業者向けに、就業管理、人材管理、給与管理及び健康管理を一体的に提供するHRMソリューションとして、ソフトウエア製品及びハードウエア製品(就業情報端末)の開発及び販売、並びにこれらの製品を活用するクラウドサービス、コンサルサポート(注)1、プレミアムサポート(注)2等の提供を主に行っております。当社グループのHRMソリューションは、主に中堅・大企業向けの「Universal 勤次郎」と、主に従業員100名以下の企業向けクラウドサービス「JOBEE」の2製品により提供しております。また、HRM事業は、当社グループの事業戦略上、クラウド事業(注)3及びオンプレミス事業(注)4の2つに区分して推進しておりますので、以下に記載いたします。
