                        - paragraph [ref=e487]
                      - paragraph [ref=e488]: (注)1.コンサルサポートは、顧客企業への当社グループ製品・サービスの導入に際し、顧客企業のシステム環境の設定、ソフトウエアのインストール、就業情報端末の設置及び利用のための講習等を行います。
                      - paragraph [ref=e489]: 2.プレミアムサポートは、オンプレミス事業において顧客企業で利用されているソフトウエア及び就業情報端末に障害が生じた場合の修理並びに法令の改正変更に対応した最新プログラムの提供を行います。
                      - paragraph [ref=e490]: 3.「クラウド」とは、クラウドコンピューティングの略称であり、提供者が情報システムの設備(ハードウエア)を保有又は利用し、その設備において運用することをいいます。
                      - paragraph [ref=e491]: 「クラウド事業」では、従来は手元のコンピューターにインストールして利用していたようなソフトウエアやデータ、あるいはそれらを提供するための技術基盤(サーバーなど)を、インターネットなどのネットワークを通じて提供して(クラウドサービス)、当該ソフトウエアの利用権を販売する(クラウドライセンス売上)ほか、それに付随するサービスを提供しております。
                      - paragraph [ref=e492]
                      - paragraph [ref=e493]: 4.「オンプレミス」とは、利用者が情報システムの設備(ハードウエア)を保有し、利用者の設備において運用することをいいます。
                      - paragraph [ref=e494]: 「オンプレミス事業」では、利用者の設備にインストールするソフトウエアを販売するほか、それに付随するサービスを提供しております。
                      - paragraph [ref=e495]
                      - paragraph [ref=e496]: 当社グループは、重要な経営資源である人材面に関し、「働き方改革&健康経営®」による企業経営と従業員の最適な関係構築を提案し、顧客企業の労働関係法の遵守とともに従業員が健康で働きがいを感じながら活き活きと働くことのできる職場づくりやワーク・ライフ・バランスへの対応、女性活躍の推進などが、ワーク・エンゲイジメントと労働生産性を高め、豊かで活力ある企業・社会を実現するものと考えております。
                      - paragraph [ref=e497]
                      - paragraph [ref=e498]: (注)健康経営®は特定非営利活動法人健康経営研究会の登録商標です。
                      - paragraph [ref=e499]
                      - paragraph [ref=e500]: 1HRM事業
                      - paragraph [ref=e501]: 当社グループのHRM事業の基本方針は、顧客企業の「働き方改革&健康経営」の実現のため、従業員の適正な労働時間管理、健康維持・増進により労働生産性を向上させることを通じて、業績向上、企業価値向上に貢献することであります。その事業領域は、HRMソリューションを中核とし、主に中堅・中大規模企業向けの「Universal 勤次郎」を中心に、クラウド及びオンプレミスで製品・サービスを提供しております。
                      - paragraph [ref=e502]: 当社グループの販売チャネルには、当社が製品及びサービスを企業に直接販売する「直販」と、当社からシステムやIT機器を取り扱う販売パートナーに卸し、販売パートナー経由で企業が当社グループの製品及びサービスを利用する「パートナー販売」があります。
                      - paragraph [ref=e503]: なお、勤次郎シリーズの就業マネジメントシステムは5,000を超す企業・団体への導入実績があります。これは当該ソフトウエアが使いやすく満足度が高いことによるものであると自負しており、実際に多くの企業・団体で広く利用されております。
                      - paragraph [ref=e504]
                      - paragraph [ref=e505]: (クラウド事業)
                      - paragraph [ref=e506]
                      - paragraph [ref=e507]: 当社グループは、自社のクラウド設備を利用したサービス提供を行っており、クラウド基盤の刷新により、高速・高性能で柔軟なシステム構成を実現しています。また、「勤次郎プライベートクラウド」と「勤次郎AuthLink」の提供により、当社サービスと他社サービス間における、安全で快適な「シングルサインオン」と「多要素認証」を容易に構築することができるようになりました。今後さらに、働き方に応じた従業員情報をベースにした、様々な情報システムに対するアクセス制御の容易性を追求して参ります。
                      - paragraph [ref=e508]
                      - paragraph [ref=e509]: これらのクラウドサービスは企業の様々なニーズに応えるべく、ソフトウエアの売り切り型ではなく、利用しやすい月額料金方式で提供するため、企業はサーバーの初期コストや保有コスト、システム運用担当者の人件費、そしてパッケージの維持コストが不要となり、中堅中小企業でもHRMソリューションを利用することができます。
                      - paragraph [ref=e510]
                      - paragraph [ref=e511]: 当社グループでは、このクラウドサービスを通じ、顧客企業の満足度向上を図ることで、将来にわたるリカーリングレベニュー(継続的な収益)を得ることが可能であると考えております。
