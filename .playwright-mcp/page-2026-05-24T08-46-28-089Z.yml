                        - paragraph [ref=e598]
                      - paragraph [ref=e599]: (注)「利用者数」は契約ライセンス数を集計しております。なお、契約ライセンス数は、顧客企業の1従業員に複数サービス(就業、人事、給与、健康管理ソリューション等)の利用がある場合でも1人として集計しています。また、「契約社数」は複数サービスを契約している顧客企業も1社として集計しております。
                      - paragraph [ref=e600]
                      - paragraph [ref=e601]: また、顧客企業の満足度向上に取り組んだ結果、解約に至るケースも少なく、クラウドサービスの解約率は0.21%程度の水準で推移しております。
                      - paragraph [ref=e602]
                      - paragraph [ref=e604]: （画像は省略されました）
                      - paragraph [ref=e605]: (注)クラウドサービスの解約率は、「対象月を含む過去12か月のクラウドライセンス解約金額合計÷同期間のクラウドライセンス前月売上金額合計」にて算出しております。クラウドライセンス解約金額とは、ライセンス契約の解除により減少するクラウドライセンス売上(月額)をいいます。
                      - paragraph [ref=e606]
                      - paragraph [ref=e607]
                      - paragraph [ref=e608]: (オンプレミス事業)
                      - paragraph [ref=e609]
                      - paragraph [ref=e610]: オンプレミス事業においても、クラウド事業と同じく、顧客企業の「働き方改革&健康経営」に資するHRMソリューション「Universal 勤次郎」を中心に、製品・サービスを広く提供しております。
                      - paragraph [ref=e611]: これらのソフトウエアのパッケージを購入した顧客企業・団体においては、当社グループが継続的なプレミアムサポートを提供することで、安心して利用することができ、当社グループにとっては、プレミアムサポートの年額料金又は月額料金によりリカーリングレベニュー(継続的な収益)を得ることが可能であり、安定した収益確保につながっております。
                      - paragraph [ref=e612]
                      - paragraph [ref=e613]: 当社グループでは、クラウドサービス及びプレミアムサポートの2つのリカーリングレベニュー(継続的な収益)並びにこれらのソフトウエアのオンプレミスでの拡販により、高い成長力と安定した収益計上を確保しております。
                      - paragraph [ref=e614]
                      - paragraph [ref=e615]: 2不動産賃貸事業
                      - paragraph [ref=e616]: 当社グループの不動産賃貸事業の基本方針は、スペースの有効活用としております。当社所有のビルのうち、空きフロアをオフィス用賃貸物件として賃貸しております。
                      - paragraph [ref=e617]
                      - paragraph [ref=e618]: (2)当社グループの主要製品及びサービスについて
                      - paragraph [ref=e619]: 当社グループの主要製品及びサービスは、企業の人的資本投資を支援するHRMソリューションを中核とし、これを補完・拡張するヘルスケア関連サービス及びクラウド基盤サービスにより構成されております。
                      - paragraph [ref=e620]
                      - paragraph [ref=e621]: 1HRMソリューション(中核事業)
                      - paragraph [ref=e622]: 当社グループは、就業管理、人事管理、給与管理及び健康管理を一体的に提供するHRMソリューション(HRMサービス)として、「Universal 勤次郎」を中核とする勤次郎シリーズを展開しております。
                      - paragraph [ref=e623]: 「Universal 勤次郎」は、企業における労務管理の効率化とコンプライアンス対応に加え、従業員の健康維持・増進を通じた労働生産性の向上を支援するHRMプラットフォームであり、クラウド及びオンプレミスの両形態で提供しております。本HRMソリューションは、多様な雇用形態や働き方に対応した就業管理機能を基盤に、人事・給与データ及び健康データを統合的に管理・活用することにより、企業の「働き方改革&健康経営」の推進を包括的に支援することを特徴としております。また、HRMソリューションから得られるデータを活用し、労務コストの可視化、人員配置の最適化、健康リスクの把握及び改善支援など、企業経営に資する各種分析・支援サービスも提供しております。
                      - paragraph [ref=e624]
                      - paragraph [ref=e625]: 2HRMソリューションを補完する関連サービス
                      - paragraph [ref=e626]: 当社グループは、HRMソリューションで培った就業・健康データ活用の知見を活かし、ヘルスケア分野及びクラウド基盤分野において、以下の関連サービスを提供しております。
                      - paragraph [ref=e627]: ■クラウドフロントサービス
                      - paragraph [ref=e628]: 2010年以来の当社のクラウド技術ノウハウを活かし、システム構築に必要なサーバーやネットワーク、ストレージなどのインフラを安全・スピーディーにインターネット経由で提供しています。お客様に、安心・安全・低予算にてクラウドサービスのメリットをご提供することが可能です。
                      - paragraph [ref=e629]: 1「勤次郎プライベートクラウド」は、ネットワーク構築・システムの冗長化に関して、ホスティング型IaaSを、専門部門を持たない企業・部門におけるサーバー選定・購入手続きやシステム維持といった煩雑で日々の負担の大きな課題を解決いたします。また企業がWebアプリケーションを「勤次郎プライベートクラウド」内で動作させることで、安全に当社の「HRMプラットフォーム」データを活用することができます。
                      - paragraph [ref=e630]: 2「勤次郎AuthLink」は、クラウド上の様々なアプリケーションの効率的な管理と運用を「シングルサインオン」によって可能にします。また、生体認証と組み合わせられる「多要素認証」によるセキュリティ強化と、ユーザーごとのアクセス制御などにより、管理業務の工数削減を実現します。
                      - paragraph [ref=e631]
                      - paragraph [ref=e632]
                      - paragraph [ref=e633]: ■ママケリー
                      - paragraph [ref=e634]: 妊活支援・母子健康手帳・育児手帳の機能を有するアプリケーションとして、お子様の誕生前から、母子の身長・体重、病院での受診内容、保健指導内容を写真や動画とともに記録できます。専門家の育児情報も掲載されており、出産・育児でのママの悩みや不安を少しでも和らげ、安心して楽しく子育てができるよう支援しております。ママケリーを通して、パパ・ママそしておじいちゃん・おばあちゃんがお子さん・お孫さんの成長をともに感じて、ご家族の思い出をいつまでも大切にできます。
                      - paragraph [ref=e635]
                      - paragraph [ref=e636]: ■ヘルス×ライフカルテ(電子カルテシステム)
                      - paragraph [ref=e637]: クラウドサービスによる電子カルテシステムで、「Universal 勤次郎」とオンライン診療システムとの連携で、患者のデータを一括管理します。患者の受付から会計までの業務フローへの対応に加え、入院に必要な移動情報、看護支援機能等を有し、200床未満の医療機関に対応しています。
