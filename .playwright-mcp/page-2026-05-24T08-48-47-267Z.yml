                    - generic [ref=e777]:
                      - heading "3【事業の内容】" [level=3] [ref=e778]
                      - paragraph [ref=e779]: 当社グループは、当社及び連結子会社(株式会社シイエヌエス北海道)の2社で構成されており、「システムエンジニアリングサービス事業」を主たる業務としております。株式会社シイエヌエス北海道も当社と同じ事業に携わっております。本事業の開発プロセスは以下のとおりです。
                      - paragraph [ref=e780]
                      - paragraph [ref=e781]: 要件定義工程 → 基本設計工程 → 詳細設計工程 → 製造工程 → 単体試験工程 → 結合試験工程 → 総合試験工程
                      - paragraph [ref=e782]
                      - paragraph [ref=e783]: なお、当社グループは単一セグメントでありますが、サービス事業として、以下5つの事業を展開しております。
                      - paragraph [ref=e784]
                      - paragraph [ref=e785]: (1)デジタル革新推進事業
                      - paragraph [ref=e786]: DX(注1)を推進することを目的に、様々な技術ソリューションを提供しております。
                      - paragraph [ref=e787]: システム技術領域においては、ServiceNow社の製品を活用したシステム保守・運用業務変革の取り組みや業務システムが利用するデータベースのアクセス性能改善コンサルティングの取り組みを当社のパートナーである株式会社NTTデータと推進しております。
                      - paragraph [ref=e788]: また、デジタル技術領域を中心としたテクニカルの取り組みとしては、お客様のシステムに最適なデータベースの選定・移行・導入までを一括で行うデータベース技術のコンサルティングやアーキテクチャデザイン、フィージビリティ検証・性能設計、性能試験、チューニングまで対応する性能コンサルタントの実績があります。
                      - paragraph [ref=e789]
                      - paragraph [ref=e790]: (2)ビッグデータ分析事業
                      - paragraph [ref=e791]: 企業に蓄積された様々なデータを活用し、社会の利便性向上に貢献する事業を展開しています。ユーザ情報や行動ログ、位置情報といったビッグデータを分析するモデルを作り、分析実施、結果からお客様のビジネス課題を解決するものであります。
                      - paragraph [ref=e792]: 通信、金融、広告、流通、小売業等の幅広い分野での、経営課題やビジネス課題解決に向けたビジネスアクションのコンサルティング、予測モデルの構築、開発等の実績があります。
                      - paragraph [ref=e793]: 本事業においては、この業界のリーダーの一社であるSAS Institute Japan株式会社とパートナー関係にあり、同社と連携して新たなお客様へのサービス拡大を進めております。自社オリジナルブランド「U-Way」について、SASのクラウドベースのAI/アナリティクス・プラットフォーム製品「SAS Viya」の導入支援を目的とした自社オリジナルサービス「U-Way Migration to SAS Viya構築支援サービス」を提供しております。
                      - paragraph [ref=e794]
                      - paragraph [ref=e795]: (3)システム基盤事業
                      - paragraph [ref=e796]: 企業の業務システムや、日常的に利用されるEC(電子商取引)、SNS(ソーシャルネットワーキングサービス)などのサービスを利用するために必要となるコンピュータやネットワークなどのシステム基盤について、お客様が抱える問題の解決、最適なシステム基盤導入提案、構築、システム基盤運用を支援する事業になります。昨今のDXの基盤技術となるクラウド技術において、AWS(注2)やOCI(注3)等の数々の導入実績・知見を有しています。
                      - paragraph [ref=e797]: 自社オリジナルブランド「U-Way」の下、オラクルのクラウドサービスを活用した以下の商材をリリースしております。
                      - paragraph [ref=e798]: ・「U-Way Oracle Cloud Infrastructure 導入・運用新サービス」
                      - paragraph [ref=e799]: ・「U-Way Oracle Cloud VMware Solution 移行・導入支援サービス」
                      - paragraph [ref=e800]: ・「U-Way Lite OCI Base Model」
                      - paragraph [ref=e801]: ・「U-Way Lite OCI DB Model BaseDB」
                      - paragraph [ref=e802]: ・「U-Way Lite OCI DB Model MySQL」
                      - paragraph [ref=e803]
                      - paragraph [ref=e804]: (4)業務システムインテグレーション事業
                      - paragraph [ref=e805]: お客様のビジネスの課題を考慮したシステムの企画から、要件定義、開発、テスト、導入後の運用まで全般を支援する事業になります。お客様の業務上の個別ニーズや課題解決に対し、アプリケーションを用いて実装しています。特に金融業界の信用リスクや金融規制対応、流通業界の顧客管理や販売管理については、お客様との密接な関係の中で蓄積した経験値があり、上流のコンサルティングから運用・保守業務まで一貫したサービスを提供しています。
                      - paragraph [ref=e806]
                      - paragraph [ref=e807]: (5)コンサルティング事業
                      - paragraph [ref=e808]: DXに係る企画・戦略フェーズから参画し、お客様のプロジェクト実行からビジネス変革まで伴走して支援する事業になります。また、デジタルに強い組織文化醸成に向けたITリテラシー教育や、デジタル人材不足を解消する人材育成の支援、技術アドバイザリー業務も行っています。
                      - paragraph [ref=e809]
                      - paragraph [ref=e810]: (注1)DX:デジタルトランスフォーメーション(Digital Transformation)の略称。ITの活用を通じてビジネスモデルや組織を変革すること。
                      - paragraph [ref=e811]: (注2)AWS:Amazon Web Serviceの略称。クラウドサービスの一つ。
                      - paragraph [ref=e812]: (注3)OCI:Oracle Cloud Infrastructureの略称。クラウドサービスの一つ
                      - paragraph [ref=e813]
                      - paragraph [ref=e814]: 2026年5月期より組織体制を大きく変更し、本部制を敷くこととなりました。先端技術の活用により顧客の課題解決を主な目的とするテクノロジーソリューション事業、顧客業務視点に立った課題解決を主な目的とするビジネスソリューション事業、新規顧客・案件開拓に向けて顧客接点を増やすことを主な目的とするコンサルティング事業をそれぞれ担う3つの本部となります。これに伴い、これまでの5つのサービス事業区分も以下の3区分に変更いたします。
                      - paragraph [ref=e815]
                      - paragraph [ref=e816]: <テクノロジーソリューション事業>
                      - paragraph [ref=e817]: テクノロジーソリューション事業は、最先端の技術を活用した事業を主に3つの領域にて展開しております。
                      - paragraph [ref=e818]: 1.企業や組織内で発生するさまざまな業務プロセスを1つのプラットフォーム上で、統合・自動化・可視化する
                      - paragraph [ref=e819]: ためのクラウドサービスであるServiceNowに関するコンサルティング・導入・運用までをend to endでのサー
                      - paragraph [ref=e820]: ビス提供を行っております。
                      - paragraph [ref=e821]: 2.次世代技術のR&D、性能最適化やデータベースマイグレーション、ソフトウェアアーキテクチャ等のテクニカ
                      - paragraph [ref=e822]: ルコンサルティング、AIやIoT、クラウド・コンピューティングを活用したアジャイル開発等において、シス
                      - paragraph [ref=e823]: テム・インテグレーションサービスを提供しております。
                      - paragraph [ref=e824]: 3.オンプレミスからクラウドに至るインフラ環境全般における技術コンサルティング・導入・構築・運用までを
                      - paragraph [ref=e825]: ワンストップで提供しております。
                      - paragraph [ref=e826]
                      - paragraph [ref=e827]: <ビジネスソリューション事業>
                      - paragraph [ref=e828]: ビジネスソリューション事業は、顧客業務に関する知識・ノウハウ、及び自社オリジナルサービス「U-Way」を活用した事業を主に2つの領域にて展開しております。
                      - paragraph [ref=e829]:
                        - text: 1.金融機関及び小売流通業向けの業務アプリケーション設計・開発・運用保守の請負/並びにデータ分析・活用
                        - text: の提案を行っております。
                      - paragraph [ref=e830]:
                        - text: 2.一般事業会社向けに自社オリジナルブランド「U-Way」サービスを通じた支援を行っております。インフラ基
                        - text: 盤からアプリケーション開発までシームレスなサービスを提供しております。特に、オラクル社が提供するク
                      - paragraph [ref=e831]: ラウド「Oracle Cloud Infrastructure(OCI)」とクラウド型ERPである「Oracle Enterprise Resource
                      - paragraph [ref=e832]: Plannng(ERP)」に強みを有しております。
                      - paragraph [ref=e833]
                      - paragraph [ref=e834]: <コンサルティング事業>
                      - paragraph [ref=e835]: コンサルティング事業は、顧客のビジネス変革をリードしています。顧客の潜在・顕在課題を抽出し戦略を構築するだけではなく、その戦略に基づく具体的な解決策に至るまでを提供するソリューション型コンサルティングサービスとして以下2つのサービスを展開しています。
                      - paragraph [ref=e836]:
                        - text: 1.DXコンサルティングサービスでは、専門性の高いコンサルタントを有し、DX戦略カルテ(DX診断)から課題を
                        - text: 抽出し最適なコンサルティングを提供しています。同時に、解決の具体策として当社のアセットを活用したデ
                        - text: ータ分析やシステム開発など、一気通貫でリード出来ることを強みとしています。
                      - paragraph [ref=e837]:
                        - text: 2.最新の生成AIテクノロジーを活用した業務改革コンサルティングや、デジタル・AI人材育成(DXブートキャン
                        - text: プ)など、顧客の様々な課題に応えるコンサルティングソリューションサービスを提供しています。
                      - paragraph [ref=e838]
                      - paragraph [ref=e839]: "[事業系統図]"
                      - paragraph [ref=e840]: 以上、述べた事項を事業系統図によって示すと次のとおりであります。
