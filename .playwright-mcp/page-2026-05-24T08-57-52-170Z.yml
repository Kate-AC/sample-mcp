                            - row "容器等の製造及び販売 TAKEMOTO YOHKI INDIA PRIVATE LIMITED(インド)" [ref=e507]:
                              - cell "容器等の製造及び販売" [ref=e508]:
                                - paragraph [ref=e509]: 容器等の製造及び販売
                              - cell "TAKEMOTO YOHKI INDIA PRIVATE LIMITED(インド)" [ref=e510]:
                                - paragraph [ref=e511]: TAKEMOTO YOHKI INDIA PRIVATE LIMITED(インド)
                        - paragraph [ref=e512]
                      - paragraph [ref=e513]
                      - paragraph [ref=e514]: 当社グループは、「世界の器文化に貢献する」という経営理念のもと、「商品の価値や個性を強める容器や、内容物を安全に包み保存する容器」の開発及び提供を行っています。当社グループは化粧品・美容事業者、食品・健康食品事業者、日用・雑貨事業者、化学・医薬品事業者を主な顧客層とし、当連結会計年度では日本、中国、アメリカ、タイ、オランダ、インドの販売拠点から世界中で4,313社へ販売を行っております。一般的に顧客が独自の容器を求める場合には、あらかじめ金型の製作が必要となり、金型製作には相応の時間と費用が必要となるため、顧客の負担が大きくなりますが、当社グループでは、顧客の負担を軽減するため、容器製造に必要な金型を当社で製作し、顧客が必要に応じて利用できる金型を4,258型(2025年12月末時点)保有しております。当社グループ所有の金型で生産されたボトルや押し出しチューブ等の容器本体やキャップ、ディスペンサー(ポンプ、スプレーなどの液体定量吐出装置)等の付属品を総称してスタンダードボトルと呼んでおります。
                      - paragraph [ref=e515]: 当社グループでは、スタンダードボトルを活用し、容器本体と付属品の組み合わせや着色、印刷などで顧客個々の要望に応じたデザインを施すことで独自性の高い包装容器を、短納期かつ小ロットから提供することが可能であり、スタンダードボトル以外の顧客特別注文金型により製造する容器も含めた包装容器全般の提供において、国内外で多数の顧客の支持を得られているものと考えています。
                      - paragraph [ref=e516]: 現在当社グループは日本国内と中国の上海市、昆山市及びインドに生産拠点を有していますが、他社製品を提供する場合を除き、日本で販売するものは主に日本国内の当社自社工場(6工場)及び当社の金型を預託している協力メーカーで生産しています。一方、中国、アメリカ、ヨーロッパ、タイ、インドの海外子会社で販売するものは主に当社、上海竹本容器包装有限公司、竹本容器(昆山)有限公司及びTAKEMOTO YOHKI INDIA PRIVATE LIMITEDで生産しています。
                      - paragraph [ref=e517]: 上述のスタンダードボトルを軸とした当社グループのビジネスモデルの推進においては、顧客基盤、スタンダードボトル開発、製品供給体制が重要であると認識しており、新製品開発体制の強化、国内外の生産体制強化並びに営業力強化に取り組んでおります。
                      - paragraph [ref=e518]
                      - paragraph [ref=e519]: なお、事業系統図は次のとおりです。
