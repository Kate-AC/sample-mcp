                      - heading "3 【事業の内容】" [level=3] [ref=e455]
                      - paragraph [ref=e456]: 当社グループ(株式会社ジャストプランニング及び当社の関係会社)は、株式会社ジャストプランニング(当社)及び連結子会社2社で構成されています。事業内容並びに当社グループの当該事業に係る位置付けは、次のとおりであります。
                      - paragraph [ref=e457]
                      - paragraph [ref=e458]: ASP事業
                      - paragraph [ref=e459]: 当社は、外食企業向けに、インターネットの通信インフラを利用したアプリケーションソフトウエアの提供と、企業の情報システム関連部門が行っているシステムメンテナンス業務及び運用サポート業務等のアウトソーシング業務とを組み合わせた「ASP事業」を行っております。2020年8月に事業譲受したテイクアウト業態向けのスマートフォンアプリケーション「ASP事業(iToGo)」を加え、多様化するマーケットに対して営業力、システム競争力の強化を図っております。
                      - paragraph [ref=e460]
                      - paragraph [ref=e461]: システムソリューション事業
                      - paragraph [ref=e462]: 当社は、外食産業向け本部管理システム・店舗システム・分析システム等のアプリケーションソフトウエアの企画、開発、販売及びPOSシステム、オーダーエントリーシステム等のソリューションの提供及び業務コンサルティングを行っております。
                      - paragraph [ref=e463]
                      - paragraph [ref=e464]: 物流ソリューション事業
                      - paragraph [ref=e465]: 連結子会社の株式会社サクセスウェイは、外食チェーン企業等に対する物流ソリューションやマーチャンダイズソリューション、本部業務代行等のソリューションサービス事業を行っております。
                      - paragraph [ref=e466]
                      - paragraph [ref=e467]: 太陽光発電事業
                      - paragraph [ref=e468]: 連結子会社の株式会社JPパワーは、自社で保有する太陽光発電設備をもとに、太陽光発電による電力会社への売電を行っております。
                      - paragraph [ref=e469]
                      - paragraph [ref=e470]: その他事業
                      - paragraph [ref=e471]: 連結子会社の株式会社JPパワーは、直営の外食店舗を従業員等により運営し、店舗運営ノウハウの社員研修、情報システムの開発、新システムのテストマーケティング等に活用しております。
                      - paragraph [ref=e472]
                      - paragraph [ref=e473]: 上記の事項について、事業系統図を示すと次のとおりであります。
