                    - generic [ref=e799]:
                      - heading "3【事業の内容】" [level=3] [ref=e800]
                      - paragraph [ref=e801]: 当社グループは、顧客の経営課題に対し最適なシステムソリューションを提供する独立系ITトータルソリューションプロバイダーであり、当社および連結子会社1社により構成されております。近年、DXの推進やサイバーセキュリティ対応の重要性が高まる中、AI、クラウドネイティブ、ノーコード・ローコード等の先進技術の普及により、情報サービス産業における技術革新のスピードは一層加速しております。こうした市場環境の変化を踏まえ、当社グループでは、クラウド活用、AI、BI(ビジネスインテリジェンス)、業務自動化ツール等多様な分野において、顧客ニーズに応じた柔軟な提案と、確実な遂行体制に基づいたシステムソリューションサービスを提供しております。当社グループは、システムソリューションサービスの単一セグメントでありますが、事業領域を「ゼネラルソリューションサービス」、「インフラソリューションサービス」、「ERPソリューションサービス」の3つのサービスラインに区分しております。各サービスラインの概要及び特徴は、以下のとおりであります。
                      - paragraph [ref=e802]
                      - paragraph [ref=e803]: (1)ゼネラルソリューションサービス
                      - paragraph [ref=e804]: 当社事業における中核となるサービスであり、金融業(銀行・保険・証券)、産業・流通業、公共分野、医療分野、教育分野等の幅広い分野において、顧客であるエンドユーザーや国内ITメーカー、大手SIerからの受託開発、運用保守を中心に行っております。当社グループは情報システムの企画から設計、構築、運用保守業務、BPOサービス業務までの工程をすべて手掛けており、一括したサービスを提供しております。また、IT人材不足やデジタル化を背景に需要が拡大しているノーコード・ローコードツールや経営戦略の意思決定に直結するBIツールなど様々なソリューションを提供しております。
                      - paragraph [ref=e805]
                      - paragraph [ref=e806]: (2)インフラソリューションサービス
                      - paragraph [ref=e807]: 特定の業種に偏ることなく、顧客のITシステム基盤となるサーバー等のハードウエア導入をはじめ、ネットワーク、データベース、アプリケーション基盤等といったシステムインフラ全体の設計、構築等を行うとともに、その後の運用や保守までの一連のサービスを提供しております。特にAWSなどのクラウドサービス導入支援に力を入れており、Kubernetes等の仮想化・コンテナ技術にも対応した先進的なインフラ構築サービスを展開しております。顧客の情報システム部門の立ち上げ支援及びセキュリティ化支援等のコンサルティングサービスから運用支援までワンストップでサービスを提供しております。
                      - paragraph [ref=e808]
                      - paragraph [ref=e809]: (3)ERPソリューションサービス
                      - paragraph [ref=e810]: ERPソリューションサービスは、SAPジャパン株式会社(注1)が提供する大企業向けSAP S/4HANA及び中小企業向けGROW with SAP、更にビジネスエンジニアリング株式会社(注2)の製造業向けERPであるmcframeを中核とした導入支援、カスタマイズ、アドオン開発、保守、運用、BPOサービス業務までのワンストップでサービスを提供しております。連結子会社のノックス株式会社では、株式会社オービックビジネスコンサルタントとの契約に基づき、奉行シリーズの製品販売・導入支援及びアドオン開発を主として、各種サービス、連携ソリューションを提供しております。
                      - paragraph [ref=e811]
                      - paragraph [ref=e812]: (注)1.SAPジャパン株式会社は、ERPパッケージ等で知られるソフトウエア会社SAP社の日本法人であります。
                      - paragraph [ref=e813]: 2.ビジネスエンジニアリング株式会社は、製造業向けERPパッケージmcframeを開発・提供する独立系ソフトウエア会社です。
                      - paragraph [ref=e814]
                      - paragraph [ref=e815]: "[事業系統図]"
                      - paragraph [ref=e816]: 当社グループの主要なサービスライン別に、当社グループと顧客等との関連を系統図で示すと、以下のとおりであります。
