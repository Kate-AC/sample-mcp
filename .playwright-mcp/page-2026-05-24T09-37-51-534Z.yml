                      - heading "3 【事業の内容】" [level=3] [ref=e844]
                      - paragraph [ref=e845]: 当社グループ(当社及び当社の関係会社)は、当社(東洋ドライルーブ株式会社)・子会社6社及び関連会社2社により構成されており、ドライルーブ製品の開発・製造・販売及びドライルーブ製品の自動車機器、電気・電子機器の駆動伝達部等へのコーティング加工並びにドライルーブ製品のコーティング加工法の技術指導を主たる業務としております。
                      - paragraph [ref=e846]: 当社グループの事業内容及び当社と関係会社の当該事業に係る位置付けは次のとおりであります。
                      - paragraph [ref=e847]: 国内においては、当社がドライルーブ製品の開発・製造・販売、ドライルーブ製品のコーティング加工、ドライルーブ製品のコーティング加工法の技術指導を行い、長野ドライルーブ株式会社、大分ドライルーブ株式会社及び株式会社真永はドライルーブ製品のコーティング加工を行います。海外(中国・タイ・ベトナム)においては、子会社の広州徳来路博科技有限公司及びドライルーブ・タイランド、ドライルーブ・ベトナム、関連会社の中山市三民金属処理有限公司及び昆山三民塗頼表面処理技術有限公司がドライルーブ製品のコーティング加工を行います。
                      - heading "(1) ドライルーブ製品の開発・製造・販売" [level=4] [ref=e848]
                      - paragraph [ref=e849]: 当社グループは二硫化モリブデン、フッ素樹脂、グラファイト等の主要成分とポリアミドイミド、エポキシ等の樹脂系結合剤を溶剤中に均一に分散させる配合技術・分散技術の研究開発を行い、ドライルーブ製品の開発・製造・販売を行っております。
                      - paragraph [ref=e850]: 当社グループが製造するドライルーブ製品は、スプレー法、印刷法、浸漬法、ディスペンサーまたはスピンコート等により機器にコーティングされ、コーティング後焼成されることにより機器の金属、プラスチック、ゴム等の素材上に潤滑耐久性、低摩擦性、非粘着性、電気的特性等の機能を有する薄いフィルム状の強固な被膜を形成させることが可能です。主要な顧客は自動車機器、光学機器メーカー等の業界であります。
                      - heading "(2) ドライルーブ製品のコーティング加工" [level=4] [ref=e851]
                      - paragraph [ref=e852]: 当社・子会社6社及び関連会社2社は、当社が製造したドライルーブ製品の機器へのコーティング加工を行っております。
                      - paragraph [ref=e853]: 主要な顧客は、自動車機器、光学機器、電気・電子機器、OA機器メーカー等でありますが、特に最近は省エネ及び環境保全関連の技術革新が顕著である自動車機器向けのコーティング加工が増加しております。
                      - paragraph [ref=e854]: なお、ドライルーブ製品を構成する主成分に応じた、代表的な加工の対象となる機器の分類を示すと以下のとおりとなります。
                      - paragraph [ref=e855]
