                            - row "グラファイト ワイパーブレードの駆動支持部の軸受け、CD・DVDプレーヤーの読取装置部、デジタルカメラのズームやシャッターの駆動部、カメラレンズの光量調節部等の高荷重高耐久性等の性能が要求される自動車機器、光学機器、電気・電子機器等" [ref=e877]:
