                                - paragraph [ref=e881]: ワイパーブレードの駆動支持部の軸受け、CD・DVDプレーヤーの読取装置部、デジタルカメラのズームやシャッターの駆動部、カメラレンズの光量調節部等の高荷重高耐久性等の性能が要求される自動車機器、光学機器、電気・電子機器等
                        - paragraph [ref=e882]
                      - paragraph [ref=e883]: (注) 1.ワイパーブレードは、往復回転運動によりガラス面上の雨・ほこり等を取りながらガラス表面に薄く均一な水の膜を作りクリアな視界を確保するものです。
                      - paragraph [ref=e884]: 2.キャブレターは、空気に燃料であるガソリンを混ぜてシリンダーに送り込む装置で、気化器と訳されています。実際には霧吹きの原理によって空気中にガソリンを霧のように細かい粒にして混ぜるものです。
                      - paragraph [ref=e885]: 3.パワーステアリングは、運転者の操舵を補助する機構であり、この機構により運転者は軽い力で操舵することができます。
                      - paragraph [ref=e886]: 4.ミッションとは、走行速度に合わせてギアのポジションを操作し、大きなギアと小さなギアを組み合わせて回転をスムーズにする装置で、マニュアルトランスミッションとオートマトランスミッションがあります。
