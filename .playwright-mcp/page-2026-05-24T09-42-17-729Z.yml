                      - heading "3 【事業の内容】" [level=3] [ref=e1072]
                      - paragraph [ref=e1073]:
                        - text: 当社グループは、主に金属加工油剤を生産・販売しており、国内においては当社が、海外においては各地域をそれぞれ独立した現地法人が担当しており、取扱う製品について各地域の包括的な戦略を立案し、事業活動を展開しております。
                        - text: したがって、当社グループは、生産・販売体制を基礎とした地域別のセグメントから構成されており、「日本」、「南北アメリカ」、「中国」及び「東南アジア/インド」の4地域を報告セグメントとしております。また、「日本」セグメントでのみ、金属加工油剤のほか、ビルメンテナンス製品を生産・販売しております。
                        - text: なお、上記の4地域は、「第5 経理の状況 1連結財務諸表等(1)連結財務諸表 注記事項(セグメント情報等)」に掲げるセグメントの区分と同一であります。
