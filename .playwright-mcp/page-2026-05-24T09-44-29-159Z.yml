                    - generic [ref=e1022]:
                      - paragraph [ref=e1023]
                      - heading "3 【事業の内容】" [level=3] [ref=e1024]
                      - paragraph [ref=e1025]: 当社グループは、当社及び子会社(株式会社セレレントパートナーズ)の合計2社で構成されており、アパート経営に関するコンサルティング及びソリューション提供を行う賃貸住宅事業、不動産の開発・販売を行う賃貸開発事業、アパートの管理受託によるプロパティマネジメント業務を行う賃貸経営事業の3事業を1都3県(東京都、神奈川県、千葉県、埼玉県)で運営し、東京都に事業所1か所と千葉県に工場を1か所展開しております。
                      - paragraph [ref=e1026]
                      - paragraph [ref=e1027]: 当社グループの各事業の具体的内容は以下のとおりです。
                      - paragraph [ref=e1028]
                      - heading "(1) 賃貸住宅事業" [level=4] [ref=e1029]
                      - paragraph [ref=e1030]: 当事業は、当社が行っており、賃貸不動産のオーナーであるお客様(以下「オーナーさま」といいます)のそれぞれの人生設計における課題(収益獲得、事業承継、相続・贈与等)をヒアリングし、そのソリューションとして、空間設計を重視した設計を基に、自社製造の鋼材と自社施工によるアパートの建築を行っております。主な業務の内容及び特徴については以下のとおりであります。
                      - paragraph [ref=e1031]
                      - heading "1 コンサルティング" [level=5] [ref=e1032]
                      - paragraph [ref=e1033]: 当社では、アパート経営は多くのオーナーさまにとって目的ではなく、人生設計における課題を解決するための選択肢の一つであると位置づけ、土地を保有されているオーナーさまに向けて、例えば子供の養育資金や老後の不安解消に向けた私設年金の形成など土地の有効活用を提言し、アパート経営を通じてオーナーさまが抱える様々な問題や人生の課題に対する解決プランの提案を行っております。
                      - paragraph [ref=e1034]
                      - heading "2 ソリューション" [level=5] [ref=e1035]
                      - paragraph [ref=e1036]: 一級建築士事務所として平面に高さを加えた立体的な空間設計を行い、アパートのプランニングから実施、設計・施工管理までを手掛けております。また、特定建設業者として建築施工全般を請け負っております。
                      - paragraph [ref=e1037]: 施工につきましては、国土交通大臣より型式適合認定を取得した“新型式構法:セレZ”による鉄骨を主要構造材とするオリジナル工法(厳格な構造試験をクリアしたH鋼や角パイプ、耐力パネル等を組み合わせた工法)で設計を行い、国土交通大臣の型式部材等製造者認証及び品質マネジメントシステムの国際規格である「ISO9001」の認証を取得した自社工場での製造により、品質管理の徹底を図り、各工程での施工マニュアル運用により現場ごとの施工品質の差を無くし、検査においては現場監督検査に加え、外部の建築品質検査専門会社による第三者検査を実施するなど徹底した施工管理を行っております。
                      - paragraph [ref=e1038]
                      - heading "(2) 賃貸開発事業" [level=4] [ref=e1039]
                      - paragraph [ref=e1040]: 当事業は、当社が行っており、不動産購入資金に対する家賃収入といった投資利回り、エリアや駅近など地価が下落しづらいことを物件選択において重視される土地を保有されていない富裕層に対して、豊かな資産承継に貢献できるようなアパート経営の提案を行っております。
                      - paragraph [ref=e1041]: 具体的には、将来にわたり確かな価値として残る土地の立地を重視し、土地の資産価値が高い都内の城南(品川区・目黒区・港区・大田区)・城西(渋谷区・新宿区・世田谷区・中野区・杉並区・練馬区)エリアにおいて、駅近の立地を条件とし、整形地・角地など見栄えの良さや富裕層のニーズを考慮した土地を自社で仕入れ、その土地の資産価値に相応する赤煉瓦調の外観や立体的な空間設計による付加価値の高いアパートを建築し、販売しております。
                      - paragraph [ref=e1042]
                      - paragraph [ref=e1043]
                      - heading "(3) 賃貸経営事業" [level=4] [ref=e1044]
                      - paragraph [ref=e1045]: 当事業は、当社及び子会社の株式会社セレレントパートナーズが行っており、アパートの管理受託によるプロパティマネジメント業務をはじめとするストック事業(賃貸管理手数料など継続的に収入を得ることができる事業)を行っております。主な業務の内容及び特徴については以下のとおりであります。
                      - paragraph [ref=e1046]
                      - heading "1 管理受託" [level=5] [ref=e1047]
                      - paragraph [ref=e1048]: 自社施工物件並びに、他社の施工物件や他社の管理物件について管理受託営業を積極的に行っております。
                      - paragraph [ref=e1049]: オーナーさまのアパート経営にアパート建築前のコンサルティングから関わり、完成後もアパート管理のオペレーションを担うことで3世代、4世代と長期にわたりオーナーさまに寄り添う「アパート経営100年ドックVISION」を理念に掲げ、資産価値を守り・育み・高める賃貸管理を提案しております。
                      - paragraph [ref=e1050]
                      - heading "2 オペレーション" [level=5] [ref=e1051]
                      - paragraph [ref=e1052]: 管理アパートのプロパティマネジメント業務を行っております。
                      - paragraph [ref=e1053]: 一括借上や家賃集金代行等による入居者(ゲスト)の募集、入退去管理、家賃回収、レポーティングといった賃貸管理業務と併せて、日常の建物点検、清掃など維持管理業務の委託を受け、オーナーさまに代わり長期的な資産運営と維持管理を行っております。また、築後の経年に応じ、資産価値の維持を図るためのリフォーム工事及び価値向上を目的としたリノベーション工事の提案・請負を賃貸住宅事業の施工部門と連携し行っております。
                      - paragraph [ref=e1054]
                      - heading "3 派生ビジネス" [level=5] [ref=e1055]
                      - paragraph [ref=e1056]: 上記各業務から派生する事業として、オーナーさまやゲストの火災、家財、その他保険の取り扱い業務(保険代理店業務)及び、子会社である株式会社セレレントパートナーズによるゲストの入居契約における不動産賃貸保証業務を行っております。
                      - paragraph [ref=e1057]
                      - paragraph [ref=e1058]: "[事業系統図]"
