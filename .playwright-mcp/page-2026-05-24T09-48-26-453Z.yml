                  - row "2026/5/13 2026/5/1 変更報告書 ひびき･パース･アドバイザーズ･エスピーシー(Hibiki Path Advisors SPC) 9.23% +0.6% 1,853,600 純投資及び状況に応じて経営陣への助言、重要提案行為等を行うこと。提出者1は、投資顧問業を営むHibiki Path Advisors Pte. Ltd.（以下「旧ひびき」という。）の業務を引き継ぐ目的で設立されたものであるところ、旧ひびきは、2025年10月に、投資先である発行者に対して書簡を送付し、適正な資本効率を目指したROE目標の見直し及び株主還元の拡充並びに収益性に課題を抱える事業における構造改革の推進や分離等の選択肢の検証を含む事業ポートフォリオ運営の導入を提案し、書簡の内容をウェブサイト上で公表した（https://hibiki-investment-news.com/wp-content/uploads/2025/11/Fujikura-Composite-Final.pdf）。提出者1は、今後も当書簡の趣旨に沿って発行者との対話を進めていく予定であり、対話の状況によっては、これらの事項についてさらなる提案を行う可能性がある。" [ref=e250]:
