                      - heading "3【事業の内容】" [level=3] [ref=e1068]
                      - paragraph [ref=e1069]: 当社グループは、当社及び連結子会社2社で構成され、耐火煉瓦の製造・販売を基礎として産業向け耐火物の製造販売、セラミックス分野を始めとするプラントの設計・施工、建築材料及び舗装用材の販売等の事業を展開しております。当社グループにおける各事業と各社の位置付け及びセグメントとの関連は、次のとおりであります。なお、次の4部門は「第5 経理の状況 1 連結財務諸表等 (1)連結財務諸表 注記事項 セグメント情報等」に掲げるセグメントの区分と同一であります。
                      - paragraph [ref=e1070]
                      - paragraph [ref=e1071]: "[耐火物事業]"
                      - paragraph [ref=e1072]: 当社は、耐火煉瓦、不定形耐火物、その他の耐火材料の製造・販売を行っております。これらの製品は、セメント業界などの産業で使用され、高温下での耐久性や耐火性が求められる炉や窯などの建設や補修、修理に利用されております。当社の製品は、高品質かつ高耐久で信頼性が高く、顧客の要求スペックに応えるカスタマイズやサポートも可能であります。
                      - paragraph [ref=e1073]
                      - paragraph [ref=e1074]: "[プラント事業]"
                      - paragraph [ref=e1075]: プラント事業は、工業炉などの設備の設計・製造・施工を行うプラント部門と、工業炉の中に耐火物を施工するエンジニアリング部門とに分かれております。
                      - paragraph [ref=e1076]: ・プラント部門
                      - paragraph [ref=e1077]: プラント設備の設計、製造、施工、販売を行っております。プラント部門で製造している製品は、ガス、重油、電気などを熱源に対象物を焼成する工業炉と、製造ラインにおける自動化設備であります。当社のプラント設備は、セラミックス業界や化学業界など様々な分野で使用され、生産性向上や省エネルギー化などの効果をもたらしております。ロータリーキルンの設計、製造、施工、販売を行う岩佐機械工業株式会社はこのプラント部門に含まれております。
                      - paragraph [ref=e1078]: ・エンジニアリング部門
                      - paragraph [ref=e1079]: 主にセメント製造、石灰製造、環境・再資源化事業など素材産業の分野のプラント設備向けに、当社で製造した耐火物を活用して、設計・施工から提案型技術サービスまで一貫して提供しております。また、当社は世界トップクラスのセメント設備メーカーであるデンマークのFLSmidth Cement社の日本販売店を担っており、同社の製造設備の販売及びメンテナンスを行っております。
                      - paragraph [ref=e1080]
                      - paragraph [ref=e1081]: "[建材及び舗装用材事業]"
                      - paragraph [ref=e1082]: 美州興産株式会社が建材及び舗装用材の販売及び施工を行っており、当社が一部の舗装用材と加工製品を製造、供給しております。建材及び舗装用材は工場、ビルディング、公共建造物などに使用される屋内向け塗床材と遊歩道、駐車場、自転車道等に使用される屋外向け舗装材があり、建設業界や都市インフラなど様々な用途で使用されております。これらの製品群は耐久性や施工性に優れており、環境に配慮した製品ラインナップを提供しております。
                      - paragraph [ref=e1083]
                      - paragraph [ref=e1084]: "[不動産賃貸事業]"
                      - paragraph [ref=e1085]: 当社は、所有している不動産の一部をオフィスや住宅向けに賃貸しております。
                      - paragraph [ref=e1086]
                      - paragraph [ref=e1087]: "[その他]"
                      - paragraph [ref=e1088]: 当社は、外注品等を販売しており、セメント・石灰及び環境分野などの様々な分野で使用されております。
                      - paragraph [ref=e1089]
                      - paragraph [ref=e1090]
