                      - paragraph [ref=e982]
                      - heading "3 【事業の内容】" [level=3] [ref=e983]
                      - paragraph [ref=e984]: 当社グループは、当社及び連結子会社(営口窯耐進出口有限公司)の2社で構成されており、耐火物等の製造販売、耐火物納入先の需要に応じた築炉工事(エンジニアリング)を主な事業として取り組んでおります。耐火物は鉄鋼業、化学工業、セメント、ガラスなどの高熱工業には不可欠な基礎資材であり、当社は創立以来その専門メーカーとして営業してまいりました。
                      - paragraph [ref=e985]
                      - paragraph [ref=e986]: 当社グループの事業における当社及び連結子会社の位置付け及びセグメントとの関連は、次のとおりであります。なお、以下に示す区分は、セグメントと同一の区分であります。
                      - paragraph [ref=e987]
                      - paragraph [ref=e988]: 「耐火物等」
                      - paragraph [ref=e989]: 鉄鋼用、非鉄金属用、セメント用、ガラス用、その他窯業用及び環境装置関係炉用を主とした、塩基性れんが、高アルミナ質れんが、粘土質れんが、珪石れんが等の各種耐火れんが及び不定形耐火物等を製造販売しております。
                      - paragraph [ref=e990]
                      - paragraph [ref=e991]: 「エンジニアリング」
                      - paragraph [ref=e992]: 耐火物を使用する各種工業用窯炉、環境設備等の設計・施工を行っており、必要に応じてメンテナンス工事等を請け負っております。
