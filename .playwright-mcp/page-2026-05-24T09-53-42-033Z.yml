                      - heading "3【事業の内容】" [level=3] [ref=e1079]
                      - paragraph [ref=e1080]: 当社グループは、当社、子会社17社により構成されており、主な事業(耐火物関連)は鉄鋼向け耐火煉瓦、不定形耐火物及び非鉄金属向け黒鉛坩堝、ニューセラミックス等の製造販売であります。その他、環境関連製品、窯業機械器具製造、建築、修繕、運輸他の事業を行っております。
                      - paragraph [ref=e1081]: 当社グループの事業内容及び当社と関係会社の当該事業に係る位置付けは次の通りであります。
                      - paragraph [ref=e1082]: なお、次の4つの区分は「第5 経理の状況 1 連結財務諸表等 (1)連結財務諸表 注記事項」に掲げるセグメントの区分と同一であります。
                      - paragraph [ref=e1083]: (耐火物関連事業)
                      - paragraph [ref=e1084]: (1) 日本
                      - paragraph [ref=e1085]: 当社は、耐火煉瓦、不定形耐火物、ニューセラミックス等の製造販売及び黒鉛坩堝の販売を行っております。
                      - paragraph [ref=e1086]: 明智セラミックス(株)、(株)ユーセラミック、(株)水野セラミックスは、上記の製品を製造し、当社が販売を行っております。
                      - paragraph [ref=e1087]: 日ノ丸窯業(株)は、耐火断熱煉瓦の製造販売を行っております。
                      - paragraph [ref=e1088]: (2) 北米
                      - paragraph [ref=e1089]: TYKアメリカINC.は、北米において耐火煉瓦、不定形耐火物の製造販売を行い、当社の製品の販売も行っております。
                      - paragraph [ref=e1090]: (3) ヨーロッパ
                      - paragraph [ref=e1091]: TYK Ltd.(イギリス)は、ヨーロッパにおいて耐火煉瓦、不定形耐火物の製造販売を行っております。
                      - paragraph [ref=e1092]: TYKヨーロッパGmbH(ドイツ)は、ヨーロッパにおいてTYK Ltd.の製品及び当社の製品の販売を行っております。
                      - paragraph [ref=e1093]: (4) アジア
                      - paragraph [ref=e1094]: 台湾東京窯業股份有限公司は、アジアにおいて耐火煉瓦、不定形耐火物の製造販売を行い、当社の製品の販売も行っております。
                      - paragraph [ref=e1095]: 青島東窯陶瓷有限公司は、アジアにおいて黒鉛坩堝の製造販売を行っております。
                      - paragraph [ref=e1096]
                      - paragraph [ref=e1097]: (その他の事業)
                      - paragraph [ref=e1098]: 環境関連製品については、当社が廃棄物のリサイクルのための機器、リサイクル製品の販売を行っております。
                      - paragraph [ref=e1099]: 窯業機械器具の製造、修繕については、豊栄興業(株)が主として当社グループに販売しております。
                      - paragraph [ref=e1100]: 建築、修繕等については、(株)中日ホームが当社グループ及び一般顧客へ販売しております。
                      - paragraph [ref=e1101]: 運輸については、(株)トーヨー流通サービスが主として当社グループの製品の輸送を行っております。
                      - paragraph [ref=e1102]: (株)パークレーンズは、スポーツ施設の運営を行っております。
                      - paragraph [ref=e1103]
