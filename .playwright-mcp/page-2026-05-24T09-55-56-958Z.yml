                      - paragraph [ref=e981]: 当社の事業内容は、セラミックス事業とエンジニアリング事業とに大別されます。
                      - paragraph [ref=e982]: なお、セグメントと同一の区分であります。
                      - paragraph [ref=e983]: セラミックス事業は、セラミックス製品を当社堺工場及び東山工場で製造し販売するもので、当社の製品は、ほとんどがエンドユーザーである電子部品、食品、薬品、塗料等の各メーカーにおける生産工程で使用されるセラミックス製の道具類、備品、機械部品等の消耗品であります。
                      - paragraph [ref=e984]: エンジニアリング事業は、セラミックス事業とは異なり製造工場は持たず、加熱装置や計測機器等を商品として仕入し販売しております。
