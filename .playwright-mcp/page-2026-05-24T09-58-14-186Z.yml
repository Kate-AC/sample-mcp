                      - heading "3 【事業の内容】" [level=3] [ref=e953]
                      - paragraph [ref=e954]: 当社グループ(当社及び当社の関係会社)は、当社、連結子会社(ジェイ アイ シー ベトナム有限会社、以下、この項においてJICベトナム)の計2社で構成されており、建築関連、プラント関連の工事、国内外での製品等の販売を主な事業として取り組んでおります。
                      - paragraph [ref=e955]: 当社グループは、ゾノトライト系けい酸カルシウムを基材とした各種の保温材、防耐火建材等の製造、販売、及び設計・施工、関連資材の販売、並びにアスベスト関連のコンサルティング、除去工事等を行っております。当社グループの製品は、1000°Cに耐えうる耐火性、断熱性等の性能と、軽量で加工しやすく、経年変化が少ないなどの特性を持ち、高層建築物や石油化学プラント、火力・原子力発電所等において、耐火材、不燃材、保温材等として、幅広く使用されております。
