                        - paragraph [ref=e1065]
                      - paragraph [ref=e1066]
                      - heading "(1) 建築関連" [level=3] [ref=e1067]
                      - heading "a) 建材" [level=5] [ref=e1068]
                      - paragraph [ref=e1069]: 当社は、ゾノトライト系けい酸カルシウム材を基材として、以下のような建材等を提供しています。
                      - paragraph [ref=e1070]: i)耐火被覆材:熱に弱い鉄骨のはり・柱、免震装置といった建物の構造部材を被覆して、火災時に構造部材を火炎や熱から護り、建物の倒壊を抑制することで、人命や財産を護る役割を担う耐火材として、建築基準法に基づく認定を取得した製品を提供しています。
                      - paragraph [ref=e1071]: ii)内装建材:建築基準法では特定条件の建築物やその部位に対し、火災時の延焼抑制のために燃えない建材(不燃建材)を使用することが義務付けられており、当社では、けい酸カルシウム板を、デザイン加工できる不燃の内装材として供給しています。他にも、非常用発電機等の煙突用断熱材や、文化財等を保管する展示ケース・収蔵庫の湿度環境を整える調湿建材としても供給しています。
                      - paragraph [ref=e1072]: iii)多機能材:当社のけい酸カルシウム材は、加工性・吸水性等の機能を併せ持っており、建材以外の用途に加工しやすさを活かしたCFRP用型材、彫刻・刻字向け工芸用ボードや、洗剤に使用するための吸油性の高い無機粉体等を販売しています。
                      - heading "b) 完成工事" [level=5] [ref=e1073]
                      - paragraph [ref=e1074]: 当社では、耐火被覆材の販売にとどまらず、施工請負までを一貫して行っています。耐火被覆材は、建築物の火災安全性を担保するものであり、自社工事の場合は責任施工となり、協力会社に施工を依頼しますが管理業務は当社の社員が行い、要求事項が充足されているか責任を持ちます。万一、契約不適合責任期間内に生じた不具合は、全て当社の責任で修復します。また、製造と施工を一貫して行うことで顧客の改善要望を製品設計に円滑に反映する体制を保持しています。
                      - paragraph [ref=e1075]: 他に、建物に施工された吹付けアスベストや、アスベスト含有建材の除去工事も請け負っています。
                      - heading "c) その他" [level=5] [ref=e1076]
                      - paragraph [ref=e1077]: 顧客の要求に応じて要求に関連する商品を仕入れて提供する事業も行っております。主要なものとして、建物の鉄骨はりにスリーブ管等を設置するための貫通孔用の耐火被覆材があります。高性能熱膨張性耐火ゴムシートを利用した商品となっております。
                      - heading "(2) プラント関連" [level=4] [ref=e1078]
                      - heading "a) 保温材" [level=5] [ref=e1079]
                      - paragraph [ref=e1080]: 当社は、ゾノトライト系けい酸カルシウム材を基材として、以下のような保温材等を提供しています。
                      - paragraph [ref=e1081]: i)プラント用保温材:プラント施設は様々な温度域の設備があり、その中でもボイラーや反応器などの熱設備や高圧蒸気用の温熱配管等は内部が高温になるため、熱を逃がさないようにする保温を行う必要があります。種々の保温材のうちでも、1000°Cの高い耐熱性を持つけい酸カルシウム保温材は、これらの熱設備等に対して適性が高い保温材として採用されています。
                      - paragraph [ref=e1082]: また、東南アジア・東アジアを中心とした海外プラントでの保温材需要に対応して、JICベトナムで、バイオマス(もみ殻)を原燃料としたけい酸カルシウム保温材を製造し、供給しています。
                      - paragraph [ref=e1083]: ii) 工業用断熱材:高い耐熱性が要求される工業炉の断熱材や、蓄熱暖房機やスチームオーブンレンジ等の断熱材等にけい酸カルシウム断熱材を供給しています。
                      - paragraph [ref=e1084]: また、顧客からの要求に応じて他材料との複合材の開発等も行っています。
                      - heading "b) 耐火被覆材" [level=5] [ref=e1085]
                      - paragraph [ref=e1086]: 当社は、建築の耐火被覆材のノウハウを応用して、ゾノトライト系けい酸カルシウム材を基材としたプラントにおける鉄骨部材の耐火被覆材を提供しています。
                      - heading "c) 完成工事" [level=5] [ref=e1087]
                      - paragraph [ref=e1088]: 当社ではけい酸カルシウム保温材の販売にとどまらず、その施工請負までを一貫して行っており、高性能断熱材を製造し、それを用いて断熱工事を行うことで顧客の事業における省エネ効果やCO2排出の削減に貢献し、より高いレベルの品質管理を実現しています。また、自社製保温材以外の他種の保温材(プラント用保温材は上述のように様々な温度域があり、場所に応じて適した保温材が選定されます)を用いての施工も行い、プラント全体の保温保冷工事を一括して行う体制を整えています。
                      - paragraph [ref=e1089]: 他に、断熱工事や施工されたアスベスト含有建材の除去工事も請け負っています。
                      - heading "d) 環境装置" [level=5] [ref=e1090]
                      - paragraph [ref=e1091]: 当社では、廃棄物の有効利用等のための機械装置を販売しています。
                      - heading "e) その他" [level=5] [ref=e1092]
                      - paragraph [ref=e1093]: 顧客の要求に応じて要求に関連する商品を仕入れて提供する事業も行っております。主要なものとして、上記a)に記載したJICベトナムの製品であるけい酸カルシウム保温材があります。当社のけい酸カルシウム保温材との違いは、もみ殻を燃料とし、燃え残った灰を保温材の原料として利用したバイオマス商品となっていることであります。
                      - paragraph [ref=e1094]
                      - paragraph [ref=e1095]: 事業系統図は、次のとおりであります。
                      - paragraph [ref=e1096]
                      - paragraph [ref=e1098]: （画像は省略されました）
