                      - paragraph [ref=e990]
                      - heading "3 【事業の内容】" [level=3] [ref=e991]
                      - paragraph [ref=e992]: 当社グループは、当社及び子会社3社、持分法適用会社1社で構成され、その事業の内容及び位置づけ並びにセグメントとの関連は、次のとおりであります。
                      - paragraph [ref=e993]
                      - paragraph [ref=e994]: 当社グループが営んでいる主な事業は、ステンレス関連事業であるステンレス管、ステンレス条鋼、ステンレス加工品、鋼管の製造販売であり、併せて、パイプ加工の省力化用としてパイプ切断機等の機械の製造販売であります。当社グループのセグメントは、製造・販売体制を基礎とした地域別のセグメントから構成されており、個々の連結会社を集約した「日本」と「インドネシア」の2つを報告セグメントとしております。
                      - paragraph [ref=e995]
                      - paragraph [ref=e996]: (日本)
                      - paragraph [ref=e997]: ステンレス関連事業に区分される、ステンレス管、条鋼、鋼管及びその加工品・関連製品の製造販売は当社において行うほか、その一部製品の加工をモリ金属(株)、関東モリ工業(株)において行っております。
                      - paragraph [ref=e998]
                      - paragraph [ref=e999]: (インドネシア)
                      - paragraph [ref=e1000]: 海外のインドネシアにおいては、連結子会社であるPT. MORY INDUSTRIES INDONESIAがステンレス管の製造から販売まで行い、事業活動を展開しております。
                      - paragraph [ref=e1001]
                      - paragraph [ref=e1002]: 持分法適用会社のAuto Metal Company Limitedはタイに所在し、主に同国内とその周辺地域を市場として二輪車及び自動車業界向けステンレス管の製造販売を行っており、当社はその発行済株式総数の40%を保有し、技術支援を行っております。
                      - paragraph [ref=e1003]
                      - paragraph [ref=e1004]: 事業の系統図は次のとおりであります。
                      - paragraph [ref=e1005]
