                      - heading "3 【事業の内容】" [level=3] [ref=e1020]
                      - paragraph [ref=e1021]: 当社の事業は、特殊合金素形材及びその精密加工品の製造販売並びに不動産の賃貸を主な事業内容としております。
                      - paragraph [ref=e1022]: 当社の当該事業に係わる位置付けは、次のとおりであります。
                      - paragraph [ref=e1023]: なお、セグメントと同一の区分であります。
                      - heading "(1) 特殊合金事業" [level=4] [ref=e1024]
                      - paragraph [ref=e1025]: 当社の鋳造工場及びネットワーク化した外注メーカーにおいて、半導体及びFPD製造装置業界向けの低熱膨張合金鋳物、鉄鋼業界向けの高温高強度合金鋳物等の付加価値の高い製品を製造し販売を行っております。また、当社ブランド材を含む素形材を当社の鋳造工場で製造又は外注メーカーより調達し、当社の鋳造工場又は外注メーカーにおいて機械加工、熱処理、鍛造又は圧延等の処理を施した精密加工製品(半導体及びFPD製造装置用部品等)及び鍛圧製品(棒材及びワイヤー等)等を製造し販売を行っております。
