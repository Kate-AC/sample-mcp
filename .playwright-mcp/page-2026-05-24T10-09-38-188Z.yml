                    - generic [ref=e739]:
                      - heading "3【事業の内容】" [level=3] [ref=e740]
                      - paragraph [ref=e741]: 当社グループ(当社及び連結子会社)は、当社((株)オービーシステム)及び子会社1社で構成されており、技術革新が急速に進む情報サービス産業において、システムインテグレーション(注1)サービスの提供を役務としており、既存技術の強化に加え、DX(デジタルトランスフォーメーション)(注2)やクラウドコンピューティングなど新たな技術分野にも事業展開しております。
                      - paragraph [ref=e742]: 当社グループは、この50年の歴史の中で、(株)日立製作所と40年以上、三菱電機ソフトウエア(株)と30年以上にわたりシステム開発実績を積み重ねることで、ビジネスパートナーとしての関係を築いており、売上高の大きな割合を占める大口取引先となっております。
                      - paragraph [ref=e743]
                      - paragraph [ref=e744]: 当社グループ事業は、システムインテグレーションサービス事業の単一セグメントでありますが、事業戦略上、事業領域を「金融事業」、「産業流通事業」、「社会公共事業」、「ITイノベーション事業」の4つのサービスラインに区分しております。
                      - paragraph [ref=e745]: 各サービスラインの概要及び特徴と、協力会社との連携は以下のとおりであります。
                      - paragraph [ref=e746]
                      - paragraph [ref=e747]: (1)サービスラインの概要
                      - paragraph [ref=e748]: 1 金融事業
                      - paragraph [ref=e749]: 銀行、保険、証券、クレジットの各分野のシステムインテグレーション、コンサルティング、ソフトウェアの設計・開発・保守等、ソフトウェア開発の全領域に対応した総合的なサービス事業を、顧客であるエンドユーザや国内ITメーカ、元請システムインテグレーターからの受託開発、運用保守を中心に展開しております。
                      - paragraph [ref=e750]: 当サービスラインは、以下の分野で構成しております。
                      - paragraph [ref=e751]: <銀行分野> 基幹系三大業務(預金、貸出、為替)及び付随業務、周辺業務のシステム開発、保守並びにミドルウェア(注3)の開発、保守
                      - paragraph [ref=e752]:
                        - text: <保険分野> 損害保険業務(火災、自動車)及び生命保険業務(養老、終身、医療)のシステム
                        - text: 開発、保守
                      - paragraph [ref=e753]: <証券分野> 保管振替システムの構築
                      - paragraph [ref=e754]: <クレジット分野> 請求管理業務及び審査業務、個人ローン業務のシステム開発、保守
                      - paragraph [ref=e755]
                      - paragraph [ref=e756]: 2 産業流通事業
                      - paragraph [ref=e757]: 産業流通、マイコン、医療の各分野は東京・名古屋・大阪に組織を配置し、ソフトウェアの設計・開発・保守全般における総合サービス事業を、顧客であるエンドユーザや国内ITメーカ、元請システムインテグレーターからの受託開発、運用保守を中心に展開しております。
                      - paragraph [ref=e758]: 当サービスラインは、以下の分野で構成しております。
                      - paragraph [ref=e759]: <産業流通分野> 流通/医薬大手ユーザや自動車関連システムの開発、保守
                      - paragraph [ref=e760]: <マイコン分野> 家電製品のマイコンソフト、車載・モータ系組み込みソフトの開発
                      - paragraph [ref=e761]: <医療分野> 自社製品「臨床検査システム/CLIP」(注4)、「健診システム/MEX-Plus」(注5)の販売及び顧客ニーズに即したカスタマイズ開発、保守
                      - paragraph [ref=e762]
                      - paragraph [ref=e763]: 3 社会公共事業
                      - paragraph [ref=e764]: 社会基盤(電力ICT、社会インフラ、衛星通信)分野、メディア情報分野、公共分野、文教・教育系分野のシステムインテグレーション、コンサルティング、ソフトウェアの設計・開発・保守等、ソフトウェア開発の全領域に対応した総合的なサービス事業を、顧客であるエンドユーザや国内ITメーカ、元請システムインテグレーターからの受託開発を中心に展開しております。
                      - paragraph [ref=e765]: 当サービスラインは、以下の分野で構成しております。
                      - paragraph [ref=e766]: <電力ICT分野> 電力託送システム(注6)の開発、保守
                      - paragraph [ref=e767]: <社会インフラ分野> 道路、河川、ダム等の監視制御システムの開発
                      - paragraph [ref=e768]: <衛星通信分野> 衛星通信システムの開発
                      - paragraph [ref=e769]: <メディア情報分野> クラウド環境でのWEBシステム(注7)、ビッグデータ加工システム(注8)の開発
                      - paragraph [ref=e770]: <公共分野> 自治体業務のパッケージ導入や稼働維持並びに官公庁のシステム再構築
                      - paragraph [ref=e771]: <文教・教育系分野> 教学事務(入試・教務・学生生活)及び教育支援システムの開発、保守
                      - paragraph [ref=e772]
                      - paragraph [ref=e773]: 4 ITイノベーション事業
                      - paragraph [ref=e774]: 自社の競争力強化に向け、先端技術をリードする人材育成及び、様々な事業領域のデジタルソリューションサービス事業拡大に向け、元請システムインテグレーターとの協業を推進しております。また、各分野のシステム全体を支えるフロントシステムエンジニア(注9)として、システム全体の見積り、業務支援アプリケーションパッケージの設定、オンプレミスシステム(注10)及びクラウドシステムのインフラ構築、プロジェクトマネージメントのサービス事業を、顧客であるエンドユーザや国内ITメーカ、元請システムインテグレーターからの受託開発、運用保守を中心に展開しております。
                      - paragraph [ref=e775]: 当サービスラインは、以下の分野で構成しております。
                      - paragraph [ref=e776]: <システム基盤ソリューション分野> オンプレミス環境におけるシステム開発、保守
                      - paragraph [ref=e777]: <クラウドソリューション分野> パブリッククラウド環境への移行・同環境におけるシステム開発、保守、データ利活用ソリューションの開発、保守
                      - paragraph [ref=e778]: <金融ソリューション分野> クレジットカードシステム、投資信託システム等の開発、保守
                      - paragraph [ref=e779]
                      - paragraph [ref=e780]: (2)サービスラインの特徴
                      - paragraph [ref=e781]: 1 金融事業
                      - paragraph [ref=e782]: 都銀・地銀のほか、流通系銀行の勘定系システムに加え、ネットバンキングシステムなどのサブシステムの開発・保守を基盤事業としておりますが、今後は、オープンイノベーション(注11)に関わるDX化へと基軸を移行しつつあります。
                      - paragraph [ref=e783]: これらDX化への取組みとしまして、次世代オープン勘定系システム(注12)開発への参画、保険分野での現行システムをサーバ環境で動作させるためのマイグレーション(注13)事業及び、ビッグデータ活用に向けたシステムのオープン化事業への参画等のDX化事業にも注力しております。
                      - paragraph [ref=e784]
                      - paragraph [ref=e785]: 2 産業流通事業
                      - paragraph [ref=e786]: 産業流通分野では、ビッグデータを活用した受注予測システムの構築やクラウドコンピューティング需要が増加しております。DX関連事業は伸長しており、これまで培った要素技術に加え、分野間での技術融合による新しいソリューション事業の構築を目指しております。小売り事業者の販売、物流管理システム開発等に参画しております。また、マイコン分野では培った開発技術によるIoT組み込みソリューション事業の拡大に注力しております。
                      - paragraph [ref=e787]: さらに、医療分野では、開発に取り組んでまいりましたAIを活用したシステム操作をサポートする機能を実装した臨床検査システム「CLIP-Version5.1 AI」を2025年4月に発表し、販売を開始いたしました。高齢化等による来院患者数の増加により臨床検査も増加の一途をたどっており、「CLIP-Version5.1 AI」は検査業務に対する効率化のニーズに寄与するシステムとなっております。
                      - paragraph [ref=e788]: 新健診システム「MEX-Plus」含め、ご利用いただいております全国の病院・施設システムの更改や新しい顧客への導入を目指しております。
                      - paragraph [ref=e789]
                      - paragraph [ref=e790]: 3 社会公共事業
                      - paragraph [ref=e791]: メディア情報分野では、クラウド環境でのWEBシステム開発、ビッグデータ加工システム開発を中心とした、DX化に力を入れ顧客ニーズに対応しております。この一環として、電力ICT分野のシステム開発にも積極的に取組んでおり、大きな成長分野となっております。
                      - paragraph [ref=e792]: また、公共分野では自治体のガバメントクラウド(注14)(Gov-Cloud)活用を見据えて、自治体情報システムの標準化対応へ参画する等、DX化事業にも注力しております。
                      - paragraph [ref=e793]
                      - paragraph [ref=e794]: 4 ITイノベーション事業
                      - paragraph [ref=e795]: 当サービスラインの主な特徴は、顧客ファーストの観点で、一人ひとりがお客様目線で考え、お客様の事業継続、発展に貢献し、お客様に近いところでシステム全体を支えるフロントシステムエンジニアとして活動している集団であります。
                      - paragraph [ref=e796]: 顧客のDX化事業を含めた業務改革の取組みを支援するシステム開発や、元請システムインテグレーターとの協業によるデジタルソリューション事業の拡大に注力しております。
                      - paragraph [ref=e797]
                      - paragraph [ref=e798]: (3)協力会社との連携
                      - paragraph [ref=e799]: 顧客ニーズの高度化、オープン化(注15)の進展によるシステムの複雑化が進み、開発の難易度がますます増加しております。各サービスラインにおいては、システムインテグレーションサービスの提供に当たって、システムの構築にかかる顧客ニーズに柔軟に応えられるよう当社グループの社員のみならず、当社グループと協力会社(外注先)が技術を共有し連携して一体となってプロジェクトに参画しております。
                      - paragraph [ref=e800]: 当社グループでは協力会社のシステムエンジニアが当社グループと一体になれるよう安定的、継続的な発注、定期的な情報交換を実施し、長期的な協力関係を構築できるよう推進しており、大型プロジェクトへの参画可能な環境を整えております。
                      - paragraph [ref=e801]
                      - paragraph [ref=e802]: (注)1.システムインテグレーションとは、利用目的に合わせて、多種多様のハードウェア・ソフトウェア・メディア・通信ネットワークなどのなかから最適のものを選択し、組み合わせて、コンピュータシステムを構築することであります。
                      - paragraph [ref=e803]: 2.DX(デジタルトランスフォーメーション)とは、デジタル技術の活用によって企業のビジネスモデルを変革し、新たなデジタル時代にも十分に勝ち残れるように自社の競争力を高めていくことであります。
                      - paragraph [ref=e804]: 3.ミドルウェアとは、OS(基本機能を提供するオペレーティングシステム)と、アプリケーション(各種業務処理の遂行に特化したソフトウェア)との間に位置付けられ、OSが提供する基本機能を用いてアプリケーションの開発負担を軽減することに重点を置いたソフトウェアのことをいいます。
                      - paragraph [ref=e805]: 4.自社製品「臨床検査システム/CLIP」とは、血液、血清、細菌、病理、生理といった各検査部門ごとにデータ管理する分散型処理機構と検査室の依頼、検査データを一元管理する臨床検査システムです。
                      - paragraph [ref=e806]: 5.自社製品「健診システム/MEX-Plus」とは、病院及び健診センターにおける、人間ドックや企業健診などをサポートする健康診断支援システムです。
                      - paragraph [ref=e807]: 6.電力託送システムとは、電力会社が所有する送配電網を利用して需要家に電気を供給する電力小売事業者に対して、請求する託送料金を送電線の使用量に応じて計算するシステムです。
                      - paragraph [ref=e808]: 7.当社開発のWEBシステムには、違法動画コンテンツ検出システム及びテレビCM枠購入予約システム等があります。
                      - paragraph [ref=e809]: 8.当社開発のビッグデータ加工システムには、テレビメーカ視聴ログを活用する各種システムがあります。
                      - paragraph [ref=e810]: 9.フロントシステムエンジニアとは、ユーザの要望を的確に把握し、ITの技術をどう活かせば要望を満たせるかユーザと一緒に考え、システム導入に向けユーザと一緒にプロジェクトを推進していくエンジニアをいいます。
                      - paragraph [ref=e811]: 10.オンプレミスシステムとは、サーバやソフトウェアなどの情報システムを、使用者が管理している施設の構内に機器を設置して運用することです。
                      - paragraph [ref=e812]: 11.オープンイノベーションとは、メーカやベンダに拘らず、異業種、異分野が持つ技術やアイデア、サービス、ノウハウを組み合わせ、革新的なビジネスモデルにつなげる方法論です。
                      - paragraph [ref=e813]: 12.次世代オープン勘定系システムとは、(株)静岡銀行と(株)日立製作所が共同開発したオープン基盤上で稼働する勘定系システムです。(株)日立製作所は本システムを製品化し、他の金融機関への導入を進めています。
                      - paragraph [ref=e814]: 13.マイグレーションとは、サーバを移行することです。最近では、クラウド環境への移行が主流となってきております。
                      - paragraph [ref=e815]: 14.ガバメントクラウドとは、政府の情報システムについて、共通的な基盤・機能を提供する複数のクラウドサービス(IaaS、PaaS、SaaS)の利用環境のことです。
                      - paragraph [ref=e816]: 15.オープン化とは、従来、大規模な情報システムで採用されていた、メーカごとに非公開の固有の仕様を持つメインフレーム(大型汎用機)を中核とするシステム構成から、標準規格や公開仕様に基づく汎用製品を主体としたシステム構成に置き換えることです。
                      - paragraph [ref=e817]
                      - paragraph [ref=e818]
