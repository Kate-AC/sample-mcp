                      - paragraph [ref=e1025]: 当社グループは、当社、連結子会社5社(株式会社エクスラボ、EXTREME VIETNAM Co.,LTD.、
                      - paragraph [ref=e1026]: 株式会社Dragami Games、エス・エー・エス株式会社、酒田エス・エー・エス株式会社)により構成されております。
                      - paragraph [ref=e1027]: なお、当連結会計年度より、株式会社EPARKテクノロジーズは、当社保有株式の全部を譲渡したため、連結範囲から除外しております。
                      - paragraph [ref=e1028]: 事業区分は、法人向けにゲーム・WEBシステムなどのソフトウェア開発サービスを提供する「デジタル人材事業」及び「受託開発事業」、個人向けに当社グループが保有するゲーム関連知的財産を活用し、家庭用及びスマートフォンゲーム、キャラクターグッズなどのサービスまたは商品を提供する「コンテンツプロパティ事業」の3事業に大別されます。
                      - paragraph [ref=e1029]: なお、上記事業区分は「第5 経理の状況 1 連結財務諸表等 (1)連結財務諸表 注記事項(セグメント情報等)」に掲げるセグメントの区分と同一であります。
