                          - row "事業内容 デジタル人材事業は、ゲーム・スマートフォンアプリ・WEB・IT企業などに対し、プログラミング・グラフィック開発スキルを持った当社社員(クリエイター&エンジニア)が顧客企業に常駐し、開発業務を提供しております。 受託開発事業は、スマートフォンアプリ開発案件、クラウドプラットフォーム構築、CRM(Customer Relationship Management)構築~導入~運用など、案件を持ち帰り形式にて受託し、納品するサービスを提供しております。案件種別としては、「新規開発」「保守・運用」「追加開発」「ラボ型開発」の4つに大別されます。 子会社の株式会社エクスラボ、EXTREME VIETNAM Co.,LTD.、エス・エー・エス株式会社、酒田エス・エー・エス株式会社については当該事業に含まれます。 コンテンツプロパティ事業は、当社グループが保有するゲーム・キャラクター等の知的財産を活用し、様々な事業展開を行うセグメントであり、具体的には、ゲーム開発・販売・運営のほかに、当社グループが保有するゲームタイトルまたはキャラクターなどを様々な商材へ使用許諾を行うライセンス事業が含まれております。 子会社の株式会社Dragami Gamesについては当該事業に含まれます。" [ref=e1048]:
