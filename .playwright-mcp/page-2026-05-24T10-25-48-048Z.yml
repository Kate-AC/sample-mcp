                    - generic [ref=e836]:
                      - paragraph [ref=e837]
                      - heading "3 【事業の内容】" [level=3] [ref=e838]
                      - paragraph [ref=e839]: 当社グループは、当社、連結子会社ESTIC (THAILAND) CO.,LTD.、ESTIC AMERICA, INC.及び関連会社SHANGHAI ESTIC CO.,LTD.の4社で構成されており、見込生産品であるナットランナ、ハンドナットランナ、サーボプレス、受注生産品であるネジ締付装置の製造・販売及び当社製品の修理・点検を主な事業とした単一セグメントで事業活動を行っております。したがって当社グループの事業内容を製品に関連付けて記載しております。
                      - paragraph [ref=e840]
                      - paragraph [ref=e841]: グループ各社の位置付けと事業内容
                      - paragraph [ref=e842]: (1) 当社
                      - paragraph [ref=e843]: 当社は、ナットランナ、ハンドナットランナ、サーボプレス、ネジ締付装置の製造・販売及び当社製品の修理・点検を行っております。
                      - paragraph [ref=e844]: (2) ESTIC (THAILAND) CO.,LTD.
                      - paragraph [ref=e845]: ESTIC (THAILAND) CO.,LTD.は、当社製品(ナットランナ、ハンドナットランナ、サーボプレス)の販売及び据付、修理、その他付随業務を行っております。
                      - paragraph [ref=e846]: (3) ESTIC AMERICA, INC.
                      - paragraph [ref=e847]: ESTIC AMERICA, INC.は、当社製品(ナットランナ、ハンドナットランナ、サーボプレス)の販売及び据付、修理、その他付随業務を行っております。
                      - paragraph [ref=e848]: (4) SHANGHAI ESTIC CO.,LTD.
                      - paragraph [ref=e849]: SHANGHAI ESTIC CO.,LTD.は、当社製品(ナットランナ、ハンドナットランナ、サーボプレス)の中国国内向け販売、修理・点検及び、同ナットランナを組み込んだネジ締付装置の製造・販売を行っております。
                      - paragraph [ref=e850]
                      - paragraph [ref=e851]: (ナットランナ)
                      - paragraph [ref=e852]: ナットランナはACサーボモーター(※1)、センサー、コントローラ(※2)で構成され、ACサーボモーターを駆動源とし、センサーからの情報をコンピュータにて解析しモーターを制御することにより、いわゆるボルト、ナット類のネジの締め付けを「ネジ締め付け理論」(※3)に基づいて最良の締め付け管理を行い、あらゆる使用環境でも緩まないネジ締め付けを実現する工具であります。
                      - paragraph [ref=e853]: 当製品は、機械装置に組み込んで使用しますので、主にセットメーカーに対して販売しております。
                      - paragraph [ref=e854]
                      - paragraph [ref=e855]: (ハンドナットランナ)
                      - paragraph [ref=e856]: ハンドナットランナはナットランナをハンディタイプにしたもので、ナットランナが機械装置に組み込んで使用するのに対して、ハンドナットランナは作業者が直接手に持って締め付けを行う工具で、尚且つナットランナと同等の締め付け精度管理ができます。
                      - paragraph [ref=e857]: 従来、締め付けトルク(※4)が高くなるに従い締め付け時に発生する反力が強くなり人間が手で保持することが困難でしたが、パルス制御技術(※5)(日本、米国にて特許取得済み)により締め付け精度を確保したまま反力のみを軽減することにより実現した製品です。
                      - paragraph [ref=e858]
                      - paragraph [ref=e859]: (サーボプレス)
                      - paragraph [ref=e860]:
                        - text: サーボプレスはナットランナの技術を応用したプレス機で、ACサーボモーター(※1)、センサー、コントローラ(※2)で構成され、ACサーボモーターを駆動源とし、モーターの回転力をボールネジ(※6)を介し直線運動に変えることにより対象物をプレスします。
                        - text: 従来の油圧式、エアー式や機械式プレスに比べ、消費エネルギーの低減、静寂性、高精度制御、トレーサビリティーに優れた特徴を有します。主に、圧入、カシメ、打ち抜き等に使用されます。
                      - paragraph [ref=e861]
                      - paragraph [ref=e862]: (ネジ締付装置)
                      - paragraph [ref=e863]: ネジ締付装置は、ユーザー仕様に基づき上記ナットランナを組み込み、全てオーダーメードで設計製作するネジ締め付け専用の自動機械または半自動機械であります。
                      - paragraph [ref=e864]: 自動車や自動車部品などの組立工程におけるネジ締め付けに使用され、特に量産ラインにおいて使用される場合が大半です。
                      - paragraph [ref=e865]: 受注の内容によっては、ネジ締め付け部分以外にボルトの自動供給装置やその他周辺機器を設計製作する場合もあります。
                      - paragraph [ref=e866]
                      - paragraph [ref=e867]: (修理・点検)
                      - paragraph [ref=e868]: ナットランナ、ハンドナットランナ、サーボプレスの有償修理、ネジ締め付け精度の点検等を行っております。
                      - paragraph [ref=e869]
                      - paragraph [ref=e870]
                      - paragraph [ref=e871]: これらのナットランナ、ハンドナットランナ及びネジ締付装置は、主に国内外の自動車メーカーや自動車部品メーカーを中心に組立工程におけるネジの締め付けに使用されております。
                      - paragraph [ref=e872]: 特に自動車等の可動製品においてはその振動によりネジが緩みやすい環境にあり、ネジの緩みは直接当該製品の品質、機能の低下や安全性の低下につながる問題に影響する可能性が高く、製品の品質管理上緩まないネジの締め付けは重要な要素となっております。
                      - paragraph [ref=e873]: また、製造工程における締め付けデータを外部出力することができ、製品固有の組立工程履歴を残すことにより製造物責任法(PL法)にも対応可能であり、またインターフェースにより製造ライン全体のネットワーク管理にも対応しております。
                      - paragraph [ref=e874]
                      - paragraph [ref=e875]
                      - paragraph [ref=e876]: ※用語説明
                      - paragraph [ref=e877]: 1 ACサーボモーター
                      - paragraph [ref=e878]: 交流電源により駆動するモーターで、微細な回転位置と回転速度の制御が可能なモーターです。
                      - paragraph [ref=e879]: モーターの中では優れた制御性能を有します。
                      - paragraph [ref=e880]
                      - paragraph [ref=e881]: 2 コントローラ
                      - paragraph [ref=e882]: コンピューターを内蔵し、センサーから受信した情報をコンピューターで解析して最適なネジ締め付けを行うためにモーターの回転を制御する信号を発信する、いわばシステム全体の頭脳に相当します。
                      - paragraph [ref=e883]
                      - paragraph [ref=e884]: 3 ネジ締め付け理論
                      - paragraph [ref=e885]: ネジには弾性域と塑性域があります。
                      - paragraph [ref=e886]: 弾性域とは、ネジをねじ込んでいく過程において、ネジ首は伸びていきますが、鉄の性質上弾性があるので伸びたものは縮もうとする力があり、その弾性がある状態を弾性域といいます。
                      - paragraph [ref=e887]: 弾性域で振動が加わりますと、ネジ首が伸び縮みをし、その瞬間に雌ネジと雄ネジのそれぞれのネジ山の間に隙間ができることによりネジが緩みます。
                      - paragraph [ref=e888]: 塑性域とは、弾性域をこえてネジを伸ばしていくとネジが伸びきり縮む力がなくなる領域をいいます。塑性域までネジを伸ばすと、弾性がないので振動を加えてもネジは伸び縮みせず、ネジ山に隙間ができることがないので緩みません。
                      - paragraph [ref=e889]: なお、塑性域を超えてネジを伸ばしていくと最後には破断します。
                      - paragraph [ref=e890]: 弾性域から塑性域に変化する点を降伏点といい、緩まないネジ締めとはこの降伏点を越えた点(出来るだけ降伏点に近い塑性域)までネジを伸ばす締め付け管理により実現します。
                      - paragraph [ref=e891]
                      - paragraph [ref=e892]
                      - paragraph [ref=e893]: 4 締め付けトルク
                      - paragraph [ref=e894]: ネジを締め付ける際の力の強さをいいます。単位はNm(ニュートンメーター)で表示します。
                      - paragraph [ref=e895]
                      - paragraph [ref=e896]: 5 パルス制御技術
                      - paragraph [ref=e897]: コンピュータ制御によりモーター出力のON、OFFを繰返し発生させることにより、高い締め付けトルクでも保持している手にかかる反力を軽減する技術です。
                      - paragraph [ref=e898]
                      - paragraph [ref=e899]: 6 ボールネジ
                      - paragraph [ref=e900]: 円柱状になったネジとナットで構成され、ナット部もしくはネジ部の一方を固定してネジ部を回転させるとネジ山のピッチ×回転数分の距離をナット部もしくはネジ部が直線方向へ移動します。主に回転運動を直線運動に変換する場合に使用されます。
                      - paragraph [ref=e901]
