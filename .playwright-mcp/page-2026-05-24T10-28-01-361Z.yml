                      - paragraph [ref=e1055]: 当社グループは、当社及び連結子会社5社で構成されており、主に土木建設工事に係る試験総合サービス事業を展開している他、工事総合サービス事業、ソフトウェア開発販売事業及びその他事業を行っております。
                      - paragraph [ref=e1056]: 当連結会計年度より、工事部門の管理方法を最適化することを目的として、従来「地盤補強サービス事業」としていた報告セグメントの名称を「工事総合サービス事業」へ変更いたしました。併せて、従来「試験総合サービス事業」に含めていた業務の一部を「工事総合サービス事業」へ移管しております。
