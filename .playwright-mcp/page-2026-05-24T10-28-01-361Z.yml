                      - paragraph [ref=e1163]:
                        - text: これに加えて営業部門が技術部門と連携し、土木建設現場(フィールド)にて顧客が抱える課題を聴取し、顧客
                        - text: がどのような調査・試験を実施すべきかを提案します。調査・試験結果の報告時には分析結果の活用法や考察を加
                        - text: えるなどのサポートを行う、フィールド&サポート型のコンサルティング営業を行うことにより、他社との差別化
                        - text: を図っております。当社では以下の試験調査を実施しており、各試験は大別すると試験センター内で行われる室内試験と土木建設現場で行う現場試験とに分類されます。
                      - paragraph [ref=e1164]
                      - paragraph [ref=e1165]: a 土質・地質調査試験
                      - paragraph [ref=e1166]: 土質試験におきましては、施工前や施工中において、土質等の状態確認を行うための調査試験を現場で直接行うほか、室内試験として土壌の水分や粒径、密度、強度等を確認する試験や液状化対策のための試験等を当社の試験センターにて実施しております。
                      - paragraph [ref=e1167]:
                        - text: 地質調査試験におきましては、現場試験として設計に必要な地質調査及び地すべり等の対策に必要なボーリン
                        - text: グ調査を行っております。
                      - paragraph [ref=e1168]
                      - paragraph [ref=e1169]:
                        - text: また、官公庁等の公共事業を行う際に、土地の取得や建物等を移転する必要がある場合には、国・地方公共団
                        - text: 体等は正当な補償を行わなければなりません。所有者や借家人等の関係者に生じる補償の算定を行う、補償コンサルタント業務を行っております。さらに、設計測量業務も受注しております。
                      - paragraph [ref=e1170]
                      - paragraph [ref=e1171]: b 非破壊調査試験
                      - paragraph [ref=e1172]:
                        - text: 非破壊調査試験におきましては、橋梁、トンネル等のコンクリート構造物の経年に伴う強度の劣化や内部傷を
                        - text: 超音波やレーダを用いて調査し、その影響を診断する業務を行っております。
                      - paragraph [ref=e1173]: また、道路や鉄道の路盤及びトンネル壁面の維持管理のための定期点検を目的として、長距離を短時間で診断可能な高速移動型非接触3Dレーダ探査車両(以下RSV)を用いた物理探査業務も行っております。これは、レーダ探査を高速(最大速度約80km/h)移動しながら行うことが可能なため、高速道路では車線規制等を行うことなく、鉄道においては列車の運行していない時間帯に短時間で効率的な探査を行うことが可能となっております。RSVの高速探査結果をAI、独自アルゴリズムにて処理を行い高速解析を実現しております。
                      - paragraph [ref=e1174]
                      - paragraph [ref=e1175]: c 環境調査試験
                      - paragraph [ref=e1176]:
                        - text: 環境調査試験におきましては、土木建設工事等による人体や自然への影響が心配される環境汚染に対し自然環
                        - text: 境に係る調査試験を行っております。現場調査では自然環境に関する動植物の植生調査、生活環境に関する室内
                        - text: 空気環境測定、騒音・振動調査等を行っております。また室内分析試験では、安全を支える環境水・排水等の水質分析、土壌汚染分析等の環境計量分析を行っております。これらにより得られた調査試験結果において環境に対しての総合的な評価を行っております。
                      - paragraph [ref=e1177]: また、当社の分析したデータの信頼性の確保を目的として計量証明事業登録を行い、計量証明書の発行を行っております。
                      - paragraph [ref=e1178]
                      - paragraph [ref=e1179]: (2) 工事総合サービス事業
                      - paragraph [ref=e1180]: 前年度の事業区分見直しにより、従来の「地盤補強サービス事業」は「工事総合サービス事業」へ改称されました。これまでは、建設物の建設予定地や中・大型物件の建設予定地を対象に地盤調査および補強工事を主な事業内容とし、社会インフラや一般住宅等において、軟弱地盤による不同沈下(注)のリスクを未然に防ぐため、建設前の地盤調査と調査結果に応じた最適な補強・改良工法の提案を行ってまいりました。
                      - paragraph [ref=e1181]: 本年度からは、一昨年まで試験総合サービス事業に含まれていたコンクリート構造物の補強工事や土壌汚染の浄化工事を移管し、事業領域をさらに拡大しました。これにより、地盤分野にとどまらず、インフラ補修や環境分野までを含めた一貫対応体制を構築し、より幅広い社会的ニーズに応える工事総合サービス事業としての体制を強化しております。
                      - paragraph [ref=e1182]: (注)不同沈下:基礎や構造物が傾いて沈下することであります。
                      - paragraph [ref=e1183]
                      - paragraph [ref=e1184]: (3) ソフトウェア開発販売事業
                      - paragraph [ref=e1185]: 当社グループが行うソフトウェア開発販売事業は、グループ会社である株式会社アイ・エス・ピー及び株式会社アドバンスドナレッジ研究所が行うソフトウェアの開発販売が主な業務内容となっております。
                      - paragraph [ref=e1186]: 株式会社アイ・エス・ピーが開発する主なソフトウェアは、3次元空間設計システム「LandForms(ランドフォームス)」でありまして、土木及び測量設計向けの設計支援システムであります。近年推奨されている
                      - paragraph [ref=e1187]: 「i-Construction」による効率化や、「BIM/CIM」による3次元化に寄与できるソフトウェアであり、さらなる技術革新を進め市場環境の需要に対応しております。
                      - paragraph [ref=e1188]: 株式会社アドバンスドナレッジ研究所が開発する主なソフトウェアは、流体・温熱環境シミュレーションソフト「FlowDesigner(フローデザイナー)」であります。通常の熱流体解析ソフトは、設計者が目標とする改善案を見つけるために、膨大な数の解析を繰り返す必要がありますが、このFlowDesignerは、目標値を入力して逆解析によって改善すべき条件を導くことができる、熱流体解析分野では世界初となるノンパラメトリック逆解析機能を実現したソフトウェアになります。昨今世界中で猛威を振るっている新型コロナウイルス感染に対しても、「屋内空間の十分な換気」が非常に重要になっておりますが、設計段階から気体の流れを見える化することで、対策することが可能となっております
                      - paragraph [ref=e1189]
                      - paragraph [ref=e1190]: 事業の系統図は、次のとおりであります。
                      - paragraph [ref=e1191]
