                      - paragraph [ref=e1102]
                      - paragraph [ref=e1103]: (1)試験総合サービス事業
                      - paragraph [ref=e1104]:
                        - text: 土木建設工事において建造物や道路、橋、トンネルなどのインフラを整備するためには、法令等で定められた試
                        - text: 験を行う必要があり、また、その場所が安全に構造物を施工できるかを調査する必要があります。当社では、構造
                        - text: 物が安全に建設できるように土や地盤の状態を調べる土質・地質調査試験、コンクリート構造物、鋼構造物等の状態や劣化を調査する非破壊調査試験、土木建設工事等が環境に与える影響を詳細に調査分析する環境調査試験を行っております。特に日本では地盤の軟弱なところや山地、傾斜地などに構造物を施工せざるを得ない場合が多く、近年の災害の激甚化にともなって、これらの調査は非常に重要なものとなっております。試験総合サービス事業では、土木建設工事の進行に応じてこのような土質・地質調査試験、非破壊調査試験、環境調査試験の多種多様な調査・試験を当社にて一括受注できるワンストップサービスを行っております。
                      - paragraph [ref=e1105]: 試験総合サービス事業の業務区分における土木建設工事の進捗状況との関係は以下のとおりであります。
