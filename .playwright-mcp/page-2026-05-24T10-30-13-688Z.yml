                      - heading "3 【事業の内容】" [level=3] [ref=e784]
                      - paragraph [ref=e785]: 当社グループ(当社及び当社の関係会社)は、当社と連結子会社(OKM VALVE(M)SDN.BHD.、奥村閥門(江蘇)有限公司)の計3社で構成されており、建築、発電、造船、各種プラント等、幅広い業界における流体配管に使用されるバタフライバルブを中心とした流体制御機器の製造、販売を主な事業として取り組んでおります。
                      - paragraph [ref=e786]: なお、当社グループはバルブ製造販売事業の単一セグメントであるため、セグメント別に代えて、「陸用」、「舶用」の市場区分別に示しております。「陸用」の市場区分については、工場市場や建築市場のニーズを捉えて市場に喜ばれる製品を販売し、「舶用」の市場区分については、船舶市場で多くの販売実績を基盤に、環境対策分野のニーズを捉えた製品の販売を行っております。
                      - paragraph [ref=e787]
                      - paragraph [ref=e788]: (1)事業の特徴
                      - paragraph [ref=e789]: 当連結会計年度における当社グループ連結売上高は、「陸用」が48.0%、「舶用」が52.0%の割合を占めておりま
                      - paragraph [ref=e790]: す。
                      - paragraph [ref=e791]: 「陸用」に関しては、建築設備、化学、電力ガス、鉄鋼、紙パルプ、水処理業界等幅広い顧客に採用いただいているのが特徴であります。「舶用」に関しては、各造船所に納入しております。なお、「舶用」の製品に関連して、世界の環境規制にてIMO(注1)がNOx(注2)3次規制での舶用排気ガス処理装置の搭載を2016年1月1日より義務付けました。当社はいち早く処理装置における世界的なライセンサー2社(当該2社で市場占有率約90%)(注3)による船舶排ガス用バルブの製造販売認証を取得しております。この船舶排ガス用バルブ市場で、当社は過半のシェア獲得を目指しております。
                      - paragraph [ref=e792]: 「陸用」及び「舶用」いずれも、製品技術、品質管理体制、納期管理体制、メンテナンス対応等で顧客より高い評価をいただいております。
                      - paragraph [ref=e793]: また、当社グループの海外売上高比率は約2割を占めており、主に韓国や中国向けに船舶排ガス用バルブを販売しております。
                      - paragraph [ref=e794]
                      - paragraph [ref=e795]: (注)1.International Maritime Organization(国際海事機関)
                      - paragraph [ref=e796]: 2.窒素酸化物
                      - paragraph [ref=e797]: 3.日本舶用工業会「各国舶用機関の生産動向」より
                      - paragraph [ref=e798]
                      - paragraph [ref=e799]: (2)当社の取引先について
                      - paragraph [ref=e800]: 当社の製品は、空調設備、造船、半導体、石油、化学、鉄鋼、電力、水道、食品等の幅広い業界の大手顧客に納入され、高層ビル、工場、空港、船、駅、ドーム、遊園地等の最終需要先において当社の製品が使用されております。
                      - paragraph [ref=e801]: 例えば、超高層ビル「あべのハルカス」では、すべての空調設備に当社のバルブが使用されています(下右図)。
                      - paragraph [ref=e802]
                      - paragraph [ref=e803]: 最終需要先イメージ図 超高層ビル「あべのハルカス」
                      - paragraph [ref=e805]: （画像は省略されました）
                      - paragraph [ref=e806]
                      - paragraph [ref=e807]: 以上を踏まえた、当社グループの事業系統図は、次のとおりとなります。
                      - paragraph [ref=e808]
                      - paragraph [ref=e810]: （画像は省略されました）
                      - paragraph [ref=e811]: (3)主な製品
                      - paragraph [ref=e812]: a バタフライバルブ
                      - paragraph [ref=e813]: 弁体(輪っかの中の円板)を90度回転して開閉します。中間開度での流量調整機能に優れ、幅を取らず、省スペースでの設置が可能です。また、電子制御バルブについては、コンピューターからの信号によって弁体の開度を調整し、流体をコントロールします。
                      - paragraph [ref=e814]
                      - paragraph [ref=e815]: b ナイフゲートバルブ
                      - paragraph [ref=e816]: 鋭いエッジを有するプレートの出し入れで開閉します。各種スラリー、粉粒体、固形物、パルプストック等、一般のバルブでは処理できない流体を止めることが可能です。
                      - paragraph [ref=e817]
                      - paragraph [ref=e818]: c ピンチバルブ
                      - paragraph [ref=e819]: ゴムチューブを押し挟んで流路を開閉します。固形物が混入しても完全遮断が可能です。また、長寿命でメンテナンスが容易です。
                      - paragraph [ref=e820]
