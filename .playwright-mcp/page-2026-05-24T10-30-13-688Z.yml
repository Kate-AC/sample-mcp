                        - paragraph [ref=e859]
                      - paragraph [ref=e860]
                      - paragraph [ref=e861]: 当社は顧客ニーズに合わせたカスタマイズバルブを開発・製造・販売し、標準製品では対応できないニッチ市場を開拓しており、型式、サイズ、部品、材質、制御方法といったカスタマイズの組み合わせにより、10万種類を超える製品種類を取扱っております。
                      - paragraph [ref=e862]
                      - paragraph [ref=e864]: （画像は省略されました）
                      - paragraph [ref=e865]
                      - paragraph [ref=e866]: (4)新製品開発
                      - paragraph [ref=e867]: 当社グループにおける新製品開発は、さまざまな種類の試験・実験設備を活用しながら行っております。技術本部では、新商品の構想や設計・解析ソフトによる構造解析等の机上業務を行うと共に、開発項目に対する製品評価等を実施するために実流体実験装置、高温試験装置及び低温試験装置等を活用して流体制御に関する研究開発を実施しております。これら研究開発を通じて長年蓄積してきた顧客ニーズに合わせた多様な試験・実験に基づくデータが、当社グループの新製品開発の大きな手がかりとなっております。
                      - paragraph [ref=e868]: 更に、当社グループでは2020年10月に新たに研究開発センターを滋賀県野洲市に開設しました。当該センターでは、脱炭素化によるエネルギー情勢の変化や環境規制等に伴う新市場へ対応するため、5つの各種試験室を設置しています。従来の試験・実験設備にこれらの新たな試験・実験設備を加え、産官学との一層の連携強化を図ることにより、流体制御に関する研究開発体制の更なる強化を目指してまいります。
                      - paragraph [ref=e869]
