                      - paragraph
                      - paragraph [ref=e855]
                      - paragraph [ref=e856]: (注1) カードユニットとは、パチンコ遊技用プリペイドカードを利用するパチンコ玉貸機のことであります。
                      - paragraph [ref=e857]: (注2) カードとは、パチンコ遊技用プリペイドカードのことであり、生カードとは、プリペイドカードとして必要な情報が記録される前のカードのことであります。
                      - paragraph [ref=e858]: (注3) 店内通信設備工事とは、カードユニット等の機器及び管理コンピューター等店内通信設備を設置する工事のことであります。
