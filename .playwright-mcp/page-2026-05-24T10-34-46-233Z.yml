                      - heading "3【事業の内容】" [level=3] [ref=e828]
                      - paragraph [ref=e829]: 当社グループは、当社、連結子会社(日本ゲームカード株式会社)により構成されており、パチンコプリペイドカードシステム関連事業を行っております。
                      - paragraph [ref=e830]: 日本ゲームカード株式会社の主な事業内容である、プリペイドカードシステムには、大きく分けて二つの種類があります。一つ目は第三者発行型と呼ばれる販売者と購入者との間の決済を第三者であるカード発行会社が担うもの、二つ目は自家発行型と呼ばれる発行者及びその関係者のみにおいて使用されるものであります。日本ゲームカード株式会社では、一部自家発行型システムを取り扱っておりますが、第三者発行型システムが主力事業となっております。
                      - paragraph [ref=e831]: 日本ゲームカード株式会社の事業における取扱品目は、(a)機器(b)カード(c)システム使用料(d)工事・保守の4品目に大別されます。それぞれの詳細につきましては、次のとおりであります。
                      - paragraph [ref=e832]
                      - paragraph [ref=e833]: a.機器について
                      - paragraph [ref=e834]: 機器はカードユニット、券売入金機、精算機等を主に代理店経由で販売しております。
                      - paragraph [ref=e835]: カードユニットはICカード対応型となっております。券売入金機は入金された金額額面のカードを発行する装置、精算機はカード残高の精算を行う装置であります。
                      - paragraph [ref=e836]
                      - paragraph [ref=e837]: b.カードについて
                      - paragraph [ref=e838]: ICカード及びICコインは、券売入金機又は入金機能付カードユニットで入金できます。
                      - paragraph [ref=e839]: リサイクル可能な入金対応式で半永久的に使用可能であり、カード及びコイン媒体の販売に加えて、遊技者の消費金額に応じて加盟店から「情報管理料」を徴収いたします。
                      - paragraph [ref=e840]
                      - paragraph [ref=e841]: c.システム使用料について
                      - paragraph [ref=e842]: 基幹的なインフラであるプリペイドカードシステムを運用するための費用として、システム使用料を徴収しております。
                      - paragraph [ref=e843]
                      - paragraph [ref=e844]: d.工事・保守について
                      - paragraph [ref=e845]: 機器の設置工事は、カードユニット等の販売と合わせて主に代理店が加盟店との契約に基づき行います。カードユニット等の機器の保守は、主に代理店が加盟店との直接契約により行います。
                      - paragraph [ref=e846]: 一方、加盟店に設置し貸与する店内通信設備の工事につきましては、委託業者に工事を委託し、工事代金につきましては主に代理店又は日本ゲームカード株式会社から加盟店に請求いたします。
                      - paragraph [ref=e847]
                      - paragraph [ref=e848]: なお、当社は、有価証券の取引等の規制に関する内閣府令第49条第2項に規定する特定上場会社等に該当しており、これにより、インサイダー取引規制の重要事実の軽微基準については連結ベースの数値に基づいて判断することとなります。
                      - paragraph [ref=e849]
                      - paragraph [ref=e850]: <日本ゲームカード株式会社>
                      - paragraph [ref=e851]: 事業の系統図は、次のとおりであります。
                      - paragraph [ref=e852]
                      - paragraph [ref=e853]
