                      - heading "3【事業の内容】" [level=3] [ref=e1122]
                      - paragraph [ref=e1123]: 当社グループ(当社及び当社の関係会社)は、当社、子会社6社で構成され、オートモティブ機器、インダストリアル機器、その他の3部門に関係する事業を主として行っており、その製品はあらゆる種類にわたっております。各事業における当社及び関係会社の位置付け等は下記表のとおりであります。なお、第5 経理の状況 1.連結財務諸表等 (1)連結財務諸表 注記事項(セグメント情報等)に掲げるとおり、当社は、製造・販売体制を基礎とした地域別のセグメントから構成されており、「日本」、「米国」、「オランダ」、「中国」、「タイ」の5つを報告セグメントとしておりますが、当社及び連結子会社は給油機器及びその関連製品の製造・販売を行っており、国内においては当社及び国内連結子会社が、海外においては米国、オランダ、中国及びタイの現地法人が、それぞれ担当しているため、以下の分類は、当社の主な部門別(市場分野別機器)の区分によっております。
                      - paragraph [ref=e1124]
                      - paragraph [ref=e1125]: (オートモティブ機器)
                      - paragraph [ref=e1126]: 当部門は、ハンドポンプ、バケットポンプ、ルブリケーター等のオイル・グリースを供給する潤滑給油機器やタイヤサービス機器、排気ガス排出システム及びフロンガス関連機器等の環境整備機器であり、主な市場は自動車をはじめとする車両整備工場やガソリンスタンド等であります。当社が製造・販売するほか(株)ヤマダメタルテックがその一部を製造しております。
                      - paragraph [ref=e1127]
                      - paragraph [ref=e1128]: (インダストリアル機器)
                      - paragraph [ref=e1129]: 当部門は、各種産業分野においてオイル・グリースをはじめ塗料・接着剤・インキ・化学薬品等の流体を圧送するためのエアポンプやダイアフラムポンプ及びそのシステム化製品であります。当社が製造・販売し、また海外市場向け販売にヤマダアメリカINC.、ヤマダヨーロッパB.V.、ヤマダ上海ポンプ貿易有限公司及びヤマダタイランドCO.,LTD.があります。
                      - paragraph [ref=e1130]
                      - paragraph [ref=e1131]: (その他)
                      - paragraph [ref=e1132]: 当部門は、上記部門に属さないサービス部品・修理等であり、当社のほか(株)ヤマダプロダクツサービスが、サービス部品の販売、修理等を行っております。
