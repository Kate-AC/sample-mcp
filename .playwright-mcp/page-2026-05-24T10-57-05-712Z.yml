                      - heading "3【事業の内容】" [level=3] [ref=e1034]
                      - paragraph [ref=e1035]: (1) 当社グループは、当社及び子会社2社で構成され、給水栓・給排水金具・継手及び配管部材の製造・加工・仕入れ及び販売を主な内容としております。
                      - paragraph [ref=e1036]: 当該事業に係わる各社の位置づけは、当社が主に日本で給水栓・給排水金具・継手及び配管部材の製造・加工・仕入れ及び販売をするほか、子会社である大連北村閥門有限公司が、中国で給水栓の内、主に単独水栓を製造し、大部分を当社へ供給するとともに、一部中国国内で販売しております。また、当社より購入した製品の中国国内での販売もしております。なお、組立時の部品は、当社からの供給及び一部中国国内で調達しております。また、2016年9月に設立した、KVK PHILIPPINES,INC.は、2017年6月から生産を開始しており、当社から調達した部品を組付加工し、当社へ供給しております。
