                      - heading "3【事業の内容】" [level=3] [ref=e1010]
                      - paragraph [ref=e1011]:
                        - text: 当社グループは、当社、子会社9社および関連会社2社で構成されております。
                        - text: 当社グループの事業内容は、自動調整弁の製造販売であります。
                        - text: 製造については、「日本」セグメントに属する当社と製造子会社カワキ計測工業(株)が行っているほか、「アジア」セグメントに属するタイ国における製造子会社ヨシタケ・ワークス・タイランド(以下、YWT)が行っております。また、YWTは米国における製造関連会社エバーラスティング・バルブおよび国内における輸入子会社ヨシタケ・アームストロング(株)と共に、当社に対して材料の供給を行っております。
                      - paragraph [ref=e1012]: 販売については、「日本」セグメントに属する当社と米国における販売関連会社アームストロング・ヨシタケが行っているほか、「アジア」セグメントにおいては、YWTより供給した製品をマレーシア国における販売子会社Doctrine Engineering (M) Sdn.Bhd.、インドネシア共和国における販売子会社PT. Yoshitake Engineering Indonesia、シンガポール共和国における販売子会社Access Professional Singapore Pte. Ltd.、ベトナム社会主義共和国における販売子会社Access Professional Vietnam Company Ltd.および中国における販売子会社Yoshitake Wuxi Fluid Technology Co., Ltd.にて直接販売を行っております。また、その他の製造子会社および製造関連会社も直接販売を行っております。
                      - paragraph [ref=e1013]
                      - paragraph [ref=e1014]: 以上に述べた事項の概要図は次のとおりであります。なお、連結子会社レッツ(株)は重要性が乏しいため、記載を省略しております。
