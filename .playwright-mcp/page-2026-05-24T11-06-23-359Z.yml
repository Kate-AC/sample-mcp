                      - paragraph [ref=e868]:
                        - text: (注)収集運搬・処分事業では、顧客となる事業者に対して廃棄物の収集運搬・処分のサービスを提供し、その対価として処理代金を受け取っております。また、処分する際に発生した廃棄物については、外部処理業者に処理を委託しており、その際に処理費を支払っております。
                        - text: リサイクル事業では、収集運搬・処分事業及び行政受託事業により発生した再資源化品や有価物等を、顧客となる資源物買取業者等に売却することにより、その代金を受け取っております。
                        - text: 行政受託事業では、顧客となる行政機関から委託を受けて当該行政区で発生する可燃・不燃ごみ、容器包装ごみを収集運搬、処分し、その対価として処理代金を受け取っております。また、それらを処分する際に発生した廃棄物については、外部処理業者に処理を委託しており、その際に処理費を支払っております。
