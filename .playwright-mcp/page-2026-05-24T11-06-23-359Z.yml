                    - generic [ref=e826]:
                      - paragraph [ref=e827]
                      - heading "3 【事業の内容】" [level=3] [ref=e828]
                      - paragraph [ref=e829]: 当社グループ(当社及び当社の関係会社)は、当社(株式会社要興業)及び連結子会社1社(株式会社ヨドセイ)により構成されており、東京23区を中心にして、産業廃棄物に分類されるビン、缶、ペットボトル、粗大ごみ等や、一般廃棄物に分類される可燃ごみ等の収集運搬・処分、リサイクル(資源物の売却)を中核とした事業を行っております。
                      - paragraph [ref=e830]: 創業以来、「環境保全と循環型社会に貢献する企業であること」を企業理念として掲げ、快適な都市生活と資源の 循環を推進するための適正な廃棄物処理と資源リサイクルを業として、お客様から信頼される質の高いサービスを提供し、関係する行政、企業、地域との共生を図り、永続発展を目指して株主と社員を大切にすることを経営方針としております。
                      - paragraph [ref=e831]: 当社グループは総合廃棄物処理事業の単一セグメントであるため、セグメントごとの記載を省略しておりますが、当社グループの主なサービスは収集運搬・処分事業、リサイクル事業、行政受託事業の3つに区分されます。
                      - paragraph [ref=e832]: (1) 収集運搬・処分事業
                      - paragraph [ref=e833]: 当事業では、当社及び株式会社ヨドセイにおいて、主に東京23区内の事業所における事業活動に伴い発生する産業廃棄物と事業系一般廃棄物の収集運搬・処分を行っております。可燃ごみ、段ボール、古紙等の一般廃棄物、及びビン、缶、ペットボトル、粗大ごみ等の産業廃棄物等、事業所から日常排出される廃棄物のほぼ全ての品目について収集運搬の許可を有しており、それらの廃棄物を、475台を数える当社グループ保有車両で、約420名のドライバー(うち、322名が正社員)により運搬しております(2025年3月31日現在)。
                      - paragraph [ref=e834]: 当社は、東京23区内において、各排出事業者と8,100か所以上の排出現場を定期的に回収する契約を結んでいます。集められた廃棄物は、東京23区内に8つある自社リサイクルセンターを始め、行政の営む清掃工場等に運ばれ処理されております。その際、自社開発の配車ソフトの活用により、多数の現場・車両・積み下ろし先をいわば「路線化」し、有機的に結びつけることができるため、より短い距離でより多くの廃棄物を運搬することができているものと考えております。
                      - paragraph [ref=e835]: なお、収集運搬にあたっては、全車両に特殊Gセンサ付きデジタルタコグラフ(注)1.ドライブレコーダー等の各種機器及びGPS装置を搭載した無線を導入し、安全運転に努めるとともに、現場状況に即応したリアルタイムの指示を行う体制となっております。
                      - paragraph [ref=e836]: 当社グループでは、「廃棄物の処理及び清掃に関する法律(以下「廃棄物処理法」という。)」の遵守の徹底が、事業の安定的継続の大きな要素であると認識しております。このため、毎月のドライバーミーティング、毎朝の点呼等の機会を利用しての教育訓練により、許可を持たない廃棄物の運搬はしないことや、産業廃棄物管理票(以下「マニフェスト」という。)(注)2.の授受を徹底させる等々の法令遵守を徹底させております。
                      - paragraph [ref=e837]: 排出事業者は、産業廃棄物の処理を委託する際、その種類毎に、当該の許可を持つ収集運搬業者と処分業者の両方の会社と直接契約を結ぶこと、及び引き渡しの際のマニフェストの交付と保存が義務化されています。したがって、内容によっては、事務手続が非常に煩雑となりますが、この点、当社は事業活動に伴い発生する殆どの廃棄物の収集運搬許可を有し、かつ処分先として19か所の行政の清掃工場のみならず、8つの中間処理施設(リサイクルセンター)を有していることから、当社のみで一貫した取扱いが可能となります。これにより、当社と契約を結んでいる排出事業者の法令で定められた事務処理は大幅に簡略化されております。
                      - paragraph [ref=e838]: 当社は排出事業者がより容易に遵法できるよう、自社で電子マニフェスト登録サポートシステム(EDIシステム)(注)3.を開発し、多くの顧客企業に利用していただいております。また廃棄物処理法の遵法を促すべく、自社社員により廃棄物セミナーを自社、及び顧客企業先で継続的に開催しております。
                      - paragraph [ref=e839]: 上述の遵法精神に基づく取組により、廃棄物の処理先をコスト重視ではなくコンプライアンス重視で選択する排出事業者との結びつきを強め、適正な価格での廃棄物処理委託契約を維持でき、収益の安定化及び業容の拡大に結びついているものと考えております。
                      - paragraph [ref=e840]: (注) 1.特殊Gセンサ付きデジタルタコグラフとは、デジタルタコグラフ(デジタル式運行記録計)に加速度センサを装備し、車両に実際に加わる前後・左右の衝撃を検知し、同時に速度やエンジン回転数等を計測することによって、音声で運転手に危険運転を注意することができるシステムです。
                      - paragraph [ref=e841]: 2.産業廃棄物管理票(マニフェスト)とは、排出事業者が収集運搬業者及び処分業者に委託した産業廃棄物の処理の流れを自ら把握することによって、不法投棄の防止等産業廃棄物の適正な処理を確保することを目的としたマニフェスト制度で用いられる伝票です。排出事業者は、委託した産業廃棄物が最終処分まで適正に処理されたことを確認する義務があります。
                      - paragraph [ref=e842]: 3.電子マニフェストとは、マニフェストに記載すべき情報を電子化し、排出事業者、収集運搬業者、処分業者の3者が廃棄物処理法で定められた情報処理センターを介したネットワークで授受する仕組みです。電子マニフェスト登録サポートシステムとは、当社にて開発した排出事業者と当社と情報処理センターの3者間で電子化されたマニフェストに記載すべき情報の授受を効率的に行うシステムの名称です。
                      - paragraph [ref=e843]
                      - paragraph [ref=e844]
                      - paragraph [ref=e845]: また、廃棄物の体系図を示すと下記のとおりとなります。
                      - paragraph [ref=e846]
                      - paragraph [ref=e848]: （画像は省略されました）
                      - paragraph [ref=e849]
                      - paragraph [ref=e850]:
                        - generic [ref=e851]:
                          - text: (注)廃棄物は、廃棄物処理法より産業廃棄物以外を指す「一般廃棄物」と同法より20種類に指定される「産業廃棄物」の二つに区分されます。さらに一般廃棄物については家庭廃棄物及び事業系一般廃棄物へ、産業廃棄物はあらゆる事業活動に伴い排出される12種類、特定の事業活動に伴い排出される8種類にそれぞれ区分されます。
                          - text: 上記、収集運搬・処分事業では、このうち事業系一般廃棄物及びあらゆる事業活動に伴い排出される12種類の産業廃棄物を取り扱い、後述する行政受託事業では家庭廃棄物を取り扱っております。
                      - paragraph [ref=e852]
                      - paragraph [ref=e853]: (2) リサイクル事業
                      - paragraph [ref=e854]: 当事業では、当社において、リサイクルセンターに運び込まれた廃棄物である古紙、ビン、缶、ペットボトル、粗大ごみ等の選別、破砕、圧縮、梱包等の処理を行い資源化し、再資源化品や有価物等を業者に売却しております。また、段ボールや一部の機密書類については、専用車両で回収し、古紙業者に売却もしくは製紙工場に直納しております。
                      - paragraph [ref=e855]: 当社グループでは、資源物を質・量ともに安定的に取扱っていることにより、当事業において、売却先に対する一定の価格交渉力を確保することができているものと考えております。このため、一時的に排出される資源物を取扱う他社と比較して、高値で資源物を売却することが可能となっております。
                      - paragraph [ref=e856]
                      - paragraph [ref=e857]: (3) 行政受託事業
                      - paragraph [ref=e858]: 当事業では、当社において、東京23区の依頼により、当該区から発生する不燃ごみや容器包装ごみ(ビン、缶、ペットボトル、プラスチック容器ごみ)、金属系粗大ごみをリサイクルセンターで資源化処理しております。また、株式会社ヨドセイにおいて、家庭から排出される一般廃棄物を東京23区との雇上契約(注)により、行政の処理施設及び処分場に運搬しております。
                      - paragraph [ref=e859]: 廃棄物の終着点である最終処分場の残余地は年々減少しており、地球資源の枯渇も深刻であります。このため、廃棄物の減量及びリサイクルをより一層推進する必要があります。各自治体より排出される廃棄物を当社グループのリサイクルセンターにて中間処理することにより、資源の再利用と最終処分場に持ち込む廃棄物の減容が可能となります。特に、不燃ごみについては、足立区、板橋区、中野区、荒川区、豊島区及び台東区の依頼により、リサイクルセンターで選別資源化しておりますが、そのニーズは年々高まっており、他自治体への発展拡大も見込まれております。このように行政との取引実績を積み上げていることから、行政より仕事を受注しやすい体制となっております。また、容器包装ごみについては、足立区、板橋区、中央区他、金属系粗大ごみについては、足立区、豊島区、荒川区、北区、新宿区他での実績があります。
                      - paragraph [ref=e860]: (注)東京23区の家庭系一般廃棄物の運搬を請負う業者を「雇上(ようじょう)業者」と呼び、その契約を「雇上契約」といいます。
                      - paragraph [ref=e861]
                      - paragraph [ref=e862]
                      - paragraph [ref=e863]: 以上述べた事項を事業系統図によって示すと次のとおりであります。
                      - paragraph [ref=e864]
