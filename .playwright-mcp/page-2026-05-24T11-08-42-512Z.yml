                      - heading "3【事業の内容】" [level=3] [ref=e974]
                      - paragraph [ref=e975]: 当社グループ(当社及び当社の関係会社)は、当社(株式会社ライトアップ)、子会社1社により構成されており、当社の理念「全国、全ての中小企業を黒字にする」に基づき、インターネット関連技術を活用し、様々な業種の中小・零細企業に対する総合的な経営支援を主たる事業として展開しております。
                      - paragraph [ref=e976]: 当社グループの事業内容は、以下のとおりであります。なお、次の2事業は「第5経理の状況 1 連結財務諸表等 (1)連結財務諸表 注記事項」に掲げるセグメントの区分と同一の区分であります。
                      - paragraph [ref=e977]
                      - paragraph [ref=e978]: (1) DXソリューション事業
                      - paragraph [ref=e979]: DXソリューション事業は、中小企業の生産性向上を図るための業務のDX化推進を目的としたITツール導入支援、人材育成支援、マーケティング支援、資金確保支援等を行っており、主なサービスは以下のとおりです。
                      - paragraph [ref=e980]
                      - paragraph [ref=e981]: (a) Jシステム(補助金・助成金自動診断システム)
                      - paragraph [ref=e982]: Jシステムは、自社で活用できる補助金・助成金を自動で診断し、そのままオンラインで申請依頼が可能なシステムです。主な販売先は、多くの中小・零細企業を顧客として有する地方金融機関、大手・中堅企業及び地方自治体です。Jシステム導入企業等は、自社サービスの受注等の際に、Jシステムを既存顧客等への支援施策あるいは新規顧客等の獲得施策として活用することで、自社サービスの受注率の向上等を図ることができます。なお、申請依頼後は、Jコンサルに引き継がれます。
                      - paragraph [ref=e983]
                      - paragraph [ref=e984]: (b) Jコンサル(DX化による経営課題解決サービス)
                      - paragraph [ref=e985]: Jコンサルは、IT・人材・マーケティング・助成金等の4つの視点から業務のDX化による経営課題の解決と、DX化を推進するための資金確保(補助金・助成金活用等)に関する経営コンサルティングサービスです。当社の経営コンサルティングサービスの強みは、業務のDX化をする際のサービス導入に伴う資金負担を軽減するため、各専門領域の士業と連携し、政府及び地方自治体等が提供する公的支援制度の活用案内を実施している点です。単なる各種商材の提案だけでなく、資金確保策を併せて提案することで、資金に余裕のない多くの中小・零細企業の経営課題の解決を図っております。
                      - paragraph [ref=e986]
                      - paragraph [ref=e987]: (c) JDネット(共同仕入・開発ネットワーク)
                      - paragraph [ref=e988]: JDネットは、全国の中小企業が参加する共同仕入・開発ネットワークです。JDネット参加企業は、参加企業数の規模を活かして、IT、人材、マーケティング等の領域の各種商材・サービスを安価で仕入れ、自社顧客に販売することができるため、収益を確保することが可能となります。
                      - paragraph [ref=e989]
                      - paragraph [ref=e990]: (2) コンテンツ事業
                      - paragraph [ref=e991]: コンテンツ事業は、顧客企業が抱えるマーケティングに関する様々な課題に対して、最適なWebマーケティング支援施策を企画・提供しております。本事業の主なサービスはメールマーケティング支援、ソーシャルメディア活性化支援、コンテンツ制作です。
                      - paragraph [ref=e992]: 主な顧客は大手・中堅企業であり業種業態は多様です。また、直接取引のほか広告代理店を介した間接取引により特定の企業や業種業態に偏らず広範囲に展開すること、及び顧客企業との中長期的な関係を構築することで収益の安定性と継続性を確保しております。
                      - paragraph [ref=e993]: また、多様な業種業態の顧客企業のマーケティング課題を解決するために、独自のWebマーケティングに関するノウハウを蓄積しております。自社のWebエディターや、ソーシャルメディアディレクター、プランナー、ディレクターをはじめとした専門チームが中心となり、社外クリエイターと連携しながら、蓄積したノウハウを活用し、企画からライティング、デザイン、コーディング、運営、改善提案等の各プロセスを担当し、各種Webマーケティング支援施策を一貫して提供する体制を構築しております。
                      - paragraph [ref=e994]
