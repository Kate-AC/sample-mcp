                    - generic [ref=e791]:
                      - paragraph [ref=e792]
                      - heading "3 【事業の内容】" [level=3] [ref=e793]
                      - paragraph [ref=e794]: 高度にネットワーク化され情報化されつつある現代社会において、私たちは非常に多くのパソコンやパッド等のコンピュータを家庭や職場で日常的に目にしています。
                      - paragraph [ref=e795]: 何をするにもパソコンを活用し、どこへ行ってもコンピュータが存在する現代はコンピュータ社会とも呼ばれますが、実は私たちが日常的に目にしているたくさんのパソコンは、コンピュータが活用されているフィールド全体から見れば限定的な一部であり、それを凌ぐ規模のコンピュータが私たちの見えない所で稼動しています。
                      - paragraph [ref=e796]: それは、人々の利便性や安全・快適で豊かな生活を実現するための社会インフラや、経済活動や生産活動に関わる産業インフラに組込まれている産業用コンピュータです。
                      - paragraph [ref=e797]: 社会インフラの具体例としては、電気・ガス・水道等のライフラインを始め、交通・医療・通信・放送・セキュリティーから防衛に至る広範囲に及び、産業インフラとしては、情報・金融・物流・生産等に関わる各種システムや装置があります。これらシステムには例外なくコンピュータが組込まれていて、装置全体の活動を制御する頭脳的役割を担っています。
                      - paragraph [ref=e798]: 当社グループは、これらのインフラシステムに使用される組込型コンピュータ(産業用コンピュータ)及びその周辺製品を事業の対象領域として捉え、当社グループが保有する技術力と生産力を全分野横断的に提供することを営業の基本として、これらに特化した製品の設計と製造を一筋に継続してきました。
                      - paragraph [ref=e799]: この間において、コンピュータの世界は半導体集積回路の技術革新と相まってコストパフォーマンスが向上し、その活用領域が飛躍的に拡大しました。
                      - paragraph [ref=e800]: また、当社グループ製品の顧客である大手システムメーカー(産業用電子機器メーカーや機械装置メーカー等)の多くが、「選択と集中」を標榜した得意分野へのリソース重点配分政策を推進してきた結果、当社グループのような専門メーカーが果たす役割も重要視されるようになり、我々が活躍するチャンスも拡大の一途にあると考えております。
                      - paragraph [ref=e801]: 当社グループが設計・製造する製品は、従来から通信・医療・交通・半導体製造装置・FA機器(注1)・計測装置・セキュリティー等のシステムに組込まれるコンピュータが中心ですが、これらの分野に加えて、最近ではIoT(モノのインターネット)やAI(人工知能)、HPC(スーパーコンピュータ)、及びエッジコンピューティング(注2)分野のコンピュータハードウェアの開発案件も増加しております。
                      - paragraph [ref=e802]: コンピュータ産業を構成する技術領域は極めて広く、当社グループが提供できる専門領域はコンピュータの世界全体から見れば極めて限定的ではありますが、この領域については突出した技術サービスと、良質な製品づくりを通してコンピュータ産業の発展に寄与し、当社グループの顧客を始めとしたステークホルダーに対する使命と責任を果たしていきたいと考えております。
                      - paragraph [ref=e803]
                      - paragraph [ref=e804]: (注1) コンピュータ制御技術を用いて工場を自動化するための機器
                      - paragraph [ref=e805]: (注2) 膨大なデータを処理するクラウドサーバーの負荷を軽減するために、データの発生源に近いところで情報を
                      - paragraph [ref=e806]: 収集し、クラウドへ送る前に情報処理を実行する考え方
                      - paragraph [ref=e807]
                      - paragraph [ref=e808]: 当社グループは、当社(エブレン株式会社)及び連結子会社1社(蘇州惠普聯電子有限公司)により構成されており、産業用電子機器や工業用コンピュータに使用されるバックプレーン、システムラックやコンピュータシャーシ(以下「ラック」(注3)と記載)、及びボードコンピュータ(注4)を含むその他周辺機器等の設計・製造・販売を行っております。
                      - paragraph [ref=e809]: バックプレーンとは、CPUボード(注5)やI/Oボード(注6)等の各種回路基板(ボードコンピュータ)を相互に接続して信号伝送を行う回路及びこれら基板に電力を供給する回路を備え、これら基板の着脱をコネクタを介して自在に接続できるようにしたユニットのことを言います。バックプレーンはこれら回路基板間の全ての信号を統合し、コンピュータとしての基本機能を実現するためのハードウェアであり、人体に例えるなら、全身の神経を統合している脊髄のような役割を果たしています。
                      - paragraph [ref=e810]
                      - paragraph [ref=e811]: (注3) ボードコンピュータを挿入して使用する筐体(箱)
                      - paragraph [ref=e812]: (注4) CPUボードやI/Oボード等を総称した名称
                      - paragraph [ref=e813]: (注5) 計算やプログラムを実行するもので、コンピュータの頭脳に相当する部分
                      - paragraph [ref=e814]: (注6) コンピュータにつながれた入出力機器を制御する部分
                      - paragraph [ref=e815]
                      - paragraph [ref=e816]
                      - paragraph [ref=e818]: （画像は省略されました）
                      - paragraph [ref=e819]
                      - paragraph [ref=e820]: (図)バックプレーン、ラック、ボードコンピュータの模式図
                      - paragraph [ref=e821]
                      - paragraph [ref=e822]: バックプレーンには各種の規格が制定されており、当社グループではそれらの規格に準拠した標準製品も販売しておりますが、顧客である電子機器メーカーや機械装置メーカーの製造する最終製品は多岐にわたり、その要求仕様も異なるため、顧客独自の仕様に合わせて設計したカスタム製品(標準品を部分的に変更し又は独自の仕様で設計して顧客の要求に合わせた製品)の販売が中心となっております。また、バックプレーン単体ばかりでなく、顧客の要求に合わせて製造したラックに組込み、電源ユニットやファン等を取付け、配線等を施した上で、コンピュータ本体として完成した製品の販売も行っております。
                      - paragraph [ref=e823]: バックプレーン及びラックは電子機器本体(筐体)に固定的に組込まれるため交換することが容易ではなく、かつシステムダウンの許されない社会インフラを支える電子機器に応用されることが多いため、極めて高い品質レベルを要求されております。加えて産業用コンピュータの設計・製造は新製品開発と密接に関わるため、大手システムメーカーは自社内で生産するか、当社グループのような独立系メーカーに委託することとなります。
                      - paragraph [ref=e824]: また、多品種少量・変種生産を常とする産業用コンピュータの生産においては、これに柔軟に対応する生産体制が求められます。
                      - paragraph [ref=e825]
                      - paragraph [ref=e826]: 当社グループでは各種のコネクタ、及び様々なサイズや厚さのプリント基板に対応できるようにした自動組立装置(プレスフィットマシン)並びに検査装置(電気検査機)を自社で設計、開発し生産に使用しております。
                      - paragraph [ref=e827]: ボードコンピュータは、用途によりバックプレーンに接続して複数のボードコンピュータと一緒に動作を行うもののほか、1枚のボードコンピュータのみで動作するものがあります。バックプレーンを使用するボードコンピュータは半導体製造装置や鉄道車両等、比較的大規模なシステムに使用される一方、1枚のボードコンピュータのみで動作するものは、IoTやエッジコンピューティングの分野等、比較的小規模な分野で使用します。CPUだけではコンピュータとして成り立たず、コンピュータとして動作させるためにはCPUのほかに記憶装置、入出力装置、通信装置等を回路基板に組込む必要があります。このようなケースにおいて、顧客はCPUの開発に専念し、ボードコンピュータとして動作させることは当社グループが行うケースが増えております。当社グループは、従来のバックプレーンを使用するボードコンピュータの製品開発で培った技術力、開発力を駆使し、IoTやエッジコンピューティング等、時代の流れに沿って様々なニーズに応じたサービスを提供しております。
                      - paragraph [ref=e828]
                      - paragraph [ref=e829]
                      - paragraph [ref=e830]: 産業用電子機器では、保守性、拡張性、汎用性等の利点から、回路基板を自由に抜き差しできるバックプレーン方式が一般的に採用されているため、その応用分野は産業用電子機器業界全般にわたっております。また、ボードコンピュータにおいても同様に業界全般で使用されております。当社グループでは、これら産業用・工業用コンピュータのボード、バックプレーン、バスラック(注7)、システムシャーシ等の設計・製造・販売を行っており、単一セグメントであるため、応用分野別に集計を行っております。主な適用機器を分野別に分類すると次のとおりであります。
