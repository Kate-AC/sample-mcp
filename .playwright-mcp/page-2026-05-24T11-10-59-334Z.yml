                      - paragraph [ref=e872]: 当社グループの事業系統として、当社は海外の仕入先から部材を仕入れるとともに、連結子会社である蘇州惠普聯電子有限公司との間で相互に部材を融通しております。このことにより、仕入の際のスケールメリットの享受や、安くて高品質な部材の調達を可能にしております。また、当社においては組立て等の製造工程の一部を外注先に依頼しております。さらに、蘇州惠普聯電子有限公司から日本国内の顧客に販売することがありますが、その際は当社経由での販売となります。
