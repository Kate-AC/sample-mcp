                      - paragraph [ref=e1016]:
                        - text: 当社グループ(当社及び当社の関係会社)は、当社(株式会社戸上電機製作所)及び子会社8社で構成されており、「産業用配電機器事業」、「プラスチック成形加工事業」、「金属加工事業」及び「その他」の各セグメントにおいて製造及び販売等の事業を行っております。
                        - text: 当社グループの事業における各社の位置付け及びセグメントとの関連は、次のとおりであります。
                        - text: (1)産業用配電機器事業
                      - paragraph [ref=e1017]: 主要な製品は電子制御器、配電用自動開閉器、配電盤及びシステム機器等であります。
                      - paragraph [ref=e1018]: 1電子制御器
                      - paragraph [ref=e1019]: 当社が製造・販売するほか、主に子会社(株)戸上コントロール及び戸上電子(常熟)有限公司が製造し、東京戸上電機販売(株)が販売しております。
                      - paragraph [ref=e1020]: 2配電用自動開閉器
                      - paragraph [ref=e1021]: 当社が製造・販売するほか、主に子会社戸上電気(蘇州)有限公司が製造し、東京戸上電機販売(株)が販売しております。
                      - paragraph [ref=e1022]: 3配電盤及びシステム機器
                      - paragraph [ref=e1023]: 当社が製造・販売するほか、主に子会社(株)戸上デンソーが製造し、東京戸上電機販売(株)が販売しております。
                      - paragraph [ref=e1024]
                      - paragraph [ref=e1025]: (2)プラスチック成形加工事業
                      - paragraph [ref=e1026]: 主要な製品は、自動車業界向けのプラスチック成形加工品であり、子会社(株)戸上化成が製造販売しております。
                      - paragraph [ref=e1027]
                      - paragraph [ref=e1028]: (3)金属加工事業
                      - paragraph [ref=e1029]: 主要な製品は、産業用機械向けの金属加工品であり、子会社(株)戸上メタリックスが製造販売しております。
                      - paragraph [ref=e1030]
                      - paragraph [ref=e1031]: (4)その他
                      - paragraph [ref=e1032]: (株)戸上化成のプラスチック成形加工事業に付随する金型加工及び(株)戸上電機ソフトのソフトウエア開発等を含んでおります。
