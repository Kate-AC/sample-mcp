                      - heading "3【事業の内容】" [level=3] [ref=e827]
                      - paragraph [ref=e828]: (1)当社の事業内容について
                      - paragraph [ref=e829]: 当社は、ビルならびに工場、産業施設、大型マンション向けの高低圧配電盤、制御盤、分電盤などの配電制御設備をカスタムメイドで製作(顧客が指定する製品仕様に従い、一品毎に製作)する大手専業メーカーで、1940年の設立以来長い歴史を有しております。
                      - paragraph [ref=e830]: なお、当社は配電制御設備製造事業の単一セグメントとなっております。
                      - paragraph [ref=e831]: (2)当社製品について
                      - paragraph [ref=e832]: 当社の製品は、日本国内の大型・中型オフィスビル、病院、学校、工場、大型マンション等に設置されております。機能により高低圧配電盤、制御盤、分電盤等に区分されますが、多くの場合、それら一式を配電制御設備として受注しております。製品は重量物であり、かつ容積が嵩むこと、更にカスタムメイドの場合は納期が建築物の建築工程に深く組み込まれていること、受注から製造までの間に顧客から仕様変更を要求されることが多いこと等の特性により、国内の建築物向けとして、海外での生産には不向きな製品であり、ほとんどが国内企業によりまかなわれているものと思われます。
                      - paragraph [ref=e833]: 外注に多くを依存する競合他社が多い中、当社は社内で研究から設計、製造、販売、アフターサービスまでの事業部門を有しており、柔軟な対応が可能な体制を敷いております。
                      - paragraph [ref=e834]: "[事業系統図]"
                      - paragraph [ref=e835]: 事業系統図は次のとおりであります。
                      - paragraph [ref=e836]
                      - paragraph [ref=e837]: （画像は省略されました）
                      - paragraph
                      - paragraph [ref=e838]
                      - paragraph [ref=e839]: "[製品設置イメージ]"
                      - paragraph [ref=e840]
                      - paragraph [ref=e841]: （画像は省略されました）
                      - paragraph
                      - paragraph [ref=e842]: (3)当社が属する市場・競合他社について
                      - paragraph [ref=e843]: 当社の製品は、日本国内の大型・中型オフィスビル、病院、学校、工場、大型マンション等に設置されており、これらの新築、リニューアル時に当社製品に対する需要が発生します。そのため、当社は国内の民間設備投資の動向による影響を強く受け易いと言えます。
                      - paragraph [ref=e844]: 配電制御設備市場の業界団体である日本配電制御システム工業会に属するメンバー(正会員)は、2025年3月時点で約360社ありますが、その他地場需要に依存する零細企業や下請け中心に営む企業等が存在しており、全体でのメーカー数は2,000社にものぼると言われており、これらのほとんどは未公開企業により占められています。
                      - paragraph [ref=e845]: 更に配電制御設備業界は標準的な型の配電制御設備を製造する標準型市場と、納入先にあわせてカスタマイズして製造するカスタム型市場の二つに分かれます。当社はカスタム型市場に属し、現在のところこの市場に公開企業はなく、当社がこの市場において競合企業として認知できる企業は未公開企業のみとなっております。
                      - paragraph [ref=e846]: (4)改善活動について
                      - paragraph [ref=e847]: 当社は永年積み重ねてきた生産方式に日々改善を加えております。徹底した生産拠点の効率性を追求し、製品品質の向上とリードタイムの短縮、コスト低減を目指し、改善活動に取り組んでおります。
