                      - heading "3【事業の内容】" [level=3] [ref=e1072]
                      - paragraph [ref=e1073]: 当社グループは、当連結会計年度末日現在、当社((株)ニレコ)及び連結子会社7社から構成されており、鉄鋼・化学から食品・印刷に至るまで幅広い産業向けに制御・計測・検査機器の開発・製造・販売を事業内容としています。
                      - paragraph [ref=e1074]: 当社グループの事業内容及び当社と関係会社の当該事業に係る位置付けは次のとおりです。
                      - paragraph [ref=e1075]: 制御機器事業においては、鉄鋼・非鉄金属分野とフィルム・印刷・紙分野向けに製品を提供しています。
                      - paragraph [ref=e1076]: 鉄鋼・非鉄金属分野向けでは生産ラインを主な対象とした製品を取り扱い、その主な製品として、製銑・精鋼の工程で圧力・流量・温度等の制御を行うプロセス制御装置、連続鋳造の工程で湯面を計測する渦流式溶鋼レベル計、圧延や表面処理の工程で製品の位置を制御する耳端位置制御装置、工程の中途及び完成時に情報を製品に表示させる自動識別印字装置などがあります。フィルム・印刷・紙分野向けでは、製紙、印刷から電子機器材料に至るまで、帯状素材(ウェブ)を扱う広範な業種を対象とした製品を取り扱っています。その主な製品として、耳端位置制御装置は、帯状の細長い素材の縁の位置を検知して一定の位置に揃えるもので、二次電池やその他電子部品などの素材となる高機能フィルムの製造ラインで使用されており、近年では実用化に向けた開発が進むペロブスカイト太陽電池用製造装置においても利用が始まっています。また、張力を一定に保つことによりシワや折り目を防止する張力制御装置は耳端位置制御装置とセットでフィルム等の製造ラインで使用されています。その他、印刷物の位置(見当)を制御し、色ズレ等を防止する見当合わせ制御装置、印刷物の汚れや欠陥を検知する印刷品質検査装置、印刷物の製本や貼り付け加工の際に、ノズルから適量の糊を正確な位置に吹き付ける糊付け制御装置などがあります。
                      - paragraph [ref=e1077]: 検査機事業は、当社グループが長年にわたり培ってきた画像処理技術をベースに、食品から電池・電子部品材料まで幅広い分野を対象とした製品を取り扱う事業です。その主な製品として、電子機器やペロブスカイト太陽電池などの素材となる各種フィルム、金属箔や紙などの汚れや疵を検出する無地検査装置があります。その他に、二次電池の生産工程で電極シートに活性物質をコーティングする際の検査・計測を行う電極シート検査装置、食品の大きさや形状といった外観や内部品質を検知し選別する食品検査装置や成分分析を行う近赤外分析装置などがあります。
                      - paragraph [ref=e1078]: オプティクス事業は、半導体検査装置で使用される光学部品や、レーザ機器、光学薄膜部品を主に取り扱う事業です。製造に高度な技術を必要とする特殊な光学部品や、半導体検査などに用いられるレーザ装置などがあります。
                      - paragraph [ref=e1079]: また、報告セグメントに含まれないその他の事業において、電子機器設計開発事業などを行っています。
                      - paragraph [ref=e1080]
                      - paragraph [ref=e1081]: なお、当社では、2024年4月1日に蛇行制御等について共通の技術基盤を持つプロセス事業部、ウェブ事業部を統合し、新たに制御機器事業部を発足させました。本組織変更に伴う各事業活動の実態を適切に表すよう経営区分の見直しを図り、従来「プロセス事業」「ウェブ事業」と区分していた事業を統合し「制御機器事業」とする報告セグメントの一部変更を行いました。
