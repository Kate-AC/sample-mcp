                      - heading "3【事業の内容】" [level=3] [ref=e1090]
                      - paragraph [ref=e1091]: 当社グループ(当社及び当社の関係会社)は、当社(千代田インテグレ株式会社)及び子会社(21社)により構成されております。
                      - paragraph [ref=e1092]: 当社グループの事業に係る位置付けは次のとおりであります。なお、次の4区分は「第5 経理の状況 1 連結財務諸表等 (1)連結財務諸表 注記事項」に掲げるセグメントの区分と同一であります。
                      - paragraph [ref=e1093]: また、当連結会計年度より報告セグメントの区分を変更しております。詳細は、「第5 経理の状況 1 連結財務諸表等 (1)連結財務諸表 注記事項(セグメント情報等)」に記載のとおりであります。
                      - paragraph [ref=e1094]: (1)日本地域
                      - paragraph [ref=e1095]: 当社は、OA機器、AV機器、通信機器、AE機器などの各製品の機構部品、機能部品を製造し、主として国内電気メーカーへ販売するとともに、子会社へ当社グループ製品の原材料等を販売し、CHIYODA INTEGRE CO.(S)PTE.LTD.、CHIYODA INTEGRE CO.(M)SDN.BHD.、CHIYODA INTEGRE CO.(JOHOR)SDN.BHD.、CHIYODA INTEGRE CO.(PENANG)SDN.BHD.、千代達電子製造(香港)有限公司、千代達電子製造(大連)有限公司、CHIYODA INTEGRE(THAILAND)CO.,LTD.、CHIYODA INTEGRE OF AMERICA,INC.、千代達電子製造(中山)有限公司、千代達電子製造(蘇州)有限公司、千代達電子製造(東莞)有限公司、CHIYODA INTEGRE VIETNAM CO.,LTD.、CHIYODA INTEGRE SLOVAKIA,s.r.o.、千代達電子製造(山東)有限公司、CHIYODA INTEGRE(PHILIPPINES)CORPORATION.及びCHIYODA INTEGRE DE MEXICO, S.A. DE C.V.から、それぞれロイヤリティーを受取っております。
                      - paragraph [ref=e1096]: サンフェルト株式会社は、主として手芸関係及び服飾雑貨等のメーカーから注文を受け、フェルト製品の加工販売をしております。
                      - paragraph [ref=e1097]: (2)東南アジア地域
                      - paragraph [ref=e1098]: シンガポール現地法人CHIYODA INTEGRE CO.(S)PTE.LTD.は、主に東南アジア地域の電気メーカー等からの注文を受け、OA機器、AV機器、通信機器、AE機器などの各製品の機構部品、機能部品の製造を主に東南アジア地域及び中国の子会社に依頼し、その製品を購入販売しております。
                      - paragraph [ref=e1099]: マレーシア現地法人CHIYODA INTEGRE CO.(M)SDN.BHD.、CHIYODA INTEGRE CO.(JOHOR)SDN.BHD.及びCHIYODA INTEGRE CO.(PENANG)SDN.BHD.、タイ現地法人CHIYODA INTEGRE(THAILAND)CO.,LTD.、インドネシア現地法人PT.CHIYODA INTEGRE INDONESIA、ベトナム現地法人CHIYODA INTEGRE VIETNAM CO.,LTD.及びフィリピン現地法人CHIYODA INTEGRE(PHILIPPINES)CORPORATIONは、OA機器、AV機器、通信機器、AE機器などの各製品の機構部品、機能部品を製造し、主として所在地国の電気メーカー等へ販売しております。
                      - paragraph [ref=e1100]: (3)中国地域
                      - paragraph [ref=e1101]: 香港現地法人千代達電子製造(香港)有限公司は、主に香港、中国の電気メーカー等からの注文を受け、OA機器、AV機器、通信機器、AE機器などの各製品の機構部品、機能部品の製造を主に中国の子会社5社に依頼し、その製品を購入販売しております。
                      - paragraph [ref=e1102]: 中国現地法人千代達電子製造(中山)有限公司及び千代達電子製造(東莞)有限公司は、OA機器、AV機器、通信機器、AE機器などの各製品の機構部品、機能部品を製造し、主として香港現地法人千代達電子製造(香港)有限公司へ販売しております。
                      - paragraph [ref=e1103]: 中国現地法人千代達電子製造(大連)有限公司、千代達電子製造(蘇州)有限公司及び千代達電子製造(山東)有限公司は、OA機器、AV機器、通信機器、AE機器などの各製品の機構部品、機能部品を製造し、主として中国の電気メーカー等へ販売しております。
                      - paragraph [ref=e1104]: 中国現地法人千代達瑛帖国際貿易(上海)有限公司は、主に中国の自動車メーカー等からの注文を受け、OA機器、AV機器、通信機器、AE機器などの各製品の機構部品、機能部品を購入販売しております。
                      - paragraph [ref=e1105]: (4)北米地域
                      - paragraph [ref=e1106]: 米国現地法人CHIYODA INTEGRE OF AMERICA,INC.は、米国の電気製品メーカー等からの注文を受け、OA機器、AV機器、通信機器、AE機器などの各製品の機構部品、機能部品の製造を主にメキシコ現地法人CHIYODA INTEGRE DE BAJA CALIFORNIA S.A.DE C.V.に加工委託し、その製品を販売しております。
                      - paragraph [ref=e1107]: メキシコ現地法人CHIYODA INTEGRE DE BAJA CALIFORNIA S.A.DE C.V.は、米国現地法CHIYODA INTEGRE OF AMERICA
                      - paragraph [ref=e1108]: ",INC.からの加工委託を受け、OA機器、AV機器、通信機器、AE機器などの各製品の機構部品、機能部品を製造しております。"
                      - paragraph [ref=e1109]: メキシコ現地法人CHIYODA INTEGRE DE MEXICO, S.A. DE C.V.は、AE機器などの各製品の機構部品、機能部品を製造し、主にメキシコの車両メーカー等へ販売しております。
                      - paragraph [ref=e1110]: (5)その他地域
                      - paragraph [ref=e1111]: スロバキア現地法人CHIYODA INTEGRE SLOVAKIA,s.r.o.は、OA機器、AV機器、通信機器、AE機器などの各製品の機構部品、機能部品を製造し、主に欧州地域の電気メーカー等へ販売しております。
                      - paragraph [ref=e1112]: ドイツ現地法人CHIYODA INTEGRE Europe GmbHは、当社グループ向けの売上増加のための営業活動を実施しております。
                      - paragraph [ref=e1113]: 以上に述べた当社グループの概要図は次のとおりであります。
