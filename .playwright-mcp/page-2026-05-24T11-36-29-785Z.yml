                      - heading "3 【事業の内容】" [level=3] [ref=e989]
                      - paragraph [ref=e990]: 当社グループは、持株会社であるヘリオス テクノ ホールディング株式会社(当社)及び子会社4社で構成されており、ランプ事業及び製造装置事業を主な事業内容としております。
                      - paragraph [ref=e991]
                      - paragraph [ref=e992]: 当社グループの事業における当社及び子会社の位置付け及びセグメントとの関連は、次のとおりであります。
                      - paragraph [ref=e993]
                      - paragraph [ref=e994]: ランプ事業
                      - paragraph [ref=e995]: 産業用ランプ、一般照明用ハロゲンランプ、及びLEDランプ等の製造販売をしております。
                      - paragraph [ref=e996]: (会社名) フェニックス電機株式会社及び株式会社ルクス
                      - paragraph [ref=e997]
                      - paragraph [ref=e998]: 製造装置事業
                      - paragraph [ref=e999]: 配向膜印刷装置、特殊印刷機、及びUV露光装置光源ユニットの製造販売をしております。
                      - paragraph [ref=e1000]: (会社名) ナカンテクノ株式会社、フェニックス電機株式会社、及び株式会社リードテック
                      - paragraph [ref=e1001]
                      - paragraph [ref=e1002]: 事業の系統図は、次のとおりであります。
                      - paragraph [ref=e1003]
                      - paragraph [ref=e1005]: （画像は省略されました）
                      - paragraph [ref=e1006]
                      - paragraph [ref=e1007]: (注) 1 当社は、子会社であるフェニックス電機株式会社及びナカンテクノ株式会社に対し、経営指導並びに業務支援を行っており、事業は行っておりません。
                      - paragraph [ref=e1008]: 2 フェニックス電機株式会社の子会社である株式会社ルクスは、一部の商品仕入についてフェニックス電機株式会社より同社製品を仕入れ、外部へ販売を行っております。
                      - paragraph [ref=e1009]
                      - paragraph [ref=e1010]: なお、当社は特定上場会社等に該当し、インサイダー取引規制の重要事実の軽微基準のうち、上場会社の規模との対比で定められる数値基準については連結ベースの計数に基づいて判断することとなります。
