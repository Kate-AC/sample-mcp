                      - heading "3 【事業の内容】" [level=3] [ref=e1030]
                      - paragraph [ref=e1031]: 当社グループは、当社、連結子会社3社(ブリッジインターナショナル株式会社(注1)、ブリッジプロセステクノロジー株式会社(注2)、株式会社アイ・ラーニング)により構成されており、以下の3つの事業を通じて、B2B企業の売上成長の改革を支援しています。
                      - paragraph [ref=e1032]
                      - paragraph [ref=e1034]: （画像は省略されました）
                      - paragraph [ref=e1035]
                      - paragraph [ref=e1036]: ■ インサイドセールスアウトソーシング事業(ブリッジインターナショナル株式会社)
                      - heading "1.インサイドセールスとは" [level=4] [ref=e1037]
                      - paragraph [ref=e1038]: インサイドセールスは、見込みのお客様に対して、電話やメール、オンライン会議ツールなどを活用しながら、対面せずに行う営業活動です。お客様とじっくり対話し、課題を見つけたり、解決の糸口を提案したりします。商談が具体的な段階に進んだら、フィールドセールス(訪問営業)担当に引き継ぎます。この方法は、訪問の手間を省けるため効率的です。また、営業活動のデータを収集・分析し、すぐに次の営業活動に活かすことができます。地理的な制約がないため、日本全国のお客様を対象にできるのも大きな魅力です。
                      - paragraph [ref=e1039]
                      - heading "2.アウトソーシングサービス" [level=4] [ref=e1040]
                      - paragraph [ref=e1041]: 当社では、2002年からインサイドセールスのアウトソーシングサービスを提供しています。当時は、営業のプロセスを分担するという考え方は一般的ではありませんでした。私たちはお客様のマーケティングや営業活動に合わせ、適切なモデルを提案し、専門的なスキルを持つスタッフが業務を遂行します。短期的な成果を目指すテレマーケティングとは異なり、じっくりとお客様の課題やニーズを理解し、長期的な信頼関係を築くことを重視しています。サービスは月額定額で提供し、お客様の営業チームの一員のような形で支援します。
                      - paragraph [ref=e1042]
                      - heading "3.ビジネスモデル" [level=4] [ref=e1043]
                      - paragraph [ref=e1044]: 月額定額モデルの業務委託契約によるサービスを提供しています。高い成果を継続的に残すことで、業界内でも高単価でのサービス提供を維持しています。また、広告宣伝費などの一時的費用ではなく、売上貢献の重要なパートナーとして位置付けられているため、取引は数年にわたる継続がほとんどであり、売上の9割以上は既存顧客が占める安定したストックビジネスです。
                      - paragraph [ref=e1045]
                      - heading "4.競争優位性" [level=4] [ref=e1046]
                      - paragraph [ref=e1047]: 法人営業のプロセス分業の考えがなかった2002年からサービスを提供しています。米国をはじめとするグローバルIT企業の最先端のインサイドセールスを日本に持ち込み、日本の営業慣行に合わせてアレンジした上で、標準モデルを確立しました。20年以上にわたり外資ITをはじめとする様々な企業の営業支援を行ってきた豊富なノウハウとナレッジがあります。日本の法人営業スタイルを熟知し、ITの幅広い知識を持ったインサイドセールスを担う人材が500名超在籍する企業は類を見ないと自負しています。
                      - paragraph [ref=e1048]
                      - paragraph [ref=e1049]
                      - paragraph [ref=e1051]: （画像は省略されました）
                      - paragraph [ref=e1052]
                      - paragraph [ref=e1054]: （画像は省略されました）
                      - paragraph [ref=e1055]
                      - paragraph [ref=e1056]: ■ プロセス・テクノロジー事業(ブリッジプロセステクノロジー株式会社)
                      - heading "1.事業内容" [level=4] [ref=e1057]
                      - heading "プロセス・テクノロジー事業では、AIをはじめとする最新テックを活用した革新的なソリューションを提供しています。企業が売上を伸ばすには、データに基づいた的確な戦略と、それを実行する「仕組み」が必要です。私たちは、AIをはじめとする最新テクノロジーを駆使し、企業のマーケティングや営業活動を強力にサポートします。" [level=5] [ref=e1058]
                      - paragraph [ref=e1059]
                      - paragraph [ref=e1060]: 具体的には、こんな課題を抱える企業様を支援しています。
                      - paragraph [ref=e1061]: ・膨大なデータ分析を効率化し、営業やマーケティングに活かしたい
                      - paragraph [ref=e1062]: ・最新の営業・マーケティング手法を導入し、売上を飛躍的に伸ばしたい
                      - paragraph [ref=e1063]: ・業務効率化を実現し、限られたリソースで最大の成果を上げたい
                      - paragraph [ref=e1064]
                      - paragraph [ref=e1065]:
                        - text: (1)コンサルティングサービス
                        - text: 企業が抱えるマーケティングや営業の課題を整理し、それぞれのビジネスモデルに合った戦略を一緒に考えます。また、インサイドセールス導入時の体制づくりや業務設計も支援します。
                        - text: (2)システムソリューション
                        - text: 営業やマーケティング部門で使うクラウドシステムであるSFA(注3)、CRM(注4)などの構築を支援しています。特に「Salesforce」の導入支援は20年の豊富な実績があります。
                        - text: (3)オペレーション支援
                        - text: 営業活動の情報をデジタル化し、分析結果を次に活かすための支援も行っています。様々なツールを駆使し、営業やマーケティング活動を支えるオペレーションを提供します。
                      - paragraph [ref=e1066]
                      - heading "2.ビジネスモデル" [level=4] [ref=e1067]
                      - paragraph [ref=e1068]:
                        - text: コンサルティングサービスは短期間で成果を追求するフロー型ビジネスですが、システムソリューションやオペレーション支援は、長期的に継続するストック型ビジネスへシフトしています。
                        - text: AIをはじめとする最新テクノロジーを提供する企業とアライアンスを組み、顧客の売上成長をワンストップで提供します。
                      - paragraph [ref=e1069]
                      - heading "3.競争優位性" [level=4] [ref=e1070]
                      - paragraph [ref=e1071]: 現在、多くの企業が営業支援ツールを導入していますが、うまく使いこなせず、成果に結びついていないケースも多く見られます。当社はインサイドセールスアウトソーシングのパイオニアとして、長年蓄積した知識を活かし、それぞれのお客様に最適な仕組みやツールの選定、運用支援を行うことで、確かな成果をお届けしています。
                      - paragraph [ref=e1072]
                      - paragraph [ref=e1073]
                      - paragraph [ref=e1075]: （画像は省略されました）
                      - paragraph [ref=e1076]
                      - paragraph [ref=e1077]
                      - paragraph [ref=e1078]
                      - paragraph [ref=e1079]: ■ 研修事業(株式会社アイ・ラーニング)
                      - heading "1.事業内容" [level=4] [ref=e1080]
                      - paragraph [ref=e1081]:
                        - text: 株式会社アイ・ラーニングは、企業向けにデジタル人材の育成研修を提供しています。デジタル人材というと「プログラミングスキル保持者」というイメージを持たれるかもしれませんが、私たちが目指しているのはデジタル技術を活用し、会社の成長や業務の効率化に貢献できる力を持つ人材の育成です。少子高齢化の進行に伴い、企業は生産性向上や業務の効率化が求められる時代を迎えています。AIをはじめとする最新テクノロジーを“活用”するスキルはますます重要になり、”人”に求められるスキルは高度化しています。アイ・ラーニングでは、デジタルスキルに加え、ビジネススキルにも注力し、デジタルとビジネスの両面から人材育成を支援できる点が特徴です。
                        - text: 同社の強みは、各企業のニーズに応じてカリキュラムを柔軟にカスタマイズし、社員一人ひとりが能力を最大限に発揮できるよう支援する点です。さらに、長期的な企業成長を見据え、企業と共に人材育成計画を立案します。その過程で交流会などのコミュニティ活動も活用し、次世代リーダーの育成にも取り組んでいます。30年以上にわたる経験と実績を活かし、豊富な研修プログラムを提供するだけでなく、急速に進化するテクノロジーにも対応するため、新興企業との連携も積極的に推進しています。これにより、法人企業が真に求める人材育成サービスを提供し続けています。
                      - paragraph [ref=e1082]
                      - heading "2.ビジネスモデル" [level=4] [ref=e1083]
                      - paragraph [ref=e1084]: 国内随一のIBM製品研修をはじめとするITスキルはもちろんのことDX(注5)推進スキル、ビジネススキルも含めた幅広いコースを提供しています。公開講座、e-ラーニング、サブスクラーニングなど多様なスタイルから選べるオープン研修のほか、1社専用のプライベート研修としてカリキュラムのカスタマイズやオーダーメイドまで、企業のニーズに合わせてご提案します。
                      - paragraph [ref=e1085]
                      - heading "3.競争優位性" [level=4] [ref=e1086]
                      - paragraph [ref=e1087]:
                        - text: 市場ポーションの一番大きい新卒研修の売上が4割を占めています。そこから年次に合わせた階層別研修や、IT、ビジネス、営業研修など幅広いビジネススキルの研修を網羅的に提供することができます。
                        - text: 各分野で豊富な経験と実績を持つ講師陣が活躍しています。お客様先の社内講師の方からもご好評をいただくなど、ハイレベルな研修をご提供しています。
                      - paragraph [ref=e1088]
                      - paragraph [ref=e1089]
                      - paragraph [ref=e1091]: （画像は省略されました）
                      - paragraph [ref=e1092]
                      - paragraph [ref=e1094]: （画像は省略されました）
                      - paragraph [ref=e1095]
                      - paragraph [ref=e1096]: グループの強み
                      - paragraph [ref=e1098]: （画像は省略されました）
                      - paragraph [ref=e1099]: ※ 用語解説
                      - paragraph [ref=e1100]: (注1) ブリッジインターナショナル株式会社は、2025年10月1日の持株会社体制への移行にともない、同日付で設立し、当社のインサイドセールスアウトソーシング事業を新設分割により承継しております。
                      - paragraph [ref=e1101]: (注2) ブリッジプロセステクノロジー株式会社は、2025年3月1日付でClieXito株式会社から商号変更を行いました。また、当社のプロセス・テクノロジー事業を10月1日付で吸収分割により承継しています。
                      - paragraph [ref=e1102]: (注3) SFA(Sales Force Automation)とは、企業で営業活動を支援して効率化させるために使用される情報システムを指します。営業案件の管理や進捗状況の可視化に重点を置いたツール。営業活動の記録や分析を行い、営業の効率を向上させます。
                      - paragraph [ref=e1103]: (注4) CRM(Customer Relationship Management)とは、企業内でその顧客の属性やコンタクト履歴を記録・管理することにより、それぞれの顧客に応じた対応を可能にし、顧客満足度を向上させる取り組みを行うための情報システムを指します。営業だけでなく、マーケティングやサポート部門でも活用されます。
                      - paragraph [ref=e1104]: (注5) DX(Digital Transformation)とは、デジタル技術を活用し、ビジネスモデルや業務プロセスを変革することを指します。これにより、企業の競争力向上や新たな価値創出が期待されます。
