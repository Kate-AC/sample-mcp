                    - generic [ref=e798]:
                      - paragraph [ref=e799]
                      - heading "3 【事業の内容】" [level=3] [ref=e800]
                      - paragraph [ref=e801]: 当社は、医薬品開発における代行、支援業務として「安全性情報管理サービス」を主軸に、「ドキュメントサポートサービス」、「製造販売後調査支援サービス」、「臨床研究支援サービス」を展開しております。各サービスは、委受託契約によるサービス提供のみならず、一部、人材派遣契約によるサービス提供も行っております。なお、当社はCRO事業の単一セグメントであるため、セグメント情報は記載せず各サービスについて記載しております。
                      - paragraph [ref=e802]
                      - paragraph [ref=e803]: (1) 安全性情報管理サービス
                      - paragraph [ref=e804]: 当サービスでは、医薬品開発における国内外の臨床試験や医薬品の市販後に発生する安全性情報について、入力・評価案作成、報告書案作成等の支援業務サービスを提供しております。
                      - paragraph [ref=e805]: 医薬品の臨床試験では、開発中の治験品を人体に投与することで、その望ましくない反応についての情報の収集、評価を行います。また、安全性が確認され上市された、優れた効能・効果を持つ医薬品であっても、様々な要因で望ましくない反応が生じる可能性があります。これらの望ましくない反応についての発現状況や有効性に関する情報(安全性情報)は、規制当局にあたる独立行政法人医薬品医療機器総合機構(以下「PMDA」という。)への報告が製薬企業には義務付けられており、臨床試験中はもちろん、新薬としての承認を受けた後も継続的に収集・評価・報告をすることが求められております。当社では、収集された安全性情報について、安全性情報管理データベースでの症例管理番号の発番、安全性情報の入力や、PMDAへの報告要否についての評価案作成、報告書案の作成サービスを提供しております。また、安全性情報を管理する上で発生する日英/英日翻訳や紙資料のファイリング業務も行っております。
                      - paragraph [ref=e806]
                      - paragraph [ref=e808]: （画像は省略されました）
                      - paragraph [ref=e809]
                      - paragraph [ref=e810]: (2) ドキュメントサポートサービス
                      - paragraph [ref=e811]: 当サービスでは、医薬品開発の各段階で発生する様々な書類やPMDAへの上市の承認申請の際に必要な資料のQC(品質保証)・翻訳からCTD(日米EU3極共通の医薬品承認申請様式)と呼ばれる承認申請書の作成までの支援業務サービスを提供しております。
                      - paragraph [ref=e812]
                      - paragraph [ref=e813]: (3) 製造販売調査支援サービス
                      - paragraph [ref=e814]: 当サービスでは、新薬の承認後や適応追加後に実施される製造販売後調査において、調査を依頼する医療機関との契約書類等の作成・管理代行業務、調査票の管理、調査票のデータマネジメントや統計解析、調査関連文書のファイリング、コールセンター業務などのサービスを提供しております。
                      - paragraph [ref=e815]
                      - paragraph [ref=e816]: (4) 臨床研究支援サービス
                      - paragraph [ref=e817]: 当サービスでは、ヒトを対象とした医学系研究において、研究開始時の参加医療機関のサポート、臨床データの収集とチェック、研究実施状況のモニタリング、収集されたデータの統計解析/結果報告書作成まで、研究に係る一連のサービスをワンストップで提供しています。
                      - paragraph [ref=e818]
                      - paragraph [ref=e819]: "[事業系統図]"
                      - paragraph [ref=e820]
                      - paragraph [ref=e822]: （画像は省略されました）
