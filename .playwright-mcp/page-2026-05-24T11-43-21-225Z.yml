                      - heading "3【事業の内容】" [level=3] [ref=e1047]
                      - paragraph [ref=e1048]: 当社グループとは、当社、子会社5社及び関連会社1社により構成されており、自動車、農業機械及び一般機械用の鋼板製プーリ(ベルトを介して回転することによって動力を伝達する部品)の設計、開発、製造及び販売を主な事業として取り組んでおります。
                      - paragraph [ref=e1049]: 当社グループは、創業以来、技術開発型経営を志向し、地球環境に配慮したモノづくりに取り組んでまいりました。1961年に独自開発の回転成形法(注1)にてプーリを1枚の鋼板からの一体成形に成功して以降、高精度・軽量化・低コストな自動車エンジン部品として国内自動車会社のほぼ全社及び主要な部品会社へ製品を供給するとともに、海外のグループ会社を通じてアジア地域への供給体制も構築しております。
                      - paragraph [ref=e1050]: 当社の主力製品である鋼板製プーリは、自動車のエンジンのウォーターポンプ(水冷装置)、クランクシャフト、オルタネータ(発電装置)、パワーステアリング等にそれぞれ装着されております。また、農業機械及び一般機械に対しても供給を行っております。こうしたプーリの開発で培われた塑性加工(注2)技術は、トランスミッション部品、xEV部品(注3)、EPS部品などの次期商品(注4)、次代商品(注5)に応用しております。今後も当社グループの発展のため更なる商品開発に取り組んでまいります。
                      - paragraph [ref=e1051]: なお、このように当社グループの主たる事業は、プーリ中心の自動車用部品等製造販売であり、セグメントは製造販売体制を基礎とした地域別で構成されており、「第5 経理の状況 1 連結財務諸表等 (1) 連結財務諸表 注記事項」に掲げるセグメント情報と同一区分であります。
                      - paragraph [ref=e1052]: 事業の系統図は次のとおりであります。
                      - paragraph [ref=e1053]
                      - paragraph [ref=e1054]
                      - paragraph [ref=e1055]: （画像は省略されました）
                      - paragraph
                      - paragraph [ref=e1056]
                      - paragraph [ref=e1057]: (注)1.回転成形法とは、上下の金型で製品となる材料(薄板鋼板)を挟み込み回転を加えながら、材料の側壁部に横から必要とする形状の金型を押圧して成形する塑性加工に属する加工方法であります。
                      - paragraph [ref=e1058]: 2.塑性加工とは、外部から力を加えて変形させる加工方法であります。
                      - paragraph [ref=e1059]: 3.xEVとは、電動車のことをいい、バッテリーに蓄えた電気エネルギーをクルマの動力のすべてまたは一部として使って走行する自動車を指します。電動車は電気自動車(BEV)、プラグイン・ハイブリッド自動車(PHEV)、ハイブリッド自動車(HEV)、燃料電池自動車(FCEV)が該当します。
                      - paragraph [ref=e1060]: 4.次期商品とは、主力商品プーリに代わる新たな事業の柱となる商品をいいます。当社ですでに商品化され、販売実績があるものです。次期商品として、トランスミッション部品、EPS部品、xEV部品などを位置づけております。
                      - paragraph [ref=e1061]: 5.次代商品とは、当社ではまだ販売実績がなく、中長期的に当社の新たな事業となるべく開発中の商品をいいます。次代商品として、未開発のxEV部品や産業用ロボット部品などを位置づけております。
                      - paragraph [ref=e1062]: 6.上記事業系統図に記載の松本精工株式会社は、当社製品の機械加工を行っております。
                      - paragraph [ref=e1063]
