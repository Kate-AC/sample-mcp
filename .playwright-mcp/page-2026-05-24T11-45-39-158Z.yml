                      - heading "3 【事業の内容】" [level=3] [ref=e836]
                      - paragraph [ref=e837]: 当社グループは当社、子会社7社および持分法適用関連会社2社により構成されており、自動車用サスペンション製品の開発、製造、販売を主な内容とした事業を展開しております。
                      - paragraph [ref=e838]: 開発は主に国内で当社がおこない、製造は国内工場および中国工場でおこなっております。また販売は国内においては当社が小売店等を通じてお客様に販売し、海外において北米地域はTEIN U.S.A.,INC.、欧州地域はTEIN UK LIMITED、TEIN Europe Sp.z o.o.、中国・香港地域は天御遠東国際貿易(北京)有限公司、タイ国はTEIN Sales (Thailand) Co.,Ltd.、その他のアジア地域ならびにオセアニア地域等はTEIN AUSTRALIA PTY LTD及び当社が小売店等を通じて販売しております。
                      - paragraph [ref=e839]: また、中国工場である天御減振器制造(江蘇)有限公司は、主にアジア地域を中心としたエントリーユーザー向けの製品を生産することで国内工場との住み分けを図っております。
                      - paragraph [ref=e840]: なお、海外からの製品用資材や消耗品等の調達は、天御減振器制造(江蘇)有限公司および宿遷天野貿易有限公司が中国を中心にアジア地域での調査・調整活動をおこなうとともに、資材の一部共通化による調達の合理化や原価低減も推進しております。
