                    - generic [ref=e1058]:
                      - heading "3【事業の内容】" [level=3] [ref=e1059]
                      - paragraph [ref=e1060]: 当社グループは、当社及び連結子会社4社、非連結子会社1社で構成され、二輪車部品・用品を中心に企画・開発卸販売ならびに小売販売の事業を営んでおります。
                      - paragraph [ref=e1061]: このうち当社及び連結子会社株式会社ダートフリークは、二輪車部品・用品の企画・開発及び卸販売を国内及び海外(輸出)で行っており、連結子会社株式会社ライダーズ・サポート・カンパニーは、株式会社コシダテックのフランチャイジーとして千葉県・埼玉県の2店舗において、二輪車部品・用品の小売販売を行っております。
                      - paragraph [ref=e1062]: 海外連結子会社であるPT. DAYTONA AZIA(インドネシア)におきましては、当社同様、二輪車部品・用品及びOEM商品の企画・開発及び卸販売をインドネシア国内を中心に行っております。また、DAYTONA Motorcycles Philippines(フィリピン)におきましても、二輪車部品・用品及びOEM商品の企画・開発及び卸販売をフィリピン国内を中心に行っております。
                      - paragraph [ref=e1063]: 非連結子会社の有限会社オーディーブレインは、「MaxFritz」ブランドにてモーターサイクルウエアの企画・開発を行い、直営店及びFC店で販売しております。
                      - paragraph [ref=e1064]: 各事業における当社グループ各社の位置づけ等は、次の事業系統図のとおりであります。なお、セグメントと同一の区分であります。
                      - paragraph [ref=e1065]
                      - paragraph [ref=e1066]: "[国内拠点卸売事業]"
                      - paragraph [ref=e1067]: 国内拠点卸売事業は、株式会社デイトナ及び株式会社ダートフリークの国内部門において二輪車部品・用品の企画・開発及び仲卸店を中心とした卸販売を行っております。
                      - paragraph [ref=e1068]: また、海外部門において、北米・欧州を中心に二輪車部品の企画・開発及び輸出販売を行っております。
                      - paragraph [ref=e1069]
                      - paragraph [ref=e1070]: "[アジア拠点卸売事業]"
                      - paragraph [ref=e1071]: アジア拠点卸売事業は、PT. DAYTONA AZIA(インドネシア)及びDAYTONA Motorcycles Philippines(フィリピン)において、二輪車部品・用品の企画・開発及び卸販売を行っております。
                      - paragraph [ref=e1072]
                      - paragraph [ref=e1073]: "[小売事業]"
                      - paragraph [ref=e1074]: 小売事業は、株式会社ライダーズ・サポート・カンパニーにおいて、株式会社コシダテックのフランチャイジーとして、関東地方(千葉県柏市・埼玉県上尾市)2店舗で二輪車部品・用品の販売を行っております。また同2店舗の敷地内において、株式会社アップガレージのフランチャイジーとして中古二輪車部品・用品の販売を行っております。
                      - paragraph [ref=e1075]: また、株式会社ダートフリークにおいて同社1階にて主にオフロードバイク車用の部品・用品の小売販売及びインターネットによる通信販売を行っております。さらに、小規模店舗「ダートバイクプラス」(愛知県瀬戸市、大阪府河内長野市、兵庫県神戸市)にて、オフロードバイク車用の部品・用品の販売を行っております。
                      - paragraph [ref=e1076]
                      - paragraph [ref=e1077]: "[その他]"
                      - paragraph [ref=e1078]: その他につきましては、太陽光発電の売電事業及び、リユース販売事業を行っております。
                      - paragraph [ref=e1079]
                      - paragraph [ref=e1080]: 以上述べた事項の事業系統図は、次のとおりであります。
