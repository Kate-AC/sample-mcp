                      - paragraph [ref=e938]
                      - heading "3 【事業の内容】" [level=3] [ref=e939]
                      - paragraph [ref=e940]: 当社グループは当社(提出会社)と親会社、子会社8社(2025年3月31日現在)で構成されており、自動車部品製造事業とその他の2つのセグメントに分かれて事業を行っております。各セグメントの事業内容と、当社および主要な関係会社の位置付けは以下のとおりであります。
                      - paragraph [ref=e941]: なお、このセグメント区分は「第5 経理の状況 1 連結財務諸表等 (1)連結財務諸表」の連結財務諸表注記事項に掲げるセグメントをはじめ、本有価証券報告書の当連結会計年度に関するセグメントの区分と全て同一であります。
                      - paragraph [ref=e942]
                      - paragraph [ref=e943]: (自動車部品製造事業)
                      - paragraph [ref=e944]: 当社と子会社である富士气門(広東)有限公司、PT. FUJI OOZX INDONESIA、FUJI OOZX MEXICO, S.A. DE C.V. はエンジンバルブ等の製品の製造、販売を行い、子会社であるオーゼックステクノ株式会社は金型等の製造および当社の生産工程に付帯する業務を行っております。
                      - paragraph [ref=e945]: 関連当事者の大同興業株式会社は親会社である大同特殊鋼株式会社の特殊鋼鋼材を当社へ販売しております。
                      - paragraph [ref=e946]: また、当社は富士气門(広東)有限公司、PT. FUJI OOZX INDONESIA、FUJI OOZX MEXICO, S.A. DE C.V.等へは機械設備・治工具等の販売、技術供与を行っております。
                      - paragraph [ref=e947]: 当社および国内子会社の従業員の福利厚生については、子会社である株式会社テトスが行っております。また、当社関連製品の輸送・梱包については、子会社である株式会社ジャトスが行っております。
                      - paragraph [ref=e948]
                      - paragraph [ref=e949]: (その他)
                      - paragraph [ref=e950]: 「その他」は子会社の株式会社マルヨシ製作所および株式会社ピーアンドエムの事業で構成されております。
                      - paragraph [ref=e951]: 株式会社マルヨシ製作所は、リチウムイオン電池等に使用されるセパレータフィルムの製造装置に組み込まれる金属ロール、シャフト等の製造を手掛けており、セパレータフィルム製造装置メーカー等に製品を販売しております。
                      - paragraph [ref=e952]: また、株式会社ピーアンドエムは、ファクトリーオートメーション機器等の精密部品を製造・販売しており、主に半導体やEVバッテリー製造等で使用される空気圧機器用に使用されております。
                      - paragraph [ref=e953]
                      - paragraph [ref=e954]
                      - paragraph [ref=e955]: 事業の系統図は、次のとおりであります。
