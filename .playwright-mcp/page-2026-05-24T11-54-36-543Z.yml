                    - generic [ref=e767]:
                      - heading "3【事業の内容】" [level=3] [ref=e768]
                      - paragraph [ref=e769]: 当社は、2021年7月1日に単独株式移転により、株式会社マーキュリアインベストメントの完全親会社として設立され、持株会社としてグループ会社の経営管理及びこれに附帯する業務を行っております。また、当社グループの事業の内容は以下のとおりであります。
                      - paragraph [ref=e770]
                      - paragraph [ref=e771]: 当社グループは、当社、連結子会社12社、非連結子会社21社、持分法適用関連会社2社、及び持分法非適用関連会社13社により構成されております。
                      - paragraph [ref=e772]: 当社グループは、国内外投資家の資金を投資事業組合等のファンドを通じて運用を行うファンド運用事業、自己資金の運用を行う自己投資事業を主たる業務としております。
                      - paragraph [ref=e773]: 当社グループの報告セグメントは投資運用事業の単一セグメントとなっておりますが、以下では投資運用事業を投資戦略ごとに分類して記載しております。
                      - paragraph [ref=e774]: 当社グループではクロスボーダー(国や地域を超えること、既存のビジネスの枠組みにとらわれずに挑戦すること)をコンセプトとした投資運用を行っており、投資対象の性質により事業投資と資産投資に大別されます。
                      - paragraph [ref=e775]: なお、当社は有価証券の取引等の規制に関する内閣府令第49条第2項に規定する特定上場会社等に該当しており、これにより、インサイダー取引規制の重要事実の軽微基準については連結ベースの数値に基づいて判断することとなります。
                      - paragraph [ref=e776]: 当社グループの事業概要図は、次のとおりであります。
                      - paragraph [ref=e777]
                      - paragraph [ref=e778]: （画像は省略されました）
                      - paragraph
                      - paragraph [ref=e779]
                      - paragraph [ref=e780]: 1 バイアウト投資戦略:[事業投資]
                      - paragraph [ref=e781]: バイアウト投資とは、企業への株式投資を行うことにより、経営に参画し、事業の拡大や再編、構造改革などにより企業価値の向上を目指す投資です。経営を改善することで企業価値の向上の余地のある企業を友好的に買収することにより、投資先経営陣と共に経営改革の推進、投資先企業の成長および企業価値向上を目指します。特に当社グループでは、グループ会社のネットワークやリソースも活用した新たな成長シナリオを描くことで企業価値の向上を図ります。
                      - paragraph [ref=e782]
                      - paragraph [ref=e783]: 2 成長投資戦略:[事業投資]
                      - paragraph [ref=e784]: 当社グループの成長投資戦略は、例えば伝統的な金融業と新たな技術の融合といった、既存のビジネスの枠組みにとらわれずに挑戦する事業への投資を行い、投資リターンをもたらしています。中でも主に次のような要素に着目しています。
                      - paragraph [ref=e785]: ・マクロ経済の成長に伴い需要の伸びが予想される新しいサービスの展開
                      - paragraph [ref=e786]: ・社会構造の変化に伴い変化が求められる既存産業における新たなビジネスモデル
                      - paragraph [ref=e787]: ・モノ造りに関する管理の技術やノウハウ等の日本の優れた特性を活かすことができる分野の海外市場への展開
                      - paragraph [ref=e788]: 当社グループでは、このような観点で主要プレーヤーとなりうる企業に対し、中長期的な視野による投資を行い、一時的な状況の変化に左右されない資金面、事業面等の分野での継続的なサポートを提供します。
                      - paragraph [ref=e789]
                      - paragraph [ref=e790]: 3 不動産投資戦略:[資産投資]
                      - paragraph [ref=e791]: 当社グループでは、地域毎に異なる経済発展レベルや経済環境に照らし合わせた不動産投資によりリスクに見合ったリターンが得られる不動産投資を目指しています。
                      - paragraph [ref=e792]: 経済が成長局面にあるアジア地域においては、中国国内の個人消費の拡大とともに北京の貸オフィスビルへの需要が拡大することを見越し、北京市の中心的なオフィス街にあるオフィスビル2棟にいち早く投資を行いました。当社グループでは、当社子会社であるSpring Asset Management Limitedにおいて、香港証券取引所へ上場しているリート(不動産投資信託)であるSpring REITの管理運営を行うなどの実績を上げています。
                      - paragraph [ref=e793]: 日本やその他の先進国においても、主にバリュー投資やキャッシュ・フロー投資戦略のアプローチも取り込んでおります。
                      - paragraph [ref=e794]
                      - paragraph [ref=e795]: 4 キャッシュ・フロー投資戦略(CF投資戦略):[資産投資]
                      - paragraph [ref=e796]: 社会インフラ関連、賃貸不動産など、安定的なキャッシュ・フロー収入が期待できる資産に対するファンド投資を通じ、一定のキャッシュ・フローをもたらす金融商品として投資家へ提供しています。安定したリターンの確保には、資産の種類だけでなく、資産管理体制も重要なファクターであり、当社ではそれぞれの分野でグローバルなフランチャイズや実績を持つパートナーと組み、投資機会の発掘や運用管理を行っています。
                      - paragraph [ref=e797]: キャッシュ・フロー投資戦略は、従前は不動産投資戦略と一体として取り組んで参りましたが、今後は国内外の投資家に対して安定運用機会を提供すべく、独立した戦略としてより強化していく分野となります。
                      - paragraph [ref=e798]
                      - paragraph [ref=e799]: 5 バリュー投資戦略:[事業投資][資産投資]
                      - paragraph [ref=e800]: バリュー投資とは理論的な価格より安く取引される事業・資産への投資です。金融法人、事業法人、個人といった様々な投資家の投資サイクル等の関係で、安定的な資産及び事業であっても理論的な価格よりも安い価格で取引されることがあります。当社グループは、グループ会社のネットワークや役職員のネットワークを活用することでそのような機会を見つけ、ローン債権(流動化された貸付金)や不動産などキャッシュ・フローを伴う投資資産を中心にバリュー投資を行っております。
                      - paragraph [ref=e801]
