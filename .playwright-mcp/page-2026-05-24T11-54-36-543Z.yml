                      - paragraph [ref=e1080]: ※1.成功報酬はファンド契約に基づき決定されますが、主にファンドの投資家に対する分配額のうちファンドの投資家から出資を受けた額を超える額に一定料率を乗じた金額が成功報酬となります。
                      - paragraph [ref=e1081]: 2.当社は2021年7月1日設立のため、2021年12月期の数値は単独株式移転により完全子会社となった株式会社マーキュリアインベストメントの連結財務諸表を引き継いでおります。また、2020年12月期以前につきましては、株式会社マーキュリアインベストメントの連結財務諸表の数値を記載しております。
                      - paragraph [ref=e1082]
                      - paragraph [ref=e1083]: 当社グループの主な収益は以下のとおりです。
                      - paragraph [ref=e1084]: (1)ファンド運用事業
                      - paragraph [ref=e1085]: 当社グループは、投資事業組合等のファンドを組成し、国内外投資家から資金調達、投資対象の発掘、投資対象への投資実行、投資対象のモニタリング、投資対象の売却等による投資回収等の管理運営業務を行うことでファンドより管理報酬を得ております。また、投資家に対する分配実績や投資家の投資採算等に応じてファンドより成功報酬を得ております。
                      - paragraph [ref=e1086]
                      - paragraph [ref=e1087]: (2)自己投資事業
                      - paragraph [ref=e1088]: 当社グループは、管理運営を行うファンドに対して自己投資を実行し、当該ファンドにおける持分損益を得ております。また、自己投資対象からの配当や自己投資対象の売却による売却益を得ております。
