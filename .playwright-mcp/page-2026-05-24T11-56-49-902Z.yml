                    - generic [ref=e824]:
                      - paragraph [ref=e825]
                      - heading "3 【事業の内容】" [level=3] [ref=e826]
                      - paragraph [ref=e827]: 当社グループは、当社と連結子会社3社、非連結子会社2社と関連会社1社で構成されており、下記、主要取扱品目に記載の制御機器、FA機器及び産業機器などの販売を主な事業内容としております。国内取引については、有力メーカーなどより商品を仕入れ、大手ユーザーを中心に販売を行っております。また、海外取引については、主として国内有力メーカーより仕入れた商品を海外ユーザーに販売を行っております。なお、当社グループは、単一の事業セグメントとしております。
                      - paragraph [ref=e828]: 当社グループは、単に機械工具類の卸売りを行うばかりではなく、主としてユーザーの生産現場へニーズに応じた商品を直接販売する形態を採っております。また、日本国内において空気圧機器や省力化、自動化のためのFAロボットの販売をいち早く始めるなど、時代の最先端を行く新商品の発見・育成・提供に努めております。さらに、近年の環境意識の社会的な高まりに応じて、環境マネジメントシステムの国際規格であるISO14001の認証を取得(本社及び全営業所)並びに品質マネジメントシステムの国際規格であるISO9001の認証を取得(本社及び全営業所)しております。
                      - paragraph [ref=e829]: 営業体制は当社営業本部が統括部署となり、国内は地域別に23営業所により得意先に密着した営業を行い、海外については営業本部直轄の海外事業グループを中心に営業を行っております。また、半導体製造装置向けのチップマウンターなどの特に専門的な知識が必要な商品に関しては、特機システム部が対応する体制となっております。
                      - paragraph [ref=e830]
                      - heading "(1) 主要取扱品目" [level=4] [ref=e831]
                      - paragraph [ref=e832]: 当社グループの仕入先は当連結会計年度の実績で約1,200社あり、得意先のニーズに対し的確に応えるための充分な体制を取っており、その主な取扱品目は次のとおりであります。
                      - heading "<制御機器>空気圧機器、電子センサー、圧力センサー、流体継手、真空機器、緩衝器など。" [level=5] [ref=e833]
                      - paragraph [ref=e834]: 制御機器では、生産工程の自動化補助のために使用する空気圧機器や各種センサーなどの単体機器のほか、半導体製造装置、液晶基板製造装置、デジタル機器製造設備などの装置に組み込まれる部材を取り扱っております。特に空気圧機器に関しては、1955年代後半の空気圧機器誕生の時代から販売代理店としての権利をいち早く確保し、長年培った販売技術と得意先との密度の濃い取引関係を有しております。なお、当社は営業担当者に対し、国家資格である空気圧装置組立て技能士の資格取得を推進しており、多くの営業担当者が同資格を保有しております。
                      - heading "<FA機器>産業用ロボット、自動組立機、表面実装システム、レーザー加工機、精密塗布装置など。" [level=5] [ref=e835]
                      - paragraph [ref=e836]: FA機器では、生産工程の自動化を直接担う役割を持つ産業用ロボットや自動組立機などの機器類を中心に構成されており、得意先の生産革新をサポートする商品を取り扱っております。国内主要製造業における海外とのコストダウン競争や熟練工の高齢化対策といった課題に対し、当社は技術的な専門知識を有した営業担当者が製造現場のコストダウン並びに高度化などの提案を行い、得意先のニーズに対し的確な商品を提供しております。なお、当社は営業担当者に対し、FAロボットのメーカーSE資格の取得を推進しております。
                      - heading "<産業機器>電動ドライバー、アルミフレーム、無人搬送車、コンベア、ろ過フィルター、環境システムなど。" [level=5] [ref=e837]
                      - paragraph [ref=e838]: 産業機器では、生産現場に必要な電動ドライバーを中心とした工具関係を中心に、自動車関連の得意先向けの無人搬送車や半導体製造装置関連の得意先に需要のあるアルミフレームなどを取り扱っております。
                      - paragraph [ref=e839]
