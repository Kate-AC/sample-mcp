                      - heading "3【事業の内容】" [level=3] [ref=e1047]
                      - paragraph [ref=e1048]: 株式会社シモジマ(当社)グループは、当社及び当社の連結子会社9社、非連結子会社3社と持分法非適用関連会社1社で構成され、当社は包装資材(主として、紙袋、包装紙・紙器、ポリ袋、粘着テープ、紐・リボン、店舗用品等)の販売及び仕入を行っております。
                      - paragraph [ref=e1049]: 当社を事業部門別に分けると次のとおりであります。
                      - paragraph [ref=e1050]
                      - paragraph [ref=e1051]: (1) 営業販売部門 二次卸・包装用品販売店に対するディーラー販売と、ユーザーへの直接販売を行っております。また、フランチャイズ加盟店(パッケージプラザ)に対しても卸販売を行っております。
                      - paragraph [ref=e1052]: (2) 店舗販売部門 店舗における直接販売を行っております。
                      - paragraph [ref=e1053]: (3) 通信販売部門 インターネットを媒体とした通信販売を行っております。
                      - paragraph [ref=e1054]
                      - paragraph [ref=e1055]: 当社グループの事業内容及び当社と子会社の位置付けは次のとおりであります。
                      - paragraph [ref=e1056]
                      - paragraph [ref=e1057]: 商品仕入は、(有)彩光社、朝日樹脂工業(株)、(株)シモジマ製袋、下島(上海)商貿有限公司及び一般仕入先より行っております。(有)彩光社はシール類を、朝日樹脂工業(株)はポリ袋等の化成品をそれぞれ製造しております。
                      - paragraph [ref=e1058]: 商品販売は当社が直接行うほか、(株)リード商事は花材・園芸関連資材の販売、ミタチパッケージ(株)は工業関連資材の販売、(株)大倉産業は病院、介護施設等に向けた衛生用品の販売を行っています。さらに当社との間で一部商品の相互仕入・販売を行うことで相乗効果を図っております。また、フランチャイズ加盟店(パッケージプラザ)の管理を(株)エスパックが行い、同加盟店の一部運営を(株)我満商店で行っております。
                      - paragraph [ref=e1059]: 物流業務に関しては、主にシモジマ加工紙(株)へ委託しております。
                      - paragraph [ref=e1060]: さらに中国においては、下島(上海)商貿有限公司が販売及び貿易業務を行い、台湾においては、台湾下島包装股份有限公司が台北市で店舗販売と営業販売を行っています。
                      - paragraph [ref=e1061]
                      - paragraph [ref=e1062]: "[事業系統図]"
