                      - paragraph [ref=e1177]: 当社グループは、株式会社オーハシテクニカ(当社)及び子会社14社、関連会社2社により構成され、事業は、エンジン関連部品、車体組立用部品、ブレーキ関連部品、EV関連等の「自動車関連部品」及び「その他関連部品」の製造、販売、加工技術開発並びに物流業務を行っております。
                      - paragraph [ref=e1178]: 国内では、当社は「自動車関連部品」及び「その他関連部品」の販売及び加工技術開発、オーハシ技研工業株式会社、株式会社テーケー及び株式会社ナカヒョウは「自動車関連部品」の製造、販売、株式会社オーハシロジスティクスは当社グループの物流部門を担っております。
                      - paragraph [ref=e1179]: 海外においては、OHASHI TECHNICA U.S.A.,INC.、OHASHI TECHNICA U.S.A. MANUFACTURING,INC.、OHASHI TECHNICA MEXICO,S.A.DE C.V.、大橋汽車配件(広州)有限公司、大橋精密件(上海)有限公司、大橋精密件制造(広州)有限公司、広州大中精密件有限公司、大橋精密電子(上海)有限公司、OHASHI TECHNICA(THAILAND)CO.,LTD.、OHASHI SATO(THAILAND)CO.,LTD.、OHASHI TECHNICA UK,LTD.、台灣大橋精密股份有限公司の12社が事業を展開しております。
