                    - generic [ref=e1084]:
                      - paragraph [ref=e1085]
                      - heading "3 【事業の内容】" [level=3] [ref=e1086]
                      - paragraph [ref=e1087]: 当社グループは、当社(株式会社星医療酸器)、連結子会社5社、非連結子会社2社及び関連会社1社で構成されており、事業における位置付け及びセグメントとの関連は、次のとおりであります。
                      - paragraph [ref=e1088]: (医療用ガス関連事業)
                      - paragraph [ref=e1089]: 当部門は、医療用ガスの製造は、各地域製造子会社である(株)エイ・エム・シー(東京都)、(株)アイ・エム・シー(茨城県)、(株)ケイ・エム・シー(神奈川県)、(株)テイ・エム・シー(愛知県)でおこない、当社が、医療用ガスの販売及び医療用ガス関連商品の企画・販売をおこなっております。
                      - paragraph [ref=e1090]: (在宅医療関連事業)
                      - paragraph [ref=e1091]: 当部門は、当社が在宅酸素発生器等及び在宅関連商品の仕入を行い、当社が在宅酸素発生器等のレンタル業務及び在宅関連商品の販売をおこなっております。
                      - paragraph [ref=e1092]: (医療用ガス設備工事関連事業)
                      - paragraph [ref=e1093]: 当部門は、当社が医療用ガス配管設備の工事・メンテナンス及び消火設備工事をおこなっております。
                      - paragraph [ref=e1094]: (介護福祉関連事業)
                      - paragraph [ref=e1095]: 当部門は、当社、(株)虎彰が介護福祉関連機器等のレンタル業務及び販売をおこなっております。また、当社が訪問看護・居宅介護支援事業所「星医療酸器訪問看護・リハビリステーション巣鴨」、「星医療酸器訪問看護・リハビリステーション阿佐ヶ谷」及び「星医療酸器訪問看護・リハビリステーション王子」を運営しております。
                      - paragraph [ref=e1096]: (施設介護関連事業)
                      - paragraph [ref=e1097]: 当部門は、当社が有料老人ホーム「ライフステージ阿佐ヶ谷」(東京都杉並区)、通所介護施設「あしつよ・文京」(東京都文京区)、「あしつよ 巣鴨」(東京都豊島区)及び「あしつよ 王子」(東京都北区)を運営しております。
                      - paragraph [ref=e1098]: (その他事業)
                      - paragraph [ref=e1099]: 当部門は、当社が看護学校関連商品の販売をおこなっております。また、当社が医療器具関連商品の販売をおこなっております。
                      - paragraph [ref=e1100]: 当社グループの事業内容及び当社と関係会社との当該事業における位置付けは次のとおりであります。
