                    - generic [ref=e829]:
                      - heading "3【事業の内容】" [level=3] [ref=e830]
                      - paragraph [ref=e831]: 当社グループ(当社及び当社の関係会社)は、当社(メディキット(株))、子会社4社(連結子会社4社)により構成されており、医療機器の開発・製造・販売を業務としております。医療機器の製造は連結子会社である東郷メディキット(株)、Medikit Vietnam Co.,Ltd.が行っており、当社は東郷メディキット(株)より同製品を仕入れ、国内外ユーザーに販売しております。
                      - paragraph [ref=e832]: 当社グループは、主として血管・血液に関する分野の医療機器を取扱っております。単一セグメントのため品目別に分類しますと、次のとおりであります。
                      - paragraph [ref=e833]: 人工透析類
                      - paragraph [ref=e834]: 人工透析類では人工透析用留置針を中心とした人工透析関連製品の製造・販売を行っております。人工透析用留置針は、慢性腎不全の血液透析時に使用する針で、血液を取り出す針と透析器で浄化された血液を体内へ戻す針の2本を1回の透析で使用します。人工透析は年間150回程度行うため、穿刺時における苦痛が少なく、血管を傷めない針が必要とされております。主要製品名は、「ハッピーキャス」であります。
                      - paragraph [ref=e835]: 静脈留置針類
                      - paragraph [ref=e836]: 静脈留置針類では輸血・輸液等に使用する針の製造、販売を行っております。静脈留置針の主な用途としては、栄養補給等の目的で輸液を末梢静脈経由で投与する際に使用しております。近年、医療スタッフが安心して使えるよう、誤刺防止機能付き留置針を当社グループをはじめ同業各社が独自の工夫を凝らした製品を市場に投入しております。当社グループとしても、市場のニーズを反映させた製品を開発し販売しております。主要製品名は、「スーパーキャス」であります。
                      - paragraph [ref=e837]: インターベンション類
                      - paragraph [ref=e838]:
                        - text: カテーテルシステムを用いた検査(造影)及び治療の総称をインターベンションと呼んでおり、当社グループは、血管造影、血管内治療に用いるシースイントロデューサー
                        - superscript [ref=e840]: (注1)
                        - text: 、カテーテル
                        - superscript [ref=e842]: (注2)
                        - text: 等の製造・販売を行っております。血管造影及び治療は、血管を通して病変部の検査及び治療を施行するものであります。対象部位は、主に頭、腹部、心臓であります。その手技としては、腕、もしくは、大腿部血管へシースイントロデューサーを挿入し、目的血管に適合するカテーテルを病変部分まで到達させます。次に、そのカテーテルを通して造影剤を流し込み、X線撮影を行います。その造影結果から、疾患の有無、度合いを診断し、がん、狭心症
                        - superscript [ref=e844]: (注3)
                        - text: 等の必要とされる治療を行うものであります。
                      - paragraph [ref=e845]: (注1)シースイントロデューサー...主に血管造影用カテーテルなどを腕や足の血管に挿入する際に使用する器具です。この医療機器は血管を拡張しながら容易に、かつ血管を損傷させることなく血管内に導入することができ、また、何度でもカテーテルを挿入することが可能となります。
                      - paragraph [ref=e846]: (注2)カテーテル...太腿や腕の血管から挿入する直径1~2mm程度のチューブです。広義には、体内に挿入する医療用チューブ全般を指す場合があります。
                      - paragraph [ref=e847]: (注3)狭心症...1日に10万回も収縮と拡張を繰り返している心臓の血管は非常に硬くなりやすく(動脈硬化)、狭くなりやすい(狭窄)状態になっています。軽度の狭窄の場合、血液を十分に流し続けることができなくなり、体を動かしたり興奮したりしたときに心臓(胸)が苦しくなりますが、これを狭心症といいます。
                      - paragraph [ref=e848]
                      - paragraph [ref=e849]: 品目別の主要製品は下表のとおりであります。
