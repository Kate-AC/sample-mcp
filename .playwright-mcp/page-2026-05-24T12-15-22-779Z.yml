                  - generic [ref=e450]:
                    - generic [ref=e451] [cursor=pointer]: 続きを読む
                    - generic [ref=e452]:
                      - heading "3【事業の内容】" [level=3] [ref=e453]
                      - paragraph [ref=e454]: 当社グループは、生産体制を持つ総合販促支援企業として、セールスプロモーション事業を行っており、インクジェットプリントを中心にさまざまなソリューションを提供しております。
                      - paragraph [ref=e455]: 当社は、インクジェットプリントを主力とし、それ以外にオフセット印刷、シルクスクリーン印刷、オンデマンド印刷等の少品種多量生産型のプリントソリューション、デジタルサイネージ機器や映像配信システムの販売、オーダーグッズ制作、拡張現実(AR)技術を活用した販売促進用広告物の制作を行っております。
                      - paragraph [ref=e456]: グループ会社の株式会社イデイ(以下、「イデイ社」)は、広告代理店として、印刷物、広告の企画、デザイン及び制作を行っております。
                      - paragraph [ref=e457]: なお、当社は従来セールスプロモーション事業とウェブプロモーション事業の2事業体制でしたが、当連結会計年度において、ウェブプロモーション事業を再編し、販売促進用広告物を扱うECサイトを運営するネット販売部門とウェブ集客活動を通じて販売促進用広告物の対面営業に繋げるマーケティング部門に分割したこと、及び、広告・販促のエキスパートであるイデイ社をグループ会社化したことに伴い、セグメント区分を見直した結果、セールスプロモーション事業の単一セグメントに変更いたしました。
                      - paragraph [ref=e458]: 当社では、お客さまの販促・マーケティング活動を支え、日本社会、地域社会の発展に貢献し続けるために、「より良い働きを通じて 全従業員の物心両面の幸せを創造し 社会へ貢献する。」という経営理念を掲げており、グループ会社にも共有しております。主力となるのはインクジェットプリントで、主として、広告代理店、広告制作会社、印刷会社、デザイン会社等から発注される販売促進用広告物の制作及びゲーム機メーカーが取り扱うプリントシール機の外装カーテン、並びにインテリアメーカーやインテリア専門商社が取り扱う、内装壁紙や床材等の制作を行っております。
                      - paragraph [ref=e459]: 約30年前に印刷業界において、アナログ写植から組版~製版など印刷前の作業工程がデジタル化され、オンデマンドの利点を活かした特定の分野で、着実にインクジェットプリントがその適用分野を拡大しつつありました。インクジェットプリントは、オフセット印刷と比較して版作成が不要(版レス)のため、スピード対応が可能で短納期にも対応できることや、必要なものを必要なだけ制作できるため、余分な在庫をかかえる必要がなく極小ロットにも対応できることが大きな特徴です。また、オフセット印刷では不可能なサイズへのプリントが可能となり、応用範囲が格段に広がってきました。従来の印刷方法では、少部数のもの(特に大判のもの)も必ず大量印刷物と同じ工程をとらなければならなかったため、コスト的に見合わずに断念するケースが多くみられました。
                      - paragraph [ref=e460]: しかし、ここ近年において、大判インクジェットプリンター製品の性能向上に伴い、プリントスピードが大幅にあがり、また出力解像度が向上したことにより、従来の手間やコストが大幅に削減され、オフセット印刷市場へインクジェット業界が進出していくことが可能となりました。また、インクジェットプリンターは、当初は紙にプリントする用途が専らでありましたが、大判インクジェットプリンターの技術革新・高画質化に伴い、紙以外のアクリル素材、木材、衣類などの多種多様なあらゆる材料へのプリントが可能となり、ここ数年では、3Dプリントといった二次元から三次元へのプリントも可能になりました。このように「インクジェットプリント」がどんどん私たちの生活に近づき発展しつつあります。我々は「インクジェット」と調和し、より世の中に身近なところでお手伝いを行い、技術の進歩、業界の発展に全力を注ぎたいと考えております。
                      - paragraph [ref=e461]: その中で当社では、年々多様化してきている顧客ニーズに対応するべく、全国都心部において、100台以上の多種多様な業務用インクジェットプリンターや各種加工マシンを保有しております。また、100名を超える制作オペレーターを配置しインクジェットプリントサービスを展開しております。
                      - paragraph [ref=e462]: 当社の主な販売市場としましては、販売促進用POP・什器製品を主な商材としたセールスプロモーション市場、店舗・商業施設・展示会など屋外広告物で使用するサイン製品を商材としたサイングラフィックス市場、テーブルクロスやファブリック素材など布地プリント製品を商材としたテキスタイル市場、壁・窓・床を中心とした壁紙やカーテン、内装インテリア製品を商材とした内装インテリア市場の4つに区分されます。
                      - paragraph [ref=e463]: 当社が提供する主たるサービスのうち、販売促進用広告制作においては、広告代理店、広告制作会社、印刷会社、デザイン会社、屋外サイン業者等から発注される販売促進用広告物を制作しており、2024年11月に多くの広告主と取引がある広告代理店のイデイ社をグループ会社化し、顧客層の拡大を進めております。
                      - paragraph [ref=e464]
                      - paragraph [ref=e465]: 1営業体制
                      - paragraph [ref=e466]: 当社の営業部門は大阪、東京、横浜、名古屋、福岡、京都に拠点を置いております。原則として街の中心部に位置しており、例えば大阪では大阪市内という限られた地域に絞り、都心の利点を活かして非常に限られたエリア単位で営業部員をきめ細かく配置しながら、サービスを展開しております。また、グループ会社のイデイ社は大阪、東京に拠点があり、両社の営業担当者が同行して共同提案するなど、両社の商品力、企画提案力の強みを生かした活動を行っております。
                      - paragraph [ref=e467]: 当社では、広い地域であらゆる業界からの受注を目指すのではなく、広告代理店、広告制作会社、印刷会社、デザイン会社、屋外サイン業者に的を絞り、そうしたお客さまが集中する都心部の狭い地域において受注占有率で地域No.1になることを基本方針としております。
                      - paragraph [ref=e468]: また、広告業界の特性として、広告代理店等が広告主から即応体制を求められ、当社も即納体制を整備することが受注獲得の上で非常に重要になります。このため、お客さまから近い地域に制作拠点を設けることがお客さまにとって非常に利便性が高く、安心して発注できるというメリットがあります。都心部エリア外に位置する広域エリアのお客さまに関しては、広域エリア専任営業を配置し、受注獲得を行っております。さらに、インターネット経由による問い合わせに関しても専任窓口を配置し、ECサイトとウェブ受注専用ページ(ランディングページ)を運用し、受注獲得を行っております。
                      - paragraph [ref=e469]
                      - paragraph [ref=e470]: 2制作体制
                      - paragraph [ref=e471]: 当社の制作部門は、大阪、横浜、名古屋、福岡に拠点を置いております。主要な拠点において、24時間体制で生産を行っており、お客さまからの短納期の注文や緊急案件を含め、様々な要望にも対応可能なサービス体制を構築しております。また、1箇所の拠点に受注が集中した場合においては、拠点間での連携制作を行い、生産機会の逸失を防ぐ体制をとっております。また、各拠点間での製品の品質差異を防ぐために、拠点間同士での色統一が可能となる測色システムを導入し、品質管理体制を強化しております。
                      - paragraph [ref=e472]: 当社では、制作体制の「アナログからデジタル化」を基本方針として掲げ、加工の機械化・高速化を図ることを重点的に行っております。最新鋭設備を調査し、オートメーション化を加速させていきます。
                      - paragraph [ref=e473]
                      - paragraph [ref=e474]: 3商品・サービスの概要
                      - paragraph [ref=e475]: 当社グループは総合販促支援企業として、店頭用セールスプロモーションツールや屋外広告サイン、展示会装飾など、多種多様な販売促進用の広告製品を取り扱っております。インクジェットプリントを主力とし、それ以外にデジタルサイネージ機器や映像配信システムの販売、拡張現実(AR)技術を活用したサービス、オーダーグッズ制作、オフセット印刷、シルクスクリーン印刷、オンデマンド印刷等の少品種多量生産型のプリントソリューションの提供を行っております。なお、2026年10月期から新たな事業領域に注力すべく、「包む」を通じてブランドの想いと顧客の心を結び、開封の瞬間に感動と期待を生み出すことを目指して、紙器、貼箱、ギフトBOXなどのパッケージソリューションの提供を開始しております。
