                    - generic [ref=e1110]:
                      - heading "3【事業の内容】" [level=3] [ref=e1111]
                      - paragraph [ref=e1112]: 当社グループ(当社及び当社の関係会社)は、国内に8社の連結子会社、海外に1社の子会社と1社の関連会社から構成されております。当社は創業以来、証券調査レポートに関連する「電子媒体」と「紙媒体」の両方のサービスを提供することで、ユニークな金融情報ベンダーとしての地位を築き上げてきました。その後、上場企業及び投資信託のディスクロージャーといった会社法・金融商品取引法関連の金融・財務ドキュメント分野でのサービスも開始いたしました。
                      - paragraph [ref=e1113]: 当社グループのセグメントは、1.投資情報事業、2.ドキュメントソリューション事業、3.ファンドディスクロージャー事業、4.ITソリューション事業、5.ランゲージソリューション事業に分かれており、国内の8社の連結子会社、海外の1社の子会社と1社の関連会社もこれに関連した事業を展開しております。
                      - paragraph [ref=e1114]: 5つの事業を柱に、当社グループならではの独創性に富んだ商品ラインアップで、金融情報サービス業界を革新するソリューションを提供しております。
                      - paragraph [ref=e1115]
                      - paragraph [ref=e1116]: 〔事業系統図〕
                      - paragraph [ref=e1117]: 当社の事業系統図は、次のとおりです。
                      - paragraph [ref=e1118]
                      - paragraph [ref=e1119]: （画像は省略されました）
                      - paragraph
                      - paragraph [ref=e1120]: (注)無印 連結子会社
                      - paragraph [ref=e1121]: ※1 持分法適用関連会社
                      - paragraph [ref=e1122]: ※2 非連結子会社で持分法非適用会社
                      - paragraph [ref=e1123]
                      - paragraph [ref=e1124]: 1 投資情報事業
                      - paragraph [ref=e1125]: 投資情報事業では、機関投資家、証券会社、メディア(個人投資家)市場に対して、下記サービスを展開しております。
                      - paragraph [ref=e1126]: 以下、各サービスについて説明いたします。
                      - paragraph [ref=e1127]: (1) 『IFIS Research Manager』(アイフィス・リサーチ・マネージャー)
                      - paragraph [ref=e1128]: 主要証券会社が機関投資家向けに発行している証券調査レポートを、Web上で一元管理・検索・閲覧できる電子書庫サービスです。当社は創業以来、証券調査レポートの印刷・配送事業を行ってまいりました。証券調査レポートの提供先である機関投資家のファンドマネージャーやアナリストからの「紙媒体で届く証券調査レポートを電子的に保管し、いつでも必要な時に検索したい」というニーズに対応するため、見やすく検索機能も充実させた“調査レポート電子書庫サービス”である『IFIS Research Manager』を開発し、1998年4月よりサービスを開始いたしました。
                      - paragraph [ref=e1129]: 現在、主要な機関投資家のファンドマネージャーやアナリスト、また主な上場企業のIR部署などで利用されております。インターネットならではの利便性に加え、データ更新の速さ、豊富な情報量、ユーザビリティの良さが評価され、レポート閲覧サービスにおいて圧倒的なシェアを獲得しております。
                      - paragraph [ref=e1130]: 掲載されているレポートは、「銘柄レポート」「業界レポート」「マクロ経済レポート」「ストラテジーレポート」「債券レポート」、上場企業のIR情報(決算説明会資料等)やクレジットを含む債券市場に関する調査レポートなど豊富な情報が100万件に及んでおります。さらに主要証券会社のアナリストの調査レポートは1日あたり数百本を追加提供しております。
                      - paragraph [ref=e1131]: また、機関投資家が『IFIS Research Manager』を通じてどの銘柄やセクターレポートにアクセスしたのか、そのアクセス状況を集計し、独自の視点で分析したレポート『IFIS Watch』を毎月発行しております。機関投資家にとってはマーケットトレンドの把握や注目レポートの確認に、企業のIR担当者にとっては自社の評価はもちろん業界全体の動向や同業他社の注目度の確認に有効なツールとして幅広く活用できる情報です。料金体系は利用ID数に応じた月毎の定額制となっております。
                      - paragraph [ref=e1132]
                      - paragraph [ref=e1133]: (2) 『IFIS Consensus』(アイフィス・コンセンサス)
                      - paragraph [ref=e1134]: 主要証券会社のアナリストによる業績予想数値を、独自の“IFISコンセンサスポリシー”に基づいて算出したコンセンサス(市場予想平均)です。
                      - paragraph [ref=e1135]: 米国では、上場企業が自社の収益予想を発表することが少ないため、証券会社のアナリスト予想の平均値であるコンセンサス予想が株式投資において非常に重視されております。日本でもコンセンサス予想に対するニーズが高まるものとの考えに基づき、当社では2001年から『IFIS Consensus』の制作を開始しました。主要証券会社から発行される銘柄レポート、業界レポート等を登録対象に、これらのデータから売上高、営業利益、経常利益、当期利益等の予想数値の平均値を毎日算出し、お客様のニーズに合わせて様々な形式で提供しております。日本市場の実態に即したコンセンサスを算出できる独自のルール構築に加え、データ入力・加工処理において数段階のチェックを行うことで、データの即時性と精緻性を両立しております。
                      - paragraph [ref=e1136]: 現在、複数の証券会社アナリストが発行する証券調査レポートに『IFIS Consensus』の掲載が定着するなど、アナリストやファンドマネージャーの間で幅広く利用されていると当社では認識しております。
                      - paragraph [ref=e1137]: 『IFIS Consensus』では、データの精緻性・即時性を重視するため、社内の専門スタッフがデータ制作に従事し、また、当社独自のチェック体制を確立しております。ユーザーにもデータの精緻性・即時性の面で高い評価をいただいており、他社との差別化はこの点にあると認識しております。
                      - paragraph [ref=e1138]: 当社では、この『IFIS Consensus』を利用した以下のサービスを展開しております。
                      - paragraph [ref=e1139]
                      - paragraph [ref=e1140]: 1 『IFIS Consensus Manager』(アイフィス・コンセンサス・マネージャー)
                      - paragraph [ref=e1141]: 主要証券会社のアナリストによる業績予想数値をもとに算出した『IFIS Consensus』を、会社実績数値、会社予想数値とともにWeb上で閲覧できるサービスを機関投資家と証券会社に提供しております。銘柄ごとに『IFIS Consensus』と会社実績数値、会社予想数値の推移や乖離を株価の推移とともにグラフィカルに表示できるほか、設定した条件で銘柄を抽出できるスクリーニング機能を備えております。
                      - paragraph [ref=e1142]: また、証券調査レポート閲覧サービス『IFIS Research Manager』と合わせてご利用いただければ、各アナリストの業績予想数値から、その数値が掲載されているレポートへのリンクで確認できるなど、多角的な情報分析が可能です。料金体系は、利用ID数に応じた月毎の定額制となっております。
                      - paragraph [ref=e1143]
                      - paragraph [ref=e1144]
                      - paragraph [ref=e1145]: 2 『IFIS Consensus Data』(アイフィス・コンセンサス・データ)
                      - paragraph [ref=e1146]: 『IFIS Consensus Data』は、証券会社アナリストによる最新の業績予想をベースに独自に算出した『IFIS Consensus』のデータを「バルク形式」で提供するサービスです。
                      - paragraph [ref=e1147]: 『IFIS Consensus』は、機関投資家、ヘッジファンド、大手証券会社などから市場実態に即したコンセンサスとして高い評価をいただいております。生データをバルクで提供することで、即時性、精緻性に加え、高い加工性を持つことが特長です。配信するデータとしては、当社の独自データブランドである『IFIS Consensus』、アナリストの業績予想、企業が発表する実績、予想データがあります。『IFIS Consensus』やアナリストの業績予想データを100%自社で作成することで、他ベンダーとデータの精緻性の差別化を図り、機関投資家、証券会社、金融ポータル、ヘッジファンド、メディア、大学・研究機関などで広くご利用いただいております。料金体系は、データの利用項目数に応じた定額制となっております。
                      - paragraph [ref=e1148]
                      - paragraph [ref=e1149]: (3) 『IFIS Disclose Manager』(アイフィス・ディスクローズ・マネージャー)
                      - paragraph [ref=e1150]: 決算短信・有価証券報告書等、TDnet、EDINET経由で発信される各種開示資料を掲載し、まとめて検索、閲覧できるサービスです。企業が開示を行ったタイミングと同時にTDnet、EDINET経由でXBRLデータを自動的に取り込み、『IFIS Disclose Manager』に収録しております。料金体系は、利用ID数に応じた月毎の定額制となっております。
                      - paragraph [ref=e1151]
                      - paragraph [ref=e1152]: (4) 個人投資家向けASPサービス
                      - paragraph [ref=e1153]: 機関投資家を中心に利用されている『IFIS Consensus』を個人投資家の方々にも触れていただくため、ポータルサイトや証券会社を通して様々な切り口の独自性豊かな投資情報コンテンツをご提供しております。
                      - paragraph [ref=e1154]
                      - paragraph [ref=e1155]: 1 証券会社向けASPサービス
                      - paragraph [ref=e1156]: 個別企業の業績予想・アナリスト達の最新の評価やその推移をまとめたレポートのほか、決算や業績修正を素早く伝える業績トピックス、プロの切り口でのスクリーニング結果を日々表示する簡単スクリーニングなどの投資情報を、個人投資家を対象にしている証券会社に提供しているサービスです。
                      - paragraph [ref=e1157]: これらの投資情報は、提供先証券会社において、口座をお持ちのお客様向け投資情報、あるいはリテール営業の支援ツールとして利用されております。料金体系は、月毎の定額制とPV数に応じた従量制となっております。
                      - paragraph [ref=e1158]
                      - paragraph [ref=e1159]: 2 無料オープンサイト『IFIS株予報』
                      - paragraph [ref=e1160]: 『IFIS株予報』は、当社がYahoo!ファイナンスのパートナーサイトとして運営するオープンサイトです。決算スケジュール、ディレイ配信での決算・業績修正に関する業績トピックスのほか、業績予想値、期中の業績の進捗度合い等をわかり易く掲載した個別企業情報等で構成されており、Yahoo!ファイナンスを通して閲覧することができます。
                      - paragraph [ref=e1161]: 圧倒的な集客力を誇るオープンサイトでの情報配信を通じて、当社では個人投資家における『IFIS Consensus』の浸透を図るとともに、広告の一媒体として、有料で企業の広告を当サイト上に掲載しております。
                      - paragraph [ref=e1162]
                      - paragraph [ref=e1163]: (5) 証券レポート作成システム
                      - paragraph [ref=e1164]: 証券会社が顧客向けに発行するアナリストレポートの制作から配信までをカバーする業務システムを証券会社のリサーチ部門向けに提供しております。
                      - paragraph [ref=e1165]: 証券会社では常により質の高いレポート作成のため、情報の収集、綿密な調査・分析を行い、まとめた投資情報をレポートにして発信します。証券レポート作成システムではアナリストが執筆した原稿の登録、原稿の社内審査、情報管理、公開後のレポートの検索閲覧などの社内管理体制を一元管理することが可能になり、アナリストレポートの品質や一貫性の保持、業務全般の効率化・スピード化など、プロダクトレベル向上に効果を発揮します。
                      - paragraph [ref=e1166]
                      - paragraph [ref=e1167]: (6) NPMServices
                      - paragraph [ref=e1168]: 株式会社金融データソリューションズでは金融、特に日本株式に関する膨大なデータから目的に応じたデータをスピーディーに取得できるサービス、ソリューションを提供しております。
                      - paragraph [ref=e1169]: ポートフォリオ構築、リスク分析、パフォーマンス要因分析など機関投資家向けの日本株式運用業務支援をアプリケーションで提供し、日本有数の大手機関投資家など数十社で利用されております。またNPMServicesのデータは、生存者バイアスや先読みバイアスが除かれております。このため、多くの大学研究者がNPMServices収録データを分析に利用しております。
                      - paragraph [ref=e1170]: (7) キャピタルアイ・ニュース、データ
                      - paragraph [ref=e1171]: 株式会社キャピタル・アイが提供する日本の資本市場の活動を報道するニュースサービスです。
                      - paragraph [ref=e1172]
                      - paragraph [ref=e1173]: 1 『キャピタルアイ・ニュース』
                      - paragraph [ref=e1174]: 本邦関連発行体による社債、財投機関債、地方債、証券化などのデットファイナンス及び株式、CBを中心としたエクイティファイナンスの動向を中心にお伝えするニュースサービスです。
                      - paragraph [ref=e1175]: 主幹事の指名や条件決定などを速報し、債券・株式の販売状況や市場の傾向を分析した記事、引受ランキングや発行額のデータなどを配信します。そのほか、CDSレポート、一般債セカンダリーレポート、貸株市場レポートなども日々更新しております。料金体系は、利用ID数に応じた月毎の定額制となっております。
                      - paragraph [ref=e1176]
                      - paragraph [ref=e1177]: 2 『キャピタルアイ・データ』
                      - paragraph [ref=e1178]: 『キャピタルアイ・ニュース』で配信している案件要項を収録するデータベースサービスです。
                      - paragraph [ref=e1179]: 検索・集計・ランキング・ダウンロードなどの機能を備えております。過去のファイナンス実績や償還案件、引受実績を「発行体シート」にまとめております。
                      - paragraph [ref=e1180]: また、『キャピタルアイ・ニュース』で配信している「起債観測」、「マーケティングレンジ」、「CDS市場」、「CP発行市場」の各項目をエクセルファイルで提供します。料金体系は、データの利用項目数に応じた定額制となっております。
                      - paragraph [ref=e1181]
                      - paragraph [ref=e1182]: 2 ドキュメントソリューション事業
                      - paragraph [ref=e1183]: ドキュメントソリューション事業では、証券会社、機関投資家及び上場企業のIR部署に対して下記サービスを展開しております。
                      - paragraph [ref=e1184]: 以下、各サービスについて説明いたします。
                      - paragraph [ref=e1185]: (1) 証券・生命保険資料の印刷・配送
                      - paragraph [ref=e1186]: 主要証券会社発行の証券調査レポートや生命保険会社が発行する変額年金販売資料など、金融機関が発行する各種レポートや商品パンフレットといった金融及び財務に特化したドキュメントの処理をレイアウト編集から印刷、製本、宛名印字・封入・封緘、配送までトータルに短時間で提供するサービスです。
                      - paragraph [ref=e1187]
                      - paragraph [ref=e1188]: (2) 企業年金関連サービス
                      - paragraph [ref=e1189]: 企業年金関連サービスでは確定拠出年金、確定給付年金の運営管理機関向けにサービスを提供しております。
                      - paragraph [ref=e1190]
                      - paragraph [ref=e1191]: 1 企業年金関連文書管理システム
                      - paragraph [ref=e1192]: 確定拠出年金、確定給付年金の運営管理機関が加入者向けに発行する運用商品説明資料、モニタリングレポートなどの作成業務に特化した業務支援ASPシステムを提供しております。
                      - paragraph [ref=e1193]: 確定拠出年金、確定給付年金導入の企業様のDCプランに採用されている預金・保険・投資信託など多数の商品ごとの月次レポート、商品説明などの文書ファイルのシステム登録を代行し、システム上で個別DCプランに紐付けして文書ファイルを管理するとともに、自動的に資料を編集・生成します。
                      - paragraph [ref=e1194]: ASPシステムは印刷機能、ファイル公開機能、電子ブック生成機能など豊富な機能を標準実装しておりますが、運営管理機関の様々なニーズに対応するためカスタマイズ開発なども行っております。
                      - paragraph [ref=e1195]
                      - paragraph [ref=e1196]: 2 派生印刷・配送
                      - paragraph [ref=e1197]: 確定拠出年金、確定給付年金文書管理システムには印刷機能、ファイル公開機能、電子ブック生成機能などが搭載されており、システムの提供だけでなく、投資教育コンテンツの制作やデザイン制作・印刷配送、個別業務のBPOの請負、トータル的なソリューションを提供しております。
                      - paragraph [ref=e1198]
                      - paragraph [ref=e1199]: (3) IR資料印刷・配送
                      - paragraph [ref=e1200]: 決算発表スケジュールが早まる傾向の中、決算短信・決算説明会資料印刷の納期が短縮され、スピーディーな印刷が各上場企業に求められているため、上場企業の実務上の負担となっております。当社ではこのような業務負担を軽減するよう夜間にも対応したオンデマンド印刷サービスを行っております。またアニュアルレポートや事業報告書、ファクトブックなどのIRツールの企画から制作・印刷さらに配送業務までを一括で低価格にて提供するサービスも行っております。
                      - paragraph [ref=e1201]
                      - paragraph [ref=e1202]: (4) 『W2Pクラウド』(Web-to-Printサービス)
                      - paragraph [ref=e1203]: 名刺・はがき・封筒、印鑑・スタンプ、DM・チラシ・ポスター等のオーダーメイド品を扱う全てのEコマースビジネスのために設計されたASPサービスで、Web上でオンライン編集技術を必要とするビジネスに、Eコマースサイト・自動組版エンジン・オンライン編集/プレビューを実現する仕組みを提供しております。
                      - paragraph [ref=e1204]: 2012年のサービス提供開始以来、印刷通販サイト・販促品注文サイト・カタログ通販サイト・年賀状サイト・名刺サイト等のサービスを実現するための仕組みとして多くのEコマースサイトに採用されております。
                      - paragraph [ref=e1205]
                      - paragraph [ref=e1206]: (5) 物流サービス
                      - paragraph [ref=e1207]: 株式会社東京ロジプロではワンストップの総合物流サービスを提供しております。
                      - paragraph [ref=e1208]: 印刷から、封入・封緘・各種梱包作業、在庫管理を行う『ドキュメントサービス』と、運送・配達・発送代行の『デリバリーサービス』をカスタマイズすることにより、小規模組織ならではのスピードと柔軟性で無駄のない物流プロセスを提供しております。
                      - paragraph [ref=e1209]
                      - paragraph [ref=e1210]: 3 ファンドディスクロージャー事業
                      - paragraph [ref=e1211]: ファンドディスクロージャー事業では、機関投資家の中でも投信会社に特化して、下記サービスを展開しております。
                      - paragraph [ref=e1212]: 以下、各サービスについて説明いたします。
                      - paragraph [ref=e1213]: (1) 目論見書等の編集・印刷・配送
                      - paragraph [ref=e1214]: 投信会社がファンド募集にあたって発行が義務付けられている目論見書や運用報告書、ポスター並びに各種販売用資料のデザイン制作やレイアウト編集から印刷・配送まで一括してトータルに提供するサービスです。
                      - paragraph [ref=e1215]: 目論見書は、投資対象や運用方針、販売手数料や信託報酬などのコストに関する事項、信託約款の内容などファンドに関する重要な情報が記載されている資料です。ファンドごとに運用会社が作成しており、投資信託を購入する人にとって最も重要な情報源であるといえます。販売会社は、投資家に対してファンドの購入時までにこの目論見書を交付することが義務づけられていることから、当社では顧客要請に基づいた厳密な納期・品質管理と専門的なノウハウをもとにサービスを行っております。
                      - paragraph [ref=e1216]
                      - paragraph [ref=e1217]: (2) マーケティング支援
                      - paragraph [ref=e1218]: 各種金融ドキュメントの企画・制作から、印刷、配送までをトータルサポートしております。文書生成・管理のシステム開発や各種業務サポート、デザイン・制作、印刷・製本から封入・配送などでドキュメントライフサイクルの全てをカバーするソリューションは、証券、投資信託、銀行、保険などの金融機関から高い評価を得ております。
                      - paragraph [ref=e1219]: また、長年培った金融ドキュメントの知識と経験を活かし、ユーザビリティに優れたシステムやアプリケーションツールを独自に開発し、様々な業務課題を解決する金融システムソリューションを提案しております。
                      - paragraph [ref=e1220]: さらに、金融業界で高評価を獲得したノウハウで金融ドキュメントのみならず、「広告」「販促資料」のデザイン、「動画」「ノベルティ」の販促ツール企画・制作、「Webコンテンツ」「アプリ開発」など、ニーズやターゲットにあったマーケティング支援を行っております。
                      - paragraph [ref=e1221]
                      - paragraph [ref=e1222]: 4 ITソリューション事業
                      - paragraph [ref=e1223]: ITソリューション事業では、金融機関や事業会社及びシステムインテグレータなどに対して下記サービスを展開しております。
                      - paragraph [ref=e1224]: 以下、各サービスについて説明いたします。
                      - paragraph [ref=e1225]: (1) 金融ソリューション
                      - paragraph [ref=e1226]: オープンシステムと最新のソフトウエア開発技術(オブジェクト指向やSOA等)を最適に組み合わせ、顧客要望に合わせた金融機関向けITシステムを、構築または運用構築支援を提供しております。
                      - paragraph [ref=e1227]
                      - paragraph [ref=e1228]: (2) ビジネスソリューション
                      - paragraph [ref=e1229]: 企業経営を支える基幹業務アプリケーション(販売管理、在庫管理、財務管理、生産管理等)の設計、開発、導入、移行サービスに関わるソリューションを提供しております。
                      - paragraph [ref=e1230]
                      - paragraph [ref=e1231]
                      - paragraph [ref=e1232]: (3) マイグレーションサービス
                      - paragraph [ref=e1233]: マイグレーションとはシステムの機能を維持しながらプログラミング言語の置き換えを行う手法であり、VisualBasic6.0からVisualBasic.NET、もしくはVisualBasicからJavaへのマイグレーションサービスを提供しております。OS変更に伴い現在のプログラミング言語では問題が生じる場合や、社内システムの言語統一を考えている顧客に対して、現状のシステムを新たに開発するのに比べ、安価かつ短時間でシステム移行が行えるサービスを提供しております。
                      - paragraph [ref=e1234]
                      - paragraph [ref=e1235]: 5 ランゲージソリューション事業
                      - paragraph [ref=e1236]: ランゲージソリューション事業では、グローバル企業に対して下記サービスを展開しております。
                      - paragraph [ref=e1237]: 翻訳・通訳サービス
                      - paragraph [ref=e1238]: グローバル化に伴い人的交流が活発になる中、グループ各社では精度の高い翻訳・通訳サービスを提供しております。「業界」、「各国言語」を熟知した経験豊富なスタッフが各社合わせて9,000名以上登録されており、IT、金融、メーカー、サービス、アパレルと多岐に亘る業界において実績を積み重ねてきました。
                      - paragraph [ref=e1239]: 翻訳サービスでは、顧客から原稿を預り、翻訳・チェック・レイアウト調整を行い納品しております。文章の翻訳以外では、動画の翻訳や字幕の挿入など幅広く対応しております。また、マーケティング資料や投資家向けの冊子など、AIが翻訳しづらい原文の行間を読んだような翻訳に強みを持っております。
                      - paragraph [ref=e1240]: 通訳サービスでは、様々な業務・職種に精通したフリーランス通訳者を多数揃え、お客様のご要望に応じ適切な通訳者とのマッチングを行い、迅速かつより高品質な通訳サービスを提供しております。近年、注目を集めるアジア・ASEAN諸国の言語に関する翻訳・通訳の多言語化にも積極的に取り組んでおります。
                      - paragraph [ref=e1241]
