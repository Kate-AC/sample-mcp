                      - paragraph [ref=e1026]
                      - heading "3 【事業の内容】" [level=3] [ref=e1027]
                      - paragraph [ref=e1028]: 当社グループは、クニミネ工業株式会社(当社)および子会社6社により構成されており、事業はベントナイト原鉱石の採掘、ベントナイトの製造、販売、農薬加工および化成品の製造販売を行っているほか、粘土鉱物、調泥剤の仕入販売、サービス部門として運送取扱い業務や各種研究・分析業務を営んでおります。
                      - paragraph [ref=e1029]: 当社グループの事業内容および当社と関係会社の当該事業に係る位置付けは次のとおりであります。
                      - paragraph [ref=e1030]: なお、当連結会計年度より、当社組織変更に伴い、報告セグメントを従来の「ベントナイト事業」、「クレイサイエンス事業」の2区分の内、「クレイサイエンス事業」の区分に属していたアグリビジネス分野を「アグリ事業」として独立したセグメントへ変更しております。
                      - paragraph [ref=e1031]: 次の3部門は「第5 経理の状況1.(1) 連結財務諸表注記事項」に掲げるセグメントの区分と同一であります。
                      - heading "(1) ベントナイト事業" [level=4] [ref=e1032]
                      - paragraph [ref=e1033]: ベントナイト事業は、素形材用、環境建設用、ペット用トイレ砂等の製造販売であり、他に調泥剤の仕入販売があります。クニマイン株式会社、川崎鉱業株式会社および関ベン鉱業株式会社は、ベントナイト原鉱石の採掘、販売をしております。当社は、素形材用、環境建設用、ペット用トイレ砂等の製造販売の他、調泥剤の仕入販売および各種研究・分析を行っております。クニミネマーケティング株式会社は、主にペット用トイレ砂のベントナイトを仕入販売しております。KUNIMINE(THAILAND)CO.,LTD.は、主に素形材用のベントナイトを仕入販売しております。
                      - paragraph [ref=e1034]: TRANS WORLD PROSPECT CORPORATIONはベントナイト採掘会社に出資しているためベントナイト事業に含めております。
                      - heading "(2) クレイサイエンス事業" [level=4] [ref=e1035]
                      - paragraph [ref=e1036]: クレイサイエンス事業は当社が精製ベントナイト、環境保全処理剤、環境改良剤、飼料添加物等を製造販売しております。
                      - heading "(3) アグリ事業" [level=4] [ref=e1037]
                      - paragraph [ref=e1038]: アグリ事業は、当社が農薬加工、農薬基剤および農薬加工用原材料、農業資材等の製造、加工、販売および運送取扱いを行っております。
