                      - heading "3【事業の内容】" [level=3] [ref=e833]
                      - paragraph [ref=e834]: 当社グループは、当社(株式会社タクミナ)及び子会社2社、関連会社1社により構成されており、主に高性能ソリューションポンプ、汎用型薬液注入ポンプ、ケミカル移送ポンプ、計測機器・装置、流体機器、ケミカルタンクの製造及び販売を行っており、環境保全、水処理、ケミカル、電子材料、滅菌、食品、医薬などの分野で使用されております。
                      - paragraph [ref=e835]: <高性能ソリューションポンプ>
                      - paragraph [ref=e836]: スムーズフローポンプ、スムーズフローポンプ応用装置等
                      - paragraph [ref=e837]: (注)高性能ソリューションポンプとは、様々なニーズに対応し各顧客の仕様にカスタマイズされたポンプであります。高性能ソリューションポンプは、高精密等速度カムによって複数のダイヤフラム(隔膜)の動きを精密に制御し、無脈動、定量、高精度な送液を実現しております。
                      - paragraph [ref=e838]: <汎用型薬液注入ポンプ>
                      - paragraph [ref=e839]: ソレノイド駆動定量ポンプ、モータ駆動定量ポンプ等
                      - paragraph [ref=e840]: (注)汎用型薬液注入ポンプとは、ダイヤフラム(隔膜)やプランジャ(ピストン)が往復運動することによって、液体を吸い込み、吐出する方式のポンプであります。
                      - paragraph [ref=e841]: <ケミカル移送ポンプ>
                      - paragraph [ref=e842]: ムンシュポンプ(高耐食ポンプ)、エア駆動ダイヤフラムポンプ、チューブポンプ、マグネットポンプ等
                      - paragraph [ref=e843]: (注)ケミカル移送ポンプとは、薬品・原料等を短時間で大量に移送するポンプであります。
                      - paragraph [ref=e844]: <計測機器・装置>
                      - paragraph [ref=e845]: pH計、残留塩素計、自動塩素滅菌装置、pH制御装置、サラファイン(弱酸性次亜水生成装置)等
                      - paragraph [ref=e846]: <流体機器>
                      - paragraph [ref=e847]: 連続混合装置、スタティックミキサー(静止型混合器)、攪拌機等
                      - paragraph [ref=e848]: (注)流体機器とは、各種ポンプの周辺機器、装置及び静止型混合器やその応用製品等であります。
                      - paragraph [ref=e849]: <ケミカルタンク>
                      - paragraph [ref=e850]: PEタンク、PVCタンク
                      - paragraph [ref=e851]: <その他>
                      - paragraph [ref=e852]: 保守・メンテナンス、その他(レストラン、ホテル、フィットネス)等
                      - paragraph [ref=e853]: 当社グループでは、仕入先より原材料及び部品の調達を行い、生産部門(工場)にて加工、組立、塗装等の工程を経て出荷検査を実施した後に得意先へと出荷しております。
                      - paragraph [ref=e854]: 以上に記載した事項を事業系統図によって示すと次のとおりであります。
