                      - heading "3 【事業の内容】" [level=3] [ref=e1013]
                      - paragraph [ref=e1014]: 当社の企業集団は、当社及び連結子会社1社、関連会社2社で構成され、LPG容器用バルブ・高圧ガス容器用バルブ及び設備弁・配管用バルブの製造及び販売を行っており、当社グループの主な事業内容と当該事業における位置付け及びセグメントとの関連は次のとおりであります。
                      - paragraph [ref=e1015]:
                        - text: 1.バルブ事業
                        - text: LPG容器用バルブ・高圧ガス容器用バルブ及び設備弁関連
                      - paragraph [ref=e1016]:
                        - text: 当社は、LPG容器用バルブ・高圧ガス容器用バルブ及び設備弁を製造販売しております。関連会社北陸ハマイ
                        - text: 株式会社は北陸地区の代理店として、当社の製品を販売しております。
                        - text: また、子会社株式会社ハマイコリアは韓国市場における拠点として高圧ガス容器用バルブを製造販売し、当社の高圧ガス容器用バルブについても販売しております。
                      - paragraph [ref=e1017]: 配管用バルブ関連
                      - paragraph [ref=e1018]: 当社が製造販売するほか、北陸ハマイ株式会社は北陸地区の代理店として、当社の配管用バルブ等を販売しております。
                      - paragraph [ref=e1019]: また、子会社株式会社ハマイコリアにおいても韓国市場における拠点として、当社の配管用バルブ等を販売しております。
                      - paragraph [ref=e1020]
                      - paragraph [ref=e1021]: なお、四国地区の代理店として当社の製品を販売しておりました関連会社四国ハマイ株式会社につきましては、2023年1月31日付で当社が全事業を譲受けました。
                      - paragraph [ref=e1022]
                      - paragraph [ref=e1023]: 2.不動産賃貸事業
                      - paragraph [ref=e1024]: 当社は、バルブ事業の他、店舗用ビル、老人ホーム施設等の不動産賃貸事業を行っております。
