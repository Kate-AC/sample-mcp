                      - heading "3【事業の内容】" [level=3] [ref=e1039]
                      - paragraph [ref=e1040]: 当社グループは、当社、連結子会社6社で構成されており「デジタルコンテンツ事業」「アミューズメント事業」「音楽映像事業」を主たる事業としております。
                      - paragraph [ref=e1041]: 当社グループの主な事業内容と、当社グループを構成している関係会社の位置付けは次のとおりであります。
                      - paragraph [ref=e1042]
                      - paragraph [ref=e1043]: (1)デジタルコンテンツ事業
                      - paragraph [ref=e1044]: デジタルコンテンツ事業においては、当社グループが発売元となる家庭用ゲーム機、スマートフォン、PC、モバイル等に向けたゲームコンテンツの企画・開発・販売・サービス運営を行っています。加えて、蓄積された高度な開発技術を背景に、業界他社がリリースするゲームコンテンツの開発受託を行っています。
                      - paragraph [ref=e1045]: 〔関係会社〕
                      - paragraph [ref=e1046]: Marvelous USA, Inc.(連結子会社)、Marvelous Europe Limited(連結子会社)、株式会社ジー・モード(連結子会社)、株式会社HONEY PARADE GAMES(連結子会社)、株式会社グルーブシンク(連結子会社)
                      - paragraph [ref=e1047]
                      - paragraph [ref=e1048]: (2)アミューズメント事業
                      - paragraph [ref=e1049]: アミューズメント事業においては、アミューズメント施設運営会社向けに、業務用機器や商品の企画・開発・販売を行っており、強力なIPとのアライアンスを推進するほか、オリジナルゲーム機の企画・開発にも注力しています。
                      - paragraph [ref=e1050]: 〔関係会社〕
                      - paragraph [ref=e1051]: Marvelous USA, Inc.(連結子会社)、Marvelous APAC Pte. Ltd.(連結子会社)
                      - paragraph [ref=e1052]
                      - paragraph [ref=e1053]: (3)音楽映像事業
                      - paragraph [ref=e1054]: 音楽映像事業においては、アニメーションを中心とした音楽・映像コンテンツの制作・プロデュースを行い、音楽・映像商品化から、配信ビジネスやキャラクター商品化といった二次利用へのマルチユース展開を積極的に行っています。加えて、漫画やアニメーション、ゲームの人気作品を原作にした舞台興行作品の制作・プロデュースにより興行ビジネスを手掛け、ライブエンターテイメントと音楽・映像との融合を図り、コンテンツの多面的な展開を推進しています。
                      - paragraph [ref=e1055]
                      - paragraph [ref=e1056]: 〔事業系統図〕
                      - paragraph [ref=e1057]: 以上述べた事項を事業系統図によって示すと次のとおりであります。
