                      - paragraph [ref=e1013]:
                        - text: 当社は、持株会社であるスターツコーポレーション株式会社を親会社とする企業グループ88社に属しており、スターツグループのメディア部門の位置づけとして出版やインターネット事業を営んでおります。他のグループ会社において主なものはスターツCAM株式会社が建設業、スターツピタットハウス株式会社、スターツコーポレートサービス株式会社が不動産仲介業、スターツデベロップメント株式会社が不動産分譲事業を営んでおります。他にスターツアメニティー株式会社が不動産管理業、スターツホーム株式会社が戸建建築業、スターツ商事株式会社が物販・飲食業、株式会社ウィーブが情報システム事業、株式会社スターツツーリストが旅行業、スターツ証券株式会社が証券業、スターツホテル開発株式会社がホテルの開発・運営事業を営んでおります。その他にも介護事業を行っているスターツケアサービス株式会社や市場調査・コンサルティング事業を行っている株式会社スターツ総合研究所などが国内に存在し、海外にはハワイやジャカルタなどで不動産及び不動産管理業を営んでおります。
                        - text: また、ピタットハウスネットワーク株式会社が不動産店舗のフランチャイズ事業を行っております。
                        - text: 当社とスターツコーポレーション株式会社は、事業上の営業取引をしております。また当社はスターツグループ各社からも印刷物等の制作を請け負っております。
