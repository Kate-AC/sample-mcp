                      - paragraph [ref=e999]
                      - heading "3 【事業の内容】" [level=3] [ref=e1000]
                      - paragraph [ref=e1001]: 当社グループの主な事業は、日本国内の上場会社のディスクロージャー関連事業と、日本国内および米国を中心とした通訳・翻訳事業です。
                      - paragraph [ref=e1002]: 具体的には、ディスクロージャー関連事業は、株式上場申請書類などのIPO(新規上場)関連サービスから、金融商品取引法や投資信託法関連サービス、株主総会招集通知などの会社法関連サービスに加え、IR(インベスター・リレーションズ)、事業報告書や株主通信などのSR(シェアホルダー・リレーションズ)、統合報告書やCSR報告書などのESGといった任意開示関連サービスを手掛けるとともに、国内企業の海外投資家向けIR支援サービスを提供しております。
                      - paragraph [ref=e1003]: 通訳・翻訳事業では、国際会議やイベント、シンポジウム等における通訳サービスのほか、一般的な翻訳サービスに加えて欧米企業が日本でサービスを提供する際の読み手への高い訴求力が求められるローカライズやトランスクリエーション(マーケティング/クリエイティブ色の強い翻訳)サービスも提供しております。
                      - paragraph [ref=e1004]
                      - paragraph [ref=e1005]: 当社グループ(当社及び当社の関係会社)は、当社と子会社20社の計21社で構成され、当社グループの事業分野は、「ディスクロージャー関連事業」、「通訳・翻訳事業」の2つのセグメント区分としております。
                      - paragraph [ref=e1006]: また、「ディスクロージャー関連事業」については、主に制度開示関連の「金融商品取引法関連製品」「会社法関連製品」、任意開示関連の「IR関連製品」「その他製品」の4つに区分しています。
                      - paragraph [ref=e1007]: その主要製品は、ディスクロージャー関連書類の制作印刷物であり、それらに付帯するWizLaboをはじめとする各種書類作成支援ツールの企画制作販売、コンサルティングおよびその他のサービス等の提供を行っております。
