                      - heading "3【事業の内容】" [level=3] [ref=e894]
                      - paragraph [ref=e895]: 当社の事業につきましては、信頼性評価事業、微細加工事業及びその他事業の3つの柱で構成されております。
                      - paragraph [ref=e896]: 当社及び当社の関係会社の事業に係る位置付け及びセグメントとの関連は、次のとおりであります。なお、以下に示す区分は、セグメントと同一の区分であります。
                      - paragraph [ref=e897]: また、当事業年度より報告セグメントの区分を変更しております。詳細は、「第5 経理の状況 1 財務諸表等 (1)財務諸表 注記事項(セグメント情報等)」に記載のとおりであります。
                      - paragraph [ref=e898]
                      - paragraph [ref=e899]: (信頼性評価事業)
                      - paragraph [ref=e900]: 当事業においては、電子部品等に対する環境試験、電気試験、パワーサイクル試験等からなる信頼性評価試験、分析・故障解析、分析及びその前工程となる試料作製のための断面研磨、試験装置の設計、製造、販売等を行っております。
                      - paragraph [ref=e901]: 単なる解析業務にとどまらず、故障や不良の真因を見つけ出すための再現実験を行い、顧客の技術課題を根本から解決できる会社を志向し、企画提案力と技術力を融合した技術営業体制を構築しております。また、近年では受託試験を通じて蓄積した技術・ノウハウを活かしたパワー半導体の信頼性評価装置の開発・販売にも積極的に取組んでおります。
                      - paragraph [ref=e902]: 当社では電気自動車の開発・普及が急速に拡大すると予測される以前から電気自動車の基幹部品であるインバータの中のパワー半導体の信頼性評価試験や故障解析に取組み、実績を積み上げてきました。電子回路、ソフトウエア、水冷機構などの試験環境を自社内で開発できることから、顧客の多種多様なニーズに対応してまいりました。また、信頼性評価試験の前後において、部品や基板の実装部の解析や評価、改善提案までトータルで対応できることで、パワー半導体の信頼性評価試験において強みを有しております。
                      - paragraph [ref=e903]: 近年では、信頼性評価試験を実施するだけでなく、国際規格に基づく試験の実施から規格認証の取得まで、トータルに対応できる体制を構築しております。現在では、IPC(米国電子回路協会)やJEITA(電子情報技術産業協会)に参画し、信頼性評価試験の規格を策定する、いわゆるルールメーカーとしての活動にも力を入れております。
                      - paragraph [ref=e904]: 当事業では、顧客より試験や検査、分析、解析、加工、機器販売の役務提供の対価として収益を得ております。
                      - paragraph [ref=e905]
                      - paragraph [ref=e906]: (微細加工事業)
                      - paragraph [ref=e907]: 当事業においては、ビルドアップ基板やフレキシブルプリント基板(薄く柔らかい屈曲可能な基板)等に対する試作及び、それらの量産レーザ加工や新しい材料や最先端の材料への表面加工処理の条件出しから試作まで請け負っている表面処理技術を行っております。
                      - paragraph [ref=e908]: スマートフォンから医療機器まで、あらゆる製品領域において、ジャンルを問わない幅広い対応力で顧客のニーズに対応してまいりました。また、顧客の要望に応えるために必要な設備を揃えることで電子部品業界の技術的なニーズに応える体制を整えてまいりました。
                      - paragraph [ref=e909]: 温湿度などの少しの環境変化で加工の仕上がりに影響が出たり、設備ごとの個体差があるなど管理が非常に難しいレーザ加工機を自社では持たずアウトソーシングする基板メーカーに対して、大ロットの量産加工から新材料のレーザ加工性評価や極短納期の試作品加工まで、多様な依頼に柔軟に対応できることが当社の強みであり、20年以上の長きに亘って事業を継続できている理由であると考えております。また、近年ではガラス基板や低誘電材など、レーザ加工が困難とされてきた素材に対しての加工やその評価を行っており、微細加工の特殊技術力を強化しております。
                      - paragraph [ref=e910]: 当事業では、顧客より加工の役務提供の対価として収益を得ております。
                      - paragraph [ref=e911]
                      - paragraph [ref=e912]: (その他事業)
                      - paragraph [ref=e913]: 当事業においては、バイオ医薬品の製造工程に使用される製品(包装材料、シリンジなど)の受託試験を行うバイオ、品質コンサルティングや技術指導を行うゼロ・イノベーションによる指導を行っております。
                      - paragraph [ref=e914]: 顧客が開発する製品は、高品質かつ高い信頼性を求められており、その実現に向けて素材等の改善提案をしております。そのために当社は、基礎実験や再現実験を繰り返し、ノウハウとデータの蓄積を地道に行ってまいりました。
                      - paragraph [ref=e915]: 当事業では、検査や指導の役務提供の対価として収益を得ております。
                      - paragraph [ref=e916]
                      - paragraph [ref=e917]
                      - paragraph [ref=e918]: これらの事業に加えて研究開発部門を有しており、「オートモーティブとエネルギー」をキーワードにパワー半導体の実装関連、電池関連の信頼性についての研究開発を行っております。
                      - paragraph [ref=e919]: ・パワー半導体実装に関する研究
                      - paragraph [ref=e920]: 市場が拡大しているパワー半導体について、当社はパワー半導体の信頼性評価試験であるパワーサイクル試験受託市場での実績を持っております。その実績を活かし、当社の得意とする実装技術との融合による高信頼性品質を提供するために、次の研究開発に取組んでおります。
                      - paragraph [ref=e921]: 1)パワー半導体の接合不具合要因となる、ボイド/クラック現象の進展予測技術の研究
                      - paragraph [ref=e922]: 2)はんだ接合部などのボイド/クラックについてX線画像をもとにした画像解析ソフトの開発
                      - paragraph [ref=e923]: 3)はんだ接合部に関連する信頼性試験時間の短縮化に向けた研究
                      - paragraph [ref=e924]: 4)高温接合に適した焼結材料の評価技術の開発
                      - paragraph [ref=e925]: ・電池に関する研究
                      - paragraph [ref=e926]: 自動車をはじめ様々な電子機器やインフラ設備において、電池は重要な基幹製品となっています。当社では、長年に亘る水系電解液の研究開発で培ってきた電気化学に関する技術知見を電池の品質解析に活かすべく、キャパシタへの技術応用の試み、あるいは電池の性能判定に必要な特徴的な電気特性の抽出の研究を進めてまいりました。その実績を活かし、高度化する電池特性に関する顧客ニーズにお応えすべく、次の研究に取組んでおります。
                      - paragraph [ref=e927]: 1)液系や固体系に関わらず、電池性能試験の基本のひとつとして提唱するインピーダンス特性の測定方法確立
                      - paragraph [ref=e928]: 2)インピーダンス測定の知見を活かした、電池の寿命予測技術の開発
                      - paragraph [ref=e929]: 3)多価金属二次電池材料、フッ化物固体二次電池材料の合成、解析を通し、電池としての品質維持に必要な技術要素の抽出及び性能評価法確立
                      - paragraph [ref=e930]
                      - paragraph [ref=e931]: 事業の系統図は、次のとおりであります。
