                    - generic [ref=e731]:
                      - heading "3 【事業の内容】" [level=3] [ref=e732]
                      - paragraph [ref=e733]: 当社グループは、「PRODUCE NEXT ~しあわせな未来を、共に拓く。~」をMISSIONとして、幅広い領域における総合コンサルティング事業を展開しております。
                      - paragraph [ref=e734]: 当社のコンサルティング事業では、単に報告書を提出することから脱却し、顧客に伴走しながらHands-onで顧客課題の解決にコミットするコンサルティングサービスを展開しております(Hands-on Style)。また、プロジェクトの中で日々変わっていく課題に対応するために、あえて明確なスコープを設定せず(Scopeless(注1))、本質的な課題に取り組む形でのコンサルティング契約を基本としております。また、コンサルティングの結果として膨大な時間をかけて報告書を作成するのではなく、実行支援に注力することで顧客の真の成果を生み出すことを重要視しております(More than Reports)。具体的には、戦略策定段階においては、PoC(Proof of Concept:概念実証)や実行支援を見据えた構想策定と具体的なサービス提案を行います。実行段階においては、Scopelessで各課題への対応を行い、顧客自身が自ら事業を推進できるようになるまで伴走支援をしております。
                      - paragraph [ref=e735]: さらに、当社は、優秀な人材を厳選して採用しており、各分野の専門知識と豊富な経験を持つプロフェッショナルがコンサルティングサービスを提供しております(Professionals)。このように、当社独自の4つの手法を用いて、顧客に寄り添った高品質なコンサルティングサービスを提供しております。
                      - paragraph [ref=e736]
                      - paragraph [ref=e737]: (当社の特徴)
                      - paragraph [ref=e739]: （画像は省略されました）
                      - paragraph [ref=e740]
                      - paragraph [ref=e741]: 当社は、高品質なコンサルティングサービスの提供を行うためには、コンサルタントの採用及び育成が重要と考えております。そのため、優秀な人材の採用に加え、体系だった研修カリキュラムによるOff-JTの環境と手厚いOJT体制により早期戦力化する仕組み・環境を構築しております。
                      - paragraph [ref=e742]: また、当社の特徴として、特定の領域に限定することなく業界やサービス領域を超えてプロジェクトにアサインされる「One Pool制」と、「One Pool制」の組織を維持しながらも、System TransformationやGreen Transformation、Health Care等、クライアントからのニーズが高いテーマの研究開発、営業等を行う「プラクティス」を併用しています。そのため、コンサルタントは様々な領域の経験を積みながら、専門的な知識を身につけることが可能です。
                      - paragraph [ref=e743]: 加えて、当社は、マネージャー以下について原則1人1顧客を受け持つ仕組みとしているため、案件が終了してもすぐに次の案件にアサインすることが可能であり、アイドルタイムが生じない仕組みを構築しています。結果として高い稼働率(注2)を実現することが出来、売上高の最大化を追求することが出来ます。
                      - paragraph [ref=e744]: また、高い給与水準等により従業員への還元を実施することで、モチベーションの維持・向上をしながらも、徹底的な間接コストの管理(管理部門の業務について、システム、自動化ツール、マクロ等を用いて効率化を図ること等)を行うことで、営業利益の最大化にも努めています。
                      - paragraph [ref=e745]
                      - paragraph [ref=e746]: (注) 1.「Scopeless」は、契約時に設定していた業務範囲を顧客の要請に応じて柔軟に変更するということを意味しております。
                      - paragraph [ref=e747]: 2.稼働率の定義・計算方法については、「第2 事業の状況 1 経営方針、経営環境及び対処すべき課題等 (2) 経営環境、経営戦略 3経営上の目標の達成状況を判断するための客観的な指標等」をご参照ください。
                      - paragraph [ref=e748]
                      - paragraph [ref=e749]: (柔軟な組織形態と仕組み)
                      - paragraph [ref=e751]: （画像は省略されました）
                      - paragraph [ref=e752]
                      - paragraph [ref=e753]: 当社は、コンサルティング事業の単一セグメントであるためセグメント別の記載はしておりませんが、サービスラインを整理すると以下のとおりであります。
                      - paragraph [ref=e754]: また、当社は、業界・領域を絞らずご支援させて頂いておりますが、テーマとしては特に以下図表に記載のプラクティステーマに注力しております。
                      - paragraph [ref=e755]
                      - paragraph [ref=e756]: (サービスライン)
                      - paragraph [ref=e758]: （画像は省略されました）
                      - paragraph [ref=e759]
                      - paragraph [ref=e760]: (プラクティスの詳細)
                      - paragraph [ref=e762]: （画像は省略されました）
                      - paragraph [ref=e763]
                      - paragraph [ref=e764]: また、当社コンサルティング事業の成長には、内部の人材だけでなく、外部人材も活用することが必要であると考えております。当社の事業成長及びMISSIONである「PRODUCE NEXT ~しあわせな未来を、共に拓く。~」を実現するために、当社の子会社である株式会社ライズ・クロスは、協力会社プラットフォームを運営し、長期パートナーとしてご活躍いただけるコンサルタントの確保を行っております。当該取組みにより外部パートナー活用による外注売上高は、2024年2月期(601,699千円)から2025年2月期(953,891千円)となり、内部人材のみでは機会損失となっていた案件の受注を実現し、リソース不足の解消に寄与しております。
                      - paragraph [ref=e765]
                      - paragraph [ref=e766]: なお、事業の系統図は、次のとおりであります。
