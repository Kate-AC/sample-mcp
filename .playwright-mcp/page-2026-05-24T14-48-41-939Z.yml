                      - heading "3【事業の内容】" [level=3] [ref=e985]
                      - paragraph [ref=e986]: (1)当社グループの事業の内容について
                      - paragraph [ref=e987]: 当社グループは、当社と子会社3社(連結子会社3社:コーア商事株式会社、コーアイセイ株式会社、コーアバイオテックベイ株式会社)で構成されており、原薬の仕入販売、製剤(医療用医薬品・一般用医薬品)の製造販売及び仕入販売、製剤に係る受託製造を主な事業としております。
                      - paragraph [ref=e988]: なお、次の2事業部門は「第5 経理の状況 1 連結財務諸表等 (1)連結財務諸表 注記事項」に掲げるセグメントの区分と同一であります。
                      - paragraph [ref=e989]
                      - paragraph [ref=e990]: <当社の主な事業部門>
                      - paragraph [ref=e991]: 原薬販売事業
                      - paragraph [ref=e992]: ...原薬とは医薬品(注1)を製造するための原材料(医薬品原料)であり、コーア商事株式会社は主にその輸入販売を行っております。
                      - paragraph [ref=e993]: 医薬品製造販売事業
                      - paragraph [ref=e994]: ...コーアイセイ株式会社及びコーアバイオテックベイ株式会社は、医療用医薬品(注2)や
                      - paragraph [ref=e995]: 一般用医薬品(注3)の製造販売、仕入販売及び受託製造を行っております。
                      - paragraph [ref=e996]
                      - paragraph [ref=e997]: (注1) 医薬品(薬)とは、化学物質が生体に作用する性質を、人間や動物の病気を治すための道具として利用したものであり、原薬とは、このような性質を持っている化学物質自体のことであります。原薬は少量で高い薬理効果を示す場合が多いものの、この少量の原薬だけを正確に服用することはまず不可能なため、これらに乳糖やでん粉などの添加剤を加えて溶け易く、又は吸収しやすく、あるいは使いやすい量・嵩にすることによって、その化学物質が最も有効に働きやすい形に加工されます。この加工されたものは製剤(錠剤や顆粒剤等)と呼ばれ、これらに必要な包装や表示がなされると、医薬品(薬)となります。
                      - paragraph [ref=e998]: (注2) 医療用医薬品とは、病院等で医師の診察を受けた後、薬局で受け取る医薬品であります。医師が患者さん一人ひとりの病気やけがの程度、医薬品に対する感受性等を診断して処方せんを発行し、それをもとに薬局の薬剤師が調剤します。
                      - paragraph [ref=e999]: 医療用医薬品は、大別して新薬(先発品)とジェネリック医薬品(後発品)に分けられます。
                      - paragraph [ref=e1000]: 新薬は、化合物の特定・薬理活性(薬理効果)の特定動物による毒性の確認などの基礎データから、人による有効性・安全性のデータ、さらには有用性のデータを揃えて申請し、承認・許可・発売に至るまでに多額の費用と十数年の歳月を要します。
                      - paragraph [ref=e1001]: 一方、ジェネリック医薬品は、新薬の特許が切れた後に他の製薬会社が承認・許可を得て製品化でき、同じ有効成分、同等の効き目、安全性をもち、研究開発費が少額ですむため、薬価が新薬より低く設定されております。
                      - paragraph [ref=e1002]: (注3) 一般用医薬品とは、かぜ薬や胃腸薬等、薬局やドラッグストアで市販されている医薬品です。薬局のカウンター越しに購入できることから「OTC医薬品」とも呼ばれている一般用医薬品は、消費者の判断で購入・使用できるため、有効性とともに、より一層高い安全性に配慮されております。
                      - paragraph [ref=e1003]
                      - paragraph [ref=e1004]: (2)当社グループの事業の特徴
                      - paragraph [ref=e1005]: 1 医薬品業界における当社グループの位置づけ
                      - paragraph [ref=e1006]: 当社グループは顧客にとって付加価値の高い、高品質で安価な輸入原薬を提供することを主眼において、医薬品原料である原薬の輸入販売を行っております。更に顧客の要望に応えるため、製剤の製造・販売も行い、原薬から製剤までの一貫した製造が可能な体制のもと、国内外の医薬品メーカーと幅広く取引を行っております。また、自社開発品の製造・販売を積極的に行っており、ジェネリック医薬品を中心に医薬品業界における多様なニーズに対応できる事業展開を行っております。
                      - paragraph [ref=e1007]
                      - paragraph [ref=e1008]: 2 事業の体制
                      - paragraph [ref=e1009]: 原薬販売事業
                      - paragraph [ref=e1010]: 当社グループは設立以来、「ジェネリックのベストパートナー」となるために顧客が安心して使用できる付加価値の高い、高品質で安価な輸入原薬を安定して供給してまいりました。ジェネリック医薬品については、特許が切れていること、ジェネリックメーカー(ジェネリック医薬品の製造販売業者)として、幅広いジェネリック医薬品を効率的に取り揃える必要性等から、原薬を自社で製造せず、他社から購入することが一般的であります。
                      - paragraph [ref=e1011]: このような医薬品業界の原薬に対する方針により、当社グループはジェネリックメーカーを中心に原薬を供給しております。
                      - paragraph [ref=e1012]: 当社グループの強みとして主にジェネリック医薬品の原薬の輸入、販売を行っている商社でありながら、自社で分析機能を有しており、既に取引をさせて頂いている商品を安定的に提供することはもとより、顧客の研究開発段階からの提案・支援活動を実施しております。具体的には新規開発品目に関して、市場性の調査、規格の立案及びコンセプトの作成、並びに選定業務を行っております。また、採用が決定した新規開発品目については、社内各部署で協力して承認を取得する必要がありますので、開発スケジュールや品目情報を一元的に管理し、情報の共有化を図っております。
                      - paragraph [ref=e1013]: さらには原薬の新たな合成法や精製法を検討し、原薬メーカーに対して品質改善の提案や新規製法の技術提供を行い、高品質で安価な原薬を安定的に提供するための技術的なサポート業務を行っております。
                      - paragraph [ref=e1014]
                      - paragraph [ref=e1015]: 医薬品製造販売事業
                      - paragraph [ref=e1016]: 国内大手メーカー等からの受託製造を積極的に行っており、またジェネリック医薬品市場の拡大に対応するため、ジェネリック医薬品の開発・製造も行っております。
                      - paragraph [ref=e1017]: 当社グループでは、日本国内のGMP(医薬品の製造管理及び品質管理に関する基準)の要求する基準を充足し、医薬品の製造において最も重要視される品質管理能力を高めることで顧客からの信頼を獲得するとともに、高度な技術と投資が必要な高薬理活性注射剤の生産設備を保有することで、当社グループ独自の分野の受託製造を行うことが可能になっております。
                      - paragraph [ref=e1018]
                      - paragraph [ref=e1019]: なお、当社は、有価証券の取引等の規制に関する内閣府令第49条第2項に規定する特定上場会社等に該当しており、これにより、インサイダー取引規制の重要事実の軽微基準については連結ベースの数値に基づいて判断することとなります。
                      - paragraph [ref=e1020]
