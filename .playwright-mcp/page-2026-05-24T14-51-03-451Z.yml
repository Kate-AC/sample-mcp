                    - generic [ref=e824]:
                      - heading "3【事業の内容】" [level=3] [ref=e825]
                      - paragraph [ref=e826]:
                        - text: 当社グループは、当社、連結子会社12社及び持分法適用関連会社1社の計14社で構成されており、事業のセグメントは物流事業であります。
                        - text: その主な事業内容と当該事業に係わる位置づけは次のとおりであります。なお、当社は一般貨物自動車運送事業以外のすべての事業を担当しております。
                      - paragraph [ref=e827]: (港湾運送事業)
                      - paragraph [ref=e828]: 港湾運送事業法に基づいた一般港湾運送事業、港湾荷役事業、はしけ運送事業であり、港湾における貨物の受取り、もしくは引渡し業務を中心にコンテナターミナル管理運営、上屋保管、はしけ運送等を行う業務であります。連結子会社(株)コクサイ物流が、そのうち一般港湾運送事業、港湾荷役事業に、持分法適用関連会社五洋海運(株)が一般港湾運送事業に係わっております。
                      - paragraph [ref=e829]: (倉庫業)
                      - paragraph [ref=e830]: 倉庫業とは、荷主より寄託を受けた物品の倉庫における保管及びこれに附帯する荷役作業を行う事業であり、連結子会社名京倉庫(株)、ISEWAN(THAILAND)CO.,LTD.、ISEWAN U.S.A. INC.、ISEWAN EUROPE GmbH、伊勢湾(広州)国際貨運代理有限公司、ISEWAN(H.K.)LIMITED、PT.ISEWAN INDONESIA、ISEWAN DE MEXICO S.A. DE C.V.の8社が係わっております。
                      - paragraph [ref=e831]: (貨物利用運送事業)
                      - paragraph [ref=e832]: 荷主の需要に応じ船舶運航事業者、航空運送事業者、貨物自動車運送事業者の運送を利用して貨物の運送を行う事業であり、連結子会社及び持分法適用関連会社五洋海運(株)が係わっております。
                      - paragraph [ref=e833]: (通関業)
                      - paragraph [ref=e834]: 通関業とは、輸出入貨物の税関に対する通関手続きについて委託者の代理、代行を行う事業であり、連結子会社(株)コクサイ物流、ISEWAN(THAILAND)CO.,LTD.、ISEWAN U.S.A. INC.、伊勢湾(上海)国際貨運代理有限公司、台灣伊勢湾股份有限公司、PT.IS JAYA LOGISTIKの6社及び持分法適用関連会社五洋海運(株)が係わっております。
                      - paragraph [ref=e835]: (航空運送代理店業)
                      - paragraph [ref=e836]: 航空運送代理店業とは、航空会社を代理し、国際航空貨物の取扱、航空運送状の発行及びこれに附帯した業務を行う事業であり、連結子会社ISEWAN U.S.A. INC.、台灣伊勢湾股份有限公司の2社が係わっております。
                      - paragraph [ref=e837]: (梱包業)
                      - paragraph [ref=e838]: 梱包業とは、利用者の需要に応じ、主に輸出貨物の荷造梱包を行う事業であり、連結子会社 ISEWAN(THAILAND)CO.,LTD.、台灣伊勢湾股份有限公司、PT.IS JAYA LOGISTIKの3社が係わっております。
                      - paragraph [ref=e839]: (一般廃棄物及び産業廃棄物の運送並びに再生処理業)
                      - paragraph [ref=e840]: 一般廃棄物及び産業廃棄物の運送、並びに中間処理、リサイクルを行う事業であります。
                      - paragraph [ref=e841]: (一般貨物自動車運送事業)
                      - paragraph [ref=e842]: 荷主の需要に応じ、自動車を利用して貨物を運送する事業であり、連結子会社(株)コクサイ物流、ISEWAN(THAILAND)CO.,LTD.、ISEWAN U.S.A. INC.、PT.IS JAYA LOGISTIKの4社が係わっております。
                      - paragraph [ref=e843]: (その他附帯事業)
                      - paragraph [ref=e844]: 上記諸事業に関連する事業であり、連結子会社及び持分法適用関連会社五洋海運(株)が係わっております。
                      - paragraph [ref=e845]
