                      - heading "3 【事業の内容】" [level=3] [ref=e849]
                      - paragraph [ref=e850]: 当社グループは、当社と、子会社である(株)理論社及び(株)国土社の2社並びに親会社である(株)ビックカメラ(東京証券取引所プライム市場上場)で構成され、主としてBSデジタル放送事業を営んでおります。
                      - paragraph [ref=e851]: 当社は、放送法に基づく放送衛星を利用した認定基幹放送事業を営むことを主たる事業目的として設立され、BSデジタルハイビジョン放送(チャンネル:211ch、リモコンID:11)を行っており、全国無料放送による総合編成を行う放送局として、報道番組、教養番組、娯楽番組、広告、ショッピング番組、その他の番組を広く扱うことにより、広告主よりタイム収入、スポット収入及びその他収入を得ております。
                      - paragraph [ref=e852]: また、「質の高い情報を提供することで 人々に感動を与え 幸せな社会づくりに貢献します」との経営理念に基づき、これを更に具体化した、「豊かで癒される教養・娯楽番組と中立公正な報道・情報番組を発信し『価値ある時間』を約束します」を経営ビジョンと定めております。
                      - paragraph [ref=e853]: 子会社である(株)理論社及び(株)国土社の両社は、絵本、読み物、学習物といった児童書出版事業を行っております。
                      - paragraph [ref=e854]: 親会社は、主として家電製品等の販売事業を行っており、当社は親会社よりタイム収入、スポット収入及びその他収入を得ております。
                      - paragraph [ref=e855]: なお、事業の系統図は、次のとおりであります。
                      - paragraph [ref=e857]: （画像は省略されました）
                      - paragraph [ref=e858]
                      - paragraph [ref=e859]: 当社の収入区分は、次のとおりであります。
                      - paragraph [ref=e860]: タイム収入・・・・広告主に番組の放送時間枠を販売し、広告主の提供する番組及び広告主のCM(コマーシャルメッセージ)を放送いたします。
                      - paragraph [ref=e861]: スポット収入・・・広告主に番組と番組の間の時間枠等を秒単位で販売し、広告主のCM(コマーシャルメッセージ)を放送いたします。
                      - paragraph [ref=e862]: その他収入・・・・地上波ローカル局等への番組販売、番組制作による収入、製作委員会方式により製作されたアニメ作品等に係る出資配当金、番組及び関連コンテンツのインターネット配信事業、書籍の販売等であります。
