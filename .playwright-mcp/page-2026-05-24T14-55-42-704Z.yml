                    - generic [ref=e1065]:
                      - heading "3【事業の内容】" [level=3] [ref=e1066]
                      - paragraph [ref=e1067]: 当社グループ(当社、当社の子会社及び関連会社)は、北陸瓦斯(株)(当社)、子会社9社、関連会社5社で構成され、ガスの製造、供給及び販売、ガス事業に付随する受注工事及び器具販売、その他の事業を行っております。このうち、5社を連結子会社としております。
                      - paragraph [ref=e1068]: 事業の内容と当社グループ各社の当該事業に係る位置づけは次のとおりであります。
                      - paragraph [ref=e1069]: なお、次部門は、「第5 経理の状況 1 連結財務諸表等 (1)連結財務諸表 注記事項」に掲げるセグメントの区分と同一であります。
                      - paragraph [ref=e1070]
                      - paragraph [ref=e1071]: (都市ガス)
                      - paragraph [ref=e1072]:
                        - text: 北陸瓦斯(株)は、都市ガスの製造、供給、販売及びガス引用に関する受注工事、ガス器具の販売を行っております。
                        - text: 蒲原瓦斯(株)(連結子会社)は、都市ガスの供給、販売及びガス引用に関する受注工事、ガス器具の販売を行っております。
                      - paragraph [ref=e1073]: 妙高グリーンエナジー(株)(持分法適用関連会社)は、妙高市よりガス事業を譲り受けるとともに上下水道事業の包括委託を受託し、2022年4月より事業を行っております。
                      - paragraph [ref=e1074]: なお、北陸瓦斯(株)は原料の一部を北陸天然瓦斯興業(株)(連結子会社)から仕入れております。
                      - paragraph [ref=e1075]: また、北陸瓦斯(株)は北陸ガスリビングサービス(株)(連結子会社)に対し、(株)ガスサービス(非連結子会社)は蒲原瓦斯(株)に対し、ガス器具の一部を卸販売しております。
                      - paragraph [ref=e1076]: (LPG)
                      - paragraph [ref=e1077]: 北陸天然瓦斯興業(株)及び蒲原瓦斯(株)は、LPG及びLPG機器の販売、LPG配管工事並びに旧簡易ガス事業を行っております。
                      - paragraph [ref=e1078]: また、北陸天然瓦斯興業(株)は蒲原瓦斯(株)に対し、LPGの卸販売を行っております。
                      - paragraph [ref=e1079]: (ガス設備の保全・設計施工)
                      - paragraph [ref=e1080]: 北陸ガスエンジニアリング(株)(連結子会社)はガス設備の保全、設計施工業務等を行っており、北陸瓦斯(株)は保安点検等の業務を委託しております。
                      - paragraph [ref=e1081]: (住宅設備機器の販売施工)
                      - paragraph [ref=e1082]: 北陸ガスリビングサービス(株)は住宅設備機器の販売施工、検針業務等を行っており、北陸瓦斯(株)は検針等の業務を委託しております。
                      - paragraph [ref=e1083]: (土木・管工事)
                      - paragraph [ref=e1084]: 北栄建設(株)(連結子会社)はガス工事、土木工事等を行っており、北陸瓦斯(株)はガス工事の一部を発注しております。
                      - paragraph [ref=e1085]: (太陽光発電)
                      - paragraph [ref=e1086]: 北陸瓦斯(株)はメガソーラーによる発電事業を行っております。
                      - paragraph [ref=e1087]
                      - paragraph [ref=e1088]: 上記のほか、北陸不動産(株)(持分法適用関連会社)はビルの賃貸、管理を行っており、北陸瓦斯(株)は、事務所の一部を賃借しております。
                      - paragraph [ref=e1089]: また、北陸リース(株)(非連結子会社)は北陸瓦斯(株)、連結子会社各社並びに関連会社各社に、事務機器、車両等のリースを行っております。
                      - paragraph [ref=e1090]: 北陸瓦斯(株)は、北陸土地開発(株)(非連結子会社)から不動産売買の仲介を受けております。
                      - paragraph [ref=e1091]: なお、北陸瓦斯(株)は、その他の関係会社である敦井産業(株)より、工事資材の一部を仕入れているほか、ガス工事の一部を同社に発注しております。
                      - paragraph [ref=e1092]
