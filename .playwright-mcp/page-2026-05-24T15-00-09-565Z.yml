                      - heading "3【事業の内容】" [level=3] [ref=e830]
                      - paragraph [ref=e831]: 当社は、イベント制作を主な事業とし、基本事業、スポーツ事業、競争事業の各分野において企画、会場設営、演出・進行、運営等の事業活動を展開しております。
                      - paragraph [ref=e832]: 全国に展開する支店網と「顧客起点」に立ったソリューション、どんなイベントでもサポートできる「現場力」を最大限に生かし、お客さまの期待や課題に応え、イベントに関わる人々の感動と笑顔を創り続けてまいります。
                      - paragraph [ref=e833]: なお、親会社および子会社はありません。
                      - paragraph [ref=e834]: また、当社はイベント総合請負業並びにこれらの関連業務の単一事業セグメントであるため、セグメント情報の記載は省略しておりますが、下記の部門別の事業を行っております。
                      - paragraph [ref=e835]: (基本事業部門)
                      - paragraph [ref=e836]: 当部門においては、各営業拠点が担当する様々なイベント領域の制作業務等を行っております。
                      - paragraph [ref=e837]: (スポーツ事業部門)
                      - paragraph [ref=e838]: 当部門においては、中央競技団体等が開催するスポーツ・競技に関するイベント領域の制作業務等を行っております。
                      - paragraph [ref=e839]: (競争事業部門)
                      - paragraph [ref=e840]: 当部門においては、皇室ご臨席事業を中心とした全国持ち回りで開催されるイベント領域の制作業務等を行っております。
