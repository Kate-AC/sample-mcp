                      - paragraph [ref=e831]: 当社グループ(当社及び当社の関係会社)は、三協フロンテア(株)(当社)と、子会社である広州番禺三協豪施有限公司、SANKYO FRONTIER MYANMAR COMPANY LIMITED、SANKYO FRONTIER MALAYSIA SDN. BHD.、SANKYO FRONTIER TECHNOLOGIES MYANMAR COMPANY LIMITED、SANKYO FRONTIER USA INC.及び親会社である(有)和幸興産の7社で構成されております。
                      - paragraph [ref=e832]: 当社は、ユニットハウスの製造・販売・レンタルの事業を主に行っております。
                      - paragraph [ref=e833]: 子会社広州番禺三協豪施有限公司は、中国でユニットハウスの原材料の製造・販売の事業を行っております。
                      - paragraph [ref=e834]: 子会社SANKYO FRONTIER MYANMAR COMPANY LIMITEDは、ミャンマーでユニットハウスのレンタル事業及びユニットハウスの図面作成業務を行っております。
                      - paragraph [ref=e835]: 子会社SANKYO FRONTIER MALAYSIA SDN. BHD.は、マレーシアで製品開発、ユニットハウスの販売及びレンタルを行っております。
                      - paragraph [ref=e836]: 子会社SANKYO FRONTIER TECHNOLOGIES MYANMAR COMPANY LIMITEDは、ミャンマーでユニットハウスの図面作成業務、ユニットハウスの販売及びレンタルを行っております。今後はユニットハウスの生産再開を行う計画です。
                      - paragraph [ref=e837]: 子会社SANKYO FRONTIER USA INC.は、アメリカ国内でのユニットハウスの販売を主に行う計画です。
