                      - paragraph [ref=e1097]
                      - heading "3 【事業の内容】" [level=3] [ref=e1098]
                      - paragraph [ref=e1099]: 当社グループ(当社及び当社の関係会社)は、当社(いであ株式会社)、連結子会社6社、非連結子会社1社及び関連会社3社(うち持分法適用関連会社1社)により構成され、環境コンサルタント事業、建設コンサルタント事業、情報システム事業、海外事業、不動産事業を主な業務内容としております。なお、次の5事業は、「第5 経理の状況 1 連結財務諸表等(1) 連結財務諸表 注記事項」に掲げるセグメントの区分と同一であります。
                      - paragraph [ref=e1100]
                      - paragraph [ref=e1101]: (環境コンサルタント事業)
                      - paragraph [ref=e1102]: 同事業は、当社並びに連結子会社4社、非連結子会社1社及び関連会社3社が営んでいる事業であり、環境アセスメント及び環境計画部門、環境生物部門、数値解析部門、調査部門、環境化学部門、気象・沿岸部門の6部門より構成されております。
                      - paragraph [ref=e1103]: 同事業においては、港湾・空港・河川・ダム・道路・風力発電等の建設に係る環境アセスメント業務、生物多様性や希少生物の保護・保全を含めた自然再生業務、AUVを用いた海洋環境調査、AUVの研究開発や設計製作・運用支援業務、微量有害化学物質による環境汚染・土壌汚染の調査・分析・解析のほか、化学物質や医薬品の環境リスク評価業務、降雨予測業務、港湾等の津波や高潮高波対策施設の設計・耐震照査業務、農業農村整備事業に係る環境調査計画・設計業務、スマートフォン向けの気象情報配信や健康天気予報(バイオウェザー)等の気象に関連した予報業務を実施いたしました。
                      - paragraph [ref=e1104]: 同事業を主な事業とする連結子会社は、新日本環境調査株式会社、沖縄環境調査株式会社、東和環境科学株式会社及び以天安(北京)科技有限公司の4社であります。前2社は主に環境調査・分析業務を行っており、東和環境科学株式会社は、これに加えて廃棄物・土壌汚染対策業務を行っております。以天安(北京)科技有限公司は、海外事業における中国での窓口業務を行っております。
                      - paragraph [ref=e1105]: 非連結子会社であるイーアイエス・ジャパン株式会社は、環境計測機器の製造・販売及び保守を行っております。
                      - paragraph [ref=e1106]: 関連会社である次世代海洋調査株式会社は、海洋資源調査技術の実用化に関する研究・開発・調査・関連業務を行っており、中持依迪亜(北京)環境検測分析株式有限公司は、中国現地企業との合弁会社として中国での環境の化学分析業務を、UAE-IDEA Advance Analytical Company Limited は、タイ現地企業との合弁会社としてタイでの環境の化学分析業務をそれぞれ行っております。
                      - paragraph [ref=e1107]
                      - paragraph [ref=e1108]: (建設コンサルタント事業)
                      - paragraph [ref=e1109]: 同事業は、当社及び連結子会社1社が営んでいる事業であり、河川部門、水工部門、道路部門、橋梁部門の4部門より構成されております。
                      - paragraph [ref=e1110]: 同事業においては、河川、砂防、海岸等に係る計画等の業務、堤防や排水機場等の河川構造物や砂防施設に係る設計・維持管理関連等の業務、道路及び橋梁に係る計画・設計・維持管理関連・施工管理等の業務を実施いたしました。
                      - paragraph [ref=e1111]: 連結子会社である株式会社クレアテックは、構造物・地盤解析、土木設計業務を行っております。
                      - paragraph [ref=e1112]
                      - paragraph [ref=e1113]: (情報システム事業)
                      - paragraph [ref=e1114]: 同事業は、当社が営んでいる事業であります。
                      - paragraph [ref=e1115]: 同事業においては、渇水対策のためのAIによるダム低水管理支援システムの構築業務、カメラ画像解析による高度流量観測システムや土石流検知システム等のクラウドシステムの構築業務を実施いたしました。
                      - paragraph [ref=e1116]: また、カメラ画像による河川水位・流量計測システム及び土石流検知システムのAI活用による高速化やこれらシステムのクラウドサービスへの展開、さらにデジタルツインやAIを活用した各種防災関連システムの開発に加え、地球観測衛星の運用支援業務、通信会社のスマートフォンサービスの技術検証支援業務を実施いたしました。
                      - paragraph [ref=e1117]
                      - paragraph [ref=e1118]: (海外事業)
                      - paragraph [ref=e1119]: 同事業は、当社及び連結子会社1社が営んでいる事業であります。
                      - paragraph [ref=e1120]: 同事業においては、開発途上国における海洋ごみ等の廃棄物管理、水銀管理、湖沼の水質保全、海洋・沿岸環境の保全、気候変動対策としての海洋温度差発電・深層水利活用、開発事業に伴う環境社会配慮、水資源管理・洪水対策、港湾関連インフラの整備、防災能力の強化等に関する業務を実施いたしました。
                      - paragraph [ref=e1121]: 連結子会社である株式会社Idesは、開発途上国に対し港湾を中心とした交通インフラ整備及び環境保全の分野における総合コンサルティングサービスを提供しております。
                      - paragraph [ref=e1122]
                      - paragraph [ref=e1123]: (不動産事業)
                      - paragraph [ref=e1124]: 同事業は、当社が営んでいる事業であります。
                      - paragraph [ref=e1125]: 同事業においては、赤坂のオフィスビル、旧大阪支社跡地等の不動産賃貸を行っております。
