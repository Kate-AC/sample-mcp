                      - heading "3【事業の内容】" [level=3] [ref=e973]
                      - paragraph [ref=e974]: 当社グループ(当社及び当社の関係会社、以下同じ。)は、当社及び子会社5社より構成されており、自動車の販売及び修理を主たる事業としております。
                      - paragraph [ref=e975]: 当社グループの当該事業に係る位置付けは、次のとおりであります。なお、子会社のうち、(株)RSケーユーにつきましては、事業譲渡にともない2023年6月をもってハーレーダビッドソン車の販売及び修理事業を休止しているため、下記組織図に掲載しておりません。
                      - paragraph [ref=e976]: 次の2事業部門(国産車販売事業、輸入車ディーラー事業)は「第5 経理の状況 1 連結財務諸表等 (1)連結財務諸表 注記事項」に掲げるセグメントの区分と同一であります。
                      - paragraph [ref=e977]: また、当社は、有価証券の取引等の規制に関する内閣府令第49条第2項に規定する特定上場会社等に該当しており、これにより、インサイダー取引規制の重要事実の軽微基準につきましては連結ベースの数値に基づいて判断することとなります。
                      - paragraph [ref=e978]
                      - paragraph [ref=e979]: （画像は省略されました）
                      - paragraph
                      - paragraph [ref=e980]: ※1.お客様に対し、自動車の販売及び修理を行っております。また、お客様より中古車の仕入れを行っております。
                      - paragraph [ref=e981]: ※2.お客様より仕入れた中古車につきまして、品質を点検の上、小売可能な商品は、その商品を販売するのに最適なグループ内の会社に販売しております。また、自動車の修理は、適したサービス工場を有するグループ内の会社に委託をしております。
                      - paragraph [ref=e982]: ※3.主要な事業を示しております。
                      - paragraph [ref=e983]: (注)連結財務諸表提出会社は、連結子会社に対し一部の店舗を賃貸しております。また、連結財務諸表提出会社は、純粋持株会社として経営指導を行い一部の業務を受託しております。
