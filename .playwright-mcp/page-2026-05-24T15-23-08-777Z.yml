                      - heading "3 【事業の内容】" [level=3] [ref=e1110]
                      - paragraph [ref=e1111]:
                        - text: 当社の企業集団は、当社、連結子会社1社及び非連結子会社1社で構成され、当社及び連結会社は測定器具、工作用器具、機械工具、空圧・油圧器具等の販売を主な事業内容としております。
                        - text: 当社グループは、営業所単位で独立採算の営業を展開しており、営業所単位で財務情報が入手可能であり、取締役会では、経営の判断、業績の評価・検討を営業所単位で行っております。当社グループの取扱商品は測定器具・機械器具を中心に工場等で使用される機械、工具、工場用品、消耗品等を販売しております。当社の営業方針は、地域密着型の営業であり、新規の営業所開設、拡張、廃止は地域性を重視して判断・検討を行っております。また、営業戦略も地域性を重視して立案・活動を行っております。従って、個々の営業所を販売地域別に集約して報告セグメントとしております。
