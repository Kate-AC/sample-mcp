                      - heading "3【事業の内容】" [level=3] [ref=e1000]
                      - paragraph [ref=e1001]: 当社グループは当社及び連結子会社2社(マルコ株式会社、MISEL株式会社)、非連結子会社(瑪露珂爾(上海)国際貿易有限公司)の計4社で構成されており、婦人下着及びその関連事業、マタニティ及びベビー関連事業、婚礼・宴会関連事業ならびに美容関連事業などを行っております。
                      - paragraph [ref=e1002]: 婦人下着及びその関連事業においては、体型補整を目的とした婦人下着(ファンデーション、ランジェリー)、ボディケア化粧品、オーダーメイドインソール及び専用シューズ、オリジナルサプリメントや健康食品等を、全国に展開する直営店舗等及び、ECサイト(オンラインショップ)において販売を行っており、直営店舗等においては、婦人下着を用いたボディメイクなどのアフターサービスの提供により、商品提供後も引き続き顧客満足度の向上に努めております。
                      - paragraph [ref=e1003]: マタニティ及びベビー関連事業においては、直営店舗及び自社ECサイト及び大手ECショッピングモールにて、マタニティ及びベビー向けのアパレルや雑貨の販売を行っております。
                      - paragraph [ref=e1004]: 婚礼・宴会関連事業においては、結婚式場及びカフェやレストランなどの飲食店運営の他、法人宴会やイベント会場の運営を行っております。
                      - paragraph [ref=e1005]: 美容関連事業においては、直営店舗等にてヘアサロン等の運営を行っております。
                      - paragraph [ref=e1006]: なお、美容関連事業のセグメント情報の区分は「その他」であります。
                      - paragraph [ref=e1007]: 詳細は、「第5 経理の状況1 連結財務諸表等(1)連結財務諸表注記事項(セグメント情報等)」をご参照ください。
                      - paragraph [ref=e1008]: また、瑪露珂爾(上海)国際貿易有限公司においては、現地企業との代理店契約を締結し、婦人下着及びその関連商品の販売を行っております。
