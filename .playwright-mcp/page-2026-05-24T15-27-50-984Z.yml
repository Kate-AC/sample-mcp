                      - paragraph [ref=e839]: 当社グループは、2025年3月31日現在、当社及び連結子会社5社(株式会社東京デリカ、アイシン通商株式会社、ロジェールジャパン株式会社、株式会社三香堂、株式会社ギアーズジャム)の計6社で構成されております。
                      - paragraph [ref=e840]: 当社は、当社グループの経営管理事業及び不動産管理事業を行なっております。
                      - paragraph [ref=e841]: なお、当社は特定上場会社等に該当し、インサイダー取引規制の重要事実の軽微基準のうち、上場会社の規模との対比で定められる数値基準については連結ベースの計数に基づいて判断することとなります。
                      - paragraph [ref=e842]: 株式会社東京デリカの主たる事業内容は、鞄・袋物及び財布・雑貨類の小売販売であり、全国のショッピングセンター・駅ビル等の商業施設にさまざまなショップブランドで直営店舗をテナント出店しております。販売経路については、店頭販売が大半を占めますが、一部、インターネットによる小売販売、百貨店等に対する卸売販売があります。
                      - paragraph [ref=e843]: アイシン通商株式会社の主たる事業内容は、メンズバッグ・トラベルバッグの企画・製造であります。
                      - paragraph [ref=e844]: ロジェールジャパン株式会社の主たる事業内容は、アイシン通商株式会社から仕入れた商品の卸売販売であり、株式会社東京デリカ、株式会社三香堂及び大型量販店等に卸売販売を行なっております。
                      - paragraph [ref=e845]: 株式会社三香堂の主たる事業内容は、帆布製バッグ・小物の企画・製造・販売であり、直営店舗での小売販売や、株式会社東京デリカ等への卸売販売を行なっております。
                      - paragraph [ref=e846]: 株式会社ギアーズジャムの主たる事業内容は、メンズバッグ、財布、雑貨等の小売販売であり、ショッピングセンター・駅ビル等の商業施設に直営店舗をテナント出店しております。
                      - paragraph [ref=e847]: なお、当社グループは、鞄・袋物を核とする商品販売の単一セグメントであります。
