                            - row "建築部門 民間での事務所・工場・店舗等の新築・増改築、住宅・マンション等の建築工事、国・地方公共団体等が発注する公共建築工事を行っており、一部の公共建築物等ではデサイン&ビルド方式による一括請負工事を行っております。また、技術部門を強化し、建設DXのアーリーアダプターとして、BIMをはじめ3Dレーザースキャナーでの現場環境のデジタル化等IoT技術を駆使して、ZEHやZEB等の環境対応の設計、耐震・免震構造技術、住宅・マンション等の新商品の開発、ZEH生産工場の生産性効率化や食品工場のHACCP(食品の総合的な衛生管理システム)対応の設計・提案、医療福祉施設等の技術提案型営業を通して受注を拡大しております。さらに、当社商品のブレインマンションの全国ライセンス契約ビルダーによる事業を展開しております。" [ref=e1062]:
