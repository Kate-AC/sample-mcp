                      - paragraph [ref=e1079]
                      - heading "3 【事業の内容】" [level=3] [ref=e1080]
                      - paragraph [ref=e1081]:
                        - text: 当社グループ(当社及び当社の関係会社)は、当社、連結子会社6社、関連会社7社によって構成されております。当社グループは、精糖、機能性素材、不動産に関する事業を展開しております。
                        - text: 当社グループの事業内容及び各事業における当社グループ各社の位置付けは以下のとおりであります。
                      - paragraph [ref=e1082]: なお、2024年4月1日付で組織変更を実施し、経営管理区分を変更いたしました。詳細は、「第5 経理の状況 1 連結財務諸表等 (1)連結財務諸表 注記事項(セグメント情報等)」に記載のとおりであります。
                      - paragraph [ref=e1083]: (1)精糖
                      - paragraph [ref=e1084]:
                        - text: 当社は精製糖、砂糖関連製品の製造販売を行っております。また、関連会社である南栄糖業株式会社は鹿児島県で粗糖の生産を行っており、当社はその一部を購入しております。また、関連会社である太平洋製糖株式会社は、当社を含む同業他社から委託を受け、精製糖の製造を行っております。
                        - text: なお、連結子会社であるフジ日本商事株式会社は、当社が製造した精製糖、液糖及び糖蜜の販売並びに国産原料糖の仕入を行っております。
                      - paragraph [ref=e1085]: (2)機能性素材
                      - paragraph [ref=e1086]: 1食品添加物事業
                      - paragraph [ref=e1087]: 当社は、食品添加物の製造加工、販売を行っております。
                      - paragraph [ref=e1088]: 2機能性食品事業
                      - paragraph [ref=e1089]: 当社及び連結子会社であるFuji Nihon Thai Inulin Co.,Ltd.は、機能性食品素材「イヌリン」の製造販売を行っております。
                      - paragraph [ref=e1090]: 当社及び連結子会社であるフジ日本商事株式会社は果汁、香料等各種機能性食品素材の仕入販売を行っております。
                      - paragraph [ref=e1091]: 連結子会社であるユニテックフーズ株式会社においては、「ペクチン」「ゼラチン」等の天然添加物素材の仕入販売を行っており、韓国の連結子会社であるUNITEC FOODS KOREA Co.,Ltd.は機能性食品のブレンド製造販売を行っております。また、連結子会社である株式会社Tastableは、プラントベーストミートの製造販売を行っております。また、関連会社である上海唯霓食品有限公司は、機能性食品の製造販売を行っております。
                      - paragraph [ref=e1092]: (3)不動産
                      - paragraph [ref=e1093]: 当社が所有する土地建物の賃貸及びその他不動産関連事業を行っております。
                      - paragraph [ref=e1094]: (4)その他
                      - paragraph [ref=e1095]: 報告セグメントに含まれない事業セグメントであり、当社は切花活力剤「キープ・フラワー」の製造販売、連結子会社であるFUJI NIHON (Thailand) Co.,Ltd.はタイ国において、食品の販売を行っております。また、関連会社であるDAY PLUS(THAILAND)Co.,Ltd.はタイ国において、パン類等の食品の製造販売を行っております。
                      - paragraph [ref=e1096]
                      - paragraph [ref=e1097]
                      - paragraph [ref=e1098]: 以上に説明した事項を事業系統図によって示すと次のとおりであります。
