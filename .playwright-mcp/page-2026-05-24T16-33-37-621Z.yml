                      - paragraph [ref=e938]: 当社グループは、当社、連結子会社9社(国内5社、海外4社)、持分法非適用非連結子会社4社(海外4社)、持分法適用関連会社1社(国内1社)により構成されており、「Manuals&Knowledge事業」を提供しております。
                      - paragraph [ref=e939]: 当社と主な関係会社の事業内容及び当該事業に係る位置付けにつきましては、次のとおりであります。なお、セグメントと同一の区分です。
                      - paragraph [ref=e940]
                      - paragraph [ref=e941]: "[Manuals&Knowledge事業]"
                      - paragraph [ref=e942]: 情報を必要とする人へ“必要な時に、必要とする情報を、最適な方法で”届け、ユーザーエクスペリエンス(顧客体験価値)の最大化を図るために、お客さま企業の商材・市場・会社を深く理解し、お客さまのニーズに合わせて情報を体系化することで、社会全体の情報価値向上サイクルの実現をめざす一連のサービスを提供しており、以下の3つに分類しております。
                      - paragraph [ref=e943]
                      - paragraph [ref=e944]: (1)Manuals
                      - paragraph [ref=e945]: お客さま企業の商材・市場・会社を深く理解し、利活用の目的(例えばリアルからデジタルコンテンツへの転用など)に合わせて情報を体系化するサービスを提供しております。
                      - paragraph [ref=e946]
                      - paragraph [ref=e947]: (2)Knowledge
                      - paragraph [ref=e948]: 情報を必要とする人のシーンに応じて、最適な尖端技術を活用し、ユーザーエクスペリエンス(顧客体験価値)の最大化を図るサービスを提供しております。
                      - paragraph [ref=e949]
                      - paragraph [ref=e950]: (3)その他
                      - paragraph [ref=e951]: 情報活用の基盤となるソフトウエアのライセンス販売などを行っております。
                      - paragraph [ref=e952]
                      - paragraph [ref=e953]: 単一セグメントにおける主な関係会社については、「第1 企業の概況 4 関係会社の状況」をご参照ください。
