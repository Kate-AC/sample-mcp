                      - heading "3 【事業の内容】" [level=3] [ref=e843]
                      - paragraph [ref=e844]: 当社は、店舗において自転車及びパーツ・アクセサリー等の関連商品の販売、各種整備及び修理等の付帯サービスの提供を行なっており、当事業年度末現在、北海道・東北・関東・甲信越・中部・近畿・中国・四国・九州に539店舗の直営店を運営している他、当社直営店ノウハウをもとに中部、近畿及び九州に18店舗のフランチャイズ(FC)店を展開しております。
                      - paragraph [ref=e845]: インターネット通信販売では、「公式オンラインストア」に加え、「Yahoo!店」と「楽天市場店」を展開しております。
                      - paragraph [ref=e846]: 商品については、当社が企画開発し、中国や台湾の海外メーカーにて生産した自社ブランド商品に加え、国内及び海外の自転車メーカー等の他社ブランド商品、メーカーとの共同開発商品を取り扱っております。
                      - paragraph [ref=e847]: また、商品卸事業では、国内販売店に対し、自社ブランド商品だけでなく、当社が日本総販売代理権を所有する自転車及びパーツ・アクセサリーを販売しております。
                      - paragraph [ref=e848]: なお、当社は自転車事業の単一セグメントであるため、セグメント別の記載を省略しております。
                      - paragraph [ref=e849]: 具体的な取扱品目は、以下のとおりであります。
