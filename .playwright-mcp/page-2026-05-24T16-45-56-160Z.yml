                      - heading "3【事業の内容】" [level=3] [ref=e1008]
                      - paragraph [ref=e1009]: 当社グループは日本精化株式会社(当社)及び連結子会社6社により構成されており、機能性製品と環境衛生製品の製造販売を行っているほか、その他の事業を営んでおります。
                      - paragraph [ref=e1010]: 事業内容及び当社と子会社の当該事業における位置付け並びにセグメントとの関連は次のとおりであります。
                      - paragraph [ref=e1011]
                      - paragraph [ref=e1012]: 機能性製品 当社が製造販売しており、当社製品の一部を日精バイリス(株)が販売しております。当社並びに(株)アルボースが使用する原材料の一部は日精バイリス(株)を通じて調達しております。また、日精バイリス(株)では薬理・安全性試験の受託業を営んでおります。オレオトレード・インターナショナル(株)では植物性油脂の輸入販売を行っております。日精プラステック(株)では合成樹脂製品及び住宅資材販売を行っております。四川日普精化有限公司は主に輸出用「脂肪酸アマイド」及び「機能性コーティング剤」を製造販売しております。日隆精化國際股份有限公司では当社及び四川日普精化有限公司が製造した「機能性コーティング剤」を販売しております。
                      - paragraph [ref=e1013]: 環境衛生製品 (株)アルボースが製造販売しております。
                      - paragraph [ref=e1014]: その他 日精バイリス(株)が不動産業を営んでおります。当社は日精バイリス(株)に不動産の管理業務を委託しております。
