                      - heading "3 【事業の内容】" [level=3] [ref=e1067]
                      - paragraph [ref=e1068]: 当社は、主に東京ガス株式会社、東京ガスネットワーク株式会社(以下、東京ガスグループという)のガス設備事業(屋内配管工事・戸建住宅暖冷房給湯工事)、ガス導管事業(本支管埋設工事・供給管工事)を主体としておりますが、そのほか建築設備事業(建築工事・給排水衛生設備工事・空気調和設備工事・集合住宅暖冷房給湯工事)、電設・土木事業(電気管路洞道埋設工事・上下水道工事・土木工事)を営み、総合設備工事業として事業活動を展開しております。
                      - paragraph [ref=e1069]: また、当社には非連結子会社として株式会社協和ライフサービス(車両のリース・整備及び損害保険代理店業務)、ガイアテック株式会社(ガス設備工事・床暖房工事・ガス機器設置工事・プロパンガス工事・エクステリア工事)があります。
                      - paragraph [ref=e1070]: 更に、当社には関連会社として東京理学検査株式会社がありますが、同社は配管に対する理化学機器による検査業務を主として営んでおります。
