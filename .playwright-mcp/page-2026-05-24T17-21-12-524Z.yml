                      - paragraph [ref=e1016]
                      - heading "3 【事業の内容】" [level=3] [ref=e1017]
                      - paragraph [ref=e1018]: 当社グループは、当連結会計年度末現在、当社、連結子会社16社(国内11社、海外5社)より構成され、主要事業として、インターネットを活用した住まいとその周辺領域に関する情報サービス事業を展開しております。
                      - paragraph [ref=e1019]: 当連結会計年度中に、当社の完全子会社であったLIFULL CONNECT, S.L.の全株式をCONNECT NEXT PTE.LTD.に現物出資したことにより、海外事業セグメントを非継続事業に分類しました。これに伴い、報告セグメントを「HOME'S関連事業」の単一セグメントに変更しております。
                      - paragraph [ref=e1020]
                      - paragraph [ref=e1021]: (1) HOME'S関連事業
                      - paragraph [ref=e1022]: 当事業は、不動産・住宅情報サイト「LIFULL HOME'S」と不動産投資と収益物件の情報サイト「健美家」、及び関連事業で構成されています。
                      - paragraph [ref=e1023]
                      - paragraph [ref=e1024]: (2) その他
                      - paragraph [ref=e1025]: 老人ホーム・介護施設の検索サイト「LIFULL 介護」や、地方創生事業等により構成されています。
                      - paragraph [ref=e1026]
                      - paragraph [ref=e1027]: また、当社には、eコマースを中心とした総合ネットサービスを展開する楽天グループ株式会社が18.57%出資しており、同社にとって当社は持分法適用関連会社となります。
                      - paragraph [ref=e1028]
                      - paragraph [ref=e1029]: 以上述べた事項を事業系統図に示すと、次のとおりであります。
