                      - heading "3 【事業の内容】" [level=3] [ref=e984]
                      - paragraph [ref=e985]: 当社グループは、丸大食品株式会社(当社)、連結子会社24社及び関連会社1社により構成されており、加工食品事業及び食肉事業を主な事業としているほか、これらに関連する保険代行事業等のサービス業務などを行っております。
                      - paragraph [ref=e986]
                      - paragraph [ref=e987]: 当社グループの事業における当社、連結子会社及び関連会社の位置付けは、次のとおりであります。なお、以下に示す区分は、セグメントと同一の区分であります。
                      - paragraph [ref=e988]
                      - paragraph [ref=e989]: 加工食品事業
                      - paragraph [ref=e990]: ハム・ソーセージや調理加工食品の製造及び販売を、当社のほか戸田フーズ(株)、安曇野食品工房(株)及びトーラク(株)などで行っております。
                      - paragraph [ref=e991]
                      - paragraph [ref=e992]: 食肉事業
                      - paragraph [ref=e993]: 食肉(牛肉、豚肉、鶏肉等)の加工及び販売を、当社のほか丸大ミート(株)、丸大フード(株)及び(株)ミートサプライなどで行っております。
                      - paragraph [ref=e994]
                      - paragraph [ref=e995]: その他
                      - paragraph [ref=e996]: 保険代行事業等のサービス業務などを、(株)丸大サービスで行っております。
