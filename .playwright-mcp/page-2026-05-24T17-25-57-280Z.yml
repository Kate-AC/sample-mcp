                    - generic [ref=e933]:
                      - paragraph [ref=e934]
                      - heading "3 【事業の内容】" [level=3] [ref=e935]
                      - paragraph [ref=e936]: 当社グループは、当社及び連結子会社2社で構成され、婦人衣料及び服飾雑貨のSPA(注)企業として、衣料品及び服飾品の企画、販売並びに製造を行っております。
                      - paragraph [ref=e937]: 以下に示す区分は、セグメントと同一の区分であります。
                      - paragraph [ref=e938]: なお、当連結会計年度より、報告セグメントの区分を変更しております。詳細は、「第5 経理の状況 1 連結財務諸表等 (1)連結財務諸表 注記事項(セグメント情報等)」をご参照ください。
                      - paragraph [ref=e939]
                      - paragraph [ref=e940]
                      - paragraph [ref=e941]: (日本)
                      - paragraph [ref=e942]: 当社(株式会社ハニーズホールディングス)は、幅広い年齢層のお客様へ向けた婦人服及び服飾品の企画、並びに連結子会社である株式会社ハニーズへの販売を行っております。株式会社ハニーズは、国内一般消費者に対し、婦人服等の販売を行っております。同社の国内店舗は、インショップ型を主とした婦人服専門店であり、全国47都道府県にわたって各地の郊外型大型ショッピングセンターや駅ビル等に出店しております。当連結会計年度末の直営店舗数は872店舗であります。
                      - paragraph [ref=e943]: 当社グループの販売する商品の大半は自社企画商品であり、それらは主にミャンマー自社工場のほか、海外生産委託工場で生産しております。
                      - paragraph [ref=e944]
                      - paragraph [ref=e945]: (ミャンマー)
                      - paragraph [ref=e946]: 連結子会社であるHoneys Garment Industry Limitedは、ミャンマーにおいて婦人衣料等の製造業を営んでおります。
                      - paragraph [ref=e947]
                      - paragraph [ref=e948]: (注) SPAとは、Speciality store retailer of Private label Apparel の略であります。
                      - paragraph [ref=e949]
                      - paragraph [ref=e950]: 以上を事業系統図で示すと、次のとおりであります。
