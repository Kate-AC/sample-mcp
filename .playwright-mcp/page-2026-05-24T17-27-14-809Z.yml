                      - heading "3【事業の内容】" [level=3] [ref=e1013]
                      - paragraph [ref=e1014]: 当社グループ(当社及び当社の関係会社)は、当社(太陽化学株式会社)、子会社10社及び関連会社1社で構成されており、食品用乳化剤、安定剤、各種鶏卵加工品、即席食品用素材、農産加工品、栄養機能食品、化粧品原料等の製造と販売を主たる目的としております。
                      - paragraph [ref=e1015]: 国内の子会社は、2社であり、その内、テクノ・マーケティング株式会社は、業務請負及び飲食業等の事業を行っております。また、株式会社タイヨーラボは、当社グループ製品の国内での販売を行っております。
                      - paragraph [ref=e1016]: 国内の関連会社は、1社であり、株式会社サンフコは、当社製品の販売及び原料の仕入業務を行っております。
                      - paragraph [ref=e1017]:
                        - text: 国外の子会社は、米国1社、中国4社、韓国1社、インド1社、ドイツ1社の計8社であり、その内、米国の子会社タイヨーインタナショナルインクは、当社グループ製品のアメリカでの販売を行っております。中国の子会社の内、開封太陽金明食品有限公司は、鶏卵加工品等の製造販売を行っており、香奈維斯(天津)食品有限公司は、ベーカリー製品の製造販売を行っております。無錫太陽緑宝科技有限公司は、緑茶抽出物の製造販売を行っております。上海太陽食研国際貿易有限公司は、当社グループ製品の中国での販売を行っております。韓国の子会社タイヨーインタコリアリミテッドは、当社グループ製品の韓国での販売を行っております。インドの子会社タイヨーカガクインディアプライベイトリミテッドは、食物繊維の製造販売及び当社グループ製品のインドでの販売を行っております。ドイツの子会社Taiyo GmbHは、当社グループ製品の欧州での販売を行っております。
                        - text: 以下に各事業の事業内容を記載いたします。
                      - paragraph [ref=e1018]
                      - paragraph [ref=e1019]: 1 ニュートリション事業(Nutrition Division)
                      - paragraph [ref=e1020]: 医療、健康食品及び飲料業界等に、カテキン(緑茶抽出物)、テアニン(機能性アミノ酸)、水溶性食物繊維等の機能性食品素材、ミネラル製剤、ビタミン製剤等を製造、販売しております。
                      - paragraph [ref=e1021]: 関係会社である無錫太陽緑宝科技有限公司、タイヨーカガクインディアプライベイトリミテッド及び株式会社タイヨーラボを担当しております。
                      - paragraph [ref=e1022]
                      - paragraph [ref=e1023]: 2 インターフェイスソリューション事業(Interface Solution Division)
                      - paragraph [ref=e1024]: 乳製品、飲料、菓子、パン、加工油脂等の業界、及び化粧品、トイレタリー業界等に、乳化剤等の品質改良剤を製造、販売しております。
                      - paragraph [ref=e1025]
                      - paragraph [ref=e1026]: 3 ナチュラルイングリディエント事業(Natural Ingredient Division)
                      - paragraph [ref=e1027]: 乳製品、飲料、菓子、パン、総菜、即席めん、農産加工業界等に、鶏卵加工品、たん白素材、即席食品用素材、農産加工品等の食品素材、品質改良剤、安定剤等を製造、販売しております。
                      - paragraph [ref=e1028]: 関係会社である開封太陽金明食品有限公司、香奈維斯(天津)食品有限公司を担当しております。
                      - paragraph [ref=e1029]
                      - paragraph [ref=e1030]: 4 その他
                      - paragraph [ref=e1031]: 料理飲食等の事業を行っております。
