                      - paragraph [ref=e1088]: 当社グループは、当社、子会社14社、関連会社12社で構成され、鉄構セグメント、土木セグメント、建築セグメント、ソリューションセグメント及びその他事業を主な事業の内容とし、更に各事業に関連する研究やサービス等の事業活動を展開しています。
                      - paragraph [ref=e1089]: 当社は川田工業株式会社の純粋持株会社として2009年2月27日付で設立され、当社グループ全体の経営計画管理、グループ企業の調整・指導及び各事業に関する研究開発等の業務を行います。また、当社は特定上場会社等に該当し、インサイダー取引規制の重要事実の軽微基準のうち、上場会社の規模との対比で定められる数値基準については、連結ベースの数値に基づいて判断することとなります。
