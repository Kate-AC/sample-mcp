                      - heading "3 【事業の内容】" [level=3] [ref=e1057]
                      - paragraph [ref=e1058]: 当社グループは、純粋持株会社である当社(PCIホールディングス株式会社)並びに情報サービス事業を営む連結子会社6社(うち、孫会社3社)により構成されており、ソフトウェア及びハードウェア開発、自社ソリューションの開発・保守、半導体のテスト・設計等を主たる業務としております。
                      - paragraph [ref=e1059]: 純粋持株会社である当社は、グループ経営戦略の策定、コーポレート・ガバナンスの構築、経営資源のグループ内最適配分及びグループ各社に対する経営全般における指導・管理等を行っております。
                      - paragraph [ref=e1060]: 当社グループの事業内容及び当社とグループ各社の当該事業に係る位置付けは次のとおりであり、「第5 経理の状況 1.連結財務諸表等(1)連結財務諸表 注記事項(セグメント情報等)」に掲げるセグメントの区分と同一であります。
                      - paragraph [ref=e1061]: なお、当社は、有価証券の取引等の規制に関する内閣府令第49条第2項に規定する特定上場会社等に該当しており、これにより、インサイダー取引規制の重要事実の軽微基準については連結ベースの数値に基づいて判断することになります。
