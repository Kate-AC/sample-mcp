                    - generic [ref=e981]:
                      - heading "3【事業の内容】" [level=3] [ref=e982]
                      - paragraph [ref=e983]: 当社グループは、当社、子会社3社(うち1社は非連結)により構成されており、インターネット通信サービス事業及びロボット事業を主たる事業としております。当社グループ業務内容及び当社と関係会社の当該事業に係る位置付けは以下のようになっております。なお、当該事業区分は、「第5 経理の状況 1 連結財務諸表等 (1)連結財務諸表 注記事項」に掲げるセグメントの区分と同一であります。
                      - paragraph [ref=e984]
                      - paragraph [ref=e985]: <インターネット通信サービス事業>
                      - paragraph [ref=e986]: インターネット通信サービス事業では、MVNO(仮想移動体通信事業者)として、複数の通信事業者から回線を借り受け、一般顧客向けにモバイルWi-FiとSIMカードを組み合わせた「ONLYMobile」や「Only Customize Plan」(注1)を提供しています。また、付帯サービスとして「ONLYOPTION」を展開し、各種オプションを揃えています。これには、故障・破損・紛失時にリファビッシュ品と交換する保証サービス、ウィルス対策のインターネットセキュリティ、クラウド上でのデータ保護を行うクラウドバックアップ、さらに動画やアプリ使い放題のコンテンツサービスが含まれます。初心者にも安心して利用いただける内容となっています。
                      - paragraph [ref=e987]: 新規顧客の獲得は「コミュニケーションセールス」(注2)やテレマーケティングにより行い、モバイルWi-Fiやタブレット、ノートパソコンなどを24回または36回の分割払いで販売することで初期収益を得ています。また、通信サービスの契約を通じて、毎月の通信料から安定した収益(ストック収益)を確保しています。
                      - paragraph [ref=e988]: さらに、グループ会社である株式会社モバイル・プランニングでは、自社運営の「NETAGE」や「九州WiFi」のサイト、および楽天市場やYahoo!ショッピングを活用し、モバイルWi-Fiのレンタル事業を展開。また、MVNE(注3)事業にも取り組んでいます。
                      - paragraph [ref=e989]
                      - paragraph [ref=e990]: <ロボット事業>
                      - paragraph [ref=e991]: ロボット事業では、コミュニケーションロボットとSIMカードを組み合わせた「ONLYROBO」を提供しています。その付帯サービスとして、故障やトラブルに備える「安心保障サービス」や、ロボット専用の月額プラン「ロボホンPrime」など、各種オプションサービス「ONLYOPTION」を展開しています。
                      - paragraph [ref=e992]: 新規会員の獲得は、インターネット通信サービス事業と同様に「コミュニケーションセールス」を活用。コミュニケーションロボットやタブレット端末を36回、60回、72回の分割払いで販売することで初期収益(イニシャル収益)を確保しています。また、モバイルデータ通信サービス契約を通じて、月額通信料から安定した収益(ストック収益)を得ています。
                      - paragraph [ref=e993]: さらに、当社オリジナルブランド「Robot Planet」では、新宿髙島屋、大阪髙島屋、ジェイアール名古屋タカシマヤにポップアップストアを展開。「ONLYROBO ロボホン プレミアム」を中心に、各種コミュニケーションロボットやIoT関連商品を販売しており、多様なニーズに応えています。
                      - paragraph [ref=e994]
                      - paragraph [ref=e995]: <その他>
                      - paragraph [ref=e996]: 連結子会社である株式会社ライフスタイルウォーターの天然水宅配サービスは、OEM(注4)供給元である株式会社コスモライフの3ケ所の採水地から天然水の供給を受け、自社ブランドとして一番近い採水地から直接ご自宅へ配送する「ワンウェイ方式」を採用しております。「ワンウェイ方式」とは、使い終わった容器の回収を必要としないリサイクル資源ゴミとして処分できる容器を使用し配送を行うことであります。また、タンク内に無菌エアーを供給するシステム「無菌エアーシステム」を搭載し、安全・衛生面を追求したメンテナンスフリーのウォーターサーバーを使用しております。予め顧客が指定した配送間隔(10日、20日、30日、その他)及び配送本数(2本以上)に準じて定期的に天然水の宅配を行っております。顧客が継続利用している間はウォーターサーバーのレンタル料金は無料で、利用料金は天然水の代金のみであります。
                      - paragraph [ref=e997]
                      - paragraph [ref=e998]: (注1)「Only Customize Plan」とは、当社傘下代理店が企画したサービスや価格を反映し、代理店のオリジナルブランドのサービスとして顧客に回線提供を行うプランであります。
                      - paragraph [ref=e999]: (注2)「コミュニケーションセールス」とは商業施設等の各店頭を一時使用し、顧客に対してモバイルデータ通信サービスをタブレット端末等を用いてデモンストレーションを行い、実際に商品に触れて体験し、FACE TO FACEのコミュニケーションを図りながら、販売促進・販売活動を行うことであります。
                      - paragraph [ref=e1000]: (注3)「MVNE」とは、大手キャリアより回線を借り受けて、MVNOに回線を卸す事業者のことであります。
                      - paragraph [ref=e1001]: (注4)「OEM」とは他社ブランド製品を自社ブランドとして販売を行うことであります。
