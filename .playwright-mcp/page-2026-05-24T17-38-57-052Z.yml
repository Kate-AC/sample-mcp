                      - heading "3【事業の内容】" [level=3] [ref=e1059]
                      - paragraph [ref=e1060]: 当社グループは、当社、子会社18社及び関連会社2社で構成され、ファインケミカル製品、医薬品原薬・中間体、粘・接着剤、半導体用金型クリーニング材、セラミック基板の製造販売を主体とした電子・機能製品、フィルム、ステッカー、再帰反射シートの製造販売のフィルム・シート製品、住設用押出成形品・住宅用アルミ建材、高強度・高機能手すりの製造販売を主体とした建材関連並びに鉄鋼・化学・電力・環境分野の産業プラントの設計・施工・設備、カーボンニュートラルトランジション設備を主体としたエンジニアリングの事業を展開しております。
                      - paragraph [ref=e1061]: 当社グループの事業に係る主な位置づけ並びにセグメントとの関連は、次のとおりであります。
