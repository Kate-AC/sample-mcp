                      - paragraph [ref=e1063]: フィルム・シート製品 ...当社及び子会社NIPPON CARBIDE INDIA PVT.LTD.、PT NIPPON CARBIDE INDUSTRIES INDONESIA、NIPPON CARBIDE INDUSTRIES(THAILAND)CO.,LTD.、NCI (VIETNAM) CO.,LTD.、NIPPON CARBIDE INDUSTRIA DO BRASIL LTDA.が製造販売をしております。また、子会社恩希愛(杭州)薄膜有限公司で製造した製品を主に当社で販売しております。
                      - paragraph [ref=e1064]: 建材関連 ......子会社ビニフレーム工業(株)が住設用押出成形品・住宅用アルミ建材等を製造販売して
                      - paragraph [ref=e1065]: おります。
