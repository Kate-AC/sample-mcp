                      - heading "3【事業の内容】" [level=3] [ref=e1034]
                      - paragraph [ref=e1035]: 当社グループ(当社及び当社の関係会社)は、当社(大日精化工業株式会社)及び関係会社26社により構成されております。当社は子会社23社を連結し、関連会社3社のうち2社について持分法を適用しております。
                      - paragraph [ref=e1036]: 当社グループが営んでいる主な事業内容及び当該事業に係る位置づけは、次のとおりであります。
                      - paragraph [ref=e1037]
                      - paragraph [ref=e1038]: (カラー&ファンクショナル プロダクト)
                      - paragraph [ref=e1039]: 当セグメントでは、顔料及び顔料の2次加工品を中心に、顔料・繊維用着色剤、プラスチック用着色剤、樹脂コンパウンド、顔料分散体、機能性材料の製造・販売を行っており、主として当社及び連結子会社であるDAICOLOR ITALY S.R.L. 、ハイテックケミ(株)、DAINICHI COLOR (THAILAND),LTD.が製造・販売に携わっております。なお、当社と関係会社との間に製品、原材料等の取引が行われております。
                      - paragraph [ref=e1040]
                      - paragraph [ref=e1041]: (ポリマー&コーティング マテリアル)
                      - paragraph [ref=e1042]: 当セグメントでは、合成樹脂及び特殊コーティング剤を中心に、ウレタン樹脂、天然物由来高分子、紫外線・電子線硬化型コーティング剤の製造・販売を行っており、主として当社及び連結子会社である浮間合成(株)及び大日精化(上海)化工有限公司が製造・販売に携わっております。なお、当社と関係会社との間に製品・原材料等の取引が行われております。
                      - paragraph [ref=e1043]
                      - paragraph [ref=e1044]: (グラフィック&プリンティング マテリアル)
                      - paragraph [ref=e1045]: 当セグメントでは、パッケージ用及び広告出版用インキを中心に、各種用途に対応した幅広い種類のグラビア・フレキソインキ、オフセットインキの製造・販売を行っており、主として当社及び連結子会社であるP.T.HI-TECH INK INDONESIAが製造・販売に携わっております。なお、当社と関係会社との間に製品・原材料等の取引が行われております。
                      - paragraph [ref=e1046]: "[事業系統図]"
