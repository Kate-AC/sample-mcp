                    - generic [ref=e1054]:
                      - heading "3【事業の内容】" [level=3] [ref=e1055]
                      - paragraph [ref=e1056]: 当社グループ(当社及び当社の関係会社)は、当社(ホクト株式会社)及び子会社8社により構成しており、今後の幅広い事業展開と経営の効率化を目的として、「国内きのこ事業」、「海外きのこ事業」、「加工品事業」及び「化成品事業」の4事業部門に関係する事業を営んでおります。
                      - paragraph [ref=e1057]: なお、次の4事業部門は「第5 経理の状況 1 連結財務諸表等 (1)連結財務諸表 注記事項」に掲げるセグメント情報の区分と同一であります。
                      - paragraph [ref=e1058]: 1.国内きのこ事業
                      - paragraph [ref=e1059]: 昭和30年代より今迄の原木によるきのこ栽培から、空調施設の導入、機械化による施設型きのこ生産が飛躍的に伸び、当社でも昭和47年より従来からの栽培用ビン、種菌等の製造販売と共に、きのこ生産、販売に着手いたしました。
                      - paragraph [ref=e1060]: 爾来、一貫して「鮮度の高いきのこ」、「今日収穫したきのこを、翌日にはスーパーの店頭に...。」を念頭に、そのための生産センターを日本全国に設置し、当期末までに全国20ヵ所に33生産センターを稼働させるに至りました。「良質」、「安定収穫」をかかげ、「整理、整頓、清潔、清掃」の「4S運動」を実行しております。
                      - paragraph [ref=e1061]: 国内でのきのこ事業は、全国各地の市場、量販店(スーパー)、生活協同組合等との取引を行っており、常に安定した供給を心掛けております。現在、国内には北海道、宮城、長野、東京、名古屋、大阪、広島、香川、九州の9地域に営業拠点を配しております。
                      - paragraph [ref=e1062]: また、昨今の円安などの影響によりきのこの培地原料であるコーンコブミールの価格が上昇していることから、原料の安定調達を図るため、インドネシアにPT HOKTO INDONESIA MATERIALSを設立し、一部コーンコブミールの生産を始めました。
                      - paragraph [ref=e1063]
                      - paragraph [ref=e1064]: 2.海外きのこ事業
                      - paragraph [ref=e1065]: 海外の子会社によるきのこの生産及び販売を行っており、拠点は、米国の「HOKTO KINOKO COMPANY」が1センター、台湾の「台灣北斗生技股份有限公司」が2センター、またマレーシアの「HOKTO MALAYSIA SDN.BHD.」が1センターを有し、出荷を行っております。加えて、海外での販売拡大のために、アジアを中心とし広くはヨーロッパまで市場調査や営業活動を行っております。
                      - paragraph [ref=e1066]
                      - paragraph [ref=e1067]: 3.加工品事業
                      - paragraph [ref=e1068]: 当社加工食品事業部におきまして、主にきのこを使用した加工品の販売を行い、カレー、健康食品を中心とした新商品の開発や市場開拓及びその通販事業等に注力しております。
                      - paragraph [ref=e1069]: また、子会社の株式会社アーデンは、昭和52年よりカレー、各種スープ、和食材などの多彩なレトルトパウチ食品製造を手掛けており、大手食品メーカーをはじめ食品スーパーなどと取引を行っております。このレトルトパウチ食品製造のノウハウは、当社が今後きのこを主体とした付加価値商品の展開を図っていく上で有益であり、両社の営業力や物流販売能力を組み合わせることでシナジーが期待できるものと考えております。
                      - paragraph [ref=e1070]
                      - paragraph [ref=e1071]: 4.化成品事業
                      - paragraph [ref=e1072]: ホクト産業株式会社におきまして、下記のとおり事業を展開しております。
                      - paragraph [ref=e1073]: (1)農業資材の製造、販売
                      - paragraph [ref=e1074]: きのこ生産に不可欠なP・P(ポリプロピレン)ビン等の栽培用資材の製造と、栽培用機械、包装用機械及び資材等の販売を担当しており、きのこの生産から包装までの総合相談、指導を行う部門であります。
                      - paragraph [ref=e1075]: 近年きのこ生産農家の高齢化、後継者不足が顕著でありますが、当社創立後、間もなく組織された事業であり、長年の経験をもとに質の高い指導をもって固定客の確保に努めております。
                      - paragraph [ref=e1076]: (2)包装資材
                      - paragraph [ref=e1077]: 食品を中心とした包装用の資材、容器、機械の販売を担当している部門であります。近年は非食品業界への販売も増加しており、既存の分野にとらわれない幅広い販売を展開しております。また、自社製造部門におきましてブローボトルを製造しており、飲料用、工業用等メーカーとして全国に販売を展開してきております。これら新規分野への販売や新規事業等の柱を大きく成長させるべく活動しております。
                      - paragraph [ref=e1078]
