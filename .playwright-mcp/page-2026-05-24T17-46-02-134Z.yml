                    - generic [ref=e1069]:
                      - paragraph [ref=e1070]
                      - heading "3 【事業の内容】" [level=3] [ref=e1071]
                      - paragraph [ref=e1072]:
                        - text: 当社グループは、「テクノロジーで、住宅を変え、世界を変えていく。」という経営理念のもと、AI・IoT等の先端技術を活用したDX(デジタルトランスフォーメーション)による不動産領域の様々なサービスを通じて多様化する生活スタイルに相応しい利便性の高いサービスを提供していくことで、経営理念を実現すべく事業展開を行ってまいります。
                        - text: 当社グループがこれまで培ってきたリアル領域とテック領域のノウハウをベースとし、リアル×テクノロジーの知見をDX領域へと展開し企業価値の向上を目指すものであります。
                      - paragraph [ref=e1073]: 当社及び当社の関係会社の事業における当社及び当社の関係会社の位置付け及びセグメントとの関連は、次のとおりであります。
                      - paragraph [ref=e1074]
                      - paragraph [ref=e1075]: (AI・IoT事業)
                      - paragraph [ref=e1076]: AI・IoT事業におきましては、土地から選べるアパート経営「robot home」の継続的な開発・運用、及びサービスを提供。入居者、オーナー、メンテナンス会社、賃貸仲介会社、賃貸管理会社の全てのプレーヤーをプラットフォーム上で繋ぎ、賃貸経営の自動化を目指してまいります。さらに、これまで蓄積された「リアル×テクノロジー」の知見をDX領域へと展開し、不動産業界のみならず、他業界に対する「DX総合支援サービス」を提供しております。
                      - paragraph [ref=e1077]
                      - paragraph [ref=e1078]: (robot home事業)
                      - paragraph [ref=e1079]: robot home事業におきましては、AI・IoT事業で構築した土地から選べるアパート経営「robot home」を活用し、不動産オーナーに向けた新築・中古物件の供給(フロー領域)から、賃貸管理の受託(ストック領域)、売却・再投資(フロー領域)を経て、プラットフォーム内の流通が更に拡大するという好循環成長サイクルの構築に努めてまいりました。
                      - paragraph [ref=e1080]: ストック領域におきましては、AI・IoTなどのコアテクノロジーを活用した賃貸管理RPAシステム「robot home for PM」の活用により、業務効率化されたPM業務を実施し、安定したストック収益を拡大してまいりました。また、メンテナンス領域への事業領域拡大、及び自社保証のシェア拡大等による持続的な収益基盤の拡大に注力いたしました。
                      - paragraph [ref=e1081]: フロー領域におきましては、購入サポートのみならず、資産形成サポート、売却サポートの更なる充実により、アプリ内での取引を活性化。プラットフォーム内の流通を促進することで、今後の収益基盤の更なる安定化に向けた取り組みに注力いたしました。
                      - paragraph [ref=e1082]
