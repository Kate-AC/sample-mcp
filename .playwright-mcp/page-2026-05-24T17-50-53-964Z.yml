                      - heading "3【事業の内容】" [level=3] [ref=e1019]
                      - paragraph [ref=e1020]: 当社グループは、当社、子会社8社で構成され、建築、土木、不動産の事業を行っております。
                      - paragraph [ref=e1021]: 当社グループの事業に係る位置づけ及び報告セグメントとの関連は、次のとおりであります。
                      - paragraph [ref=e1022]: なお、次の3部門は「第5 経理の状況 1. 連結財務諸表等 (1)連結財務諸表 注記事項(セグメント情報等)」に掲げる報告セグメントの区分と同一であります。
                      - paragraph [ref=e1023]
                      - paragraph [ref=e1024]: (建築セグメント)
                      - paragraph [ref=e1025]: 当社が建築工事の請負並びにこれに付帯する事業を営んでいる他、子会社では矢作ビル&ライフ(株)と北和建設(株)が建築事業、(株)テクノサポートが建設用資材の販売を行っております。また、当社グループ独自の外付耐震補強工法による耐震診断やコンサルティング、調査、設計、施工など一連の耐震補強サービスの提供を矢作ビル&ライフ(株)、(株)テクノサポートが行っております。なお、その他の関係会社である名古屋鉄道(株)より駅舎建築工事等を継続的に受注しております。
                      - paragraph [ref=e1026]: (土木セグメント)
                      - paragraph [ref=e1027]: 当社が土木・鉄道工事の請負並びにこれに付帯する事業を営んでいる他、子会社ではヤハギ道路(株)が道路舗装及び土木工事の請負に関する事業、ヤハギ緑化(株)が緑化工事及びゴルフ場の維持管理に関する事業、(株)テクノサポートが補強土工法「パンウォール」に関する事業を営んでおり、南信高森開発(株)は、ゴルフコース(コース名:高森カントリークラブ)を所有し、その運営を行っております。当社はヤハギ道路(株)、ヤハギ緑化(株)に工事を発注しており、また、その他の関係会社である名古屋鉄道(株)より鉄道工事等を継続的に受注しております。
                      - paragraph [ref=e1028]: (不動産セグメント)
                      - paragraph [ref=e1029]: 当社が不動産の売買、賃貸等の不動産事業を営む他、子会社の矢作地所(株)がマンション分譲、不動産賃貸及び不動産開発を行い、矢作ビル&ライフ(株)がビル・マンションの管理、不動産賃貸及び分譲マンションのカスタマーサービス事業を行っております。当社は、矢作地所(株)よりマンション工事等を受注しております。
                      - paragraph [ref=e1030]: 以上に述べた事項の概略図を示すと、次のとおりであります。
