                      - heading "3【事業の内容】" [level=3] [ref=e837]
                      - paragraph [ref=e838]: 当社グループは、当社、連結子会社2社、関連会社2社で構成され、法面保護工事、ダム基礎工事、アンカー工事、重機工事、注入工事、維持修繕工事、環境保全工事ならびにこれらに関する事業を行っており、あわせて建設コンサルタント及び地質調査を行っている。連結子会社のJAFEC USA,Inc.は、海外工事への参入を図るため平成21年10月に米国ネバダ州に設立し、株式会社オーケーソイルは、都市部の地盤改良工事および海外工事に実績があるため平成22年4月に子会社化した。また、関連会社の日本施設管理株式会社は、当社業務に関連するダム施設管理業務および建設コンサルタント業務を、株式会社オリオン計測は当社業務に関連する地質調査やデータ解析を行っている。
