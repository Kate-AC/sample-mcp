                      - paragraph [ref=e1025]
                      - heading "3 【事業の内容】" [level=3] [ref=e1026]
                      - paragraph [ref=e1027]
                      - paragraph [ref=e1028]: 当社グループは、当社、子会社26社、関連会社8社で構成され、「設備工事業」、「リース事業」及び「太陽光発電事業」の3つを報告セグメントとしている。
                      - paragraph [ref=e1029]: 「設備工事業」では、配電工事、送電・土木工事、電気・計装工事、空調・管工事、情報通信工事を受注施工しており、「リース事業」では、工事用機械、車両、備品等のリースを行っている。また、「太陽光発電事業」では、太陽光発電による電気の販売を行っている。
                      - paragraph [ref=e1030]
                      - paragraph [ref=e1031]: 当社グループの事業に係る位置づけ及びセグメントとの関連は、次のとおりである。
                      - paragraph [ref=e1032]
                      - paragraph [ref=e1033]: (設備工事業)
                      - paragraph [ref=e1034]: 当社が得意先から設備工事を受注施工する他、工事の一部については連結子会社 (株)アクセル徳島、(株)高知クリエイト、(株)アクセル松山、(株)香川クリエイトに発注している。
                      - paragraph [ref=e1035]: 連結子会社 有元温調(株)は、兵庫県を中心に空調・管工事を受注施工している。
                      - paragraph [ref=e1036]: 連結子会社 アイ電気通信(株)は、関西圏及び首都圏を中心に、非連結子会社 恒栄通建(株)は、首都圏を中心に電気・電気通信工事を受注施工している。
                      - paragraph [ref=e1037]: 連結子会社 菱栄設備工業(株)は、首都圏を中心に空調・管工事を、非連結子会社 (株)一水社は、同エリアにて管工事を受注施工している。
                      - paragraph [ref=e1038]: 連結子会社 (株)関西設備は、高知県を中心に空調・管工事を受注施工している。
                      - paragraph [ref=e1039]: 連結子会社 横山工業(株)は、栃木県を中心に空調・管工事を受注施工している。
                      - paragraph [ref=e1040]: 連結子会社 (株)ベルテックは、岡山県を中心に電気工事を受注施工している。
                      - paragraph [ref=e1041]: 連結子会社 (株)キャデワサービスはCADによる図面作成等を行っており、当社は図面作成等の一部を発注している。
                      - paragraph [ref=e1042]: 非連結子会社 徳島電工(有)、南海電工(有)、香川電工(有)は、配電工事における当社と協力業者との取引に係る事務手続を代行している。
                      - paragraph [ref=e1043]: 非連結子会社 Yondenko Vietnam Company Limitedは、CADによる図面作成等を行っており、当社は図面作成等の一部を発注している。
                      - paragraph [ref=e1044]
                      - paragraph [ref=e1045]: (リース事業)
                      - paragraph [ref=e1046]: 連結子会社 (株)ヨンコービジネスは工事用機械、車両、備品等のリースを行っており、一部について当社との間でリース取引がある。
                      - paragraph [ref=e1047]
                      - paragraph [ref=e1048]: (太陽光発電事業)
                      - paragraph [ref=e1049]: 当社、連結子会社 (株)ヨンコーソーラー、(株)仁尾太陽光発電及び(株)桑野太陽光発電並びに関連会社 こうち名高山ソーラーファーム(株)は、太陽光発電による電気の販売を行っており、当社は主要な設備について工事・管理・運営を行っている。
                      - paragraph [ref=e1050]
                      - paragraph [ref=e1051]: (その他)
                      - paragraph [ref=e1052]: 当社は、CADソフトウェアの開発・販売、指定管理業務、工事材料の販売等を行っている。
                      - paragraph [ref=e1053]: 非連結子会社 (株)鈴木建築設計事務所は、東北地方を中心に建築設計に関する業務を行っている。
                      - paragraph [ref=e1054]: 非連結子会社 (株)マルケンは、首都圏を中心に建築・設備資機材の販売に関する業務を行っている。
                      - paragraph [ref=e1055]: 非連結子会社 (株)宇多津給食サービス、(株)徳島農林水産PFIサービス及び(株)大洲給食PFIサービス並びに関連会社 (株)笠岡給食PFIサービス、(株)大洲学校PFIサービス、(株)松山学校空調PFIサービス、(株)西予まちづくりサービス、(株)徳島県警PFIサービス、(株)西条学校空調PFIサービス及び(株)三木町学校給食施設は、PFI事業を営んでいる。
                      - paragraph [ref=e1056]
