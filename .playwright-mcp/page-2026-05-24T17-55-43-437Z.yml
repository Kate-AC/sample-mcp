                      - heading "3【事業の内容】" [level=3] [ref=e935]
                      - paragraph [ref=e936]: 当社グループは、当社、子会社10社及び関連会社4社で構成され、電力関連設備や一般電気設備工事等の設計及び施工を主な事業としております。また、太陽光発電やバイオマス発電による電力の販売、不動産の賃貸・管理、工具・備品・車両等のリース・レンタル及び保険代理業等の事業活動を展開しております。これら既存事業領域を堅持するとともに、事業領域を拡大すべく、子会社による国内外でのエネルギー関連事業への参画等に取り組んでおります。
                      - paragraph [ref=e937]: 各事業における当社グループの位置付け並びにセグメントとの関連は、次のとおりであります。
                      - paragraph [ref=e938]: なお、電力関連設備工事の主要部分は、その他の関係会社である東京電力ホールディングス(株)を含む東京電力グループより受注しております。
                      - paragraph [ref=e939]
                      - paragraph [ref=e940]: "[設備工事業]"
                      - paragraph [ref=e941]: 火力、原子力、水力、コージェネレーション、太陽光及びバイオマス発電設備の建設・保守、並びに変電、一般電気、情報通信及び空調設備工事の設計・施工
                      - paragraph [ref=e942]: (主な関係会社)
                      - paragraph [ref=e943]: 当社、(株)テクノ東京、Tokyo Enesys Vietnam Co.,Ltd.、アサバヌエネシスエンジニアリング(株)
                      - paragraph [ref=e944]: "[その他の事業]"
                      - paragraph [ref=e945]: 発電事業、不動産事業、リース・レンタル事業、保険代理業、製造・販売事業及び卸売業
                      - paragraph [ref=e946]: (主な関係会社)
                      - paragraph [ref=e947]: 当社、東工企業(株)、(株)バイコム、(株)東輝、Tokyo Enesys(Thailand) Co.,Ltd.、Admiration Co.,Ltd.、合同会社境港エネルギーパワー、合同会社熊本エネルギーパワー、合同会社北アルプスエネルギーパワー、SCI Enesys Co.,Ltd.、合同会社会津こもれび発電所、合同会社白馬猿倉小水力発電
