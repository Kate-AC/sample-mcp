                      - heading "3 【事業の内容】" [level=3] [ref=e1040]
                      - paragraph [ref=e1041]: 当社グループは、当社及び子会社7社で構成され、熱処理事業(主に自動車、機械、半導体、化学、電池製造関連)、プラント事業(主に鉄鋼、非鉄、窯業関連)、開発事業(主に脱炭素関連、精密塗工・乾燥関連、廃棄物処理・リサイクル関連)の3分野における、工業炉・産業機械・環境設備・燃焼設備についての設計・製作・施工及び燃焼機器などの製作・販売を主な内容とし、さらに各事業に付帯するエンジニアリング、研究開発並びにその他のサービスなどの事業活動を展開しております。
                      - paragraph [ref=e1042]: 当社グループの事業に係わる位置付け及びセグメントとの関連は、次のとおりであります。
                      - paragraph [ref=e1043]
                      - paragraph [ref=e1044]: 熱処理事業
                      - paragraph [ref=e1045]: 自動車・機械・半導体・化学部材熱処理炉、電池・基板・触媒・磁性材熱処理炉及び大気浄化設備などの設計・製作・施工・販売を行っております。
                      - paragraph [ref=e1046]: (主な関係会社)当社
                      - paragraph [ref=e1047]
                      - paragraph [ref=e1048]: プラント事業
                      - paragraph [ref=e1049]: 鉄鋼・非鉄金属等加熱炉・熱処理炉、金属ストリッププロセスライン、塗装ライン、各種工業用バーナ、省エネ制御機器などの設計・製作・施工・販売を行っております。
                      - paragraph [ref=e1050]: (主な関係会社)当社
                      - paragraph [ref=e1051]
                      - paragraph [ref=e1052]: 開発事業
                      - paragraph [ref=e1053]: 脱炭素関連の研究開発、精密塗工・乾燥装置、キルン・環境プロセス設備などの設計・製作・施工・販売を行っております。
                      - paragraph [ref=e1054]: (主な関係会社)当社
                      - paragraph [ref=e1055]
                      - paragraph [ref=e1056]: その他
                      - paragraph [ref=e1057]: 国内・海外子会社の事業を「その他」としております。中外プラント(株)は工業炉等の技術サービス・人材派遣業務を、台湾中外炉工業股份有限公司は台湾における工業炉等の販売・資材調達を、中外炉熱工設備(上海)有限公司は中国における工業炉等の製作・販売・資材調達を、中外炉設備技術(上海)有限公司は中国における工業炉等の設計・技術サービス提供、仲介販売及び輸出入代理業務を、Chugai Ro (Thailand) Co.,Ltd.はタイにおける各種工業炉等の販売及びメンテナンス業務を、PT. Chugai Ro Indonesiaはインドネシアにおける各種工業炉等の販売及びメンテナンス業務を、Chugai Ro de Mexico, S.A. de C.V.はメキシコにおける各種工業炉等の販売及びメンテナンス業務を、それぞれ行っております。
                      - paragraph [ref=e1058]: (主な関係会社)中外プラント(株)、台湾中外炉工業股份有限公司、中外炉熱工設備(上海)有限公司、中外炉設備技術(上海)有限公司、Chugai Ro (Thailand) Co.,Ltd.、PT. Chugai Ro Indonesia、Chugai Ro de Mexico, S.A. de C.V.
