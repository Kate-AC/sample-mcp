                      - heading "3【事業の内容】" [level=3] [ref=e951]
                      - paragraph [ref=e952]: 当社グループは、当社、子会社6社及び関連会社2社で構成され、鶏・豚・牛用の畜産飼料、魚用の水産飼料の製造、販売等を行う「飼料セグメント」、消費者向けの畜水産物の販売、畜産用機器の販売、配合肥料の製造、販売、保険代理業等を行う「その他セグメント」を展開しております。
                      - paragraph [ref=e953]: なお、配合飼料製造のため、各工場所轄税関での第一種承認工場の認可を、畜産用機器販売のため、建設業の許可を受けております。
                      - paragraph [ref=e954]: 当社グループの事業内容、当社と関係会社の当該事業に係る位置付け及びセグメントとの関連は次のとおりであります。
                      - paragraph [ref=e955]: 飼料.................. 当社は、畜産及び水産飼料の製造、販売を行っております。
                      - paragraph [ref=e956]: 連結子会社有限会社豊洋水産は、当社の水産用飼料の研究開発を行うとともに、水産物の生産及び販売を行っております。
                      - paragraph [ref=e957]: 持分法適用関連会社みらい飼料株式会社は、当社より原料を仕入れ、畜産用飼料の製造・販売を行っております。
                      - paragraph [ref=e958]: 持分法適用関連会社三通中部飼料(山東)有限公司は、水産用飼料の製造・販売を行っております。
                      - paragraph [ref=e959]: その他............... 当社は、セサミンを含んだ特殊卵「ごまたまご」やいも類を多く含む飼料で育てた「いもぶた」をはじめとする畜産物の委託生産を行うとともに、生産者から畜産物及び水産物を仕入れ、販売を行っております。
                      - paragraph [ref=e960]: 当社は、配合肥料の製造・販売や、工場跡地等活用のための不動産の賃貸を行っております。
                      - paragraph [ref=e961]: 連結子会社中部エコテック株式会社は、畜産用機器の開発、仕入及び販売を行っております。
                      - paragraph [ref=e962]: 連結子会社吉林華中緑色生態農業開発有限公司は、配合肥料の製造・販売を行っております。
                      - paragraph [ref=e963]: 連結子会社中部艾科太科(大連)環境技術有限公司は、畜産用機器の仕入及び販売を行っております。
                      - paragraph [ref=e964]: 連結子会社株式会社ダイコクは当社、グループ会社及び得意先に保険代理店業務を行っております。
                      - paragraph [ref=e965]: 連結子会社中部チムニー株式会社は、畜産物及び水産物を当社より仕入れ、販売しております。
