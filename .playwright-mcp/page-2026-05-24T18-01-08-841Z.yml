                      - paragraph [ref=e850]: 連結子会社は、官公庁の公共事業等において、企画から施工監理までを一貫して提供できる総合建設コンサルタント事業を行っております。総合建設コンサルタント事業には、企画・計画、設計、診断、マネジメント、発注者支援、補償コンサルタント等の建設コンサルタント業務と測量、地質調査等の調査業務とがあり、株式会社エイト日本技術開発は総合建設コンサルタント事業全般を行い、他の連結子会社は各社の強みとする分野を中心に事業を行っております。
