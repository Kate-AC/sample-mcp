                    - generic [ref=e991]:
                      - paragraph [ref=e992]
                      - heading "3 【事業の内容】" [level=3] [ref=e993]
                      - paragraph [ref=e994]: 当社グループは、2010年10月1日から持株会社制を導入しており、当社、連結子会社10社により構成されております。
                      - paragraph [ref=e995]: なお、当社は特定上場会社等に該当し、インサイダー取引規制の重要事実の軽微基準のうち、上場会社の規模との対比で定められている数値基準について連結ベースの計数に基づいて判断することとなります。
                      - paragraph [ref=e996]: 当社グループが営んでいる主な事業内容と、当該事業に係る位置付けは、事業の種類別セグメント情報における事業区分によれば次のとおりであります。
                      - paragraph [ref=e997]
                      - paragraph [ref=e998]: 流通事業
                      - paragraph [ref=e999]: 「井村屋(株)」が製造販売するほか、同社製品の一部については、製造を「井村屋フーズ(株)」に委託しております。また中国国内においては北京市所在の「井村屋(北京)食品有限公司(IBF)」が菓子、点心・デリ商品の販売及び日本からの輸入商品の販売を行っており、菓子商品については、製造を大連市所在の「井村屋(大連)食品有限公司(IDF)」に委託しております。また「井村屋(大連)食品有限公司(IDF)」において、菓子の輸出販売を行っております。米国カリフォルニア州アーバイン市所在の「IMURAYA USA, INC.」ではアメリカ国内における冷菓の製造販売及び日本及び中国からの輸入商品の販売を行っております。加えて、「スイーツ」カテゴリーとして、「Anna Miller’s(アンナミラーズ)」「JOUVAUD(ジュヴォー)」のブランドを活かした流通商品化の取り組み及びサービスの提供を行っております。
                      - paragraph [ref=e1000]: また、「IMURAYA MALAYSIA SDN. BHD.(IMM)」はマレーシア国内で製造委託した冷菓の販売を行っております。ASEAN市場での開拓を目指しております。
                      - paragraph [ref=e1001]
                      - paragraph [ref=e1002]: 調味料事業
                      - paragraph [ref=e1003]: 「井村屋フーズ(株)」が各種調味料素材を製造・販売しております。また、中国大連市に設立している「井村屋(大連)食品有限公司(IDF)」では粉末調味料の製造を行う他に、「井村屋フーズ(株)」の製造受託を行っており、中国北京市に設立している「北京京日井村屋食品有限公司(JIF)」では、委託加工した調味料の販売を行っております。
                      - paragraph [ref=e1004]
                      - paragraph [ref=e1005]: その他事業
                      - paragraph [ref=e1006]: 「イムラ(株)」がリース代理業を営み、当社との賃貸住宅ヴィルグランディールの管理業務等を行っております。また、当社が自社所有の土地を活用した不動産の賃貸を営んでおります。中国北京市所在の「井村屋(北京)企業管理有限公司(ICM)」は、中国事業会社全体の管理及び支援等を行っております。
                      - paragraph [ref=e1007]: 「井村屋スタートアッププランニング(株)」は井村屋グループの将来の柱と成る事業を創出することを目的とし、新規事業の企画、事業化に関する総合的な支援を行っております。
                      - paragraph [ref=e1008]: 以上を、事業系統図によって示しますと次のとおりであります。
                      - paragraph [ref=e1009]
