                      - paragraph [ref=e1057]
                      - heading "3 【事業の内容】" [level=3] [ref=e1058]
                      - paragraph [ref=e1059]: 当社グループは、総合食肉企業集団を目指して食肉流通の川上から川下領域まで一貫した食肉サプライ・チェーンを構築しております。現在、企業集団は、当社と連結子会社36社、持分法適用関連会社1社及びその他の関係会社1社で構成され、食肉生産及び食肉製品の製造並びに食肉商品の卸販売を主たる事業領域とする「食肉等の製造・卸売事業」と食肉製品・商品の一般消費者向け販売を主たる事業領域とする「食肉等の小売事業」及び肉料理の一般消費者向けサービスを主たる事業領域とする「食肉等の外食事業」を主な内容とし、事業展開を行っております。当社グループの当該事業における位置づけは次の通りです。なお、セグメントと同一の区分であります。
                      - paragraph [ref=e1060]: 食肉等の製造・卸売事業...食肉流通の川上及び川中領域
                      - paragraph [ref=e1061]: 食肉の生産事業は、連結子会社エスファーム(株)、(株)北海道中央牧場及び(株)日高食肉センターなどが、当社向け国産肉牛及び豚の肥育・加工事業を行っております。
                      - paragraph [ref=e1062]: 食肉製品の製造事業は、当社、連結子会社AURORA PACKING COMPANY,INC.、FREMONT BEEF COMPANY、(株)味兆、(株)エムアンドエム食品、(株)デリフレッシュフーズ及び(株)フードリエなどが製造し販売しております。
                      - paragraph [ref=e1063]: 食肉商品の卸販売事業は、当社、連結子会社(株)ヒョウチク及びその他の関係会社丸紅(株)などが事業者に販売しております。
                      - paragraph [ref=e1064]: 食肉等の小売事業...食肉流通の川下領域
                      - paragraph [ref=e1065]: 連結子会社(株)オーエムツーミート、(株)マルチョウ神戸屋及びオオタ総合食品(株)が行っております。
                      - paragraph [ref=e1066]: 食肉等の外食事業...食肉流通の川下領域
                      - paragraph [ref=e1067]: 連結子会社(株)焼肉の牛太、(株)オーエムツーダイニング及び(株)雄和が行っております。
                      - paragraph [ref=e1068]: その他事業(冷蔵倉庫業等)...食肉流通に属さない事業領域
                      - paragraph [ref=e1069]: その他事業として、主に連結子会社(株)東冷が冷蔵倉庫業を行っております。
                      - paragraph [ref=e1070]: 事業の系統図は次のとおりであります。
                      - paragraph [ref=e1071]
                      - paragraph [ref=e1073]: （画像は省略されました）
                      - paragraph [ref=e1074]: ※1. 連結子会社
                      - paragraph [ref=e1075]: ※2. その他の関係会社
