                      - paragraph [ref=e1077]: ※4. AURORA PACKING COMPANY,INC.及びFREMONT BEEF COMPANYからは、その他の関係会社丸紅(株)を通じた間接仕入を行っております。
                      - paragraph [ref=e1078]: ※5. (株)オーエムツーネットワークは、(株)東京証券取引所(スタンダード市場)に上場いたしております。
                      - paragraph [ref=e1079]: ※6. (株)オーエムツーネットワークの連結子会社は、(株)オーエムツーミート、(株)焼肉の牛太、(株)オーエムツーダイニング、(株)マルチョウ神戸屋、オオタ総合食品(株)、(株)雄和の6社であり、(株)オーエムツーミート及び(株)マルチョウ神戸屋及びオオタ総合食品(株)は食肉を中心とした食肉の小売を主たる事業とし、(株)焼肉の牛太及び(株)オーエムツーダイニング及び(株)雄和はレストラン経営を主たる事業としております。
