                      - paragraph [ref=e1103]
                      - heading "3 【事業の内容】" [level=3] [ref=e1104]
                      - paragraph [ref=e1105]: 当社グループは、当社及び当社の子会社7社で構成され、セグメントとの関連は次のとおりであります。
                      - paragraph [ref=e1106]
                      - paragraph [ref=e1107]: (1) 酒類事業
                      - paragraph [ref=e1108]:
                        - text: 当事業に係る連結子会社は6社であり、焼酎、チューハイ、清酒、合成清酒、梅酒、洋酒、加工用洋酒、酒類原料用アルコール・工業用アルコール等の販売及び運送・荷役を行っております。
                        - text: 焼酎、チューハイ、清酒、合成清酒、梅酒、洋酒、製菓用洋酒については、主として合同酒精(株)、福徳長酒類(株)、秋田県醗酵工業(株)、オエノンプロダクトサポート(株)が製造し、合同酒精(株)、福徳長酒類(株)、秋田県醗酵工業(株)、オエノンプロダクトサポート(株)、(株)ワコーが主として販売しております。
                        - text: 運送・荷役は、ゴーテック(株)が行っております。
                      - paragraph [ref=e1109]
                      - paragraph [ref=e1110]: (2) 酵素医薬品事業
                      - paragraph [ref=e1111]: 当事業に係る連結子会社は1社であり、酵素、診断薬の販売及び発酵受託ビジネスを行っております。
                      - paragraph [ref=e1112]: いずれも、合同酒精(株)が製造し、販売しております。
                      - paragraph [ref=e1113]
                      - paragraph [ref=e1114]: (3) 不動産事業
                      - paragraph [ref=e1115]: 当社のほか、当事業に係る連結子会社は3社であり、不動産の売買及び賃貸を行っております。
                      - paragraph [ref=e1116]: 不動産の売買及び賃貸については、当社、合同酒精(株)、オエノンプロダクトサポート(株)、(株)オエノンアセットコーポレーションが行っております。
                      - paragraph [ref=e1117]
                      - paragraph [ref=e1118]: (4) その他
                      - paragraph [ref=e1119]: 倉庫業・荷役業については、ゴーテック(株)が行っております。
                      - paragraph [ref=e1120]
                      - paragraph [ref=e1121]
                      - paragraph [ref=e1122]: (事業系統図)
                      - paragraph [ref=e1123]: 事業の系統図は次のとおりであります。
                      - paragraph [ref=e1124]: なお、下記に挙げる会社は全て連結子会社であります。
