                      - heading "3 【事業の内容】" [level=3] [ref=e828]
                      - paragraph [ref=e829]: 当社の事業内容は、チェーンストアとして広島、岡山、香川、愛媛、徳島、兵庫及び山口商勢圏(瀬戸内沿岸部)に配置した店舗において24時間営業を主体にした食品スーパーマーケットを営む流通小売業であります。
                      - paragraph [ref=e830]: 2025年2月28日現在、107店舗(広島県32店舗、岡山県27店舗、香川県15店舗、愛媛県9店舗、徳島県9店舗、兵庫県13店舗、山口県2店舗)を運営しており、今後もドミナント出店(一定の地域に集中的に出店すること。)を継続してまいります。出店形態は24時間営業の売場面積600坪型及び450坪型の食品スーパーマーケットを核として異業種と複合化したオープンモール型のNSC(近隣購買型ショッピングセンター)を主力業態としております。
                      - paragraph [ref=e831]: 立地は、商圏人口3万人を基準とし、サバブ(郊外住宅地域)、又はアーバン(都市住宅地域)に出店しております。敷地面積は、2,000坪から10,000坪を目安とし、駐車台数は売場面積3坪に対して1台以上確保することを基本にしております。
                      - paragraph [ref=e832]: 主な販売品目は、青果、鮮魚、惣菜、精肉、デイリー、一般食品、菓子、酒類及び雑貨等であります。
                      - paragraph [ref=e833]: 季節の上位品目の豊富な品揃え、広く停めやすい駐車場やストレスを感じさせない高い天井等により明るく快適な店づくりを推進しております。
                      - paragraph [ref=e834]: 当社は、商品小売事業の単一セグメントのため、セグメント別の区分はしておりません。
                      - paragraph [ref=e835]: 事業の系統図は、次のとおりであります。
