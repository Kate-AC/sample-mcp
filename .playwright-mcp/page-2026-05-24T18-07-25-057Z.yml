                      - heading "3 【事業の内容】" [level=3] [ref=e982]
                      - paragraph [ref=e983]: 当社グループ(当社および関係会社)は、円谷フィールズホールディングス株式会社(以下「当社」という。)、子会社39社、関連会社7社により構成されています。
                      - paragraph [ref=e984]: 当社グループの事業に係る位置付けならびに事業の系統図は、以下のとおりです。
                      - paragraph [ref=e985]
                      - paragraph [ref=e986]: 各セグメントの概要は以下のとおりです。
                      - paragraph [ref=e987]: なお、当連結会計年度より、従来「PS事業」としていたセグメント名称を「アミューズメント機器事業」に変更しています。
                      - paragraph [ref=e989]: （画像は省略されました）
                      - paragraph [ref=e990]
                      - paragraph [ref=e991]: "[コンテンツ&デジタル事業]"
                      - paragraph [ref=e992]: 「ウルトラマン」などのIPを保有し、グローバルにライセンスビジネスを展開する(株)円谷プロダクションと国内最大規模のCG・VFX映像制作を手掛ける(株)デジタル・フロンティアを中心に事業を展開しています。
                      - paragraph [ref=e993]
                      - paragraph [ref=e994]: "[アミューズメント機器事業]"
                      - paragraph [ref=e995]: フィールズ(株)を中核に、取得・保有IPを基に提携メーカーへ企画・開発提案し、商品化された遊技機を全国のパーラーに販売するとともに、プライベートブランド遊技機の製造販売も行っています。また、(株)エース電研では、パーラー向け周辺設備機器の販売・工事等も行っています。
                      - paragraph [ref=e996]
