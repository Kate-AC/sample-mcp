                  - generic [ref=e1193]:
                    - generic [ref=e1194] [cursor=pointer]: 続きを読む
                    - generic [ref=e1195]:
                      - heading "3【事業の内容】" [level=3] [ref=e1196]
                      - paragraph [ref=e1197]: 当社グループは、純粋持株会社制を導入しており、当社、連結子会社23社及び持分法適用関連会社5社及び主要な持分法非適用会社2社で構成されております。当社は、持株会社として、グループの経営戦略の策定・推進、グループ経営の統括・管理・監査を行っておりますが、有価証券の取引等の規制に関する内閣府令第49条第2項に規定する特定上場会社等に該当しており、これにより、インサイダー取引規制の重要事実の軽微基準については連結ベースの数値に基づいて判断することとなります。当社グループの主な事業内容と各社の当該事業における位置付けは、次のとおりであり、「第5経理の状況 1連結財務諸表等 (1)連結財務諸表 注記事項」に掲げるセグメントの区分と同一であります。
                      - paragraph [ref=e1198]
                      - paragraph [ref=e1199]: ◆アジア事業
                      - paragraph [ref=e1200]: "[産業資材事業]"
                      - paragraph [ref=e1201]: 国内において、主に連結子会社のクリヤマジャパン(株)が農機・建機向け工業用ゴム製品や工業用樹脂製品、船舶向けデッキコンポジション、プラント向けゴム製エキスパンション等の販売並びに設置・施工を行っております。(株)サンエーは、農機・建機向けに排ガス規制に対応する尿素SCRセンサーの設計・開発・製造を行っており、クリヤマジャパン(株)は、(株)サンエーが取り扱う尿素SCR用モジュールをタンクにアッセンブリー加工し、農機・建機メーカー向けに販売しております。持分法適用関連会社王子ゴム化成(株)は工業用ゴム製品・工業用樹脂製品等の製造販売を行っており、クリヤマジャパン(株)に商品を供給しております。中国においては、上海栗山貿易有限公司が工業用ゴム製品や工業用樹脂製品を仕入れ、中国の農機・建機向けに販売している他、クリヤマジャパン(株)及びKuriyama of America,Inc.へも製品を供給しております。
                      - paragraph [ref=e1202]: (株)ミトヨは、工業用ゴム、樹脂製品等の開発・製造・販売を行っており、クリヤマジャパン(株)へ樹脂製タンクを供給しております。上海三豊杉栄商貿有限公司は、自動車部品等の販売を行っております。
                      - paragraph [ref=e1203]: Mitoyo Rubber(Thailand) Co., Ltd.は、ゴム製品を製造しており、Mitoyo Plastics(Thailand) Co., Ltd.へ製品を供給しております。Mitoyo Plastics(Thailand) Co., Ltd.は、樹脂製品の製造・販売を行っております。
                      - paragraph [ref=e1204]: また、持分法適用関連会社の靖江王子橡膠有限公司は工業用ゴム製品や工業用樹脂製品の製造販売を行い、その一部を連結子会社の上海栗山貿易有限公司に供給しております。
                      - paragraph [ref=e1205]: "[スポーツ・建設資材事業]"
                      - paragraph [ref=e1206]: クリヤマジャパン(株)がスポーツ施設・橋梁・港湾・歩道橋・鉄道施設・大型商業施設等の建設に使用される「モンドトラック」(全天候型ゴム製トラック)・「タラフレックス」(弾性スポーツシート)・ゴム支承・ゴム防舷材・「エーストン」(ノンスリップタイル・点字タイル)・「スーパー・マテリアルズ」(大判セラミックタイル)・高欄等のスポーツ・建設資材の販売並びに設置・施工を行っております。
                      - paragraph [ref=e1207]:
                        - text: "[その他事業]"
                        - text: 連結子会社のクリヤマプリージア(株)が、ダストコントロール用マット等の販売・不動産管理を行っております。
                      - paragraph [ref=e1208]: ◆北米事業
                      - paragraph [ref=e1209]: 北米において、連結子会社のKuriyama of America,Inc.、Kuri Tec Corporation及びAccuflex Industrial Hose,Ltd.(米国)が、また中南米においては、Kuriyama de Mexico,S.de R.L.de C.V.及びKuriyama Services,S.de R.L. de.C.V.が各種産業用ホースや継手等の販売を行っております。これら販売子会社の商品の大部分は、連結子会社Kuriyama Canada Inc.、Accuflex Industrial Hose,Ltd.(カナダ)、Kuri Tec Manufacturing,Inc.及びPiranha Hose Products,Inc.並びに持分法適用関連会社のTigerflex Corporationから供給されています。
                      - paragraph [ref=e1210]: ◆欧州・南米・オセアニア事業
                      - paragraph [ref=e1211]: 欧州及び南米地域では、Técnicas e Ingeniería de Protección, S.A.U.(スペイン)並びにIndustrias Quilmes S.A.U.(アルゼンチン)が、レイフラットホース・継手・消防用ホース・ノズルを製造販売しております。オセアニア地域では、Kuriyama Australia Pty Ltd.が産業用ホースの販売をしております。
                      - paragraph [ref=e1212]
