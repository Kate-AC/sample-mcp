                      - heading "3【事業の内容】" [level=3] [ref=e834]
                      - paragraph [ref=e835]: 当社グループは、当社、子会社6社(MEIJI CORPORATION、MEIJI UK LTD.、名電エンジニアリング株式会社、明治電機商業(上海)有限公司、Meiji(Thailand) Co.,Ltd.、MEIJIDENKI INDIA PRIVATE LIMITED)及び関連会社2社(株式会社KYOTSU、株式会社アドバン・テック)で構成されており、当社の第1~第5営業本部、ソリューション事業本部、MEIJI CORPORATION及びMEIJI UK LTD.で、制御機器、産業機器、計測機器等の販売を、当社エンジニアリング事業本部で、産業機器として検査装置、生産支援システムなど自社開発製品の設計、製造等を、主な事業としております。
                      - paragraph [ref=e836]: 当社グループは単一セグメントのためセグメント情報を記載しておりませんので、品目別の主な取扱商品を次に記載しております。
