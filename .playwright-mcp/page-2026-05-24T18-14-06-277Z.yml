                      - paragraph [ref=e874]
                      - paragraph [ref=e875]: 当社グループは、上記の商品を、ユーザーの商品開発、生産技術、設備保全、購買などの部門に対し、単なる商社活動だけでなく、FAエンジニアリング力を駆使したシステム提案の形で営業活動を行い、販売に結び付けております。
                      - paragraph [ref=e876]: 商品は、仕入先メーカーの標準品が中心となっておりますが、自社内のエンジニアリング事業本部に加え、名電エンジニアリング株式会社、株式会社アドバン・テック及び豊富な外注先において、設計、製造を行い、個別ニーズに対応できる体制を整備しております。
                      - paragraph [ref=e877]: また、特定分野については、必要とするソフトウェア開発を行う機能とともに、保守、修理等を行う機能も保有しており、ユーザーの幅広いニーズに応えるように努めております。
                      - paragraph [ref=e878]: 1 国内営業体制について
                      - paragraph [ref=e879]: 当社では、第1~第5営業本部及びソリューション事業本部において、地域に根差した活動を行うとともに、新商材・新規顧客の開発を図るなど、商社の原点に立ち返った営業展開を行っております。また、分野別のメーカー代行型セールスエンジニア部門とシステム案件に対応する部門を有し、顧客へのソリューション提供並びにニーズに対応したシステムアップを行うことを目的に、活動をしております。
                      - paragraph [ref=e880]: また、エンジニアリング事業本部では、個別ニーズに対応したシステム商品の設計、製造を行っており、顧客の生産現場における多種多様なニーズに、機敏に応えられる活動を行っております。
                      - paragraph [ref=e881]: 2 取扱商品について
                      - paragraph [ref=e882]: 当社グループでは、日本を代表する数多くのFA機器メーカーと強固なパイプを持ち、多彩な有力商品の中から顧客が必要とするものを、ベストチョイスで提供できる環境を整えております。
                      - paragraph [ref=e883]: 中でも、オムロン株式会社、横河電機株式会社、シュナイダーエレクトリックホールディングス株式会社、パナソニックグループ各社、日置電機株式会社、CKD株式会社など、大手電気機器メーカーの代理店として、太い商流を確保しており、Quality、Cost、Deliveryに係る顧客ニーズを的確に満たせるよう努めております。
                      - paragraph [ref=e884]: 3 業務管理体制について
                      - paragraph [ref=e885]: 当社グループでは、物流のシステム化を、営業戦略と同レベルに位置付けて、積極的に推進してまいりました。倉庫を一ヶ所に集約し、倉庫業務品質の改善、在庫管理の徹底、関連コストの低減等を図っております。
                      - paragraph [ref=e886]: また、注文を受けた翌日には商品をお届けする1-Day Deliveryの体制も構築し、顧客満足度の向上に努めております。
                      - paragraph [ref=e887]: 4 海外営業体制について
                      - paragraph [ref=e888]: 当社グループの海外営業は、海外進出した国内取引先の現地におけるニーズに応えることを主な目的としており、トヨタ自動車株式会社及び関連各社をはじめとする海外工場をターゲットに拠点展開を行い、現地の幅広いニーズに対し、きめ細かな対応を行っております。
                      - paragraph [ref=e889]: 事業の系統図は、次のとおりであります。
