                      - heading "3 【事業の内容】" [level=3] [ref=e829]
                      - paragraph [ref=e830]: 当社グループ(当社及び当社の関係会社)は、当社及び連結子会社である株式会社ヤグミ、株式会社池田工務店、株式会社ITABASHI、Kisaragi Global Link協同組合及び広東日信創富建築新材料有限公司の計6社で構成されており、主に仮設資材、物流機器を中心とした金属製品の製造・販売及び仮設施工工事を行っております。
                      - paragraph [ref=e831]: 当社グループの報告セグメントは仮設資材及び物流機器の製造・販売事業の単一セグメントとしておりますが、「仮設資材部門」「物流機器部門」の別で説明します。
                      - paragraph [ref=e832]
                      - heading "<仮設資材部門>" [level=4] [ref=e833]
                      - paragraph [ref=e834]: 仮設資材部門では、建設現場などで使用される仮設資材の製造・販売を主軸に、仮設資材のレンタルサービス、仮設施工工事を行っております。
                      - paragraph [ref=e835]: 建設現場で用いられる仮設足場は、主に低層~中層用で使用されるシステム足場(注)(くさび緊結式足場)と中層~高層用で使用されるシステム足場(次世代足場)並びに、主に高層用や大規模施設等で使用される枠組足場の3種類に大別されますが、当事業においては、主にシステム足場(くさび緊結式足場・次世代足場)の製造・販売を行っております。
                      - paragraph [ref=e836]: (注)システム足場とは、「くさび緊結式足場」と「次世代足場」の総称です。
                      - paragraph [ref=e837]
                      - paragraph [ref=e838]: 門型の建枠にジャッキベース・交差筋かい・踏板等の基本部材を組み合わせ、積み上げていく枠組足場と比べ、システム足場は各製品(支柱、手すり、踏板等)が軽量かつシンプルな形状であるため、熟練したとび職でなくとも施工が容易という特徴があります。またコンパクトに結束できるため、現場への輸送効率が良く、保管場所も少なくて済むという特徴があります。さらには、ハンマーを使用して、くさびを緊結するだけであるため、ボルト締め等の作業が不要であり、枠組足場よりも施工効率が高く、短期間で施工できる特徴があります。
                      - paragraph [ref=e839]
                      - paragraph [ref=e840]: 当社が調査依頼した仮設資材市場調査報告書(2021年12月調査実施・非公表)によると、当社が提供する「システム足場」は、2020年度の出荷金額ベースで市場シェア1位となっております。
                      - paragraph [ref=e841]
                      - heading "・くさび緊結式足場「シンワキャッチャー」について" [level=4] [ref=e842]
                      - paragraph [ref=e843]: 当社の取り扱うくさび緊結式足場の「シンワキャッチャー」は、主に支柱、手すり、ジャッキベース、ブラケット、踏板から構成されております。
