                      - paragraph [ref=e932]: 物流機器部門では、主に工場、倉庫、建設現場における物品の保管・搬送等に使用される物流機器の製造・販売を行っております。
                      - paragraph [ref=e933]: 用途に合わせて様々な製品を製造しており、自動車部品、液晶パネル用ガラス等の保管・搬送用パレット及びスチールラックといった物品保管用の物流機器を、顧客の要望に基づいて企画設計・提案・試作・製造・納品をし、顧客のニーズに最も適した製品を提供できるよう努めております。
