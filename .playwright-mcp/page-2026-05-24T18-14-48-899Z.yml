                      - paragraph [ref=e887]
                      - paragraph [ref=e888]: シンワキャッチャー製品においては、既存の顧客に対するリレーションを保ちつつ、新規顧客に対しては、高い施工性や製品・サービスの豊富なラインナップを活かした幅広い提案、丁寧な営業活動を行うことで、新規顧客の獲得に努めております。また次世代足場「SPS(サイレントパワーシステム)」により、次世代足場市場でのシェア拡大を目指しております。
                      - paragraph [ref=e889]
                      - heading "・次世代足場「SPS(サイレントパワーシステム)」について" [level=5] [ref=e890]
                      - paragraph [ref=e891]: 「SPS」は、当社の開発した次世代足場製品であります。次世代足場は、従来の枠組足場における寸法規格であるインチサイズに準拠して作られており、寸法感は枠組足場である一方、くさび緊結式足場と同様に組み立て式となっており、各製品(支柱、手すり等)が軽量かつシンプルな形状となっております。くさび緊結式足場と比較したときの大きな特徴は、手すりに抜け止め機能を有しているほか、支柱本体にロック機能が備わっており、高所作業における安全性・安定性を高めた製品であります。
                      - paragraph [ref=e892]: また、「SPS」は軽量な樹脂ハンマーを使用して組み立てることが可能であるため、組立時や解体時における騒音が少なく、マンション等の住宅街の工事における騒音対策に配慮されているほか、従来のくさび緊結式足場では踏板に段差が生じていたところ、次世代足場においては支柱ポケットの構造上、段差が生じないため、より安全性が高いという点にも特徴があります。
