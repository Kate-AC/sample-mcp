                    - generic [ref=e999]:
                      - heading "3【事業の内容】" [level=3] [ref=e1000]
                      - paragraph [ref=e1001]: 当社グループは、当社、当社の子会社9社(連結子会社9社)及び関連会社5社(持分法適用会社3社、持分法非適用会社2社)の計15社によって、2つのセグメントを構成しています。ひとつは、政策や一般事業に関する調査研究及びコンサルティングを実施する「シンクタンク・コンサルティングサービス」で、もうひとつは、ソフトウェア開発・運用・保守、情報処理・アウトソーシングサービスを実施する「ITサービス」です。
                      - paragraph [ref=e1002]
                      - paragraph [ref=e1003]: シンクタンク・コンサルティングサービス
                      - paragraph [ref=e1004]: 当社は設立以来、総合シンクタンクとして培った政策・制度知見、社会的課題の発見・分析力、次世代先端技術に関する幅広い知識と科学技術分野を専門とする研究員の定量分析評価技術や予測技術等の解析力を活かした、調査研究・コンサルティングサービスを提供しております。
                      - paragraph [ref=e1005]: 官公庁向けには、国土整備、交通運輸、情報通信、地域経営、医療介護福祉、教育等の社会公共分野と環境、資源・エネルギー、科学技術・安全政策等の科学技術政策分野において、調査・分析、政策・計画策定、コンサルティング並びに事業支援を行っております。
                      - paragraph [ref=e1006]: 民間企業向けには、経営・事業戦略、マーケティング戦略、人事制度・組織改革、サステナビリティ経営、業務革新等のコンサルティングや事業競争力強化を実現するITコンサルティングを行っております。
                      - paragraph [ref=e1007]
                      - paragraph [ref=e1008]: (主な会社名)
                      - paragraph [ref=e1009]: 当社及び連結子会社であるエム・アール・アイビジネス株式会社、エム・アール・アイリサーチアソシエイツ株式会社、株式会社MPX、MRIA International Inc.、MRIV International LLC、持分法適用会社である株式会社日本ケアコミュニケーションズ、日本ビジネスシステムズ株式会社、株式会社アイネス
                      - paragraph [ref=e1010]
                      - paragraph [ref=e1011]: ITサービス
                      - paragraph [ref=e1012]: 連結子会社である三菱総研DCS株式会社が中核となり、シンクタンク・コンサルティングサービスで培った知見や先端的なICTを活用し、金融、製造、流通、サービス、文教等の各分野においてソフトウェア開発・運用・保守、情報処理・アウトソーシングサービスを行っております。また、ITを活用したマネジメントシステム革新やインターネットを活用したビジネスモデル革新等の分野において、経営のIT化を上流から下流までトータルに支援するサービスを提供しております。
                      - paragraph [ref=e1013]: アウトソーシングサービスは、三菱総研DCS株式会社が提供する給与人事サービス「PROSRV」を主力とした情報処理サービスや千葉情報センターを利用した基幹システムのアウトソーシング・BPO(*)を行っております。
                      - paragraph [ref=e1014]
                      - paragraph [ref=e1015]: (*) Business Process Outsourcing:人事、経理、給与計算関係等の業務プロセスの一部を外部専門企業に委託する
                      - paragraph [ref=e1016]: こと。
                      - paragraph [ref=e1017]
                      - paragraph [ref=e1018]: (主な会社名)
                      - paragraph [ref=e1019]: 連結子会社である三菱総研DCS株式会社、MRIバリューコンサルティング・アンド・ソリューションズ株式会社、株式会社MDビジネスパートナー、株式会社アイ・ティー・ワン
