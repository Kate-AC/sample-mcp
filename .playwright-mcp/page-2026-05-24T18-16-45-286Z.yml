                      - paragraph [ref=e1078]
                      - paragraph [ref=e1079]: 2.各業務の概要
                      - paragraph [ref=e1080]: 当社グループは、評価コンサル、システム設計・開発、システム提供、保守、運用サービスといったフェーズからなる、顧客の一連のITライフサイクルに対し、一貫してサービスを提供するワンストップトータルソリューション(※)を提供しており、各フェーズにおいて、「情報処理・通信サービス」「ソフトウェア開発・システム提供サービス」「システム機器販売等」「その他関連サービス」といった業務を行っております。
                      - paragraph [ref=e1081]: 以上を概念図で示すと以下のとおりとなります。
                      - paragraph [ref=e1082]
                      - paragraph [ref=e1083]: （画像は省略されました）
                      - paragraph
                      - paragraph [ref=e1084]
                      - paragraph [ref=e1085]: 各業務の概要は以下のとおりであります。
                      - paragraph [ref=e1086]: なお、主要な取引先は、長野県・新潟県及び首都圏を中心に、全国の地方公共団体、民間企業、金融機関及び医療機関、諸団体等であります。
                      - paragraph [ref=e1087]: (1) 情報処理・通信サービス
                      - paragraph [ref=e1088]: 1 情報処理サービス
                      - paragraph [ref=e1089]: 当社のコンピューターシステムによる受託計算処理・オンライン処理、データ入力業務及びシステム運用管理業務を行っております。
                      - paragraph [ref=e1090]: 2 インターネットサービス
                      - paragraph [ref=e1091]: 長野県内の地方公共団体、民間企業及び一般個人を対象に、「avis」という名称でインターネットサービスプロバイダ事業を行っており、電話回線や光回線だけでなく、ケーブルテレビ会社と連携し、ケーブルテレビの回線を利用したインターネット接続サービスも提供しております。
                      - paragraph [ref=e1092]: 3 データセンターサービス
                      - paragraph [ref=e1093]: 強固なセキュリティマネジメントシステム、震度7クラスの地震から機器を守る耐震免震構造、24時間365日有人による運用・監視体制を備えたデータセンターによるハウジング(※)サービス、ホスティング(※)サービス、ASP(※)(アプリケーションサービスプロバイダ)サービス、運用・監視サービス等を行っております。また、バックアップサービス、仮想サーバーサービス、ファイル共有サービス、クラウド文書保管サービス等のクラウドサービス(※)も提供しております。なお当社は、2022年3月4日付でクラウドサービスの情報セキュリティに関する国際規格「ISO/IEC 27017」に基づいたISMSクラウドセキュリティ認証を取得しております。
                      - paragraph [ref=e1094]
                      - paragraph [ref=e1095]: (2) ソフトウェア開発・システム提供サービス
                      - paragraph [ref=e1096]: 1 ソフトウェア開発
                      - paragraph [ref=e1097]: ソフトウェアの受託開発、ソフトウェア保守サービス、コンテンツ制作サービス等を行っております。
                      - paragraph [ref=e1098]: 主に民間企業を対象に、システムの企画から設計、開発、運用、保守まで、長年蓄積された業務ノウハウとシステム構築力によりシステムインテグレーション(※)サービスを提供しております。
                      - paragraph [ref=e1099]: 2 システム提供サービス
                      - paragraph [ref=e1100]: 当社グループの主力商品である総合行政情報システム「Reams」等、主に地方公共団体向けのパッケージシステムを開発・販売するとともに、付随するシステム運用支援サービス、プロダクトソフト(※)保守サービス等を提供しております。また、業務系SE・技術系SE・サポート要員を自社で育成し、きめ細かいサービスを提供しております。特に、地方公共団体向けの「Reams」は、自社開発のパッケージシステムであるため、頻繁な法制度改正に対して迅速なシステム変更が可能です。各種情報処理サービス等のアウトソーシングを含めた総合的なメニューでサービスを提供し、国が定める標準仕様に準拠しております。
                      - paragraph [ref=e1101]: その他自社開発パッケージシステムとしては、リース業務パッケージ、販売管理システム「AltusII」、広告管理システム、AI外観検査システム「Observe AI」、総合健診システム「C&I PREST」、IVF(※)管理システム「wish」等があります。また、病院総合情報システム、生産管理システム「mcframe」、ナレッジマネジメント(※)システム「SmartKMS」、AIチャットボットサービス「SmartRobot」等の販売も行っております。
                      - paragraph [ref=e1102]: なお、公共分野の業務別売上高構成比率と商品の特徴、産業分野の業務別売上高構成比率と主力商品及び特徴については、「4.主力商品の売上高比率とその特徴」を参照ください。
                      - paragraph [ref=e1103]
                      - paragraph [ref=e1104]: (3) システム機器販売等
                      - paragraph [ref=e1105]: ソフトウェア開発やシステム提供サービスに付随する機器やシステムの販売及び帳票等の用品販売を行っております。
                      - paragraph [ref=e1106]
                      - paragraph [ref=e1107]: (4) その他関連サービス
                      - paragraph [ref=e1108]: 1 その他システム関連サービス
                      - paragraph [ref=e1109]: その他、自社による機器保守サービスやLAN構築等のシステム環境構築サービス、コンピューター関連の教育研修サービス等を行っております。
                      - paragraph [ref=e1110]: 2 機器賃貸・保守サービス
                      - paragraph [ref=e1111]: システム機器の賃貸サービス、外部委託による機器システム保守サービスを行っております。
                      - paragraph [ref=e1112]
                      - paragraph [ref=e1113]: 3.サービス・販売拠点、提携パートナーについて
                      - paragraph [ref=e1114]: 当社は全国約450の地方公共団体及び関連する諸団体を中心に、民間企業及び諸団体等に各種サービスを提供していますが、広範囲のお客様と当社を結ぶネットワークを維持するため、各支社(合計6拠点)とサポートサービスセンター(合計4拠点)を設置しております。専任の担当者がお客様を訪問し、当社システムの導入・運用支援を行っており、常に「利用者の立場」を意識し地域密着型のサービスを展開しています。
                      - paragraph [ref=e1115]: さらに、全国レベルで事業展開を行うために、本社及び支社による直接販売のほかに、子会社と連携した提案活動や、提携パートナー(販売提携契約を締結している全国各地域の販売提携企業)による販売を行っており、販路拡大の推進を図っております。
                      - paragraph [ref=e1116]: なお、支社は、各地域における営業拠点であり、サポートサービスセンターは、システムの運用サポートや保守サポート等を行う出先機関であります。
