                        - paragraph [ref=e1294]
                      - paragraph [ref=e1295]
                      - paragraph [ref=e1296]: ネットリサーチは、以下の特徴を有しております。
                      - paragraph [ref=e1297]: サポート体制
                      - paragraph [ref=e1298]: セールス、リサーチャー、ディレクターなど顧客と接する全ての担当者が課題解決に向けてお手伝いする、充実したサポート体制を組んでいます。
                      - paragraph [ref=e1299]: クオリティ
                      - paragraph [ref=e1300]: 「回答負荷軽減を意識した画面づくり」「的確なターゲット選定のための配信設定」「精度の高いデータクリーニング」を実施し、高いクオリティを維持しています。
                      - paragraph [ref=e1301]: スピード
                      - paragraph [ref=e1302]: 高機能なアンケートシステムのため、画面作成・配信・データ納品までスピーディに対応。お急ぎのアンケートなど最短24時間で納品します。
                      - paragraph [ref=e1303]: モニター
                      - paragraph [ref=e1304]: 1,410万人(提携パネルを含む)の国内最大規模のアンケートモニターが利用可能。モニターは、基本属性だけでなく、シニア/携帯電話利用/自動車保有/化粧品利用といった約20のカテゴリーに分類されています。対象者を限定した調査もスムーズに実施します。
                      - heading "3 顧客について" [level=5] [ref=e1305]
                      - paragraph [ref=e1306]: 調査結果の最終ユーザーは一般事業会社等ですが、その受注経路は、調査会社・コンサルティング会社・広告代理店を通じて受注する場合と、直接に一般事業会社等から受注する場合とがあります。
                      - paragraph [ref=e1307]
                      - heading "4 登録モニターについて" [level=5] [ref=e1308]
                      - paragraph [ref=e1309]: モニター管理会社である(株)リサーチパネルは、当社グループからの依頼に基づいて登録モニターにアンケートへの参加を依頼し、回答者に対する謝礼の支払いや、登録モニターの基本属性のメンテナンスを行うなど、アンケート回答における登録モニターとの窓口業務を行います。当社グループはモニター管理会社に対して、登録モニター利用の対価であるモニター募集委託手数料を支払っております。
                      - paragraph [ref=e1310]: 当社グループは、主に関連会社である(株)リサーチパネルの保有するアンケート専門データベースに登録されたモニターをアンケート回答者として利用しております。一般のインターネット利用者のモニター登録誘導は、会員制サイト運営会社により行われております。主な会員制サイト運営会社は、(株)リサーチパネルの親会社である(株)CARTA HOLDINGS(旧:(株)VOYAGE GROUP)と(株)クレディセゾンであります。(株)CARTA HOLDINGS(旧:(株)VOYAGE GROUP)は、インターネットで販売されているさまざまな商品の情報を提供する、総合オンラインショッピングサイト「ECナビ」を運営しており、自社の会員を(株)リサーチパネルに会員登録するよう勧誘を行っております。また、(株)クレディセゾンとは、同社の会員の中でアンケートへの参加を希望する会員を、(株)リサーチパネルが運営する「永久不滅リサーチ」登録モニターとして利用する契約を締結し運営を行っております。その他、海外調査を専業とするネットリサーチ企業の利用など登録モニターのネットワークを積極的に拡大しております。
                      - paragraph [ref=e1311]: (株)リサーチパネルでは、会員登録情報を毎年更新することで、登録モニターの基本属性を最新の状態にすることに努め、また、個々人の調査回答内容をチェックし、悪質な不正回答者を登録抹消するなど、登録モニターの品質管理を徹底しております。
                      - paragraph [ref=e1312]: さらに当社グループでは、所有する消費財や資産などで特定条件を有する登録モニターをあらかじめ抽出し、その条件によって「自動車保有モニター」(※3)、「資産保有モニター」(※4)などの「特別モニター」を分類・管理しております。顧客から調査対象者の条件として求められることの多い事項、最大2,500項目に及ぶ詳細なプロフィールをあらかじめ調査し、対象者をグルーピングしておくことで、似たような調査で対象者選定のための条件設定を都度行う必要がなくなります。この「特別モニター」の使用により、スピーディーな調査が可能となるほか、アンケートへの参加依頼メールを特定グループのみに効率よく配信でき、品質向上、業務効率改善の双方に貢献しております。
                      - paragraph [ref=e1313]
                      - heading "5 リサーチ事業のサービスについて" [level=5] [ref=e1314]
