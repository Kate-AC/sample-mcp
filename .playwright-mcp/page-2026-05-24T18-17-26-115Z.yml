                      - paragraph [ref=e1133]: 事業の系統図は、次のとおりであります。
                      - paragraph [ref=e1135]: （画像は省略されました）
                      - paragraph [ref=e1136]
                      - paragraph [ref=e1137]: (1)デジタルマーケティング事業の内容について
                      - paragraph [ref=e1138]: 〔メディア・プロモーションサービスの特徴及び内容〕
                      - paragraph [ref=e1139]: 株式会社エクスクリエを中心とした国内子会社が、メディア・プロモーション関連サービスを提供しております。
                      - paragraph [ref=e1140]: 株式会社エクスクリエは、「モラタメ.net(https://www.moratame.net/)」というサンプリング・プロモーションメディアを運営しており、インターネット上にて商品のサンプリングを通じて、大量の商品テスト、口コミを発生させるサービスを提供しております。「モラタメ.net」は、200万人以上にリーチが可能となっており、本当に使って欲しいユーザーに対して、低価格でサンプリングを実施することで、良質な口コミを発生・波及させることが出来る日本最大級の口コミ&セールスプロモーションメディアとなります。
                      - paragraph [ref=e1141]: また、デジタルマーケティング、プロモーションサービスの販売・提供などのマーケティング支援に関する事業を行っております。
                      - paragraph [ref=e1142]: 当社グループは1,410万人にのぼるアンケート由来のユーザ情報(属性情報、デモグラフィック情報に限らず、ユーザーの興味関心など)を保有し、独自のデータベースを構築しておりますが、メディア・プロモーションサービスにおいてこれらのデータをサービスインフラとし、外部パートナーデータとの連携や広告プラットフォームなどで配信が可能となっており、お客様の課題解決に最適な分析、施策に活用しております。
                      - paragraph [ref=e1143]: 顧客分析サービスとしては、Webログデータ・位置情報データ・購買データ、またはお客様のCRMデータと当社グループが保有する属性データを組み合わせることで、より高度な顧客分析が可能となり、多様化するお客様企業ニーズにきめ細かく対応した見込み顧客の発掘・競合との比較分析が提供可能となります。
                      - paragraph [ref=e1144]: 顧客獲得サービスとしては、上述の独自調査による顧客分析に基づき、運用型広告に加え、広告ランディングページ改善提案・コンバージョンの最適化、アフィリエイト運用サポートなど、費用効果の高いプロモーションサービスを提供しております。
                      - paragraph [ref=e1145]
                      - heading "〔ITソリューションサービスの特徴及び内容〕" [level=4] [ref=e1146]
                      - paragraph [ref=e1147]: 株式会社クロス・コミュニケーションを中心にモバイルやスマートフォンを中心としたサービスにおいて、マーケティング、企画から、開発、運用、プロモーションに至るまで、サービスに必要なあらゆる機能をワンストップで提供しております。
                      - paragraph [ref=e1148]: 金融機関向けアプリや決済システム・ポイント管理システムなど堅牢性が求められるシステムや会員数100万人規模のシステム構築・運用の実績があり、また、通信キャリアやプラットフォーマーと連携し、日々進化するモバイル機器に対し常に最新の機能に対応した開発が可能となっております。さらに、マーケティング・リサーチ会社をグループ会社に持っている強みを生かし、調査・分析をベースにした円滑なPDCAサイクルを実現し、「成果」を向上させるものづくりを提供しております。
                      - paragraph [ref=e1149]
                      - paragraph [ref=e1150]: 主な提供サービスは以下のとおりです。
