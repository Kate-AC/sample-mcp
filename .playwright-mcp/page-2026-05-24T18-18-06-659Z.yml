                      - heading "3 【事業の内容】" [level=3] [ref=e1091]
                      - paragraph [ref=e1092]: 当社グループは、当社及び子会社2社(株式会社南大阪電子計算センター及び株式会社シナジー)で構成され、「気高く、強く、一筋に」の経営理念のもと、共同利用型によるクラウドサービス「シェアクラウド」を提供することで、顧客企業のITコストの削減や経営の効率化を支援するとともに、業界プラットフォームとして、顧客企業だけでなく業界全体の発展に貢献するべく事業を推進しております。
                      - paragraph [ref=e1093]
                      - paragraph [ref=e1094]: 当社グループにおける各事業の位置付け等は、次のとおりであります。なお、以下に示す区分は、「第5 経理の状況 1 連結財務諸表等 (1)連結財務諸表 注記事項」に掲げるセグメント情報の区分と同一であります。
                      - paragraph [ref=e1095]
                      - paragraph [ref=e1096]: 各セグメントの事業内容と主要な関係会社は以下のとおりであります。
                      - paragraph [ref=e1097]
                      - paragraph [ref=e1098]: (流通クラウド事業)
                      - paragraph [ref=e1099]: 流通食品小売業向け基幹業務クラウドサービス「@rms基幹」を主力とした食品小売業向けサービス、大手食品卸売業を主要顧客としたEDI等の卸売業向けサービス、商品画像データベース、多言語対応販売管理システム等をクラウドで提供しております。
                      - paragraph [ref=e1100]: (主な関係会社)当社
                      - paragraph [ref=e1101]
                      - paragraph [ref=e1102]: (官公庁クラウド事業)
                      - paragraph [ref=e1103]: 地方自治体向けに行政情報システム等の導入、保守・運用サービス、防災行政無線システムをはじめとする通信システムの施工・保守を提供しております。
                      - paragraph [ref=e1104]: (主な関係会社)当社、株式会社南大阪電子計算センター及び株式会社シナジー
                      - paragraph [ref=e1105]
                      - paragraph [ref=e1106]: (トラスト事業)
                      - paragraph [ref=e1107]: ブロックチェーン技術を活用したデジタル証明書発行サービス「CloudCerts」の提供のほか、マイナンバーカードを活用したトラストサービスを展開しております。
                      - paragraph [ref=e1108]: (主な関係会社)当社
                      - paragraph [ref=e1109]
                      - paragraph [ref=e1110]: (モバイルネットワーク事業)
                      - paragraph [ref=e1111]: 株式会社NTTドコモの一次代理店であるコネクシオ株式会社と締結している「代理店契約」に基づき、二次代理店として和歌山県下にドコモショップ10店舗を運営しております。
                      - paragraph [ref=e1112]: (主な関係会社)当社
                      - paragraph [ref=e1113]
                      - paragraph [ref=e1114]
                      - paragraph [ref=e1115]: (注)上記に用いられる用語は以下のとおりであります。
                      - paragraph [ref=e1116]: ブロックチェーン技術:情報通信ネットワーク上にある端末同士を直接接続して、取引記録を暗号技術を用いて分散的に処理・記録するデータベースの一種であり、暗号資産に用いられる基盤技術のこと。
                      - paragraph [ref=e1117]
