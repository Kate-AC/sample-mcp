                      - heading "3 【事業の内容】" [level=3] [ref=e1039]
                      - paragraph [ref=e1040]: 当社グループ(当社及び当社の関係会社)は、当社、子会社34社及び関連会社5社により構成され、農薬を軸とする有機化学分野と、機能性材料と酸化チタンを軸とする無機化学分野における化学工業製品の製造・販売及びその他の事業の3部門に関する事業を行っております。各事業における当社及び主な関係会社の位置付けは、次のとおりであります。
                      - paragraph [ref=e1041]: なお、次の3部門は「第5 経理の状況 1(1) 連結財務諸表 注記事項」に掲げるセグメントの区分と同一であります。
                      - paragraph [ref=e1042]
                      - heading "有機化学事業:農薬(除草剤、殺虫剤、殺菌剤等)、動物用医薬品、医薬、有機中間体" [level=4] [ref=e1043]
                      - paragraph [ref=e1044]: 農薬は、当社が製造し、国内販売は石原バイオサイエンス(株)を通じて、海外販売は当社が直接・間接に販売しております。主な海外子会社の位置付けは、次のとおりであります。
                      - paragraph [ref=e1045]: ISK BIOSCIENCES EUROPE N.V.は欧州・中東及びアフリカ地域において、ISK BIOSCIENCES CORP.は米州において当社農薬事業の統括及び農薬の製剤・販売を行っております。
                      - paragraph [ref=e1046]: 動物用医薬品については、当社が研究・開発を行っており、国内は当社が製造し直接・間接に販売しております。米国は、ISK ANIMAL HEALTH, LLCが製造・販売しております。
                      - paragraph [ref=e1047]: 医薬については、当社保有技術を活かして医薬品原薬の製造・販売を行っております。
                      - paragraph [ref=e1048]: 有機中間体は、当社が製造し直接販売を行っております。
                      - paragraph [ref=e1049]
                      - heading "無機化学事業:機能性材料、酸化チタン、その他化成品" [level=4] [ref=e1050]
                      - paragraph [ref=e1051]: 機能性材料は、当社、富士チタン工業(株)及びMFマテリアル(株)が製造し、直接・間接に販売しております。
                      - paragraph [ref=e1052]: 酸化チタンは、当社及び富士チタン工業(株)で製造し、国内はもとより世界市場に向けて直接・間接に販売しております。
                      - paragraph [ref=e1053]: 台湾石原産業(股)は、当社グループの機能性材料、酸化チタン製品等の輸入・販売業務を行っております。
                      - paragraph [ref=e1054]
                      - paragraph [ref=e1055]
                      - heading "その他の事業:商社業、建設業等" [level=4] [ref=e1056]
                      - paragraph [ref=e1057]: 商社業は、石原テクノ(株)が、当社の有機・無機化学製品の販売や原材料の調達などを行っているほか、一般化学工業品等の仕入・販売を行っております。
                      - paragraph [ref=e1058]: 石原エンジニアリングパートナーズ(株)は、当社グループの生産設備等の建設・修繕や外部受託によるプラントなどの建設・修繕を行っております。
                      - paragraph [ref=e1059]
                      - paragraph [ref=e1060]
