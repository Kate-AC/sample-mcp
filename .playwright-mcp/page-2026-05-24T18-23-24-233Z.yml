                      - paragraph [ref=e1042]: 当社グループは、当社、子会社7社及び関連会社4社で構成され、化学品及び機能品の製造、仕入、販売を主な内容とし、その他に不動産賃貸等の事業を行っております。
                      - paragraph [ref=e1043]: 当社グループの事業内容及び当社と関係会社の当該事業に係る位置づけは次の通りであります。
                      - paragraph [ref=e1044]: なお、次の4部門は、「第5 経理の状況 1 連結財務諸表等 (1)連結財務諸表 注記事項」に掲げるセグメント情報の区分と同一であります。
                      - paragraph [ref=e1045]: 東邦顔料工業(株)は、2024年5月20日開催の当社の取締役会において解散及び清算することを決議いたしました。必要な手続きが完了次第、清算結了となる予定であります。
                      - paragraph [ref=e1046]
                      - paragraph [ref=e1047]: 化学品事業...... 当社が製造し、当社、子会社JCI USA INC.、捷希艾(上海)貿易有限公司、JCI(THAILAND)CO.,LTD.、台灣日本化學工業股份有限公司が販売するほか、子会社東邦顔料工業(株)、関連会社京葉ケミカル(株)、エヌシー・テック(株)、CT GLASS CO., LTD.が製造販売しており、一部を当社で仕入れて販売しております。
                      - paragraph [ref=e1048]: なお、原材料の一部については、子会社JCI USA INC.、捷希艾(上海)貿易有限公司、関連会社シンライ化成(株)から仕入れております。
                      - paragraph [ref=e1049]: 機能品事業...... 当社が製造し、当社、子会社JCI USA INC.、捷希艾(上海)貿易有限公司、JCI(THAILAND)CO.,LTD.、台灣日本化學工業股份有限公司、関連会社シンライ化成(株)が販売しております。
                      - paragraph [ref=e1050]: なお、原材料の一部については、子会社JCI USA INC.、捷希艾(上海)貿易有限公司、台灣日本化學工業股份有限公司、関連会社シンライ化成(株)から仕入れております。
