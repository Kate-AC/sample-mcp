                      - paragraph [ref=e1104]: その他5社
                      - paragraph [ref=e1105]
                      - paragraph [ref=e1106]: (4) 自動車機器関連事業
                      - paragraph [ref=e1107]: 〔自動車機器関連〕
                      - paragraph [ref=e1108]: 自動車部品メーカーの生産ライン等の機器について仕入販売を行っております。
                      - paragraph [ref=e1109]: 〔主な関係会社〕
