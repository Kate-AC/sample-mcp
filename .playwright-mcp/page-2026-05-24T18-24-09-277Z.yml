                      - heading "3 【事業の内容】" [level=3] [ref=e1064]
                      - paragraph [ref=e1065]: 当社グループは当社、連結子会社15社、持分法適用関連会社3社、持分法非適用の非連結子会社6社、関連会社9社及びその他の関係会社1社で構成され、各種高圧ガスの製造・販売、器具器材の仕入販売等を主要な事業としております。
                      - paragraph [ref=e1066]: 当社グループの事業に係る当社及び当社の関係会社の位置付け及びセグメントとの関連は、次のとおりであります。
                      - paragraph [ref=e1067]: 以下に示す区分は、セグメントと同一の区分であります。
                      - paragraph [ref=e1068]
                      - paragraph [ref=e1069]: (1) ガス関連事業
                      - paragraph [ref=e1070]: 〔溶解アセチレン、酸素、窒素、アルゴン、水素、液化石油ガス、その他ガス〕
                      - paragraph [ref=e1071]: 溶解アセチレンは、溶接や切断する際に使用し、仕入販売するほか、子会社である北日本アセチレン(株)が製造しております。
                      - paragraph [ref=e1072]: 酸素は、他の物質の燃焼を助け、また酸化させる性質を利用して鉄鋼業等で使用されるほか、医療用の吸入等でも使用されており、仕入販売するほか、当社の多賀城工場で製造しております。
                      - paragraph [ref=e1073]: 窒素は、不活性である性質を利用して半導体製造及び化学製品の酸化防止用や雰囲気ガスとして使用され、仕入販売するほか、当社の多賀城工場で製造しております。
                      - paragraph [ref=e1074]: アルゴンは、窒素より安定した特性を利用して鉄鋼及び半導体等の雰囲気ガスやステンレスの溶接に使用され、仕入販売するほか、当社の多賀城工場で製造しております。
                      - paragraph [ref=e1075]: 水素は、鉄鋼及び金属分野での熱処理や石油精製に使用され、仕入販売するほか、子会社である東邦酒田水素(株)で製造しております。
                      - paragraph [ref=e1076]: 液化石油ガスは、家庭用及び工業用に使用され、仕入販売しております。
                      - paragraph [ref=e1077]: その他ガスは、仕入販売を行っております。
                      - paragraph [ref=e1078]: これらの製・商品については、各地区に所在する支店及び営業所を通じて、タンクローリー等により直接需要家又は販売店等へ販売しております。
                      - paragraph [ref=e1079]: 〔主な関係会社〕
                      - paragraph [ref=e1080]: (販売会社)
                      - paragraph [ref=e1081]:
                        - text: (株)東酸、東ホー(株)、荘内ガス(株)、太平熔材(株)、東邦岩手(株)、東邦福島(株)、東邦北海道(株)、カガク興商(株)、
                        - text: その他5社
                      - paragraph [ref=e1082]: (製造・充填会社)
                      - paragraph [ref=e1083]: 東邦興産(株)、八戸液酸(株)、(株)福島共同ガスセンター、その他12社
                      - paragraph [ref=e1084]
                      - paragraph [ref=e1085]: (2) エスプーマ関連事業
                      - paragraph [ref=e1086]: 〔食品添加物用亜酸化窒素、その他ガス、食品関連器材〕
                      - paragraph [ref=e1087]: 食品添加物用亜酸化窒素は、液状の食材を泡状(ムース状)に加工する料理法であるエスプーマに使用され、飲食店向けに仕入販売しております。
                      - paragraph [ref=e1088]: その他ガスは、仕入販売を行っております。
                      - paragraph [ref=e1089]: 食品関連器材は、エスプーマ調理用の器材等を仕入販売しております。
                      - paragraph [ref=e1090]: これらの商品については、全国に所在する配送拠点より、主に当社が顧客へ販売するほか、一部を販売店等へ販売しております。
                      - paragraph [ref=e1091]: 〔主な関係会社〕
                      - paragraph [ref=e1092]: (販売会社)
                      - paragraph [ref=e1093]: (株)東酸、荘内ガス(株)、太平熔材(株)、東邦岩手(株)、東邦福島(株)、東邦北海道(株)、東邦新潟(株)
                      - paragraph [ref=e1094]
                      - paragraph [ref=e1095]
                      - paragraph [ref=e1096]: (3) 器具器材関連事業
                      - paragraph [ref=e1097]: 〔溶接材料、溶接切断器具、生活関連器具〕
                      - paragraph [ref=e1098]: 溶接材料及び溶接切断器具は、建築鉄骨、造船、建機等、鉄・非鉄製品を製造する上で使用され、仕入販売を行っております。
                      - paragraph [ref=e1099]: 生活関連器具は、液化石油ガスに関する供給機器等、生活に関わる周辺機器等を仕入販売しております。
                      - paragraph [ref=e1100]: これらの商品については各地区に所在する支店及び営業所を通じて、直接需要家又は販売店等へ販売しております。
