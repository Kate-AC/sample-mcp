                      - paragraph [ref=e1035]
                      - heading "3 【事業の内容】" [level=3] [ref=e1036]
                      - paragraph [ref=e1037]: 当社及び当社の関係会社(当社、子会社46社及び関連会社16社で構成)においては、各種高圧ガスの製造・仕入販売及び各種ガス関連機器、接着剤、塗料等の製造・仕入販売ならびに設備の賃貸を主たる業務としています。
                      - paragraph [ref=e1038]: 当社及び当社の関係会社の位置付け及びセグメントとの関連は、次のとおりであります。なお、セグメントと同一の区分であります。
                      - heading "(ガス事業)" [level=5] [ref=e1039]
                      - paragraph [ref=e1040]: 当事業においては、建設、橋梁、造船、機械等向けの溶解アセチレンを主体に酸素、窒素、アルゴン、炭酸ガス等の各種高圧ガス、LPガス等石油系ガス及び高圧ガス関連材料・機器等の製造・仕入販売を行なっています。
                      - paragraph [ref=e1041]: このうち溶解アセチレンについては、国内シェアーが高く、この部門における主力分野として位置付けています。
                      - heading "〔主な関係会社〕" [level=5] [ref=e1042]
                      - heading "(製造)" [level=6] [ref=e1043]
                      - paragraph [ref=e1044]: 高圧昭和ボンベ(株)、安浦アセチレン(株)、春日井ガスセンター(株)、北海道アセチレン(株)、仙台アセチレン(株)、東日本高圧(株)、西日本アセチレン(株)
                      - heading "(販売)" [level=6] [ref=e1045]
                      - paragraph [ref=e1046]: 宇野酸素(株)、(株)泉産業、KGKサービス(株)、(株)スミコエアー、中国酸素(株)、ウエルテックダイサン(株)、大豊商事(株)、砂金瓦斯工業(株)、(株)ユミヤマ、カトウ酸素(株)、三幸合同サンソ(株)、マル商ガス(株)、アイ・ジー・シー(株)、ウエルディングガス九州(株)、ウエルテック(株)、気仙沼酸素(株)、新潟高圧ガス(株)、西日本高圧瓦斯(株)、(株)ジョーサン
                      - heading "(輸送)" [level=6] [ref=e1047]
                      - paragraph [ref=e1048]: 弘容通商(株)、(株)エル・エヌ・ジー輸送
                      - heading "(化成品事業)" [level=5] [ref=e1049]
                      - paragraph [ref=e1050]: 当事業においては、接着用、塗料用、建材用、粘着用等の合成樹脂系接着剤を主体に瞬間接着剤、塗料等及び化成品関連の原材料、副資材等の製造・仕入販売ならびに塗装・防水工事業を行なっています。
                      - heading "〔主な関係会社〕" [level=5] [ref=e1051]
                      - heading "(製造)" [level=6] [ref=e1052]
                      - paragraph [ref=e1053]: スズカファイン(株)、スズカケミー(株)、Koatsu Gas Kogyo Vietnam Co.,Ltd.
                      - heading "(販売)" [level=6] [ref=e1054]
                      - paragraph [ref=e1055]: (株)スミコエアー、杉田塗料商事(株)、アサヒ塗料興産(株)、(株)川波
                      - heading "(輸送)" [level=6] [ref=e1056]
                      - paragraph [ref=e1057]: 弘容通商(株)
                      - heading "(その他事業)" [level=5] [ref=e1058]
                      - paragraph [ref=e1059]: 当事業においては、LSIカードを主体にディスプレイタグ等の電子ペーパー応用製品、その周辺機器の販売、食品添加物の販売及び当社製品、仕入商品の海外への販売を行なっています。
                      - heading "〔主な関係会社〕" [level=5] [ref=e1060]
