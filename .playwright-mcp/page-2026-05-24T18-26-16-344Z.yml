                      - paragraph [ref=e776]
                      - heading "3 【事業の内容】" [level=3] [ref=e777]
                      - paragraph [ref=e778]: 当社グループは、当社及び連結子会社7社により構成されております。「環境ニーズを創造する」を事業コンセプトとして、化学品及び油剤製品を製造・販売する事業のほか、それらの使用後の産業廃棄物を収集し、中間処分並びに再資源化する事業を中心に展開しております。
                      - paragraph [ref=e779]: 当社グループは環境関連事業の単一セグメントであるため、セグメント毎の記載を省略しておりますが、主な事業は「リユース事業」「リサイクル事業」「化学品事業」「自動車事業」「エンジニアリング事業」の5つに区分されます。この5事業は、それぞれ単独で成り立っているのではなく、当社グループの機能を活かして、製品の製造・販売から使用後の産業廃棄物の有効利用までを物流や品質保証も含めて一気通貫で対応することが特徴であり、環境負荷の低減と資源有効利用を通じて、総合的に取引先並びに社会へ貢献することが当社グループの事業内容であります。当社及び物流子会社のサンワリューツー株式会社、販売子会社のサンワ石販株式会社は5事業全てに携わっており、サンワ南海リサイクル株式会社及びサンワ境リサイクル株式会社はリサイクル事業に特化して携わっております。
                      - paragraph [ref=e780]
                      - heading "(1) リユース事業" [level=4] [ref=e781]
                      - paragraph [ref=e782]: リユース事業は、主に製造業顧客の工場から排出される使用済み廃溶剤、廃酸、有用金属等を含む産業廃棄物などを当社グループの設備により中間処分・再資源化し、元の用途や塗料、洗浄剤、表面処理剤等の素材として再使用するマテリアルリサイクルをしていくことを目的とし、再生製品の販売が収益の主体となる事業です。
                      - paragraph [ref=e783]: 国内の様々な業種の事業場より引き取りした有機溶剤や無機酸などの使用済み廃棄物原料を、蒸留(※1)・溶媒抽出(※2)などの化学的手法により分離・精製し目的物を回収します。回収した再生製品は元の顧客に戻し再使用(リユース)していただくことや、他の顧客に販売し新品(バージン品)に代わる素材原料として再利用いただいております。
                      - paragraph [ref=e784]:
                        - text: 従来は、焼却を中心とした「処分されてきた産業廃棄物」を当社グループでは「資源」と捉え、有効利用することにより、焼却処分時に排出されていたCO
                        - subscript [ref=e786]: "2"
                        - text: を削減(環境負荷を低減)し、資源の国内循環や製造業のコスト削減にも貢献することができます。
                      - paragraph [ref=e787]
                      - paragraph [ref=e788]: (※1) 物質ごとに異なる沸点の温度差を利用して、混合物から特定の物質を分離・濃縮する手法
                      - paragraph [ref=e789]: (※2) 溶媒に対する溶解度の差を利用して、混合物から特定の物質を分離する手法
                      - paragraph [ref=e790]
                      - paragraph [ref=e791]: (リユース事業のフロー図)
                      - paragraph [ref=e792]
                      - paragraph [ref=e794]: （画像は省略されました）
                      - paragraph [ref=e795]
                      - paragraph [ref=e796]
                      - heading "(2) リサイクル事業" [level=4] [ref=e797]
                      - paragraph [ref=e798]: リサイクル事業は、主に製造業顧客の工場から排出される使用済み廃溶剤、汚泥、廃プラスチック類などの産業廃棄物を当社グループの設備により中間処分・再資源化し、再生燃料(サーマルリサイクル)やセメント・石灰・鉄鋼の副原料及び副資材としての2次利用を中心とした再資源化を目的としている事業です。
                      - paragraph [ref=e799]: 国内の様々な業種の事業場より引き取りした廃油や廃酸、廃アルカリ、汚泥、廃プラスチック類などの産業廃棄物を、「廃棄物の処理及び清掃に関する法律(通称:廃掃法または廃棄物処理法)」に基づき、中和(※3)・混合エマルジョン化(※4)・混練(※5)などの化学的手法・物理的手法により中間処分・無害化します。中間処分・無害化した回収物は、重油や石炭の代替となる再生燃料として販売する(サーマルリサイクル)、あるいは成分を調整して、セメント・石灰・鉄鋼の副原料及び副資材として2次利用目的で販売しております。中間処分後の残渣等で有効利用が難しいものは、無害化された産業廃棄物として他の産業廃棄物処理業者へ処理委託しております。
                      - paragraph [ref=e800]: 従来は、単純焼却(※6)・埋め立てなどの「処分されてきた産業廃棄物」を当社グループでは「資源」と捉え、元の用途や素材としての再使用ができないモノを、別の用途に再資源化することにより、環境負荷の低減と資源の有効利用に貢献しております。
                      - paragraph [ref=e801]
                      - paragraph [ref=e802]: (※3) 酸性成分とアルカリ性成分を混ぜ合わせて、無害化する手法
                      - paragraph [ref=e803]: (※4) 廃油・廃酸・廃アルカリ等を混合し、界面活性剤を添加することで均一化させる手法
                      - paragraph [ref=e804]: (※5) 固形物をよく混ぜ、練り合わせることで均一化させる手法
                      - paragraph [ref=e805]: (※6) サーマル利用や発電に有効利用することなく、ただ焼却するだけの手法
                      - paragraph [ref=e806]
                      - paragraph [ref=e807]: (リサイクル事業のフロー図)
                      - paragraph [ref=e808]
                      - paragraph [ref=e810]: （画像は省略されました）
                      - paragraph [ref=e811]
                      - paragraph [ref=e812]
                      - heading "(3) 化学品事業" [level=4] [ref=e813]
                      - paragraph [ref=e814]: 化学品事業は、有機化学品や無機化学品及びそれらを精製・加工した化学品の製造・販売を中心に行っている事業です。
                      - paragraph [ref=e815]: 国内及び海外から化学品原料を仕入れ、当社グループの危険物貯蔵所及び倉庫にて一時保管、荷姿・納期を調整して様々な業種の顧客において洗浄や表面処理、樹脂等を溶解する溶媒として利用される汎用化学品を販売するほか、半導体や電子機器、電池などのエレクトロニクス分野で使用される高純度化学品の製造・販売・受託加工を行っております。特に高純度化学品につきましては、リユース・リサイクル事業で培った分離・精製技術及び分析技術を活用し、新品の化学品にも極微量に含まれている金属分や異物の除去などを行い、高度な品質管理にも対応することができます。自社製品だけでなく、顧客の要望(原材料指定、工程管理、仕様など)に応じた受託加工も行っております。
                      - paragraph [ref=e816]: また、化学品事業で販売され使用済となった薬品の一部は、リユース事業の原料として回収され、マテリアルリサイクルにより元の用途として再利用されサーキュラーエコノミーを実現しております。
                      - paragraph [ref=e817]
                      - paragraph [ref=e818]: (化学品事業のフロー図)
                      - paragraph [ref=e819]
                      - paragraph [ref=e821]: （画像は省略されました）
                      - paragraph [ref=e822]
                      - paragraph [ref=e823]
                      - heading "(4) 自動車事業" [level=4] [ref=e824]
                      - paragraph [ref=e825]: 自動車事業は、自動車メーカー及び自動車部品メーカーをメイン顧客として、潤滑油や金属加工油などの油剤製品、工業用洗浄剤及び自動車製造工程で使用される各種副資材の製造・販売を行っている事業です。
                      - paragraph [ref=e826]: 愛知県という自動車産業が盛んな地域で創業した当社にとって、モノづくり精神の基盤をつくった事業となります。原材料を仕入れ、顧客ニーズに合わせて複数の原材料及び添加剤をブレンド調合することにより、製品に様々な性能を付与しております。幅広い選択肢の中から、環境負荷物質を使用していない、省エネ効果がある、安全性能が高い、工場ラインの作業環境改善に寄与するなど、顧客ニーズに最も適した製品を提案するために、特徴ある油剤、洗浄剤及び副資材の製品ラインナップを揃えております。
                      - paragraph [ref=e827]
                      - paragraph [ref=e828]: (自動車事業のフロー図)
                      - paragraph [ref=e829]
                      - paragraph [ref=e831]: （画像は省略されました）
                      - paragraph [ref=e832]
                      - heading "(5) エンジニアリング事業" [level=4] [ref=e833]
                      - paragraph [ref=e834]: エンジニアリング事業は、製造業顧客の設備等の解体・清掃、それに伴い発生する廃棄物処理を行うための一貫したソリューションを提供する事業です。
                      - paragraph [ref=e835]: 「ポリ塩化ビフェニル(略称:PCB)廃棄物の適正な処理の推進に関する特別措置法(通称:PCB特別措置法)」(※7)に基づき処理が進められているPCB含有廃棄物の適正な処理や化学プラント等を改廃する際の、アスベスト分析、解体・清掃、収集運搬及び廃棄物処理の最適なコーディネートを行い、許認可を受けた処分業者による適正処理までのトータルサポートを行っております。
                      - paragraph [ref=e836]
                      - paragraph [ref=e837]: (※7) PCBは化学的安定性や絶縁性に優れる特性から重宝されてきましたが、人体への毒性が社会問題化したことを受け、適正かつ確実な処理を目的として特別措置法が制定されました。
                      - paragraph [ref=e838]
                      - paragraph [ref=e839]: (エンジニアリング事業のフロー図)
