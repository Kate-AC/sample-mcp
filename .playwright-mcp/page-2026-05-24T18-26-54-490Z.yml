                      - heading "3【事業の内容】" [level=3] [ref=e846]
                      - paragraph [ref=e847]: 当社グループ(当社及び当社の関係会社)は、当社(KHネオケム株式会社)、子会社4社及び関連会社1社(2025年12月31日現在)により構成されており、各種石油化学製品の製造・販売を主たる業務としています。「オキソ技術」をコア技術として、さまざまな産業分野に特色ある化学製品を提供しています。オキソ技術とはオレフィン(注1)とオキソガス(注2)を原料にアルデヒド(注3)を製造する技術です。当社グループは1970年にオキソ技術によるアルデヒドの大量生産を開始して以来、アルデヒドを原料にアルコールや脂肪酸(注4)などの生産品目を拡充し、溶剤(注5)や可塑剤(注6)原料、機能性材料等の多様な製品群を国内外の顧客へ供給しています。
                      - paragraph [ref=e848]: 当社グループの事業分野は、「機能性材料」「電子材料」「基礎化学品」の3分野であり、各事業分野の事業内容は以下のとおりです。
                      - paragraph [ref=e849]
                      - paragraph [ref=e850]: (1) 機能性材料
                      - paragraph [ref=e851]: エアコンや冷凍庫等に使用される冷凍機油(注7)の原料、化粧品原料等に用いられる特殊ジオール(注8)等を製造し、販売しています。
                      - paragraph [ref=e852]
                      - paragraph [ref=e853]: <主な製品名と概要>
                      - paragraph [ref=e854]: キョーワノイック-N(イソノナン酸)、オクチル酸、1, 3-ブチレングリコール
                      - paragraph [ref=e855]: ・キョーワノイック-N(イソノナン酸)とオクチル酸は、エアコン等に使用される冷凍機油の原料に用いられています。オゾン層破壊・地球温暖化といった環境問題に対処するため、エアコン等に使用される冷媒は、オゾン層を破壊せず、かつ、地球温暖化係数(注9)の低い環境にやさしい冷媒への切り替えが進んでおり、当該製品はこの冷媒に適合する冷凍機油の原料です。
                      - paragraph [ref=e856]: ・オクチル酸は、冷凍機油の原料の他、自動車や住宅等の合わせガラス用中間膜の原料等に用いられています。
                      - paragraph [ref=e857]: ・1, 3-ブチレングリコールは、高い保湿性を持ち、化粧品やスキンケア製品の原料として用いられています。
                      - paragraph [ref=e858]: <主な用途>
                      - paragraph [ref=e859]: 潤滑油、粘接着剤、化粧品、医農薬、界面活性剤
                      - paragraph [ref=e860]
                      - paragraph [ref=e861]: (2) 電子材料
                      - paragraph [ref=e862]: 液晶ディスプレイや半導体、フォトレジスト(注10)の製造に使用される高純度溶剤を製造し、販売しています。
                      - paragraph [ref=e863]
                      - paragraph [ref=e864]: <主な製品名と概要>
                      - paragraph [ref=e865]: PM-P(プロピレングリコールモノメチルエーテル-P)、
                      - paragraph [ref=e866]: PMA-P(プロピレングリコールモノメチルエーテルアセテート-P)
                      - paragraph [ref=e867]: ・液晶ディスプレイやCPU・メモリー等の半導体の製造プロセスには、非常に高純度の溶剤が必要とされています。この分野には、当社が長年培ってきた高い品質管理ノウハウを駆使して、金属含有量の極めて少ない高純度溶剤を提供しています。
                      - paragraph [ref=e868]: <主な用途>
                      - paragraph [ref=e869]: ディスプレイ材料、半導体
                      - paragraph [ref=e870]
                      - paragraph [ref=e871]: (3) 基礎化学品
                      - paragraph [ref=e872]: 自動車や住宅など様々な産業で使用される溶剤、可塑剤原料、樹脂原料等を製造し、販売しています。
                      - paragraph [ref=e873]
                      - paragraph [ref=e874]: <主な製品名と概要>
                      - paragraph [ref=e875]: ブタノール、オクタノール、オキソコール900(イソノニルアルコール)、酢酸ブチル
                      - paragraph [ref=e876]: ・オクタノールは、壁紙や床材、自動車部材等の幅広い用途に用いられる可塑剤であるDOP(ジオクチルフタレート)の原料や塗料、接着剤、粘着剤、合成樹脂に用いられるアクリル酸2-エチルヘキシルの原料として使用されています。
                      - paragraph [ref=e877]: ・オキソコール900(イソノニルアルコール)は、壁材や床材の他、自動車部品や電線被覆材等に用いられる可塑剤であるDINP(ジイソノニルフタレート)の原料として使用されています。
                      - paragraph [ref=e878]: ・ブタノール、酢酸ブチルは主に塗料用の溶剤で、自動車のボディや建物の外壁、缶類の塗装等に使用されています。
                      - paragraph [ref=e879]: <主な用途>
                      - paragraph [ref=e880]: 塗料、インキ、可塑剤、洗浄剤
                      - paragraph [ref=e881]: (注)1.オレフィンとは
                      - paragraph [ref=e882]: 分子内にひとつの二重結合を持つ炭化水素の総称です。石油化学基礎製品であるエチレン、プロピレン等がこれに含まれます。
                      - paragraph [ref=e883]
                      - paragraph [ref=e884]: 2.オキソガスとは
                      - paragraph [ref=e885]: 水素と一酸化炭素の混合ガスです。
                      - paragraph [ref=e886]
                      - paragraph [ref=e887]: 3.アルデヒドとは
                      - paragraph [ref=e888]: アルデヒド基をもつ有機化合物の総称です。アルデヒドに水素添加するとアルコールになります。また、アルデヒドは酸化されるとカルボン酸になります。
                      - paragraph [ref=e889]
                      - paragraph [ref=e890]: 4.脂肪酸とは
                      - paragraph [ref=e891]: 酸の性質を持つ有機化合物の総称です。当社のイソノナン酸やオクチル酸も脂肪酸の一種です。
                      - paragraph [ref=e892]
                      - paragraph [ref=e893]: 5.溶剤とは
                      - paragraph [ref=e894]: 塗料用や電子材料用の樹脂や医農薬の原料等を溶かすものです。
                      - paragraph [ref=e895]
                      - paragraph [ref=e896]: 6.可塑剤(かそざい)とは
                      - paragraph [ref=e897]: 材料に柔軟性を与えたり、加工をしやすくしたりするために添加する物質のことです。
                      - paragraph [ref=e898]
                      - paragraph [ref=e899]: 7.冷凍機油とは
                      - paragraph [ref=e900]: エアコンや冷凍庫などにおいて、冷媒を循環するコンプレッサーに使用される特殊な潤滑油です。
                      - paragraph [ref=e901]
                      - paragraph [ref=e902]: 8.ジオールとは
                      - paragraph [ref=e903]: 分子中に2つの水酸基をもつ有機化合物の総称です。グリコールともいいます。
                      - paragraph [ref=e904]
                      - paragraph [ref=e905]: 9.地球温暖化係数とは
                      - paragraph [ref=e906]: 二酸化炭素を1として温室効果を示した数値です。
                      - paragraph [ref=e907]
                      - paragraph [ref=e908]: 10.フォトレジストとは
                      - paragraph [ref=e909]: 半導体や液晶ディスプレイに回路を形成する工程で用いられる感光性材料です。
                      - paragraph [ref=e910]
                      - paragraph [ref=e911]
                      - paragraph [ref=e912]
                      - paragraph [ref=e913]
                      - paragraph [ref=e914]: また、グループ各社の役割は以下のとおりです。
