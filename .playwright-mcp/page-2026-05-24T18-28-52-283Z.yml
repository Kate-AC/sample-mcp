                      - paragraph [ref=e1266]
                      - paragraph [ref=e1267]
                      - paragraph [ref=e1268]: (1) 自動車部品事業
                      - paragraph [ref=e1269]: 当社グループの主要な顧客は自動車メーカーでありますが、その中でも、マツダ株式会社(以下、「同社」という。)に対しては、主要な樹脂部品供給サプライヤーとなっており、同社の樹脂部品の多くを当社グループで取り扱い、特にインストルメントパネルにおいてはマツダ生産の全車種に供給しております。
                      - paragraph [ref=e1270]: バンパー、インストルメントパネル等の大物部品については、同社の順序指示(例:生産ライン別の車種の製造順序を指示すること)に従って計画順序搬入する生産形態を採用することで最小のリードタイムで納入対応ができるとともに、当社グループにおいても各工程を効率化することにより生産リードタイムを短縮することができ、サプライチェーン全体の効率化に寄与しております。
                      - paragraph [ref=e1271]: また、自動車メーカーにおいて、環境対策の一環としての車の軽量化による電費・燃費向上や車のコストダウンが求められており、それらに対応して従来の金属部品から樹脂部品が採用されている外部環境に対し、当社グループの持つ技術力で、バッテリーカバー、インテークマニホールド、オイルストレーナー、冷却水パイプ、シュラウド等の耐熱性、耐振性能などの条件をクリアしたパワートレイン部品及びテールゲート、給電・給油口等の自動車ボディ部品の樹脂化についても成功し、当社の主力製品となっております。
                      - paragraph [ref=e1272]
                      - paragraph [ref=e1273]: 1 インストルメントパネル(Instrument Panel)
                      - paragraph [ref=e1274]: インストルメントパネルの主な工法として、パウダースラッシュ表皮法と発泡ウレタン注入法を使用してソフトタッチのインストルメントパネルを生産しております。パウダースラッシュ表皮法におきましては、成形工程との同時トリム法を開発し工程削減も行っております。また、ステッチ技術も取入れ、インストルメントパネルの質感向上も行っております。
                      - paragraph [ref=e1275]
                      - paragraph [ref=e1276]: 2 バンパー(Bumper)
                      - paragraph [ref=e1277]: 薄肉軽量ができる大型成形技術とプレミアムカラーに対応した加飾塗装を実現しています。低温衝撃にも強い樹脂材を使用した軽量バンパーフェースにおいては、環境に優しい技術も取り入れながら生産しております。開発領域においては、レインホースメントを含めた衝突エネルギー吸収開発も実施可能であります。また、当社は樹脂材料を内製化するため、タルクマスターバッチ製法も開発し、価格競争力のある効率的な生産を実現しました。バンパーは、マツダ株式会社、ダイハツ工業株式会社、三菱自動車工業株式会社、トヨタ自動車株式会社に採用されております。
                      - paragraph [ref=e1278]
                      - paragraph [ref=e1279]: 3 サイドステップモール(Side Step Molding)
                      - paragraph [ref=e1280]: 車体ドア下部に装着される空力性向上とボディの保護を目的とした樹脂でしか実現できないデザインの自由度を可能にした部品です。当社は生産コスト低減のため、大型部品の塗装ラインを開発し、効率的な生産を行って、主にマツダ株式会社やダイハツ工業株式会社等に採用されております。
                      - paragraph [ref=e1281]
                      - paragraph [ref=e1282]: 4 テールゲート(Tail Gate)
                      - paragraph [ref=e1283]: 鋼板から樹脂製に変更することで、内装トリム、スポイラー、ガーニッシュ等の一体化で軽量化、部品点数の削減による製造工程の簡略化を実現しました。軽量化による燃費の向上や、開閉のしやすさの利点に加え樹脂化による設計の自由度が向上し、斬新なデザインも可能となり、空力性能の向上にもつながっております。この樹脂製テールゲートは初めてマツダ株式会社に採用され、現在ではダイハツ工業株式会社、本田技研工業株式会社に採用されております。
                      - paragraph [ref=e1284]: 5 給電・給油口(Charger Receives Electric Power,Fuel Lid)
                      - paragraph [ref=e1285]: ボックスを高強度樹脂と開閉構造の検討により、従来の鉄製構造と比較して、軽量で高外観な樹脂構造を国内でいち早く確立しました。この給電・給油口はダイハツ工業株式会社、株式会社SUBARU、マツダ株式会社、三菱自動車工業株式会社等のメーカーに採用されております。
                      - paragraph [ref=e1286]
                      - paragraph [ref=e1287]: 6 インテークマニホールド(Intake Manifold)
                      - paragraph [ref=e1288]: 樹脂の持つ特長を生かし、軽量で各配管の流路抵抗等を低減した低価格な吸気多岐管の生産を実現しました。当社独自のDRI工法の開発によって三次元に湾曲した等長の樹脂管を安価に作ることが可能となり、初代トヨタヴィッツに採用されました。これを足がかりに国内の多くの自動車メーカーへの拡販に繋がっております。このインテークマニホールドは、ダイハツ工業株式会社、トヨタ自動車株式会社、マツダ株式会社、その他多くの顧客に採用されております。
                      - paragraph [ref=e1289]
                      - paragraph [ref=e1290]: 7 バッテリーカバー(Battery Cover)
                      - paragraph [ref=e1291]: 電気自動車のバッテリーにおいて水・異物の侵入を防止し、ショートを防ぐことと、車両火災時のバッテリーへの延焼を防ぐための大型のカバー。難燃性を有した熱可塑もしくは熱硬化材料を使用することで、耐熱焼性、シール性を確保しております。また、樹脂の形状自由度を活かし、電気自動車の限られたスペースにレイアウトも可能になり、車体の軽量化にも貢献しております。このバッテリーカバーは、本田技研工業株式会社、マツダ株式会社、トヨタ自動車株式会社に採用されております。
                      - paragraph [ref=e1292]
                      - paragraph [ref=e1293]: 8 オイルストレーナー(Oil Strainer)
                      - paragraph [ref=e1294]: 当社独自の樹脂技術と溶着技術の開発による極小の樹脂メッシュを含む樹脂製オイルストレーナーは、従来の金属製オイルストレーナーに対し、軽量、安価、高性能に加えて、設計の自由度が大幅に向上しております。現在、樹脂製オイルストレーナーでは世界一のシェアを誇っており、あらゆる形状にも対応しております。このオイルストレーナーはマツダ株式会社、ダイハツ工業株式会社、トヨタ自動車株式会社、本田技研工業株式会社、日産自動車株式会社、スズキ株式会社及び株式会社SUBARU等に採用され、現在は日本、中国、タイ、インドネシア、メキシコにて生産し、顧客に供給しております。
                      - paragraph [ref=e1295]
                      - paragraph [ref=e1296]: (2) 住宅部品事業
                      - paragraph [ref=e1297]: 住宅部品事業では、自動車部品事業で培った設計・開発・成形・塗装技術、そして品質管理力を活かし、従来の人造大理石調浴槽に比べ、色彩感や清掃性を大幅に向上させた塗装加飾浴槽、塗装加飾エプロンを主にTOTOグループ向けに生産しております。
