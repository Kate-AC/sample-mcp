                      - heading "3 【事業の内容】" [level=3] [ref=e1071]
                      - paragraph [ref=e1072]: 当社グループ(当社及び当社の関係会社)は、国内外に当社、連結子会社14社及び関連会社1社で構成され、自動車部品の製造、販売を主な事業としております。
                      - paragraph [ref=e1073]: 当社グループは、商社、メーカーから原材料を仕入れ、インストルメントパネル、バンパー等の自動車部品及びバスユニット部材等の住宅部品を製造し、自動車メーカー、住宅機器メーカーに販売しております。
                      - paragraph [ref=e1074]: 当社グループのセグメントは日本、中米・北米、アセアン、中国・韓国の4つに区分しております。
                      - paragraph [ref=e1075]
                      - paragraph [ref=e1076]: 1 当社グループの概要
                      - paragraph [ref=e1077]: 当社グループは、開発から品質保証まで手がける提案型の総合プラスチックメーカーであります。
                      - paragraph [ref=e1078]: 当社での材料開発、新工法、新設備開発が可能にする新製品の開発提案と多彩な生産技術を有することが強みであり、長年培ってきた生産管理の仕組みと製造工程の技術力により、得意先からの多品種変量かつ厳しい納期管理についても対応できる体制が整っております。
                      - paragraph [ref=e1079]: また、常に新しい発見と可能性を追い求め、軽くて加工自由度が高いというプラスチックの特性をさらに高めつつ、機能性・安全性・強度・耐久性・環境配慮など、より付加価値の高い製品の提供を目指し、開発と提案を行っております。
