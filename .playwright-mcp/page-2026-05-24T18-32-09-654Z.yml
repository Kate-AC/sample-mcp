                      - paragraph [ref=e1001]: 当社グループは、当社及び連結子会社5社で構成され、臨床検査事業、調剤薬局事業及びICT事業を行っております。
                      - paragraph [ref=e1002]: 当社グループの事業内容及び当社と連結子会社の当該事業に係る位置付けは、次のとおりであります。
                      - paragraph [ref=e1003]: 次の3事業は「第5 経理の状況 1 連結財務諸表等 (1)連結財務諸表 注記事項」に掲げるセグメントの区分と同一であります。
                      - paragraph [ref=e1004]: なお、当社は、有価証券の取引等の規制に関する内閣府令第49条第2項に規定する特定上場会社等に該当しており、これにより、インサイダー取引規制の重要事実の軽微基準については連結ベースの数値に基づいて判断することとなります。
                      - paragraph [ref=e1005]
                      - paragraph [ref=e1006]: (臨床検査事業)
                      - paragraph [ref=e1007]: (株)ファルコバイオシステムズは、各地の病院及び診療所等から臨床検体検査等を受託しており、その他に体外診断用医薬品等の製造・販売や、医療情報システムの販売を行っております。また、(株)アテストは体外診断用医薬品等の卸売を行っております。
                      - paragraph [ref=e1008]: (調剤薬局事業)
