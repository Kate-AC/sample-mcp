                      - paragraph [ref=e1045]
                      - paragraph [ref=e1046]: 当社グループ(当社及び当社の関係会社)は、(株)東計電算(当社)と、子会社2社並びに関連会社1社、及び親会社である(株)アップワードにより構成されており、情報処理・ソフトウェア開発業務(ソフトウェア開発業務・システム運用業務・ファシリティサービス業務)、機器販売業務、リース等その他の業務を営んでおります。
                      - paragraph [ref=e1047]: なお、次の各業務は、「第5 経理の状況 1.連結財務諸表等 (1)連結財務諸表注記事項」に掲げるセグメント情報の区分と同一であります。
                      - paragraph [ref=e1048]: また、当社の親会社である(株)アップワードと当社グループとの取引関係等については、「第5 経理の状況 1.連結財務諸表等 (1)連結財務諸表注記事項(関連当事者情報)」に記載のとおりであります。
                      - paragraph [ref=e1049]: 当社グループの事業内容及び当社と関係会社の当該事業に係る位置付けは次のとおりであります。
                      - paragraph [ref=e1050]: 情報処理・ソフトウェア開発業務
                      - paragraph [ref=e1051]: 非持分法適用関連会社ファインシステム(株)は、ソフトウェア開発業務を行っており、当社は同社に対しソフトウェア開発業務の一部を委託しております。
                      - paragraph [ref=e1052]: 非連結子会社TOUKEI(THAILAND)CO.,LTD.は、生産拠点を海外にシフトする日系企業に対応するため、平成24年7月タイの現地法人として設立いたしました。
                      - paragraph [ref=e1053]: 機器販売業務
                      - paragraph [ref=e1054]: 当社グループの開発したシステムに必要なハードウェアを顧客に販売しております。
                      - paragraph [ref=e1055]: 取扱商品は、日本電気(株)、富士通(株)、キヤノン(株)等のオフィスサーバー、パーソナルコンピュータ、その他の周辺機器が中心であります。
                      - paragraph [ref=e1056]: リース等その他の業務
                      - paragraph [ref=e1057]: 連結子会社イースタンリース(株)はOA機器リース・レンタル業務を営んでおります。又、当社は不動産の賃貸業務を行っております。
                      - paragraph [ref=e1058]
                      - paragraph [ref=e1059]: 関連事業の系統図は以下のとおりであります。
                      - paragraph [ref=e1060]
                      - paragraph [ref=e1061]: （画像は省略されました）
                      - paragraph
                      - paragraph [ref=e1062]: (注)非連結子会社であった大連東計軟件有限公司は、令和7年5月をもって清算いたしました。理由としまして、同社はオフショア拠点及び現地ユーザーのサポート等、当社システム開発業務の一部を担ってまいりましたが、中国市場の変化に伴い、経営資源の集中・効率化を図る必要があると判断したためであります。今後、同社の業務は協力会社である大連海科軟件有限公司へ全面的に委託することといたしました。当該清算による当社連結財務諸表への影響は軽微であります。
