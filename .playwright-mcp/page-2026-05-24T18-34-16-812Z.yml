                    - generic [ref=e847]:
                      - paragraph [ref=e848]
                      - heading "3 【事業の内容】" [level=3] [ref=e849]
                      - paragraph [ref=e850]: 当社グループは、当社連結子会社(株式会社ティー・ツー・クリエイティブ、株式会社モット、Qetic株式会社)により構成されており、当社グループが強みとする体験領域をコアとするプロモーション全般の企画・制作並びにそれに付帯する業務を行っております。
                      - paragraph [ref=e851]: 当社グループの事業は単一セグメントでありますが、企画・制作するプロモーション業務をカテゴリー別に分類すると、「リアルイベント」・「ハイブリッドイベント」・「統合プロモーション」及び「その他」と分類しております。
                      - paragraph [ref=e852]
                      - heading "(1)業務範囲" [level=4] [ref=e853]
                      - paragraph [ref=e854]: 当社は、プロモーション業務の企画から制作の実施までを受注し、「分析・調査」・「戦略立案・コンセプト策定」・「企画提案」・「実施制作」・「効果検証」並びにそれに付帯する業務を行いますが、それぞれの課題に応じて多くの手法があります。リアルイベント、オンラインプロモーション、WEBサイト、SNS、動画制作、デジタル広告、PR、OOH、TVCM等、目的や課題に合わせて当社のプロデューサーがプランナーをはじめとする各領域における専門性の高い社員、連結子会社及び外注先協力機関から最適なチームを編成してプランニング・プロデュースを行います。
                      - paragraph [ref=e855]: なお、連結子会社である株式会社ティー・ツー・クリエイティブは、「リアルイベント」・「ハイブリッドイベント」の領域において、主に「制作」・「運営」・「演出」を行っております。同様に、連結子会社である株式会社モットは、「TVCM」・「WEB動画」の領域において、「企画」・「制作」を行っております。また、連結子会社であるQetic株式会社は、デジタルコンテンツ領域において、「企画」・「制作」・「運用」を行っております。
                      - paragraph [ref=e856]
                      - heading "(2)事業系統図" [level=4] [ref=e857]
