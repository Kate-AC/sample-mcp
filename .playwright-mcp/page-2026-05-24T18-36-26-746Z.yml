                    - generic [ref=e850]:
                      - heading "3【事業の内容】" [level=3] [ref=e851]
                      - paragraph [ref=e852]: 当社グループは『食糧増産技術(アグリテクノロジー)と真心で世界の人々に貢献します』という経営理念の下、先進的な農薬及び肥料の研究開発、栽培技術の探求、製造及び国内外での販売を主たる事業として取り組んでおります。
                      - paragraph [ref=e853]: 当社グループ(当社及び当社の関係会社)は、当社(OATアグリオ株式会社)及び連結子会社29社(旭化学工業株式会社、潤禾(舟山)植物科技有限公司、OAT&IIL India Laboratories Private Limited、Asahi Chemical Europe s.r.o.、PT. OAT MITOKU AGRIO、LIDA Plant Research, S.L.、株式会社インプランタイノベーションズ、Blue Wave Holding B.V.等)と非連結子会社1社及び関連会社2社により構成されております。
                      - paragraph [ref=e854]: 当社グループは、特徴的な農薬製品や肥料製品及び独創的な栽培技術を持ち、生産者や一般消費者に対し多様な支援を行い、そこで得られた現場のニーズをフィードバックし研究開発に活用しております。
                      - paragraph [ref=e855]: 現在、当社グループは以下の3つの技術ごとにサービスを提供しており、それらの定義を次のように考えております。
                      - paragraph [ref=e856]: (1)防除技術
                      - paragraph [ref=e857]: 防除技術とは、農作物に対して悪影響を与える病害虫から農作物を守る技術と、不要な植物(雑草類)を駆除する技術を合わせた総称であります。当社グループでは、植物の医薬品と位置づける「農薬」として提供しております。
                      - paragraph [ref=e858]: (2)施肥灌水技術
                      - paragraph [ref=e859]: 施肥灌水技術とは、農作物を適正に生育させるための栄養分を与える技術と、農作業の省力化や効率化を図る技術を合わせた総称であります。当社グループでは、植物の栄養分と位置づける「肥料」とそれらを農作物に供給する「養液土耕栽培システム」として供給しております。
                      - paragraph [ref=e860]: (3)バイオスティミュラント
                      - paragraph [ref=e861]: バイオスティミュラントとは、植物が本来持つ能力や機能を高め、耐寒性・耐暑性・病害虫耐性及び成長促進を促す物質や技術の総称であります。当社グループでは、バイオスティミュラントに属する肥料、活力剤を提供しております。
                      - paragraph [ref=e862]
                      - paragraph [ref=e863]: (食糧増産に貢献する技術と当社グループが提供するサービス)
                      - paragraph [ref=e864]
                      - paragraph [ref=e865]: （画像は省略されました）
                      - paragraph
                      - paragraph [ref=e866]: 当社グループの特徴は、上記3つの技術ごとにサービスを提供することによって、食糧増産を目指す多面的なソリューションを提供できる点にあります。環境問題や食糧増産問題に直面する農業従事者をターゲットとして、現場のニーズや悩みを汲み上げ、農薬・肥料・バイオスティミュラント全方面の研究開発へ活用してまいります。また、「栽培」を通じた企業文化の構築による新たにD2Cビジネスに挑戦し、多様な製品を一般消費者にも提供していくことができると考えております。
                      - paragraph [ref=e867]: また、循環型社会の実現を目指したプロバイオポニックス(有機質肥料活用型養液栽培)の実証試験、施設園芸分野での省力化・効率化、ビッグデータを活用したスマート農業の実践に向けた栽培トータルソリューションサービス『アグリオいちごマスター』のバージョンアップや普及にも引き続き取り組んでまいります。今後、新規就農者や農業分野へ新規参入を検討の企業などをターゲットに様々な形でサービスを提供できると考えております。
                      - paragraph [ref=e868]
                      - paragraph [ref=e869]: 当社グループの主要製品である農薬・肥料・バイオスティミュラント製品を提供するためには、原体と呼ばれる有効成分や各種製剤を自社開発する研究開発体制が必要となります。
                      - paragraph [ref=e870]: 当社グループは研究開発拠点として、国内及び海外(インド共和国・スペイン)に3拠点を保有しております。
                      - paragraph [ref=e871]: 国内の研究開発拠点として、徳島県鳴門市に研究所を開設し、原体の自社開発や各種製剤開発のため、化合物の合成やスクリーニングを行っております。同地には研究所だけでなく、当社グループの開発した原体や各種製剤を生産する工場設備や生産された農薬・肥料・バイオスティミュラント製品の有効性を実地調査するための栽培研究センターも併設しております。
                      - paragraph [ref=e872]: 海外の研究開発拠点として、インド共和国にInsecticides(India)Limitedとの共同研究所OAT&IIL India Laboratories Private Limitedを設立し、国内の研究開発拠点と同様に化合物の合成やスクリーニングを行っております。また、スペインのLIDA Plant Research, S.L.では、バイオスティミュラント製品の研究開発を行っております。 当社グループは、アグリテクノ事業の単一セグメントであるため、技術ごとに当社グループのサービスについて記載しております。
                      - paragraph [ref=e873]
                      - paragraph [ref=e874]: (1)防除技術(農薬製品の提供)
                      - paragraph [ref=e875]: 当社グループは、農薬の研究開発及び製造を行い、全農(全国農業協同組合連合会)を始め、商社やメーカー向けに販売を行っております。
                      - paragraph [ref=e876]: 農業では、特定の作物を人為的な環境で単一栽培するため、病害虫や雑草が発生しやすく、一定の収量と品質を確保することが困難となります。
                      - paragraph [ref=e877]: 農薬は、農作物の栽培を行う上で、その収量や品質、また安全性の確保に重要な役割を担っており、国内外の食糧増産に貢献しております。
                      - paragraph [ref=e878]: 農薬の機能ごとの分類として、殺虫剤・殺菌剤・殺虫殺菌剤・除草剤・殺そ剤・植物成長調整剤・補助剤・その他に分類されます。
                      - paragraph [ref=e879]
