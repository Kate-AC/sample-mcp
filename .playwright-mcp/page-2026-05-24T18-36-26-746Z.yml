                              - paragraph [ref=e1213]: トマト用の葉面散布液肥
                      - paragraph [ref=e1214]
                      - paragraph [ref=e1215]: 1販売体制
                      - paragraph [ref=e1216]: アトニックにつきましては、当社海外営業部を通じて広く海外向けに販売活動を行っております。また、当社グループのAsahi Chemical Europe s.r.o.を通じて、主に東ヨーロッパ向けに販売活動を行っております。
                      - paragraph [ref=e1217]: 具体的には欧州でのプロモーション活動や、バイオスティミュラント学会の開催を行い、販売促進に注力しております。
                      - paragraph [ref=e1218]
                      - paragraph [ref=e1219]: スペインのLIDA Plant Research, S.L.のネットワークを通じて、LIDA Plant Research, S.L.の開発した製品をヨーロッパ、南北アメリカなどへ積極的な営業活動を行っております。
                      - paragraph [ref=e1220]: 当社グループでは、バイオスティミュラント製品におきましては、国内営業本部と営業支援室が、マーケティングに基づいた販売拡大対策を立案し、全国6ヶ所にある国内2支店、4営業所を通じて、代理店を通して新規顧客獲得、販路拡大などの営業活動を行っております。また、丸善薬品産業株式会社との業務提携により一層営業活動を深掘りしてまいります。マーケティング体制としましては、支店に配置した営業グループがきめ細かいマーケティング活動を通じて、顧客ニーズへの対応に努めております。
                      - paragraph [ref=e1221]
                      - paragraph [ref=e1222]: 2研究開発体制
                      - paragraph [ref=e1223]: 当社研究開発部のBS開発グループと旭化学工業株式会社、スペインのLIDA Plant Research, S.L.の研究所において、既に当社グループに収益貢献している「アトニック」とそれに続く製品の開発を行っております。
