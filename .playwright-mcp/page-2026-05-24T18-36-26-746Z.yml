                      - paragraph [ref=e1075]
                      - paragraph [ref=e1076]: (2)施肥灌水技術(肥料製品の提供)
                      - paragraph [ref=e1077]: 当社グループは、施設園芸農家向けに養液土耕栽培システムと肥料の販売を行っております。
                      - paragraph [ref=e1078]: 養液土耕栽培システムは、液体肥料混入機と点滴チューブ及びその他周辺部材から構成され、養水分を正確に作物の株元に供給できるシステムです。作物の生育ステージに合わせて水と肥料の正確な施用を自動化することで、農業従事者の間口を広げると共に、農作物の収穫量向上に貢献します。
                      - paragraph [ref=e1079]: 養液土耕システムは、農家の労力軽減、環境負荷の低減、作物の品質向上や収穫量増加などの目的で使用されています。発売開始後25年以上の実績があり、累計販売台数は約3,000台で全国の農家に導入されております。2017年度からは新機種である液肥混入機TT(Tractable(扱いやすく)&Trustable(信頼できる))シリーズの販売を開始いたしました。導入されている作物は、トマト、いちご、きゅうり、ピーマン、ぶどう、カーネーション等多岐に亘っております。現在、養液土耕システムと生育診断システムを一体化した新サービス『アグリオいちごマスター』を本格的に国内市場にて普及活動を行い、スマート農業に参入してまいります。今後は、いちご以外の作物(トマト、ピーマンなど)にも広げる予定です。
