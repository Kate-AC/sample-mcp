                      - paragraph [ref=e1144]: 1販売体制
                      - paragraph [ref=e1145]: 当社グループでは、肥料とシステムにおきましては国内営業本部と営業支援室が、マーケティングに基づいた販売拡大対策を立案し、全国6ヶ所にある国内2支店、4営業所と、子会社の株式会社養液土耕栽培研究所を通じた活動により、全農、商系代理店を通して新規顧客獲得、販路拡大などの営業活動を行っております。また、丸善薬品産業株式会社との業務提携により一層営業活動を深掘りしてまいります。マーケティング体制としましては、支店に配置した営業グループがきめ細かいマーケティング活動を通じて、顧客ニーズへの対応に努めております。
                      - paragraph [ref=e1146]: また、これら当社グループの施肥灌水技術を家庭菜園や農業の現場へ提供しやすくするため、ウェブ直販サイト「AGRIO」の運営をしております。ウェブ直販サイト「AGRIO」では、リビングで野菜を育てる水耕栽培キット「Living Garden」や農作物の育成に必要な肥料成分を1本でカバーする専門肥料「ベジタブルライフA」、ステビアを利用した農業資材「OATファームA」、切り花のながもち液「美咲」等、一般消費者向けの商品を中心に取扱いを行っております。同サイトでは、園芸家の方や華道家の方から、使用方法等についてのアドバイスを掲載しております。
                      - paragraph [ref=e1147]: オランダのBlue Wave Holding B.V.(クリザールグループ)が持つネットワークを通じて、ヨーロッパ、アフリカ、南北アメリカ及びアジア各国の世界中の市場へ、切り花の品質保持剤(クリザールシリーズ)の積極的な営業活動を行っております。
                      - paragraph [ref=e1148]
                      - paragraph [ref=e1149]: 2研究開発体制
                      - paragraph [ref=e1150]: 当社グループでは、徳島県鳴門市に研究開発部肥料・BS開発グループと栽培研究センターを設置し、施設園芸作物の施肥灌水技術並びに、肥料製品の品質改善と安定生産のための技術開発を行っております。
                      - paragraph [ref=e1151]: またBlue Wave Holding B.V.(クリザールグループ)の研究所において、切り花の品質保持剤(クリザールシリーズ)の品質改善のための技術開発や新製品開発を行っております。
                      - paragraph [ref=e1152]
                      - paragraph [ref=e1153]: (3)バイオスティミュラント(植物成長調整剤の提供)
                      - paragraph [ref=e1154]: バイオスティミュラントは、植物が本来持つ免疫力や機能を高め、耐寒性・耐暑性・病害虫耐性及び成長促進を促す物質や技術を指しております。バイオスティミュラントは国内での認知度は向上段階にありますが、近年ヨーロッパを中心に、植物の成長や健康を助ける働きを持つバイオスティミュラントが、農薬や肥料と同等の独立した枠組みで捉えられようとしております。
                      - paragraph [ref=e1155]: 当社では、バイオスティミュラントの一つである植物成長調整剤「アトニック」の販売を足がかりに、防除技術、施肥灌水技術に続く、当社サービスの第三の柱として確立すべく、注力しております。
                      - paragraph [ref=e1156]: 国内でもスペインのLIDA Plant Research, S.L.が開発した天然物由来成分を配合した3製品を全国に展開しており、さらに、環境ストレスの低減や果皮強度の向上が期待できる製品「プロテクト」、気孔の開口をコントロールすることにより光合成を促進させ収量増加が期待できる製品「ポテト―ル」の普及を行ってまいります。また、当連結会計年度に上市した猛暑対策製品「炎天マスター」のさらなる普及・拡大を行ってまいります。
                      - paragraph [ref=e1157]
