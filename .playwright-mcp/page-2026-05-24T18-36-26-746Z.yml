                      - paragraph [ref=e1057]: ※1 当社が「農薬登録を有する天然・食品添加物由来又は有機JAS適合農薬など使用回数に制限のない安心安全な環境にも優しい防除資材」と定義している『グリーンプロダクツ』製品となっております。
                      - paragraph [ref=e1058]: ※2 買収等により取得した製剤であり、特許出願をしておりませんので、記載を省略しております。
                      - paragraph [ref=e1059]: ※3 国内登録を取得しておりませんので、記載を省略しております。
                      - paragraph [ref=e1060]: ※4 日本国内において、植物成長調整剤は農薬として規制を受けておりますが、当社においてこのうち「アトニック」につきましては、バイオスティミュラントとして区別しております。
                      - paragraph [ref=e1061]
                      - paragraph [ref=e1062]: 1販売体制
                      - paragraph [ref=e1063]: 当社グループの販売体制としましては、国内向けは国内営業本部と営業支援室が、マーケティングに基づいた販売拡大対策を立案し、国内2支店、4営業所が、全農、商系代理店を通じた新規顧客獲得、販路拡大などの営業活動を行っております。また、丸善薬品産業株式会社との業務提携により一層営業活動を深掘りしていきます。
                      - paragraph [ref=e1064]: 海外向けは海外営業本部を窓口として、商社経由の販売体制と当社及び当社グループ会社直販体制の両面から、当社グループ会社と協議の上で海外の顧客へアプローチしております。特にアジア・中南米・アフリカ地域は人口増加率が高く、今後の成長が見込まれる市場であるため、アジア・中南米・アフリカ地域への販売体制を強化しております。
                      - paragraph [ref=e1065]: 具体的な取組みとしましては、農家集会での商品説明会やパートナー企業向け技術説明会等を行い、販売促進に注力しております。
                      - paragraph [ref=e1066]
                      - paragraph [ref=e1067]: 2研究開発体制
                      - paragraph [ref=e1068]: 当社グループでは、徳島県鳴門市にある研究所に研究開発部を置き、「人や環境に優しい」、「高い安全性」、「世界に通用する独創的な技術」、「世界的なニーズの高い分野の開発」をキーワードに、基礎研究から応用研究まで行っております。
                      - paragraph [ref=e1069]: 国内で農薬を新規に開発し、製造・販売を行うには、農薬取締法に定められた登録を取得する必要があります。登録の取得には、厳格な手続きと多様な試験が要求され、およそ十年の歳月と数十億円に及ぶ経費を要すると想定されます。(図表)
                      - paragraph [ref=e1070]: 当社では、インドの子会社OAT&IIL India Laboratories Private Limitedとの協力体制を構築し、自社での新規農薬の研究開発スピード向上に取り組んでおります。
                      - paragraph [ref=e1071]
                      - paragraph [ref=e1072]
