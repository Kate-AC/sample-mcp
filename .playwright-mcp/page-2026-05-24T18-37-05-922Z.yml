                      - heading "3【事業の内容】" [level=3] [ref=e1077]
                      - paragraph [ref=e1078]: 当社グループは、当社、連結子会社5社(北興産業(株)、美瑛白土工業(株)、ホクコーパツクス(株)、村田長(株)、張家港北興化工有限公司)および非連結子会社1社(HOKKO CHEMICAL AMERICA CORPORATION)により構成されており、農薬ならびにファインケミカル製品の製造・販売を主たる事業として行っています。
                      - paragraph [ref=e1079]: 当社グループの事業における位置付けおよびセグメントとの関連は、次のとおりです。
                      - paragraph [ref=e1080]: (1)農薬事業
                      - paragraph [ref=e1081]: 農薬につきましては、当社が製造していますが、当社で使用する農薬原料の一部は、連結子会社美瑛白土工業(株)が製造しています。
                      - paragraph [ref=e1082]: 製品の販売につきましては、当社が主として行っていますが、一部の農薬は、連結子会社北興産業(株)が販売しており、連結子会社美瑛白土工業(株)は、バルーンおよび銅基剤等を販売しています。
                      - paragraph [ref=e1083]: 非連結子会社 HOKKO CHEMICAL AMERICA CORPORATION(米国ノースカロライナ州)は、北中南米における農薬市場の調査および当社が販売する農薬製品の普及活動を行っています。
                      - paragraph [ref=e1084]: (2)ファインケミカル事業
                      - paragraph [ref=e1085]: 電子材料原料等のファインケミカル製品につきましては、当社が主として製造していますが、製造の一部は、連結子会社張家港北興化工有限公司(中国江蘇省)が行っています。
                      - paragraph [ref=e1086]: 製品の販売につきましては、当社が主として行っていますが、連結子会社北興産業(株)が一部を国内で販売しており、また、連結子会社張家港北興化工有限公司が一部を中国国内等に販売しています。
                      - paragraph [ref=e1087]: (3)繊維資材事業
                      - paragraph [ref=e1088]: 繊維資材につきましては、村田長(株)が販売しています。
