                      - paragraph [ref=e991]
                      - heading "3 【事業の内容】" [level=3] [ref=e992]
                      - paragraph [ref=e993]: 当グループは日本農薬株式会社(当社)及び関係会社27社で構成されており、その内訳は親会社1社、連結子会社10社、非連結子会社10社(持分法適用非連結子会社4社)、関連会社6社(持分法適用関連会社3社)です。
                      - paragraph [ref=e994]: 事業としては、農薬の製造・販売を主として行っており、この他にも医薬品の製造、関係会社による造園緑化工事、不動産の賃貸、農薬の生産・物流業務等の請負、建物の付帯設備の営繕、作物・環境中の残留農薬の分析等を行っています。
                      - paragraph [ref=e995]: 当社グループの事業内容と当社及び関係会社の当該事業に係わる位置づけは次のとおりです。
                      - paragraph [ref=e996]: なお、次の3部門は「第5 経理の状況 1 (1) 連結財務諸表 注記事項」に掲げるセグメント情報の区分と同一です。
                      - heading "(1) 農薬事業" [level=4] [ref=e997]
                      - paragraph [ref=e998]: ・殺虫剤、殺菌剤、殺虫殺菌剤、除草剤、農薬原体、その他
                      - paragraph [ref=e999]: 当社が製造し、全国に跨る特約店網、JA、全農及び農薬メーカー等を通じて販売しています。連結子会社のNichino America,Inc.、Nichino India Pvt.Ltd.、Sipcam Nichino Brasil S.A.、Nichino Europe Co.,Ltd.、持分法適用非連結子会社のInteragro (UK) Ltd.、持分法適用関連会社のSipcam Europe S.p.A.、Agricultual Chemicals (Malaysia) Sdn.Bhd.、関連会社の第一農薬(株)は、それぞれ米国、インド、ブラジル、欧州、マレーシア、沖縄で製造、販売しています。連結子会社の日佳農葯股份有限公司、Nichino Vietnam Co.,Ltd.、非連結子会社のNihon Nohyaku Andica S.A.S.、Nichino Mexico S. de R.L. de C.V.は、台湾、東南アジア、中米で販売しています。また、関連会社の(株)アグロ信州は、当社品の販売先です。連結子会社の(株)ニチノー緑化は、ゴルフ場向け農薬及び家庭園芸用薬剤を販売しています。連結子会社の(株)ニチノーサービスに農薬の生産業務を委託しています。
                      - paragraph [ref=e1000]: ・親会社の(株)ADEKAより原料を購入しています。
                      - heading "(2) 農薬以外の化学品事業" [level=4] [ref=e1001]
                      - paragraph [ref=e1002]: ・木材薬品
                      - paragraph [ref=e1003]: 連結子会社の(株)アグリマートから特約店等を通じて販売しています。
                      - paragraph [ref=e1004]: ・医薬品等
                      - paragraph [ref=e1005]: 外用抗真菌剤、動物用医薬品、飼料添加物等を主として当社が製造し、医薬品メーカー等を通じて販売しています。
                      - paragraph [ref=e1006]
                      - heading "(3) その他" [level=4] [ref=e1007]
                      - heading "1 造園緑化工事" [level=5] [ref=e1008]
                      - paragraph [ref=e1009]: ・連結子会社の(株)ニチノー緑化は、緑化・造園その他の建設工事の請負、設計、施工、監理を行っています。
                      - heading "2 不動産の賃貸" [level=4] [ref=e1010]
                      - paragraph [ref=e1011]: ・連結子会社の(株)ニチノーサービスは、不動産の賃貸を行っています。
                      - heading "3 農薬物流業務等の請負及び倉庫業" [level=5] [ref=e1012]
                      - paragraph [ref=e1013]: ・連結子会社の(株)ニチノーサービスは、農薬の受注、保管、配送の請負等を行っています。
                      - heading "4 作物・環境中の農薬残留分析" [level=5] [ref=e1014]
                      - paragraph [ref=e1015]: ・連結子会社の日本エコテック(株)は、作物、食品、ゴルフ場の排水、河川等に含まれる農薬残留の分析を行っています。
                      - paragraph [ref=e1016]
                      - paragraph [ref=e1017]: 上記の事業の系統図は次のとおりです。
