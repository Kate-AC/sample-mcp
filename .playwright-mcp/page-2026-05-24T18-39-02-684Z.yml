                      - heading "3 【事業の内容】" [level=3] [ref=e973]
                      - paragraph [ref=e974]: 当社は、持株会社としてグループ会社の経営管理及びそれに付帯する業務を行っております。
                      - paragraph [ref=e975]: また、当社の関係会社(連結子会社38社、関連会社4社)が営んでいる主な事業は、道路舗装に関する製品、技術、工事等を幅広く提供する事業活動を展開しております。
                      - paragraph [ref=e976]: 当社グループの事業に係わる会社の位置付けおよびセグメントとの関連は、次のとおりであります。
                      - paragraph [ref=e977]: なお、セグメントと同一の区分であります。
                      - paragraph [ref=e978]: (1) アスファルト応用加工製品事業
                      - paragraph [ref=e979]: 当社の連結子会社ニチレキ(株)は、アスファルト乳剤、改質アスファルト等の製造・販売を行っております。また、連結子会社および海外関係会社の一部は、ニチレキ(株)の製品を販売しております。
                      - paragraph [ref=e980]: (2) 道路舗装事業
                      - paragraph [ref=e981]: 当社の連結子会社日瀝道路(株)他34社ならびに海外関係会社の一部は、舗装工事および防水工事等の請負を行っております。
                      - paragraph [ref=e982]: (3) その他
                      - paragraph [ref=e983]: 当社および連結子会社の一部は、不動産の賃貸を行っております。また連結子会社安全開発(株)は、当社グループの損害保険代理業等を行っております。
