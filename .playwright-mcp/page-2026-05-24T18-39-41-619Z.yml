                      - paragraph [ref=e979]
                      - heading "3 【事業の内容】" [level=3] [ref=e980]
                      - paragraph [ref=e981]: 当社グループは、「はたらく人々を幸せに。」というパーパス(存在意義)のもと、最適なワークプレイスを導き出し、働く人々のエンゲージメント(従業員満足度)を高めながら、企業価値をさらに向上させる環境をデザインする「ワークデザイン」(働く環境や働き方のデザイン)に関連するサービスを展開しております。
                      - paragraph [ref=e982]: 昨今の生産年齢人口の減少や働き方改革の推進等により、業務効率の向上、企業文化やロイヤルティの醸成など、ワークプレイスへのニーズが多様化し、「場所」から「人」を中心とした考え方へ変化しております。さらに、新型コロナウイルス感染症の流行により、働く環境や働き方の多様化が急速に進み、働き方に合わせてワークプレイスを構築する時代に社会は変化しております。
                      - paragraph [ref=e983]: このような社会の変化の中、当社グループは、「ワークデザイン」に関連するサービスをワンストップで提供することにより、働く人々の幅広い価値観に対応し、企業価値の向上や働く人々のエンゲージメントの向上を目指す企業を支援してまいります。
                      - paragraph [ref=e984]
                      - paragraph [ref=e985]: (1) サービス概要
                      - paragraph [ref=e986]: 1 ブランディング(ブランディング事業)
                      - paragraph [ref=e987]: ブランディングでは、オフィスデザイン・グラフィックデザイン・ウェブデザインなどのオフィスに存在するすべてのデザインをワンストップで提供しており、これらのデザインを通して、企業のアイデンティティの確立と企業ブランドの構築を支援しております。当社グループでは、高成長企業を中心とした中小企業から社員満足度の向上や新しい働き方等を経営課題とする大手・老舗企業までを対象に幅広く展開しており、企業ごとに異なる課題や要望に対して、当社グループが手掛けた8,000件以上の実績の中で培ってきたノウハウを生かした最適なソリューションを提供しております。
                      - paragraph [ref=e988]: オフィスデザインでは、オフィスの移転・改装を行う企業に対して、オフィスのプランニングから設計・デザイン、施工まで行い、オフィスの移転や改装に関わる一連のマネジメントを行っております。
                      - paragraph [ref=e989]: グラフィックデザインでは、会社案内、商品パンフレット、販促ツール、ポスターや名刺に至るまで、さまざまなグラフィックデザインを行っております。
                      - paragraph [ref=e990]: ウェブデザインでは、ウェブサイトの制作、モバイルサイト・スマートフォン用サイトの制作などを行っております。
                      - paragraph [ref=e991]
                      - paragraph [ref=e992]: 〔ブランディング事例(オフィスデザイン)〕
                      - paragraph [ref=e994]: （画像は省略されました）
                      - paragraph [ref=e995]
                      - paragraph [ref=e996]: 2 データソリューション(データソリューション・プレイスソリューション事業)
                      - paragraph [ref=e997]: データソリューションでは、ワークプレイス構築DXツール「ワークデザインプラットフォーム」や組織改善サーベイ「ココエル」を提供しております。
                      - paragraph [ref=e998]: 「ワークデザインプラットフォーム」では、ワークプレイスの空間稼働率分析・コストシミュレーション・従業員満足度サーベイの3つの視点で分析を行い、場所、コスト、人的資本の観点から企業の課題の可視化と企業ごとの最適なワークプレイスの構築支援を行っております。
                      - paragraph [ref=e999]: 従業員の状態を把握する「ココエル」では、ストレスチェックの項目に職場環境を適切に把握できる設問を追加した141項目で、メンタル・フィジカル・エンゲージメントについて状態把握・要因分析を行い、組織分析を行っております。
                      - paragraph [ref=e1000]
                      - paragraph [ref=e1001]: 〔レポートイメージ(ワークデザインプラットフォーム、ココエル)〕
                      - paragraph [ref=e1003]: （画像は省略されました）
                      - paragraph [ref=e1004]
                      - paragraph [ref=e1005]: 3 プレイスソリューション(データソリューション・プレイスソリューション事業)
                      - paragraph [ref=e1006]: プレイスソリューションでは、オフィスビルの改装や遊休資産の再稼働などにより、ビルの資産価値を向上させるビルコンバージョンや不動産の有効活用支援を行っております。
                      - paragraph [ref=e1007]: また、「TSUMUGI(紡ぎ)」をコンセプトとしたフレキシブルオフィス「The Place」の運営を行い、スタートアップ企業向けのテナント賃貸やシェアオフィス(レンタルオフィス)、コワーキングスペースを提供しております。イベントの開催などを通じて「企業と企業、企業と個人が出会い、新たな価値を創出する場」を提供しております。
                      - paragraph [ref=e1008]
