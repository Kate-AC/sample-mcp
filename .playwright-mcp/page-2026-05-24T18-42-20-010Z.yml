                      - paragraph [ref=e1036]: 当社グループ(当社および当社の関係会社等)は、当社(日本山村硝子株式会社)、子会社14社、関連会社2社およびその子会社等で構成されており、ガラスびん、プラスチック容器、エレクトロニクス用ガラス等の製造、販売ならびにこれに関連した各種機器、プラント類の設計、製作、販売や輸送・保管・構内作業等の事業活動を展開しております。
                      - paragraph [ref=e1037]: 当社グループが営んでいる主な事業内容と当該事業に係わる各社の位置づけは、次のとおりです。
