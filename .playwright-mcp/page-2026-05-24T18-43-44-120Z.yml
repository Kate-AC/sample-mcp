                      - paragraph [ref=e1159]: 当社グループ(当社及び当社の関係会社)は、当社(ヤマウホールディングス株式会社)及び連結子会社8社(株式会社ヤマウ、メック株式会社、光洋システム機器株式会社、大分フジ株式会社、開成工業株式会社、大栄開発株式会社、株式会社熊本ヤマウ、中外道路株式会社)で構成されており、土木製品、景観製品、レジンコンクリート製品から構成されるコンクリート製品製造・販売を主な事業内容とし、更に水門・堰の製造及び施工並びに保守事業、地質調査・コンサルタント業務及び土木工事業、情報機器の販売及び保守事業、コンクリート構造物の点検・調査、補修工事事業、橋梁・高架道路用伸縮装置の製造・販売・設置工事事業、不動産事業に取り組んでおります。
                      - paragraph [ref=e1160]: なお、当社は特定上場会社等に該当し、インサイダー取引規制の重要事実の軽微基準のうち、上場会社の規模との対比で定められる数値基準については、連結ベースの計数に基づいて判断することとなります。
