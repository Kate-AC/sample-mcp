                      - paragraph [ref=e985]: 当社グループは、当社と連結子会社3社により構成され、その事業内容は次のとおりであります。
                      - paragraph [ref=e986]: また、次の3部門は「第5 経理の状況 1 連結財務諸表等 (1)連結財務諸表 注記事項」に掲げるセグメントの区分と同一であります。
                      - paragraph [ref=e987]
                      - paragraph [ref=e988]: (1)土木用セメント製品事業 ---- 土木用コンクリート二次製品(道路用製品、景観用製品等)の製造・販売、付随する商品・資材の販売及び施工を行っております。当事業は当社及びすべての連結子会社が行っております。
                      - paragraph [ref=e989]: (2)建築用セメント製品事業 ---- 建築用コンクリート二次製品(PCa床・梁・柱・バルコニー、戸建て住宅用PCa壁・床等)の製造・販売、付随する商品・資材の販売及び施工を行っております。当事業は当社及び(株)東北ヤマックスが行っております。
                      - paragraph [ref=e990]: (3)その他の事業 -------------- 木造住宅等の施工販売、不動産の販売及び宅地の開発などの不動産関連事業を行っております。当事業は当社が行っております。
