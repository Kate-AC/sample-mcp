                    - generic [ref=e1116]:
                      - heading "3【事業の内容】" [level=3] [ref=e1117]
                      - paragraph [ref=e1118]: 当社グループは、当社および子会社29社で構成され、工業用ファスナーおよび工具類(ファスナー事業)、産業用機械および精密組付機器(産機事業)、計測制御機器およびその他製品(制御事業)、医療機器(メディカル事業)の製造および販売を主たる事業の内容としております。
                      - paragraph [ref=e1119]: 当社グループの事業における位置付けおよびセグメントとの主な関連は、次のとおりであります。
                      - paragraph [ref=e1120]
                      - paragraph [ref=e1121]: (1)ファスナー事業
                      - paragraph [ref=e1122]: 当部門は、精密ねじ部品を基軸に、大幅な合理化を推進する特殊冷間圧造部品などの製造、販売を行っております。当社は、上記製品の設計、原材料の調達、加工、検査、包装までを一貫して行い、関係会社から仕入れた完成品とともに、これら製品を国内およびアジア、北米を中心とする海外市場にて販売しております。
                      - paragraph [ref=e1123]: 国内には、工業用ファスナーの製造・販売を行っている東洋圧造(株)、(株)協栄製作所およびケーエム精工(株)、工業用ファスナーに使用される工具類の製造・販売を行っている東陽精工(株)、工業用ファスナーの製造工程の一部を受託している(株)ニッセイおよび(株)ファイン、精密プレス製品および金型の製造・販売を行っている(株)伸和精工、工業用ファスナーなどの販売を行う関係会社3社(和光(株)、松浦屋(株)、(株)ピニング)があります。また、海外には、工業用ファスナーなどの製造・販売を行っている関係会社12社(PT.NITTO ALAM INDONESIA、旭和螺絲工業股份有限公司他10社)などがあります。
                      - paragraph [ref=e1124]
                      - paragraph [ref=e1125]: (2)産機事業
                      - paragraph [ref=e1126]: 当部門は、組立工場の自動化、高品質化、高効率化を実現するための自動ねじ締め機、自動リベットかしめ機、搬送コンベア、各種ロボット等の製造、販売を行っております。国内においては、当社および日東公進(株)において、設計、原材料の調達、加工、組立、検査、梱包までを一貫して行い、これら製品を国内および海外各地域で販売しております。また、海外には、産業用機械の製造・販売を行っているTHAI NITTO SEIKO MACHINERY CO.,LTD.およびNITTO SEIKO AMERICA CORPORATIONがあります。
                      - paragraph [ref=e1127]
                      - paragraph [ref=e1128]: (3)制御事業
                      - paragraph [ref=e1129]: 当部門は、長年培ってきた精密加工技術を活かし、各種流量計をはじめ数多くの流体計測機器、画像センサを用いた高性能検査選別装置、地盤調査用の自動貫入試験機そして環境負荷を低減するマイクロバブル洗浄装置などを製造、販売しております。国内には、分析関連機器の開発・製造・販売・メンテナンスを行っている日東精工アナリテック(株)があります。また、海外には、分析機器・計測機器の販売・技術サービスおよびアプリケーション開発を行っているNITTOSEIKO ANALYTECH EUROPE GMBHがあります。
                      - paragraph [ref=e1130]
                      - paragraph [ref=e1131]: (4)メディカル事業
                      - paragraph [ref=e1132]: 当部門は、医療用ねじの製造で培った技術や経験を活かして、医療用照明機器などの製造、販売を行っております。
                      - paragraph [ref=e1133]
