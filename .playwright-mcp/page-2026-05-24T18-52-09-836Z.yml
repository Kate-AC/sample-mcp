                    - generic [ref=e1043]:
                      - heading "3【事業の内容】" [level=3] [ref=e1044]
                      - paragraph [ref=e1045]: 当社グループ(当社および当社の関係会社)は当社、子会社18社、関連会社23社で構成され、機械装置、高圧ガスおよび溶接機材の製造、仕入、販売を行っております。
                      - paragraph [ref=e1046]: 当社グループの事業内容、各社の位置づけおよびセグメントとの関連は次のとおりです。
                      - paragraph [ref=e1047]: なお、部門区分はセグメントと同一であります。
                      - paragraph [ref=e1048]: 機械装置
                      - paragraph [ref=e1049]: 〔中大型切断機〕
                      - paragraph [ref=e1050]: 当社が製造および販売を行うほか、子会社(株)コイケテックに製造の一部を委託しております。また、米国においては子会社コイケアロンソン(株)、韓国においては子会社コイケコリア・エンジニアリング(株)、中国においては子会社小池酸素(唐山)有限公司が当社より部品の供給を受けて製造および販売を行っております。さらに、子会社コイケフランス(有)、コイケイタリア(有)、小池(唐山)商貿有限公司およびコイケヨーロッパ・ビー・ブイにおいても製品の販売を行っております。
                      - paragraph [ref=e1051]: なお、子会社コイケ酸商(株)および関連会社中野酸工(株)他3社においても製品を販売しており、子会社(株)コイケテックにおいて製品の据付、保守、サービスを行っております。また、機械部品の一部を関連会社小池商事(株)を通して仕入れております。
                      - paragraph [ref=e1052]: 〔ガス自動切断機、ガス溶断器具〕
                      - paragraph [ref=e1053]: 当社が製造および販売を行うほか、ガス自動切断機については、中国において子会社小池酸素(唐山)有限公司が製造および販売を行っております。また、ガス溶断器具については、子会社(株)群馬コイケが製造を行っており当社がこれを仕入れております。
                      - paragraph [ref=e1054]: なお、子会社コイケアロンソン(株)他6社および関連会社中野酸工(株)他3社においても製品を販売しております。
                      - paragraph [ref=e1055]: 〔溶接機械〕
                      - paragraph [ref=e1056]: 当社が製造および販売を行うほか、子会社(株)コイケテックに製造の一部を委託しております。
                      - paragraph [ref=e1057]: また、子会社コイケアロンソン(株)も製造および販売を行っております。
                      - paragraph [ref=e1058]: なお、子会社コイケヨーロッパ・ビー・ブイ他5社および関連会社中野酸工(株)他3社においても製品を販売しております。
                      - paragraph [ref=e1059]: 高圧ガス
                      - paragraph [ref=e1060]: 〔酸素、窒素、アルゴン、溶解アセチレン、プロパンガス等〕
                      - paragraph [ref=e1061]: 当社が各種工業用・医療用ガスの製造、仕入、販売を行っておりますが、酸素、窒素、アルゴンについては関連会社川崎オキシトン(株)、新洋酸素(株)、溶解アセチレンについては関連会社栃木共同アセチレン(株)、安浦アセチレン(株)、笑気ガス、滅菌ガス等の医療用ガスについては子会社(株)小池メディカル、プロパンガスについては関連会社小池化学(株)が製造し、当社はこれらを営業事業所、移充塡工場および子会社関西総合ガスセンター(株)、群馬総合ガスセンター(株)他2社および関連会社(株)市川総合ガスセンター他12社を通じて、販売店または直接需要家へ販売しております。
                      - paragraph [ref=e1062]: なお、子会社コイケ酸商(株)および関連会社中野酸工(株)他3社においても製品を販売しております。
                      - paragraph [ref=e1063]: 〔医療機器〕
                      - paragraph [ref=e1064]: 当社が販売を行っておりますが、子会社(株)小池メディカルおよび(株)群馬コイケが製造しております。
                      - paragraph [ref=e1065]: なお、子会社(株)小池メディカル、コイケ酸商(株)他1社においても製品を販売しております。
                      - paragraph [ref=e1066]: 溶接機材
                      - paragraph [ref=e1067]: 〔溶接棒、電気溶接機、安全保護具等〕
                      - paragraph [ref=e1068]: 当社が販売を行っておりますが、その一部を関連会社小池商事(株)を通して仕入れております。
                      - paragraph [ref=e1069]: なお、子会社(株)菱小、コイケ酸商(株)および関連会社中野酸工(株)他3社においてもこれらの商品の販売を行っております。
                      - paragraph [ref=e1070]
