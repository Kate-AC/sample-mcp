                      - heading "3 【事業の内容】" [level=3] [ref=e1031]
                      - paragraph [ref=e1032]: 当社グループは、当社、連結子会社3社及び持分法適用関連会社1社で構成され、「搬送機械事業」、「産業機械事業」、「精密機械事業」における製造販売、アフターサービス活動及び「その他の事業」における機械機器部品・立体駐車装置の販売、営繕工事を主な事業の内容としております。
                      - paragraph [ref=e1033]: 当社グループの事業に係わる位置づけ及びセグメントとの関連は次のとおりであります。なお、セグメントと同一の区分であります。
                      - paragraph [ref=e1034]: (1) 搬送機械事業
                      - paragraph [ref=e1035]: 当社が製造販売するほか、連結子会社西電興産(株)が販売を行っております。また、原材料の一部(調達品目...アルミ部品、LMガイド等)については、連結子会社西電興産(株)から仕入を行っております。連結子会社西部ペイント(株)が当社製品の塗装を行っております。主要株主(株)安川電機には設備として納入しております。
                      - paragraph [ref=e1036]
                      - paragraph [ref=e1037]: (2) 産業機械事業
                      - paragraph [ref=e1038]: 当社が製造販売するほか、連結子会社西電興産(株)が販売を行っております。原材料の一部(調達品目...ベアリング等)については、連結子会社西電興産(株)から仕入を行っております。連結子会社西部ペイント(株)が当社製品の塗装を行っております。
                      - paragraph [ref=e1039]
                      - paragraph [ref=e1040]: (3) 精密機械事業
                      - paragraph [ref=e1041]: 当社と連結子会社(株)西部ハイテックが製造販売するほか、連結子会社西電興産(株)及び持分法適用関連会社Seibu America Corporationが販売を行っております。原材料の一部(調達品目...ボールネジ、LMガイド等)については、連結子会社西電興産(株)から仕入を行っております。連結子会社西部ペイント(株)が当社製品の塗装を行っております。主要株主(株)安川電機に設備として納入しております。
                      - paragraph [ref=e1042]
                      - paragraph [ref=e1043]: (4) その他の事業
                      - paragraph [ref=e1044]: 機械機器部品・立体駐車装置の販売、営繕工事並びにその他の事業については、連結子会社西電興産(株)が主として行っております。
