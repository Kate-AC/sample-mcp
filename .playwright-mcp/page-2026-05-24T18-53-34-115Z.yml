                      - heading "3 【事業の内容】" [level=3] [ref=e1009]
                      - paragraph [ref=e1010]: 当社グループは連結財務諸表提出会社(以下「当社」という。)、子会社7社で構成され、巻線設備の開発、設計・製造、販売、送風機及び照明等住宅関連設備の製造、販売を主な事業内容としております。
                      - paragraph [ref=e1011]: 当社グループの事業内容と各社の位置づけは次のとおりであります。
                      - paragraph [ref=e1012]: なお、事業区分は事業セグメントと同一の区分であります。
                      - heading "(1) 巻線機事業" [level=5] [ref=e1013]
                      - paragraph [ref=e1014]: 家電製品分野、自動車分野、産業・医療機器分野、OA/AV機器分野、通信分野等向けにモーター用巻線設備及びボビンコイル用巻線設備を顧客の要望に沿って開発、設計・製造し、世界各国に販売しております。
                      - paragraph [ref=e1015]: "[主な関係会社]"
                      - paragraph [ref=e1016]: 当社、株式会社小田原オートメーション長岡、Odawara Automation Inc.、Odawara Automation Deutschland GmbH、小田原機械工程(広州)有限公司
                      - heading "(2) 送風機・住設関連事業" [level=5] [ref=e1017]
                      - paragraph [ref=e1018]: 室内空調機器の送風用ファン、工作機械等の冷却用ファンなど幅広い分野で使用されている小型送風機(クロスフローファン、軸流ファン等)、浴室等に使用される防水照明器具等及び住宅換気・ビル換気関連用製品を製造、販売しております。
                      - paragraph [ref=e1019]: "[主な関係会社]"
                      - paragraph [ref=e1020]: ローヤル電機株式会社、楽揚電機(香港)有限公司、楽揚電機(深圳)有限公司
                      - paragraph [ref=e1021]
                      - paragraph [ref=e1022]: 事業概要図は次のとおりであります。
                      - paragraph [ref=e1023]
                      - paragraph [ref=e1025]: （画像は省略されました）
