                    - generic [ref=e1077]:
                      - heading "3【事業の内容】" [level=3] [ref=e1078]
                      - paragraph [ref=e1079]: 当社グループ(当社及び当社の関係会社)は、「人々のこころを豊かで幸せにする良質なエンタテインメントを創出する!」という企業理念を掲げ、主に若年女性層をターゲットとしたマーケティング力や豊富なキャラクター版権を強みに、エンタテインメント関連の業種において多様な事業を展開する「総合エンタテインメント企業」です。当社グループは、当社及び連結子会社2社(オルドット株式会社、FURYU of America, Inc.)によって構成されており、事業区分は3つのセグメントで構成されております。
                      - paragraph [ref=e1080]: 当連結会計年度において、FURYU of America, Inc.を新たに設立したことに伴い、同社を連結の範囲に含めております。
                      - paragraph [ref=e1081]: なお、当事業の内容における事業区分と、「第5 経理の状況 1.連結財務諸表等 (1)連結財務諸表 注記事項」に掲げるセグメントの区分は同一であります。
                      - paragraph [ref=e1082]
                      - paragraph [ref=e1083]: (1) 世界観ビジネス
                      - paragraph [ref=e1084]: 当事業は、許諾を受けたキャラクター版権を利用し、アミューズメント施設にて提供されるクレーンゲーム景品のぬいぐるみ、フィギュア等や、コンビニエンスストア等に向けたキャラクターくじ「フリューくじ」及び、高価格帯のホビー商品を企画・販売する事業を展開しております。また、国内にとどまらず、中国及び米国を主要マーケットとした海外向け物販事業も行っております。
                      - paragraph [ref=e1085]: 当社が扱うキャラクター版権は流行に左右されない定番人気キャラクターから、社会現象となるような人気キャラクターまで、幅広い市場のニーズに対応したラインナップになっております。
                      - paragraph [ref=e1086]: 許諾を受けたキャラクターについて、企画(デザイン及び設計)を行い、製造は海外を含む外部企業に委託して商品化しております。商社等の中間流通業者を極力介さず、直接取引を中心とし、中間マージンの削減等によりコスト管理を徹底する一方で、委託先への立会審査、初回品判定の実施に加え、日本国内にて検針(商品への針の混在有無を検査する作業)を実施することにより、品質管理に努めております。
                      - paragraph [ref=e1087]
                      - paragraph [ref=e1088]: (2) ガールズトレンドビジネス
                      - paragraph [ref=e1089]: 当事業は、主にプリントシール事業及びプリントシール画像取得・閲覧サービス「ピクトリンク」事業の2つで構成されております。
                      - paragraph [ref=e1090]: プリントシール事業については、アミューズメント施設向けプリントシール機及びその消耗品であるシール紙の販売を中心とした事業です。ユーザーは、プリントシール機の内部に搭載された高性能カメラにて写真を撮影することで、画像データが印刷されたシールを取得できます。当社グループのプリントシール機は、撮影された写真データに画像処理を施すことで、主なターゲット層である10代~20代前半女性の多くが好む顔立ちや肌・髪の質感に近づけた仕上がりのシール及び写真データを作り出すことを可能にします。
                      - paragraph [ref=e1091]: さらに当社グループのプリントシール機は通信モジュールを通じてデータサーバーに接続されており、撮影画像データや動作状況を収集しています。このデータから導き出された定量的マーケティングと、ユーザーへのインタビューを通じた定性的マーケティングにより、ターゲット層のニーズに応えるプリントシール機を継続的に市場に投入しております。
                      - paragraph [ref=e1092]: プリントシール機及びその関連製品については、当社グループにて企画・開発・販売を手掛けておりますが、製品製造のための自社工場は所有せず、製造は全て外部に委託しております。
                      - paragraph [ref=e1093]: 販売経路は主に、アミューズメント施設等の店舗運営企業に向けて、プリントシール機本体とシール紙を販売する経路と、直営店「girls mignon(ガールズミニョン)」等でエンドユーザーからのプレイ料金として直接収入を得る経路の2つがあります。前者の経路には、プリントシール機本体の販売方式とレンタル方式の2種類があり、レンタル方式では、プリントシール機自体を提供し、プレイ料金の一定割合が当社グループの売上となります。
                      - paragraph [ref=e1094]: 「ピクトリンク」事業では、主にスマートフォンなどのモバイル端末を利用する若年女性層をターゲットとして、プリントシール画像取得・閲覧サービスを中心としたインターネット上のコンテンツの運営を行っております。
                      - paragraph [ref=e1095]: プリントシール機を利用するユーザーには、「モバイル端末に画像データを保存して、好きなタイミングで見たい」、「SNS(ソーシャル・ネットワーキング・サービス)等に利用したい」などの、画像データの再利用ニーズが存在します。「ピクトリンク」では、プリントシール機で撮影された画像データを、スマートフォンなどのモバイル端末から取得できるサービスや、画像データを整理できるアルバム機能を提供し、ユーザーに継続して利用されております。プリントシール機では通常、1プレイあたり4枚から7枚の撮影を行います。「ピクトリンク」では、撮影した画像データのうち1枚を無料で取得することが可能ですが、有料会員になるとすべての画像データが取得可能となります。
                      - paragraph [ref=e1096]: その他、写真スタジオ向けの画像処理レタッチソフト『FURYU retouch』を販売する事業も含まれております。当社のプリントシール機でのAI画像加工技術を活用し、撮影写真のレタッチ作業の品質と作業効率を向上するソフトの販売を行っております。
                      - paragraph [ref=e1097]: (3) フリューニュービジネス
                      - paragraph [ref=e1098]: 当事業では、家庭用ゲームソフト事業、アニメ事業、SNSマーケティングを主軸にしたファッションD2C事業を展開しております。
                      - paragraph [ref=e1099]: 家庭用ゲームソフト事業においては、PlayStation®4、PlayStation®5やNintendo SwitchTM等のハードに対応した家庭用ゲームソフト企画・開発・販売・運営を行っております。アニメや漫画などの人気キャラクターの版権を利用したゲームソフトと、著名な外部クリエイターを起用してクオリティを追求したオリジナルゲームソフトが中心であり、ゲームソフトの販売額が当社グループの売上となります。
                      - paragraph [ref=e1100]: アニメ事業においては、アニメーション番組を企画・製作し、スポンサー企業を集め、製作委員会の組成を行うプロデュース業務、映像コンテンツの商品化業務及び、他出版社との共同によるパートワーク(分冊百貨)出版のプロデュース業務を行っております。その中でも製作委員会の幹事会社として、アニメーション作品の製作事業を行っており、製作契約に基づく配分金や幹事会社としての手数料、ビデオグラムの販売額等が当社グループの売上となります。
                      - paragraph [ref=e1101]: ファッションD2C事業については、自社サイト「Olu.」やその他ECサイトにて販売を行っております。
                      - paragraph [ref=e1102]
                      - paragraph [ref=e1103]: (注)2025年6月20日にアニメ事業を新設分割により、フリュー・ピクチャーズ株式会社へ承継いたしました。
