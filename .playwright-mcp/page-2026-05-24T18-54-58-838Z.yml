                              - paragraph [ref=e1100]:
                                - text: 半導体製造工程のウェーハ搬送装置の製造ならびに販売をおこなっております。
                                - text: 主な製品は、ウェーハを各種処理装置に取込むロードポート、ウェーハ搬送ロボットおよびそれらを統合したEFEM(Equipment Front End Module)などであります。
                          - row "その他自動省力機器 高性能家電に組み込まれるモーターの組立設備をはじめあらゆる家電製品の生産設備、ストッカー・搬送装置などの物流関連機器およびタイヤ関連生産設備、医療・理化学機器などの製造ならびに販売をおこなっております。" [ref=e1101]:
