                              - paragraph [ref=e1089]: 事業内容
                        - rowgroup [ref=e1090]:
                          - row "自動車関連 自動車・同部品メーカー向けに、電気自動車(EV)関連、エンジン、トランスミッション、その他車載用電子部品などの自動組立ラインを中心とした生産システムの製造ならびに販売をおこなっております。" [ref=e1091]:
                            - cell "自動車関連" [ref=e1092]:
                              - paragraph [ref=e1093]: 自動車関連
                            - cell "自動車・同部品メーカー向けに、電気自動車(EV)関連、エンジン、トランスミッション、その他車載用電子部品などの自動組立ラインを中心とした生産システムの製造ならびに販売をおこなっております。" [ref=e1094]:
                              - paragraph [ref=e1095]: 自動車・同部品メーカー向けに、電気自動車(EV)関連、エンジン、トランスミッション、その他車載用電子部品などの自動組立ラインを中心とした生産システムの製造ならびに販売をおこなっております。
                          - row "半導体関連 半導体製造工程のウェーハ搬送装置の製造ならびに販売をおこなっております。 主な製品は、ウェーハを各種処理装置に取込むロードポート、ウェーハ搬送ロボットおよびそれらを統合したEFEM(Equipment Front End Module)などであります。" [ref=e1096]:
                            - cell "半導体関連" [ref=e1097]:
