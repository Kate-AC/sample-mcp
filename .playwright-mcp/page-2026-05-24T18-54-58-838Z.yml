                              - paragraph [ref=e1105]: 高性能家電に組み込まれるモーターの組立設備をはじめあらゆる家電製品の生産設備、ストッカー・搬送装置などの物流関連機器およびタイヤ関連生産設備、医療・理化学機器などの製造ならびに販売をおこなっております。
                      - paragraph [ref=e1106]
                      - paragraph [ref=e1107]: 日本国内においては、当社が自動省力機器を製造する際、電子部品等の主な仕入は連結子会社タイヘイテクノス株式会社からおこなっており、製造業務の委託を連結子会社タイヘイテクノス株式会社に、客先に納品した製品の保守サービスの委託を連結子会社ヒラタフィールドエンジニアリング株式会社にそれぞれおこなっております。
                      - paragraph [ref=e1108]: その他、海外連結子会社は、アジア、北米、欧州の各地域にて、自動省力機器の製造または販売をおこなっており、当社グループ全体でワールドワイドな販売活動およびサポート体制を構築しております。
                      - paragraph [ref=e1109]: なお、セグメント情報は「第5 経理の状況 1 連結財務諸表等 (1)連結財務諸表 注記事項(セグメント情報等)」にも掲載しております。
                      - paragraph [ref=e1110]: (注)連結子会社12社に、現在清算中のHIRATA Engineering Europe GmbHは含まれております。
