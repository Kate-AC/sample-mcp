                      - heading "3【事業の内容】" [level=3] [ref=e1075]
                      - paragraph [ref=e1076]: 当社グループは、当社および連結子会社12社(注)で構成されており、自動車関連、半導体関連、その他自動省力機器を柱に、自動省力機器の製造ならびに販売を主たる事業としております。
                      - paragraph [ref=e1077]: 当社グループの顧客は各業界におきまして高いシェアを誇る会社が多く、そういった顧客のニーズに応えるために、当社グループは、常に最新のテクノロジーに対応した生産システムエンジニアリング能力と、現場にて培われたモノ造りの経験から、最適なトータルソリューションを提案しております。
                      - paragraph [ref=e1078]: 各セグメントでは以下の事業をおこなっております。
                      - table [ref=e1080]:
                        - rowgroup [ref=e1084]:
                          - row "セグメント 事業内容" [ref=e1085]:
                            - cell "セグメント" [ref=e1086]:
