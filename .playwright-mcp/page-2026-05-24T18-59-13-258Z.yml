                      - heading "3 【事業の内容】" [level=3] [ref=e997]
                      - paragraph [ref=e998]: 当社は、親会社である株式会社豊田自動織機の連結子会社であり、親会社とは特装車の販売および部品の販売・購入などの取引を行っております。
                      - paragraph [ref=e999]: 当社グループ(当社、子会社2社および関連会社1社により構成)が営んでいる主な事業内容は、電力・電気・通信工事用の穴掘建柱車・高所作業車等と建設・荷役用の高所作業車等の製造、販売、部品・修理およびスキッドステアローダー等の製造、販売ならびに高所作業車等の研修を行っております。
                      - paragraph [ref=e1000]: また、一部の高所作業車につきましては、親会社へOEM供給を行っております。
                      - paragraph [ref=e1001]: なお、当社グループの各社は、それぞれが高所作業車等の製造・販売およびアフターサービスなどの付帯業務に関連する事業を営んでおりますが、各報告セグメントは、売上区分ごとに区分しております。従いまして、グループ各社の事業と各報告セグメントを紐付けするのが困難でありますので、連結グループが営む事業に対する各社の位置付けを記載しております。
