                    - generic [ref=e1085]:
                      - heading "3 【事業の内容】" [level=3] [ref=e1086]
                      - paragraph [ref=e1087]: 当社グループは当社、子会社25社で構成され印刷機械の製造販売を主な内容とし、さらに事業に関連する資材・機材の供給及び不動産管理等のサービスを行っております。
                      - paragraph [ref=e1088]: 生産体制は日本を中心に欧州及び中華圏並びに北米で行う体制になっており、販売体制は、海外の重要販売拠点に子会社を展開してグローバルな体制になっております。海外の重要販売拠点となっている海外子会社はそれぞれ独立した経営単位で、各地域での包括的な販売戦略を立案し、事業活動を展開しております。
                      - paragraph [ref=e1089]: 各セグメントの事業内容は以下のとおりです。
                      - paragraph [ref=e1090]
                      - paragraph [ref=e1091]: (1) 報告セグメント「日本」は、一部の製品を除き当社グループの製品の大部分を生産しており、国内、中南米、及び中華圏の一部を除くアジアや海外証券印刷機の販売が含まれます。
                      - paragraph [ref=e1092]: a. 当社は株式会社小森マシナリーより小型印刷機械を仕入、販売しております。
                      - paragraph [ref=e1093]: b. 当社は印刷機械を構成するインク供給、給紙、排紙、折機、電気機器等の各部分機器、及び機械を構成する部分品、並びに事業関連サービスを株式会社小森マシナリー、株式会社小森興産、株式会社小森エンジニアリングの各社から仕入れております。
                      - paragraph [ref=e1094]: c. 株式会社セリアコーポレーション及び株式会社セリアエンジニアリングは印刷機械その他印刷資機材を製造、仕入、販売しております。
                      - paragraph [ref=e1095]
                      - paragraph [ref=e1096]: (2) 報告セグメント「北米」は、主としてアメリカ合衆国での販売が含まれます。
                      - paragraph [ref=e1097]: a. 当社が製造販売する印刷機械の一部を、主としてアメリカ地区において、Komori America Corporationが販売しております。
                      - paragraph [ref=e1098]
                      - paragraph [ref=e1099]: (3) 報告セグメント「欧州」は、主として西欧、東欧、中東地域での販売が含まれます。また、紙器印刷機械の製造販売をしておりますKomori-Chambon S.A.S.グループ及び印刷後加工機製造販売会社のMBO Postpress Solutions GmbHグループが当セグメントに含まれております。
                      - paragraph [ref=e1100]: a. 当社が製造販売する印刷機械の一部を、主としてヨーロッパ地区において、Komori International(Europe) B.V.及び同社を経由して、Komori Italia S.r.l.、Komori U.K. Limited、Komori France S.A.S.が販売しております。
                      - paragraph [ref=e1101]: b. Komori-Chambon S.A.S.グループは紙器印刷機械を製造販売する他、グループ各社を通じて販売することがあります。
                      - paragraph [ref=e1102]: c. MBO Postpress Solutions GmbHグループは、印刷後加工機を製造販売する他、グループ各社を通じて販売することがあります。
                      - paragraph [ref=e1103]
                      - paragraph [ref=e1104]: (4) 報告セグメント「中華圏」は、主として中国の一部、香港、台湾地域での販売が含まれます。また、印刷機械及び印刷機械関連装置の製造販売をしております小森机械(南通)有限公司が当セグメントに含まれております。
                      - paragraph [ref=e1105]: a. 当社が製造販売する印刷機械の一部を、主として中国の一部地域及び香港において小森香港有限公司及び小森(深圳)印刷技術有限公司が販売しております。
                      - paragraph [ref=e1106]: b. 当社が製造販売する印刷機械の一部を、台湾地域において小森台湾股份有限公司が販売しております。
                      - paragraph [ref=e1107]: c. 小森机械(南通)有限公司は印刷機械及び印刷機械関連装置を製造販売しております。
                      - paragraph [ref=e1108]
                      - paragraph [ref=e1109]: (5) 「その他」の区分は、報告セグメントに含まれない事業セグメントであります。
                      - paragraph [ref=e1110]: a. 主としてアセアン地域において、Komori Southeast Asia Pte. Ltd.及びKomori Malaysia Sdn.Bhd.が当社が製造販売する印刷機械の販売及びサービスの支援をしております。
                      - paragraph [ref=e1111]: b. 当社が製造販売する印刷機械の一部を、主としてインドにおいて、Komori India Private Limitedが販売しております。
                      - paragraph [ref=e1112]
