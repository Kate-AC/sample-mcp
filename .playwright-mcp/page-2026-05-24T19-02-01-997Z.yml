                      - heading "3【事業の内容】" [level=3] [ref=e1026]
                      - paragraph [ref=e1027]: 当社グループは当社、子会社12社(連結子会社9社、非連結子会社3社)により構成されており、アミューズメント関連事業、スマートソリューション関連事業、ホテル・レストラン関連事業を営んでおります。
                      - paragraph [ref=e1028]: なお、当社は、有価証券の取引等の規制に関する内閣府令第49条第2項に規定する特定上場会社等に該当しており、これにより、インサイダー取引規制の重要事実の軽微基準については連結ベースの数値に基づいて判断することとなります。当社グループの事業内容及び当社と子会社の当該事業に係る位置付けは次のとおりであります。また、報告セグメントと同一の区分であります。
                      - paragraph [ref=e1029]: なお、当連結会計年度より、報告セグメントの名称を「自動認識システム関連事業」から「スマートソリューション関連事業」に変更しております。詳細は、「第5 経理の状況 1 連結財務諸表等 (1)連結財務諸表 注記事項(セグメント情報等)」に記載のとおりであります。
                      - paragraph [ref=e1030]: (1)アミューズメント関連事業
                      - paragraph [ref=e1031]: (株)マースエンジニアリングは、主にアミューズメント施設向け製品の開発・製造・販売を、(株)マースシステムズ東日本、(株)マースシステムズ東海、(株)マースシステムズ西日本は、製品の販売及びアフターサービスを行っております。(株)マースコーポレーションは、リース事業及び不動産賃貸事業、グループ会社の不動産管理事業を行っております。(株)マースネットワークスは、アミューズメント施設のデータ管理を行っております。(株)マースウインテックは、新製品の開発を行っております。
                      - paragraph [ref=e1032]: (2)スマートソリューション関連事業
                      - paragraph [ref=e1033]: (株)マーストーケンソリューションは、RFIDやバーコード等を活用した自動認識システムの提案販売を行っております。(株)マースウインテックは、IoT対応の冷蔵物販自販機や無人チェックイン端末等の製品の製造、販売を行っております。
                      - paragraph [ref=e1034]: (3)ホテル・レストラン関連事業
                      - paragraph [ref=e1035]: (株)マースプランニングは、マースガーデンホテル博多、マースガーデンウッド御殿場、銀明翠銀座等を運営しております。
                      - paragraph [ref=e1036]
