                      - heading "3 【事業の内容】" [level=3] [ref=e986]
                      - paragraph [ref=e987]: 当社グループは、当社と子会社11社(孫会社3社を含む)で構成されており、パチンコホール向けコンピュータシステムの開発・製造・販売及びパチンコ遊技機の一部ユニットの開発・製造・販売、パチスロ遊技機の企画・開発・製造・販売を主な事業として取り組んでおります。
                      - paragraph [ref=e988]: 当社グループの事業における位置付け及びセグメントとの関連は、次のとおりであります。
                      - paragraph [ref=e989]
                      - paragraph [ref=e990]: 情報システム事業
                      - paragraph [ref=e991]: 当部門においては、パチンコホール向けコンピュータシステム、景品顧客管理システム、情報公開システムの開発・製造・販売をしております。
                      - paragraph [ref=e992]: (主な関係会社)
                      - paragraph [ref=e993]: 当社、ダイコク電機コミュニケーションPLUS株式会社及び株式会社グローバルワイズ
                      - paragraph [ref=e994]: (注)ダイコク産業株式会社は、2024年4月1日に「ダイコク電機コミュニケーションPLUS株式会社」と商号を変更しております。
                      - paragraph [ref=e995]
                      - paragraph [ref=e996]: アミューズメント事業
                      - paragraph [ref=e997]: 当部門においては、パチンコ・パチスロ遊技機に関わるソフトウェアの開発及びハードウェアの開発・製造・販売をしております。
                      - paragraph [ref=e998]: (主な関係会社)
                      - paragraph [ref=e999]: 当社、元気株式会社、DAXEL株式会社、アロフト株式会社及び株式会社ライリィ
                      - paragraph [ref=e1000]
