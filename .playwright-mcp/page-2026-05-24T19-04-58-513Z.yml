                      - heading "3【事業の内容】" [level=3] [ref=e1033]
                      - paragraph [ref=e1034]: 当社グループは、当連結会計年度末時点において、当社、連結子会社1社により構成されており、給水装置事業、住宅・建築設備事業及び商品販売事業を主たる業務としております。なお、連結子会社であった前澤給装(南昌)有限公司は、2025年1月1日付で全持分を譲渡し連結の範囲から除外しております。
                      - paragraph [ref=e1035]: 当社グループの事業内容及び当社と関係会社の当該事業に係る位置付けは次のとおりであります。
                      - paragraph [ref=e1036]: なお、次の3部門は「第5 経理の状況 1 連結財務諸表等 (1)連結財務諸表 注記事項」に掲げるセグメントの区分と同一であります。
                      - paragraph [ref=e1037]
                      - paragraph [ref=e1038]: (1) 給水装置事業
                      - paragraph [ref=e1039]: 当事業は、道路に布設されている配水管(水道本管)から、家屋等の敷地内に上水道を引き込むための水道用給水装置(サドル付分水栓・止水栓・各種継手類など)を製造、販売しております。
                      - paragraph [ref=e1040]: (2) 住宅・建築設備事業
                      - paragraph [ref=e1041]: 当事業は、上水道を屋内で使用するための給水・給湯配管部材、床暖房部材およびこれらをユニット化した配管システムなどを製造、販売、住環境部材を開発、設計、製造、販売しております。
                      - paragraph [ref=e1042]: (3) 商品販売事業
                      - paragraph [ref=e1043]: 当事業は、主に給水装置事業、住宅・建築設備事業に関連する仕入商品を販売しております。
                      - paragraph [ref=e1044]
                      - paragraph [ref=e1045]: "[事業系統図]"
