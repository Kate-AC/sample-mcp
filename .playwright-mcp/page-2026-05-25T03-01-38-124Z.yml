                      - heading "3【事業の内容】" [level=3] [ref=e1074]
                      - paragraph [ref=e1075]: 当社グループ(当社、子会社11社及び関連会社1社)は、産業用電気機械器具等(エンジン発電機、エンジン溶接機、エンジンコンプレッサ等)の製造並びに販売と、これらに付随する補修部品の販売及びアフターサービス等の事業活動を展開しております。
                      - paragraph [ref=e1076]: 当社グループの事業内容及び当社と主要な関係会社の当該事業に係わる位置付け及びセグメントとの関連は、次のとおりであります。
                      - paragraph [ref=e1077]: (日本) 当社はエンジン発電機、エンジン溶接機、エンジンコンプレッサ等を製造・販売するほか、子会社ニシハツ(株)は防災用及び非常用発電機の製造・販売に従事しております。
                      - paragraph [ref=e1078]: 子会社デンヨー興産(株)は補修用部品の販売・保守点検等のアフターサービスに従事しております。関連会社新日本建販(株)はエンジン発電機、エンジン溶接機、エンジンコンプレッサ等の販売及びリース・レンタルに従事しております。
                      - paragraph [ref=e1079]: (アメリカ) 子会社デンヨー マニュファクチュアリング コーポレーションは、アメリカ国内においてエンジン発電機の製造・販売に従事しております。子会社デンヨー アメリカ コーポレーションは、当社及び子会社デンヨー マニュファクチュアリング コーポレーションに部品の供給を行っております。
                      - paragraph [ref=e1080]: (アジア) 子会社デンヨー ベトナム CO.,LTD.は、当社からの委託により、ベトナム国内において当社及び子会社デンヨー マニュファクチュアリング コーポレーション向け製造用部品の加工並びに当社向けエンジン発電機の製造に従事しております。子会社デンヨー ユナイテッド マシナリー PTE.LTD.他2社はアジアにおいて、エンジン発電機、エンジン溶接機の販売及びリース・レンタルに従事しております。子会社P.T.デイン プリマ ジェネレーターはインドネシア国内において当社製造用部品の加工及びエンジン発電機の製造・販売に従事しております。
                      - paragraph [ref=e1081]: (欧州) 子会社デンヨー ヨーロッパB.V.は、ヨーロッパにおいてエンジン発電機、エンジン溶接機の販売に従事しております。
