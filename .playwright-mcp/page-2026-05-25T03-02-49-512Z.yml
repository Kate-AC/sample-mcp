                    - generic [ref=e1014]:
                      - heading "3【事業の内容】" [level=3] [ref=e1015]
                      - paragraph [ref=e1016]: 当社グループは、当社及び連結子会社25社(MIMAKI USA, INC.、MIMAKI EUROPE B.V.、台湾御牧股份有限公司、(株)ミマキプレシジョン、(株)グラフィッククリエーション、御牧噴墨打印科技(浙江)有限公司、Mimaki Deutschland GmbH、上海御牧貿易有限公司、MIMAKI BRASIL COMERCIO E IMPORTACAO LTDA、平湖御牧貿易有限公司、PT. MIMAKI INDONESIA、MIMAKI AUSTRALIA PTY LTD、MIMAKI SINGAPORE PTE. LTD.、MIMAKI INDIA PRIVATE LIMITED、MIMAKI EURASIA DIJITAL BASKI TEKNOLOJILERI PAZARLAMA VE TICARET LIMITED SIRKETI、Mimaki La Meccanica S.R.L.、Mimaki Lithuania, UAB、Mimaki Bompan Textile S.r.l、アルファーデザイン(株)、(株)アルファーシステムズ、(株)砺波製作所、(株)楽日、MIMAKI (THAILAND) CO., LTD.、(株)マイクロテック、MIMAKI VIETNAM CO., LTD.)、その他3社(MIMAKI KANPHOR INDIA PRIVATE LIMITEDほか)の計29社により構成され、産業用インクジェットプリンタ、カッティングプロッタ等の開発・製造・販売を主たる業務とした事業を営んでおり、報告セグメントは地域別としております。
                      - paragraph [ref=e1017]: また、エンドユーザーの属する市場別に分類した事業の内容は次のとおりであります。
                      - paragraph [ref=e1018]: (1)SG(サイングラフィックス)市場向け
                      - paragraph [ref=e1019]: 広告・看板等のサイングラフィックス市場向けの製品群です。エコソルベントインクを搭載したインクジェットプリンタJVシリーズや、プリント&カット対応のCJVシリーズ、UV硬化インク搭載のUJV/UCJVシリーズが主要製品で、大型ポスター、カーラッピング、のぼり旗、表示板等の製作に用いられています。また、光学センサーで位置決めマークを読み取ることで高精度な輪郭カットを実現するカッティングプロッタのCGシリーズ等の製造販売も行っています。
                      - paragraph [ref=e1020]: (2)IP(インダストリアルプロダクツ)市場向け
                      - paragraph [ref=e1021]: ノベルティや工業製品等のインダストリアルプロダクツ市場向けの製品群です。UV硬化インクを採用した大判フラットベッドインクジェットプリンタのJFXシリーズに加え、A3〜A2サイズを中心としたデスクトップ型フラットベッドUVインクジェットプリンタのUJFシリーズが主要製品で、一般消費者向けの商品やギフト、オーダーグッズのほか、自動車の計器パネルや家電類の操作パネルなどの工業製品生産現場等で用いられています。また、SG市場向けと同様に光学センサーによる読み取り機能を搭載し、ダンボールなど厚みのある材料をカットできるフラットベッドカッティングプロッタであるCFシリーズ等の製造販売も行っています。さらに、フィギュア、模型、立体看板、試作品等の製作に用いられる立体造形物をプリントする3Dプリンタの製造販売も行っています。
                      - paragraph [ref=e1022]: (3)TA(テキスタイル・アパレル)市場向け
                      - paragraph [ref=e1023]: 衣服や生地等のテキスタイル・アパレル市場向けの製品群です。昇華転写インクジェットプリンタのTSシリーズや、ダイレクト捺染インクジェットプリンタのTxシリーズ、顔料転写方式の捺染プリントシステムTRAPIS(トラピス)、DTF(Direct To Film)プリンタのTxFシリーズ等が消費地向けの主要製品で、ファッションウエアやスポーツウエア、ネクタイやスカーフなどの生地へのプリント等に用いられています。
                      - paragraph [ref=e1024]: (4)FA事業
                      - paragraph [ref=e1025]: ファクトリーオートメーション装置事業(カスタム機器)や基板実装装置事業(異形部品挿入装置、防湿剤の塗布装置)、半導体製造装置事業、基板検査装置事業、金属加工事業等、アルファーデザイングループが手掛ける事業の総称です。
                      - paragraph [ref=e1026]: (5)その他
                      - paragraph [ref=e1027]: 上記のいずれにも属さない機種の製造・販売やサービス等が該当いたします。
