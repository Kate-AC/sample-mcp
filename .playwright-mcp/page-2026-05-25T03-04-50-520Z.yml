                      - paragraph [ref=e981]: 当社グループは、連結財務諸表提出会社(以下「当社」という。)及び子会社14社から構成されております。
                      - paragraph [ref=e982]: その主な事業内容は、電気通信並びに高周波関連事業の二つが基幹となり、この他設備貸付事業及び売電事業を行っており、当社とグループ各社は相互に密接な連携のもとに事業展開を行っております。
                      - paragraph [ref=e983]: 当社グループが営んでいる主な事業内容、各関係会社の当該事業に係わる位置付け及びセグメントとの関連は、次のとおりであります。
