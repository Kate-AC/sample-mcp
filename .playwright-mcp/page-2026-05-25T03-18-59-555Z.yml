                    - generic [ref=e835]:
                      - heading "3【事業の内容】" [level=3] [ref=e836]
                      - paragraph [ref=e837]: 当社グループは、当社および子会社2社(連結子会社1社、非連結子会社1社)により構成されており、心臓血管領域を中心に医療機器の製造、輸入および販売を行っています。セグメント情報については、当社グループは単一の事業を営んでおり、品目別の分類による各社の位置付けは次のとおりです。
                      - paragraph [ref=e838]
                      - paragraph [ref=e839]
                      - paragraph [ref=e840]: (リズムディバイス)
                      - paragraph [ref=e841]: 心臓の不整脈の治療に用いる心臓ペースメーカ、ICD(植込み型除細動器)およびCRT-D(除細動機能付き両心室ペースメーカ)が主たる商品です。当社がこれらの商品の仕入および販売を行っています。
                      - paragraph [ref=e842]
                      - paragraph [ref=e843]: (EP/アブレーション)
                      - paragraph [ref=e844]: 心臓の不整脈の検査に用いるEP(電気生理用)カテーテルおよび不整脈の治療に用いるアブレーションカテーテルが主たる製品です。当社がこれらの製品の製造、仕入および販売を行うほか、JLL Malaysia Sdn. Bhd.も一部製品の製造を行い、当社への販売を行っています。
                      - paragraph [ref=e845]
                      - paragraph [ref=e846]: (心血管関連)
                      - paragraph [ref=e847]: 大動脈疾患の治療に用いる人工血管、Frozen Elephant Trunkおよびステントグラフトが主たる製品です。当社がこれらの製品の製造、仕入および販売を行っています。
                      - paragraph [ref=e848]
                      - paragraph [ref=e849]: (脳血管関連)
                      - paragraph [ref=e850]: 脳血管内治療に用いる塞栓用コイル、血栓吸引カテーテルおよびステントリトリーバーが主たる商品です。当社がこれらの商品の仕入および販売を行っています。
                      - paragraph [ref=e851]
                      - paragraph [ref=e852]: (消化器)
                      - paragraph [ref=e853]: 消化器疾患の治療に用いる大腸用ステント、胃・十二指腸用ステント、肝癌治療用ラジオ波焼灼電極針ならびに胆管チューブステントが主たる製品です。当社がこれらの製品の製造、仕入および販売を行うほか、JLL Malaysia Sdn. Bhd.も一部製品の製造を行い、当社への販売を行っています。
                      - paragraph [ref=e854]
                      - paragraph [ref=e855]: 事業の系統図は次のとおりです。
                      - paragraph [ref=e856]
                      - paragraph [ref=e857]: （画像は省略されました）
                      - paragraph
                      - paragraph [ref=e858]: (注)1 海外メーカーの場合は国内輸入元、国内メーカーの場合は国内総販売元を経由して商品を仕入れる場合があります。
                      - paragraph [ref=e859]: 2 JLL Malaysia Sdn. Bhd.は連結子会社です。
