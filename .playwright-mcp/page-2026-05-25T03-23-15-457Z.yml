                      - heading "3【事業の内容】" [level=3] [ref=e1091]
                      - paragraph [ref=e1092]: 当社グループは、当連結会計年度末において当社および関係会社16社(連結子会社13社、持分法非適用非連結子会社2社、持分法非適用関連会社1社)により構成されており、情報コミュニケーション、ソリューションセールス、半導体関連マスク、不動産賃貸の4つのセグメントにて事業を行っております。主な会社の、それぞれの事業との関わりは次のとおりです。
                      - paragraph [ref=e1093]: なお、当連結会計年度より、事業内容を明確に表現するため、セグメント名称を「印刷」から「情報コミュニケーション」、「物販」から「ソリューションセールス」へ変更しております。当該変更は名称変更のみであり、セグメント情報に与える影響はありません。なお、半導体関連マスク、不動産賃貸に変更はありません。
                      - paragraph [ref=e1094]: また、当社は、有価証券の取引等の規制に関する内閣府令第49条第2項に規定する特定上場会社等に該当しており、これにより、インサイダー取引規制の重要事実の軽微基準については連結ベースの数値に基づいて判断することとなります。
                      - paragraph [ref=e1095]
                      - paragraph [ref=e1096]: 1情報コミュニケーションセグメント
                      - paragraph [ref=e1097]: 竹田印刷株式会社が商業印刷(カタログ、チラシ他)を中心とする各種印刷・ロジスティクス(BPOサポート)・システム関連・プロモーション支援を、日栄印刷紙工株式会社が紙器類の製造及びラベル・シール類の印刷を、株式会社光風企画が広告宣伝や販促プロモーション等の企画・制作を担当しており、東海プリントメディア株式会社は、日刊新聞の印刷を行っております。また、上海竹田包装印務技術有限公司が、中国における包装材・紙器類の企画・販売を、大連光華軟件技術有限公司が、印刷用データの制作を、それぞれ担当しております。TAKEDA PRINTING (Thailand) CO., LTD.は、包装用資材及び印刷物の企画・製造・販売を行っております。株式会社千代田プリントメディアは、商業印刷物、出版印刷物等の企画・制作を行っております。
                      - paragraph [ref=e1098]: 2024年5月に設立いたしましたTAKEDA PACKAGING (Thailand) CO., LTD.は、本年9月の操業開始を予定にてパッケージ及び紙管の製造を担当いたします。
                      - paragraph [ref=e1099]
                      - paragraph [ref=e1100]: 2ソリューションセールスセグメント
                      - paragraph [ref=e1101]: 株式会社光文堂が、印刷機械、その周辺機器及び印刷資材の仕入・販売を、株式会社ウィルジャパンが、事務用品類等の企画・販売をそれぞれ担当しております。
                      - paragraph [ref=e1102]
                      - paragraph [ref=e1103]: 3半導体関連マスクセグメント
                      - paragraph [ref=e1104]: 竹田東京プロセスサービス株式会社が各種電子部品用のスクリーンマスク、フォトマスクの製造・販売等を、株式会社プロセス・ラボ・ミクロンが半導体パッケージ用バンプマスクや電子部品実装用メタルマスクの製造・販売等を、それぞれ行っております。PROCESS LAB.MICRON VIETNAM CO., LTD.は、ベトナムの顧客向けに電子部品実装用等のメタルマスクの製造・販売を行っております。TOKYO PROCESS SERVICE(Thailand)CO., LTD.は、タイにおける精密工業写真製版、スクリーン製版及び製版用資機材の製造・販売を行っております。富来宝米可龍(蘇州)精密科技有限公司は、中国の顧客向けに電子部品実装用等のメタルマスクの製造・販売を行っております。
                      - paragraph [ref=e1105]
                      - paragraph [ref=e1106]: 4不動産賃貸セグメント
                      - paragraph [ref=e1107]: 当社、および株式会社光風企画にて、連結子会社や外部顧客に対する不動産賃貸事業を行っております。
                      - paragraph [ref=e1108]
                      - paragraph [ref=e1109]: 当社グループにおける事業の系統図は次頁のとおりです。
