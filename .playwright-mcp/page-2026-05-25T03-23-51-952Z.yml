                      - paragraph [ref=e854]: 当社グループ(当社及び当社の関係会社)の事業は、当社と子会社7社で構成されています。当社グループの事業セグメントは、「第5 経理の状況 1 連結財務諸表等(1)連結財務諸表 連結財務諸表注記6.セグメント情報」に記載のとおり、ディスクロージャー関連事業の単一セグメントでありますが、取扱製品を下記の4つに区分しております。
                      - paragraph [ref=e855]
                      - paragraph [ref=e856]: ・上場会社ディスクロージャー関連(上場会社向け法定開示支援サービス等)
                      - paragraph [ref=e857]: ・上場会社IR・イベント関連等(上場会社向けIR支援サービス、イベント映像機材・運営支援等)
                      - paragraph [ref=e858]: ・金融商品ディスクロージャー関連(投資信託・不動産投資信託・外国会社向け開示支援サービス等)
                      - paragraph [ref=e859]: ・データベース関連(企業情報・財務情報検索用データベース、経済統計データベース等)
                      - paragraph [ref=e860]: ※詳細は後記の表をご参照ください。
                      - paragraph [ref=e861]
                      - paragraph [ref=e862]: 当社グループの事業の特徴は、これら製品の受託に伴い、法的チェック、セミナー、ガイドブックなどのコンサルティングサービスと、ITを活用したインフラ・システムサービスをお客様に提供し、適正・迅速かつ効率的な開示を支援する点にあります。
                      - paragraph [ref=e863]: 当社の子会社は、国内では当社事業に関連するデータ加工、情報セキュリティ管理及びシステム開発業務を行っている株式会社アスプコミュニケーションズ、開示書類等の英文翻訳サービスを行う日本財務翻訳株式会社、データベース事業を行う株式会社アイ・エヌ情報センター、開示BPO事業を行う株式会社ディスクロージャー・プロ、イベント映像機材・運営支援を行う株式会社シネ・フォーカスがあります。また、海外では台湾において日系企業向けBPO事業を行う台湾普羅納克廈斯股份有限公司、ベトナムにおいて日系企業向けBPO事業を行うPRONEXUS VIETNAM CO., LTDの国内外合わせて計7社であります。
