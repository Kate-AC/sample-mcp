                    - generic [ref=e1143]:
                      - heading "3【事業の内容】" [level=3] [ref=e1144]
                      - paragraph [ref=e1145]: 当社グループ(当社及び関係会社)は、ZACROS株式会社(当社)及び連結子会社13社から成り、主な事業は「ウェルネス」「環境ソリューション」「情報電子」及び「産業インフラ」の製造・販売となっております。
                      - paragraph [ref=e1146]: ウェルネス事業は、製品とサービスを通じて身体と心の健康の実現を推進する事業です。売上高の18.0%、営業利益の5.2%を占めており、当該事業における主要製品は、医薬・医療用包装材、医薬向け剥離フィルム、バイオ医薬品等製造用シングルユースバッグ(BioPhaS®(バイファス))、ならびに医療機器、体外診断薬関連および検査薬関連製品となっております。
                      - paragraph [ref=e1147]: 環境ソリューション事業は、環境問題に向き合い、循環型社会に必要な価値を提供する事業です。売上高の21.7%、営業利益の12.8%を占めており、当該事業における主要製品は、つめかえ包装、粧業包装、その他軟包装、OA機器関連包装、プラスチック製液体容器(バッグインボックス等)となっております。
                      - paragraph [ref=e1148]: 情報電子事業は、超スマート社会に必要な高機能部材を提供する事業です。売上高の35.8%、営業利益の41.6%を占めており、当該事業における主要製品は、プロテクトフィルム(偏光板用プロテクト等)、剥離フィルム(ディスプレイ関連)、情報記録用材(層間絶縁フィルム等)、剥離フィルム(電子部材関連他)、その他情報関連機器用材となっております。
                      - paragraph [ref=e1149]: 産業インフラ事業は、生活を支える産業インフラ強化への貢献と企画提案商品による価値提供を推進する事業です。売上高の24.5%、営業利益の40.4%を占めており、当該事業における主要製品は、ビル用煙突、ボイドスラブ、空調用配管、トンネル用資材、プラスチック原料・商品及び関連機械となっております。
                      - paragraph [ref=e1150]: 事業内容と当社グループの当該事業にかかる位置付けは次のとおりであります。製品の製造及び販売は当社及びグループ会社が行っております。なお、事業区分は、報告セグメントと同一であります。
