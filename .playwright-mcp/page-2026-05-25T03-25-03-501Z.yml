              - generic [ref=e1214]:
                - tabpanel [ref=e1215]:
                  - generic [ref=e1216]:
                    - generic [ref=e1217] [cursor=pointer]: 続きを読む
                    - generic [ref=e1218]:
                      - paragraph [ref=e1219]
                      - heading "3 【事業の内容】" [level=3] [ref=e1220]
                      - paragraph [ref=e1221]
                      - paragraph [ref=e1222]: 当社グループは、提出会社、子会社11社及び関連会社1社で構成され、可食性コラーゲン・ケーシング、ゼラチン及びコラーゲンペプチド、コラーゲン化粧品及び健康食品、皮革関連製品等の製造販売及び仕入販売を主な内容とし、更に輸入食品及び穀物の販売、iPS細胞培養基材、医療用コラーゲンの製造販売、不動産賃貸その他の事業活動を展開しております。当社グループの事業に係わる位置付け及びセグメントとの関連は、次のとおりであり、セグメントと同一の区分であります。
                      - paragraph [ref=e1223]
                      - paragraph [ref=e1224]: (1) コラーゲン・ケーシング事業
                      - paragraph [ref=e1225]: 提出会社が、連結子会社大鳳商事(株)経由で在外連結子会社日皮胶原蛋白(唐山)有限公司より加工済原材料を購入して製造しております。
                      - paragraph [ref=e1226]: 製造したコラーゲン・ケーシング製品は、提出会社が国内外ユーザーへ販売しておりますが、輸出の一部は在外連結子会社 NIPPICOLLAGEN NA INC. 経由で販売しております。
                      - paragraph [ref=e1227]: (2) ゼラチン関連事業
                      - paragraph [ref=e1228]: 提出会社が、海外から原材料、半製品を調達して加工及び製造し、製品の一部は外部へ加工委託したものを購入しております。また、原材料の一部については、連結子会社大鳳商事(株)、在外連結子会社日皮(上海)貿易有限公司及び在外非連結子会社NIPPI (THAILAND) CO.,LTD. 経由で購入しております。
                      - paragraph [ref=e1229]: ゼラチン及びコラーゲンペプチド製品は、主に提出会社が国内外ユーザーに販売しておりますが、一部は連結子会社大鳳商事(株)、在外連結子会社NIPPI COLLAGEN NA INC. 及び在外連結子会社日皮(上海)貿易有限公司経由で販売しております。
                      - paragraph [ref=e1230]: (3) 化粧品関連事業
                      - paragraph [ref=e1231]: 提出会社が、化粧品用コラーゲン原料、健康食品用コラーゲンを製造し、さらにスキンケアジェルは提出会社で製造し、また、ニッピコラーゲン100及びコラーゲン配合化粧品はOEMに委託しております。
                      - paragraph [ref=e1232]: 完成した製品は、通信販売会社である連結子会社(株)ニッピコラーゲン化粧品を経由してユーザーに販売しております。
                      - paragraph [ref=e1233]: (4) 皮革関連事業
                      - paragraph [ref=e1234]: 連結子会社(株)ニッピ・フジタが、国内外より靴用革、自動車用革を購入し、また、一部は連結子会社大鳳商事(株)、在外連結子会社日皮(上海)貿易有限公司、在外非連結子会社NIPPI (THAILAND) CO.,LTD. を経由して購入し、販売しております。また、持分法適用非連結子会社(株)ボーグに靴用革の一部を支給して完成靴をユーザーに販売しております。
                      - paragraph [ref=e1235]: 在外連結子会社日皮(上海)貿易有限公司は、海外サプライヤーより自動車用革の原材料を購入し、中国で加工委託して国内外ユーザーに販売しております。
                      - paragraph [ref=e1236]: 連結子会社大鳳商事(株)は、海外サプライヤーより原皮、靴製品を購入して国内ユーザーに販売し、在外非連結子会社NIPPI (THAILAND) CO.,LTD. は、東南アジア諸国における自動車ハンドル用革の販売を行っております。
                      - paragraph [ref=e1237]: (5) 賃貸・不動産事業
                      - paragraph [ref=e1238]: 提出会社が、東京都足立区、大阪市浪速区を中心に不動産賃貸事業を行っており、非連結子会社ニッピ都市開発(株)が、管理業務及びコンサルタント業務を行っております。
                      - paragraph [ref=e1239]: (6) 食品その他事業
                      - paragraph [ref=e1240]: 連結子会社大鳳商事(株)、連結子会社大倉フーズ(株)が輸入食材、有機穀物、肥料などを輸入し、国内ユーザーに販売しております。
                      - paragraph [ref=e1241]: 提出会社が、iPS細胞培養の培地キットiMatrixシリーズを製造し、持分法適用関連会社(株)マトリクソームを経由して販売し、BSE検査キットなどを外部に加工委託して販売しております。また、リンカー製品(マスキングシート、コンパウンド)を製造販売し、化成品(ビニールフォーム)を外部より購入して販売しております。
