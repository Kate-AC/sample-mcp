                      - heading "3【事業の内容】" [level=3] [ref=e850]
                      - paragraph [ref=e851]: 当社グループ(当社及び当社の関係会社をいう。)は、当社及び子会社8社並びに関連会社1社で構成され、住宅及び店舗・事業所用設備機器関連事業を主な内容とし、さらに当該事業に関する物流、サービス等の事業活動を行っております。
                      - paragraph [ref=e852]: 当社グループの事業に係る位置付けは次のとおりであります。なお、次の3部門について当社は、セグメント情報を記載していないため、事業部門別によって記載しております。
                      - paragraph [ref=e853]: (住宅及び店舗・事業所用設備機器関連)
                      - paragraph [ref=e854]: 厨房部門及び浴槽・洗面部門
                      - paragraph [ref=e855]: 当社は、厨房機器、浴槽・洗面機器の製造、販売を行っております。
                      - paragraph [ref=e856]: 井上興産(株)は、当社及び子会社にステンレス素材及びステンレス鋼材等の供給を行っております。
                      - paragraph [ref=e857]: クリナップテクノサービス(株)は、当社が製造、販売する製品・商品の販売、施工及びアフターサービス等を行っております。
                      - paragraph [ref=e858]: 可麗娜厨衛(上海)有限公司は、中国等で生産された原材料・商品等を販売しております。
                      - paragraph [ref=e859]: (その他)
                      - paragraph [ref=e860]: その他部門
                      - paragraph [ref=e861]: (株)クリナップステンレス加工センターは、ステンレス素材の切断、着色加工及び販売を行っております。
                      - paragraph [ref=e862]: クリナップロジスティクス(株)は、当社グループの製品等の輸送及び荷役、物流サービスの向上と異業種共同配送等利用運送事業を行っております。
                      - paragraph [ref=e863]: クリナップキャリアサービス(株)は、主に当社グループに対する人材派遣事業を行っているほか、有料老人ホーム事業、介護事業を行っております。
                      - paragraph [ref=e864]: クリナップハートフル(株)は、主に当社グループからの事務受託事業を行っております。
                      - paragraph [ref=e865]: クリナップソリューション(株)は、主に当社グループに対するコンピュータソフトウェアの開発、販売、保守業務を行っております。
