                      - heading "3【事業の内容】" [level=3] [ref=e1017]
                      - paragraph [ref=e1018]: 当社グループは、当社、子会社18社及び関連会社1社の計20社により構成されており、主に内装材を中心としたインテリア製品の製造を行う「プロダクト事業」と、主にインテリア関連商材の仕入販売及び内装工事等を行う「インテリア卸及び工事事業」の2事業を行っております。
                      - paragraph [ref=e1019]: 当社及び関係会社の位置付け並びにセグメントとの関連は、次のとおりであります。なお、事業の種類はセグメントと同一の区分であります。
                      - paragraph [ref=e1020]: 《プロダクト事業》
                      - paragraph [ref=e1021]: 当社及び関係会社10社の計11社により、インテリア製品の製造とその他関連事業を行っております。
                      - paragraph [ref=e1022]: 当社統括の下、当社、広化東リフロア(株)及び江蘇長隆装飾材料科技有限公司においてビニル床タイルやビニル床シート等のビニル系床材製品を、滋賀東リ(株)及び岐阜東リ(株)においてカーペット等を、山天東リ(株)において壁装材をそれぞれ製造しております。また、その他関連する事業として、(株)東リインテリア企画等においてカーテンの企画及び縫製を行っております。東リ物流(株)は、当社グループの製商品の在庫管理と配送業務を行っております。
                      - paragraph [ref=e1023]: 《インテリア卸及び工事事業》
                      - paragraph [ref=e1024]: 関係会社9社により、インテリア関連商材の仕入販売及び内装工事等を行っております。
                      - paragraph [ref=e1025]: リック(株)、(株)キロニー、北海道東リ(株)は、主にインテリア関連商材の仕入販売を行い、(株)テクノカメイ及び東リインテリアサービス(株)は主に内装工事を行っております。また、東璃(上海)貿易有限公司は中国、TOLI North America Corporationは北米において、当社ブランド製品の仕入販売を行っております。
                      - paragraph [ref=e1026]: 尚、当社グループの事業ポートフォリオ戦略をより明確なものとすべく、翌連結会計年度から「インテリア事業」・「グローバル事業」・「建材その他事業」の3つの報告セグメントに変更することといたしました。詳細につきましては、2025年4月14日開示資料「新中期経営計画の策定に関するお知らせ」、並びに2025年5月8日開示の「中期経営計画『SHINKA Plus ONE 2.0』説明資料」(https://www.toli.co.jp/ir/plan/)をご参照ください。
                      - paragraph [ref=e1027]: 以上に述べた、グループ各社の主な役割と取引関係は、下図のとおりであります。
