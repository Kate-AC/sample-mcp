                      - heading "3【事業の内容】" [level=3] [ref=e1061]
                      - paragraph [ref=e1062]: 当社の企業グループは、当社(マミヤ・オーピー株式会社)及び当社の関係会社15社(連結子会社8社、非連結子会社4社、関連会社3社)により構成され、株式会社データ・アートをその他の関係会社として、電子機器及びスポーツ用品の製造販売並びに不動産事業を主な事業としております。
                      - paragraph [ref=e1063]: 当社グループに係る各セグメント区分別の各社の位置づけは次のとおりであり、これは「第5[経理の状況]1.連結財務諸表等 (1)連結財務諸表 注記事項」に掲げる、セグメント情報の区分と同一です。
                      - paragraph [ref=e1064]: (1) 電子機器事業(遊技機関連機器、小型自動券売機、紙幣搬送システム、紙幣識別機、自律走行システム等の開発、製造及び販売、遊技システムの設置・保守、ソフトウェアの開発・保守等)
                      - paragraph [ref=e1065]: 当社が製品の開発及び製造を行い、当社及び子会社であるエフ・エス(株)が製品を販売しております。また、エフ・エス(株)は、遊技場向けシステム等のサポート・保守等の業務を行っております。マミヤITソリューションズ(株)は、システム開発関連全般の業務を行っております。
                      - paragraph [ref=e1066]: (2) スポーツ事業(ゴルフ関連用品、遮断桿、矢及び弓(洋弓用)、棒高跳びポールの製造及び販売)
                      - paragraph [ref=e1067]: 子会社であるUST Mamiya Japan(株)及びUST-Mamiya, Inc.が、製品を開発・製造及び販売し、Mamiya-OP(Bangladesh)Ltd.が製品の製造を行っております。
                      - paragraph [ref=e1068]: (3) 不動産事業
                      - paragraph [ref=e1069]: 主に(株)ネクオス及び(株)エフ・アイ興産が、不動産の売買、賃貸借、仲介、管理等を行っております。
