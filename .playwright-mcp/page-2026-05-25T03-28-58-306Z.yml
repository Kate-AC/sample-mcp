                      - heading "3【事業の内容】" [level=3] [ref=e852]
                      - paragraph [ref=e853]: 当社グループ(当社及び当社の関係会社)は、当社及び子会社9社で構成されております。
                      - paragraph [ref=e854]: 当社は、情報通信機器(主に富士通株式会社製品)の販売、情報システムの企画、設計、開発、及び保守、並びにネットワーク工事の施工を行っております。
                      - paragraph [ref=e855]: 子会社9社は、当社が受注した業務の一部委託を行っております。株式会社DSRは、保険共済ビジネスに係る受託及びソフトウェア開発、大興テクノサービス株式会社は、ハードウェアの保守及び建物附帯設備の保守管理、大興ビジネス株式会社は、労働者派遣事業、有料職業紹介事業、ハードウェア及びソフトウェアの運用管理、株式会社AppGuard Marketingは、主にセキュリティソフトウェア「AppGuard®」に関する市場開拓、販売及び導入後サポート、株式会社アイデスは、システム開発及びアウトソーシング受託事業、ディ・ネットワークス株式会社は、ネットワーク工事の施工及び保守管理、名古屋総合システム株式会社はSE派遣業務及び受託ソフトウェア開発他、株式会社CAMI&Co.はIoT新規事業支援及びコンサルティング、株式会社ベルテックスは会計システムのアプリケーション開発及び導入コンサルティング支援他を行っております。
                      - paragraph [ref=e856]: 当社グループの事業に関わる位置付け及び事業部門との関連は、次のとおりであります。
                      - paragraph [ref=e857]: (情報通信機器部門)
                      - paragraph [ref=e858]: 当部門においては、情報端末、サーバー機器、電子交換機、ネットワーク機器及びこれらに関わる周辺機器及びソフトウェアの販売を行っております。
                      - paragraph [ref=e859]: (ソリューションサービス部門)
                      - paragraph [ref=e860]: 当部門においては、システム・ソフトウェア開発、ネットワーク機器・設備の工事及び保守、並びに建物附帯設備の保守管理等のサービスを提供しております。
