                      - paragraph [ref=e1238]
                      - heading "3 【事業の内容】" [level=3] [ref=e1239]
                      - paragraph [ref=e1240]: 当社の企業集団は、当社、子会社23社及び関連会社2社で構成され、各種機械・器具・部品の販売及び各種機械・器具の賃貸等を主な内容とし、国内販売並びに輸出入を行っております。また、一部商品につきましては、子会社及び関連会社が製造を行っております。
                      - paragraph [ref=e1241]
                      - paragraph [ref=e1242]: 当社グループの事業に係わる位置づけ及び各セグメントとの関連は、次のとおりであります。
                      - paragraph [ref=e1243]
                      - paragraph [ref=e1244]: (プラント・エネルギー事業)
                      - paragraph [ref=e1245]:
                        - text: エネルギー開発生産、ガス石油精製、化学、エンジニアリング、建設、紙・パルプ関連の機械・器具・部品の販
                        - text: 売を行っており、当社及び一部の関係会社が仕入先から直接仕入れて販売するほか、一部は子会社(株)第一メカテック及び関連会社第一スルザー(株)から仕入れております。
                      - paragraph [ref=e1246]: (エナジーソリューションズ事業)
                      - paragraph [ref=e1247]: リチウムイオン電池製造関連の機械・器具・部品の販売を行っており、当社及び一部の関係会社が仕入先から直接仕入れて販売しております。
                      - paragraph [ref=e1248]
                      - paragraph [ref=e1249]: (産業機械事業)
                      - paragraph [ref=e1250]: プラスチックス、ゴム、鉄鋼、食品関連の機械・器具・部品の販売を行っており、当社及び一部の関係会社が仕入先から直接仕入れて販売するほか、一部は子会社(株)第一メカテック及び関連会社(株)浅野研究所から仕入れております。
                      - paragraph [ref=e1251]
                      - paragraph [ref=e1252]: (エレクトロニクス事業)
                      - paragraph [ref=e1253]: 電子、情報通信、電機、精密、光学、音響、楽器関連の機械・器具・部品の販売を行っており、当社及び一部の関係会社が仕入先から直接仕入れて販売するほか、一部は子会社(株)第一メカテックから仕入れております。
                      - paragraph [ref=e1254]
                      - paragraph [ref=e1255]: (自動車事業)
                      - paragraph [ref=e1256]: 自動車関連の機械・器具・部品の販売を行っており、当社及び一部の関係会社が仕入先から直接仕入れて販売しております。
                      - paragraph [ref=e1257]
                      - paragraph [ref=e1258]: (ヘルスケア事業)
                      - paragraph [ref=e1259]: 薬品、医薬品関連の機械・器具・部品の販売を行っており、当社及び一部の関係会社が子会社第一実業ビスウィル(株)及び(株)第一メカテックから仕入れて販売するほか、一部は仕入先から直接仕入れております。
                      - paragraph [ref=e1260]
                      - paragraph [ref=e1261]: (航空・インフラ事業)
                      - paragraph [ref=e1262]: 航空、防災関連の機械・器具・部品の販売を行っており、当社及び一部の関係会社が仕入先から直接仕入れて販売しております。
                      - paragraph [ref=e1263]
                      - paragraph [ref=e1264]: (その他)
                      - paragraph [ref=e1265]: 各種機械・器具の賃貸等を行っております。
                      - paragraph [ref=e1266]
                      - paragraph [ref=e1267]
                      - paragraph [ref=e1268]: 事業の系統は次のとおりであります。
