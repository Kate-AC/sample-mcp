                      - heading "3【事業の内容】" [level=3] [ref=e1076]
                      - paragraph [ref=e1077]: 当社グループは、株式会社日神グループホールディングス(当社)と子会社20社で構成され、不動産の企画・販売、管理、建設を主な内容として事業活動を展開しております。
                      - paragraph [ref=e1078]: 各社の当該事業に係る位置付け及び報告セグメントとの関連は、以下のとおりであります。
                      - paragraph [ref=e1079]: なお、事業区分は、報告セグメントと同一であります。
                      - paragraph [ref=e1080]: (1)不動産事業
                      - paragraph [ref=e1081]: 連結子会社である日神不動産株式会社は、分譲マンションの企画・販売、不動産の賃貸を行っております。日神不動産投資顧問株式会社は、不動産ファンドの組成・運用及び投資法人の資産運用を行っております。株式会社リコルドは戸建住宅の開発・販売を行っております。
                      - paragraph [ref=e1082]
                      - paragraph [ref=e1083]: (2)建設事業
                      - paragraph [ref=e1084]: 連結子会社である多田建設株式会社は、マンション等の建築に加え、土木工事も行っております。連結子会社株式会社シンコーは、建設資材のリースを行っております。
                      - paragraph [ref=e1085]
                      - paragraph [ref=e1086]: (3)不動産管理事業
                      - paragraph [ref=e1087]: 日神管財株式会社は、マンションの共用部分の管理、ビル管理、賃貸物件の管理受託、これら管理業務に伴うリフォームや大規模修繕等の工事及び賃貸物件の販売を行っております。
                      - paragraph [ref=e1088]: また、日神ライフサポート株式会社は管理員の派遣を行っております。
                      - paragraph [ref=e1089]
                      - paragraph [ref=e1090]: (4)その他
                      - paragraph [ref=e1091]: 「その他」は日神ファイナンス株式会社他1社となっております。日神ファイナンス株式会社は、少額の新規貸付を若干行っておりますが、縮小均衡を目指しております。
                      - paragraph [ref=e1092]
