                      - heading "3【事業の内容】" [level=3] [ref=e1107]
                      - paragraph [ref=e1108]: 当社グループは、当社及び連結子会社7社(孫会社1社を含む)により構成されており、首都圏において不動産開発事業を中心として事業展開しております。
                      - paragraph [ref=e1109]: 当社グループの主な事業内容及び事業の位置付けは、次のとおりであります。
                      - paragraph [ref=e1110]
                      - paragraph [ref=e1111]: (1)不動産開発事業
                      - paragraph [ref=e1112]: 首都圏において、主に下記の事業を行っております。
                      - paragraph [ref=e1113]: ・資産運用型単身者向けマンション「ガーラマンションシリーズ」の開発・販売・賃貸
                      - paragraph [ref=e1114]: ・自己居住用ファミリー層向けマンション「ガーラ・レジデンスシリーズ」の開発・販売
                      - paragraph [ref=e1115]: ・中古マンションの販売・仲介・買取・賃貸
                      - paragraph [ref=e1116]: 伊豆エリアにおいて、不動産の開発・販売・仲介・買取・賃貸を行っております。
                      - paragraph [ref=e1117]: (2)不動産管理事業
                      - paragraph [ref=e1118]: 主にマンション区分所有者から賃貸管理、及び管理組合から建物管理の請負業務を行っております。
                      - paragraph [ref=e1119]: また、伊豆エリアにおける別荘地管理事業を行っております。
                      - paragraph [ref=e1120]: (3)建設事業
                      - paragraph [ref=e1121]: 主にマンション等建築物の設計・施工・検査・リノベーションを行っております。
                      - paragraph [ref=e1122]: (4)旅館事業
                      - paragraph [ref=e1123]: 静岡県の伊豆エリアにおいて、温泉旅館「伊東遊季亭」、「伊東遊季亭 川奈別邸」、「玉峰館」及び「清流
                      - paragraph [ref=e1124]: 荘」の経営を行っております。
                      - paragraph [ref=e1125]: (5)その他
                      - paragraph [ref=e1126]: 当社顧客及びマンション管理組合向けに融資等の金融サービスを行っております。
                      - paragraph [ref=e1127]
