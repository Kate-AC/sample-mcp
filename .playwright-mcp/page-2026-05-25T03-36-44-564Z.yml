                      - heading "3【事業の内容】" [level=3] [ref=e1020]
                      - paragraph [ref=e1021]: 当社グループは、当社(澁澤倉庫株式会社)、子会社15社および関連会社8社(2025年3月31日現在)により構成され、物流事業および不動産事業を中核として事業運営を行っております。
                      - paragraph [ref=e1022]: 子会社には、物流事業会社として当社の物流事業の実作業・実運送を担当する会社、あるいは独自の営業活動を併せて行う会社ならびに不動産管理等を担当し当社とともに不動産事業を推進する会社があります。連結決算の対象会社として、これらの会社のうち重要性の判断基準により、9社を連結子会社としております。
                      - paragraph [ref=e1023]: 当社グループの事業内容および当社と子会社の当該事業に係る位置付けは次のとおりであります。
                      - paragraph [ref=e1024]: なお、以下の区分は「第5 経理の状況 1 連結財務諸表等 (1) 連結財務諸表 注記事項」に掲げるセグメントの区分と同一であります。
                      - paragraph [ref=e1025]: (1) 物流事業
                      - paragraph [ref=e1026]: 主たる業務は倉庫業務、港湾運送業務、陸上運送業務および国際輸送業務であります。
                      - paragraph [ref=e1027]: (イ) 倉庫業務
                      - paragraph [ref=e1028]: 寄託を受けた貨物の倉庫における保管・入出庫業務およびこれらに伴う流通加工等の荷役を行う業務であり、当社および大宮通運株式会社等が行っております。また、当社は荷役業務について澁澤コネクト株式会社等に委託しております。
                      - paragraph [ref=e1029]: (ロ) 港湾運送業務
                      - paragraph [ref=e1030]: 港湾における船内荷役、沿岸荷役、はしけ運送、上屋保管およびこれらに伴う荷捌を行う業務であり、当社および門司港運株式会社等が行っております。
                      - paragraph [ref=e1031]: (ハ) 陸上運送業務
                      - paragraph [ref=e1032]: 貨物自動車運送および引越等のサービスを行う業務であり、実運送および実作業は澁澤陸運株式会社等が行っております。
                      - paragraph [ref=e1033]: (ニ) 国際輸送業務
                      - paragraph [ref=e1034]: 国際一貫輸送業務、国際航空貨物運送業務およびこれらに伴う荷捌を行う業務であり、海外においては澁澤(香港)有限公司、Shibusawa Logistics Vietnam Co., Ltd.および澁澤物流(上海)有限公司等が行っております。
                      - paragraph [ref=e1035]: (ホ) その他の物流業務
                      - paragraph [ref=e1036]: 物流施設賃貸業務および通運業務等を、当社および大宮通運株式会社等が行っております。
                      - paragraph [ref=e1037]: (2) 不動産事業
                      - paragraph [ref=e1038]: 主たる業務はオフィスビル、物流施設等の開発・賃貸・管理であり、施設の設備管理、各種工事請負等を澁澤ファシリティーズ株式会社が行っております。
                      - paragraph [ref=e1039]
