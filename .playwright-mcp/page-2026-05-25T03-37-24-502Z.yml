                    - generic [ref=e954]:
                      - heading "3【事業の内容】" [level=3] [ref=e955]
                      - paragraph [ref=e956]: 当社グループは、当社、子会社44社および関連会社16社で構成され、総合物流事業として倉庫業、港湾運送業、陸上運送業、国際複合輸送業、その他を営む他、その他の事業として不動産業、ゴルフ場経営、自動車整備業等を営んでおります。当社グループの事業に係わる位置付けおよびセグメントとの関連は、次のとおりであります。
                      - paragraph [ref=e957]
                      - paragraph [ref=e958]: (1)総合物流事業
                      - paragraph [ref=e959]: (倉庫業)
                      - paragraph [ref=e960]: 当事業は、当社の主体業務であり、寄託を受けた物品を倉庫に保管し、その対価として保管料を収受しております。当社は、倉庫業法に基づく倉庫営業の許可を受け(一部施設においては、関税法に基づく保税蔵置場の許可を受けております。)、保管貨物の受渡しおよび担保金融に便益を提供するための倉荷証券発行の許可も受けております。倉庫保管業務に関連して寄託貨物の入出庫、配送および軽易な加工業務を行い、その対価として荷役料、配送料および附帯・物流加工料を収受しております。
                      - paragraph [ref=e961]: "[関係会社]"
                      - paragraph [ref=e962]: (株)トランスシティサービス、関西トランスシティサービス(株)、四日市物流サービス(株)、中部トランスシティサービス(株)、鹿島トランスシティサービス(株)、トランスシティロジスティクス中部(株)、トランスシティロジワークス三重(株)、水島トランスシティサービス(株)、ジェイトランス(株)、STコネクトロジスティクス(株)、極東冷蔵(株)、四港サイロ(株)、南大阪埠頭(株)、霞北埠頭流通センター(株)、中部コールセンター(株)、四日市港国際物流センター(株)、高橋梱包運輸(株)、東海団地倉庫(株)、タカスエトランスポート(株)
                      - paragraph [ref=e963]
                      - paragraph [ref=e964]: (港湾運送業)
                      - paragraph [ref=e965]: 港湾運送事業とは、港湾において海上輸送と陸上輸送を接続させるもので、国土交通省の免許を必要とする貨物の船積みおよび陸揚げ作業および荷捌きを行う事業とこれに付随する事業を行っております。
                      - paragraph [ref=e966]: 当社および当社関係会社は、四日市港において港湾運送事業法に規定する一般港湾運送事業、船内荷役事業、はしけ運送事業、沿岸荷役事業を営み、名古屋港では沿岸荷役事業、鹿島港、水島港、横浜港では一般港湾運送事業(限定)、大阪港では沿岸荷役事業を営んでおります。また、名古屋、横浜、大阪、神戸、門司、東京、函館の各税関から通関業の許可を受けております。当事業の主な収入は、船内荷役料、沿岸荷役料、上屋保管料、通関料等から構成されます。
                      - paragraph [ref=e967]: "[関係会社]"
                      - paragraph [ref=e968]: 四日市海運(株)、朝日海運(株)、四日市ポートサービス(株)、(株)東西荷扱所、ジェイトランス(株)、愛三商船(株)、ワイケイ物流サービス(株)、四日市コンテナターミナル(株)、四日市梱包(株)、四日市タグサービス(株)、四日市港埠頭(株)
                      - paragraph [ref=e969]
                      - paragraph [ref=e970]: (陸上運送業)
                      - paragraph [ref=e971]: 貨物自動車運送事業法、貨物利用運送事業法に基づき、三重県、愛知県、岐阜県、滋賀県、大阪府、兵庫県、岡山県、福岡県、茨城県および首都圏において、貨物自動車運送業および貨物利用運送事業を行っております。ま
                      - paragraph [ref=e972]: た、鉄道を利用した利用運送事業を関西線四日市駅、東海道本線名古屋貨物ターミナル駅、大阪貨物ターミナル駅、水島臨海鉄道東水島駅および鹿島臨海鉄道神栖駅において行っております。
                      - paragraph [ref=e973]: "[関係会社]"
                      - paragraph [ref=e974]: 四倉運輸(株)、九州シティフレイト(株)、鹿島シティフレイト(株)、中部シティフレイト(株)、大阪シティフレイト(株)、関東シティフレイト(株)、ジェイトランス(株)、TSトランスポート(株)、亀山トランスポート(株)、伊勢運輸(株)
                      - paragraph [ref=e975]
                      - paragraph [ref=e976]: (国際複合輸送業)
                      - paragraph [ref=e977]: 輸出入貨物を荷送人の指定場所から荷受人の指定場所まで、一貫した運送責任を持ったスルーB/Lを発行し最適
                      - paragraph [ref=e978]: な輸送手段を用いて運送を行う国際複合輸送業、国際間の航空貨物の運送に関する諸業務を行う航空貨物運送代理店業を行っております。
                      - paragraph [ref=e979]: "[関係会社]"
                      - paragraph [ref=e980]: Trancy Logistics America Corporation、Trancy Logistics(Thailand)Co.,Ltd.、
                      - paragraph [ref=e981]: Trancy Distribution(Thailand)Co.,Ltd.、PT.Naditama-Trancy Logistics Indonesia、
                      - paragraph [ref=e982]: Trancy Logistics(H.K.)Ltd.、Trancy Logistics Philippines,Inc.、
                      - paragraph [ref=e983]: Trancy Logistics(Europe)GmbH、Trancy Logistics Mexico S.A.de C.V.、
