                      - paragraph [ref=e985]: Trancy Logistics(Vietnam)Co.,Ltd.、Trancy Distribution(Vietnam)Co.,Ltd.
                      - paragraph [ref=e986]: Trancy Logistics(Cambodia)Co.,Ltd.、ジェイトランス(株)
                      - paragraph [ref=e987]
                      - paragraph [ref=e988]: (その他)
                      - paragraph [ref=e989]: 取引先工場内の作業の請負などを行っております。
                      - paragraph [ref=e990]: "[関係会社]"
                      - paragraph [ref=e991]: ジェイトランス(株)、Local Design Mie(株)、四日市ケミカルステーション(株)
                      - paragraph [ref=e992]
                      - paragraph [ref=e993]: (2)その他
                      - paragraph [ref=e994]: 不動産業、建設業、損害保険代理店業、自動車整備業、ゴルフ場、情報システムの企画・開発・保守および運用管理業務、水素供給事業を営んでおります。
                      - paragraph [ref=e995]: "[関係会社]"
                      - paragraph [ref=e996]: ヨンソー開発(株)、三鈴カントリー(株)、セントラル自動車整備(株)、トランスシティコンピュータサービス(株)、霞北埠頭流通センター(株)、(株)四日市ミート・センター、多度開発(株)、みえ水素ステーション(同)
