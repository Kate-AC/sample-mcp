                    - generic [ref=e866]:
                      - heading "3【事業の内容】" [level=3] [ref=e867]
                      - paragraph [ref=e868]: 当社グループは、当社((株)ベルパーク)及び連結子会社((株)ベルパークネクスト)により構成されており、キャリアショップの運営を中心に情報通信機器等の販売及びサービスを提供する事業を展開しております。
                      - paragraph [ref=e869]: 2025年12月31日現在、移動体通信事業者との代理店委託契約等に基づき当社グループが運営するキャリアショップ(ソフトバンクショップ、auショップ、ドコモショップ、ワイモバイルショップ)は、266店舗となっております。また、当社グループと再委託契約を締結した販売代理店(二次代理店)が、キャリアショップ(フランチャイズ店)57店舗を運営しております。
                      - paragraph [ref=e870]
                      - paragraph [ref=e871]: (注)ソフトバンクショップ、auショップ並びにワイモバイルショップは一次代理店として、ドコモショップは二次代理店として運営しております。
                      - paragraph [ref=e872]
                      - paragraph [ref=e873]: 当社グループは「情報通信機器販売サービス事業」の単一セグメントではありますが、キャリアショップ事業と法人ソリューション事業の2つの事業があります。
                      - paragraph [ref=e874]
                      - paragraph [ref=e875]: 「キャリアショップ事業」
                      - paragraph [ref=e876]: キャリアショップ事業では、情報通信サービスの新規契約等の取次、情報通信機器等商品の販売、割賦契約の斡旋、故障修理や料金プランの変更等受付、並びに通信料金の収納受付等を行っており、直営店とフランチャイズ店で営業内容に差異はございません。
                      - paragraph [ref=e877]
                      - paragraph [ref=e878]: 「法人ソリューション事業」
                      - paragraph [ref=e879]: 法人ソリューション事業では、法人のお客様に対して携帯電話等の通信サービスの契約取次ぎ、クラウドサービスの取次ぎ、セキュリティ関連商材の販売、端末の設定及び管理の支援、故障受付等のアフターサービスの提供等を行っております。
                      - paragraph [ref=e880]
                      - paragraph [ref=e881]: (売上高、売上原価について)
                      - paragraph [ref=e882]: 当社グループは、顧客や二次代理店に販売した情報通信機器等商品の販売価格を商品売上高、当社グループ及び二次代理店の情報通信サービス契約取次及び故障修理や料金プラン変更等各種受付業務に対する手数料、並びに新規契約等を締結した加入者の毎月の通信料金の一定割合を一定期間にわたり受け取る手数料(継続手数料)等で主に移動体通信事業者から受け取る手数料を受取手数料とし、商品売上高と受取手数料を売上高としております。
                      - paragraph [ref=e883]: 移動体通信事業者等から仕入れた情報通信機器、各種付属品等の商品のうち当社グループが顧客又は二次代理店に販売した商品の仕入価格を商品売上原価、当社グループが二次代理店に委託した業務(情報通信サービスの新規契約等の取次、情報通信機器等商品の販売、割賦契約の斡旋、故障修理や料金プランの変更等受付、並びに通信料金の収納受付等)の対価として、当社グループが移動体通信事業者等から受け取る手数料を原資として二次代理店に支払う手数料を支払手数料とし、商品売上原価と支払手数料を売上原価としております。
                      - paragraph [ref=e884]: 事業の系統図は、次のとおりであります。
