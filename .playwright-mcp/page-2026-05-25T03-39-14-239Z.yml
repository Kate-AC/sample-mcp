                      - heading "3 【事業の内容】" [level=3] [ref=e1070]
                      - paragraph [ref=e1071]: 当社グループ(当社、連結子会社33社、持分法適用関連会社7社、持分法非適用関連会社1社)が営んでいる主な事業内容と、各関係会社等の当該事業に係る位置づけは次のとおりであります。
                      - heading "〔ガス〕" [level=4] [ref=e1072]
                      - paragraph [ref=e1073]: 当社は、ガスの供給、販売及びLNG(液化天然ガス)の販売を行っております。
                      - paragraph [ref=e1074]: 清水エル・エヌ・ジー(株)(連結子会社)は、当社からLNG及びLPGを仕入れてガスの製造を行い、当社に販売しております。
                      - paragraph [ref=e1075]: なお、当社と清水エル・エヌ・ジー(株)との取引の概要は次のとおりであります。
                      - paragraph [ref=e1076]: 1 当社は、都市ガスの原料となるLNGを輸入し、清水エル・エヌ・ジー(株)に譲渡しております。
                      - paragraph [ref=e1077]: 2 清水エル・エヌ・ジー(株)は、当社から仕入れたLNGを主原料として製品ガス(都市ガス)を製造し、全量を当社に販売しております。
                      - paragraph [ref=e1078]: 吉田ガス(株)(連結子会社)は、ガスの供給、販売を行っております。
                      - paragraph [ref=e1079]: 中遠ガス(株)、袋井ガス(株)、島田ガス(株)、御殿場ガス(株)の連結子会社4社は、当社からガスの卸供給を受けて、ガスの供給、販売を行っております。
                      - paragraph [ref=e1080]: 信州ガス(株)、下田ガス(株)、佐渡ガス(株)の連結子会社3社は、ガスの製造、供給、販売を行っております。
                      - paragraph [ref=e1081]: 南遠州パイプライン(株)(持分法非適用関連会社)は、当社からガスの卸供給を受けて、ガスの供給、販売を行っております。
                      - paragraph [ref=e1082]: 静浜パイプライン(株)(持分法適用関連会社)は、当社から委託を受けて、ガスの輸送を行っております。
                      - paragraph [ref=e1083]: SHIZUOKA GAS TRADING PTE. LTD.(連結子会社)は、当社のLNGトレーディングにおけるフロントオフィス業務を担い、マーケット調査を行っております。
                      - paragraph [ref=e1084]: SHIZUOKA GAS AMERICA CO.(連結子会社)は、アメリカでのエネルギー事業の開拓を進めております。
                      - paragraph [ref=e1085]: SHIZUOKA GAS INDIA PTE. LTD.(連結子会社)は、インドでのエネルギー事業の開拓を進めております。
                      - paragraph [ref=e1086]: SHIZUOKA GAS ASIA PTE. LTD.(連結子会社)は、東南アジアでのエネルギー事業の開拓を進めております。
                      - paragraph [ref=e1087]
                      - heading "〔LPG・その他エネルギー〕" [level=4] [ref=e1088]
                      - paragraph [ref=e1089]: 静岡ガス&パワー(株)(連結子会社)は、電力の販売を行っております。なお、同社は、当社からガスの仕入れをしており、当社に電力を販売しております。
                      - paragraph [ref=e1090]: 静岡ガスエネルギー(株)(連結子会社)は、LPGの販売及びこれに付随する機器販売並びに配管工事を行っております。なお、同社は、当社及び吉田ガス(株)、下田ガス(株)、信州ガス(株)、佐渡ガス(株)、島田ガス(株)にLPGを卸販売しております。
                      - paragraph [ref=e1091]: 当社及び吉田ガス(株)、下田ガス(株)、信州ガス(株)、佐渡ガス(株)、島田ガス(株)は、附帯事業として、LPGの販売(一部簡易ガス事業を含む)を行っております。
                      - paragraph [ref=e1092]: 当社は、オンサイト・エネルギーサービス事業(注)を行っております。
                      - paragraph [ref=e1093]: (注) 従来お客さまが自ら設置していたエネルギー設備(コージェネレーションシステム・空調熱源等)をお客さまに代わって当社がお客さま事業所内に設置し、その設備を運転して発生した電気・熱エネルギーをお客さまに販売する事業。
                      - paragraph [ref=e1094]: My son-Hoan Loc Viet Solar Energy Joint Stock Company(持分法適用会社)は、ベトナムにおいて太陽光発電事業を行っております。
                      - paragraph [ref=e1095]
                      - heading "〔その他〕" [level=4] [ref=e1096]
                      - paragraph [ref=e1097]: 当社及び吉田ガス(株)、中遠ガス(株)、袋井ガス(株)、島田ガス(株)、御殿場ガス(株)、信州ガス(株)、下田ガス(株)、佐渡ガス(株)は、ガス配管工事の施工及びガス機器の販売を行っております。
                      - paragraph [ref=e1098]: 静岡ガス・エンジニアリング(株)(連結子会社)は、ガス設備の保全、ガス工事及び空調工事等を行っております。なお、同社は、主に清水エル・エヌ・ジー(株)のガス設備の保全のほか、当社が発注するガス工事等を行っております。
                      - paragraph [ref=e1099]: 静岡ガスリビング(株)(連結子会社)は、ガス・火災警報器の販売及びリフォーム事業等を行っております。なお、同社は、当社に住設機器等を販売しております。
                      - paragraph [ref=e1100]: グッドリビング(株)(連結子会社)は、注文住宅及び建売住宅の設計・施工・販売等を行っております。
                      - paragraph [ref=e1101]: 静岡ガスアスライフデザイン(株)は、SR(ショールーム)の運営事業等を行っております。
                      - paragraph [ref=e1102]: エネリア静岡(株)、エネリア東部(株)の連結子会社2社は、ガス機器の販売及びリフォーム事業等を行っております。なお、当社は、同社にガス配管工事及び保安業務の委託等を行っております。
                      - paragraph [ref=e1103]: 静岡ガスクレジット(株)(連結子会社)は、リース業務等を行っております。なお、同社は、当社に車両、OA機器等をリースしております。
                      - paragraph [ref=e1104]: 静岡ガス保険サービス(株)(連結子会社)は、保険代理業を行っております。
                      - paragraph [ref=e1105]: 静岡ガスヘルスケア(株)(連結子会社)は、介護関連事業を行っております。
                      - paragraph [ref=e1106]: 静岡ガス・システムソリューション(株)(連結子会社)は、当社の情報処理及びシステム開発をしております。
                      - paragraph [ref=e1107]: 静岡ガスヒューマンリソース(株)(連結子会社)は、人材派遣関連事業、清掃業、警備事業を行っております。
                      - paragraph [ref=e1108]: 静岡ガスサービス(株)(連結子会社)は、主に静岡ガスエネルギー(株)のLPGの配送のほか、当社のLNGの輸送等を行っております。
                      - paragraph [ref=e1109]
                      - paragraph [ref=e1110]: 以上述べた事項を事業系統図によって示すと、次のとおりであります。
