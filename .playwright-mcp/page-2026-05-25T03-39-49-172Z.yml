                      - heading "3 【事業の内容】" [level=3] [ref=e1041]
                      - paragraph [ref=e1042]: 当社グループは、当社(株式会社建設技術研究所)及び子会社により構成されており、河川、ダム、道路、環境、情報などの公共事業及び民間事業の社会資本整備に関する建設コンサルタント業を営んでおります。なお、当連結会計年度において連結子会社は25社、持分法適用会社はありません。
                      - paragraph [ref=e1043]: 当社グループの事業内容及び当社と主要な子会社の当該事業に係る位置付けは次のとおりであります。
                      - heading "1 国内建設コンサルティング事業" [level=4] [ref=e1044]
                      - paragraph [ref=e1045]: 主要な事業は、国内における公共事業の企画、調査、計画、設計、発注者支援、施工管理、運用維持管理などの総合コンサルティング業務及び付随するシステム開発、保守管理、一般事務処理受託、土地区画整理業務、地質調査業務、建築設計・監理業務並びに環境計量証明業務・環境調査・分析業務であります。土地区画整理業務、地質調査業務、建築設計・監理業務及び環境計量証明業務・環境調査・分析業務を除く業務は主に当社及び子会社広建コンサルタンツ株式会社、土地区画整理業務は子会社日本都市技術株式会社、地質調査業務は子会社株式会社地圏総合コンサルタント、建築設計・監理業務は子会社株式会社日総建、環境計量証明業務・環境調査・分析業務は子会社株式会社環境総合リサーチが担当しております。
                      - heading "2 海外建設コンサルティング事業" [level=4] [ref=e1046]
                      - paragraph [ref=e1047]: 主要な事業は、海外におけるプロジェクトの発掘、マスタープランの策定、企画、調査、計画、設計、施工管理、運用維持管理など建設プロジェクト全般にわたる総合コンサルティング事業並びに構造設計、設備設計を含むビルディング関連事業、技術者派遣事業であります。総合コンサルティング事業は当社、子会社株式会社建設技研インターナショナル及び子会社Waterman Group Plc、ビルディング関連事業は子会社Waterman Group Plc及び子会社Waterman Group (Aus) Pty Limited、技術者派遣事業は子会社Waterman Aspen Limitedが担当しております。
                      - paragraph [ref=e1048]: 以上述べた事項を事業系統図によって示すと次のとおりであります。
                      - paragraph [ref=e1050]: （画像は省略されました）
