                      - paragraph [ref=e959]:
                        - text: 当社は、商業施設の環境演出、展示・ディスプレイ、文化・スポーツ施設、複合商業施設の企画、コンサルティング、設計、監理、施工までの業務を一貫して行っております。
                        - text: SPACE JAPAN(HK) CO.,LTD.は、主に香港における商業施設の企画・設計・監理・施工及び香港の情報の入手を行っており、当社はその工事の設計、監理の受注をしております。
                      - paragraph [ref=e960]: SPACE SHANGHAI CO.,LTD.は、主に上海における商業施設の企画・設計・監理・施工及び資材・家具の輸出のほか、上海の情報の入手を行っており、当社はその工事に関する設計・監理の受注及び資材・家具を発注し輸入しております。
                      - paragraph [ref=e961]: SPACE JAPAN(VN) CO.,LTD.は、主にベトナムにおける商業施設の企画・コンサルティング・設計・監理・施工及び陳列什器・家具等の制作・輸出入のほか、ベトナムの情報の入手を行っており、当社はその工事に関する設計・監理の受注及び陳列什器・家具等を発注し輸入しております。
                      - paragraph [ref=e962]: (株)エム・エス・シーは、主に国内における商業施設の企画・調査・リーシングを行うコンサルティング企業であります。当社は、(株)エム・エス・シーと事業連携を行うことで、商業施設の開発に取り組んでおります。
                      - paragraph [ref=e963]: 沖縄スペース(株)は、主に沖縄県における商業施設の企画・コンサルティング・調査・リーシング・設計・監理・施工を行っております。
