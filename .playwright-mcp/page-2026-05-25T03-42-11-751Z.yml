                      - heading "3 【事業の内容】" [level=3] [ref=e1090]
                      - paragraph [ref=e1091]: 当社グループは、1955年の創業時から、人々の健康増進や福祉の向上、快適で衛生的な空間づくりに寄与することを目的に、社会に貢献できる企業を目指してさまざまな事業を展開してまいりました。2025年3月31日現在におきましては、当社及び子会社27社、関連会社2社で構成され、主に「健康生活サービス」「調剤サービス」「環境サービス」の3分野に関係する事業を行っております。各事業に携わる連結子会社数は、「健康生活サービス」が8社、「調剤サービス」が3社、「環境サービス」が6社、これらの報告セグメントに含まない「その他」が1社となっております。
