                      - paragraph [ref=e852]
                      - heading "3 【事業の内容】" [level=3] [ref=e853]
                      - paragraph [ref=e854]: 当社グループ(当社及び当社の関係会社)は、当社、当社の連結子会社及び持分法適用関連会社の計3社により構成されており、「情報サービス業」の単一セグメントであります。
                      - paragraph [ref=e855]: 当社は独立系のシステムインテグレーターとして、お客様の業種・業態を問わず、メーカー・ベンダー製品に依存しないニュートラルな立場から、一貫したサービス提供を強みとしております。
                      - paragraph [ref=e856]: 当社グループの事業系統図はつぎのとおりであります。
                      - paragraph [ref=e857]
                      - paragraph [ref=e859]: （画像は省略されました）
                      - paragraph [ref=e860]
                      - paragraph [ref=e861]
                      - paragraph [ref=e862]: 当社は情報サービス(コンサルティング及びシステムインテグレーションサービス、システムマネージメントサービス、商品販売)を主たる業務としております。
                      - paragraph [ref=e863]
                      - heading "a.コンサルティング及びシステムインテグレーションサービス" [level=4] [ref=e864]
                      - paragraph [ref=e865]: お客様の様々な経営課題に対し、ビジネス知識・経験・業務ノウハウを兼ね備えたITコンサルタントやエンジニアが、システムのデザインから開発・導入、保守まで、先進のITを駆使して、お客様と成功イメージを共有しながら、最善なITソリューションを導き出しております。
                      - paragraph [ref=e866]: また、第三者的な立場で、業務要件の実現性、システム品質の妥当性・操作性など、実運用の適合性を検証する総合品質ソリューションサービスである「システム検証サービス」を提供しております。
                      - paragraph [ref=e867]
                      - paragraph [ref=e868]
                      - heading "b.システムマネージメントサービス" [level=4] [ref=e869]
                      - paragraph [ref=e870]: 24時間365日体制での稼働監視や障害対応、システム利用者からの各種問合せに対応するヘルプデスク業務等、システム運用全般において発生する様々な作業をサポートしております。また、運用業務のアウトソーシングサービス、運用業務効率化のための運用設計及び基盤構築など、専門技術者による技術支援サービスを提供し、システム運用に関するあらゆる局面において、お客様のビジネスをご支援しております。
                      - paragraph [ref=e871]
                      - heading "c.商品販売(ソフトウェア・プロダクト、コンピュータ及び関連機器消耗品の販売)" [level=4] [ref=e872]
                      - paragraph [ref=e873]: 比較的低コストでシステム導入も容易な各種パッケージソリューションなどを取り扱っております。
                      - paragraph [ref=e874]
                      - paragraph [ref=e875]: 連結子会社及び持分法適用関連会社においては、情報サービス及び情報サービスに付帯する業務を行っております。
                      - paragraph [ref=e876]
