                      - heading "3 【事業の内容】" [level=3] [ref=e852]
                      - paragraph [ref=e853]: 当社の事業は、情報サービス事業並びにこれらの附帯業務の単一事業であるため、セグメント別に代えて事業部門別に記載しております。
                      - paragraph [ref=e854]
                      - paragraph [ref=e855]: (ネットワークサービス部門)
                      - paragraph [ref=e856]: 当部門は、オープン系サーバ、ネットワークシステムの構築、運用管理をはじめ、セキュリティ関連業務のほか、各種ソフトのインストールやヘルプデスク、障害対応など幅広いサポート業務を行っております。
                      - paragraph [ref=e857]
                      - paragraph [ref=e858]: (システム開発部門)
                      - paragraph [ref=e859]: 当部門は、業務系システムの設計・開発、組込み系ソフト開発・検証、ERP(業務パッケージ)等のソフト開発に関わる業務を行っております。
                      - paragraph [ref=e860]
                      - paragraph [ref=e861]: (システム運用部門)
                      - paragraph [ref=e862]: 当部門は、汎用系システムの保守・運用管理を行っております。
                      - paragraph [ref=e863]
                      - paragraph [ref=e864]: (事業系統図)
                      - paragraph [ref=e865]: 上記を事業系統図によって示すと次のとおりです。当該業務の提供に際しては、類似業務の提供であっても指揮命令系統の違い等により、請負契約、派遣契約等がお客様との間で締結されており、請負契約については、主としてお客様による検収等の完了時点において、また、派遣契約等については、契約期間にわたって収益を認識する方針としております。
