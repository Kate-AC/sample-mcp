                      - heading "3【事業の内容】" [level=3] [ref=e1184]
                      - paragraph [ref=e1185]: 当グループは、当社、子会社30社及び関連会社5社並びにその他の関係会社1社で構成されております。
                      - paragraph [ref=e1186]: 当グループの事業における位置付け及びセグメントとの関連は、次のとおりであります。
                      - paragraph [ref=e1187]: なお、セグメントと同一の区分であります。
                      - paragraph [ref=e1188]: 1 機械部門
                      - paragraph [ref=e1189]: 当部門は、自動車・食品・化学業界を主体とするユーザー向けの装置や機械設備の設計・製造及び輸入販売を行っております。
                      - paragraph [ref=e1190]
                      - paragraph [ref=e1191]: 2 化成品部門
                      - paragraph [ref=e1192]: 当部門は、主として自動車製造ライン向けシーリング材やアンダーコート材等の防錆対策材料や剛性補助材等のNVH対策製品及び住宅向け複層ガラス用シーラントや新素材を応用した機能性製品をユーザーとの共同開発により製造・販売を行っております。
                      - paragraph [ref=e1193]: 中国、米国、メキシコ、インドに自動車部品の製造拠点を配置し、グローバルな供給体制を構築しております。
                      - paragraph [ref=e1194]
                      - paragraph [ref=e1195]: 3 化学品部門
                      - paragraph [ref=e1196]: 当部門は、自動車・電機等の広範囲な製造分野を対象市場とする生産ライン向け洗浄剤・防錆剤・塗装剥離剤等の一般工業用ケミカル品の製造販売及び鉄鋼業界向けデスケーリング用ケミカル及び関連装置(ソルトバス)等の設計施工・販売を行っております。
                      - paragraph [ref=e1197]
                      - paragraph [ref=e1198]: 4 産業用素材部門
                      - paragraph [ref=e1199]: 当部門は、自動車及びエアコン用の防音・防振材をユーザーニーズに基づきユーザーとの共同開発を含め製造・販売を行っております。日本、タイ、ベトナム、中国、チェコ、トルコ、メキシコに生産拠点を配置し、グローバルな供給体制を推進しております。
                      - paragraph [ref=e1200]
                      - paragraph [ref=e1201]: 5 化工品部門
                      - paragraph [ref=e1202]: 当部門は、電子部品や半導体、ディスプレイ製造向けの電子産業用ファインケミカル、撥水剤やワックス等のカーケアケミカル、鉄道・航空機・船舶整備向けケミカル、工業用熱風機及び乾燥剤の開発・製造・販売を行っております。
                      - paragraph [ref=e1203]
                      - paragraph [ref=e1204]: 6 その他
                      - paragraph [ref=e1205]: 当部門は、製商品や原材料の貿易業務を主体とし、燃料等の石油関連製品の販売等を行っております。また建設関連の建設資材の製造販売を行っております。
                      - paragraph [ref=e1206]
                      - paragraph [ref=e1207]: 以上に述べたセグメントの系統図は次のとおりであります。
                      - paragraph [ref=e1208]: 当社及び当社の関係会社は、当社グループである当社、子会社30社及び関連会社5社並びにその他の関係会社1社より構成され、当社グループは機械、化成品、化学品、産業用素材、化工品及びその他の6部門で事業を行っております。
