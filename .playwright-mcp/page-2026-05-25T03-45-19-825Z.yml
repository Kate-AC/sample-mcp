                      - heading "3【事業の内容】" [level=3] [ref=e853]
                      - paragraph [ref=e854]: 当社グループは、株式会社日伝(当社)と連結子会社4社(岡崎機械株式会社、日伝国際貿易(上海)有限公司、エヌピーエーシステム株式会社、株式会社アペルザ)、非連結子会社6社(株式会社空間洗浄Lab.、株式会社プロキュバイネット、NICHIDEN TRADING (Thailand) Co.,Ltd.、NICHIDEN (Thailand) Co.,Ltd.、NICHIDEN VIET NAM CO.,LTD、NICHIDEN USA Corporation)で構成されております。
                      - paragraph [ref=e855]: 当社は動力伝導機器、産業機器、制御機器等の機械設備及び機械器具関連商品の販売を主な事業とし、子会社岡崎機械株式会社は木工用機械等の産業機器の販売、日伝国際貿易(上海)有限公司は動力伝導機器等の販売、エヌピーエーシステム株式会社は油圧システム等の設計・製造、株式会社アペルザはものづくり産業向けオンラインプラットフォームの提供、株式会社空間洗浄Lab.は除菌消臭装置の製造・販売、株式会社プロキュバイネットは電子購買のポータルサイト運営、NICHIDEN TRADING (Thailand) Co.,Ltd.、NICHIDEN (Thailand) Co.,Ltd.、NICHIDEN VIET NAM CO.,LTD及びNICHIDEN USA Corporationは動力伝導機器等の販売を事業の目的としております。
                      - paragraph [ref=e856]: なお、当社グループにおける商品区分別の主要品目は次のとおりであります。
                      - paragraph [ref=e857]
                      - paragraph [ref=e858]: (動力伝導機器)
                      - paragraph [ref=e859]: 減速機、変速機、チェーン伝導用品、ベルト伝導用品、歯車伝導用品、カップリング、その他伝導関連商品、ベアリング、直動機器、ベアリングユニット、その他軸受関連商品、金属材料、合成材料、セラミック、新素材
                      - paragraph [ref=e860]: (産業機器)
                      - paragraph [ref=e861]: コンベヤ、運搬機器、振動機、昇降揚重機、保管関連機器、搬送システム、構造用システム機器、包装・梱包システム機器、その他荷役・運搬・搬送関連商品、モータ、環境機器、ファン、集塵・洗浄機器、ポンプ、その他機械器具・工具関連商品
                      - paragraph [ref=e862]: (制御機器)
                      - paragraph [ref=e863]: 油圧機器、空圧機器、真空機器、ホース、チューブ、継手、シーケンサ、表示器、アクチュエータ、センサ、スイッチ、エンコーダ、画像処理、測定機器、計測機器、盤用機器、ロボット、ナットランナ、メカトロパーツ、配管機材、通信・ネットワーク機器、無停電電源装置、その他制御機器関連商品
