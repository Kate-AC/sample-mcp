                    - generic [ref=e1017]:
                      - paragraph [ref=e1018]
                      - heading "3 【事業の内容】" [level=3] [ref=e1019]
                      - paragraph [ref=e1020]: 当社グループ(当社、連結子会社並びに関連会社)は、建設仮設材の賃貸及び販売並びに仮設工事の設計、施工等を主たる事業内容とする当社を中核として、各建設作業所における関連商品群を取扱い、総合的な営業活動を全国規模で展開しております。
                      - heading "(重仮設事業)" [level=4] [ref=e1021]
                      - paragraph [ref=e1022]: 重仮設事業におきましては、当社並びに連結子会社5社、関連会社3社にて展開しております。
                      - paragraph [ref=e1023]: 連結子会社のうちジェコス設計(株)は設計及びコンサルティング等を、ジェコス工事(株)は仮設工事の安全施工に関する技術的支援等を、(株)オトワコーエイは仮設工事、基礎杭工事、地中障害撤去工事等を行っております。また、トラック・エンド・メンテナンス・サービス(株)は、建設仮設材等の運送を行っており、当社はその委託をしております。GECOSS VIETNAM CO., LTD.は、ベトナム・ホーチミンを拠点に建設仮設材の賃貸、販売及び設計受託を行っております。
                      - paragraph [ref=e1024]: 関連会社のうち協友リース(株)はH形鋼桁材、鋼矢板等を賃貸しており、当社はその提供を受けて顧客に供給しております。また北日本建材リース(株)は当社と建設仮設材等の賃貸借を行っております。FUCHI Pte. Ltd.はシンガポールを拠点に建設仮設材の賃貸・販売・加工、仮設工事の請負を行っています。
                      - heading "(建設機械事業)" [level=4] [ref=e1025]
                      - paragraph [ref=e1026]: 建設機械事業におきましては、連結子会社のレンタルシステム(株)が建設用機械の賃貸を行っております。また、当社と情報を共有化し、連携営業を行うことで重仮設事業とのシナジー効果の実現を図っております。
                      - heading "(その他の関係会社)" [level=4] [ref=e1027]
                      - paragraph [ref=e1028]: 当社は、JFEホールディングス(株)及びJFEスチール(株)、並びにみずほリース(株)の関連会社であります。
                      - paragraph [ref=e1029]: 当社は、JFEグループにおいてJFEホールディングス(株)の完全子会社であるJFEスチール(株)を中心とする鉄鋼事業セグメントに属し、当社が営む重仮設事業との連携を通じて、グループの建材事業の拡大に取り組んでおり、当社が取扱う建設仮設材の一部は、JFEスチール(株)製の鉄鋼製品をJFEグループから調達しております。また、みずほリース(株)においては、同業他社との差別化を図り、競争力を高めるためにアライアンス戦略を推進しており、当社はアライアンスパートナーとして、互いの知見やノウハウの共有などを通じて、相互の企業価値の最大化に取り組んでおります。
                      - paragraph [ref=e1030]: 当社グループの概要図は下記のとおりであります。
                      - paragraph [ref=e1032]: （画像は省略されました）
                      - paragraph [ref=e1033]: (注) 北日本建材リース(株)は持分法非適用の関連会社でありましたが、2025年4月4日付で当社の保有する同社の全株式を譲渡いたしました。
