                      - paragraph [ref=e1081]: (用語説明)
                      - paragraph [ref=e1082]: ・プレストレストコンクリート
                      - paragraph [ref=e1083]: PC鋼材と呼ばれる高強度の鋼材を引っ張って(この作業を緊張といいます。)張力を与えた後にコンクリートと固定することで引っ張られていたPC鋼材が元に戻ろうとしてコンクリートに圧縮力を与えることで、コンクリート部材の強度・耐久性を向上させる技術です。この技術により、コンクリートの最大の弱点(圧縮には強いが引張には弱い。)を克服することができます。
                      - paragraph [ref=e1084]: コンクリートの橋梁上部、落石から道路を守るロックシェッド等の防災設備、タンク、建築、舗装、既存構造物の補強など幅広い分野に利用されています。
                      - paragraph [ref=e1085]: ・ニューマチックケーソン
                      - paragraph [ref=e1086]: ニューマチックケーソン工法(Pneumatic caisson method)のpneumaticは空気のcaissonは函(はこ)を意味します。日本では「潜函」工法とも呼ばれています。
                      - paragraph [ref=e1087]: 地上で鉄筋コンクリート製の函(躯体)を構築し、躯体下部に作業室を設け、ここに地下水圧に見合った圧縮空気を送り込むことで地下水の浸入を防ぎます。
                      - paragraph [ref=e1088]: 作業室内で地山を掘削・排土して、躯体を沈下させることで、橋梁や建造物の基礎として、また、下水ポンプ場、地下調整池、シールドトンネルの立坑、地下鉄や道路トンネルの本体構造物として幅広く活用されています。
                      - paragraph [ref=e1089]
