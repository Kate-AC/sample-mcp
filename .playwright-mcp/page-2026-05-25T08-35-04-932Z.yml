                      - heading "3 【事業の内容】" [level=3] [ref=e1020]
                      - paragraph [ref=e1021]
                      - paragraph [ref=e1022]: 当社グループは、当社及び子会社である松友商事(株)、松井リフォーム(株)及び関連会社であるいなぎ文化センターサービス(株)の子会社2社、関連会社1社(うち連結対象は子会社2社)で構成され、主要な事業内容は、建設工事の請負事業、不動産事業である。
                      - paragraph [ref=e1023]: 当社グループの事業に係る位置付け及びセグメントとの関連は次のとおりであり、セグメントと同一の区分である。
                      - paragraph [ref=e1024]: (建設事業)
                      - paragraph [ref=e1025]: 建設工事の請負事業は当社及び連結子会社である松井リフォーム(株)が営んでいる。当社は松井リフォーム(株)に建築工事の一部を発注しているほか、連結子会社である松友商事(株)から工事を受注している。
                      - paragraph [ref=e1026]: (不動産事業等)
                      - paragraph [ref=e1027]: 当社は土地・建物の売買及び賃貸住宅・貸事務所等の不動産事業及び建設工事全般の設計・監理に関する事業等を営んでいる。松友商事(株)は土地・建物の売買及び賃貸住宅・貸事務所等の不動産事業を営んでいる。
                      - paragraph [ref=e1028]:
                        - text: 当社は賃貸建物の一部を松友商事(株)及び松井リフォーム(株)に賃貸している。
                        - text: また、関連会社であるいなぎ文化センターサービス(株)はPFI事業を営んでいる。
                      - paragraph [ref=e1029]
                      - paragraph [ref=e1030]: 事業の系統図は次のとおりである。
