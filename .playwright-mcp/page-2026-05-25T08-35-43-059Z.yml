                      - heading "3 【事業の内容】" [level=3] [ref=e1078]
                      - paragraph [ref=e1079]: 当社グループは、当社、子会社7社、関連会社1社で構成され、土木事業、地盤改良事業及びブロック事業を主な事業内容としている。
                      - paragraph [ref=e1080]: (土木事業)
                      - paragraph [ref=e1081]: 当社、高橋秋和建設(株)が土木工事の施工を行っており、両社は相互に工事の発注又は受注を行っている。
                      - paragraph [ref=e1082]: (地盤改良事業)
                      - paragraph [ref=e1083]: 当社、(株)ソイルテクニカ、Fudo Construction Inc.、愛知ベース工業株式会社、日本土質試験センター株式会社、Advanced Geosolutions Inc.が地盤改良工事の施工等を行っており、(株)ソイルテクニカは当社より建設機械を賃借している。
                      - paragraph [ref=e1084]: (ブロック事業)
                      - paragraph [ref=e1085]: 当社、(株)三柱が消波・根固ブロック用鋼製型枠の賃貸等を行っており、当社は土木事業においてこれらの会社より消波・根固ブロック用鋼製型枠を貸借している。
                      - paragraph [ref=e1086]: (その他事業)
                      - paragraph [ref=e1087]: 福祉商事(株)が保険代理等のサービスの提供を行っており、当社グループ各社はこれらのサービスを受けている。
