                      - paragraph [ref=e1019]:
                        - text: 当社グループ(当社及び当社の関係会社)は、当社(田辺工業株式会社)及び連結子会社4社により構成されております。当社グループは、日本国内において設備工事事業(産業プラント設備工事、設備保全工事、電気計装工事、メカトロニクス、送電工事、管工事)を主体とした事業と、その他(鋳造用工業炉の製造・販売)の事業を営んでおります。また、海外においてはシンガポール、マレーシアを中心に設備工事事業と、タイ国内では表面処理事業及び設備工事事業を営んでおります。なお、中国において産業機械装置の販売、メンテナンス、機材の輸出入を行っていた田工実業(上海)有限公司は当連結会計年度において清算結了により連結の範囲から除外しております。
                        - text: 当社グループの事業内容及び当社と関係会社との当該事業に係る位置付けは、次のとおりであります。
