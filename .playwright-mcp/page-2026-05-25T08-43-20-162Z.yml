                      - paragraph [ref=e853]: 当社グループは、当社、親会社1社、子会社6社及び関連会社1社で構成され、設備工事業を主な事業の内容としている。
                      - paragraph [ref=e854]: 当社グループの事業に係る位置付け及び事業内容は次のとおりである。
                      - paragraph [ref=e855]
                      - heading "〔設備工事業〕" [level=4] [ref=e856]
                      - heading "・当社は電気工事、電気通信工事、管工事、水道施設工事、消防施設工事、土木工事を請負施工している。なお、配電設備等の電力供給設備に係わる電気工事は、当社の親会社である北陸電力(株)を中心とする北陸電力グループから請負施工している。" [level=5] [ref=e857]
                      - paragraph [ref=e858]: ・(株)スカルトは電力供給設備に係わる電気工事以外の電気工事を請負施工している。
                      - paragraph [ref=e859]: ・(株)蒲原設備工業及び(株)日建は管工事を請負施工している。
