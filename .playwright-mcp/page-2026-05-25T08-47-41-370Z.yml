                      - heading "3【事業の内容】" [level=3] [ref=e968]
                      - paragraph [ref=e969]: 当社グループは、当社、連結子会社4社、持分法適用関連会社1社により構成されています。
                      - paragraph [ref=e970]: 主要な事業内容は以下のとおりです。
                      - paragraph [ref=e971]
                      - paragraph [ref=e972]: (チーズ)
                      - paragraph [ref=e973]: 主要な製品はチーズであります。
                      - paragraph [ref=e974]: 大部分を当社が製造販売しており、一部は関連当事者であるデイリー・プロダクツ・ソリューション(株)を含む外部の加工業者に製造を委託し当社が販売しております。
                      - paragraph [ref=e975]
                      - paragraph [ref=e976]: (ナッツ)
                      - paragraph [ref=e977]: 主要な製品はナッツ・豆菓子であります。
                      - paragraph [ref=e978]: 大部分を連結子会社である(株)ミツヤグループ本社、(株)ミツヤ及び(株)千成堂が製造販売しており、一部を当社が販売しております。
                      - paragraph [ref=e979]
                      - paragraph [ref=e980]: (その他)
                      - paragraph [ref=e981]: 「チーズ」及び「ナッツ」に含まれない食品の販売等を主な事業としております。
                      - paragraph [ref=e982]
                      - paragraph [ref=e983]: なお、次の2部門は「第5 経理の状況 1 連結財務諸表等 (1)連結財務諸表 注記事項」に掲げるセグメントの区分と同一です。
                      - paragraph [ref=e984]: また、当連結会計年度より報告セグメントの区分を変更しています。詳細は、「第5 経理の状況 1 連結財務諸表等 (1)連結財務諸表 注記事項(セグメント情報等)」に記載のとおりです。
