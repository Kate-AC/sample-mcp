                      - heading "3【事業の内容】" [level=3] [ref=e1069]
                      - paragraph [ref=e1070]: 当社グループは、当社(提出会社であるアプライド(株))及び子会社2社((株)ハウズ・(株)シティ情報ふくおか)で構成されており、パソコン・ワークステーションの製造・販売・サポートを主な内容とし、化粧品・雑貨の販売及び出版・広告事業を展開しております。
                      - paragraph [ref=e1071]: なお、次の7営業部及び2子会社によるグループ管理体制のもと、3事業を推進しております。当該3事業は「第5 経理の状況 1 連結財務諸表等 (1)連結財務諸表 注記事項」に掲げるセグメントの区分と同一であります。
                      - paragraph [ref=e1072]
                      - paragraph [ref=e1073]: (1)パソコン・ゲーム事業
                      - paragraph [ref=e1074]: 1店舗営業部
                      - paragraph [ref=e1075]: 店舗営業部(当社)では、直営のパソコン専門店「アプライド」を、九州・中四国・関西・北陸・東海地区において26拠点展開し、店舗販売を推進しております。
                      - paragraph [ref=e1076]
                      - paragraph [ref=e1077]: 2店舗システム営業部
                      - paragraph [ref=e1078]: 店舗システム営業部(当社)では、直営のパソコン専門店「アプライド」を、九州・中四国・関西・北陸・東海地区において26拠点展開し、店舗におけるソリューション営業とサポート提供を推進しております。
                      - paragraph [ref=e1079]
                      - paragraph [ref=e1080]: 3SI営業部
                      - paragraph [ref=e1081]: SI(システムインテグレーション)営業部(当社)では、九州・中四国・関西・北陸・東海・関東・東北地区において25拠点展開し、大学・官公庁・研究機関向けのHPC(ハイパフォーマンスコンピューティング)製品の受注販売を推進しております。
                      - paragraph [ref=e1082]
                      - paragraph [ref=e1083]: 4特機営業部
                      - paragraph [ref=e1084]: 特機営業部(当社)では、九州・関西・東海・関東地区において4拠点展開し、国内向けの流通販売を推進しております。
                      - paragraph [ref=e1085]
                      - paragraph [ref=e1086]: 5広域システム営業部
                      - paragraph [ref=e1087]: 広域システム営業部(当社)では、ビジネス・ラボ内の広域営業本部を中心に、九州・関西・東海・関東地区において4拠点展開し、産業用コンピューターの受注販売を推進しております。
                      - paragraph [ref=e1088]
                      - paragraph [ref=e1089]: 6通販営業部
                      - paragraph [ref=e1090]: 通販営業部(当社)では、九州・東海地区において2拠点展開し、通信販売を推進しております。
                      - paragraph [ref=e1091]
                      - paragraph [ref=e1092]: (2)化粧品・雑貨事業
                      - paragraph [ref=e1093]: 1特販営業部
                      - paragraph [ref=e1094]: 特販営業部(当社)では、九州地区において1拠点展開し、海外向けの輸出販売、国内向けの流通販売、通信販売を推進しております。
                      - paragraph [ref=e1095]
                      - paragraph [ref=e1096]: 2(株)ハウズ
                      - paragraph [ref=e1097]: (株)ハウズ(子会社)では、直営の化粧品・雑貨専門店「ハウズ」を、九州・東海地区において5拠点展開し、店舗販売を推進しております。
                      - paragraph [ref=e1098]
                      - paragraph [ref=e1099]: (3)出版・広告事業
                      - paragraph [ref=e1100]: (株)シティ情報ふくおか
                      - paragraph [ref=e1101]: (株)シティ情報ふくおか(子会社)では、九州地区において1拠点を展開し、タウン情報誌・企画本等の出版、コンテンツ情報サービス「Fukuokaナビ」の運営、法人及び地方自治体向けの広告代理店事業を推進しております。
                      - paragraph [ref=e1102]
                      - paragraph [ref=e1103]: "[事業系統図]"
                      - paragraph [ref=e1104]: 以上述べた事項を事業系統図に示すと次のとおりであります。
