                      - heading "3【事業の内容】" [level=3] [ref=e870]
                      - paragraph [ref=e871]: 当社グループは、クロスプラス株式会社(当社)及び連結子会社5社で構成されており、衣料品及びライフスタイル商品の企画・製造・販売を主な事業としているほか、店舗・ECでの小売販売を行っております。
                      - paragraph [ref=e872]: クロスプラス株式会社は、婦人衣料の製造卸売を主力に、専門店、量販店、無店舗等へ販売を行っております。その他にライフスタイル商品の製造卸売を拡大しており、専門店、量販店に加えて、ドラッグストア、ホームセンター、コンビニ等への販売を行っております。また、小売については、直営店舗での衣料・雑貨販売とECサイトでの衣料・雑貨・ライフスタイル商品の販売を行っております。
                      - paragraph [ref=e873]: 株式会社サードオフィスは専門店へのメンズ衣料品を主力とした製造卸売販売を行っております。株式会社アイエスリンクはバラエティショップやドラッグストア等への化粧品の製造卸売販売を行っております。株式会社スタイルプラスは専門店へのアパレル製品の企画、製造並びにそれらに関する指導及びコンサルティングを行っております。客楽思普勒斯(上海)服飾整理有限公司は中国での当社製品の検品・検針・物流加工を行っております。その他事業として株式会社ディスカバリープラスは児童発達支援サービスを行っております。
