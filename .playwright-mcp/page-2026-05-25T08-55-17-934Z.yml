                      - paragraph [ref=e1072]: 当社グループ(当社及び当社の関係会社)は、当社(株式会社ケー・エフ・シー)及び子会社2社により構成されており、主な事業内容は、建設資材の販売・設計・施工及び遮水シート、防水シートの輸入販売・設計・施工等を行っております。
                      - paragraph [ref=e1073]
                      - paragraph [ref=e1074]: 当社グループの事業内容及び当社と関係会社との当該事業に係る位置付けは次のとおりであります。
                      - paragraph [ref=e1075]: なお、次の3事業は「第5 経理の状況 1 連結財務諸表等 (1)連結財務諸表 注記事項」に掲げるセグメントの区分と同一であります。
                      - paragraph [ref=e1076]
                      - paragraph [ref=e1077]: (1)ファスナー事業
                      - paragraph [ref=e1078]: 当社は、主に「あと施工アンカー」に係る建設資材の販売及び耐震関連工事を行っております。
                      - paragraph [ref=e1079]
                      - paragraph [ref=e1080]: (2)土木資材事業
                      - paragraph [ref=e1081]: 当社は、主にトンネル掘削資材の販売を行っているほか、唐山日翔建材科技有限公司ではトンネル支保材の製造・販売を行っております。
                      - paragraph [ref=e1082]
                      - paragraph [ref=e1083]: (3)建設事業
                      - paragraph [ref=e1084]: 当社及びアールシーアイ株式会社は、主にトンネル内装・リニューアル工事を行っております。
