                    - generic [ref=e1010]:
                      - paragraph [ref=e1011]
                      - heading "3 【事業の内容】" [level=3] [ref=e1012]
                      - paragraph [ref=e1013]: 当社グループは、当社、子会社15社、関連会社1社により構成され、アンカー、ドリル、ファスナー等の製造・販売及び耐震補強事業、各種維持・保全事業、太陽光関連事業等を担う「ファスニング事業」、FRPシート関連及び各種測定器、電動油圧工具等の製造・販売、電子プリント基板の製造・販売、並びに包装・物流関連機器の製造・輸入・販売を担う「機能材事業」を主な事業として取り組んでおります。
                      - paragraph [ref=e1014]: 当社グループの事業内容及び当社と関係会社の当該事業に係る位置付け及びセグメントとの関連は、次のとおりであります。なお、以下に示す区分はセグメントの区分と同一であります。
                      - paragraph [ref=e1015]: また、当連結会計年度より、報告セグメントの区分を変更しております。詳細は、「第5 経理の状況 1 連結財務諸表等 (1)連結財務諸表 注記事項(セグメント情報等)」をご参照ください。
                      - paragraph [ref=e1016]
                      - paragraph [ref=e1017]: (1) ファスニング事業
                      - paragraph [ref=e1018]: あと施工アンカーを中心とするドリル、ファスナー等の建設資材の企画開発・原材料調達から製造・販売・施工ツールに至る一貫した価値を創造し、顧客に提供しております。また、耐震補強事業、各種維持・保全事業、太陽光関連事業の工事関連の施工管理のほか、電動油圧工具関連事業を行っております。
                      - paragraph [ref=e1019]: 1 あと施工アンカー
                      - paragraph [ref=e1020]: あと施工アンカーとは、コンクリートに何かを取り付ける(又は固定する)ときに使用される、言わばコンクリート用のねじや釘のようなものであります。コンクリートが固まった後にドリルで孔をあけ、あとからモノを固定するので「あと施工アンカー」と呼ばれます。あと施工アンカーは、その性質により金属系アンカーと接着系アンカー、その他(プラスチック系等)のアンカーに分類されます。その用途は、高層ビルや工場等の建築物から、ダム・橋梁・高速道路といった土木構造物、さらには内外装の取付けから照明器具の取付けに至るまで幅広く多岐にわたります。
                      - paragraph [ref=e1021]: 2 ドリル
                      - paragraph [ref=e1022]: アンカーの用途に応じて締結機能を最大限に引き出すための各種ドリルを製造するとともに、配管等を通すために大きな孔を開ける大口径ドリルを取り扱っております。
                      - paragraph [ref=e1023]: 3 ファスナー
                      - paragraph [ref=e1024]: 壁や屋根を取り付ける際のドリルねじ(留め具)を、当社では「軽量物ファスナー」と総称しております。建物の美観を保つ上で欠かせないファスナー自体の品質と、作業効率を追求した製品を取り扱っております。
                      - paragraph [ref=e1025]: 4 耐震補強事業
                      - paragraph [ref=e1026]: あと施工アンカーをはじめとする締結技術を応用して、各種構造物の耐震補強工法等に活用しております。当社では、材料や施工工具の選定・施工方法等のアドバイスと、製商品の供給から施工管理まで、幅広いサービスを有資格者が提供しております。
                      - paragraph [ref=e1027]: 5 太陽光関連事業
                      - paragraph [ref=e1028]: ソーラーパネルを設置する際に、あと施工アンカーをはじめとする締結技術を応用し、架台をコンクリート陸屋根や地盤に安全に留め付ける工法を開発しました。当社では、施工指導とともに施工管理をしております。
                      - paragraph [ref=e1029]: 6 電動油圧工具関連事業
                      - paragraph [ref=e1030]: 株式会社IKK(連結子会社)において、鉄筋カッターやベンダー等の製造・販売を行っております。
                      - paragraph [ref=e1031]
                      - paragraph [ref=e1032]: (2) 機能材事業
                      - paragraph [ref=e1033]: 紫外線を照射して硬化する繊維強化プラスチック(FRP :Fiber-Reinforced Plastics) 製のシート関連の製造・販売、アルコール検知器等の製造・販売及び車両の表示板や観測機、コンピューター周辺機器・通信機器向けの電子プリント基板関連の製造・販売、並びに包装・物流関連機器の製造・輸入・販売を行っております。電子プリント基板関連は、株式会社スイコー(同)、浦和電研株式会社(同)、株式会社光洋(同)及びアキヤ電気株式会社(同)において、設計からマウントまでの一貫した製造・販売を行っております。包装・物流関連機器は、成光産業株式会社(同)において、主にプラスチック成形機及び包装機の輸入・販売を行っております。
                      - paragraph [ref=e1034]
                      - paragraph [ref=e1035]: ※報告セグメント対象外
                      - paragraph [ref=e1036]: 株式会社イーオプティマイズ(非連結子会社)
                      - paragraph [ref=e1037]: 販売促進ツールの制作や、IT関連のシステム販売を行っております。
                      - paragraph [ref=e1038]: 日光精機株式会社(非連結子会社)
                      - paragraph [ref=e1039]: 精密マイクロモーターシャフトや、精密極小ピンの製造・販売を行っております。
