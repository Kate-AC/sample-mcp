                      - paragraph [ref=e846]
                      - heading "3 【事業の内容】" [level=3] [ref=e847]
                      - paragraph [ref=e848]: 当社グループは、株式会社マツオカコーポレーション(当社)、連結子会社21社の他、持分法適用関連会社1社で構成されており、アパレル製品の企画、製造及び物流等を主な内容とした事業活動を行っております。
                      - paragraph [ref=e849]: なお、当社グループはアパレルOEM事業の単一セグメントであります。
                      - paragraph [ref=e850]
                      - paragraph [ref=e851]: (1)当社グループの事業領域
                      - paragraph [ref=e852]: 1 商品企画
                      - paragraph [ref=e853]: 商品企画から製造販売まで一貫して自社で行うSPA及びアパレルメーカー等の顧客のニーズに対して、当社グループの商品企画力や縫製技術を活かしたサンプル品の提案を行い、顧客からの受注に繋げます。
                      - paragraph [ref=e854]: 生産を行う工場は、納期、縫製難易度及び生産能力等に応じて決定いたします。
                      - paragraph [ref=e855]: 2 生地調達・生地生産
                      - paragraph [ref=e856]: 縫製加工に必要な生地を外部から調達します。
                      - paragraph [ref=e857]: なお、インナーウェアについては、原糸を外部から調達し、東レグループとの合弁子会社TM Textiles & Garments Ltd.(バングラデシュ)にて生地生産を行っております。
                      - paragraph [ref=e858]: 3 縫製加工
                      - paragraph [ref=e859]: 縫製加工については、中国、ベトナム、バングラデシュ、インドネシア、ミャンマーにて行っており、検反、裁断、縫製、洗い及び仕上げの工程を経て最終製品を生産しております。
                      - paragraph [ref=e860]: また、自社工場の生産能力を超える受注を受けた場合は、品質管理が十分可能な外注工場を利用することがあります。
                      - paragraph [ref=e861]: 4 販売
                      - paragraph [ref=e862]: 各工場にて、縫製加工品の梱包後、最適物流手段、最適ルート及び最適スピードにより、顧客に販売を行います。
                      - paragraph [ref=e863]
                      - paragraph [ref=e865]: （画像は省略されました）
