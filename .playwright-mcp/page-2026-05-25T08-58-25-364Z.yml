                      - paragraph [ref=e913]
                      - paragraph [ref=e914]: 生地加工
                      - paragraph [ref=e915]: 当社グループの生地加工事業は、主として高機能なアウトドアウェアやスポーツウェア等に利用される透湿防水生地の生産を行う事業です。
                      - paragraph [ref=e916]: 外部繊維素材メーカーから調達した生地に、自社生産した透湿防水フィルムを張り合わせること(ラミネート加工)で、高い防水機能と蒸れを抑える透湿機能を両立させ、付加価値を高める加工を行っています。各種素材分野への汎用性もあることから、アパレル製品のみならず、医療用品等にも利用されています。
                      - paragraph [ref=e917]: 素材開発においては、顧客である国内外のアウトドアウェアメーカーやアパレルメーカーと連携し、共同で消費者が求める高品質な素材の開発を進めております。また近年は、環境負荷低減の観点から、化学品使用に関する世界各国の環境規制を遵守した素材開発及び生産手法の研究を進め、製品の優位性を高めるとともに顧客信頼度の向上を図っています。
                      - paragraph [ref=e918]
