                      - paragraph [ref=e1053]: 当社の企業集団は、当社、子会社4社、関連会社3社および関連当事者(主要株主)2社で構成され、天然油脂を原料ベースとした食用油脂、工業用油脂、各種脂肪酸、化成品、環境関連製品等の製造ならびに販売を主な事業内容とし、さらに、各事業に関する物流およびこれらに附帯するサービス業務等の事業活動を展開しております。
                      - paragraph [ref=e1054]: 当社グループの事業に係る位置付けおよびセグメントとの関連は次のとおりであります。
