                      - heading "3【事業の内容】" [level=3] [ref=e1079]
                      - paragraph [ref=e1080]: 当社グループは当連結会計年度より、株式会社SKIYAKIとの経営統合を機に事業ポートフォリオの再構築を行い、報告セグメントを従来の「メディア」、「ライブ・コンテンツ」及び「ソリューション」の3区分から「コンテンツ」及び「ソリューション」の2区分に変更しております。このため、前連結会計年度のセグメント情報についても、変更後の報告セグメントの区分に基づき作成したものを開示しております。
                      - paragraph [ref=e1081]: 「コンテンツ」セグメントにつきましては、株式会社スペースシャワーネットワーク及びインフィニア株式会社、「ソリューション」セグメントにつきましては、株式会社SKIYAKI、コネクトプラス株式会社(2025年4月1日付で株式会社SKIYAKIへ吸収合併)、株式会社スペースシャワーネットワーク(2025年4月1日付けで、アライアンス事業を分割し、株式会社セップが承継)、株式会社SPACE SHOWER FUGA及び株式会社セップ(2025年4月1日、株式会社スペースシャワーネットワークのアライアンス事業を吸収分割、同日付でスペースシャワーエンタテインメントプロデューシング株式会社へ商号変更)が主に担当しております。
                      - paragraph [ref=e1082]: なお、当社は、株式会社SKIYAKIとの経営統合を目的として、2024年4月1日付で当社を株式交換完全親会社、プラットフォーム事業を営む株式会社SKIYAKIを株式交換完全子会社とする株式交換を行い、商号をスペースシャワーSKIYAKIホールディングス株式会社に変更し、同日付の吸収分割により株式会社スペースシャワーネットワーク分割準備会社に事業の一部を承継させ、持株会社体制に移行しております。また、株式会社スペースシャワーネットワーク分割準備会社は商号を株式会社スペースシャワーネットワークに変更しております。
                      - paragraph [ref=e1083]: また、当社は、有価証券の取引等の規制に関する内閣府令第49条第2項に規定する特定上場会社等に該当しており、これにより、インサイダー取引規制の重要事実の軽微基準については連結ベースの数値に基づいて判断することとなります。
