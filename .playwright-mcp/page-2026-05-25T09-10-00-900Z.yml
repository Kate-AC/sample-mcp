                    - generic [ref=e1103]:
                      - heading "3 【事業の内容】" [level=3] [ref=e1104]
                      - paragraph [ref=e1105]: 当社グループは純粋持株会社制を導入しており、当社及び連結子会社11社(株式会社エコネコル、株式会社NEWSCON、株式会社サイテラス、株式会社アストコ、株式会社ブライトイノベーション、株式会社VOLTA、日東化工株式会社、他4社)、持分法適用関連会社2社(株式会社アビヅ、株式会社富士エコサイクル)、非連結子会社1社、持分法非適用関連会社1社で構成され、「資源循環事業」「グローバルトレーディング事業」「リチウムイオン電池リサイクル事業」などの事業を展開しております。
                      - paragraph [ref=e1106]: なお、2025年7月1日付で当社の連結子会社である株式会社エコネコルが株式会社Genauを吸収合併しております。
                      - paragraph [ref=e1107]: 資源循環事業においては、工場や解体物件等から排出される金属スクラップ及び産業廃棄物(一部、一般廃棄物を含む。以下、「廃棄物」という。) を主要な取扱い対象としており、これらの廃棄物を収集運搬し、中間処理工場にて、せん断・溶断、手解体、破砕・選別、圧縮・固形を行い、鉄スクラップ、非鉄金属(銅、アルミニウム、ステンレス等)、プラスチック、ゴム等のリサイクル資源等を生産し、グローバルトレーディング事業を含めた国内外に販売しております。
                      - paragraph [ref=e1108]: グローバルトレーディング事業においては、当社グループにおいて生産したリサイクル資源等並びに同業者等から仕入れたリサイクル資源を全国に保有する集荷拠点に集荷し、国内外への販売を行っております。また、リサイクル資源の輸入及び三国間貿易にも取り組んでおります。加えて、輸出入業者を対象とした輸出入に係る物流代行サービスの提供も行っております。海外拠点は、金属スクラップ等の販売において、ベトナムに駐在所、英国とオランダに支店を有しております。
                      - paragraph [ref=e1109]: リチウムイオン電池リサイクル事業においては、電池工場等から排出される工程廃材や使用済みの電池を主な取扱い対象としており、これらを乾燥・破砕・選別することでコバルト、ニッケル及びリチウム等のレアメタルが含有されたブラックマスを生産し販売をしております。
                      - paragraph [ref=e1110]: この3つの事業区分以外に、大手企業の環境経営やESG投資対応をアドバイスする「環境経営コンサルティング事業」、就職を希望する障がいのある方に対して就職に向けた技能、知識の習得や、適切な仕事の提供を行う「障がい福祉サービス事業」を展開しております。
                      - paragraph [ref=e1111]: 以下に示す区分は、セグメントと同一の区分であります。
                      - paragraph [ref=e1112]
