                      - heading "3【事業の内容】" [level=3] [ref=e1064]
                      - paragraph [ref=e1065]: 当社グループは、当社(株式会社CKサンエツ)、子会社14社により構成されており、伸銅・精密部品・配管・鍍金及びこれらに付帯する事業を行っております。
                      - paragraph [ref=e1066]: 伸銅事業では、黄銅の棒と線とめっき線を生産しています。これらの伸銅品は、自動車や家電製品や水栓金具等の素材として、広範に使用されています。鉛やカドミウムなどの環境負荷物質を使用しない環境対応合金を実用化し、多数の特許を取得しています。生産拠点は、サンエツ金属株式会社の砺波工場、高岡事業所及び新日東工場、日本伸銅株式会社の堺工場並びに三谷伸銅株式会社の本社工場です。
                      - paragraph [ref=e1067]: 精密部品事業では、黄銅製のカメラマウント(デジタル一眼レフカメラの本体とレンズの着脱部品)やシンクロリング(自動車のマニュアルトランスミッションに使用されるシンクロナイザーリングの部品)や水栓金具等の鍛造加工や切削加工を行っています。生産拠点は、富山県砺波市にあるサンエツ金属株式会社のプレシジョン工場です。
                      - paragraph [ref=e1068]: 配管・鍍金事業では、水道やガスの配管に使用される継手の生産を行っています。ダイオキシンなどの環境負荷物質の発生する恐れがある塩化ビニールを一切使用しない脱塩ビ継手を実用化するなど、新製品の開発に注力し、多数の特許を取得しています。施工性に優れた透明被覆継手は、グッドデザイン賞を受賞しました。生産拠点は、富山県高岡市にある株式会社リケンCKJVです。また、鋼材の防錆処理として、鉛やカドミウムなどの環境負荷物質を一切使用しない環境対応鍍金を実用化し、「CKeめっきスーパー」のブランドで生産しています。「CKeめっきスーパー」は、NETIS(国土交通省新技術情報提供システム)に登録された特許技術です。生産拠点は、富山県高岡市にあるシーケー金属株式会社です。
                      - paragraph [ref=e1069]: なお、当社は、有価証券の取引等の規制に関する内閣府令第49条第2項に規定する特定上場会社等に該当しており、これにより、インサイダー取引規制の重要事実の軽微基準については連結ベースの数値に基づいて判断することとなります。
                      - paragraph [ref=e1070]: 事業内容と当社及びグループの当該事業にかかる位置付けは次のとおりであります。
