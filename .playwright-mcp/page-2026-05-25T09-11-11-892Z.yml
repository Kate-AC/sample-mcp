                      - paragraph [ref=e1126]
                      - paragraph [ref=e1127]: ・当社及び連結子会社であるアスレ電器(株)、O&S CALIFORNIA,INC.、CZECH REPUBLIC ONAMBA S.R.O.、欧南芭(上海)貿易有限公司及び鈞星精密部件有限公司は、専ら製品の加工を国内子会社、海外子会社に委託し、仕入れた製品を得意先に販売しております。
