                      - paragraph [ref=e1083]: 2 建材製商品の仕入れ販売を主な事業とするPT. Okabe Hardware Indonesiaは、非建設関連製品事業としてテナント賃貸を行っておりましたが、店舗の閉鎖に伴いその他の事業に属するテナント賃貸事業の廃止を決定し、当該事業の整理を進めております。
