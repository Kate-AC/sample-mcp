                      - heading "3【事業の内容】" [level=3] [ref=e1049]
                      - paragraph [ref=e1050]: 当社グループ(当社及び当社の関係会社)は、当社、子会社11社(内10社を連結)及び関連会社4社で構成されており、建設資機材の製造販売事業を主な事業とし、さらにその他の事業分野の開拓にも注力しております。
                      - paragraph [ref=e1051]: 当社及び主要な関係会社のグループにおける位置づけ及び各事業との関連は次のとおりとなります。
                      - paragraph [ref=e1052]
                      - paragraph [ref=e1053]: 〔建設関連製品事業〕
                      - paragraph [ref=e1054]: (仮設・型枠製品)
                      - paragraph [ref=e1055]: 当社が関連工法の開発及び関連製品の開発、製造、販売を行っております。OMM(株)は製造子会社であり当社より仮設・型枠製品の製造を受託しております。福岡フォームタイ(株)は仮設・型枠製品を主に当社より仕入れ九州地区において販売しております。
                      - paragraph [ref=e1056]
                      - paragraph [ref=e1057]: (土木製商品)
                      - paragraph [ref=e1058]: 当社が関連工法の開発及び関連製品の開発、製造、販売を行っております。また、他社商品を仕入れ販売しております。
                      - paragraph [ref=e1059]
                      - paragraph [ref=e1060]: (構造機材製商品)
                      - paragraph [ref=e1061]: 当社が関連工法の開発及び関連製品の開発、製造、販売を行っております。また、他社商品を仕入れ販売しております。(株)富士ボルト製作所は構造機材製品の開発、製造、販売を行っており、当社は同社製品を仕入れ販売しております。インドネシア現地法人でありますPT. フジボルトインドネシアは(株)富士ボルト製作所の製造子会社として構造機材製品の製造を行っており、(株)富士ボルト製作所は国内で同社製品を仕入れ、加工、販売しております。
                      - paragraph [ref=e1062]
                      - paragraph [ref=e1063]: (建材商品)
                      - paragraph [ref=e1064]: 当社の販売網を利用し他社建材商品を仕入れ販売しております。
                      - paragraph [ref=e1065]
                      - paragraph [ref=e1066]: (建材製商品(海外))
                      - paragraph [ref=e1067]: <米国>
                      - paragraph [ref=e1068]: OCM, Inc.は当社が国内で取り扱う商品及び現地工法に適合した商品を米国内外から仕入れ、主に米国において販売しております。OCM Manufacturing LLCはOCM, Inc.の製造子会社であります。Okabe Real Estate Holdings LLCは当該建材製品の製造事業を営む上で必要となる事業用不動産の管理を行っております。
                      - paragraph [ref=e1069]: <インドネシア>
                      - paragraph [ref=e1070]: PT. Okabe Hardware Indonesiaは他社建材商品を仕入れ、主に建築現場向けに販売しております。PT. Okabe Retail Indonesiaは他社建材商品を仕入れ、店舗販売しておりましたが、2025年10月6日開催の当社取締役会決議に基づき、2025年12月21日をもって店舗を閉鎖し、当該事業を廃止いたしました。PT. フジボルトインドネシアは主にインドネシア国内において建材製商品の製造、販売を行っております。
                      - paragraph [ref=e1071]
                      - paragraph [ref=e1072]: 〔その他の事業〕
                      - paragraph [ref=e1073]: (株)河原は産業機械製品の製造、販売等を行っております。
                      - paragraph [ref=e1074]: 当社が海洋事業として、海洋資材製品の開発、製造、販売を行っております。
                      - paragraph [ref=e1075]: 米国現地法人でありますオカベCO., INC.は主に米国内の自動車向けボルト・ナット類の企画、販売を行っております。
                      - paragraph [ref=e1076]: 建材製商品の仕入れ販売を主な事業とするPT. Okabe Hardware Indonesiaが、非建設関連製品事業としてテナント賃貸を行っておりましたが、店舗の閉鎖に伴いテナント賃貸事業の廃止を決定し、当該事業の整理を進めております。
