                      - paragraph [ref=e1080]
                      - heading "3 【事業の内容】" [level=3] [ref=e1081]
                      - paragraph [ref=e1082]: 当社グループは、当社及び子会社27社で構成され、遊戯機械部門、舞台装置部門、昇降機部門の製造・施工・販売を主な内容とし、さらに当社納入製品の保守サービス・改修工事を行っております。また、遊園地などにおける遊戯施設営業も行っております。
                      - paragraph [ref=e1083]: 当社グループの事業における位置づけ及びセグメントとの関連は、次の通りであります。
                      - paragraph [ref=e1084]
                      - paragraph [ref=e1085]: (1) 当社グループの事業に係わる位置づけ
                      - paragraph [ref=e1086]: (イ)遊戯機械
                      - paragraph [ref=e1087]: ジェットコースター・急流すべり・タワーなどの製造施工販売を当社及びSansei Technologies Inc.を持株会社とするS&S Worldwide, Inc.、Vekoma Rides B.V.及びその子会社が行っており、テーマパーク等向けコンセプト提案・デザイン提供をLaird Holdings Inc.を持株会社とするFORREC Ltd.とその子会社が行っております。
                      - paragraph [ref=e1088]: (ロ)舞台設備
                      - paragraph [ref=e1089]: 劇場・文化ホールなどの舞台機構・吊物装置、テレビ・イベント・コンサート会場における電飾や機械装置などの舞台設備装置の製造施工販売を当社及び(株)テルミックが行っております。
                      - paragraph [ref=e1090]: (ハ)昇降機
                      - paragraph [ref=e1091]: エレベーター・エスカレーター・パーキング装置などの昇降機械装置の製造施工販売を当社が行っております。
                      - paragraph [ref=e1092]
                      - paragraph [ref=e1093]: 上記3部門における当社納入製品の保守及び改修工事などの業務を(株)サンセイメンテナンス及びサンセイメンテナンス(株)が行っております。なお、サンセイメンテナンス(株)が国内関東以北地域、(株)サンセイメンテナンスが国内中部以西地域をそれぞれ担当しております。
                      - paragraph [ref=e1094]: (ニ)その他
                      - paragraph [ref=e1095]: 国内における遊園地で、レジャー・サービスの提供・運営管理を(株)サンエースが行っております。また、当社が所有する駐車場などの管理をサンセイファシリティーズ(株)が行っております。
                      - paragraph [ref=e1096]
                      - paragraph [ref=e1097]: (2) 事業の系統図
