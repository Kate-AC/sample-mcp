                      - heading "3【事業の内容】" [level=3] [ref=e1169]
                      - paragraph [ref=e1170]: 当社の企業集団は、当社及び子会社12社で構成され、戸建住宅向けシステム、集合住宅向けシステム、医療・福祉施設向けシステム、オフィス・公共施設向けシステム等の電気通信機器の製造・販売を主な内容とし、さらに各事業に関連する据付工事、請負、修理等の事業活動を展開しております。
                      - paragraph [ref=e1171]: 当企業集団の各社の事業に係る位置づけは、次のとおりであります。
                      - paragraph [ref=e1172]: 当社が電気通信機器を製造・販売するほか、生産面ではタイのアイホンコミュニケーションズ(タイランド)とベトナムのアイホンコミュニケーションズ(ベトナム)が製品の生産を行っております。さらに、国内ではアイホンコミュニケーションズ株式会社が当社製品の生産と基板の加工を行っております。
                      - paragraph [ref=e1173]: また、販売面では北米につきましてはアイホンコーポレーションが、欧州につきましてはアイホンS.A.S.が、オセアニアにつきましてはアイホンPTYが、東南アジアにつきましてはアイホンPTE.が、イギリスにつきましてはアイホンUKがそれぞれ販売を行っております。
                      - paragraph [ref=e1174]: さらに、開発面では株式会社ソフトウェア札幌、株式会社テシオテクノロジ及び株式会社日本マイクロリンクがソフトウェア開発等を行っております。
                      - paragraph [ref=e1175]: なお、GEGA ELECTRONIQUEにつきましては、当社グループ全体の経営効率の向上を目的に2024年2月から解散手続きを開始しております。
