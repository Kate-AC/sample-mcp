                      - heading "3【事業の内容】" [level=3] [ref=e1061]
                      - paragraph [ref=e1062]: 当社グループ(当社及び当社の関係会社)は、当社、子会社11社及び関連会社1社で構成され、商事部門(食品・食材の卸売)を中核に、ホテル部門(ビジネスホテルの経営)及び不動産部門(不動産の賃貸)の3部門により事業活動を展開しており、子会社、関連会社の事業は主に当社の補完的な業務を行っております。
                      - paragraph [ref=e1063]: 当社グループが営んでいる主な事業内容と当社及び関係会社の当該事業における位置付けとセグメントとの関連は、次のとおりであります。
                      - paragraph [ref=e1064]: なお、次の3部門は「第5 経理の状況 1.連結財務諸表等 (1)連結財務諸表 注記事項」に掲げるセグメントの区分と同一であります。
                      - paragraph [ref=e1065]: 商事部門............当社が米の集荷及び販売をするほか、メーカーより小麦粉、澱粉、砂糖、油脂、飼料、畜産、加工食品、酒類その他を仕入れて販売し、ユアサフナショク・リカー(株)、ワイ・エフ石油(株)、(株)ニュー・ノザワ・フーズ、太陽商事(株)、東京太陽(株)、ワイケイフーズ(株)、関連会社日本畜産振興(株)が当社より仕入れて販売しております。
                      - paragraph [ref=e1066]: また、ユアサフナショク・リカー(株)より酒類を、(株)ニュー・ノザワ・フーズより米穀を、東京太陽(株)より飼料を、ワイケイフーズ(株)より加工食品を、日本畜産振興(株)より畜産を当社が仕入れて販売しております。
                      - paragraph [ref=e1067]: ホテル部門.........当社及びホテルサンライト(株)がホテル、レストラン等のサービス業を営んでおります。
                      - paragraph [ref=e1068]: 不動産部門.........主に当社が不動産賃貸業を営んでおり、一部子会社ワイ・エフ石油(株)ほか4社に対して事務所等を賃貸しております。
                      - paragraph [ref=e1069]: 子会社ワイ・エフ物流(株)については商事部門に関連する物流業務を委託し、子会社ワイ・エフ・エージェンシー(株)は損害保険代理業を営んでおり、当企業集団の保険契約の取り次ぎを行っております。
