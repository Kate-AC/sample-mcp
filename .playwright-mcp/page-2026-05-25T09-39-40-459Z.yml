                      - heading "3【事業の内容】" [level=3] [ref=e1132]
                      - paragraph [ref=e1133]: 当社グループ(当社及び当社の関係会社)は、当社、子会社16社及び関連会社3社により構成されており、水産物荷受事業、市場外水産物卸売事業、養殖事業、食品加工事業、物流事業、リース事業、水産物仲卸事業、水産物小売事業を主たる業務としております。
                      - paragraph [ref=e1134]: 当社グループの事業内容及び当社と関係会社の当該事業に係る位置付けは次のとおりであります。
                      - paragraph [ref=e1135]: なお、「第5 経理の状況 1 連結財務諸表等(1)連結財務諸表 注記事項」に掲げるセグメントの区分は、「水産物荷受事業」、「市場外水産物卸売事業」、「養殖事業」、「食品加工事業」、「物流事業」、「その他」であります。
                      - paragraph [ref=e1136]: また、当社は、有価証券の取引等の規制に関する内閣府令第49条第2項に規定する特定上場会社等に該当しており、これにより、インサイダー取引規制の重要事実の軽微基準については連結ベースの数値に基づいて判断することとなります。
                      - paragraph [ref=e1137]: 水産物荷受事業・・・・ 子会社(株)うおいちは、「卸売市場法」に基づき卸売市場において、水産物の販売を行っております。
                      - paragraph [ref=e1138]: 市場外水産物卸売事業・・子会社(株)ショクリューは、インドネシア、インド、オーストラリア等を主とした世界数十カ国より輸入される冷凍海老をはじめ、各種水産物を全国30数カ所の販売網(営業所等)を通じて、自社加工製品を含めて国内の市場、量販店、ホテル、外食産業等に販売しております。また、アジ、サワラ、サバ等の鮮魚については国内の市場に出荷販売しております。
                      - paragraph [ref=e1139]: 養殖事業・・・・・・・ 子会社(株)兵殖は、九州、四国近海漁場でブリ、マグロの養殖を行っております。
                      - paragraph [ref=e1140]: 上記以外に養殖事業を行う企業として、子会社1社が当社企業集団に属しております。
                      - paragraph [ref=e1141]: 食品加工事業・・・・・ 子会社ダイワサミット(株)は、量販店向けにおにぎり等の米飯加工を行っております。
                      - paragraph [ref=e1142]: 子会社(株)トウニチ水産は、刺身のケンを主体としたカット野菜の加工を行っております。
                      - paragraph [ref=e1143]: 子会社(株)ツナクラフトワークスは、冷凍マグロの加工を行っております。
                      - paragraph [ref=e1144]: 上記以外に食品加工事業を行う企業として、子会社2社が当社企業集団に属しております。
                      - paragraph [ref=e1145]: 物流事業・・・・・・・ 子会社舞洲流通センター(株)は、「大阪港舞洲食品流通センター」において、搬入された水産物等を量販店等の配送先別に仕分け・配送を行っております。
                      - paragraph [ref=e1146]: 上記以外に物流事業を行う企業として、子会社1社が当社企業集団に属しております。
                      - paragraph [ref=e1147]: リース事業・・・・・・ 子会社(株)トップは、保険代理業及びリース業を行っております。
                      - paragraph [ref=e1148]: 水産物仲卸事業・・・・ 子会社(株)大京及び子会社(株)タイゲンは、「卸売市場法」に基づき中央卸売市場にてせり等取引に参加し、水産物の販売を行っております。
                      - paragraph [ref=e1149]: 水産物小売事業・・・・ 子会社(株)黒門三平は、黒門市場(大阪市中央区)に店舗を構え、また、百貨店等に出店し、水産物の販売を行っております。
                      - paragraph [ref=e1150]: その他事業・・・・・・ その他水産物流通を補完する企業として、子会社1社、関連会社3社が当社企業集団に属しております。
                      - paragraph [ref=e1151]
                      - paragraph [ref=e1152]: (注)1.(株)ツナクラフトワークスの株式を、当連結会計年度において新たに取得したため、連結の範囲に含めております。
                      - paragraph [ref=e1153]: 2.食品加工事業に属しておりました関空トレーディング(株)、水産物仲卸事業に属しておりました(株)モトイについては、当連結会計年度において清算したため、連結の範囲から除外しております。
                      - paragraph [ref=e1154]: 事業の業務関連図及び業務系統図は次のとおりであります。
