                      - paragraph [ref=e1120]: 当企業グループは、当社及び子会社19社で構成され、その主な事業内容と、各社の当企業グループの事業に係る位置付け及び報告セグメントとの関連は、次のとおりであります。
                      - paragraph [ref=e1121]: なお、下記の事業区分は「第5 経理の状況 1 連結財務諸表等 (1)連結財務諸表 注記事項 (セグメント情報等)」に掲げるセグメントの関連情報「1 製品及びサービスごとの情報」として記載しているものと同一であります。
                      - paragraph [ref=e1122]
                      - paragraph [ref=e1123]: 当社は、機械部品の販売(動伝事業)、搬送設備等の自動化・省力化・環境対応化商品やその付帯サービスの販売(設備装置事業)、各種不織布及びその加工品や製造機械の販売(産業資材事業)を主な事業としております。一方、報告セグメントは、当企業グループの営業拠点所在地を中心とした販売エリアで区分しており、販売エリアを国内3エリア(地区)に区分し、東・西・中日本本部セグメントとして管理をしております。さらに、海外エリア全体については開発戦略事業と位置付け、産業資材事業及び新商品開発部門を加えた包括的な戦略事業として開発戦略本部セグメントとしております。
