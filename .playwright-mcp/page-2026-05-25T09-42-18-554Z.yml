                      - paragraph [ref=e1079]
                      - heading "3 【事業の内容】" [level=3] [ref=e1080]
                      - paragraph [ref=e1081]: 当社グループ(当社及び当社の関係会社)は、当社を中核として子会社8社で構成され、無機薬品、有機薬品及び合成樹脂を主要な取扱品目とする化学品専門商社の事業を行っております。
                      - paragraph [ref=e1082]
                      - paragraph [ref=e1083]: 当社グループ各社の事業に係わる位置づけは次のとおりであります。
                      - paragraph [ref=e1084]
                      - paragraph [ref=e1086]: （画像は省略されました）
                      - paragraph [ref=e1087]
                      - paragraph [ref=e1088]:
                        - text: 化学品事業は、主として無機薬品、有機薬品を化学、紙パルプ、食品・洗剤、官公庁などの様々な市場へ販売して
                        - text: おります。
                      - paragraph [ref=e1089]: 機能材事業は、主として合成樹脂、機器・材料を、食品、樹脂加工、電機などの様々な市場へ販売しております。
                      - paragraph [ref=e1090]: その他事業は、不動産の賃貸収入及び子会社のソーダニッカビジネスサポート(株)、曹達日化商貿(上海)有限公司、PT.SODA NIKKA INDONESIA、SODA NIKKA VIETNAM CO.,LTD.、(株)日本包装、モリス(株)、(株)日進、(有)野津善助商店からなっております。
                      - paragraph [ref=e1091]:
                        - text: ソーダニッカビジネスサポート(株)は、主として当社からの受託業務及び倉庫・運送業を営んでおります。
                        - text: 曹達日化商貿(上海)有限公司は、主として中国の国内市場における工業薬品類の販売を行っております。
                      - paragraph [ref=e1092]: PT.SODA NIKKA INDONESIAは、主としてインドネシアへの工業薬品類の販売を行っております。
                      - paragraph [ref=e1093]: (株)日本包装は、主として関西地区及び中国地区における包装資材の加工販売を行っております。
                      - paragraph [ref=e1094]: SODA NIKKA VIETNAM CO.,LTD.は、主としてベトナムへの工業薬品類の販売を行っております。
                      - paragraph [ref=e1095]: モリス(株)は、主としてベトナムからの商品輸入及びベトナムに進出する企業のコンサルティング業務を行っております。
                      - paragraph [ref=e1096]: (株)日進は、主として中部・関西・北陸地区における包装資材・機器等の販売を行っております。
                      - paragraph [ref=e1097]: (有)野津善助商店は、主として山陰地区における化学工業薬品や食品添加物等の販売を行っております。なお、2025年4月1日付で株式会社野津商店に商号変更いたしております。
