                      - heading "3 【事業の内容】" [level=3] [ref=e1072]
                      - paragraph [ref=e1073]: 当社グループは、当社、親会社、連結子会社9社、非連結子会社4社および関連会社2社で構成されており、物流事業、不動産事業、印刷事業およびその他の4部門に関する事業を行っております。当社グループの「セグメント」の事業内容と、主な関係会社との関連は次のとおりであります。
                      - paragraph [ref=e1074]: また、次の4部門は「第5 経理の状況1(1) 連結財務諸表 注記事項」に掲げるセグメントの区分と同一であります。
                      - paragraph [ref=e1075]
                      - heading "(物流事業)" [level=4] [ref=e1076]
                      - heading "倉庫部門" [level=5] [ref=e1077]
                      - paragraph [ref=e1078]: 当部門は主に、寄託を受けた貨物を倉庫に保管する業務、入出庫・荷捌きおよびこれに付帯する業務を行っております。
                      - paragraph [ref=e1079]: "[主な関係会社]当社"
                      - heading "港湾フォワーディング部門" [level=5] [ref=e1080]
                      - paragraph [ref=e1081]: 当部門は主に、海上・航空運送の輸送手続き、港湾・空港における貨物の積込み・積み下ろし・荷捌きおよびこれに付帯する業務を行っております。
                      - paragraph [ref=e1082]: "[主な関係会社]当社、(株)エアロ航空および浅上重機作業(株)"
                      - heading "運輸部門" [level=5] [ref=e1083]
                      - paragraph [ref=e1084]: 当部門は主に、貨物自動車による貨物の運送、利用運送および運送の取次等の業務を行っております。
                      - paragraph [ref=e1085]: "[主な関係会社]当社、港運輸工業(株)、ホワイト・トランスポート(株)およびアサガミ物流(株)"
                      - paragraph [ref=e1086]: ※当連結会計年度より管理区分を見直し、3PL(サードパーティーロジスティクス)部門につきましては、
                      - paragraph [ref=e1087]: 運輸部門に集約しております。
                      - paragraph [ref=e1088]
                      - heading "(不動産事業)" [level=4] [ref=e1089]
                      - paragraph [ref=e1090]: 当事業は主に、顧客の要望に合わせた大型物流施設・商業施設等を賃貸・管理する業務を行っております。
                      - paragraph [ref=e1091]: "[主な関係会社]当社"
                      - paragraph [ref=e1092]: ※当社は(株)オーエーコーポレーションより一部施設を賃借しております。
                      - paragraph [ref=e1093]
                      - heading "(印刷事業)" [level=4] [ref=e1094]
                      - paragraph [ref=e1095]: 当事業は主に、婚礼・年賀印刷等の一般印刷、新聞等の受託印刷、発送およびこれらに付帯する業務を行っております。
                      - paragraph [ref=e1096]: "[主な関係会社]アサガミプレスセンター(株)、アサガミプレスいばらき(株)およびマイプリント(株)"
                      - paragraph [ref=e1097]
                      - heading "(その他)" [level=4] [ref=e1098]
                      - paragraph [ref=e1099]: 当事業は主に、自動倉庫工事等の建築工事およびグループ内の業務請負事業等を行っております。
                      - paragraph [ref=e1100]: "[主な関係会社]当社およびアサガミ・キャリア・クリエイト(株)"
                      - paragraph [ref=e1101]
