                      - heading "3【事業の内容】" [level=3] [ref=e714]
                      - paragraph [ref=e715]: 当社は、2023年10月2日に単独株式移転により日総工産株式会社の完全親会社である持株会社として設立され、グループ会社の経営管理及びそれに付帯する業務を行っております。
                      - paragraph [ref=e716]: また、当社グループは、当連結会計年度末現在において、連結子会社7社及び持分法適用関連会社2社で構成されております。創業理念である「人を育て 人を活かす」に則り、ミッションを「働く機会と希望を創出する」とし、企業と人の成長を支援する人材ソリューションサービスで、働く人がやりがいを持ち、成長していける職場を作り上げていくとともに、社会変化や産業構造変化に対応できるサービスの提供を目指し、「高い成長力のある企業グループに変革する」ための取り組みを推進しております。
                      - paragraph [ref=e717]: 当社グループが提供するサービスについては、「総合人材サービス」と「介護・福祉サービス」の2つに大きく区分されます。
                      - paragraph [ref=e718]: なお、当社は、有価証券の取引等の規制に関する内閣府令第49条第2項に規定する特定上場会社等に該当しており、これにより、インサイダー取引規制の重要事実の軽微基準については連結ベースの数値に基づいて判断することになります。
                      - paragraph [ref=e719]
                      - paragraph [ref=e720]: サービス別の概要は以下のとおりであります。
                      - paragraph [ref=e721]: (総合人材サービス)
                      - paragraph [ref=e722]: 1 製造生産系人材サービス
                      - paragraph [ref=e723]: 製造生産系人材サービスは、主に製造派遣、製造請負に区分されます。
                      - paragraph [ref=e724]: 製造派遣は、「労働者派遣事業の適正な運営の確保及び派遣労働者の保護等に関する法律」(以下「労働者派遣法」という。)に従い事業を行っており、自動車製造、半導体製造、電子機器製造をはじめとしたメーカーに対し派遣サービスを提供しております。
                      - paragraph [ref=e725]: 製造請負は、自動車製造、半導体製造、電子機器製造をはじめとしたメーカーに対しサービスを提供しております。製造請負とは、請負会社(グループ各社)が、自ら指揮命令を行い、自社による生産、品質管理や労務管理及び職場運営体制を構築しなければならないことが特徴であり、発注者(メーカー)からの注文に対し、自社管理体制のもとで製造や加工、検査等を行い、完成品(成果)を納品しております。
                      - paragraph [ref=e726]
                      - paragraph [ref=e727]: 2 エンジニア系人材サービス
                      - paragraph [ref=e728]: エンジニア系人材サービスは、製造領域及びIT関連のエンジニア派遣、SESに区分されます。
                      - paragraph [ref=e729]: SESとは、「System Engineering Service」の略称で、IT業界における業務委託契約の一つであります。
                      - paragraph [ref=e730]
                      - paragraph [ref=e731]: 3 事務系人材サービス
                      - paragraph [ref=e732]: 事務系人材サービスは、一般事務派遣、BPO(Business Process Outsourcing)に区分されます。
                      - paragraph [ref=e733]: 一般事務派遣は、労働者派遣法に従い事業を行っており、主としてオフィス事務や受付業務などへの派遣サービス提供を行っております。
                      - paragraph [ref=e734]: また、企業運営上の業務やビジネスプロセスを、専門企業に外部委託するBPOを一部受託しております。
                      - paragraph [ref=e735]
                      - paragraph [ref=e736]: 4 その他の人材サービス
                      - paragraph [ref=e737]: その他の人材サービスは、高年齢者社員の人材派遣、障がい者による軽作業請負などに区分されます。
                      - paragraph [ref=e738]
                      - paragraph [ref=e739]: (介護・福祉サービス)
                      - paragraph [ref=e740]: 介護・福祉サービスは、施設介護、在宅介護に区分されます。
                      - paragraph [ref=e741]: 施設介護は、神奈川県横浜市にて、有料老人ホームを運営し、入居者に対する介護サービスの提供を行っております。
                      - paragraph [ref=e742]: 在宅介護は、介護ステーション(神奈川県横浜市、福島県いわき市)、通所介護施設(福島県いわき市)にて介護サービスの提供を行っております。
                      - paragraph [ref=e743]
                      - paragraph [ref=e744]: "[事業系統図]"
                      - paragraph [ref=e745]: 事業系統図は、次のとおりであります。
