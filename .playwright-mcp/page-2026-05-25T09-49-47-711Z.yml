                      - heading "3 【事業の内容】" [level=3] [ref=e1108]
                      - paragraph [ref=e1109]: 当社グループ(当社及び当社の関係会社)は、当社、その他の関係会社、子会社13社及び関連会社4社で構成され、物流事業、海運事業、不動産事業、その他事業の4部門に関係する事業を主として行っております。
                      - paragraph [ref=e1110]: 当社及び当社の関係会社の事業における当社及び関係会社の位置付け及びセグメントとの関連は、次のとおりであります。なお、以下に示す区分は、セグメントと同一の区分であります。
                      - paragraph [ref=e1111]
                      - heading "(物流事業)" [level=4] [ref=e1112]
                      - heading "当部門においては、港湾における輸出入貨物の受渡、揚げ積み、荷捌き保管等の荷役作業及び寄託された貨物の倉庫における入出庫、保管作業、税関に対する通関手続き並びに輸出入貨物の国際複合一貫輸送の取扱業務等のほか、一般貨物自動車、大型トレーラー車、バラセメント車等による貨物の運送及びコンテナ輸送、カーフェリー輸送並びに引越業務等、その他、得意先の工場構内における貨物の保管、移動、梱包及び搬出入業務等を行っております。" [level=4] [ref=e1113]
                      - paragraph [ref=e1114]
                      - heading "[主な関係会社]" [level=5] [ref=e1115]
                      - paragraph [ref=e1116]: 当社、太平洋セメント(株)、近畿港運(株)、アヅマ・ロジテック(株)、SIAM AZUMA MULTI-TRANS CO.,LTD.、原田荷役(株)、AZUMA TRANSPORT SERVICES (Thailand) CO.,LTD.、関東エアーカーゴ(株)、タンデム・ジャパン(株)、東華貨運代理 (青島) 有限公司、TANDEM SMART GLOBAL LOGISTICS B.V.
                      - paragraph [ref=e1117]
                      - heading "(海運事業)" [level=4] [ref=e1118]
                      - paragraph [ref=e1119]: 当部門においては、セメント専用船による太平洋セメント株式会社の製品輸送及び一般貨物船による石膏、石灰石、石炭灰等の内航輸送及び外航輸送や、旅客船の配乗業務等を行っております。
                      - paragraph [ref=e1120]
                      - heading "[主な関係会社]" [level=5] [ref=e1121]
                      - paragraph [ref=e1122]: 当社、太平洋セメント(株)、イースタンマリンシステム(株)、豊前久保田海運(株)、AZM MARINE S.A.、東成マリン(株)
                      - paragraph [ref=e1123]
