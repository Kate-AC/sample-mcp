                      - heading "3 【事業の内容】" [level=3] [ref=e1037]
                      - paragraph [ref=e1038]: 当社グループは、当社、子会社4社、関連会社2社及びその他の関係会社5社で構成され、小売業とその付帯事業、小売周辺事業及びその他の事業を営んでおります。その事業の内容及びセグメントとの関連は次のとおりであります。
                      - paragraph [ref=e1039]: 小売事業 :当社は、食料品、雑貨、衣料品の小売業を主体とし、これに付帯する店舗賃貸業等を営んでおります。また、連結子会社である(有)ハピーバラエティは、移動販売事業を営んでおります。
                      - paragraph [ref=e1040]: 小売周辺事業 :連結子会社である(株)でりかエッセン、(株)でりか菜及び(株)三好野本店は、主に惣菜等調理食品の製造販売業を営んでおります。
                      - paragraph [ref=e1041]: その他 :持分法非適用の関連会社である(株)リブ総社は、不動産管理業を営んでおり、(株)まちケアは、インターネットメディア事業を営んでおります。
