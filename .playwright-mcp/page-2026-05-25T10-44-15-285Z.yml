                      - heading "3 【事業の内容】" [level=3] [ref=e849]
                      - paragraph [ref=e850]: 当社グループは、当社および連結子会社5社、非連結子会社1社、持分法適用関連会社1社、持分法非適用関連会社3社からなり、主に舗装工事、土木工事等の請負ならびにこれらに関連する事業を行っているとともに、アスファルト合材等の製品の製造、販売等の事業活動を展開しております。
                      - paragraph [ref=e851]: 当社グループの事業における位置付けは次のとおりであります。
                      - paragraph [ref=e852]: 工事部門
                      - paragraph [ref=e853]: 当社が舗装・土木等に係る建設工事の受注、施工を行うほか、連結子会社の拓神建設(株)、(株)創誠、(株)弘永舗道、あすなろ道路(株)、小石川建設(株)、持分法適用関連会社のあすか創建(株)もそれぞれ建設工事の受注、施工を行っており、その一部は当社が発注し、また当社が上記各連結子会社等から工事の一部を受注しております。非連結子会社のSWテクノ(株)は、機械レンタル事業を行っており、当社は機械等の一部を同社よりレンタルしております。
                      - paragraph [ref=e854]
                      - paragraph [ref=e855]: 製品等販売部門
                      - paragraph [ref=e856]: 当社と連結子会社の(株)弘永舗道およびあすなろ道路(株)がアスファルト合材および関連製品の製造・販売を営んでおり、(株)弘永舗道は互いにその一部を販売、購入しております。また、当社から連結子会社の拓神建設(株)、(株)創誠、小石川建設(株)へその一部を販売しております。
                      - paragraph [ref=e857]
                      - paragraph [ref=e858]: 事業系統図は次のとおりであります。
                      - paragraph [ref=e859]
                      - paragraph [ref=e861]: （画像は省略されました）
                      - paragraph [ref=e862]
                      - paragraph [ref=e863]: なお、当社は工事部門と製品等販売部門に区分して、企業集団等の概況の説明を行っておりますが、当社の販売製品は工事部門の一部分を構成するものであり、「セグメント情報」では、建設事業として単一セグメントと考え、セグメント情報の記載を省略しております。
