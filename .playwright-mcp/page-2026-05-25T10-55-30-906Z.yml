                      - heading "3 【事業の内容】" [level=3] [ref=e1016]
                      - paragraph [ref=e1017]: 当社グループは、「当社」、「子会社4社」及び「その他の関係会社1社」で構成されており、屋根事業及び建材事業を主な事業として取り組んでおります。
                      - paragraph [ref=e1018]: 当社グループの事業における当社グループ各社の位置付け及びセグメントとの関連は、次のとおりであります。なお、セグメントと同一の区分であります。
                      - paragraph [ref=e1019]
                      - paragraph [ref=e1020]: "[屋根事業]"
                      - paragraph [ref=e1021]:
                        - text: 長尺屋根工事、R-T工事、ハイタフ工事、ソーラー工事、塗装工事及び長尺成型品販売を行っております。
                        - text: 屋根事業で使用する材料については、主に、その他の関係会社の「日本製鉄(株)」の製品を、その他の関係会社の子会社の「日鉄鋼板(株)」にて表面処理加工を行い、その他の関係会社の子会社の「日鉄物産(株)」を通じて仕入れております。
                        - text: また、屋根材等の加工作業の相当部分を非連結子会社の「(株)深谷三晃」、「(株)福知山三晃」、「光三晃(株)」に外注しております。
                      - paragraph [ref=e1022]
                      - paragraph [ref=e1023]: "[建材事業]"
                      - paragraph [ref=e1024]:
                        - text: 住宅成型品販売を行っております。
                        - text: 建材事業で使用する材料については、主に、その他の関係会社の「日本製鉄(株)」の製品を、その他の関係会社の子会社の「日鉄鋼板(株)」にて表面処理加工を行い、その他の関係会社の子会社の「日鉄物産(株)」を通じて仕入れております。
                        - text: また、屋根材等の加工作業の相当部分を非連結子会社の「(株)深谷三晃」、「(株)福知山三晃」、「(有)江別三晃工作」に外注しております。
                      - paragraph [ref=e1025]
                      - paragraph [ref=e1026]: "[その他]"
                      - paragraph [ref=e1027]: 太陽光により発電した電力を電力会社に卸売りする事業を行っております。
