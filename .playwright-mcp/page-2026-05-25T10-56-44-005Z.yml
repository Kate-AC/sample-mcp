                      - heading "3【事業の内容】" [level=3] [ref=e1049]
                      - paragraph [ref=e1050]: 当社グループ(当社及び当社の関係会社)は、提出会社、その他の関係会社1社、子会社21社(全て連結子会社)及び関連会社11社(全て持分法適用関連会社)で構成されております(2025年3月31日現在)。畜産飼料事業として配合飼料の製造・販売、豚・鶏卵の生産・販売等、水産飼料事業として配合飼料の製造・販売、水産物の仕入・販売等、食品事業として食肉・鶏卵の仕入・加工・販売等、その他の事業活動を展開しております。
                      - paragraph [ref=e1051]: 当社グループの事業に係る位置づけ及びセグメントとの関連は次のとおりであります。なお、セグメントと同一の区分であります。
                      - paragraph [ref=e1052]: また、当連結会計年度より報告セグメントの区分を変更しております。詳細は、「第5 経理の状況 1 連結財務諸表等 (1)連結財務諸表 注記事項(セグメント情報等)」に記載のとおりであります。
                      - paragraph [ref=e1053]
                      - paragraph [ref=e1054]: ・畜産飼料事業
                      - paragraph [ref=e1055]: 飼料事業.........製品(配合飼料)については、当社が製造するほか、連結子会社の苫小牧飼料(株)、東北飼料(株)、志布志飼料(株)、関連会社の釧路飼料(株)、仙台飼料(株)、鹿島飼料(株)、平成飼料(株)、八代飼料(株)及び他社へ製造委託しております。また、関連会社の門司港サイロ(株)に配合飼料の原料を寄託しております。製品等の販売は、当社が直接又は連結子会社の北海道フィードワン販売(株)、道北協同飼料販売(株)、八戸フィードワン販売(株)、岩手フィードワン販売(株)、鹿島フィードワン販売(株)、東海フィードワン販売(株)、北九州フィードワン販売(株)、南九州フィードワン販売(株)、関連会社の(株)北海道サンフーズ及びその他特約店等を通して、一般得意先あるいは連結子会社の(株)第一原種農場、(株)南部ファーム、(有)グリーンファームソーゴ、関連会社の(株)美保野ポーク、マルイ飼料(株)への販売を行っております。
                      - paragraph [ref=e1056]: なお、その他の関係会社の三井物産(株)からは、原料を購入し同社に対し製品を販売しております。
                      - paragraph [ref=e1057]
                      - paragraph [ref=e1058]: 畜産事業.........連結子会社の(株)第一原種農場、(株)南部ファーム、関連会社の(株)美保野ポークが豚の生産・販売、連結子会社の(有)グリーンファームソーゴが鶏卵の生産・販売等を行っております。また、連結子会社の(有)いわき中央牧場が当社の配合飼料の研究目的で酪農事業を行っております。
                      - paragraph [ref=e1059]
                      - paragraph [ref=e1060]: ・水産飼料事業
                      - paragraph [ref=e1061]: 飼料事業.........製品(配合飼料)については、当社が製造するほか、他社へ製造委託しております。製品等の販売は、当社が直接又はその他特約店等を通して、一般得意先への販売を行っております。
                      - paragraph [ref=e1062]: なお、その他の関係会社の三井物産(株)からは、原料を購入しております。
                      - paragraph [ref=e1063]
                      - paragraph [ref=e1064]: 水産事業.........当社は、水産物の仕入・販売等を行っております。また、連結子会社の南洋漁業(株)が当社の配合飼料の研究目的で養殖事業を行っております。
                      - paragraph [ref=e1065]
                      - paragraph [ref=e1066]: ・食品事業............連結子会社のフィード・ワンフーズ(株)、(株)横浜ミートが食肉の仕入・加工・販売、連結子会社のマジックパール(株)、ゴールドエッグ(株)が鶏卵の仕入・加工・販売等を行っております。
                      - paragraph [ref=e1067]
                      - paragraph [ref=e1068]: ・その他...............当社は、不動産賃貸等の事業を行っております。連結子会社の空知管理サービス(株)が不動産の賃貸・管理を行っております。また、国外において、関連会社のKYODO SOJITZ FEED COMPANY LIMITED(ベトナム)、NIPPAI SHALIMAR FEEDS PRIVATE LIMITED(インド)が飼料の製造・販売を行っております。
                      - paragraph [ref=e1069]: なお、空知管理サービス(株)は2024年12月26日開催の株主総会において解散を決議し、清算手続中であります。
                      - paragraph [ref=e1070]
                      - paragraph [ref=e1071]: 事業の系統図は次のとおりであります。
                      - paragraph [ref=e1072]
                      - paragraph [ref=e1073]
                      - paragraph [ref=e1074]: （画像は省略されました）
