                      - paragraph [ref=e1078]: 2 2025年4月1日付で、苫小牧飼料(株)及び東北飼料(株)は当社を存続会社とする吸収合併を行い、苫小牧飼料(株)及び東北飼料(株)は解散いたしました。
                      - paragraph [ref=e1079]: 3 空知管理サービス(株)は、2024年12月26日開催の株主総会において解散を決議し、清算手続中であります。
                      - paragraph [ref=e1080]: 4 当連結会計年度において、持分法適用関連会社であった(有)東北グローイングは、株式の一部を売却したため、持分法適用の範囲から除外しております。
                      - paragraph [ref=e1081]: 5 当連結会計年度において、持分法適用関連会社であった極洋フィードワンマリン(株)は、清算結了したため、持分法適用の範囲から除外しております。
