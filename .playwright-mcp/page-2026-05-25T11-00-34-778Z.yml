                      - heading "3【事業の内容】" [level=3] [ref=e1108]
                      - paragraph [ref=e1109]: 当社グループは、当社、連結子会社11社、非連結子会社4社および関連会社1社で構成されております。
                      - paragraph [ref=e1110]: 当社グループの主な事業は、米飯群、調理パン群、調理麺群、焼きたてパン群、惣菜群、和菓子などの調理済食品の製造、販売および食品用材料の仕入、加工、販売です。このほか、食品関係の配送などの事業を展開しております。
                      - paragraph [ref=e1111]: 当社グループが営む事業内容と当該事業に係わる位置づけは、次のとおりであります。区分方法については、「第5 経理の状況 1 連結財務諸表等 (1)連結財務諸表 注記事項(セグメント情報等)」に掲げるセグメントの区分と同一であります。
                      - paragraph [ref=e1112]: なお、当社は、有価証券の取引等の規制に関する内閣府令第49条第2項に規定する特定上場会社等に該当しており、これにより、インサイダー取引規制の重要事実の軽微基準については連結ベースの数値に基づいて判断することとなります。
                      - paragraph [ref=e1113]: (食品関連事業)
                      - paragraph [ref=e1114]: 食品関連事業は、米飯群、調理パン群、調理麺群、焼きたてパン群、惣菜群、和菓子などの調理済食品を製造・販売している事業であります。
                      - paragraph [ref=e1115]: わらべや日洋食品株式会社は、北海道から関西および四国までの地域でコンビニエンスストア向けに米飯群、調理パン群、惣菜群、和菓子などを製造・販売しております。
                      - paragraph [ref=e1116]: わらべやデリカ株式会社は、関東を中心にコンビニエンスストア向けに調理麺群、焼きたてパン群などを製造・販売しております。
                      - paragraph [ref=e1117]: わらべや日洋インターナショナル株式会社は、海外食品関連子会社の経営管理、調理済食品に関する技術指導等を行っております。
                      - paragraph [ref=e1118]: WARABEYA U.S.A.,INC.は、米国ハワイ州オアフ島を中心に主にコンビニエンスストア向けに米飯群、調理パン群などを製造・販売しております。
                      - paragraph [ref=e1119]: WARABEYA NORTH AMERICA,INC.は、米国テキサス州やバージニア州を中心にコンビニエンスストア向けに調理パン群などを製造・販売しております。
                      - paragraph [ref=e1120]: 北京旺洋食品有限公司は、中国北京市、天津市を中心にコンビニエンスストア向けに米飯群、調理パン群、惣菜群などを製造・販売しております。
                      - paragraph [ref=e1121]: なお、わらべやデリカ株式会社は、2024年3月に株式会社ヒガシヤデリカよりコンビニエンスストア向け調理麺群、焼きたてパン群などの製造・販売の事業を譲受しております。
