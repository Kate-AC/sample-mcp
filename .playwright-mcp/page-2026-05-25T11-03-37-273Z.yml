                      - heading "3 【事業の内容】" [level=3] [ref=e1159]
                      - paragraph [ref=e1160]: 当社グループ(当社及び当社の関係会社)は、当社、子会社12社、及びその他の関係会社1社により構成されており、医療機関の発行する処方箋に基づき、医薬品の調剤を行う調剤薬局の経営を主たる事業としております。なお、当社は特定上場会社等に該当し、インサイダー取引規制の重要事実の軽微基準のうち、上場会社の規模との対比で定められる数値基準については連結ベースの計数に基づいて判断することとなります。
                      - paragraph [ref=e1161]: 当社グループの事業内容は次のとおりであります。なお、次の4区分は「第5 経理の状況 1連結財務諸表等 (1)連結財務諸表 注記事項」に記載したセグメントの区分と同一であります。
                      - paragraph [ref=e1162]: (調剤薬局事業)
                      - paragraph [ref=e1163]: 子会社である株式会社メディカル一光、株式会社ヘルシー薬局、株式会社京寿薬品は、処方箋に基づき医薬品の調剤を行う調剤薬局を経営しております。
                      - paragraph [ref=e1164]: (ヘルスケア事業)
                      - paragraph [ref=e1165]: 子会社である株式会社ハピネライフ一光、株式会社ハピネライフケア鳥取、有限会社三重高齢者福祉会、ウェルフェアー株式会社、株式会社ライフケア、株式会社メディカルケア一光、株式会社サンライズヴィラ土浦は、介護施設の運営および訪問介護等、多様な介護サービスの提供を行っております。
                      - paragraph [ref=e1166]: (医薬品卸事業)
                      - paragraph [ref=e1167]: 子会社である株式会社メディカル一光、株式会社メディシン一光は、医療機関等へ医薬品の販売を行っております。
                      - paragraph [ref=e1168]: (不動産事業)
                      - paragraph [ref=e1169]: 当社、子会社である株式会社メディカル一光、株式会社サンライズヴィラ土浦、株式会社ヘルスケア・キャピタルは、一般不動産を所有し賃貸業務を行っております。
