                      - heading "3【事業の内容】" [level=3] [ref=e1012]
                      - paragraph [ref=e1013]: 当社グループは、当社(内外テック株式会社)及び連結子会社2社(内外エレクトロニクス株式会社、納宜伽義機材(上海)商貿有限公司)により構成され、半導体メーカー、半導体製造装置メーカー、FPD製造装置メーカー及び電子機器メーカーを主要取引先として、「販売事業」及び「受託製造事業」を展開しております。
                      - paragraph [ref=e1014]
                      - paragraph [ref=e1015]: (1)事業の特色は次のとおりであります。
                      - paragraph [ref=e1016]: 1 販売事業
                      - paragraph [ref=e1017]: 当社は、半導体製造装置、FPD製造装置及び電子機器等に使用される空気圧機器・真空機器・温度調節機器等の各種コンポーネンツ及び同装置を国内メーカーから仕入れ、主に国内ユーザー企業に販売しています。
                      - paragraph [ref=e1018]: また、海外連結子会社の納宜伽義機材(上海)商貿有限公司は、機械電子設備及び各種コンポーネンツを現地メーカーや当社から仕入れ、現地に進出している日系ユーザー企業及び現地ユーザー企業に販売しております。
                      - paragraph [ref=e1019]
                      - paragraph [ref=e1020]: 2 受託製造事業
                      - paragraph [ref=e1021]: 連結子会社の内外エレクトロニクス株式会社は、半導体メーカー、半導体製造装置メーカー、FPD製造装置メーカー及び電子機器メーカーを主要取引先として、装置組立、受託加工、工程管理、情報機器組立、メンテナンスサポート等の受託製造事業を行っております。
                      - paragraph [ref=e1022]
                      - paragraph [ref=e1023]: 当社グループは、半導体関連企業を支えるリーディングカンパニーとして、お客様に総合的ソリューションを提供するという事業戦略に基づき、販売事業及び受託製造事業における販売(SS事業)、製品開発・技術開発(TS事業)、受託組立(MS事業)、精密加工(PS事業)、メンテナンスサポート(FS事業)の5つの事業ポートフォリオを以ってグループの総合力でお客様の幅広いニーズに対応しております。
