                      - heading "3【事業の内容】" [level=3] [ref=e1003]
                      - paragraph [ref=e1004]: 当社グループは、当社および子会社5社で構成され、橋梁、建築、沿岸構造物等の社会インフラの建設、保全・更新の事業に関する設計、施工・工事管理等の請負を主として行っております。当社は事業会社である宮地エンジニアリング株式会社、エム・エム ブリッジ株式会社等の支配、管理を目的とする持株会社であります。
                      - paragraph [ref=e1005]: なお、当社は、有価証券の取引等の規制に関する内閣府令第49条第2項に規定する特定上場会社等に該当しており、これにより、インサイダー取引規制の重要事実の軽微基準については連結ベースの数値に基づいて判断することとなります。
                      - paragraph [ref=e1006]: 当社グループは、事業を基礎としたセグメントから構成されており、「宮地エンジニアリング」、「エム・エム ブリッジ」の2つを報告セグメントとしております。
                      - paragraph [ref=e1007]: 「宮地エンジニアリング」とは、宮地エンジニアリング株式会社で、新設橋梁の設計・製作・現場施工、既設橋梁の維持・補修・補強、橋梁周辺鋼構造物、複合構造物の設計・製作・現場施工、その他鋼構造物の製作・現場施工、FRP構造物の販売、プレストレストコンクリート橋梁、その他土木事業、大空間・超高層建築物、鉄塔、煙突、工場建物、既設構造物の耐震・免震工事等を行っております。
                      - paragraph [ref=e1008]: 「エム・エム ブリッジ」とは、エム・エム ブリッジ株式会社で、橋梁、沿岸構造物等の設計・製造、据付、販売及び修理を行っております。
