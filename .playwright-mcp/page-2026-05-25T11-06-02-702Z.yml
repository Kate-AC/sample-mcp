                      - heading "3 【事業の内容】" [level=3] [ref=e1197]
                      - paragraph [ref=e1198]: 当連結会計年度末において、当社グループ(当社及び当社の関係会社)は、当社(株式会社アルファ)、連結子会社16社及び非連結子会社3社により構成されている総合ロックメーカーグループであります。事業内容は、キーとロックを自動車、住宅、産業機器、省力機器等様々な分野に提供するものであり、キーとロックに関連する製品やシステム商品、サービス分野にその業容を拡大してまいりました。
                      - paragraph [ref=e1199]
                      - paragraph [ref=e1200]: 各事業の種類別セグメントの事業の内容及び当社と関係会社の当該事業に係る位置付けは次のとおりであります。
                      - paragraph [ref=e1201]: なお、次の2事業は、「第5 経理の状況 1 連結財務諸表等 (1) 連結財務諸表 注記事項(セグメント情報等)」に掲げるセグメントの区分と同一であります。
                      - paragraph [ref=e1202]
                      - paragraph [ref=e1203]: 自動車部品事業(日本・北米・アジア・欧州)
                      - paragraph [ref=e1204]: 当事業における主要製品は、ステアリングロック、キーシリンダー等のメカ部品とキーレスエントリー、インテリジェントキーシステム等の電子部品とで構成されるキーセットをはじめ、アウトサイドドアハンドル、インサイドドアハンドル等であります。
                      - paragraph [ref=e1205]: 自動車部品事業(日本)は、当社の他、九州アルファ株式会社(連結子会社。以下同じ。)、自動車部品事業(北米)は米国のALPHA TECHNOLOGY CORPORATION、メキシコのALPHA INDUSTRY QUERETARO, S.A. DE C.V.、Alpha Industry Jalisco,S.A.DE C.V.及びALPHA INDUSTRY PUEBLA, S.A. DE C.V.、自動車部品事業(アジア)はタイのALPHA INDUSTRY (Thailand) CO.,LTD.、中国のALPHA (GUANGZHOU) AUTOMOTIVE PARTS CO.,LTD.、ALPHA (XIANGYANG) AUTOMOTIVE PARTS CO.,LTD.、ALPHA ADVANCED AUTOMOTIVE PARTS CO.,LTD.、インドのAlpha Security Instruments (India) Private Limited及びインドネシアのPT.ALPHA AUTOMOTIVE INDONESIA、自動車部品事業(欧州)はチェコのAlpha Vehicle Security Solutions Czech s. r. o.、フランスのAlpha France SAS及びスロバキアのAlpha Slovakia s.r.o.です。各セグメントでキーセット、ドアハンドル等の製造、販売を行っております。
                      - paragraph [ref=e1206]: (注)1.ALPHA (XIANGYANG) AUTOMOTIVE PARTS CO.,LTD.は、2024年8月に解散し、2025年3月に清算結了しました。
                      - paragraph [ref=e1207]: 2.PT. ALPHA AUTOMOTIVE INDONESIAは、2023年12月に解散し、清算手続き中です。
                      - paragraph [ref=e1208]
                      - paragraph [ref=e1209]: セキュリティ機器事業(日本・海外)
                      - paragraph [ref=e1210]: 当事業における主要製品は、非接触認証技術を使った電気錠等の玄関錠や室内ドア錠等の住宅用ロック、自動販売機を含む産業機器向けの産業用ロック、駅、プール、スキー場、体育館に設置されるコインロッカー、ゴルフ場等向けの貴重品ロッカー、マンション・アパート・戸建住宅向け宅配ボックス等であります。
                      - paragraph [ref=e1211]: セキュリティ機器事業(日本)は当社が住宅用ロック等の販売を行っている他、株式会社アルファロッカーシステム(連結子会社。以下同じ。)がコインロッカー等の製造・販売・賃貸・保守管理業務を行い、セキュリティ機器事業(海外)はタイのALPHA HOUSING HARDWARE (THAILAND) CO.,LTD.が住宅用ロックの製造・販売を行っております。
