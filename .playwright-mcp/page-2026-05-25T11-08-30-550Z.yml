                      - paragraph [ref=e1194]
                      - heading "3 【事業の内容】" [level=3] [ref=e1195]
                      - paragraph [ref=e1196]:
                        - text: 当社グループは、当社、連結子会社19社及び関連会社で構成されており、「@cosme」の運営により構築した事業基盤をプラットフォームとして確立し、化粧品・美容業界に特化した業界横断型のサービスを展開しております。
                        - text: "[主要連結子会社]"
                        - text: (株)アイスタイルリテール、(株)アイスタイルトレーディング、(株)アイスタイルキャリア、(株)ISパートナーズ、(株)メディア・グローブ、(株)Over The Border、(株)istyle me、(株)アイスタイルプロダクツ、アイスタイルデータコンサルティング(株)、istyle China Co., Limited、istyle Global (Singapore) Pte. Limited、istyle Global (Hong Kong) Co., Limited、istyle Retail (Hong Kong) Co., Limited、i-TRUE Communications Inc.、MUA Inc.、Glowdayz, Inc.
                        - text: ※上記以外に、連結子会社が3社あります。
                      - paragraph [ref=e1197]: 当社及び当社の関係会社の事業における位置付け及びセグメントとの関連は、次のとおりであります。以下に示す区分は、セグメントと同一の区分であります。
                      - paragraph [ref=e1198]
                      - paragraph [ref=e1199]: (1)マーケティング支援事業
                      - paragraph [ref=e1200]: 当セグメントには、当社が運営するコスメ・美容の総合サイト「@cosme(アットコスメ)」を基盤とした、化粧品ブランド向けの広告ソリューションやデータドリブンソリューションが属しております。
                      - paragraph [ref=e1201]
                      - paragraph [ref=e1202]: (2)リテール事業
                      - paragraph [ref=e1203]: 当セグメントには、化粧品ECサイト「@cosme SHOPPING(アットコスメショッピング)」、化粧品専門店「@cosme STORE(アットコスメストア)」等の国内における小売業を中心としたサービスが属しております。
                      - paragraph [ref=e1204]
                      - paragraph [ref=e1205]: (3)グローバル事業
                      - paragraph [ref=e1206]: 当セグメントには、日本国外で展開するEC・卸売、店舗、メディア等のサービスが属しております。
                      - paragraph [ref=e1207]
                      - paragraph [ref=e1208]: (4)その他事業
                      - paragraph [ref=e1209]: 当セグメントには、美容部員を派遣する人材派遣事業と、ユーザー向けのBtoC課金サービス、創業間もない企業も含め幅広い成長ステージの企業に投資する投資育成事業等が属しております。
                      - paragraph [ref=e1210]
                      - paragraph [ref=e1211]
                      - paragraph [ref=e1212]: "[事業系統図]"
                      - paragraph [ref=e1214]: （画像は省略されました）
                      - paragraph [ref=e1215]: ※上記以外に連結子会社が3社あります。関連会社については記載を省略しております。
