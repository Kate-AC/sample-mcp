                      - heading "3 【事業の内容】" [level=3] [ref=e1020]
                      - paragraph [ref=e1021]: 当社グループは、当社、子会社5社、関連会社3社及びその他の関係会社1社で構成しております。その主な事業内容は、粘着技術を基盤に高分子技術を駆使して、布・紙・セロファン・プラスチックをベースとした医薬品、各種感圧性粘着テープ及び接着剤並びにそれらに関連する機械器具の製造販売であります。
                      - paragraph [ref=e1022]: なお、当社グループの製品・商品は、医薬品業界向けの絆創膏等、産業用粘着テープ業界及び文具・事務用品業界向けの粘着テープ等に大別され、セグメントもこの区分によっております。
