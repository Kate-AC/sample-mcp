                    - generic [ref=e1126]:
                      - paragraph [ref=e1127]
                      - heading "3 【事業の内容】" [level=3] [ref=e1128]
                      - paragraph [ref=e1129]:
                        - text: 当社グループは、当社、子会社1社((株)フォーカスインキュベート)、関連会社4社((株)イノス、(株)メティス、(株)エー・アイ・エムスタッフ、(株)G.A.P)の計6社で構成されており、子会社1社を除きシステムインテグレーション及びITサービス並びに情報セキュリティ製品の販売・関連サービスを主な事業としております。
                        - text: 子会社である(株)フォーカスインキュベートは、企業・ベンチャービジネスへの投融資、育成、仲介を行っております。当社及び当社の関係会社の事業における当社及び関係会社の位置づけ及びセグメントとの関連は、次のとおりです。なお、以下に示す区分は、当社の報告セグメントと同一です。
                      - paragraph [ref=e1130]
                      - heading "公共関連事業" [level=5] [ref=e1131]
                      - paragraph [ref=e1132]: 公共関連事業として、主な最終ユーザーが官公庁及び地方自治体となるマイナンバー関連システム、財務システム、貿易システム、航空管制システム、自動車関連システム、社会保険・健康保険・年金に関するシステム等、社会インフラのシステム実現に向けた提案・設計・製造・試験からシステム稼動後の運用・保守に至るまで、総合的な技術支援を行っております。
                      - paragraph [ref=e1133]: 1988年に現在の主要取引先である(株)NTTデータの前身である日本電信電話(株)と取引を開始しました。その後、公共関連システムの特徴である長期的かつ継続的なライフサイクルの下、長年培ってきた深い業務知識と豊富な開発経験により公共関連システムの開発・保守維持業務に多くの人材を投入することで、経営基盤の更なる安定化を図っております。
                      - paragraph [ref=e1134]: (主な関係会社)当社、(株)エー・アイ・エムスタッフ、(株)G.A.P
                      - heading [level=5]
                      - heading "エンタープライズ事業" [level=5] [ref=e1135]
                      - paragraph [ref=e1136]:
                        - text: エンタープライズ事業として、主に法人企業の基幹業務システム・Webアプリケーション・クラウドアプリケーションの開発、ネットワークインフラ設計・構築、RPAソリューション、付随する運用・保守、ICTに係るコンサルティングを行っております。
                        - text: 市場シェアの高い「intra-mart」「SAP」等を同一部門で取扱うことができる組織体制と知見を強みに、あらゆる産業・事業・業務の特性やニーズに対応できる事業基盤を確立してまいりました。また、クラウド、RPA、仮想化等新たな価値創造を担う技術領域の幅を更に広げ、お客さまへの提供価値最大化を図っております。
                      - paragraph [ref=e1137]: (主な関係会社)当社、(株)メティス
                      - paragraph [ref=e1138]
                      - heading "広域ソリューション事業" [level=5] [ref=e1139]
                      - paragraph [ref=e1140]:
                        - text: 広域ソリューション事業として、東京・名古屋・大阪地域における、通信制御・組込み・法人企業及び行政機関向けの各システム開発、AIソリューション、付随する運用・保守、ICTに係るコンサルティングを行っております。
                        - text: 創業当時から続く電話・インターネット等の通信制御システムの開発をはじめ、携帯電話・スマートフォン等情報通信機器のソフトウェアの開発、カーエレクトロニクス・デジタルカメラ・ウェアラブル端末等組込み型ソフトウェアの開発を特徴にあらゆる事業分野に対応する技術領域の広さを強みとしつつ、安定基盤の拡大を図っております。
                      - paragraph [ref=e1141]: (主な関係会社)当社、(株)エー・アイ・エムスタッフ
                      - paragraph [ref=e1142]
                      - paragraph [ref=e1143]
                      - paragraph [ref=e1144]: イノベーション事業
                      - paragraph [ref=e1145]: イノベーション事業として、法人企業向けのインフラ設計・構築、メインフレーム業務、システム開発、付随する運用・保守、IoT及び情報セキュリティ分野における自社製品の製造・ソリューション提供を行っております。
                      - paragraph [ref=e1146]: 1997年より現在の主要取引先である日本アイ・ビー・エム(株)と取引を開始しました。法人企業の情報システム基盤の構築、システム運用・保守、インフラ技術支援で存在感を強めていき、システム開発を含め、事業の発展・拡大を続けております。また、情報セキュリティ及びIoT分野に参入し、暗号・電子透かし・ビーコン・指向性受信機等ソリューションの提供に自社製品も活用することで、より細やかなソリューションの提供を図っております。
                      - paragraph [ref=e1147]: (主な関係会社)当社、(株)イノス、(株)エー・アイ・エムスタッフ
