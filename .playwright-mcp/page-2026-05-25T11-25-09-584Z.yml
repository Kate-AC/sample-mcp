                        - paragraph [ref=e884]
                      - paragraph [ref=e885]
                      - paragraph [ref=e886]: (2)主な販売チャネル・販路
                      - paragraph [ref=e887]: 当社グループは水栓金具事業の単一セグメントでありますが、販売チャネル・販路を4つのルートに区分しております。
                      - paragraph [ref=e888]
                      - paragraph [ref=e889]: (管工機材ルート)
                      - paragraph [ref=e890]: 水まわり資材を取り扱う管材店への販売を主に行うルートです。また、商流の上層にあたるデベロッパーや設計事務所への販売促進も行っております。
                      - paragraph [ref=e891]: 事業展開の方針としては、下記となります。
                      - paragraph [ref=e892]:
                        - text: (1) ホテル、飲食店、病院、介護老人保健施設等の非住宅関連へのスペックイン
                        - text: (2) 住宅内の水まわり設備のトータル提案
                      - paragraph [ref=e893]: (3) パワービルダー(戸建て業者)、ハウスメーカー(大規模住宅建設業者)、工務店等住宅関連へのアプローチ
                      - paragraph [ref=e894]
                      - paragraph [ref=e895]: (リテールルート)
                      - paragraph [ref=e896]: 量販店への販売を主に行うルートです。ネット市場の拡大に合わせ、ネット販売も強化しております。
                      - paragraph [ref=e897]: 事業展開の方針としては、下記となります。
                      - paragraph [ref=e898]: (1) ホームセンター向け水まわり商材の企画、開発と販売体制の強化
                      - paragraph [ref=e899]: (2) 家電量販店、GMS(総合スーパー)、ドラッグストアへ水まわり商材や雑貨、リフォーム商材などの提案
                      - paragraph [ref=e900]: (3) テレビ通販、インターネット販売業者への販路拡大
                      - paragraph [ref=e901]
                      - paragraph [ref=e902]: (メーカールート)
                      - paragraph [ref=e903]: システムキッチンやユニットバスなどの住宅設備機器メーカーへの製品供給を主に行うルートです。
                      - paragraph [ref=e904]: 事業展開の方針としては、下記となります。
                      - paragraph [ref=e905]:
                        - text: (1) 優位性のある中高級グレードの商品投入
                        - text: (2) バス・洗面・キッチンなど、住宅設備機器メーカーとの協業による水まわり空間の提案
                      - paragraph [ref=e906]
                      - paragraph [ref=e907]: (海外ルート)
                      - paragraph [ref=e908]: 海外市場への輸出を行うルートです。国内同様、現地の管工機材、リテール、メーカールートの企業へ販売しております。
                      - paragraph [ref=e909]: 事業展開の方針としては、下記となります。
                      - paragraph [ref=e910]:
                        - text: (1) 中国、台湾、インドネシア等のアジア諸国向けに中高級グレードの商品投入
                        - text: (2) 海外各国の現地代理店との提携強化、新規開拓による販売
                      - paragraph [ref=e911]: 上記4つの販売チャネル・販路に対し、全国に支社・支店・営業所・出張所を設置し、営業拠点展開を行っております。
                      - paragraph [ref=e912]: 現在の営業拠点展開状況は、まず四大都市圏である東京、名古屋、大阪、福岡に支社・支店を設置しております。これを中心に管工機材ルートの主要顧客である管材店に対して、全国隈なく網羅的にサービスを提供できるよう、23カ所の営業所・出張所を設置しております。
                      - paragraph [ref=e913]: リテールルートとメーカールートの主要顧客につきましては、事業規模が大きい企業の為、大都市圏に本部を置いているケースが多い事から、主に各支社・支店にて担当しております。
                      - paragraph [ref=e914]: また、海外輸出の担当は大阪にて行っております。
                      - paragraph [ref=e915]: 営業拠点の展開は、商圏の密集具合、取引先との往来の利便性、基幹道路の近くなど物流の効率性等を考慮して、最も収益性が高まる事を基本方針としております。
                      - paragraph [ref=e916]
                      - paragraph [ref=e917]: 生産拠点の展開としては、岐阜県各務原市に主力工場である岐阜工場、大伊木工場、大阪府大阪市城東区に組立工程専門の鴫野工場、中国大連市に大連三栄水栓有限公司、岐阜県山県市に(株)水生活製作所を持ち、生産を行っております。
                      - paragraph [ref=e918]: 現在の生産工場展開状況は、岐阜工場を主力工場として位置付け、工場内には鋳造→加工→研磨→鍍金→組立→出荷と全工程を持ち、組立の鴫野工場、鋳造が中心の大連三栄水栓有限公司、生産・技術面での事業要素が共通する(株)水生活製作所と連携して必要な生産数を確保しております。
                      - paragraph [ref=e919]: 岐阜工場は水栓バルブ発祥の地と言われる美山地区の近くにあり、協力会社との連携を意識しております。鴫野工場が最初の組立工場として1972年に開設、その後業務の拡大に伴い岐阜工場に拡張して全工程を所有することとなり、水回り製品を自社で一貫生産できる体制になりました。その後、生産コスト効率化の為、中国に大連三栄水栓有限公司を設立しております。また、国内での生産体制強化及び今後のリスクヘッジの選択肢を増やす目的で、協力会社であった(株)水生活製作所を連結子会社としました。
                      - paragraph [ref=e920]: 最近ではISOを含めて国内各工場の共通化を進めてきました。2014年には、岐阜工場内に新工場棟を建設して組立工程の強化を行っております。また、国内市場・海外市場における更なる水栓金具(高付加価値水栓)の需要拡大にあわせ、高付加価値製品の安定的な供給体制を確立することを目的として、岐阜工場の生産エリアの増改築を現在進めております。
                      - paragraph [ref=e921]: なお、生産拠点の展開は、協力会社との連携の取りやすさ、生産コストへの影響度合い、物流環境の効率性等を考慮して、最も生産性が高まる事を基本方針としております。
                      - paragraph [ref=e922]
                      - paragraph [ref=e923]: (3)当社及び関係会社の位置付け
                      - paragraph [ref=e924]: 当社及び当社の関係会社の事業における当社及び関係会社の位置付けは、次のとおりであります。
                      - paragraph [ref=e925]
                      - paragraph [ref=e926]: (主な関係会社) (株)アクアエンジニアリング
                      - paragraph [ref=e927]: 給水栓・給排水金具・継手及び配管部材の取付等施工工事、当社製品のアフターサービス業務をしております。
                      - paragraph [ref=e928]
                      - paragraph [ref=e929]: (主な関係会社) 大連三栄水栓有限公司
                      - paragraph [ref=e930]: 当社製品に組み込まれる部品の製造をしております。
                      - paragraph [ref=e931]
                      - paragraph [ref=e932]: (主な関係会社) (株)水生活製作所
                      - paragraph [ref=e933]: 給水栓類、配管継手類、浄水器類の設計、開発、製造、販売をしております。
                      - paragraph [ref=e934]
