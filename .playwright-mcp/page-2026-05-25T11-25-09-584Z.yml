                      - heading "3 【事業の内容】" [level=3] [ref=e798]
                      - paragraph [ref=e799]: 当社グループ(当社及び当社の関係会社)は、当社、連結子会社((株)アクアエンジニアリング、大連三栄水栓有限公司、(株)水生活製作所、美山鋳造(株))計5社で構成されており、給水栓・給排水金具・継手及び配管部材の製造・販売を主な内容としております。
                      - paragraph [ref=e800]: 当社グループの主な製品の特長と主な販売チャネル・販路は次のとおりであります。
                      - paragraph [ref=e801]
                      - paragraph [ref=e802]: (1)主な製品の特長
                      - paragraph [ref=e803]: 給水栓とは単水栓、湯水混合水栓、止水栓、ボールタップ及び洗浄弁・洗浄水栓を総称するものであります。同業他社は規模の違いはありますが約数十社あり、その中でも当社グループは水栓金具を専門で取り扱うメーカーであります。
                      - paragraph [ref=e804]: 当社製品の主な特長といたしましては、プロダクトデザイナーや、建築や空間を手掛けるデザイナーといった方にも積極的に協力いただき、従来とは異なる水栓を提案していることがあります。インテリアを構成する素材の一つとして、その空間のコンセプトに調和するようなデザインの選択肢を提供する製品を揃えております。
                      - paragraph [ref=e805]: また住まいやホテルの一般室では使っていただいておりますが、スウィートルームやペントハウスなどの高級なゾーンにおいても採用していただける製品作りに力を注いでおります。
                      - paragraph [ref=e806]: 住居以外の事務所ビルやアミューズメント施設、病院・介護施設、駅舎等、人が集まる公共の場、いわゆる非住宅の分野でも使われる製品にも力を入れております。今後当社が製品開発面でめざすのはエレクトロニクスとの融合であります。その中でも他社にはない製品を生み出す事が、新たなライフスタイルの提案につながると確信しております。一般向け水栓や給排水用品等の水まわり商材のほか、付加価値の高いデザインや水の流れにこだわった高級水栓や、スマホのようなタッチパネル式水栓、音声認識による吐水・止水操作システムを製品化しております。
                      - paragraph [ref=e807]
                      - paragraph [ref=e808]
