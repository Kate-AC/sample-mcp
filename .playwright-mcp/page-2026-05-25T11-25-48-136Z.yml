                      - heading "3 【事業の内容】" [level=3] [ref=e1059]
                      - paragraph [ref=e1060]: 当社グループは、当社および子会社13社で構成され、主として遠心分離機等の製造・販売および化学工業製品等の仕入・販売に関連する事業を営んでおります。
                      - paragraph [ref=e1061]: 当社グループの事業に係る位置付けは、次のとおりであります。また、報告セグメントと事業区分は同一であります。なお、「その他の事業」には連結会社が含まれていないため、報告セグメントには記載しておりません。
                      - paragraph [ref=e1062]: 機械製造販売事業・・・・・・・当社は遠心分離機の製造・販売を行い、子会社巴機械サービス(株)は遠心分離機のアフターサービスおよび部品の販売を行っており、子会社巴マシナリー(株)は遠心分離機の部品の板金加工および機械加工を行っております。子会社巴栄機械設備(太倉)有限公司は、中国における遠心分離機の製造・販売とアフターサービスを行っております。子会社Tomoe Engineering USA, Inc. は、北米における遠心分離機および部品の販売とアフターサービスを行っております。
                      - paragraph [ref=e1063]: 化学工業製品販売事業・・・・・子会社巴工業(香港)有限公司ならびに同社の出資子会社である巴恵貿易(深圳)有限公司は、中国における当社グループの営業活動の中核として、子会社TOMOE Trading(Thailand)Co.,Ltd.、TOMOE TRADING(MALAYSIA)SDN.BHD.、TOMOE TRADING VIETNAM CO.,LTD.ならびにTOMOE Advanced Materials s.r.o. は、それぞれタイ、マレーシア、ベトナム、ヨーロッパにおける当社グループの営業活動拠点として機能しております。
                      - paragraph [ref=e1064]: その他の事業・・・・・・・・・子会社巴物流(株)は当社の物流窓口として、商品発送や在庫管理を行っております。
                      - paragraph [ref=e1065]: 連結子会社に関する事業の系統図は、次のとおりであります。
                      - paragraph [ref=e1067]: （画像は省略されました）
                      - paragraph [ref=e1068]: (注) 2024年8月1日開催の当社取締役会において、合成樹脂原料等の仕入・販売を行う星際化工有限公司およびその100%子会社として合成樹脂の着色・コンパウンド加工を行う星際塑料(深圳)有限公司を解散し清算することを決議しており、現在清算手続き中であります。
