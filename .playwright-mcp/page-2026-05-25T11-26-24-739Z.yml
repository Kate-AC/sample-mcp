                    - generic [ref=e1158]:
                      - paragraph [ref=e1159]
                      - heading "3 【事業の内容】" [level=3] [ref=e1160]
                      - paragraph [ref=e1161]: 当社及び当社の関係会社(以下、「当社グループ」という。)は、当社、国内子会社8社、海外子会社7社から構成されており、主な事業内容は、農林業用機械(防除機、林業機械、部品、その他)、工業用機械(工業用機械、その他)及び、その他の機械(消防機械、その他)の製造・販売及び不動産賃貸事業他であります。
                      - paragraph [ref=e1162]: 当社及び主要な子会社の主な事業内容と当該事業における位置付けは、次のとおりであります。
                      - paragraph [ref=e1163]: なお、次の4部門は「第5 経理の状況 1(1)連結財務諸表 注記事項」に掲げるセグメント情報の区分と同一であります。
                      - paragraph [ref=e1164]
                      - heading "(1) 農林業用機械" [level=4] [ref=e1165]
                      - paragraph [ref=e1166]: (製 造)防除機は、主に当社が製造し、一部を連結子会社である日本クライス(株)、西部丸山(株)及びMARUYAMA MFG(THAILAND)CO.,LTD.が製造しております。林業機械(刈払機)は、主に日本クライス(株)及びMARUYAMA MFG(THAILAND)CO.,LTD.が製造しております。その他は、主に日本クライス(株)が製造しております。連結子会社の製造した製品は、MARUYAMA MFG(THAILAND)CO.,LTD.の一部を除き、当社に納入されております。
                      - paragraph [ref=e1167]: (販 売)当社が全国農業協同組合連合会及び(株)クボタ、特約店などを通じて国内外に販売しているとともに、連結子会社であるMARUYAMA U.S.,INC.、ASIAN MARUYAMA(THAILAND)CO.,LTD.及び双葉商事(株)は当社が納入する製品、MARUYAMA MFG INDIA PRIVATE LIMITEDは当社が納入する部品をOEM先を通じて製造する製品、MARUYAMA MFG(THAILAND)CO.,LTD.は自社で製造する製品の一部を、それぞれ特約店を通じて販売しております。
                      - paragraph [ref=e1168]: (その他)防除機の開発業務の一部を、当社より委託を受けておりました非連結子会社である(株)M&Sテクノロジーは現在休業中であります。
                      - paragraph [ref=e1169]
                      - heading "(2) 工業用機械" [level=4] [ref=e1170]
                      - paragraph [ref=e1171]: (製 造)工業用機械は、主に当社が製造し、一部を西部丸山(株)が製造しております。
                      - paragraph [ref=e1172]: (販 売)当社が、工業用機械を国内の特約店及び海外の総代理店を通じて販売しているとともに、当社が納入する工業用機械をASIAN MARUYAMA(THAILAND)CO.,LTD.が特約店を通じて販売しております。
                      - paragraph [ref=e1173]
                      - heading "(3) その他の機械" [level=4] [ref=e1174]
                      - paragraph [ref=e1175]: (製 造)消防機械は、連結子会社であるマルヤマエクセル(株)が製造しております。
                      - paragraph [ref=e1176]: (販 売)マルヤマエクセル(株)が、消防機械を特約店を通じて販売しております。
                      - paragraph [ref=e1177]
                      - heading "(4) 不動産賃貸他" [level=4] [ref=e1178]
                      - paragraph [ref=e1179]: 不動産賃貸業及び売電事業は、当社が行っております。
                      - paragraph [ref=e1180]
                      - heading "(5) 共通" [level=4] [ref=e1181]
                      - paragraph [ref=e1182]: 農林業用機械、工業用機械及びその他の機械に関する販売用部品の仕入業務及び配送・保管等の物流事業は、当社及びマルヤマエクセル(株)より委託を受けた連結子会社である丸山物流(株)が主に行っております。
                      - paragraph [ref=e1183]: 中国における農林業用機械、工業用機械及びその他の機械に関する営業業務は、当社より委託を受けた連結子会社である丸山(上海)貿易有限公司が行っております。
                      - paragraph [ref=e1184]: 当社グループにおけるITコンサルティング業務は、当社より委託を受けた連結子会社であるM-Innovations株式会社が行っております。
                      - paragraph [ref=e1185]
                      - paragraph [ref=e1186]
                      - paragraph [ref=e1187]: 以上述べた事項を事業系統図によって示すと、次のとおりであります。
