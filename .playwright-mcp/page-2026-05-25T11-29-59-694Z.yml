                            - cell "船舶用配電制御システムが、船舶内に用いられる装置であるのに対し、産業用の配電制御システムは、ビル、工場、鉄道施設及び工事設備等で使用される装置であります。" [ref=e1168]:
                              - paragraph [ref=e1169]: 船舶用配電制御システムが、船舶内に用いられる装置であるのに対し、産業用の配電制御システムは、ビル、工場、鉄道施設及び工事設備等で使用される装置であります。
                          - row "コージェネレーションシステム コージェネレーションシステム(熱電併給システム)は、燃料を用いて発電するとともに、その際に発生する排熱を冷暖房や給湯、蒸気などの用途に有効利用する省エネルギーシステムであります。 原動機(ディーゼル、ガスエンジン、ガスタービン等)で駆動される発電機の起動、停止制御、原動機及び発電機の保護、状態監視等を行うとともに警報機能も備えており、商用電力との連系のための同期投入、電力、電圧制御等も行います。" [ref=e1170]:
