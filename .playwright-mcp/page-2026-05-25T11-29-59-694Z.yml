                          - row "メディカルデバイス 当社のメディカルデバイスは、医療機器である人工透析装置のユニット及び各種臨床検査機器等であります。当社のユニットが使われている人工透析装置は、医療機器として人工透析を自動制御にて行うと同時に監視・記録機能等を備えており、個人用及び多人数用透析装置などがあります。 また、臨床検査機器は尿分析、血液分析、感染症分析等を自動で高速処理し、その結果をデータとして迅速に出力できるようにしたものであります。" [ref=e1195]:
