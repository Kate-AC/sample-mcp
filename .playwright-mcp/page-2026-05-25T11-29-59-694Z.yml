                      - heading "3【事業の内容】" [level=3] [ref=e1070]
                      - paragraph [ref=e1071]: 当社グループ(当社及び当社の関係会社)は、当社(寺崎電気産業株式会社)、連結子会社12社(国内4社、海外8社)及び非連結子会社3社(国内1社、海外2社)により構成されております。
                      - paragraph [ref=e1072]: 当社グループでは、海外拠点での売上高が約52%を占めており、海外における売上はアジア、ヨーロッパ地域であることから、「日本」、「アジア」及び「ヨーロッパ」をセグメント区分としております。当社グループの関係会社とセグメントの関係は以下の系統図のとおりであります。
                      - paragraph [ref=e1073]: 当社グループの事業を総括すると、船舶、ビル、工場等を対象とする配電制御システム、機関監視制御システム、集合始動器盤、コージェネレーションシステム、メディカルデバイス(医療機器及び臨床検査機器)等のシステム製品の製造販売、その構成部品でもある低圧遮断器(低圧配線用遮断器、低圧気中遮断器、漏電遮断器等)等の電気機器を中心とする機器製品の製造販売、及びこれらに付帯するエンジニアリング及びライフサイクルサービス(予防保全やアフターサービス等)が主体となっております。
                      - paragraph [ref=e1074]: システム製品は、船舶用配電制御システム製品と産業用配電制御システム製品とに大別され、主として顧客の個別仕様に基づいた製品であります。船舶用配電制御システム製品の主なものは、船舶内の配電系統の監視、制御、保護に使用される配電制御システム及び推進機関、発電機等の運転状況の監視、制御に使用される機関監視制御システム等であります。当社では日本を始め、アメリカ、イギリス、フランス等各国の船級協会規則(船体及び積荷を技術的、経済的立場から保証することを目的として、上記の国等においては船級協会が設立されており、各船級協会はそれぞれ独自の規則を定めております)に適合した製品を製造しております。産業用配電制御システム製品の主なものは、ビル、工場、鉄道関連施設、工事設備で使用される配電制御システム等であります。
                      - paragraph [ref=e1075]: 機器製品の主なものは、電気系統において電路を過大電流から保護する低圧遮断器であり、主にビル、工場、船舶等において使用されます。当社では、JIS(日本産業規格)、IEC(国際電気標準会議)等主要な規格類及び前記の船級協会規則に対応した製品を開発し、製造販売しております。
                      - paragraph [ref=e1076]: 当社グループの主要な製品とその用途・特徴は下表のとおりであります。
                      - paragraph [ref=e1077]
