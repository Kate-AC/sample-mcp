                    - generic [ref=e1123]:
                      - heading "3【事業の内容】" [level=3] [ref=e1124]
                      - paragraph [ref=e1125]: 当社グループ(当社及び当社の関係会社)は提出日現在、当社及び子会社5社により構成されており、情報機器、照明機器、コンポーネント、その他製品の製造販売及び情報サービスを事業内容としております。
                      - paragraph [ref=e1126]: 情報機器事業
                      - paragraph [ref=e1127]: 一般道・高速道路情報表示システムをはじめ河川情報表示システム、トンネル防災システム、津波情報表示システム、LEDによるインフォメーションディスプレイ、LED式信号機、リチウムイオン電池式無停電電源装置等の製造・販売を通して、高度情報化時代のコミュニケーションツールとしてあらゆるシーンへの対応を積極的に展開しております。
                      - paragraph [ref=e1128]: 一般道・高速道路情報表示システム
                      - paragraph [ref=e1129]: 一般道、高速道路、高速道路の入口、トンネルの入口やトンネル内等で道路の混雑状況、工事等の予告・状況、天候による注意喚起等、ドライバーに必要な情報を必要な場所で提供できるよう設置された表示板です。主流のLED式は、必要な部分の光源を点滅させることにより、文字・記号・図形等を表示し、その内容に応じて表示する色もフルカラーで点灯させることが可能です。同様のシステムを用いた河川情報表示システム、トンネル防災システム、津波情報表示システム、LEDによるインフォメーションディスプレイも製造販売しております。
                      - paragraph [ref=e1130]: LED式信号機
                      - paragraph [ref=e1131]: 一般道に設置されている車両用と歩行者用の信号機で、光源がLEDタイプのものになります。電球式信号機に比べ、省電力、長寿命かつ、視認性も向上しています。
                      - paragraph [ref=e1132]: リチウムイオン電池式無停電電源装置
                      - paragraph [ref=e1133]: 屋外でも使用可能な全天候型UPSです。高エネルギー密度のリチウムイオン電池と省スペース型コントロールユニットの搭載により、従来の鉛蓄電池タイプと比べ、大幅な小型・軽量化を実現しております。「国土交通省屋外用無停電電源装置機器仕様書」にも準拠し、省スペース&長時間バックアップ、高い防塵防沫構造で、あらゆる屋内外電気設備の停電時トラブルを回避することができます。
                      - paragraph [ref=e1134]: 照明機器事業
                      - paragraph [ref=e1135]: プラントや石油精製所の爆発危険場所等、厳しい環境下で使用される産業用照明器具、一般道・高速道路の道路照明・トンネル照明、街路照明、景観照明等の道路・トンネル照明器具、最適な演色性を求められる用途に使用できる照明用LEDモジュール部品の開発・製造販売を行っております。
                      - paragraph [ref=e1136]: 産業用照明機器
                      - paragraph [ref=e1137]: 石油精製所をはじめ、石油化学、合成樹脂製造、ゴム、自動車、薬品、香料、インキ、ガス、マグネシウム、カーボン、チタン等の製造工場で爆発性ガスや爆発性粉塵の存在する環境の下で使用される防爆形(耐圧防爆、安全増防爆、粉塵防爆)の器具と、食品工業、冷蔵庫、各種倉庫、屋外ヤード等、腐食性のガスや湿度の高い環境の下で使用される耐食形、防水形の器具とそれらの複合製品があり、また電子部品工場や化学薬品工場、バイオ産業のクリーンルーム用照明器具も製造しております。現在では、LED光源が主流となり、防爆エリアで使用できる安全増防爆形LED灯器具や、通常時・非常時兼用の防爆形非常用LED照明器具のラインアップを取り揃え、産業用照明機器全シリーズで防爆エリアでのオールLED化の実現が可能となりました。また、産業用照明器具のみならず、より一層お客様のニーズにお応えするべく、高付加価値な多機能照明製品やシステム製品といった生産性向上、安全対策に貢献する製品の開発に取り組んでいます。
                      - paragraph [ref=e1138]: 海外向けには当社海外グループとの相乗効果を活かし、QCDにおいて世界に通用するワールドモデルの製品開発と生産、販売を促進してまいります。
                      - paragraph [ref=e1139]: 道路・トンネル照明機器
                      - paragraph [ref=e1140]: LED道路照明器具は、光源のLED化による特長を生かし、道路照明に求められる明るさを確保しながら、省エネ・長寿命・軽量コンパクト等を考慮した道路照明器具です。トンネル照明は、トンネル照明のパイオニアとして、光源のLED化に伴い日本初となる可視光通信の制御技術を用いたサイン照明やペースメーカーライトの納入や直流給電方式によるトンネルLED照明システムを開発し従来器具と比べて大幅に小型化・軽量化を実現する等、他社に先駆けて新しい技術に取り組んでおります。
                      - paragraph [ref=e1141]: UV-Cソリューション製品
                      - paragraph [ref=e1142]: 照明機器製品として紫外線を照射し、工場内の空気清浄および表面除菌を行うUV-Cソリューション製品の開発、販売を行っております。
                      - paragraph [ref=e1143]: 照明用LEDモジュール製品
                      - paragraph [ref=e1144]: 最適な演色性を求められる用途に照明用LEDモジュールを開発・提供し様々な顧客の要望を満たす光源モジュールを提供しております。鉄道車両用では、客室内照明用光源及び電源、特殊照明用では医療用高演色光源モジュール及び医療機器用表示灯モジュール、一般汎用品では、照明メーカー、制御盤メーカー向けとしてLED光源モジュールを各々販売しています。
                      - paragraph [ref=e1145]: コンポーネント事業
                      - paragraph [ref=e1146]: デジタル機器の普及に伴い増加している電磁ノイズの遮断あるいは発生を防ぐ電磁波環境対策部品、「カッチングダクト」等の配線保護機材、配管保護機材の製造販売を行っております。
                      - paragraph [ref=e1147]: 電磁波環境対策部品
                      - paragraph [ref=e1148]: ノイズ対策製品のラインアップとしてガスケット、フェライトコア等があります。ガスケットは、豊富なバリエーションを取り揃えるとともに加工性、作業性に優れ、シールディング/グランディング対策材としてあらゆるアプリケーションに対応可能となっております。フェライトコアは、低周波から高周波帯域までのノイズを対策できる製品をラインアップしており、形状もリングタイプ、分割タイプ、フラットタイプ等、顧客のニーズに合わせた様々なタイプをラインアップしております。また、2023年より当社コア製品(フィルタリング対策部材)のシミュレーション用モデルを当社WEBサイトからダウンロードできるサービスを提供しており、シミュレーション用モデルの活用により、設計段階のEMC対策を可能とし、設計の精度向上や対策工数・コスト削減に寄与しております。
                      - paragraph [ref=e1149]: 顧客のノイズ対策への要望に応えるため、大型の産業機器や医療機器、大電力・大出力のパワーエレクトロニクス機器や車載関連機器等の対応が可能な10m法電波暗室、各種エミッション試験およびイミュニティ試験が可能な3m法電波暗室ならびにシールドルームを配備したEMC Labを設置しております。EMC Lab1(10m法電波暗室)は、株式会社電磁環境試験所認定センターより国際標準規格の技術的能力事項およびマネージメントシステム要求事項を満たしている「ISO/IEC17025:2017試験所」として認定を受けております。10m法電波暗室ではEMC評価の周波数上限を業界最高レベルまで拡張することができ、次世代スマート社会の実現に向け、より充実した電磁両立性の性能評価とソリューションを提供しております。
                      - paragraph [ref=e1150]: また、さらなる製品信頼性の向上と事業拡大に向け、2025年に新設のシールドルーム「EMC Lab3」の稼働を開始いたしました。EMC Lab3はイミュニティ試験(電磁波耐性試験)に特化した施設で、従来の電波暗室(EMC Lab1・2)と合わせることで、成長著しいロボット産業や半導体製造装置分野における適用規格を大幅に拡大します。また、不要な電磁波を測る「エミッション試験」から、外来電磁波への耐性を測る「イミュニティ試験」まで、自社内での一貫した認証サービスを提供できる体制を整えました。当社だけでなくお客様にもご利用いただき、新製品や新サービスの開発過程におけるより充実した電磁両立性の性能評価及び対策支援などのソリューションを提供しております。
                      - paragraph [ref=e1151]: 配線保護機材・配管保護機材
                      - paragraph [ref=e1152]: 1963年に配電盤、制御盤の配線作業合理化と美観向上を目的として発売以来、現在この業界では当社の商品名「カッチングダクト」が一般名称として使用されております。配線作業に際し電線を引き出したい部分でダクトの側壁をカットして配線を引き出せる構造となっており、特に当社製品は、用途に応じて使用していただけるようシリーズを備えて顧客のニーズに応えております。
                      - paragraph [ref=e1153]: 当社及び当社の関係会社の事業における当社及び当社の関係会社の位置付け及びセグメントとの関連は、次のとおりであります。
                      - paragraph [ref=e1154]: なお、事業区分欄には、セグメントの名称を記載しております。
                      - paragraph [ref=e1155]: 当社グループの主要各社の位置付け等は次のとおりであります。
                      - table [ref=e1157]:
                        - rowgroup [ref=e1162]:
