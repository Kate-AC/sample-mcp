                      - heading "3 【事業の内容】" [level=3] [ref=e1045]
                      - paragraph [ref=e1046]: 当社グループは、当社、子会社22社、関連会社1社及びその他の関係会社1社により構成されており、ファクトリー・オートメーション(以下「FA」)とIoTの融合領域とも言うべきインテリジェントFAシステムビジネスを中心に、各社が同ビジネスの構成分野或いは隣接分野を分担しております。
                      - paragraph [ref=e1047]: 当社グループは、事業拡大のスピードアップ及びシナジー効果等による利益拡大を企業グループ経営方針の一つとしており、着実にグループ事業領域拡大・強化の成果を出してまいりました。特に日本の製造業の海外移転が急増することを先取りして、2001年から積極的な海外展開を図り、当連結会計年度末までに中国、タイ、マレーシア、カナダ、インド、ベトナム、インドネシア、フィリピンの8カ国に11の海外子会社を設立し、また、中国、マレーシア、インド、ベトナムでは現地での取引深耕のため複数の拠点を設立、これらの地域で半導体基板検査装置及びプロセスオートメーション、メカトロニクス等のインテリジェントFAシステムビジネスを広くカバーできる海外子会社ネットワークを作り上げました。
                      - paragraph [ref=e1048]: また、国内においても1999年に静岡市清水区の協和電工(株)(現・協和サンシンエンジニアリング(株))をM&Aで子会社化したのを手始めに当社の中核ビジネスの周辺領域を事業分野とする11社の子会社をM&A或いは新規設立によりグループ会社化し、インテリジェントFAシステムビジネスの強化を図ってまいりました。
                      - paragraph [ref=e1049]: 今後も国内では事業領域の拡大とインテリジェントFAシステムビジネスの強化を目的に、また海外では地理的及びビジネス分野でのカバー領域の拡大を目的として、グループの更なる拡大に尽力する所存であります。
                      - paragraph [ref=e1050]
