                      - heading "3【事業の内容】" [level=3] [ref=e1126]
                      - paragraph [ref=e1127]: 当社グループは、当社、子会社5社及び関連会社3社で構成しており、鉄道車両、建設機械、輸送用機器・鉄構、エンジニアリング、その他の製造・施工・販売及び付帯するサービスなどの事業活動を行っております。また、当社は親会社である東海旅客鉄道(株)の企業集団に属しております。
                      - paragraph [ref=e1128]: 各事業における主な事業内容と当社及び主要関係会社の位置付けは、概ね次のとおりであります。
                      - paragraph [ref=e1129]: (1)鉄道車両事業
                      - paragraph [ref=e1130]: 電車、気動車、ハイブリッド車、客車などを当社が製造・販売し、連結子会社(株)日車エンジニアリングが部品の製造及び役務提供等を行い、米国においては、連結子会社NIPPON SHARYO MANUFACTURING, LLCが既存顧客に対するサービス等を行っております。
                      - paragraph [ref=e1131]: (2)建設機械事業
                      - paragraph [ref=e1132]: 杭打機、全回転チュービング装置、アースドリル、障害撤去機などを当社が製造・販売し、連結子会社重車輛工業(株)及び持分法適用関連会社日泰サービス(株)が建設機械等の販売・修理などを行っております。
                      - paragraph [ref=e1133]: (3)輸送用機器・鉄構事業
                      - paragraph [ref=e1134]: タンクローリ、タンクトレーラ、タンクコンテナ、貯槽、大型陸上車両(キャリヤ)、無人搬送装置、貨車などの製造・販売、道路橋、鉄道橋などの新設橋梁の製造・架設及び既設橋梁の補修・保全を当社が行っております。
                      - paragraph [ref=e1135]: (4)エンジニアリング事業
                      - paragraph [ref=e1136]: 鉄道事業者向け機械設備、営農プラント、製紙関連設備などを当社が製造・販売しております。
                      - paragraph [ref=e1137]: (5)その他
                      - paragraph [ref=e1138]: 連結子会社(株)日車ビジネスアソシエイツが厚生業務などを請負っております。
                      - paragraph [ref=e1139]
                      - paragraph [ref=e1140]: 以上述べた事項を事業系統図によって示すと次のとおりであります。
