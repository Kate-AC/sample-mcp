                      - heading "3【事業の内容】" [level=3] [ref=e1120]
                      - paragraph [ref=e1121]: 当社の企業集団は、当社および子会社20社で構成され、自動車部品と産業機械車輌部品の国内販売および輸出入を主な事業内容としております。
                      - paragraph [ref=e1122]: なお、次の4部門は、「第5 経理の状況 1 連結財務諸表等 (1)連結財務諸表 注記事項」に掲げるセグメントの区分と同一であります。
                      - paragraph [ref=e1123]: (1)国内営業本部 国内自動車部品・用品メーカーが生産する部品・用品および欧米からの輸入部品を全国19拠点の事業所を通じて、全国に存在している地域部品卸商・カー用品ショップ等へ販売しております。
                      - paragraph [ref=e1124]: (2)海外営業本部 主に国内自動車部品メーカーが生産する部品を、現地の輸入商を通じて、世界80ヶ国余へ販売しております。子会社として海外現地法人8社を有し、販売情報の提供を受けております。また、海外現地法人による三国間貿易も徐々に拡大しております。
                      - paragraph [ref=e1125]: (3)工機営業本部 国内外のメーカーが生産する部品を建機・農機・フォークリフト等のメーカーへ、組付部品として販売しております。
                      - paragraph [ref=e1126]: (4)CUSPA営業本部 カスタマイズドパーツをメインに販売、カーメーカータイアップ事業、オリジナルブランド事業、二輪事業、e-Sports事業等をしております。
