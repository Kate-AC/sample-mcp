                      - paragraph [ref=e1103]
                      - paragraph [ref=e1104]: 当社グループは、当社、連結子会社5社、その他の関係会社1社で構成され、自動車関連卸売事業(含む高級アルミホイールの製造販売事業)を主たる事業とし、他に物流事業、自動車用品小売事業、高齢者向けの複合福祉事業及び賃貸事業を営んでおります。
                      - paragraph [ref=e1105]
                      - paragraph [ref=e1106]: 当社グループの事業に係わる位置付け及び事業部門との関連は、次のとおりであります。
                      - paragraph [ref=e1107]: 自動車関連卸売事業
                      - paragraph [ref=e1108]: 卸売事業.........当社及び(株)東京車輪は、自動車用ホイール、カーアクセサリーパーツ等、自動車部品のアフターパーツを一般市販市場に販売をしております。中央精機(株)はスチールホイールの製造を行っております。
                      - paragraph [ref=e1109]: 威直貿易(寧波)有限公司は、自動車ホイール部品等を主体に中国市場にて販売をしております。
                      - paragraph [ref=e1110]: (主な関係会社)当社、(株)スーパースター、(株)東京車輪、威直貿易(寧波)有限公司、中央精機(株)
                      - paragraph [ref=e1111]: 製造販売事業...(株)スーパースターは、当社及び一般市場向けに高級アルミホイールの製造販売をしております。
                      - paragraph [ref=e1112]: (主な関係会社)(株)スーパースター
                      - paragraph [ref=e1113]: 物流事業
                      - paragraph [ref=e1114]: 物流事業.........(株)ロジックスは、当社、中央精機(株)で扱っているホイールやその他のオリジナル商品の保管、荷役を行っております。また、一般市場向けに倉庫サービスの提供をしております。
                      - paragraph [ref=e1115]: (主な関係会社)(株)ロジックス
                      - paragraph [ref=e1116]: 自動車関連小売事業
                      - paragraph [ref=e1117]: 小売事業.........(株)バーデンは自動車用ホイール、カーアクセサリーパーツ等、自動車部品のアフターパーツを一般消費者に販売をしております。
                      - paragraph [ref=e1118]: (主な関係会社)(株)バーデン
