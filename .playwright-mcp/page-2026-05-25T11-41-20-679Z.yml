                    - generic [ref=e1204]:
                      - paragraph [ref=e1205]
                      - heading "3 【事業の内容】" [level=3] [ref=e1206]
                      - paragraph [ref=e1207]: 当社の企業集団は、当社および子会社15社で構成され、商社部門では金属接合、産業機械、FAシステム関連商品の販売、製造部門では肉盛溶接・溶射加工、ろう付加工、メンテナンス工事の施工、FAシステム関連製品を主な事業とし、子会社において物流業務、不動産管理・損害保険代理業および樹脂製品の製造・販売を行っております。
                      - paragraph [ref=e1208]: なお、報告セグメントとして日本には当社、株式会社進栄、株式会社アイシンおよび株式会社ダイシン、米州にはSHINWA U.S.A. CORPORATION、SHINWA REPRESENTAÇÃO COMERCIAL DO BRASIL LTDA.およびSHINWA ENGINEERING S.A. de C.V.、アジア・パシフィックにはSHINWA INTEC Co., Ltd.、PT.SANTAKU SHINWA INDONESIA、SHINWA INTEC MALAYSIA SDN. BHD.およびSHINWA(INDIA)ENGINEERING & TRADING PRIVATE LIMITED、中国には那欧雅進和(上海)貿易有限公司、煙台進和接合技術有限公司、煙台三拓進和撹拌設備維修有限公司および進和(天津)自動化控制設備有限公司、その他にはSHINWATEC LIMITEDを含んでおります。
                      - paragraph [ref=e1209]
                      - paragraph [ref=e1210]: 事業の系統図は、次のとおりであります。
                      - paragraph [ref=e1211]
                      - paragraph [ref=e1213]: （画像は省略されました）
                      - paragraph [ref=e1214]
                      - paragraph [ref=e1215]: (注) 1.株式会社進栄は、東郷物流センターの管理業務および東海地区における納品業務を行っております。
                      - paragraph [ref=e1216]: 2.株式会社アイシンは、当社所有の不動産管理および損害保険代理業を行っております。
                      - paragraph [ref=e1217]: 3.株式会社ダイシンは、主に国内の自動車部品メーカーに対し、自動車部品の樹脂製品の製造、販売をしております。
                      - paragraph [ref=e1218]: 4.SHINWA U.S.A. CORPORATION、SHINWA INTEC Co., Ltd.、PT. SANTAKU SHINWA INDONESIA、SHINWA(INDIA)ENGINEERING & TRADING PRIVATE LIMITED、 SHINWA INTEC MALAYSIA SDN. BHD.、那欧雅進和(上海)貿易有限公司、SHINWATEC LIMITED、SHINWA REPRESENTAÇÃO COMERCIAL DO BRASIL LTDA.およびSHINWA ENGINEERING S.A. de C.V.は販売会社で、当社はこれらに対し、金属接合機器・材料、産業機械、FAシステム等の販売をしております。
                      - paragraph [ref=e1219]: 5.煙台進和接合技術有限公司は、中国において熱交換器やろう付材料の生産および販売を行っております。当社は、同有限公司に対し主に熱交換器の部品やろう付材料などの原材料を販売しております。
                      - paragraph [ref=e1220]: 6.煙台三拓進和撹拌設備維修有限公司は、中国において日系ゴムメーカーや石油・化学メーカーなどの機械設備のオーバーホールをはじめとしたメンテナンス事業を行っております。
                      - paragraph [ref=e1221]: 7.進和(天津)自動化控制設備有限公司は、中国においてFAシステム機器の生産および販売と超精密塗布装置の販売を行っております。
                      - paragraph [ref=e1222]: 8.当連結会計年度より、非連結子会社であったSHINWA(INDIA)ENGINEERING & TRADING PRIVATE LIMITED(インド)について重要性が増したことに伴い、連結の範囲に含めております。 SHINWA(INDIA)ENGINEERING & TRADING PRIVATE LIMITED(インド)を連結の範囲に含めたことに伴い、報告セグメントの区分方法を見直しております。 従来のSHINWA INTEC Co., Ltd.(タイ)、PT.SANTAKU SHINWA INDONESIA(インドネシア)およびSHINWA INTEC MALAYSIA SDN. BHD.(マレーシア)の区分を「東南アジア」 から「アジア・パシフィック」へ名称変更し、SHINWA(INDIA)ENGINEERING & TRADING PRIVATE LIMITED(インド)を当期分より「アジア・パシフィック」に含めております。
