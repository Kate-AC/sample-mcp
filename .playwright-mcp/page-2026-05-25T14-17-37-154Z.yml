                      - heading "3【事業の内容】" [level=3] [ref=e1046]
                      - paragraph [ref=e1047]: 当社グループは、当社(白銅株式会社)と連結子会社の株式会社AQR、上海白銅精密材料有限公司、Hakudo(Thailand)Co., Ltd.、Hakudo USA Inc.、West Coast Aluminum & Stainless, LLCにより構成されており、金属製品およびプラスチック製品の加工ならびに販売を主たる業務としております。
                      - paragraph [ref=e1048]: 当社のセグメントは、所在地別に日本、北米、中国およびその他の地域の4つに分類しております。
                      - paragraph [ref=e1049]: 日本では、材料メーカーや同業他社から約5,500品目サイズの製品を仕入れ、それを標準在庫品として常時当社工場に在庫しております。その標準在庫品をご注文に応じて切断やフライス加工し、短納期でお客様にお届けしております。また、当社は標準在庫品の販売とは別に当社工場に在庫していない製品を材料メーカーや同業他社から直接お客様にお届けする特注品の販売を行っております。
                      - paragraph [ref=e1050]: 米国では、West Coast Alminum & Stainless,LLCが新規顧客開拓や新規事業の準備など、新たな海外事業の拡大に積極的に取り組んでおります。
                      - paragraph [ref=e1051]: 中国では、連結子会社の上海白銅精密材料有限公司が製品を当社および材料メーカー等から仕入れて上海の工場に在庫し、ご注文に応じて切断やフライス加工し、短納期で中国のお客様にお届けしております。また、同社の工場に在庫していない製品についても、当社および材料メーカー等から仕入れて直接お客様にお届けしております。
                      - paragraph [ref=e1052]: その他の地域のタイでは、連結子会社のHakudo(Thailand)Co., Ltd.が中国同様に製品を当社および材料メーカー等から仕入れてバンコクの外部倉庫に在庫し、現地企業に販売を行っております。
