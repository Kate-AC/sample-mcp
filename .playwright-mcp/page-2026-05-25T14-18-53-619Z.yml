                        - paragraph [ref=e1113]
                      - paragraph [ref=e1114]
                      - paragraph [ref=e1115]: (1) コーティング関連事業
                      - paragraph [ref=e1116]: 1 塗料・表面処理剤
                      - paragraph [ref=e1117]: a.当社グループの主力取扱商品である塗料は、その用途により「汎用塗料」と「工業用塗料」に大別されます。
                      - paragraph [ref=e1118]: 汎用塗料 :建築用塗料に代表される、塗料メーカーが市場分析し、自主的に企画、設計、開発、製造、販売する塗料です。
                      - paragraph [ref=e1119]: 工業用塗料:自動車用塗料に代表される、いわゆる生産ラインで連続的に量産される工業製品に使用される塗料であり、固有の条件に配慮して設計、開発した塗料です。
                      - paragraph [ref=e1120]: 当社グループは、製品ごとに、塗膜になるまでのプロセス即ち塗料の選定、塗装仕様、塗装工法、塗装環境等について、様々な顧客の課題解決に寄与する商品、サービスの提供を行っております。
                      - paragraph [ref=e1121]
                      - paragraph [ref=e1122]: b.技術センター
                      - paragraph [ref=e1123]: 神奈川事業所に技術センターを有し、塗料業界の中で最も高いレベルの品質が要求される自動車業界で培った塗膜形成技術を基盤として、塗料と塗装設備・機器・装置等とのトータルプランニング、提案をはじめ、新材料、新工法の開発等を行っております。
                      - paragraph [ref=e1124]: c.塗装請負
                      - paragraph [ref=e1125]: 塗装・塗膜に対するお客様の高度な生産要求に対し、塗装請負専門のグループ会社オー・エー・シー株式会社と共に、トータルなエンジニアリング機能を発揮し、QCD(品質・コスト・納期)の改善を実現致します。
                      - paragraph [ref=e1126]: d.塗料調色加工
                      - paragraph [ref=e1127]: 塗料の調色工場にて、少量・多品種・短納期の対応を実現することで、塗料メーカーの課題を解決すると共に、お客様の効率的な生産に寄与します。
                      - paragraph [ref=e1128]
                      - paragraph [ref=e1129]: 2 化成品・物資
                      - paragraph [ref=e1130]: 当社グループでは、塗料以外にも顧客の製品や生産現場における様々な課題解決に寄与する商品を提供しております。主な取扱商品につきましては、以下のとおりであります。
                      - paragraph [ref=e1131]: a.防音材:自動車ボディ及び自動車部品等に採用されております。
                      - paragraph [ref=e1132]: b.プラスチックシート:PCM鋼板(プレコートメタル鋼板の略称で、加工する前の鋼帯の状態で予め塗装された鋼板)、自動車ボディ、その他の保護資材として活用されております。
                      - paragraph [ref=e1133]: c.耐熱セラミック製品:自動車排気ガス浄化用触媒コンバータの保持材として採用されております。
                      - paragraph [ref=e1134]: d.接着剤:建材関連、自動車関連等で使用されております。
                      - paragraph [ref=e1135]: e.合成樹脂製品:マスキング材や建材関連で使用する発泡ウレタン等を取り扱っております。
                      - paragraph [ref=e1136]: f.その他:テープ類、インク、研磨剤等を取り扱っております。
                      - paragraph [ref=e1137]
                      - paragraph [ref=e1138]: 3 塗装・計測機器
                      - paragraph [ref=e1139]: 当社グループでは、塗料だけでなく、塗装機器及び塗装に関連する計測機器等の販売も行っております。塗装機器は、顧客の製品に使われる塗料、素材や生産現場、環境に合わせて、求められる最適な機器・装置の選定が必要となります。当社グループでは、長年にわたる塗料の販売を行うことに加えて、塗装技術に関するノウハウの蓄積も行っていることにより、顧客に対して適切な塗装・計測機器の提案が可能となっております。
                      - paragraph [ref=e1140]
                      - paragraph [ref=e1141]: 4 完成工事
                      - paragraph [ref=e1142]: 当社グループでは、塗料や機器の販売にとどまらず、顧客の塗装ラインに関連する工事の請負も行っております。塗装ラインにおける前処理から塗装、乾燥工程までの設備、機器、装置、搬送、制御の全て、または一部の設計・施工を請負います。また、グループ会社であるサンマルコ株式会社では、建物の内外装のリフォーム関連工事も行っております。塗り替え、防水工事から、ガラスフィルム、内装フィルム施工等の工事を請負います。
                      - paragraph [ref=e1143]
                      - paragraph [ref=e1144]: (2) エレクトロニクス関連事業
                      - paragraph [ref=e1145]: 1 ホールIC
                      - paragraph [ref=e1146]: ホールICは磁気センサーであり、磁界の変化や強さを検出し、被計測体の位置や回転等を検知するセンサーであります。その用途には車載向けと民生向けがありますが、車載向け用途では、変速制御やブレーキ制御、ステアリング制御、エンジン制御等に採用実績があります。
                      - paragraph [ref=e1147]: 当社はホールICの専業的な代理店として事業拡大を行い、品質、技術、グローバル物流、外観検査に至るまで最適な役割を担い、BCP(Business Continuity Plan)対応も踏まえ、国内外の複数拠点で在庫を保有し、災害等が発生しても安定して供給できる体制を整えております。
                      - paragraph [ref=e1148]
                      - paragraph [ref=e1149]: 2 ソフトウエア
                      - paragraph [ref=e1150]: 主にカーナビゲーション等の車載向けソフトウエアの販売をしております。
                      - paragraph [ref=e1151]
                      - paragraph [ref=e1152]: 3 LED照明製品
