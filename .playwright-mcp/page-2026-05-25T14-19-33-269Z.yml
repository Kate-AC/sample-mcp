                      - paragraph [ref=e925]: 当社の事業系統図は以下のとおりであります。
                      - paragraph [ref=e926]
                      - paragraph [ref=e928]: （画像は省略されました）
                      - paragraph [ref=e929]
                      - paragraph [ref=e930]: (当社の役割)
                      - paragraph [ref=e931]: 1 情報通信社会を支える
                      - paragraph [ref=e932]: 当社は、CATV及び情報通信ネットワークに使用される商品を供給することにより、情報通信社会を支える役割を担っております。屋外系の商品(ケーブル、鋼管柱、装柱金物等)や屋内系の商品(分配器、ケーブルモデム、LANケーブル等)等、数多くの商品を取り扱っております。
                      - paragraph [ref=e933]
                      - paragraph [ref=e935]: （画像は省略されました）
                      - paragraph [ref=e936]
                      - paragraph [ref=e937]
                      - paragraph [ref=e938]: 2 顧客ニーズと当社の売上構成
                      - paragraph [ref=e939]: 当社は、日常的な整備の保守メンテナンスのほか、ネットワークの高度化等の各種ニーズに対応する商品を提案・調達・供給しております。具体的には、日常的なニーズとして「設備が壊れた」「部品を交換したい」「機器を増設したい」といったものや、特需的なニーズとして「通信ネットワークの大容量化工事に必要な材料がほしい」「新しいサービスに対応できる機器を選定してほしい」といったものが挙げられます。これらに対応するため、当社の売上は、日常的な受注によるものと特需等の受注によるものに大別されます。
                      - paragraph [ref=e940]
                      - paragraph [ref=e941]: (事業の特徴)
                      - paragraph [ref=e942]: 1 独立系であること
                      - paragraph [ref=e943]: 当社は、取扱商品をCATV及び情報通信ネットワークにおいて使用される商品に特化した、専門商社です。
                      - paragraph [ref=e944]: 専門商社には、メーカー等の関連会社のように、仕入先及び販売先が特定の相手先に依存する企業もありますが、当社の場合、仕入先及び販売先は多岐に渡っており、取引先から一定の独立性を有していることが特徴として挙げられます。当事業年度末現在において、仕入先は約450社、販売先は約2,700社であります。
                      - paragraph [ref=e945]: こうした特徴を有していることから、事業環境の変化が激しいCATV及び情報通信分野において、業績の大きな変動を抑えられるとともに、柔軟な事業展開を可能としております。
                      - paragraph [ref=e946]
                      - paragraph [ref=e947]: 2 多岐に渡る取扱商品
                      - paragraph [ref=e948]: 当社は、仕入先が限定されていないことから、取扱商品は多岐に渡っております。当事業年度末現在において、取扱商品は約43,000点にのぼり、取引の約7割を仕入先からの直送取引(仕入先から顧客に直接商品が配送される取引)で対応しております。
                      - paragraph [ref=e949]: こうした特徴を有していることから、当社は、特定のメーカー等の仕入先の意向に左右されることなく、販売先のニーズに合致した最適な商品を、タイムリー且つスピーディーに提供出来ると考えております。
                      - paragraph [ref=e950]
                      - paragraph [ref=e951]: 3 コスト・リーダーシップを発揮できる商品の販売
                      - paragraph [ref=e952]: 当社では、汎用性の高い商品を自社企画商品として海外で製造委託し、これを仕入れすることでコモディティ化が進んだ商品でも一定の利益率を確保することが可能となっております。また、特定のメーカーの商品を大量ロットで仕入れすることが可能な体制を構築することで、一定の利益率を確保することが可能となっております。これらの商品は、仕入単価を下げることで他社国内流通商品と比較して価格優位性があることから、当社ではコスト・リーダーシップを発揮できる商品として位置付けし、利益率の維持・向上のために販売注力しております。
                      - paragraph [ref=e953]
                      - paragraph [ref=e954]: 4 自社物流網の整備
                      - paragraph [ref=e955]: 当社は、本社がある愛媛県松山市に3箇所、東京営業所内に1箇所の合計4箇所の物流センターと営業拠点に11箇所の倉庫を配置し、全国各地の顧客へ商品を流通させるための自社物流網を整備しております。メーカーから仕入れた商品を自社倉庫に在庫として保管することにより、顧客からの大量発注にも対応できるほか、本社だけでなく、全国に自社物流網を整備することで、配送費用の増加を抑制することを可能としております。
                      - paragraph [ref=e956]
