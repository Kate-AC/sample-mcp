                      - heading "3 【事業の内容】" [level=3] [ref=e815]
                      - paragraph [ref=e816]: 当社は、CATV及び情報通信業界へ、国内外の高度な技術情報及び高品質・低価格の商品を顧客に提供することを通じて、高度化するネットワーク社会の発展に貢献することを社是としております。
                      - paragraph [ref=e817]: 高度な通信インフラ構築の実現のため、当社は、CATV及び情報通信ネットワークにおいて使用される各種商品(ケーブル、材料、機器等)の仕入及び販売を主な事業としております。
                      - paragraph [ref=e818]: なお、当社はCATV関連市場向け及び情報通信関連市場向け販売事業の単一セグメントであるため、セグメントごとの記載を省略しております。
                      - paragraph [ref=e819]
                      - paragraph [ref=e820]: (ビジネスモデル)
                      - paragraph [ref=e821]: 当社は、全国主要都市に営業所(当事業年度末現在において13拠点)を配置し、顧客のネットワーク整備やシステム構築に際して、最先端技術の情報提供及びネットワーク構築に関する提案等を行い、電線・ケーブル製造業者、通信機械器具製造業者及び金属製品製造業者等の国内外のメーカー等から仕入れた各種商品を、通信工事施工業者、電気通信事業者、電力会社及び官公庁等の顧客に販売しております。
                      - paragraph [ref=e822]
                      - paragraph [ref=e823]: 当社が仕入れる商品は主にケーブル、材料、機器に分類され、販売先において屋内通信工事、屋外通信工事、電力工事等に使用されています。
