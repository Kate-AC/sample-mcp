                    - generic [ref=e1106]:
                      - heading "3【事業の内容】" [level=3] [ref=e1107]
                      - paragraph [ref=e1108]: 平山グループは、当社(株式会社平山ホールディングス)及び連結子会社12社及び非連結子会社3社により構成されており、インソーシング・派遣事業及び技術者派遣事業を主たる業務としております。
                      - paragraph [ref=e1109]: 平山グループの事業内容及び当社と関係会社の当該事業に係る位置付けは次のとおりであります。なお、非連結子会社については、記載を省略しております。
                      - paragraph [ref=e1110]: 以下に示す区分は「第5 経理の状況 1 連結財務諸表等 (1)連結財務諸表 注記事項」に掲げるセグメント区分と同一であります。
                      - paragraph [ref=e1111]: なお、当社は特定上場会社等であります。特定上場会社等に該当することにより、インサイダー取引規制の重要事実の軽微基準については連結ベースの数値に基づいて判断することとなります。
                      - paragraph [ref=e1112]
                      - paragraph [ref=e1113]: (1)インソーシング・派遣事業
                      - paragraph [ref=e1114]: 当事業では、医療機器・医薬品、輸送用機器、住宅設備機器、食品関連製品等を製造する顧客企業内の製造工程等において、製造請負(*1)・製造派遣(*2)及び小売請負の事業を行っております。特に主力である製造請負に関しては、平山グループに所属する現場改善コンサルタント(*3)と連携したサービスを生産性向上とコスト削減を目指し、提供しております。加えて、「製造請負優良適正事業者認定制度」(*4)による認定を取得し、当事業の健全性、透明性の確保に取り組むとともに、従業員のキャリア形成と安定雇用に取り組んでおります。
                      - paragraph [ref=e1115]: なお、当事業については、連結子会社の株式会社平山、FUNtoFUN株式会社が主に行っております。
                      - paragraph [ref=e1116]: "*1 製造請負"
                      - paragraph [ref=e1117]: 請負会社(平山グループ)が、発注者(メーカー)からの注文を受けて製造や加工等を行い、納品(納入)等を行った成果に対して報酬が支払われる契約を指しております。
                      - paragraph [ref=e1118]: "*2 製造派遣"
                      - paragraph [ref=e1119]: 派遣会社(平山グループ)と雇用関係にある労働者を、役務を受ける会社(発注者:メーカー)に派遣して、役務を提供するサービスを指しております。
                      - paragraph [ref=e1120]: "*3 現場改善コンサルタント"
                      - paragraph [ref=e1121]: 大手製造メーカー等の製造現場で改善活動に長年従事してきた経験者等で構成されており、顧客視点で問題点を改善し、技術、品質、コスト面で競争力の向上を図り、低コストの製造現場構築に努めております。
                      - paragraph [ref=e1122]: "*4 製造請負優良適正事業者認定制度"
                      - paragraph [ref=e1123]: 製造請負優良適正事業者認定制度とは、請負事業に関わる法令を遵守している請負事業者のうち、雇用改善の管理と請負体制の充実化を実現している事業者を、優良かつ適正な請負事業を行っている事業者として認定する制度であります。制度の目的は優良・適正な請負事業者を認定し、公表することによって、製造請負事業の適正化と雇用管理改善の推進、製造請負業界の市場競争の健全化を実現し、労働者の福祉の向上及び発注者(製造事業者)の製造業務の長期的な質的改善につなげることであります。
                      - paragraph [ref=e1124]: この認定制度は、厚生労働省委託事業「請負事業適正化・雇用管理改善推進事業」の委託費の交付により実施されております。当該事業は製造系人材サービス(請負・派遣・紹介等)を業とする事業者会員で構成される一般社団法人日本生産技能労務協会が受託し、学識者等による第三者機関「製造請負事業改善推進協議会」が運営を担当しております。
                      - paragraph [ref=e1125]
                      - paragraph [ref=e1126]: (2)技術者派遣事業
                      - paragraph [ref=e1127]: 当事業は、平山グループの従業員を取引先のエンジニアリング分野へ技術者として派遣することに特化した事業であります。宇宙航空・自動車・鉄道から、家電・精密機器まで、日本国内の幅広い分野のメーカーに対し、設計開発、評価・解析等の部門に平山グループ従業員の派遣を行っております。
                      - paragraph [ref=e1128]: なお、当事業については、連結子会社の株式会社トップエンジニアリングが主に行っております。
                      - paragraph [ref=e1129]
                      - paragraph [ref=e1130]: (3)海外事業
                      - paragraph [ref=e1131]: 当事業は、海外における製造派遣を主とした事業であります。日本国内同様に現場改善コンサルタントと連携したサービスを提供し、現場改善を行うことができる製造派遣会社として平山グループ従業員の派遣を行っております。
                      - paragraph [ref=e1132]: なお、当事業については、連結子会社のHIRAYAMA (THAILAND) Co.,Ltd.、JOB SUPPLY HUMAN RESOURCES Co.,Ltd.が行っております。
                      - paragraph [ref=e1133]
                      - paragraph [ref=e1134]: (4)その他事業
                      - paragraph [ref=e1135]: 当事業には、コンサルティング事業、教育事業、有料職業紹介事業、障害福祉サービス業、外国人等就労支援事業、機械・機具の製作・修理事業、自動車整備事業、介護事業等が含まれております。
                      - paragraph [ref=e1136]: その他事業の中で、主となっているのはコンサルティング事業であります。
                      - paragraph [ref=e1137]: 具体的には、製造業の上流である製品開発設計から生産、物流、サプライチェーンに至るまでの工程においてコスト削減、生産性向上、品質管理等の課題を、現場改善コンサルタントが取引先(顧客)と共に解決していくサービスであります。これは、平山グループの現場改善コンサルタントが、TPS(Toyota Production System:トヨタ生産方式)を取り入れ、作業実施部隊(顧客の現場改善担当者及び現場作業員)と連動して、実効性を追求したコンサルティングをメーカーに対し提供するものであります。また、海外の製造業の管理職に対しては、日本国内の製造現場見学と当社研修センターでの研修を合わせた「スタディツアー」(*)等を提供・運営しております。
                      - paragraph [ref=e1138]: "* スタディツアー"
                      - paragraph [ref=e1139]: 平山グループのサービスの一つで、海外の製造現場の管理者に対し、日本国内の工場見学や当社研修センターでの各種研修サービスをツアーとして提供するものであります。
                      - paragraph [ref=e1140]
                      - paragraph [ref=e1141]: "[事業系統図]"
                      - paragraph [ref=e1142]: 以上述べた事項を事業系統図によって示すと次のとおりであります。
                      - paragraph [ref=e1143]
