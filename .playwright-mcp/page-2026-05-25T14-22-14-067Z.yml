                    - generic [ref=e871]:
                      - paragraph [ref=e872]
                      - heading "3 【事業の内容】" [level=3] [ref=e873]
                      - paragraph [ref=e874]: 当社グループは、当社及び連結子会社5社で構成されており、化粧品、化粧雑貨、服飾雑貨、キャラクター雑貨(注)及びコンタクトレンズ関連等の商品を幅広く取扱っております。これらの商品を小売業者、卸売業者及び一般消費者等へ販売することを主たる業務としております。また、子会社であるSHO-BI Labo株式会社ではコンタクトレンズの受託製造を手掛けており、株式会社ピコモンテ・ジャパンでは化粧品の製造販売業を手掛けております。
                      - paragraph [ref=e875]: 当社は、70余年にわたり美に寄り添い続けてまいりました。その間、当社は「美のプロフェッショナル」として実績を重ね、経験と知見を蓄積してきました。問屋発祥のファブレスメーカーとして、マーケティングから企画、デザイン、開発、販売までを当社単独で「一気通貫」で行えるスピード感と、自社企画商品、別注商品、OEM商品等、幅広い取引形態に対応可能な柔軟性、また様々なカテゴリーの商品開発や数多くのブランドライセンスの使用など、顧客の要望に沿って様々な提案ができる高い対応力を強みとしています。
                      - paragraph [ref=e876]: 美容やファッションに敏感な消費者では、SNSを通じた情報発信や新しい商品への興味が高まり、当社の提供する商品が注目を集める機会も増えています。このような状況下で、当社はトレンドを捉えた商品開発や、マーケティング戦略の強化に努め、ブランド価値の向上を図ってまいりました。引き続き、お客様に寄り添いながら、ユーザーの美しさを引き出す商品を提供してまいります。
                      - paragraph [ref=e877]: なお、当社グループの事業は単一セグメントであるため、セグメント別の記載を省略しております。
                      - paragraph [ref=e878]: (注)キャラクター雑貨とは、ウォルト・ディズニー・ジャパン株式会社、株式会社サンリオ等の版権元からキャラクターの商品化許諾を受け商品化された化粧雑貨、服飾雑貨等の雑貨のことであり、当社グループは自社企画商品の付加価値を高め、他社製品との差別化を図る観点から、版権元からキャラクターの商品化許諾を受け、当社グループにてキャラクター雑貨の商品化を行っております。
                      - paragraph [ref=e879]
