                      - paragraph [ref=e1088]: セグメント別の概要は以下のとおりであります。
                      - paragraph [ref=e1089]: 1 ブランド事業
                      - paragraph [ref=e1090]: (株)エフ・ディ・シィ・プロダクツ及びその子会社が、主にジュエリーを中心とした商品群において、
                      - paragraph [ref=e1091]: 企画・製造・販売の一貫したブランドビジネスを展開しております。その主なブランドは「4°C」、
                      - paragraph [ref=e1092]: 「Canal 4°C」等であります。また、(株)羅針が、高級ブランド時計を専門に、確かな鑑定力による高い
                      - paragraph [ref=e1093]: 信頼性と豊富なラインナップを強みとしたリユース販売事業を展開しております。
                      - paragraph [ref=e1094]
                      - paragraph [ref=e1095]: 2 アパレル事業
                      - paragraph [ref=e1096]: (株)アスティ及びその子会社が、アパレルや雑貨を核に、中国やバングラデシュ、ベトナム等の海外生
                      - paragraph [ref=e1097]: 産背景を強みに企画提案力のあるメーカー機能やアパレル機能を有し、大手アパレル、専門店及びGM
                      - paragraph [ref=e1098]: Sを主たるマーケットに事業展開しております。また、(株)アージュが、婦人服、服飾雑貨及び実用衣料
                      - paragraph [ref=e1099]: 品を中心とするリテール事業を西日本を中心に展開しております。
