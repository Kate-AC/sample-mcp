                      - paragraph [ref=e1033]: 当社グループは、(株)4°Cホールディングス(当社)及び子会社8社で構成され、その主な事業内容は、「4°C」(ヨンドシー)ジュエリーを中心としたブランド事業、高級ブランド時計専門のリユース事業、ODMを中心としたアパレルメーカー事業、総合衣料品店「パレット」をチェーン展開するデイリーファッション事業であります。
                      - paragraph [ref=e1034]: さらに、各事業に関する物流及び付帯するサービス業務等を行っております。
                      - paragraph [ref=e1035]: なお、当期より新たな事業領域の拡大も視野に入れ、ジュエリー事業はセグメント名称を「ブランド事業」へと変更しており、(株)羅針はブランド事業に区分しております。
                      - paragraph [ref=e1036]: 当社は、有価証券の取引等の規制に関する内閣府令第49条第2項に規定する特定上場会社等に該当しており、これにより、インサイダー取引規制の重要事実の軽微基準については連結ベースの数値に基づいて判断することとなります。
