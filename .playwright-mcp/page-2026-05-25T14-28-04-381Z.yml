              - generic [ref=e1276]:
                - tabpanel [ref=e1277]:
                  - generic [ref=e1278]:
                    - generic [ref=e1279] [cursor=pointer]: 続きを読む
                    - generic [ref=e1280]:
                      - paragraph [ref=e1281]
                      - heading "3 【事業の内容】" [level=3] [ref=e1282]
                      - paragraph [ref=e1283]: 当社グループは、当社と子会社10社からなり、婦人服等の企画、製造、販売を行っており、セグメント別の事業内容及び当該事業に係わる各社の位置づけは次の通りであります。
                      - paragraph [ref=e1284]
                      - heading "(アパレル関連事業)" [level=3] [ref=e1285]
                      - paragraph [ref=e1286]: 「日本」におきましては、(株)ルックは、婦人服等の企画を行うとともに、国内外から商品の仕入を行っており、主として直営店舗や百貨店において販売しているほか、Eコマースによる販売や専門店への販売を行っております。
                      - paragraph [ref=e1287]: また、A.P.C.Japan(株)は、「A.P.C.」ブランドの紳士服、婦人服等を、フランスA.P.C. S.A.S.、(株)アイディールックから輸入、またはライセンス商品を(株)ルックモードや商社等を通して生産し、主として直営店舗や百貨店において販売を行っているほか、Eコマースによる販売や専門店への販売も行っております。
                      - paragraph [ref=e1288]: 「韓国」におきましては、(株)アイディールックは、独自企画または海外から仕入れた婦人服等を、主として韓国内の百貨店等において販売を行っているほか、Eコマースによる販売も行っております。
                      - paragraph [ref=e1289]: また、(株)アイディージョイは、独自企画または海外から仕入れた婦人服等を、主として韓国内の百貨店及びショッピングセンターなどの商業施設において販売を行っております。
                      - paragraph [ref=e1290]: 「欧州」におきましては、Il Bisonte S.p.A.は、独自企画のバッグや財布などの雑貨を中心にした皮革製品を自社及びイタリア国内の協力工場で生産し、イタリア国内外へ卸売販売を行うほか、Eコマースによる販売やイタリア国内の直営店舗において販売を行っております。Il Bisonte France S.a.r.l.は、Il Bisonte S.p.A.が生産した皮革製品をフランスの直営店舗において販売を行っております。
                      - paragraph [ref=e1291]: 「その他海外」におきましては、Il Bisonte USA Inc.( Il Bisonte S.p.A.の米国子会社)は、Il Bisonte S.p.A.が生産した皮革製品を米国の直営店舗で販売するほか、米国内への卸売販売を行っております 。
                      - paragraph [ref=e1292]
                      - heading "(生産及びOEM事業)" [level=4] [ref=e1293]
                      - paragraph [ref=e1294]: (株)ルックモードは、(株)ルック及びA.P.C.Japan(株)のアパレル関連商品の生産のほか、当社グループ外のアパレル関連商品のOEM生産を行っておりますが、そのうちの一部を(株)ラボ・オーフナトに加工委託しております。
                      - paragraph [ref=e1295]
                      - heading "(物流事業)" [level=4] [ref=e1296]
                      - paragraph [ref=e1297]: (株)エル・ロジスティクスは、主に国内子会社3社のアパレル関連商品の検査・物流業務を受託しております。
                      - paragraph [ref=e1298]
