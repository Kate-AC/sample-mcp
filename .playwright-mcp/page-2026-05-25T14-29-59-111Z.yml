                      - heading "3【事業の内容】" [level=3] [ref=e1124]
                      - paragraph [ref=e1125]: 当社グループは、当社、子会社9社、関連会社6社で構成され、電機、機械及び建材・燃料の販売と海運関連業務を主な事業としております。
                      - paragraph [ref=e1126]: 当社グループの事業内容と当社と関係会社の当該事業に係る位置付け及びセグメントとの関連は次のとおりであります。
                      - paragraph [ref=e1127]: なお、セグメントは「第5 経理の状況 1 連結財務諸表等 (1)連結財務諸表 注記事項 (セグメント情報等)」に揚げるセグメント区分と同一であります。
                      - paragraph [ref=e1128]
                      - paragraph [ref=e1129]: (1) 電機関連事業
                      - paragraph [ref=e1130]: 当社において配電制御機器、空調・冷凍・冷蔵設備、レーザ加工機、セラミックス等を販売するほか、連結子会社悠禧貿易(上海)有限公司が中国市場におけるFAシステム等の販売、非連結子会社NARASAKI VIETNAM CO.,LTD.がASEAN地域におけるFAシステム等の販売を行っております。
                      - paragraph [ref=e1131]: (2) 機械関連事業
                      - paragraph [ref=e1132]: 当社において農業施設、産業機械、環境設備ならびに関連する情報システム等を販売しております。
                      - paragraph [ref=e1133]: (3) 建設・エネルギー関連事業
                      - paragraph [ref=e1134]: 当社においてセメント、生コンクリート、建築資材、石油製品、道路切削舗装機械、コンクリートポンプ車等を販売しております。
                      - paragraph [ref=e1135]: 石油製品等の燃料の一部について連結子会社ナラサキ石油(株)経由により販売しております。ナラサキ石油(株)は船舶用燃料の給油業務も行っております。
                      - paragraph [ref=e1136]: 生コンクリート等の資材の一部については、非連結子会社富士総販(株)及び関連会社後志生コン販売(有)、興部生コン(株)経由による仕入、販売を行っております。
                      - paragraph [ref=e1137]: (4) 海運関連事業
                      - paragraph [ref=e1138]: 連結子会社ナラサキスタックス(株)において、海陸一貫輸送業務を中心に、港湾運送、道路運送、倉庫業、通関業等の事業を行っており、各業務の一部については、連結子会社九州マリン(株)、非連結子会社楢崎通運(株)ほか2社、関連会社ケイナラ(株)ほか3社が役務を提供しております。
