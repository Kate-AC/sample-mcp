                      - paragraph [ref=e1180]: 当社及び当社の関係会社(当社、子会社20社(内、連結子会社15社、持分法適用子会社2社)及び関連会社1社(持分法適用関連会社)により構成)が営んでいる主な事業内容と当該事業における位置付けは、次の通りであります。
                      - paragraph [ref=e1181]: なお、以下の区分は「第5 経理の状況 1 連結財務諸表等 (1)連結財務諸表 注記事項」に掲げるセグメントの区分と同一であります。
                      - paragraph [ref=e1182]
                      - paragraph [ref=e1183]: (1) 自動車運送
                      - paragraph [ref=e1184]: 提出会社(以下「神姫バス(株)」という)が乗合旅客運送と乗合旅客運送等の受託を、子会社である神姫ゾーンバス(株)、(株)ウイング神姫が乗合旅客運送を行っております。また、子会社である神姫トラストホープ(株)が自動車の運転・保守管理を、神姫タクシー(株)等が乗用旅客運送を、神姫逓送(株)が貨物運送を行っております。
                      - paragraph [ref=e1185]: (2) 車両物販・整備
                      - paragraph [ref=e1186]: 子会社である神姫産業(株)及び神姫商工(株)が行っており、神姫バス(株)等へ車両の部品・タイヤ販売、車両の修理等を行っております。
                      - paragraph [ref=e1187]: (3) 不動産
                      - paragraph [ref=e1188]: 神姫バス(株)が不動産の賃貸等を行っており、子会社である神姫バス不動産(株)が建築、不動産の売買、仲介、管理、車両等の清掃及び警備業を行っております。また、神姫バス(株)は神姫商工(株)、神姫観光(株)等へ施設の賃貸を行っております。
                      - paragraph [ref=e1189]: (4) レジャーサービス
                      - paragraph [ref=e1190]: 神姫バス(株)がツタヤFC事業、AWAJI EARTH MUSEUMの運営を、子会社である神姫フードサービス(株)等が高速道売店等における物販を含む飲食業を行っております。
                      - paragraph [ref=e1191]: (5) 旅行貸切
                      - paragraph [ref=e1192]: 神姫バス(株)、子会社である神姫観光(株)及び(株)神姫トラベルが旅行事業を行っております。また、神姫観光(株)は貸切旅客運送も行っております。
                      - paragraph [ref=e1193]: (6)その他
                      - paragraph [ref=e1194]: 1 経営受託
                      - paragraph [ref=e1195]: 神姫バス(株)及び神姫トラストホープ(株)が指定管理者として公共施設の管理・運営を行っております。
                      - paragraph [ref=e1196]: 2 物品販売、広告代理、Webサービス
                      - paragraph [ref=e1197]: 子会社である神姫Bizプロデュース(株)が物品販売、広告代理業、Webサービスの営業を行っております。
                      - paragraph [ref=e1198]: 3 保育
                      - paragraph [ref=e1199]: 神姫バス(株)及び子会社であるしんきエンジェルハート(株)が営業を行っております。
                      - paragraph [ref=e1200]: 4 介護事業
                      - paragraph [ref=e1201]: 子会社である(株)ケアサービス神姫が営業を行っております。
                      - paragraph [ref=e1202]: 5 農作物販売
                      - paragraph [ref=e1203]: 神姫バス(株)が小売・卸売を行っております。
                      - paragraph [ref=e1204]: 6 経営管理業
                      - paragraph [ref=e1205]: 子会社であるShinki International Co.,Ltd.がSBTI Co.,Ltd.及びThai cross Japan Tour Co.,Ltd.の経営管理業務等を行っております。
                      - paragraph [ref=e1206]: 7 旅行業
                      - paragraph [ref=e1207]: 子会社であるThai cross Japan Tour Co.,Ltd.が海外で営業を行っております。
                      - paragraph [ref=e1208]: 8 輸送関連サービス等
                      - paragraph [ref=e1209]: 子会社であるSBTI Co.,Ltd.等が営業を行っております。
