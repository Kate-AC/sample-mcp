                      - heading "3【事業の内容】" [level=3] [ref=e868]
                      - paragraph [ref=e869]: 当社グループは、当社、子会社17社及び関連会社4社で構成され、主に中央官庁、地方公共団体及び電力会社等の公益事業体各社を主要顧客とし国内外で営業展開しております。
                      - paragraph [ref=e870]: なお、当社グループは空間情報コンサルタント事業の単一セグメントであり、セグメント別の記載に代えて事業区分別に記載しております。各事業の主な商品・サービスは次のとおりであります。
                      - paragraph [ref=e871]: 社会インフラマネジメント事業では、道路、鉄道、その他公共施設等のインフラマネジメント、行政支援サービス、エネルギー関連ビジネス、土壌・地下水汚染対策、災害復興再生等を行っております。国土保全コンサルタント事業では、河川・砂防、森林・林業支援、環境保全、災害緊急時の計測調査解析等の各種コンサルティングを行っております。
                      - paragraph [ref=e872]: 当連結会計年度において、当社の連結子会社である株式会社テクノスは、株式会社エコロジーサイエンスを吸収合併し、株式会社エコノスに社名変更しております。これにより、株式会社エコロジーサイエンスを当連結会計年度より連結の範囲から除外しております。なお、本合併は当社の完全子会社同士の合併であるため、当社の連結業績へ与える影響は軽微です。
                      - paragraph [ref=e873]: また、2025年7月17日付で株式会社エフウォーターマネジメントの全株式を取得し、当連結会計年度末より同社を連結の範囲に含めております。なお、当連結会計年度末においては貸借対照表のみ連結をしております。
