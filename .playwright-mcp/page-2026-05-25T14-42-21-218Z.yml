                    - generic [ref=e1107]:
                      - heading "3 【事業の内容】" [level=3] [ref=e1108]
                      - paragraph [ref=e1109]: 当社グループ(当社及び当社の関係会社)は、当社、子会社3社で構成しており、エンタープライズソリューション、サービスソリューション、エンベデッドソリューション、デバイスソリューションの4セグメントに関係する事業を行っております。各事業における当社グループ各社の位置付け及びセグメントとの関連は、次のとおりであります。
                      - paragraph [ref=e1110]
                      - heading "<エンタープライズソリューション>" [level=4] [ref=e1111]
                      - paragraph [ref=e1112]: 当セグメントは、主にビジネスソリューション事業、金融・公共ソリューション事業、システム機器販売事業で構成しております。ビジネスソリューション事業では製造業、小売業、物流業などのお客様業務を支援するITソリューションを提供しております。金融・公共ソリューション事業では保険業、銀行業などの金融分野や官公庁、団体などの公共分野のお客様業務を支援するITソリューションを提供しております。システム機器販売事業では各ソリューション事業に伴い必要となるPC・サーバーなどの機器を納入しております。
                      - paragraph [ref=e1113]: 〔関係会社〕NSS(株)、恩斯達信息技術(北京)有限公司
                      - paragraph [ref=e1114]
                      - heading "<サービスソリューション>" [level=4] [ref=e1115]
                      - paragraph [ref=e1116]: 当セグメントは、主にデジタルソリューション事業、クラウド・インフラサービス事業で構成しております。デジタルソリューション事業ではIoT&AIサービスやWebサイト・EC構築などの業種共通ソリューションを提供しております。クラウド・インフラサービス事業では、パブリック・プライベートクラウドの環境構築サービスや自社データセンターによるハウジング・ホスティングサービス、お客様の情報システムの運用設計から構築、管理を行う総合的なマネジメントサービスなどを提供しております。
                      - paragraph [ref=e1117]: 〔関係会社〕NSS(株)、恩斯達信息技術(北京)有限公司
                      - paragraph [ref=e1118]
                      - paragraph [ref=e1119]
                      - paragraph [ref=e1120]: <エンベデッドソリューション>
                      - paragraph [ref=e1121]:
                        - text: 当セグメントは、主に組込み開発事業で構成しております。オートモーティブ、産業機器向けなどのアプリケーションやミドルウエア、ドライバ開発を行っており、製品の多様化や効率化、高品質設計によるスマート化に向けた各種ソリューションを提供しております。
                        - text: 〔関係会社〕NSS(株)、恩斯達信息技術(北京)有限公司
                      - paragraph [ref=e1122]
                      - heading "<デバイスソリューション>" [level=4] [ref=e1123]
                      - paragraph [ref=e1124]:
                        - text: 当セグメントは、主にデバイス開発事業で構成しております。画像処理や通信関連などのLSIの設計やボード設計を行っており、高位設計、論理設計・検証、論理合成、レイアウト設計、製造からテストまで、要件に応じたソリューションを提供しております。
                        - text: 〔関係会社〕NSS(株)、恩斯達信息技術(北京)有限公司
