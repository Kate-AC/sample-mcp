                      - paragraph [ref=e1068]: 当社グループは、当社、連結子会社8社及び関連会社3社で構成され、重仮設事業では建設用重量仮設鋼材(鋼矢板、H形鋼、鋼製山留材、路面覆工板、鉄板等の建設機材)の賃貸、販売、修理、加工等を主な内容とし、重仮設等工事事業では建設用重量仮設鋼材の杭打抜・山留架設工事、地中連続壁工事及び場所打ち杭工法を中心とした基礎工事、障害物撤去工事等を、土木・上下水道施設工事等事業では土木・上下水道施設工事、建築設備工事及び工場プラント工事の事業活動を行っております。これらの事業を展開し、建設業界のニーズに素早く応え、社会資本整備の一端を担っております。
