                      - heading "3【事業の内容】" [level=3] [ref=e1175]
                      - paragraph [ref=e1176]: 当社グループは、当社及び関係会社18社(連結子会社16社及び関連会社2社)により構成されており、宅配水及び次亜塩素酸水溶液の製造・販売、ダストコントロール商品・介護用品及び福祉用具・害虫駆除器のレンタル・販売、定期清掃業務及び原状回復工事、地場工務店に対する建築関連ノウハウ商品及び建築部資材の販売と施工、コンサルティング業務並びに住宅フランチャイズ事業、戸建注文住宅の建築請負及び分譲住宅の販売、化粧品、健康食品の製造・販売、美容材料・医薬品等の販売及び洋酒の輸入・販売を主な事業内容としております。
                      - paragraph [ref=e1177]: 当社グループの事業内容及び当社と関係会社の当該事業に係る位置付けは次のとおりであります。なお、次の5事業は、「第5 経理の状況 1 連結財務諸表等 (1)連結財務諸表 注記事項」に掲げるセグメント情報の区分と同一であります。
                      - paragraph [ref=e1178]: (1)クリクラ事業
                      - paragraph [ref=e1179]: 宅配水「クリクラ」、浄水型ウォーターサーバー「feel free(フィールフリー)」及び次亜塩素酸水溶液「ZiACO(ジアコ)」の製造・販売を全国展開しております。
                      - paragraph [ref=e1180]: (2)レンタル事業
                      - paragraph [ref=e1181]: 関東圏、北海道、福岡県、愛知県及び関西圏においてダストコントロール商品・介護用品及び福祉用具のレンタル・販売、定期清掃業務、原状回復工事を行っております。また、全国において害虫駆除器等のレンタル・販売を行っております。
                      - paragraph [ref=e1182]: (3)建築コンサルティング事業
                      - paragraph [ref=e1183]: 全国の地場工務店に対する建築関連ノウハウ商品及び建築部資材の販売と施工、コンサルティング業務並びに住宅フランチャイズ事業を行っております。
                      - paragraph [ref=e1184]: (4)住宅事業
                      - paragraph [ref=e1185]: 戸建注文住宅の建築請負、分譲住宅の販売及びそれに付随する金融業務を行っております。
                      - paragraph [ref=e1186]: (5)美容・健康事業
                      - paragraph [ref=e1187]: 化粧品、健康食品及び美容材料、医薬品等の製造・販売及び洋酒の輸入・販売を行っております。
                      - paragraph [ref=e1188]
                      - paragraph [ref=e1189]: 以上述べた事項を事業系統図によって示すと次のとおりであります。
                      - paragraph [ref=e1190]: 当社及び連結子会社16社について記載しております。
                      - paragraph [ref=e1191]
                      - paragraph [ref=e1192]: （画像は省略されました）
                      - paragraph
                      - paragraph [ref=e1193]: (注)1. 2025年4月1日を効力発生日として、株式会社JIMOSを吸収合併存続会社とし、株式会社アップセールを吸収合併消滅会社とする吸収合併を行うことにいたしました。
                      - paragraph [ref=e1194]: 2. 巴ワイン・アンド・スピリッツ株式会社は、2024年9月2日にTOMOEワインアンドスピリッツ株式会社に社名変更しております。
