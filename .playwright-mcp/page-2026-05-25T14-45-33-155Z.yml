                      - paragraph [ref=e1038]: 当社グループ(当社及び当社の関係会社)は、当社(株式会社マキヤ)、子会社6社及びその他の関係会社1社により構成されております。当社は、主要事業である総合ディスカウント店「エスポット」、食品スーパー「ポテト」・「マミー」、業務用食料品販売店「業務スーパー」、リユースショップ「ハードオフ」、インテリアショップ「エ・コモード」及び100円均一ショップ「ダイソー」等の運営を行う「小売業」、所有不動産等の賃貸事業等を行う「不動産賃貸事業」及びインターネットモール等において商品を販売する「EC事業」を展開しております。
