                      - heading "3 【事業の内容】" [level=3] [ref=e1089]
                      - paragraph [ref=e1090]: 当社グループは当社及び連結子会社5社で構成されており、その主な事業内容はアパレル・テキスタイル関連製品の企画・製造・販売であり、その他に、不動産賃貸事業、マテリアル事業を展開しています。
                      - paragraph [ref=e1091]: 当社グループの事業に係わる位置付け及びセグメントとの関連は、次のとおりであります。なお、以下に示す区分は、セグメントと同一の区分であります。
                      - paragraph [ref=e1092]: また、当連結会計年度より、報告セグメントの区分を変更しております。詳細は、「第5 経理の状況 1 連結財務諸表等 (1)連結財務諸表 注記事項(セグメント情報等)」をご参照ください。
                      - paragraph [ref=e1093]
                      - paragraph [ref=e1094]: アパレル・テキスタイル関連事業 ...... 当社はレディス及びベビー・キッズ向けを主体とする衣料品と毛織物を主体とするテキスタイル(生地)の企画・製造・販売を主要業務としております。
                      - paragraph [ref=e1095]: 海外の連結子会社のうちタキヒヨー(上海)貿易有限公司は、現地における当社向け商品の生産管理、納期管理、品質管理及び本社への輸出業務のサポートを主体に業務を行っております。
                      - paragraph [ref=e1096]:
                        - text: 瀧兵香港有限公司は、清算手続き中であります。
                        - text: 国内の連結子会社のうちティー・エフ・シー株式会社は、パターン・サンプルの製造、カットソーを主体とする縫製、ユニフォームの企画・販売を行っております。
                        - text: 株式会社タキヒヨー・オペレーション・プラザは、主に海外で生産された商品をお客さまの店舗毎に仕分け、梱包し、出荷するデリバリー関連業務を担っております。
                      - paragraph [ref=e1097]: 賃貸事業 ....................................... 当社は不動産の賃貸、管理及びそれらに関連する事業活動を行っております。ティー・ティー・シー株式会社は、主に当社グループ企業に対しての機器リース及び不動産の賃貸管理を行っております。
                      - paragraph [ref=e1098]: マテリアル事業 .............................. 当社は、合成樹脂、化成品等の販売を行っております。
                      - paragraph [ref=e1099]: その他 .......................................... 当社は、フランチャイジーとして「コメダ珈琲店」の運営等を行っております。当社と株式会社タキヒヨー・オペレーション・プラザは、他社の物流業務の受託を行っております。
                      - paragraph [ref=e1100]
                      - paragraph [ref=e1101]
