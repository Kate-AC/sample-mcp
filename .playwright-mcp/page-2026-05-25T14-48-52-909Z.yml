                      - paragraph [ref=e1018]: (酒販事業)
                      - paragraph [ref=e1019]: 株式会社やまや(以下、「当社」という。)、やまや関西株式会社及びやまや東日本株式会社の店舗部門・通信販売において酒類及び食料品等の小売を行っております。
                      - paragraph [ref=e1020]: やまや商流株式会社は、製造業者及び卸売業者より酒類及び食料品等を仕入し、当社、チムニー株式会社及び株式会社つぼ八への卸売を行うとともに、当社グループ外への卸売及び小売を行っております。
